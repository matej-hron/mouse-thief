<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #120a06; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }

</style>

<body>
<canvas id="screen"></canvas>
<script src="common.js"></script>
<script>
'use strict';
/* ==========================================================================
   PIXEL MINER: dig down, get rich (part of the PIXEL ARCADE).
   Drive the digger, drill left, right and down, fly up with the thruster.
   Ores fill the cargo bay; sell them at the BASE on the surface, refuel,
   repair, and buy upgrades (drill, hull, fuel tank, cargo bay, engine, lights,
   cooling) and items (dynamite, repair kit, fuel can, teleporter).
   The mine is yours and stays dug: 1000 m through 7 layers to the CORE.
   Watch the fuel and the hull: run dry or break down and the cargo is lost.
   GOALS (one after the other), depth records, 11 lost ARTIFACTS (each one makes
   every ore worth 5% more), a daily gift, and after the core a NEW MINE.
     1. Setup   2. The world   3. The digger   4. Drawing   5. The base   6. Screens   7. Sound   8. Input   9. Main loop
   ========================================================================== */

/* --- 1. SETUP --------------------------------------------------------------- */
const VERSION = '1.0.0';
const SAVE_KEY = 'pixelMiner.save';
const profile = PX.Profile.get();
const MY_COLOR = PX.AVATAR_COLORS[profile.avatar.color];
const canvas = document.getElementById('screen');
const S = PX.makeScreen(canvas, { H: 240, minW: 400, maxW: 560 });
const ctx = S.ctx, H = S.H;
const UI = PX.makeUI(S, canvas);
const T = (str, x, y, color = '#fff', size = 1, align = 'left', shadow = null) => PX.drawText(ctx, str, x, y, color, size, align, shadow);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const hash = (a, b = 0, c = 0) => { let h = (a * 374761393 + b * 668265263 + c * 2147483647) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
const money = n => '$' + Math.floor(n).toLocaleString('en-US');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };

const TS = 16;                  // a tile, in pixels (1 tile = 1 m)
const COLS = 34;                // the mine is 32 tiles wide (plus a bedrock wall on each side)
const TOP = 6;                  // rows of sky; the ground starts at row TOP
const DEPTH = 1000;             // the core
const ROWS = TOP + DEPTH + 4;
const BASE_C0 = 2, BASE_C1 = 9; // the base stands on these columns
const GRAV = 520;

const LAYERS = [
  { name: 'TOPSOIL', d: 0, hard: 1, pal: ['#8a5a32', '#7a4c2a', '#9a6a3a', '#6a4024'], back: '#3a2414' },
  { name: 'CLAY', d: 60, hard: 1.5, pal: ['#b0683a', '#9a5830', '#c07848', '#86492a'], back: '#40200f' },
  { name: 'STONE', d: 160, hard: 2.3, pal: ['#7a7a80', '#6a6a70', '#8a8a90', '#5a5a60'], back: '#26262c' },
  { name: 'DEEP ROCK', d: 300, hard: 3.8, pal: ['#4a5070', '#40465e', '#565c80', '#363a50'], back: '#16182a' },
  { name: 'CRYSTAL CAVES', d: 450, hard: 5.8, pal: ['#5a3a7a', '#4a2e66', '#6a4a8a', '#3a2256'], back: '#180e28' },
  { name: 'LAVA DEPTHS', d: 620, hard: 8.5, pal: ['#5a2a20', '#4a2018', '#6a3428', '#3a160e'], back: '#200806' },
  { name: 'THE CORE', d: 820, hard: 12, pal: ['#7a4a10', '#6a3a0a', '#8a5a1a', '#5a3008'], back: '#2a1404' },
];
const ORES = [
  { id: 'coal', name: 'COAL', v: 8, min: 0, max: 260, col: '#26262c', hi: '#5a5a66' },
  { id: 'copper', name: 'COPPER', v: 20, min: 4, max: 360, col: '#d8742a', hi: '#ffb070' },
  { id: 'iron', name: 'IRON', v: 45, min: 45, max: 460, col: '#c0aca0', hi: '#f6eee6' },
  { id: 'silver', name: 'SILVER', v: 90, min: 120, max: 560, col: '#b8cce0', hi: '#ffffff' },
  { id: 'gold', name: 'GOLD', v: 180, min: 200, max: 700, col: '#ffc81e', hi: '#fff6a0' },
  { id: 'ruby', name: 'RUBY', v: 350, min: 300, max: 820, col: '#e01e4a', hi: '#ff9ab0' },
  { id: 'emerald', name: 'EMERALD', v: 600, min: 400, max: 920, col: '#1ec864', hi: '#a0ffc8' },
  { id: 'diamond', name: 'DIAMOND', v: 1100, min: 500, max: 1000, col: '#7af0ff', hi: '#ffffff' },
  { id: 'mythril', name: 'MYTHRIL', v: 2000, min: 640, max: 1000, col: '#9a6aff', hi: '#e8deff' },
  { id: 'star', name: 'STARSTONE', v: 4000, min: 790, max: 1000, col: '#ff5ac8', hi: '#fff0ff' },
];
const ARTS = ['OLD BOOT', 'FOSSIL FISH', 'ROMAN COIN', 'VIKING HELMET', 'DINO SKULL', 'GOLDEN MASK', 'LOST ROBOT', 'METEORITE', 'CRYSTAL SKULL', 'DRAGON EGG', 'ALIEN DEVICE'];
const ART_DEPTH = i => 55 + i * 85;

// upgrades: 7 levels each (level 1 is what you start with); price of the next level
const UPG = [
  { id: 'drill', name: 'DRILL', what: 'DIGS FASTER. LEVEL 4 BREAKS GRANITE', vals: [1, 1.6, 2.5, 3.8, 5.5, 8, 11], base: 150, unit: v => 'X' + v },
  { id: 'hull', name: 'HULL', what: 'TAKES MORE HITS', vals: [30, 50, 80, 120, 170, 240, 320], base: 120, unit: v => v + ' HP' },
  { id: 'fuel', name: 'FUEL TANK', what: 'DIG LONGER', vals: [12, 20, 30, 45, 65, 90, 125], base: 100, unit: v => v + ' L' },
  { id: 'cargo', name: 'CARGO BAY', what: 'CARRIES MORE ORE', vals: [8, 12, 18, 26, 36, 50, 70], base: 130, unit: v => v + ' SLOTS' },
  { id: 'engine', name: 'ENGINE', what: 'DRIVES AND FLIES FASTER', vals: [1, 1.15, 1.3, 1.45, 1.6, 1.8, 2], base: 140, unit: v => 'X' + v },
  { id: 'light', name: 'LIGHTS', what: 'SEE FURTHER IN THE DARK', vals: [3, 4, 5, 6, 7, 8.5, 10], base: 90, unit: v => v + ' M' },
  { id: 'cool', name: 'COOLING', what: 'LESS HARM FROM LAVA AND HEAT', vals: [0, 0.25, 0.45, 0.6, 0.72, 0.82, 0.9], base: 400, unit: v => Math.round(v * 100) + '%' },
];
const upCost = (u, lvl) => Math.round(u.base * Math.pow(3, lvl - 2) / 10) * 10;   // lvl = the level you buy (2..7)
const ITEMS = [
  { id: 'dyn', name: 'DYNAMITE', key: '1', price: 200, what: 'BLOWS UP THE ROCK AROUND YOU (EVEN GRANITE)' },
  { id: 'kit', name: 'REPAIR KIT', key: '2', price: 250, what: 'FIXES HALF THE HULL' },
  { id: 'can', name: 'FUEL CAN', key: '3', price: 150, what: 'FILLS HALF THE TANK' },
  { id: 'tele', name: 'TELEPORTER', key: '4', price: 600, what: 'BACK TO THE BASE, WITH THE CARGO' },
];
const MAX_ITEMS = 5;
// GOALS: one after the other. [kind, target, text, cash]; ★1 each
const GOALS = [
  ['depth', 10, 'DIG DOWN TO 10 M', 50], ['sold', 8, 'SELL 8 ORES', 60], ['upg', 1, 'BUY AN UPGRADE', 100],
  ['depth', 30, 'DIG DOWN TO 30 M', 120], ['earned', 600, 'EARN $600 IN ALL', 150], ['ore:copper', 12, 'SELL 12 COPPER', 150],
  ['depth', 60, 'REACH THE CLAY (60 M)', 250], ['art', 1, 'FIND AN ARTIFACT', 300], ['upg', 4, 'BUY 4 UPGRADES', 300],
  ['item', 1, 'USE AN ITEM', 200], ['ore:iron', 10, 'SELL 10 IRON', 400], ['depth', 120, 'DIG DOWN TO 120 M', 600],
  ['earned', 6000, 'EARN $6,000 IN ALL', 800], ['upg', 8, 'BUY 8 UPGRADES', 800], ['ore:silver', 10, 'SELL 10 SILVER', 1000],
  ['depth', 200, 'REACH THE STONE (200 M)', 1500], ['art', 3, 'FIND 3 ARTIFACTS', 1500], ['ore:gold', 10, 'SELL 10 GOLD', 2500],
  ['earned', 40000, 'EARN $40,000 IN ALL', 3000], ['depth', 320, 'REACH THE DEEP ROCK (320 M)', 4000], ['upg', 15, 'BUY 15 UPGRADES', 4000],
  ['ore:ruby', 10, 'SELL 10 RUBIES', 6000], ['depth', 460, 'REACH THE CRYSTAL CAVES', 8000], ['art', 6, 'FIND 6 ARTIFACTS', 8000],
  ['ore:emerald', 10, 'SELL 10 EMERALDS', 10000], ['earned', 300000, 'EARN $300,000 IN ALL', 15000], ['depth', 630, 'REACH THE LAVA DEPTHS', 20000],
  ['ore:diamond', 10, 'SELL 10 DIAMONDS', 25000], ['upg', 30, 'BUY 30 UPGRADES', 30000], ['depth', 830, 'REACH THE CORE LAYER', 40000],
  ['art', 11, 'FIND ALL 11 ARTIFACTS', 50000], ['ore:star', 5, 'SELL 5 STARSTONES', 60000], ['depth', 1000, 'TOUCH THE HEART OF THE EARTH', 100000],
];

const NEW_SAVE = () => ({ cash: 0, up: { drill: 1, hull: 1, fuel: 1, cargo: 1, engine: 1, light: 1, cool: 1 }, items: { dyn: 1, kit: 0, can: 0, tele: 0 },
  maxDepth: 0, earned: 0, sold: {}, soldN: 0, upN: 0, itemN: 0, goal: 0, arts: [], miles: 0, prestige: 0, seed: 1, dug: '', pod: null, daily: '', core: 0, playT: 0 });
let save = NEW_SAVE();
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s) save = Object.assign(NEW_SAVE(), s, { up: Object.assign(NEW_SAVE().up, s.up), items: Object.assign(NEW_SAVE().items, s.items) }); } catch (e) { /* new miner */ }
let sfxOn = true; try { sfxOn = localStorage.getItem('pixelMiner.sfx') !== '0'; } catch (e) { /* private mode */ }
const up = id => UPG.find(u => u.id === id).vals[save.up[id] - 1];
const priceOf = o => Math.round(ORES[o].v * (1 + 0.05 * save.arts.length) * (1 + 0.5 * save.prestige));

/* --- 2. THE WORLD: built from the seed; what you dug is kept -------------------------------- */
// tile kinds
const AIR = 0, SOIL = 1, GRANITE = 2, LAVA = 3, GAS = 4, ORE = 5, CHEST = 6, ART = 7, BEDROCK = 8, CONCRETE = 9, CORE = 10;
const K = new Uint8Array(COLS * ROWS), O = new Uint8Array(COLS * ROWS), LY = new Uint8Array(COLS * ROWS);
let dug = new Uint8Array(Math.ceil(COLS * ROWS / 8));
const idx = (c, r) => r * COLS + c;
function vnoise(x, y, s, seed) {                 // value noise, 0..1
  const fx = x / s, fy = y / s, x0 = Math.floor(fx), y0 = Math.floor(fy), tx = fx - x0, ty = fy - y0;
  const a = hash(x0, y0, seed), b = hash(x0 + 1, y0, seed), c = hash(x0, y0 + 1, seed), d = hash(x0 + 1, y0 + 1, seed);
  const sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
  return (a * (1 - sx) + b * sx) * (1 - sy) + (c * (1 - sx) + d * sx) * sy;
}
function layerOf(d, c) {                          // a jagged border between layers
  let k = 0; for (let i = 0; i < LAYERS.length; i++) if (d >= LAYERS[i].d + Math.floor(hash(c, i, 7) * 6) - 3) k = i;
  return k;
}
function pickOre(d, h) {
  let tot = 0; const w = [];
  ORES.forEach((o, i) => {
    if (d < o.min || d > o.max) { w.push(0); return; }
    const mid = o.min + (o.max - o.min) * 0.35, span = (o.max - o.min) * 0.5, x = (d - mid) / span;
    const v = Math.exp(-x * x) / (1 + i * 0.12) * (d < o.min + 15 ? 0.35 : 1); w.push(v); tot += v;
  });
  let r = h * tot; for (let i = 0; i < w.length; i++) { r -= w[i]; if (r <= 0 && w[i] > 0) return i; }
  return 0;
}
function buildWorld() {
  const sd = save.seed * 101;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const i = idx(c, r), d = r - TOP, h = hash(c, r, sd);
    O[i] = 0; LY[i] = d < 0 ? 0 : layerOf(d, c);
    if (r < TOP) { K[i] = AIR; continue; }
    if (c === 0 || c === COLS - 1 || d > DEPTH) { K[i] = BEDROCK; continue; }
    if (d === DEPTH) { K[i] = CORE; continue; }
    if (d === 0 && c >= BASE_C0 && c <= BASE_C1) { K[i] = CONCRETE; continue; }
    let k = SOIL;
    const cave = d > 14 && vnoise(c, r, 5, sd + 1) > 0.76 - Math.min(0.08, d / 6000);
    if (cave) k = d > 600 && hash(c, r, sd + 2) < 0.4 ? LAVA : AIR;
    else if (d > 28 && vnoise(c, r, 3.5, sd + 3) > 0.85 - Math.min(0.07, d / 7000)) k = GRANITE;
    else if (d > 55 && h < 0.012) k = GAS;
    else if (d > 18 && h > 0.9975) k = CHEST;
    else if (hash(c, r, sd + 4) < 0.075 + Math.min(0.05, d / 12000) + (d < 6 ? -0.03 : 0)) { k = ORE; O[i] = pickOre(d, hash(c, r, sd + 5)); }
    if (d === 1 && k !== SOIL && k !== ORE) k = SOIL;
    K[i] = k;
  }
  for (let a = 0; a < ARTS.length; a++) {        // the artifacts: one in a little cave at each depth
    const r = TOP + ART_DEPTH(a), c = 3 + Math.floor(hash(a, 9, sd) * (COLS - 6));
    for (let dc = -1; dc <= 1; dc++) for (let dr = -1; dr <= 0; dr++) K[idx(c + dc, r + dr)] = AIR;
    K[idx(c, r + 1)] = ART; O[idx(c, r + 1)] = a;
    K[idx(c - 1, r + 1)] = SOIL; K[idx(c + 1, r + 1)] = SOIL;
  }
  for (let i = 0; i < K.length; i++) if (dug[i >> 3] & (1 << (i & 7))) K[i] = K[i] === LAVA ? LAVA : AIR;
}
function dig(c, r) { const i = idx(c, r); K[i] = AIR; dug[i >> 3] |= 1 << (i & 7); }
const kind = (c, r) => (c < 0 || c >= COLS || r >= ROWS ? BEDROCK : r < 0 ? AIR : K[idx(c, r)]);
const solid = k => k !== AIR && k !== LAVA;
function encodeDug() { let s = ''; for (let i = 0; i < dug.length; i += 4096) s += String.fromCharCode.apply(null, dug.subarray(i, i + 4096)); return btoa(s); }
function decodeDug(b) { const d = new Uint8Array(Math.ceil(COLS * ROWS / 8)); if (!b) return d; try { const s = atob(b); for (let i = 0; i < s.length && i < d.length; i++) d[i] = s.charCodeAt(i); } catch (e) { /* broken save: a fresh mine */ } return d; }
dug = decodeDug(save.dug);
buildWorld();

/* --- 3. THE DIGGER ------------------------------------------------------------------ */
const PW = 13, PH = 12;              // its size (it fits in one tile)
const pod = { x: 0, y: 0, vx: 0, vy: 0, fuel: 0, hull: 0, cargo: [], ground: false, dig: null, face: 1, flyT: 0, hurtT: 0, rot: 0 };
function home() { pod.x = (BASE_C1 + 2.5) * TS; pod.y = (TOP - 1) * TS + TS - PH / 2 - 0.5; pod.vx = 0; pod.vy = 0; pod.dig = null; }
function loadPod() {
  const p = save.pod;
  if (p && isFinite(p.x) && isFinite(p.y)) { Object.assign(pod, { x: p.x, y: p.y, fuel: p.fuel, hull: p.hull, cargo: p.cargo || [] }); if (overlaps(pod.x, pod.y)) home(); }
  else { home(); pod.fuel = up('fuel'); pod.hull = up('hull'); pod.cargo = []; }
}
function store() {
  save.dug = encodeDug(); save.pod = { x: Math.round(pod.x), y: Math.round(pod.y), fuel: pod.fuel, hull: pod.hull, cargo: pod.cargo };
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* private mode or full */ }
}
const depthOf = y => Math.max(0, Math.floor(y / TS) - TOP + 1);
const tileC = x => Math.floor(x / TS), tileR = y => Math.floor(y / TS);
function overlaps(x, y) {
  const c0 = tileC(x - PW / 2 + 0.01), c1 = tileC(x + PW / 2 - 0.01), r0 = tileR(y - PH / 2 + 0.01), r1 = tileR(y + PH / 2 - 0.01);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (solid(kind(c, r))) return true;
  return false;
}
function hardness(c, r) {
  const k = kind(c, r), L = LAYERS[LY[idx(c, r)]].hard;
  if (k === BEDROCK || k === CONCRETE) return Infinity;
  if (k === GRANITE) return save.up.drill >= 4 ? L * 2.5 : Infinity;
  if (k === CORE) return 10;
  return L;
}
let game = null;     // the trip: popups, particles, messages
function newGame() { game = { parts: [], pops: [], toast: null, shake: 0, event: null, digSnd: 0, thrSnd: 0, warnT: 0, saveT: 0, cam: { x: pod.x - S.W / 2, y: pod.y - H * 0.45 } }; }
function pop(txt, col, x = pod.x, y = pod.y - 14) { game.pops.push({ x, y, txt, col, t: 0 }); }
function toast(txt, col = '#fff', t = 2) { game.toast = { txt, col, t }; }
function burst(x, y, n, cols, sp = 90, life = 0.6) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, v = sp * (0.3 + Math.random()); game.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, t: 0, life: life * (0.5 + Math.random() * 0.7), col: cols[i % cols.length] }); } }
function startDig(c, r, dir) {
  const hd = hardness(c, r);
  if (hd === Infinity) {
    if (!game.hardT || game.hardT < 0) { toast(kind(c, r) === GRANITE ? 'GRANITE! DRILL LEVEL 4 OR DYNAMITE' : 'TOO HARD', '#ff8a6a', 1.5); sfx('bonk'); game.hardT = 1.2; }
    return;
  }
  const dur = 0.07 + 0.2 * hd / up('drill');
  pod.dig = { c, r, t: 0, dur, sx: pod.x, sy: pod.y, dir };
  pod.vx = 0; pod.vy = 0;
}
function finishDig() {
  const { c, r } = pod.dig, k = kind(c, r), o = O[idx(c, r)], L = LAYERS[LY[idx(c, r)]];
  pod.dig = null; pod.x = c * TS + TS / 2; pod.y = r * TS + TS - PH / 2 - 0.5;
  burst(pod.x, pod.y, 8, L.pal, 70, 0.5);
  if (k === GAS) { dig(c, r); explode(c, r, 25, true); return; }
  dig(c, r);
  if (k === ORE) {
    if (pod.cargo.length < up('cargo')) { pod.cargo.push(o); pop('+' + ORES[o].name, ORES[o].hi); sfx('ore', o); }
    else { pop('CARGO FULL!', '#ff6a5a'); sfx('bonk'); }
  } else if (k === CHEST) {
    const v = Math.round((60 + depthOf(pod.y) * 6) * (1 + save.prestige * 0.5));
    save.cash += v; save.earned += v; pop('CHEST! +' + money(v), '#ffd23f'); burst(pod.x, pod.y, 16, ['#ffd23f', '#fff6a0'], 120, 0.8); sfx('chest');
  } else if (k === ART) {
    if (!save.arts.includes(o)) { save.arts.push(o); game.event = { kind: 'art', a: o, t: 0 }; PX.Wallet.add(1); sfx('art'); store(); }
    else { const v = 500 * (o + 1); save.cash += v; save.earned += v; pop('+' + money(v), '#ffd23f'); }
  } else if (k === CORE) {
    if (!save.core) { save.core = 1; PX.Wallet.add(10); game.event = { kind: 'core', t: 0 }; sfx('art'); store(); }
  }
}
function explode(c, r, dmg, gas) {             // gas pocket or dynamite: the rock around goes (ores in it are lost)
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    const k = kind(c + dc, r + dr);
    if (k !== BEDROCK && k !== CONCRETE && k !== CORE && k !== AIR && k !== LAVA && k !== ART) { if (k === GAS && (dc || dr)) setTimeout(() => game && explode(c + dc, r + dr, 15, true), 150); dig(c + dc, r + dr); }
  }
  const x = c * TS + TS / 2, y = r * TS + TS / 2;
  burst(x, y, 30, gas ? ['#9be36b', '#ffd23f', '#ff8a2a', '#fff'] : ['#ffd23f', '#ff8a2a', '#ff4a2a', '#fff'], 160, 0.8);
  game.shake = 8; sfx('boom');
  if (dmg && Math.hypot(pod.x - x, pod.y - y) < TS * 2.2) hurt(dmg, gas ? 'GAS POCKET!' : null);
}
function hurt(n, why) { n *= 1; pod.hull -= n; pod.hurtT = 0.4; if (why) pop(why + ' -' + Math.round(n), '#ff6a5a'); sfx('hurt'); if (pod.hull <= 0) lose('broke'); }
function lose(why) {
  if (game.event) return;
  const lost = pod.cargo.length;
  burst(pod.x, pod.y, 30, [MY_COLOR, '#ffd23f', '#555', '#fff'], 150, 1);
  game.event = { kind: why, lost, t: 0 };
  pod.cargo = []; sfx(why === 'broke' ? 'boom' : 'empty');
}
function rescue() {                              // back to the base: fuel and hull filled, the cargo is gone
  home(); pod.fuel = up('fuel'); pod.hull = up('hull'); game.event = null; game.cam.y = pod.y - H * 0.45; store();
}
function atBase() { return pod.y < TOP * TS && pod.x > BASE_C0 * TS - 8 && pod.x < (BASE_C1 + 1) * TS + 8; }
function useItem(id) {
  if (!game || game.event || state !== 'play' || paused || save.items[id] <= 0) { if (game && save.items[id] <= 0) { toast('NO ' + ITEMS.find(i => i.id === id).name + ' LEFT: BUY MORE AT THE BASE', '#ff8a6a'); sfx('bonk'); } return; }

function service(auto) {
  const needF = up('fuel') - pod.fuel, needH = up('hull') - pod.hull;
  const cf = Math.ceil(needF * 2), ch = Math.ceil(needH * 3);
  sale = sale || { lines: {}, total: 0 };
  if (needF > 0.01) { const pay = Math.min(save.cash, cf); pod.fuel += pay / 2; save.cash -= pay; sale.fuel = pay; }
  if (needH > 0.01) { const pay = Math.min(save.cash, ch); pod.hull += pay / 3; save.cash -= pay; sale.hull = pay; }
  pod.fuel = Math.min(up('fuel'), pod.fuel); pod.hull = Math.min(up('hull'), pod.hull);

}
function goalProgress(gl) {
  const [k, n] = gl;
  if (k === 'depth') return save.maxDepth;
  if (k === 'sold') return save.soldN;
  if (k === 'upg') return save.upN;
  if (k === 'earned') return save.earned;
  if (k === 'art') return save.arts.length;
  if (k === 'item') return save.itemN;
  if (k.startsWith('ore:')) return save.sold[k.slice(4)] || 0;
  return 0;
}
function goalText(gl) { const p = Math.min(gl[1], goalProgress(gl)); return gl[0] === 'earned' ? '(' + money(p) + ')' : '(' + Math.floor(p) + '/' + gl[1] + ')'; }

}

/* --- 7. SOUND --------------------------------------------------------------------- */
function sfx(k, n = 0) {
  if (!sfxOn) return;
  const s = PX.Sound;
  if (k === 'click') s.tone([523, 784], 0.1, { vol: 0.1 });
  else if (k === 'dig') s.noise(0.07, { freq: 300 + Math.random() * 300, vol: 0.09 });
  else if (k === 'thrust') s.noise(0.08, { freq: 500, vol: 0.04, filter: 'bandpass' });
  else if (k === 'ore') s.tone([660 + n * 70, 990 + n * 110], 0.12, { vol: 0.09 });
  else if (k === 'chest') [784, 988, 1175, 1568].forEach((f, i) => s.tone(f, 0.1, { vol: 0.08, delay: i * 0.06 }));
  else if (k === 'art') [523, 659, 784, 1047, 1319].forEach((f, i) => s.tone(f, 0.18, { vol: 0.09, delay: i * 0.09, type: 'triangle' }));
  else if (k === 'cash') [1047, 1319, 1568].forEach((f, i) => s.tone(f, 0.09, { vol: 0.08, delay: i * 0.05 }));
  else if (k === 'upgrade') s.tone([440, 880, 1320], 0.25, { vol: 0.09 });
  else if (k === 'fix') s.tone([600, 900], 0.15, { vol: 0.08, type: 'triangle' });
  else if (k === 'boom') { s.noise(0.5, { freq: 300, vol: 0.3 }); s.tone([150, 40], 0.4, { vol: 0.12, type: 'sawtooth' }); }
  else if (k === 'hurt') s.tone([300, 150], 0.12, { vol: 0.09, type: 'sawtooth' });
  else if (k === 'bonk') s.tone([200, 160], 0.1, { vol: 0.08 });
  else if (k === 'warn') { s.tone(880, 0.08, { vol: 0.07 }); s.tone(880, 0.08, { vol: 0.07, delay: 0.15 }); }
  else if (k === 'empty') s.tone([400, 100], 0.6, { vol: 0.1, type: 'triangle' });
  else if (k === 'tele') s.tone([300, 1600], 0.3, { vol: 0.08, type: 'sine' });
  else if (k === 'record' || k === 'goal') [659, 784, 1047].forEach((f, i) => s.tone(f, 0.14, { vol: 0.09, delay: i * 0.08 }));
}

/* --- 8. INPUT ------------------------------------------------------------------- */
const held = new Set(), touches = new Map();
const KEYMAP = { ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r', ArrowUp: 'u', KeyW: 'u', Space: 'u', ArrowDown: 'd', KeyS: 'd' };
function syncInp() {
  for (const k in inp) inp[k] = false;
  for (const c of held) if (KEYMAP[c]) inp[KEYMAP[c]] = true;
  for (const k of touches.values()) if (k) inp[k] = true;
}
function ctrlAt(x, y) { const C = ctrl(); for (const k in C) { const [bx, by, w, h] = C[k]; if (x >= bx - 4 && x < bx + w + 4 && y >= by - 4 && y < by + h + 4) return k; } return null; }
UI.onDown = (e, x, y) => {
  PX.Sound.unlock();
  if (e.pointerType !== 'mouse') touchUsed = true;
  if (state !== 'play' || paused || game.event || UI.downId !== null) return;
  if (touchUsed) { touches.set(e.pointerId, ctrlAt(x, y)); syncInp(); }
};
UI.onMove = (e, x, y) => { if (touches.has(e.pointerId)) { touches.set(e.pointerId, ctrlAt(x, y)); syncInp(); } };
UI.onUp = e => { if (touches.delete(e.pointerId)) syncInp(); };
window.addEventListener('keydown', e => {
  PX.Sound.unlock();
  if (state === 'play' && !paused) {
    if (KEYMAP[e.code]) { e.preventDefault(); held.add(e.code); syncInp(); return; }
    const it = ITEMS.find(i => 'Digit' + i.key === e.code); if (it) { useItem(it.id); return; }
    if ((e.code === 'KeyE' || e.code === 'Enter') && atBase() && !game.event) { openBase(); return; }
  }
  if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'play' && !game.event) setPause(!paused);
  else if (e.code === 'Escape' || (e.code === 'KeyE' && state === 'base')) UI.back = true;
});
window.addEventListener('keyup', e => { if (held.delete(e.code)) syncInp(); });
window.addEventListener('blur', () => setPause(true));
document.addEventListener('visibilitychange', () => { if (document.hidden) { setPause(true); if (state !== 'title') store(); } });
window.addEventListener('pagehide', () => { if (state !== 'title') store(); });

/* --- 9. MAIN LOOP ----------------------------------------------------------------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000), t = now / 1000; last = now;
  UI.begin();
  if (!game) { loadPod(); newGame(); }
  if (state === 'title') { updateCam(dt); drawWorld(t); drawTitle(t); }
  else {
    if (state === 'play' && !paused) { const n = Math.ceil(dt / 0.01); for (let i = 0; i < n; i++) update(dt / n); }
    updateCam(dt);
    drawWorld(t);
    if (state === 'play') { drawHUD(t); if (game.event) drawEvent(t); if (paused) drawPause(); }
    else if (state === 'base') drawBaseMenu(t);
  }
  UI.end();
  S.blit('#120a06');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => { /* offline mode unavailable */ }));
}
PX.Pad.setup({
  title: 'Pixel Miner: controller', ui: UI, menu: () => state !== 'play' || paused || (game && !!game.event),
  phone: { stick: 'DRIVE / DIG', dpad: true, buttons: [['A', 'FLY'], ['B', 'BASE'], ['X', 'DYNAMITE'], ['Y', 'REPAIR'], ['LB', 'FUEL CAN'], ['RB', 'TELEPORT']] },
  keys: () => ({ left: 'ArrowLeft', right: 'ArrowRight', down: 'ArrowDown', up: 'ArrowUp', A: 'ArrowUp', B: 'KeyE', X: 'Digit1', Y: 'Digit2', LB: 'Digit3', RB: 'Digit4', START: 'KeyP' }),
  help: [['STICK|D-PAD', 'DRIVE, DIG LEFT, RIGHT AND DOWN'], ['A|UP', 'FLY UP'], ['B', 'OPEN THE BASE (ON THE SURFACE)'], ['X', 'DYNAMITE'], ['Y', 'REPAIR KIT'], ['LB', 'FUEL CAN'], ['RB', 'TELEPORTER'], ['START', 'PAUSE']],
});
</script>
