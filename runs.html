<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Pixel Runs: parkour over the rooftops. Jump, slide, wall-run, ride zip lines and bounce through five city districts. Missions, combos, upgrades and runners to unlock.">
<meta name="theme-color" content="#0d0b13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Pixel Runs</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0b13; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #screen { position: fixed; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<script src="common.js"></script>
<script>
'use strict';
/* ==========================================================================
   PIXEL RUNS: parkour over the rooftops (part of the PIXEL ARCADE).
   You run by yourself; you JUMP (hold for a higher jump) and SLIDE (in the air:
   dive). Jump at a wall and you run up it. Zip lines carry you over the wide
   streets, trampolines throw you high. Moves done one after another build a
   COMBO. The city changes every 500 m: sunset, neon night, snow, storm, dawn.
   To keep you running: 3 MISSIONS at a time (done ones pay coins and raise
   your RANK), coins buy UPGRADES and RUNNERS, power-ups on the roofs.
     1. Setup   2. Districts, shop, missions   3. Building the city
     4. The run   5. Drawing   6. Screens   7. Input and the main loop
   ========================================================================== */

/* --- 1. SETUP --------------------------------------------------------------- */
const VERSION = '1.3.0';
const SAVE_KEY = 'pixelRuns.save';
const save = { coins: 0, best: 0, bestScore: 0, runs: 0, tut: false, up: { dj: 0, power: 0, shield: 0, magnet: 0 }, skins: [true], skin: 0,
               missions: [], tiers: {}, done: 0, sfx: true };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY)) || {}); } catch (e) { /* new player */ }
const store = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* private mode */ } };
const profile = PX.Profile.get();

const canvas = document.getElementById('screen');
const S = PX.makeScreen(canvas, { H: 240, minW: 400, maxW: 560 });
const ctx = S.ctx, H = S.H;
const UI = PX.makeUI(S, canvas);
const T = (str, x, y, color = '#fff', size = 1, align = 'left', shadow = null) => PX.drawText(ctx, str, x, y, color, size, align, shadow);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
function disc(cx, cy, r, c) {
  ctx.fillStyle = c; cx = Math.round(cx); cy = Math.round(cy);
  for (let dy = -r; dy <= r; dy++) { const w = Math.round(Math.sqrt(r * r - dy * dy + r * 0.8)); ctx.fillRect(cx - w, cy + dy, w * 2 + 1, 1); }
}
const hex = c => { const n = parseInt(c.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const mix = (a, b, k) => { const A = hex(a), B = hex(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(',') + ')'; };

const PPM = 10;                 // pixels in a metre
const GX = 92;                  // where your runner is on the screen
const GRAV = 820, JUMP = 268, JUMP2 = 236, HOLD = 0.55;   // hold the jump button: gravity is this much weaker while you rise
const BIG = 1.5;                  // how big your runner is drawn
const TALL = 32, LOW = 15;      // how tall it is standing, and sliding
const WALL_REACH = 56;          // jump at a wall: this far below its top you still run up it
const COMBO_T = 2;              // seconds to do the next move, or the combo is over
const DISTRICT = 500;           // metres in one district

/* --- 2. DISTRICTS, SHOP, MISSIONS ---------------------------------------------------- */
const THEMES = [
  { name: 'SUNSET CITY', sky: ['#2a1a4a', '#5a2a6a', '#a8487a', '#e8785a', '#f8b860'], far: '#7a4a80', mid: '#4a305e', body: '#1c1428', edge: '#3e2c50', win: '#ffb850', off: '#281c38', sun: '#fff0c8', sunY: 96 },
  { name: 'NEON NIGHT', sky: ['#05060f', '#0a0f24', '#101a3a', '#1a2450', '#243060'], far: '#1c2a54', mid: '#121a38', body: '#0a0d1c', edge: '#2a3a6a', win: '#3af0ff', off: '#101630', sun: '#e8f0ff', sunY: 44, stars: true },
  { name: 'SNOW TOWN', sky: ['#7aa8d8', '#9cc0e4', '#bcd8ee', '#dcebf6', '#f4f8fc'], far: '#a8c0d8', mid: '#7a98b8', body: '#46567a', edge: '#f4f8fc', win: '#ffe890', off: '#34446a', sun: '#ffffff', sunY: 60, snow: true },
  { name: 'STORM FRONT', sky: ['#161c24', '#262e38', '#36404a', '#46525c', '#56646e'], far: '#3a454f', mid: '#2a333c', body: '#14181e', edge: '#3a454f', win: '#f0d870', off: '#1c222a', sun: '#8a98a4', sunY: 50, rain: true },
  { name: 'DAWN HARBOR', sky: ['#3a5a9a', '#6a8ac8', '#f0a8a0', '#ffd0a0', '#fff0c8'], far: '#8a8ab8', mid: '#5c5c8c', body: '#2a2a48', edge: '#5a5a8a', win: '#fff0a0', off: '#34345a', sun: '#fff8e0', sunY: 110 },
];
const UPGRADES = [
  { id: 'dj', name: 'DOUBLE JUMP', text: 'JUMP AGAIN IN THE AIR', cost: [400] },
  { id: 'power', name: 'POWER TIME', text: 'POWER-UPS LAST LONGER', cost: [150, 400, 900] },
  { id: 'shield', name: 'HEAD START', text: 'START EVERY RUN WITH A SHIELD', cost: [600] },
  { id: 'magnet', name: 'LONG ARMS', text: 'PICK COINS UP FROM FURTHER', cost: [120, 350, 800] },
];
const SKINS = [
  { name: 'RED HOODIE', c: '#e8402a', c2: '#22222e', trail: '#ff9a7a', price: 0 },
  { name: 'SKY BLUE', c: '#3a8ae8', c2: '#22222e', trail: '#9ad0ff', price: 150 },
  { name: 'JUNGLE', c: '#3fae4a', c2: '#3a2a1a', trail: '#b8f0a0', price: 300 },
  { name: 'NIGHT NINJA', c: '#22222e', c2: '#0d0b13', trail: '#e8203a', price: 600 },
  { name: 'NEON', c: '#ff3ad0', c2: '#1a1a3a', trail: '#3af0ff', price: 1000 },
  { name: 'GOLD', c: '#ffd23f', c2: '#8a6a10', trail: '#fff0a0', price: 2500 },
  { name: 'ALL WHITE', c: '#f4f4f8', c2: '#d0d0dc', trail: '#ffffff', price: 0, white: true },   // white from head to toe (your avatar's head, in white)
];
const WHITE = SKINS.length - 1;
const RANKS = ['ROOKIE', 'RUNNER', 'JUMPER', 'TRACER', 'FREERUNNER', 'ROOF MASTER', 'CITY LEGEND'];
// kind 'run': the best you do in one run; 'total': it adds up over all your runs
const MISSIONS = {
  dist: { kind: 'run', n: [300, 500, 800, 1200, 1600, 2200, 3000], text: n => 'RUN ' + n + ' M IN ONE RUN' },
  coins: { kind: 'run', n: [30, 50, 80, 120, 160, 220], text: n => 'GET ' + n + ' COINS IN ONE RUN' },
  slide: { kind: 'total', n: [6, 15, 30, 50, 80], text: n => 'SLIDE UNDER ' + n + ' SIGNS' },
  wall: { kind: 'total', n: [4, 10, 20, 40, 70], text: n => 'RUN UP ' + n + ' WALLS' },
  combo: { kind: 'run', n: [3, 4, 5, 6, 8], text: n => 'MAKE A X' + n + ' COMBO' },
  zip: { kind: 'total', n: [2, 5, 10, 20], text: n => 'RIDE ' + n + ' ZIP LINES' },
  tramp: { kind: 'total', n: [2, 6, 12, 25], text: n => 'BOUNCE ' + n + ' TIMES' },
  score: { kind: 'run', n: [600, 1200, 2000, 3200, 5000, 8000], text: n => 'SCORE ' + n + ' IN ONE RUN' },
  stomp: { kind: 'total', n: [3, 8, 16, 30], text: n => 'STOMP ' + n + ' BOXES' },
};
const rankOf = () => Math.min(RANKS.length - 1, Math.floor(save.done / 3));
function newMission() {
  const used = save.missions.map(m => m.type), types = Object.keys(MISSIONS).filter(t => !used.includes(t) && (save.runs > 1 || !['zip', 'tramp', 'stomp'].includes(t)));
  const type = pick(types), def = MISSIONS[type], tier = Math.min(def.n.length - 1, save.tiers[type] | 0);
  return { type, n: def.n[tier], prog: 0, pay: 40 + tier * 25 };
}
function fillMissions() { while (save.missions.length < 3) save.missions.push(newMission()); }
fillMissions();
if (!save.white) { save.white = true; save.skins[WHITE] = true; save.skin = WHITE; }   // everyone gets the white runner, and starts in it
store();
function progress(type, v, set) {              // a mission moves on (set: 'the best so far', else add)
  if (!G || G.demo) return;
  for (const m of save.missions) if (m.type === type && !m.done) {
    m.prog = set ? Math.max(m.prog, v) : m.prog + v;
    if (m.prog >= m.n) { m.prog = m.n; m.done = true; G.missionsDone.push(m); toast('MISSION DONE!  +$' + m.pay); sfx('mission'); }
  }
}

/* --- 3. BUILDING THE CITY --------------------------------------------------------------- */
// a building: x, w, y (its roof on the screen), obs (things on the roof), zip (a line from its end), theme
let state = 'title';            // title | shop | play | over
let paused = false, fade = 1;
let G = null;
function speedAt(dist) { return 118 + 112 * Math.min(1, dist / 3200); }
function addBuilding(script) {
  const B = G.blds, prev = B[B.length - 1], v = speedAt(G.gen / PPM), hard = Math.min(1, G.gen / PPM / 2500);
  const b = { obs: [], deco: [], theme: Math.floor(G.gen / PPM / DISTRICT) % THEMES.length, seed: Math.floor(Math.random() * 997), style: Math.floor(Math.random() * 3) };
  { const r = Math.random(); b.kind = script ? 'tower' : r < 0.34 ? 'brick' : r < 0.54 && G.gen / PPM > 80 ? 'scaffold' : 'tower'; }   // glass towers, brick blocks, building sites
  let gap = rnd(24, v * 0.4), dy = rnd(-30, 28), feature = script || '';
  if (!script && G.gen / PPM > 60) {
    const r = Math.random();
    if (r < 0.2 && G.gen / PPM > 90) feature = 'wall';
    else if (r < 0.29 && G.gen / PPM > 220) feature = 'zip';
    else if (r < 0.38 && G.gen / PPM > 160) feature = 'tramp';
  }
  if (feature === 'wall') { const rise = rnd(30, 46); if (prev.y - rise < 104) feature = ''; else { gap = rnd(4, 14); dy = -rise; b.wall = true; } }
  if (feature === 'zip') { gap = rnd(170, 240); dy = rnd(8, 30); }
  if (feature === 'tramp') { gap = v * 0.6; dy = -rnd(0, 20); prev.obs.push({ type: 'tramp', x: prev.x + prev.w - 30, w: 22 }); }
  if (feature === 'flat') { gap = 30; dy = 0; }
  b.w = feature === 'start' ? 420 : Math.round(rnd(150, 300) + (v - 118) * 1.2);   // faster: longer roofs, so there is room to land
  b.x = prev ? prev.x + prev.w + gap : -60;
  b.y = prev ? clamp(Math.round(prev.y + dy), 104, 188) : 160;
  if (feature === 'zip') prev.zip = { x0: prev.x + prev.w - 8, y0: prev.y - 32, x1: b.x + 16, y1: b.y - 40 };
  // things on the roof: boxes to jump over (or stomp), signs to slide under
  const space = Math.max(100, v * 0.75);
  let ox = b.x + Math.max(90, v * 0.8);
  const last = b.x + b.w - Math.max(100, v * 0.7);
  const wanted = script === 'box' ? ['box'] : script === 'sign' ? ['sign'] : null;
  if (feature !== 'start' && feature !== 'flat' && !b.wall || wanted) {
    let n = 0;
    while (ox < last && (wanted ? n < 1 : Math.random() < 0.75)) {
      const type = wanted ? wanted[0] : G.gen / PPM > 110 && Math.random() < 0.45 ? 'sign' : 'box';
      if (wanted) ox = b.x + b.w * 0.5;
      b.obs.push(type === 'box' ? { type, x: ox, w: 13, h: 11 + (Math.random() < 0.3 ? 5 : 0) } : { type, x: ox, w: 34 });
      ox += space + rnd(0, 70); n++;
    }
  }
  // coins: over the street, along the roof, over boxes, under signs
  const coin = (x, y) => G.coinsOn.push({ x, y });
  if (prev && feature !== 'zip') { const top = Math.min(prev.y, b.y) - 34, x0 = prev.x + prev.w, n = Math.max(3, Math.round(gap / 16)); for (let i = 0; i < n; i++) { const k = (i + 0.5) / n; coin(x0 + gap * k, top - Math.sin(k * Math.PI) * 14 + (b.wall ? 10 : 0)); } }
  if (prev && feature === 'zip') for (let i = 1; i < 9; i++) { const k = i / 9; coin(prev.zip.x0 + (prev.zip.x1 - prev.zip.x0) * k, prev.zip.y0 + (prev.zip.y1 - prev.zip.y0) * k + 8); }
  for (const o of b.obs) {
    if (o.type === 'box') for (let i = -1; i <= 1; i++) coin(o.x + 6 + i * 14, b.y - 30 - (i ? 0 : 8));
    if (o.type === 'sign') for (let i = 0; i < 3; i++) coin(o.x + 4 + i * 12, b.y - 8);
  }
  if (!b.obs.length && b.w > 180 && feature !== 'start') {       // an empty roof: coins in a shape
    const cx = b.x + b.w * 0.5, shape = script ? 0 : Math.floor(Math.random() * 4);
    if (shape === 0) for (let i = 0; i < 5; i++) coin(b.x + 60 + i * 14, b.y - 10);
    else if (shape === 1) for (let r = 0; r < 3; r++) for (let i = 0; i < 4; i++) coin(cx - 21 + i * 14, b.y - 22 - r * 13);             // a block, up in the air
    else if (shape === 2) for (const [qx, qy] of [[0, 0], [-1, 1], [1, 1], [-2, 2], [0, 2], [2, 2], [-1, 3], [1, 3], [0, 4]]) coin(cx + qx * 12, b.y - 62 + qy * 11);   // a diamond
    else for (let i = 0; i < 9; i++) coin(cx - 56 + i * 14, b.y - 12 - Math.sin(i / 8 * Math.PI) * 40);                                  // an arch
  }
  if (!script && Math.random() < 0.07 && b.w > 170) G.powers.push({ x: b.x + b.w * 0.5, y: b.y - 40, type: pick(['magnet', 'shield', 'x2']) });
  // only for the eyes: antennas, tanks, vents, birds
  for (let x = b.x + 20; x < b.x + b.w - 30; x += rnd(40, 90)) if (!b.obs.some(o => Math.abs(o.x - x) < 44)) b.deco.push({ type: pick(['antenna', 'tank', 'vent', 'dish', 'bird', 'bird']), x });
  B.push(b); G.gen = b.x + b.w;
}

/* --- 4. THE RUN --------------------------------------------------------------- */
const input = { jump: false, slide: false };
function newRun(demo = false) {
  G = { demo, x: 0, y: 160, vy: 0, st: 'run', on: null, jumps: 0, coyote: 0, buffer: 0, cut: false, slideT: 0, wallB: null, zip: null, zipK: 0,
        v: 118, dist: 0, coins: 0, tricks: 0, combo: 0, comboT: 0, bestCombo: 0, blds: [], coinsOn: [], powers: [], gen: 0,
        pops: [], parts: [], trail: [], shake: 0, shield: !demo && save.up.shield > 0, inv: 0, magnetT: 0, x2T: 0, theme: 0, themeK: 1, themeFrom: 0, banner: 0,
        freeze: 0, squash: 0, stepT: 0, coinN: 0, coinT: 0, bump: 0, dead: false, deadT: 0, revived: false, askT: 0, missionsDone: [], toasts: [], hint: null, slow: 1, stars: 0, newBest: false, t: 0, flash: 0 };
  addBuilding('start');
  if (!demo && !save.tut) for (const s of ['flat', 'box', 'sign', 'wall']) addBuilding(s);
  G.on = G.blds[0]; G.y = G.on.y;
  if (!demo) { G.pops.push({ text: 'GO!', color: '#9be36b', x: GX + 20, y: 120, t: 0, big: true }); state = 'play'; fade = 1; paused = false; save.runs++; for (const m of save.missions) if (MISSIONS[m.type].kind === 'run') m.prog = 0; store(); }
}
const score = () => Math.floor(G.dist) + G.tricks;
const powerTime = () => 7 + save.up.power * 2.5;
function pop(text, color = '#fff', big = false) { G.pops.push({ text, color, x: GX + 10, y: G.y - 54 - G.pops.filter(p => p.t < 0.4).length * 12, t: 0, big }); }
function toast(text) { G.toasts.push({ text, t: 0 }); }
function puff(x, y, c, n = 5, sp = 40) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, v = sp * (0.3 + Math.random()); G.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 20, c, t: 0, life: 0.3 + Math.random() * 0.3 }); } }
function trick(name, pts, type) {                  // a move: moves one after another make a combo
  G.combo = G.comboT > 0 ? Math.min(9, G.combo + 1) : 1; G.comboT = COMBO_T; G.bestCombo = Math.max(G.bestCombo, G.combo);
  G.tricks += pts * G.combo;
  pop(name + ' +' + pts * G.combo, G.combo >= 4 ? '#ffd23f' : G.combo >= 2 ? '#7af0ff' : '#fff', G.combo >= 4);
  sfx('trick');
  if (type) progress(type, 1);
  progress('combo', G.combo, true);
}
function hit(why) {
  if (G.inv > 0 || G.dead) return;
  if (G.shield) { G.shield = false; G.inv = 1.2; G.shake = 0.3; pop('SHIELD!', '#7af0ff', true); puff(G.x, G.y - 12, '#7af0ff', 14, 90); sfx('shield'); return; }
  G.dead = true; G.deadT = 0; G.why = why; G.shake = 0.4; G.freeze = 0.1; G.vy = -180; G.combo = 0; G.comboT = 0;
  puff(G.x, G.y - 10, '#fff', 12, 90); sfx('crash');
}
function revive() {
  save.coins -= reviveCost(); G.revived = true; G.dead = false; G.askT = 0;
  const b = G.blds.find(q => q.x > G.x + 10) || G.blds[G.blds.length - 1];
  b.obs = b.obs.filter(o => o.x > b.x + 170 || o.type === 'tramp');
  G.x = b.x + 12; G.y = b.y; G.vy = 0; G.st = 'run'; G.on = b; G.inv = 2.2; G.zip = null; G.wallB = null; G.slideT = 0;
  store(); sfx('power');
}
const reviveCost = () => 60;
function endRun() {
  state = 'over'; fade = 1;
  const d = Math.floor(G.dist), sc = score();
  if (d > save.best) { save.best = d; G.newBest = true; }
  if (sc > save.bestScore) save.bestScore = sc;
  save.coins += G.coins;
  let pay = 0;
  for (const m of G.missionsDone) { pay += m.pay; save.done++; save.tiers[m.type] = (save.tiers[m.type] | 0) + 1; }
  const r0 = Math.min(RANKS.length - 1, Math.floor((save.done - G.missionsDone.length) / 3));
  save.missions = save.missions.filter(m => !m.done); fillMissions();
  save.coins += pay; G.pay = pay;
  G.rankUp = rankOf() > r0;
  G.stars = Math.floor(d / 250) + (G.rankUp ? 2 : 0);
  if (G.stars) PX.Wallet.add(G.stars);
  if (!save.tut && d > 60) save.tut = true;
  store(); sfx(G.newBest ? 'best' : 'over');
}
function auto() {                                // a simple robot runner
  const v = G.v; input.slide = false;
  if (G.st === 'run' || G.st === 'slide') {
    input.jump = false;
    const b = G.on, edge = b.x + b.w - G.x, o = b.obs.find(q => q.x + q.w > G.x - 6 && !q.gone && q.type !== 'tramp');
    if (o && o.type === 'sign' && o.x - G.x < v * 0.22) input.slide = true;
    else if (o && o.type === 'box' && o.x > G.x && o.x - G.x < v * 0.16 + 8) { G.buffer = 0.1; input.jump = true; }
    else if (edge < 8 && !b.zip && !b.obs.some(q => q.type === 'tramp')) { G.buffer = 0.1; input.jump = true; }
  } else if (G.st === 'air') {
    const tb = G.blds.find(q => q.x + q.w > G.x - 4);
    if (!tb) return;
    if (G.x < tb.x) input.jump = tb.y < G.y + 6 || tb.x - G.x > v * 0.22;
    else { input.jump = tb.obs.some(q => q.type === 'box' && !q.gone && q.x + q.w > G.x - 6 && q.x - G.x < 70) && G.y > tb.y - 30; input.slide = tb.obs.some(q => q.type === 'sign' && q.x + q.w > G.x && q.x - G.x < 120); }
  }
}
function step(dt) {
  G.t += dt;
  if (G.freeze > 0) { G.freeze -= dt; return; }       // a hit: the world stands still for a moment
  G.squash = Math.max(0, G.squash - dt); G.bump = Math.max(0, G.bump - dt); G.coinT -= dt;
  if (G.dead) {                                  // falling away; then: keep running for coins? or the results
    G.deadT += dt; G.vy += GRAV * dt; G.y += G.vy * dt; G.shake = Math.max(0, G.shake - dt);
    stepFx(dt);
    if (G.demo) { if (G.deadT > 1) newRun(true); return; }
    if (G.deadT > 0.9 && !G.askT) { if (!G.revived && save.coins + 0 >= reviveCost() && G.dist > 40) G.askT = 0.001; else endRun(); }
    if (G.askT) { G.askT += dt; if (G.askT > 4.5) endRun(); }
    return;
  }
  // the first run teaches by doing: the next thing is named, and time runs slower near it
  G.hint = null; G.slow = 1;
  if (!save.tut && !G.demo) {
    const b = G.on || G.blds.find(q => q.x + q.w > G.x), nb = G.blds[G.blds.indexOf(b) + 1];
    const o = b && b.obs.find(q => q.x > G.x - 4 && q.x - G.x < 130);
    if (o) G.hint = o.type === 'box' ? 'jump' : 'slide';
    else if (b && nb && b.x + b.w - G.x < 110) G.hint = nb.wall ? 'wall' : 'jump';
    if (G.hint) G.slow = 0.6;
    if (G.dist > 150) { save.tut = true; store(); }
  }

  if (n) { T(G.rankUp ? 'MISSIONS DONE: YOU ARE NOW A ' + RANKS[rankOf()] + '!' : 'MISSIONS DONE', cx, yy, '#9be36b', 1, 'center'); missionRows(cx - 130, yy + 9, 260, G.missionsDone); yy += 12 + n * 19; }
  if (UI.button('menu', Math.round(cx - 138), yy + 10, 84, 24, 'MENU', { size: 1 }) || UI.back) { G = null; state = 'title'; fade = 1; return; }
  if (UI.button('shop', Math.round(cx - 50), yy + 10, 84, 24, 'SHOP', { size: 1, accent: '#ffd23f' })) { G = null; state = 'shop'; fade = 1; return; }
  if (UI.button('again', Math.round(cx + 38), yy + 10, 100, 24, 'RUN AGAIN', { size: 1, accent: '#5ad43f', on: true })) newRun();
}
function setPause(v) { if (state !== 'play' || G.dead) return; paused = v; input.jump = input.slide = false; }

/* --- sound --- */
function sfx(k, n = 0) {
  if (!save.sfx || (G && G.demo && k !== 'click' && k !== 'buy')) return;
  const s = PX.Sound;
  if (k === 'click') s.tone([523, 784], 0.12, { vol: 0.1 });
  else if (k === 'jump') s.tone([330, 620], 0.12, { vol: 0.08 });
  else if (k === 'jump2') s.tone([520, 980], 0.12, { vol: 0.08 });
  else if (k === 'land') s.noise(0.06, { freq: 400, vol: 0.14 });
  else if (k === 'slide') s.noise(0.25, { freq: 1600, vol: 0.06, filter: 'bandpass' });
  else if (k === 'wall') s.tone([200, 520], 0.22, { vol: 0.08, type: 'triangle' });
  else if (k === 'zip') s.tone([900, 500], 0.5, { vol: 0.06, type: 'sawtooth' });
  else if (k === 'tramp') s.tone([180, 760], 0.25, { vol: 0.1, type: 'triangle' });
  else if (k === 'stomp') s.noise(0.12, { freq: 700, vol: 0.2 });
  else if (k === 'coin') { const f = 988 * Math.pow(2, Math.min(n, 12) / 12); s.tone([f, f * 1.33], 0.07, { vol: 0.06 }); }   // coins in a row: higher and higher
  else if (k === 'step') s.noise(0.025, { freq: 900, vol: 0.035 });
  else if (k === 'trick') s.tone([784, 1175], 0.1, { vol: 0.07, delay: 0.02 });
  else if (k === 'power' || k === 'buy') { s.tone(659, 0.08, { vol: 0.1 }); s.tone(988, 0.08, { vol: 0.1, delay: 0.08 }); s.tone(1319, 0.16, { vol: 0.1, delay: 0.16 }); }
  else if (k === 'shield') s.tone([900, 300], 0.3, { vol: 0.1 });
  else if (k === 'mission') { s.tone(784, 0.1, { vol: 0.1 }); s.tone(1047, 0.2, { vol: 0.1, delay: 0.1 }); }
  else if (k === 'district') [523, 659, 784].forEach((f, i) => s.tone(f, 0.16, { vol: 0.08, delay: i * 0.1 }));
  else if (k === 'crash') { s.noise(0.3, { freq: 300, vol: 0.3 }); s.tone([300, 80], 0.4, { vol: 0.12, type: 'sawtooth' }); }
  else if (k === 'over') s.tone([330, 220, 165], 0.5, { vol: 0.1, type: 'triangle' });
  else if (k === 'best') [523, 659, 784, 1047].forEach((f, i) => s.tone(f, 0.18, { vol: 0.1, delay: i * 0.11 }));
}

/* --- 7. INPUT AND THE MAIN LOOP ---------------------------------------------------- */
const touches = new Map();     // finger -> 'jump' | 'slide'
const playing = () => state === 'play' && !paused && G && !G.dead;
function press(what) { if (what === 'jump') { input.jump = true; if (playing()) G.buffer = 0.13; } else input.slide = true; }
function release(what) { if (what === 'jump') input.jump = false; else input.slide = false; }
UI.onDown = (e, x) => { PX.Sound.unlock(); if (!playing() || UI.downId !== null) return; const what = x < S.W / 2 ? 'slide' : 'jump'; touches.set(e.pointerId, what); press(what); };
UI.onUp = e => { const what = touches.get(e.pointerId); if (!what) return; touches.delete(e.pointerId); if (![...touches.values()].includes(what)) release(what); };
const KEYS = { Space: 'jump', ArrowUp: 'jump', KeyW: 'jump', KeyX: 'jump', ArrowDown: 'slide', KeyS: 'slide', KeyZ: 'slide', ShiftLeft: 'slide' };
window.addEventListener('keydown', e => {
  PX.Sound.unlock();
  if (KEYS[e.code] && state === 'play') { e.preventDefault(); if (!e.repeat) press(KEYS[e.code]); }
  else if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'play') setPause(!paused);
  else if (e.code === 'Escape') UI.back = true;
});
window.addEventListener('keyup', e => { if (KEYS[e.code]) release(KEYS[e.code]); });
window.addEventListener('blur', () => setPause(true));
document.addEventListener('visibilitychange', () => { if (document.hidden) setPause(true); });

let last = performance.now(), acc = 0;
const STEP = 1 / 120;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000), t = now / 1000; last = now;
  fade = Math.max(0, fade - dt * 4);
  UI.begin();
  if (state === 'title') drawTitle(t);
  else if (state === 'shop') drawShop(t);
  else {
    if (state === 'play' && !paused) { acc += dt; while (acc >= STEP) { step(STEP); acc -= STEP; if (state !== 'play') break; } } else acc = 0;
    drawWorld(t);
    if (state === 'play') { if (G.askT && G.askT < 9) drawAsk(t); else if (paused) drawPause(); else drawHud(t); }
    else drawOver(t);
  }
  if (fade > 0) { ctx.fillStyle = 'rgba(13,11,19,' + (fade * 0.9).toFixed(2) + ')'; ctx.fillRect(0, 0, S.W, H); }
  UI.end();
  S.blit('#0d0b13');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => { /* offline mode unavailable */ }));
}
PX.Pad.setup({
  title: 'Pixel Runs: controller', ui: UI, menu: () => !playing(),
  phone: { stick: null, buttons: [['A', 'JUMP'], ['B', 'SLIDE']] },
  keys: () => ({ A: 'Space', up: 'Space', B: 'ArrowDown', X: 'ArrowDown', down: 'ArrowDown', START: 'KeyP' }),
  help: [['A', 'JUMP (HOLD: HIGHER)'], ['B|X', 'SLIDE (IN THE AIR: DIVE)'], ['START', 'PAUSE'], ['STICK|D-PAD', 'MENUS: PICK A BUTTON'], ['A', 'MENUS: OK'], ['B', 'MENUS: BACK']],
});
</script>
