<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Pixel Cook: cook meals to order with your own hands. Start with a cafe shop, then open a pizza, a burger and a luxury restaurant. 3 minutes for one meal.">
<meta name="theme-color" content="#0d0b13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Pixel Cook</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1030; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #screen { position: fixed; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<script src="common.js"></script>
<script>
'use strict';
/* ==========================================================================
   PIXEL COOK: cook meals to order (part of the PIXEL ARCADE).
   A customer walks in and orders. The ticket on the left shows the meal and
   every step. The ingredients are on the shelf on the right: you DRAG them to
   the table and work with them: pour the milk, roll the dough with the
   rolling pin, spread the sauce, sprinkle the toppings where you want them,
   drag the pizza into the oven, grab it when it is done (in the green!) and
   drag the finished meal to the customer.
   You have 3 minutes for one meal; the faster you are, the bigger the tip.
   You start with a CAFE SHOP, then buy a PIZZA RESTAURANT, a BURGER RESTAURANT
   and at last a LUXURY RESTAURANT. New players get a tutorial.
     1. Setup   2. Restaurants and meals   3. The game   4. Your hands
     5. Drawing food   6. Drawing the kitchen   7. Screens   8. Input and the main loop
   ========================================================================== */

/* --- 1. SETUP --------------------------------------------------------------- */
const VERSION = '2.0.0';
const SAVE_KEY = 'pixelCook.save';
const save = { v: 2, money: 0, earned: 0, rest: 0, owned: [true, false, false, false], up: { timer: 0, stove: 0, tips: 0, menu: 0 },
               shifts: [0, 0, 0, 0], served: 0, best: 0, tut: false, tips: [false, false, false, false], hat: false, sfx: true };
try {
  const old = JSON.parse(localStorage.getItem(SAVE_KEY));
  if (old && old.v !== 2) {                 // a save from 1.0 (before the cafe): the restaurants you had move one place up
    old.owned = [true, ...(old.owned || [true])].slice(0, 4); old.shifts = [0, ...(old.shifts || [])].slice(0, 4);
    while (old.owned.length < 4) old.owned.push(false); while (old.shifts.length < 4) old.shifts.push(0);
    old.rest = Math.min(3, (old.rest | 0) + 1); old.tips = [false, false, false, false]; old.v = 2;
  }
  Object.assign(save, old || {});
} catch (e) { /* new player */ }
const store = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* private mode */ } };
const profile = PX.Profile.get();

const canvas = document.getElementById('screen');
const S = PX.makeScreen(canvas, { H: 240, minW: 400, maxW: 560 });
const ctx = S.ctx, H = S.H;
const UI = PX.makeUI(S, canvas);
const T = (str, x, y, color = '#fff', size = 1, align = 'left', shadow = null) => PX.drawText(ctx, str, x, y, color, size, align, shadow);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const pick = a => a[Math.floor(Math.random() * a.length)];
const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
function disc(cx, cy, r, c) {              // a pixel circle
  ctx.fillStyle = c; cx = Math.round(cx); cy = Math.round(cy);
  for (let dy = -r; dy <= r; dy++) { const w = Math.round(Math.sqrt(r * r - dy * dy + r * 0.8)); ctx.fillRect(cx - w, cy + dy, w * 2 + 1, 1); }
}
function wrap(str, maxW) {                 // text into lines no wider than maxW
  const lines = [''];
  for (const wd of str.split(' ')) { const L = lines.length - 1, s = lines[L] ? lines[L] + ' ' + wd : wd; if (PX.textWidth(s, 1) > maxW && lines[L]) lines.push(wd); else lines[L] = s; }
  return lines;
}

const MEAL_TIME = 180;                     // 3 minutes for one meal
const HEARTS = 3;                          // customers who may leave hungry before you close early

/* --- 2. RESTAURANTS AND MEALS --------------------------------------------------- */
// Everything on the shelves. n = the name, s = the step on the ticket, k = what your hands do with it:
//   place: drag it onto the meal (c pieces: keep moving to sprinkle them where you want them)
//   rub:   drag it onto the meal and move it around (roll, spread, pour, drizzle) for `need` pixels
//   cook:  drag it to the coffee machine / the grill / the pan, and grab it back when it is done
//   bake:  (not on the shelf) drag the whole pizza into the oven
const ITEMS = {
  cup: { n: 'CUP', k: 'cook', s: 'BREW THE COFFEE' }, milk: { n: 'MILK', k: 'rub', need: 110, s: 'POUR THE MILK' }, sugar: { n: 'SUGAR', k: 'place', c: 2 },
  cocoa: { n: 'COCOA', k: 'place', c: 5, s: 'SPRINKLE COCOA' }, cream: { n: 'CREAM', k: 'rub', need: 90, s: 'WHIPPED CREAM' },
  caramel: { n: 'CARAMEL', k: 'rub', need: 110, s: 'CARAMEL SAUCE' }, croissant: { n: 'CROISSANT', k: 'place', c: 1 }, muffin: { n: 'MUFFIN', k: 'place', c: 1 },
  dough: { n: 'DOUGH', k: 'place', c: 1, s: 'NEW PIZZA DOUGH' }, roll: { n: 'ROLL PIN', k: 'rub', need: 200, s: 'ROLL IT FLAT' }, sauce: { n: 'SAUCE', k: 'rub', need: 150, s: 'SPREAD THE SAUCE' },
  mozz: { n: 'MOZZARELLA', k: 'place', c: 5 }, salami: { n: 'SALAMI', k: 'place', c: 5 }, mush: { n: 'MUSHROOM', k: 'place', c: 5, s: 'MUSHROOMS' }, ham: { n: 'HAM', k: 'place', c: 5 },
  pine: { n: 'PINEAPPLE', k: 'place', c: 5 }, olive: { n: 'OLIVES', k: 'place', c: 5 }, pepper: { n: 'PEPPER', k: 'place', c: 5 }, bake: { n: 'OVEN', k: 'bake', s: 'BAKE IT IN THE OVEN' },
  bun: { n: 'BUN', k: 'place', c: 1 }, patty: { n: 'PATTY', k: 'cook', s: 'GRILL THE PATTY' }, cheese: { n: 'CHEESE', k: 'place', c: 1 },
  lettuce: { n: 'LETTUCE', k: 'place', c: 1 }, tomato: { n: 'TOMATO', k: 'place', c: 1 }, onion: { n: 'ONION', k: 'place', c: 1 }, bacon: { n: 'BACON', k: 'place', c: 1 },
  pickle: { n: 'PICKLE', k: 'place', c: 1 }, ketchup: { n: 'KETCHUP', k: 'rub', need: 80 }, egg: { n: 'EGG', k: 'place', c: 1, s: 'FRIED EGG' },
  plate: { n: 'PLATE', k: 'place', c: 1 }, steak: { n: 'STEAK', k: 'cook', s: 'COOK THE STEAK' }, lobster: { n: 'LOBSTER', k: 'cook', s: 'COOK THE LOBSTER' },
  pasta: { n: 'PASTA', k: 'cook', s: 'COOK THE PASTA' }, cake: { n: 'CAKE', k: 'cook', s: 'BAKE THE CAKE' },
  potato: { n: 'POTATO', k: 'place', c: 3, s: 'POTATOES' }, aspar: { n: 'ASPARAGUS', k: 'place', c: 3 }, lemon: { n: 'LEMON', k: 'place', c: 1 }, butter: { n: 'BUTTER', k: 'place', c: 1 },
  truffle: { n: 'TRUFFLE', k: 'place', c: 4 }, parm: { n: 'PARMESAN', k: 'place', c: 5 }, choco: { n: 'CHOCO', k: 'rub', need: 100, s: 'CHOCOLATE SAUCE' },
  berry: { n: 'BERRY', k: 'place', c: 3, s: 'STRAWBERRIES' }, gold: { n: 'GOLD', k: 'place', c: 4, s: 'GOLD LEAF' },
};
const MAINS = ['steak', 'lobster', 'pasta', 'cake'];
const cafe = (name, price, extras) => ({ name, price, groups: extras.length ? [['cup'], extras] : [['cup']] });
const pizza = (name, price, top) => ({ name, price, groups: [['dough'], ['roll'], ['sauce'], ['mozz', ...top], ['bake']] });
const burger = (name, price, top) => ({ name, price, groups: [['bun'], ['patty'], ...top.map(x => [x]), ['bun']] });
const lux = (name, price, main, sides) => ({ name, price, groups: [['plate'], [main], sides] });
// a meal's steps are groups: the groups go in order, the things inside one group in any order
const REST = [
  { id: 'cafe', name: 'CAFE SHOP', price: 0, color: '#3fae8a', st: 'COFFEE MACHINE', verb: 'BREWING', lo: 'FILLING', hi: 'SPILLS', late: 'IT IS SPILLING!', bad: 'SPILLED! TAKE A NEW CUP', meal: 'TRAY', r: 12,
    tray: ['cup', 'milk', 'sugar', 'cocoa', 'cream', 'caramel', 'croissant', 'muffin'],
    dishes: [cafe('ESPRESSO', 8, []), cafe('COFFEE WITH MILK', 10, ['milk']), cafe('COFFEE AND CROISSANT', 15, ['sugar', 'croissant']),
             cafe('CAPPUCCINO', 14, ['milk', 'cocoa']), cafe('CARAMEL LATTE', 18, ['milk', 'caramel']), cafe('MOCHA AND MUFFIN', 26, ['milk', 'cream', 'cocoa', 'muffin'])] },
  { id: 'pizza', name: 'PIZZA RESTAURANT', price: 300, color: '#e8402a', st: 'OVEN', verb: 'BAKING', lo: 'RAW', hi: 'BURNT', late: 'IT IS BURNING!', bad: 'BURNT! MAKE A NEW PIZZA', meal: 'PIZZA', r: 23,
    tray: ['dough', 'roll', 'sauce', 'mozz', 'salami', 'mush', 'ham', 'pine', 'olive', 'pepper'],
    dishes: [pizza('PIZZA WITH MOZZARELLA', 20, []), pizza('SALAMI PIZZA', 26, ['salami']), pizza('MUSHROOM PIZZA', 26, ['mush']),
             pizza('HAWAII PIZZA', 32, ['ham', 'pine']), pizza('VEGGIE PIZZA', 38, ['mush', 'pepper', 'olive']),
             pizza('DELUXE PIZZA', 46, ['salami', 'ham', 'mush', 'olive'])] },
  { id: 'burger', name: 'BURGER RESTAURANT', price: 1500, color: '#ffb020', st: 'GRILL', verb: 'GRILLING', lo: 'RAW', hi: 'BURNT', late: 'IT IS BURNING!', bad: 'BURNT! GRILL A NEW PATTY', meal: 'BURGER', r: 5,
    tray: ['bun', 'patty', 'cheese', 'lettuce', 'tomato', 'onion', 'bacon', 'pickle', 'ketchup', 'egg'],
    dishes: [burger('HAMBURGER', 45, ['ketchup']), burger('CHEESEBURGER', 55, ['cheese', 'ketchup']),
             burger('SALAD BURGER', 65, ['cheese', 'lettuce', 'tomato']), burger('BACON BURGER', 78, ['cheese', 'bacon', 'onion', 'ketchup']),
             burger('EGG BURGER', 85, ['egg', 'bacon', 'lettuce', 'pickle']), burger('MEGA BURGER', 98, ['cheese', 'bacon', 'lettuce', 'tomato', 'pickle'])] },
  { id: 'lux', name: 'LUXURY RESTAURANT', price: 5000, color: '#c89aff', st: 'PAN', verb: 'COOKING', lo: 'RAW', hi: 'BURNT', late: 'IT IS BURNING!', bad: 'BURNT! COOK A NEW ONE', meal: 'PLATE', r: 24,
    tray: ['plate', 'steak', 'lobster', 'pasta', 'cake', 'potato', 'aspar', 'lemon', 'butter', 'cream', 'truffle', 'parm', 'choco', 'berry', 'gold'],
    dishes: [lux('STEAK AND POTATOES', 150, 'steak', ['potato', 'butter']), lux('CHOCOLATE CAKE', 160, 'cake', ['choco', 'berry']),
             lux('TRUFFLE PASTA', 185, 'pasta', ['cream', 'truffle', 'parm']), lux('LEMON LOBSTER', 220, 'lobster', ['lemon', 'butter', 'aspar']),
             lux('ROYAL STEAK', 280, 'steak', ['potato', 'aspar', 'truffle', 'butter']), lux('GOLDEN CAKE', 320, 'cake', ['choco', 'berry', 'cream', 'gold'])] },
];
const UPGRADES = [
  { id: 'timer', name: 'KITCHEN TIMER', text: 'THE GREEN ZONE LASTS LONGER', cost: [150, 500, 1500] },
  { id: 'stove', name: 'TURBO STOVE', text: 'BREWS, BAKES AND GRILLS FASTER', cost: [120, 450, 1300] },
  { id: 'tips', name: 'TIP JAR', text: '+25% TIPS A LEVEL', cost: [100, 400, 1200] },
  { id: 'menu', name: 'FANCY MENU', text: '+15% PRICES A LEVEL', cost: [200, 700, 2000] },
];
const HAT_PRICE = 25000;
const COOK_WAIT = [3.0, 2.5, 2.0, 1.6], COOK_GREEN = [1.5, 1.9, 2.3, 2.7], COOK_BURN = 1.2;
const dishCount = r => Math.min(REST[r].dishes.length, 2 + save.shifts[r]);     // new meals open as you finish shifts
const shiftSize = r => 4 + Math.min(4, Math.floor(save.shifts[r] / 2));         // 4 customers at first, up to 8
const priceOf = d => Math.round(d.price * (1 + 0.15 * save.up.menu));
const CUSTOMER_SHAPES = PX.AVATAR_SHAPES.filter(s => !PX.GIFT_SHAPES.includes(s));

/* --- 3. THE GAME --------------------------------------------------------------- */
let state = 'title';            // title | rests | shop | play | over
let paused = false, fade = 1;
let G = null;
let shown = save.money;         // the money on the screen counts up to what you have
function go(s) { state = s; fade = 1; buyFlash = null; }
function newShift(tut = false) {
  const rest = tut ? 0 : save.rest;
  G = { rest, tut, tutPage: tut ? 0 : -1, total: tut ? 1 : shiftSize(rest), n: 0, hearts: HEARTS, servedN: 0, earned: 0, tipsSum: 0, mist: 0,
        O: null, phase: 'wait', phaseT: 0, pops: [], fx: [], shake: 0, stars: 0, newDish: null, tip: null, last: -1, guide: tut || !save.tips[rest], back: null };
  if (!tut && !save.tips[rest]) G.tip = rest;                      // a short tip the first time in a restaurant
  go('play'); paused = false; drag = null;
  resetDish();
  if (!tut) { G.phase = 'intro'; G.phaseT = 0; }
}
function nextCustomer() {
  const rest = REST[G.rest];
  let i = G.tut ? 1 : 0;
  if (!G.tut) do { i = Math.floor(Math.random() * dishCount(G.rest)); } while (i === G.last && dishCount(G.rest) > 1);
  G.last = i; G.n++;
  G.O = { dish: rest.dishes[i], price: priceOf(rest.dishes[i]), time: MEAL_TIME, mist: 0,
          who: { shape: pick(CUSTOMER_SHAPES), color: Math.floor(Math.random() * PX.AVATAR_COLORS.length) }, shirt: pick(['#3a7ad4', '#3fae4a', '#e0782a', '#b07aff', '#e01e5a', '#2ad4c4']),
          say: '', pay: 0, tipPay: 0 };
  resetDish();
  G.phase = 'enter'; G.phaseT = 0;
  sfx('bell');
}
// the meal on the table: done = finished steps, prog = how far a rub is (0..1), parts = the pieces where you put them
function resetDish() { G.D = { done: [], gi: 0, got: [], prog: {}, parts: [], count: {}, off: [], perfect: false, flash: 0 }; G.cook = null; drag = null; }
const dishReady = () => !!G.O && G.D.gi >= G.O.dish.groups.length;
const needs = () => (!G.O || dishReady() ? [] : G.O.dish.groups[G.D.gi].filter(id => !G.D.got.includes(id)));
const dishStarted = () => G.D.done.length > 0 || G.D.parts.length > 0;
function pop(text, color = '#fff', x, y, big = false) {
  if (x === undefined) x = dishX();
  if (y === undefined) y = 118 + G.pops.filter(p => p.t < 0.5).length * 16;      // two at once: one under the other
  const hw = PX.textWidth(text, big ? 3 : 2) / 2;
  G.pops.push({ text, color, x: clamp(x, hw + 4, S.W - hw - 4), y, t: 0, big });
}
function puff(x, y, color, n = 5, sp = 30) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, v = sp * (0.4 + Math.random()); G.fx.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 10, c: color, t: 0, life: 0.35 + Math.random() * 0.25 }); } }
function mistake(text) {
  G.O.mist++; G.mist++; G.shake = 0.3;
  pop(text, '#ff6a5a'); sfx('wrong');
}
function wrong(id) {
  const D = G.D, dish = G.O.dish;
  if (dishReady()) mistake('IT IS DONE: SERVE IT!');
  else if (dish.groups.some((g, k) => k > D.gi && g.includes(id))) mistake('NOT YET!');
  else if (dish.groups.some(g => g.includes(id))) mistake('ALREADY ON IT!');
  else mistake('NOT IN THE ORDER!');
}
function complete(id) {                    // a step is finished
  const D = G.D;
  D.done.push(id); D.got.push(id); D.flash = 0.25;
  if (!needs().length) { D.gi++; D.got = []; }
  if (dishReady()) { pop('READY!', '#9be36b'); sfx('ready'); }
}
function placePiece(id, x, y) {            // a piece lands where your hand is
  const D = G.D, rest = REST[G.rest], it = ITEMS[id];
  let dx = x - dishX(), dy = y - DISH_Y;
  if (rest.id === 'burger') { dx = clamp(dx * 0.2, -rest.r, rest.r); dy = 0; D.off[D.done.length] = Math.round(dx); }
  else { const d = Math.hypot(dx, dy), m = rest.r; if (d > m) { dx *= m / d; dy *= m / d; } }
  D.parts.push({ id, x: Math.round(dx), y: Math.round(dy), t: 0 });
  D.count[id] = (D.count[id] || 0) + 1;
  puff(dishX() + dx, DISH_Y + dy, '#fff8e0', 3, 18); sfx('put');
  if (D.count[id] >= it.c) { complete(id); return true; }
  return false;
}
function startCook(id) {                   // into the coffee machine / the oven, onto the grill, into the pan
  G.cook = { id, t: 0, wait: COOK_WAIT[save.up.stove], green: COOK_GREEN[save.up.timer], smoke: false };
  sfx('sizzle');
}
function takeOut() {
  if (state !== 'play' || paused || !G.cook) return;
  const c = G.cook, D = G.D;
  if (c.t < c.wait) { pop('NOT READY YET!', '#7ac8ff', stationX() + 27, 110); sfx('wrong'); return; }
  const k = (c.t - c.wait) / c.green;       // 0..1 through the green zone
  D.perfect = k > 0.3 && k < 0.7;
  G.cook = null;
  G.back = { id: c.id, x: stationX() + 27, y: 76, t: 0 };          // it flies back to the table
  pop(D.perfect ? 'PERFECT!' : 'GOOD!', D.perfect ? '#ffd23f' : '#9be36b'); sfx(D.perfect ? 'perfect' : 'put');
  if (D.perfect) puff(dishX(), DISH_Y, '#ffd23f', 12, 60);
  complete(c.id);
}
function burnt() {
  const id = G.cook.id;
  puff(stationX() + 27, 70, '#333', 10, 40);
  if (id === 'bake') resetDish(); else G.cook = null;              // a burnt pizza is gone; a burnt patty: just take a new one
  mistake(REST[G.rest].bad);
}
function trash() {
  if (state !== 'play' || paused || G.phase !== 'cook' || !dishStarted()) return;
  const b = binRect();
  resetDish(); pop('IN THE BIN. START AGAIN', '#9a92b8'); puff(b.x + b.w / 2, b.y + 8, '#9a92b8', 8); sfx('trash');
}
function serve() {
  if (state !== 'play' || paused || G.phase !== 'cook' || !dishReady()) return;
  const O = G.O, left = O.time / MEAL_TIME;
  let tip = O.price * (0.4 * left + (G.D.perfect ? 0.15 : 0)) * (1 + 0.25 * save.up.tips) * Math.pow(0.8, O.mist);
  tip = Math.round(tip);
  O.pay = O.price; O.tipPay = tip;
  save.money += O.price + tip; save.earned += O.price + tip; save.served++;
  G.earned += O.price + tip; G.tipsSum += tip; G.servedN++;
  O.say = pick(['YUMMY!', 'DELICIOUS!', 'THANK YOU!', 'SO GOOD!', 'WOW!']);
  pop('+$' + O.price, '#ffd23f', customerX() + 60, 50, true);
  if (tip) pop('TIP +$' + tip, '#9be36b', customerX() + 60, 74);
  for (let i = 0; i < 8; i++) G.fx.push({ coin: true, x: customerX() + Math.random() * 30, y: 60 + Math.random() * 20, t: -i * 0.06, life: 0.6 });
  G.phase = 'served'; G.phaseT = 0; drag = null;
  if (G.guide && !G.tut) { G.guide = false; save.tips[G.rest] = true; }
  store(); sfx('cash');
}
function customerLeaves() {
  G.hearts--; G.O.say = 'TOO SLOW! BYE!';
  G.cook = null; drag = null; G.phase = 'left'; G.phaseT = 0; G.shake = 0.4;
  sfx('angry');
}
function endShift() {
  go('over'); drag = null;
  if (G.tut) { save.tut = true; save.tips[0] = true; store(); return; }
  const before = dishCount(G.rest);
  if (G.servedN > 0) {
    save.shifts[G.rest]++;
    G.stars = 1 + (G.servedN === G.total && G.mist === 0 ? 1 : 0);
    PX.Wallet.add(G.stars);
  }
  if (dishCount(G.rest) > before) G.newDish = REST[G.rest].dishes[before].name;
  if (G.earned > save.best) { save.best = G.earned; G.newBest = true; }
  store(); sfx('done');
}
function step(dt) {
  G.phaseT += dt; G.shake = Math.max(0, G.shake - dt); G.D.flash = Math.max(0, G.D.flash - dt);
  G.pops = G.pops.filter(p => (p.t += dt) < 1.4);
  G.fx = G.fx.filter(p => { p.t += dt; if (!p.coin) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 60 * dt; } return p.t < p.life; });
  for (const p of G.D.parts) p.t += dt;
  if (G.back && (G.back.t += dt) > 0.25) G.back = null;
  if (G.tutPage >= 0 || G.tip !== null) return;
  if (G.phase === 'intro' && G.phaseT > 1.3) nextCustomer();
  else if (G.phase === 'enter' && G.phaseT > 0.7) { G.phase = 'cook'; G.phaseT = 0; }
  else if (G.phase === 'cook') {
    if (!G.tut) G.O.time -= dt;                          // the clock waits for you in the tutorial
    if (G.O.time <= 10 && Math.floor(G.O.time) !== Math.floor(G.O.time + dt)) sfx('tick');
    if (G.cook) {
      const c = G.cook; c.t += dt;
      if (Math.random() < dt * 8) G.fx.push({ x: stationX() + 14 + Math.random() * 26, y: 56, vx: (Math.random() - 0.5) * 8, vy: -22, c: c.t > c.wait + c.green ? '#444' : 'rgba(255,255,255,0.55)', t: 0, life: 0.7 });
      if (c.t > c.wait + c.green + COOK_BURN) burnt(); else if (c.t > c.wait + c.green && !c.smoke) { c.smoke = true; sfx('wrong'); } else if (c.t >= c.wait && !c.ding) { c.ding = true; sfx('ding'); }
    }
    if (G.O.time <= 0) { G.O.time = 0; customerLeaves(); }

const SHELF_W = 96, DISH_Y = 158;
const midX0 = () => 108, shelfX = () => S.W - SHELF_W, stationX = () => shelfX() - 60;
const dishX = () => Math.round((midX0() + stationX()) / 2) + 2, customerX = () => midX0() + 26;
const binRect = () => ({ x: stationX() + 12, y: 150, w: 36, h: 36 });
const overDish = (x, y) => Math.hypot(x - dishX(), y - DISH_Y) < 46;
const overStation = (x, y) => x >= stationX() - 10 && x < shelfX() && y >= 28 && y < 106;
const overCustomer = (x, y) => y < 104 && x >= midX0() - 6 && x < stationX() - 10;
const overBin = (x, y) => { const b = binRect(); return x >= b.x - 6 && x < b.x + b.w + 6 && y >= b.y - 6 && y < b.y + b.h + 6; };
function tileRect(i, n) {                   // where ingredient i is on the shelf (2 columns)
  const rows = Math.ceil(n / 2), th = Math.min(42, Math.floor(212 / rows)), tw = 44, x0 = shelfX() + 4, y0 = 24 + Math.floor((212 - rows * th) / 2);
  return { x: x0 + (i % 2) * (tw + 1), y: y0 + Math.floor(i / 2) * th, w: tw, h: th - 2 };

let drag = null;                            // what your hand holds: an ingredient from the shelf, or 'dish' (the meal itself)
const canPlay = () => state === 'play' && !paused && G.tutPage < 0 && G.tip === null && G.phase === 'cook';
function pDown(pid, x, y) {
  if (!canPlay() || drag) return;

    if (overStation(x, y)) takeOut();

    return;

  const tray = REST[G.rest].tray;
  for (let i = 0; i < tray.length; i++) {
    const r = tileRect(i, tray.length);
    if (x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h + 2) { drag = { id: tray[i], pid, x, y, acc: 0, used: false, snd: 0 }; sfx('grab'); return; }

}
function pMove(pid, x, y) {

  drag.x = x; drag.y = y;
  if (!canPlay() || drag.id === 'dish' || !overDish(x, y) || !needs().includes(drag.id)) return;
  const it = ITEMS[drag.id], D = G.D;
  if (it.k === 'rub') {                     // roll, spread, pour, drizzle: keep moving
    D.prog[drag.id] = (D.prog[drag.id] || 0) + dist / it.need; drag.used = true;

function drawRests(t) {
  const W = S.W;

let buyFlash = null;

  R(W / 2 - w / 2 - 2, 100, w + 4, 28, '#111'); R(W / 2 - w / 2, 102, w, 24, '#ffd23f'); T(buyFlash.text, W / 2, big ? 109 : 112, '#111', big ? 2 : 1, 'center');
  for (let i = 0; i < 16; i++) { const k = buyFlash.t * 60 + i * 23; R(W / 2 - w / 2 + (i * 37 + k) % w, 96 + (i % 2) * 34 + Math.sin(k * 0.1) * 3, 2, 2, ['#fff', '#ff6bd0', '#7af0ff'][i % 3]); }
}

  const y = 28 + UPGRADES.length * 36;

  if (save.hat) T('YOURS!', x + w - 50, y + 12, '#5ad43f', 2, 'center', '#000');

function drawPause() {

function drawOver(t) {

  if (G.newBest) T('BEST SHIFT EVER!', W / 2, y + 90, '#9be36b', 1, 'center');

  else { const nx = REST[G.rest + 1]; if (nx && !save.owned[G.rest + 1]) T(save.money >= nx.price ? 'YOU CAN BUY THE ' + nx.name + '!' : nx.name + ': $' + (nx.price - save.money) + ' TO GO', W / 2, y + 124, '#7ac8ff', 1, 'center'); }
  if (UI.button('menu', Math.round(W / 2 - 124), y + 146, 120, 24, 'MENU') || UI.back) toTitle();
  if (UI.button('again', Math.round(W / 2 + 4), y + 146, 120, 24, 'NEXT SHIFT', { accent: '#5ad43f' })) newShift();
}
function setPause(v) { if (state !== 'play') return; paused = v; if (v) drag = null; }
function toTitle() { G = null; drag = null; paused = false; go('title'); }

/* --- sound --- */
function sfx(k) {
  if (!save.sfx) return;
  const s = PX.Sound;
  if (k === 'click') s.tone([523, 784], 0.12, { vol: 0.1 });
  else if (k === 'put') s.tone([330, 440], 0.08, { vol: 0.1, type: 'triangle' });
  else if (k === 'roll') s.noise(0.12, { freq: 500, vol: 0.2 });
  else if (k === 'sizzle') s.noise(0.6, { freq: 4000, vol: 0.08, filter: 'highpass' });
  else if (k === 'wrong') s.tone([200, 130], 0.2, { vol: 0.12, type: 'sawtooth' });
  else if (k === 'trash') s.noise(0.2, { freq: 300, vol: 0.25 });
  else if (k === 'ready') { s.tone(784, 0.1, { vol: 0.1 }); s.tone(1047, 0.16, { vol: 0.1, delay: 0.1 }); }
  else if (k === 'perfect') { s.tone(784, 0.08, { vol: 0.1 }); s.tone(988, 0.08, { vol: 0.1, delay: 0.08 }); s.tone(1319, 0.2, { vol: 0.1, delay: 0.16 }); }
  else if (k === 'cash') { s.tone([988, 1319], 0.1, { vol: 0.1 }); s.tone([1319, 1976], 0.2, { vol: 0.1, delay: 0.1 }); }
  else if (k === 'bell') { s.tone(1568, 0.25, { vol: 0.08, type: 'triangle' }); s.tone(1245, 0.3, { vol: 0.08, type: 'triangle', delay: 0.15 }); }
  else if (k === 'angry') s.tone([300, 150, 100], 0.5, { vol: 0.14, type: 'sawtooth' });
  else if (k === 'tick') s.tone(880, 0.06, { vol: 0.1 });
  else if (k === 'grab') s.tone([440, 560], 0.05, { vol: 0.07, type: 'triangle' });
  else if (k === 'rub') s.noise(0.07, { freq: 900, vol: 0.1, filter: 'bandpass' });
  else if (k === 'ding') s.tone(1760, 0.3, { vol: 0.09, type: 'triangle' });
  else if (k === 'done') [523, 659, 784, 1047].forEach((f, i) => s.tone(f, 0.18, { vol: 0.1, delay: i * 0.11 }));
}

/* --- 8. INPUT AND THE MAIN LOOP ---------------------------------------------------- */
UI.onDown = (e, x, y) => { PX.Sound.unlock(); pad.on = false; if (UI.downId === null) pDown(e.pointerId, x, y); };
UI.onMove = (e, x, y) => pMove(e.pointerId, x, y);
UI.onUp = e => { const { x, y } = S.toLogical(e); pUp(e.pointerId, x, y); };
window.addEventListener('keydown', e => {
  PX.Sound.unlock();
  if (canPlay() && G.cook && (e.code === 'Space' || e.code === 'Enter')) { e.preventDefault(); takeOut(); }
  else if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'play') setPause(!paused);
  else if (e.code === 'Escape') UI.back = true;
});
window.addEventListener('blur', () => setPause(true));
document.addEventListener('visibilitychange', () => { if (document.hidden) setPause(true); });
// a controller moves a hand over the kitchen: hold A to grab, let go to drop
const pad = { on: false, x: 200, y: 150, down: false };

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000), t = now / 1000; last = now;
  fade = Math.max(0, fade - dt * 4);
  UI.begin();
  if (state === 'title') drawTitle(t);
  else if (state === 'rests') drawRests(t);
  else if (state === 'shop') drawShop(t);
  else {
    const overlay = paused || state === 'over' || G.tutPage >= 0 || G.tip !== null;
    if (state === 'play' && !paused) step(dt);
    if (overlay) { const mx = UI.mx, my = UI.my; UI.mx = UI.my = -99; drawPlay(t); UI.list = []; UI.mx = mx; UI.my = my; } else drawPlay(t);   // the kitchen is only a picture under a panel
    if (paused) drawPause();
    else if (state === 'over') drawOver(t);
    else if (G.tip !== null) { if (infoPanel(REST_TIPS[G.tip], 'GOT IT!')) { G.tip = null; sfx('click'); } }
    else if (G.tutPage >= 0) drawTutorialPages();
  }
  if (fade > 0) { ctx.fillStyle = `rgba(13,11,19,${(fade * 0.9).toFixed(2)})`; ctx.fillRect(0, 0, S.W, H); }
  UI.end();
  S.blit('#1a1030');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => { /* offline mode unavailable */ }));
}
PX.Pad.setup({
  title: 'Pixel Cook: controller', ui: UI, menu: () => !canPlay(),
  phone: { stick: 'MOVE THE HAND', buttons: [['A', 'GRAB']] },
  keys: () => ({ START: 'KeyP' }),
  onPlay: (h, n, dt) => {                          // the stick moves the hand; hold A to grab, let go to drop

    const m = Math.hypot(h.ax, h.ay);
    if (m > 0.15) { pad.x = clamp(pad.x + h.ax * 170 * dt, 2, S.W - 2); pad.y = clamp(pad.y + h.ay * 170 * dt, 22, H - 2); pMove('pad', pad.x, pad.y); }
    if (h.A && !pad.down) { pad.down = true; pDown('pad', pad.x, pad.y); }
    else if (!h.A && pad.down) { pad.down = false; pUp('pad', pad.x, pad.y); }
  },
  help: [['STICK', 'MOVE THE HAND'], ['A', 'HOLD TO GRAB, LET GO TO DROP'], ['A', 'TAP THE OVEN / GRILL: TAKE IT OUT'], ['START', 'PAUSE'], ['STICK|D-PAD', 'MENUS: PICK A BUTTON'], ['A', 'MENUS: OK'], ['B', 'MENUS: BACK']],
});
