<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Pixel Slice: fruit flies up, swipe to slice it. Combos, ice that slows time, chili that sets your blade on fire, and bombs you must not touch.">
<meta name="theme-color" content="#0d0b13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Pixel Slice</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #24140c; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #screen { position: fixed; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<script src="common.js"></script>
<script src="cs.js"></script>
<script>
'use strict';
/* ==========================================================================
   PIXEL SLICE: fruit flies up, swipe to slice it (part of the PIXEL GAMES).
   Swipe across the screen (or drag the mouse, or a controller's stick with A held): every fruit the blade
   crosses fast enough is cut in two. Several in one swipe: a COMBO (bonus points).
     3 LIVES: a fruit that falls back down uncut costs a life; slicing a BOMB ends the run.
     60 SECONDS: as many as you can; a bomb costs 10 points.
   Specials: ICE slows time for 4 s, CHILI sets the blade on fire for 6 s (every cut counts twice),
   GOLD gives 5 coins, a STAR gives ★1 for the arcade.
   Coins buy blades and places in the SHOP. Every 40 points is ★1 for the arcade (up to ★10 a run).
   CHALLENGE (a round of a PIXEL PARTY tournament, PX.Challenge): straight into 60 SECONDS; the score goes to the
   tournament when the time is up (a bomb costs 10 points, as always in 60 SECONDS). No menus in between.
     1. Setup   2. Fruit   3. The run   4. Drawing   5. Screens   6. Sound   7. Input   8. Main loop
   ========================================================================== */

/* --- 1. SETUP --------------------------------------------------------------- */
const VERSION = '1.1.0';
const CHALLENGE = PX.Challenge.on && PX.Challenge.spec.id === 'slice';
const SAVE_KEY = 'pixelSlice.save';
const save = { sfx: true, music: true, best: {}, coins: 0, blade: 'white', place: 'dojo', owned: { white: 1, dojo: 1 }, played: 0, cut: 0, bestCombo: 0 };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY)) || {}); } catch (e) { /* new player */ }
if (!save.best || typeof save.best !== 'object') save.best = {};
const store = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* private mode */ } };
const profile = PX.Profile.get();

const canvas = document.getElementById('screen');
const S = PX.makeScreen(canvas, { H: 240, minW: 400, maxW: 560 });
const ctx = S.ctx, H = S.H;
const UI = PX.makeUI(S, canvas);
const T = (str, x, y, color = '#fff', size = 1, align = 'left', shadow = null) => PX.drawText(ctx, str, x, y, color, size, align, shadow);
PX.Lang.page('slice');                             // Czech when SETTINGS → LANGUAGE says so (cs.js)
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const R = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];

const GRAV = 330;            // px/s²
const LIVES = 3;
const TIME = 60;             // 60 SECONDS mode
const CUT_SPEED = 260;       // the blade cuts only when it moves at least this fast (px/s)
const COMBO_GAP = 0.3;       // cuts closer together than this are one swipe
const SLOW = 0.4, SLOW_T = 4;// ICE: the world at 40 % speed for 4 s
const FIRE_T = 6;            // CHILI: a burning blade for 6 s
const STAR_EVERY = 40;       // ★1 for the arcade every 40 points
const STAR_MAX = 10;

const MODES = { lives: { name: '3 LIVES' }, timed: { name: '60 SECONDS' } };
const BLADES = [
  { id: 'white', name: 'STEEL', price: 0, cols: ['#ffffff', '#c8d8ff'] },
  { id: 'fire', name: 'FIRE', price: 150, cols: ['#fff2a0', '#ff8a1e', '#e8303a'] },
  { id: 'ice', name: 'FROST', price: 200, cols: ['#ffffff', '#7af0ff', '#3a8aff'] },
  { id: 'laser', name: 'LASER', price: 400, cols: ['#ffffff', '#5aff6a', '#1ea83a'] },
  { id: 'gold', name: 'GOLD', price: 800, cols: ['#fff6c0', '#ffd23f', '#c88a10'] },
  { id: 'rainbow', name: 'RAINBOW', price: 1500, rainbow: true },
];
const PLACES = [
  { id: 'dojo', name: 'DOJO', price: 0, bg: '#24140c' },
  { id: 'night', name: 'NIGHT', price: 200, bg: '#0b0a1e' },
  { id: 'beach', name: 'BEACH', price: 300, bg: '#5ab4f0' },
  { id: 'space', name: 'SPACE', price: 600, bg: '#05030c' },
];
const bladeOf = id => BLADES.find(b => b.id === id) || BLADES[0];
const placeOf = id => PLACES.find(p => p.id === id) || PLACES[0];
const hue = (t, k = 0) => `hsl(${Math.round((t * 160 + k * 40) % 360)},95%,62%)`;

/* --- 2. FRUIT ---------------------------------------------------------------- */
// rx, ry: the size; skin, dark: the outside; flesh, core: the inside (when cut); pts: what one is worth
const FRUITS = {
  apple: { rx: 7, ry: 7, skin: '#e8303a', dark: '#a81c28', flesh: '#fff2c8', core: '#c8a060', stem: 1 },
  orange: { rx: 7, ry: 7, skin: '#ff9a1e', dark: '#d06a10', flesh: '#ffc860', core: '#fff0c0', dots: 1 },
  lemon: { rx: 8, ry: 6, skin: '#ffe03a', dark: '#d8b020', flesh: '#fff6a0', core: '#ffffff' },
  plum: { rx: 6, ry: 6, skin: '#8a3ac8', dark: '#5a1e8a', flesh: '#ffd27a', core: '#a86a2a', stem: 1 },
  kiwi: { rx: 7, ry: 6, skin: '#8a5a2a', dark: '#5a3a18', flesh: '#7ad43a', core: '#1a1a10', seeds: 1 },
  melon: { rx: 12, ry: 10, skin: '#3aa83a', dark: '#1e6e24', flesh: '#ff4a5a', core: '#2a1a10', stripes: 1, seeds: 1 },
  pine: { rx: 7, ry: 10, skin: '#f0b020', dark: '#a8701a', flesh: '#fff080', core: '#ffd040', crown: 1, grid: 1 },
  coco: { rx: 8, ry: 8, skin: '#6a4424', dark: '#3e2614', flesh: '#ffffff', core: '#f0f0e8' },
  banana: { rx: 11, ry: 4, skin: '#ffe03a', dark: '#c8a020', flesh: '#fff6c8', core: '#e8d890', curve: 1 },
  // specials
  bomb: { rx: 7, ry: 7, skin: '#2a2a34', dark: '#111118', bomb: 1 },
  ice: { rx: 7, ry: 7, skin: '#9ae8ff', dark: '#3aa8e0', flesh: '#e8fbff', core: '#ffffff', special: 'ICE!' },
  chili: { rx: 9, ry: 4, skin: '#ff2a1e', dark: '#a81410', flesh: '#ffd0a0', core: '#ffe8c0', stem: 1, special: 'FIRE BLADE!' },
  gold: { rx: 7, ry: 7, skin: '#ffd23f', dark: '#c88a10', flesh: '#fff6c0', core: '#ffe27a', shine: 1, special: '+5 COINS' },
  star: { rx: 8, ry: 8, skin: '#ffe680', dark: '#e0a020', flesh: '#fff8d0', core: '#ffffff', star: 1, special: '★ +1' },
};
const Z = 2;                 // fruit is drawn with 2x2 pixels (chunky, and big enough for a thumb)
const PLAIN = ['apple', 'orange', 'lemon', 'plum', 'kiwi', 'melon', 'pine', 'coco', 'banana'];

// an ellipse of pixels, row by row (only the rows where keep(dy) says so: a half)
function blob(x, y, rx, ry, col, keep) {
  ctx.fillStyle = col;
  for (let dy = -ry; dy <= ry; dy++) {
    if (keep && !keep(dy)) continue;
    const w = Math.round(rx * Math.sqrt(Math.max(0, 1 - (dy * dy) / (ry * ry + 0.5))));
    if (w > 0) ctx.fillRect(Math.round(x - w), Math.round(y + dy), w * 2, 1);
  }
}
const OUT = '#120a06';
function drawFruit(f, t) {
  const k = FRUITS[f.kind], x = Math.round(f.x), y = Math.round(f.y);
  ctx.save(); ctx.translate(x, y); ctx.rotate(f.a); ctx.scale(Z, Z);
  blob(0, 0, k.rx + 1, k.ry + 1, OUT);
  blob(0, 0, k.rx, k.ry, k.dark);
  blob(-1, -1, k.rx - 1, k.ry - 1, k.skin);
  if (k.stripes) { ctx.fillStyle = k.dark; for (let i = -2; i <= 2; i++) ctx.fillRect(i * 4 - 1, -k.ry + 2, 2, k.ry * 2 - 4); }
  if (k.grid) { ctx.fillStyle = k.dark; for (let i = -k.ry + 3; i < k.ry - 1; i += 3) for (let j = -k.rx + 2 + (i & 1) * 2; j < k.rx - 1; j += 4) ctx.fillRect(j, i, 1, 1); }
  if (k.dots) { ctx.fillStyle = k.dark; ctx.fillRect(2, -2, 1, 1); ctx.fillRect(-3, 2, 1, 1); ctx.fillRect(1, 3, 1, 1); }
  if (k.stem) { ctx.fillStyle = '#5a3a18'; ctx.fillRect(0, -k.ry - 3, 1, 3); ctx.fillStyle = '#3aa83a'; ctx.fillRect(1, -k.ry - 3, 3, 2); }
  if (k.crown) { ctx.fillStyle = '#3aa83a'; ctx.fillRect(-3, -k.ry - 5, 2, 5); ctx.fillRect(0, -k.ry - 7, 2, 7); ctx.fillRect(3, -k.ry - 5, 2, 5); }
  if (k.curve) { ctx.fillStyle = '#5a3a18'; ctx.fillRect(k.rx - 1, -2, 2, 2); ctx.fillRect(-k.rx - 1, -1, 2, 2); }
  if (k.shine || f.kind === 'ice') { const s = Math.sin(t * 8 + f.id) > 0.3; ctx.fillStyle = '#ffffff'; ctx.fillRect(-3, -4, 2, 2); if (s) { ctx.fillRect(-1, -k.ry - 4, 1, 3); ctx.fillRect(-2, -k.ry - 3, 3, 1); } }
  if (k.star) { ctx.rotate(-f.a); T('★', 0, -2, '#e0a020', 1, 'center'); }
  if (k.bomb) {
    ctx.fillStyle = '#6a6a7a'; ctx.fillRect(-1, -k.ry - 2, 3, 2);
    ctx.fillStyle = '#c8a060'; ctx.fillRect(1, -k.ry - 4, 1, 2); ctx.fillRect(2, -k.ry - 5, 1, 1);
    const on = Math.sin(t * 20 + f.id) > 0;
    ctx.fillStyle = on ? '#ffe03a' : '#ff6a1e'; ctx.fillRect(2, -k.ry - 7, 2, 2);
    ctx.fillStyle = Math.sin(t * 6) > 0 ? '#ff3a3a' : '#5a5a6a'; ctx.fillRect(-2, -1, 4, 3);
    ctx.fillStyle = '#5a5a6a'; ctx.fillRect(-4, -4, 2, 2);
  }
  ctx.restore();
}
// half a fruit: side +1 or -1 of its cut, flesh showing along the cut
function drawHalf(h) {
  const k = FRUITS[h.kind];
  ctx.save(); ctx.translate(Math.round(h.x), Math.round(h.y)); ctx.rotate(h.a); ctx.scale(Z, Z);
  const keep = dy => (h.side > 0 ? dy >= 0 : dy <= 0);
  blob(0, 0, k.rx + 1, k.ry + 1, OUT, keep);
  blob(0, 0, k.rx, k.ry, k.dark, keep);
  blob(0, 0, k.rx - 1, k.ry - 1, k.skin, keep);
  blob(0, 0, k.rx - 2, k.ry - 2, k.flesh, dy => keep(dy) && Math.abs(dy) <= Math.max(1, Math.floor(k.ry / 3)));
  ctx.fillStyle = k.core; ctx.fillRect(-Math.ceil(k.rx / 3), h.side > 0 ? 0 : -1, Math.ceil(k.rx / 3) * 2, 1);
  if (k.seeds) { ctx.fillStyle = k.core; for (let i = -k.rx + 3; i < k.rx - 2; i += 3) ctx.fillRect(i, h.side > 0 ? 1 : -2, 1, 1); }
  ctx.restore();
}

/* --- 3. THE RUN --------------------------------------------------------------- */
// G: the run being played ('lives' or 'timed'); on the title screen a 'demo' run tosses fruit to slice for fun
let G = null, demo = null, nextId = 1;
function newRun(mode) {
  return { mode, t: 0, score: 0, lives: LIVES, left: TIME, fruit: [], halves: [], bits: [], splats: [], pops: [], spawnT: 0.6, waves: 0,
           slowT: 0, fireT: 0, combo: 0, comboT: 0, best: 0, cut: 0, stars: 0, starFruit: 0, gold: 0, over: false, overT: 0, boomT: 0,
           shake: 0, misses: [], done: false };
}
function launch(R0, kind, x) {
  const W = S.W, k = FRUITS[kind];
  x = x === undefined ? R(W * 0.12, W * 0.88) : x;
  const rise = R(130, 200), vy = -Math.sqrt(2 * GRAV * rise);
  const vx = (W / 2 - x) * R(0.25, 0.75) / 1.8 + R(-20, 20);
  R0.fruit.push({ id: nextId++, kind, x, y: H + 26, vx, vy, a: R(0, 6), va: R(-4, 4), r: Math.max(k.rx, k.ry) * Z + 4 });
}
function spawnWave(R0) {
  const t = R0.t, demoRun = R0.mode === 'demo';
  const n = demoRun ? 1 + Math.floor(Math.random() * 2) : 1 + Math.floor(Math.random() * Math.min(5, 1 + t / 14));
  const bombP = demoRun || t < 5 ? 0 : Math.min(R0.mode === 'timed' ? 0.3 : 0.22, 0.06 + t * 0.003);
  for (let i = 0; i < n; i++) {
    let kind = pick(PLAIN);
    const r = Math.random();
    if (!demoRun) {
      if (r < bombP) kind = 'bomb';
      else if (r < bombP + 0.03) kind = 'ice';
      else if (r < bombP + 0.05) kind = 'chili';
      else if (r < bombP + 0.08) kind = 'gold';
      else if (r < bombP + 0.09 && R0.starFruit < 3) { kind = 'star'; R0.starFruit++; }
    }
    // a wave comes up together, or one after the other in a burst
    setTimeout(() => { if (R0 === G || R0 === demo) launch(R0, kind); }, n > 3 && Math.random() < 0.5 ? i * 140 : 0);
  }
  R0.waves++;
  const gap = demoRun ? 1.6 : R0.mode === 'timed' ? Math.max(0.55, 1.4 - t * 0.012) : Math.max(0.75, 2.0 - t * 0.016);
  R0.spawnT = gap;
}
function pop(R0, x, y, txt, col, big) { R0.pops.push({ x, y, txt, col, t: 0, big }); }
function splash(R0, x, y, k, dx, dy) {
  for (let i = 0; i < 14; i++) {
    const a = Math.atan2(dy, dx) + R(-1.2, 1.2) + (i & 1 ? Math.PI : 0), s = R(60, 200);
    R0.bits.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, life: R(0.4, 0.8), col: i % 3 ? k.flesh : k.skin });
  }
  if (R0.splats.length > 24) R0.splats.shift();
  R0.splats.push({ x, y, col: k.flesh, r: k.rx * Z + 4, life: 3, seed: Math.random() * 99 });
}
// the blade crossed this fruit (dx, dy: the swipe's direction)
function cutFruit(R0, f, dx, dy) {
  const k = FRUITS[f.kind];
  R0.fruit.splice(R0.fruit.indexOf(f), 1);
  const ang = Math.atan2(dy, dx), nx = -Math.sin(ang), ny = Math.cos(ang);
  if (k.bomb) {
    sfx('boom'); R0.shake = 0.5; R0.boomT = 0.6;
    for (let i = 0; i < 30; i++) { const a = R(0, 6.28), s = R(60, 260); R0.bits.push({ x: f.x, y: f.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: R(0.3, 0.9), col: pick(['#ffe03a', '#ff8a1e', '#ff3a3a', '#5a5a6a']) }); }
    if (R0.mode === 'lives') { R0.lives = 0; R0.dead = 'bomb'; }
    else if (R0.mode === 'timed') { R0.score = Math.max(0, R0.score - 10); pop(R0, f.x, f.y, '-10', '#ff5a5a', true); }
    return;
  }
  for (const side of [1, -1]) R0.halves.push({ kind: f.kind, side, x: f.x, y: f.y, vx: f.vx * 0.6 + nx * side * 80, vy: Math.min(f.vy, 0) * 0.3 + ny * side * 80 - 30, a: ang, va: side * R(3, 7), life: 2.5 });
  splash(R0, f.x, f.y, k, dx, dy);
  if (R0.mode === 'demo') { sfx('cut', R0); return; }
  const mult = R0.fireT > 0 ? 2 : 1;
  R0.score += mult; R0.cut++; save.cut = (save.cut | 0) + 1;
  R0.combo++; R0.comboT = COMBO_GAP;
  if (k.special === 'ICE!') { R0.slowT = SLOW_T; sfx('ice'); }
  if (k.special === 'FIRE BLADE!') { R0.fireT = FIRE_T; sfx('fire'); }
  if (k.special === '+5 COINS') { R0.gold += 5; sfx('gold'); }
  if (k.special === '★ +1') { R0.stars++; sfx('star'); }
  if (k.special) pop(R0, f.x, f.y - 10, k.special, k.skin === '#ffe680' ? '#ffd23f' : k.skin, true);
  else if (mult > 1) pop(R0, f.x, f.y - 8, '+2', '#ff8a1e');
  sfx('cut', R0);
}
function endCombo(R0) {
  if (R0.combo >= 3 && R0.mode !== 'demo') {
    R0.score += R0.combo; R0.best = Math.max(R0.best, R0.combo);
    pop(R0, S.W / 2, 70, 'COMBO X' + R0.combo + '  +' + R0.combo, '#ffd23f', true); sfx('combo', R0);
  }
  R0.combo = 0;
}
// one step of the world (dt: real seconds)
function step(R0, dt) {
  const real = dt;
  if (R0.slowT > 0) { R0.slowT -= real; dt *= SLOW; }
  if (R0.fireT > 0) R0.fireT -= real;
  if (R0.shake > 0) R0.shake -= real;
  if (R0.boomT > 0) R0.boomT -= real;
  if (R0.comboT > 0 && (R0.comboT -= real) <= 0) endCombo(R0);
  if (!R0.over) {
    R0.t += dt;
    if (R0.mode === 'timed') { R0.left -= real; if (R0.left <= 0) { R0.left = 0; R0.over = true; } }
    if ((R0.spawnT -= dt) <= 0) spawnWave(R0);
  }
  const W = S.W;
  for (const f of [...R0.fruit]) {
    f.vy += GRAV * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.a += f.va * dt;
    if (f.x < 14 || f.x > W - 14) f.vx = -f.vx * 0.6, f.x = clamp(f.x, 14, W - 14);
    if (f.vy > 0 && f.y > H + 30) {
      R0.fruit.splice(R0.fruit.indexOf(f), 1);
      const k = FRUITS[f.kind];
      if (R0.mode === 'lives' && !k.bomb && !k.special && !R0.over) {
        R0.lives--; R0.misses.push({ x: f.x, t: 0 }); sfx('miss');
        if (R0.lives <= 0) R0.dead = 'missed';
      }
    }
  }
  for (const h of [...R0.halves]) { h.vy += GRAV * dt; h.x += h.vx * dt; h.y += h.vy * dt; h.a += h.va * dt; if ((h.life -= dt) <= 0 || h.y > H + 30) R0.halves.splice(R0.halves.indexOf(h), 1); }
  for (const b of [...R0.bits]) { b.vy += GRAV * 0.6 * dt; b.x += b.vx * dt; b.y += b.vy * dt; if ((b.life -= dt) <= 0) R0.bits.splice(R0.bits.indexOf(b), 1); }
  for (const s of [...R0.splats]) if ((s.life -= real) <= 0) R0.splats.splice(R0.splats.indexOf(s), 1);
  for (const p of [...R0.pops]) if ((p.t += real) > 1.1) R0.pops.splice(R0.pops.indexOf(p), 1);
  for (const m of [...R0.misses]) if ((m.t += real) > 1.2) R0.misses.splice(R0.misses.indexOf(m), 1);
  if (R0.mode === 'lives' && R0.lives <= 0 && !R0.over) { R0.over = true; endCombo(R0); }
  if (R0.over && R0.mode !== 'demo') R0.overT += real;
}
// the blade: from (ax, ay) to (bx, by) in this frame; cuts what it crosses when fast enough
function slash(R0, ax, ay, bx, by, dt) {
  const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy);
  if (len / Math.max(dt, 0.001) < CUT_SPEED || len < 2) return;
  const wide = R0.fireT > 0 ? 6 : 0;
  for (const f of [...R0.fruit]) {
    // distance from the fruit's middle to the blade's line
    const t = clamp(((f.x - ax) * dx + (f.y - ay) * dy) / (len * len), 0, 1), px = ax + dx * t, py = ay + dy * t;
    if (Math.hypot(f.x - px, f.y - py) <= f.r + wide) cutFruit(R0, f, dx, dy);
  }
}
function finish(R0) {                              // the run is over: points, coins, stars, the best
  if (R0.done) return; R0.done = true;
  const m = R0.mode, old = save.best[m] | 0;
  R0.newBest = R0.score > old;
  if (R0.newBest) save.best[m] = R0.score;
  save.bestCombo = Math.max(save.bestCombo | 0, R0.best);
  R0.coins = Math.floor(R0.score / 4) + R0.gold;
  save.coins = (save.coins | 0) + R0.coins;
  R0.arcade = Math.min(STAR_MAX, Math.floor(R0.score / STAR_EVERY)) + R0.stars;
  if (R0.arcade > 0) PX.Wallet.add(R0.arcade);
  save.played = (save.played | 0) + 1;
  store();
  sfx(R0.newBest ? 'win' : 'over');
}

/* --- 4. DRAWING --------------------------------------------------------------- */
function drawPlace(t, R0) {
  const W = S.W, p = placeOf(save.place);
  if (p.id === 'dojo') {                         // wooden boards, a paper window, a lantern
    for (let i = 0; i * 22 < W; i++) { ctx.fillStyle = i & 1 ? '#3a2214' : '#43281a'; ctx.fillRect(i * 22, 0, 22, H); ctx.fillStyle = '#2a180e'; ctx.fillRect(i * 22, 0, 1, H); }
    for (let i = 0; i * 22 < W; i++) { ctx.fillStyle = '#2a180e'; ctx.fillRect(i * 22 + 6, 30 + (i * 37) % 160, 3, 1); }
    ctx.fillStyle = '#5a3a1e'; ctx.fillRect(0, H - 22, W, 22); ctx.fillStyle = '#6a4424'; ctx.fillRect(0, H - 22, W, 2);
    ctx.fillStyle = '#e8303a'; ctx.fillRect(W - 60, 52, 12, 16); ctx.fillStyle = '#ffd27a'; ctx.fillRect(W - 57, 55, 6, 10); ctx.fillStyle = '#2a180e'; ctx.fillRect(W - 55, 40, 2, 12);
  } else if (p.id === 'night') {

  help: [['STICK', 'MOVE THE BLADE'], ['A|RT', 'HOLD: SLICE'], ['START', 'PAUSE'], ['STICK|D-PAD', 'MENUS: PICK A BUTTON'], ['A', 'MENUS: OK'], ['B', 'MENUS: BACK']],
});
window.addEventListener('pointerdown', () => { padBlade.on = false; });
if (CHALLENGE) start('timed');                     // a tournament round: straight into 60 SECONDS
</script>
