<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Pixel GP: a pixel-art open-wheel racer. Race the rivals, drive freely, or race a friend online.">
<meta name="theme-color" content="#0d0b13">

  #code { position: fixed; display: none; box-sizing: border-box; text-align: center; text-transform: uppercase;
          font: bold 32px ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.3em; padding: 0 0 0 0.3em;
          color: #111; background: #fbf9f3; border: 3px solid #111; border-radius: 0; outline: none; }

<body>
<canvas id="screen"></canvas>
<input id="code" maxlength="4" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" inputmode="text" aria-label="Room code">
<script src="common.js"></script>
<script>
'use strict';
/* ==========================================================================
   PIXEL GP: a pseudo-3D pixel racer (part of the PIXEL ARCADE).
   The road is a list of short segments, each projected from 3D to the screen
   every frame, which makes a flat 2D game look 3D (like the old arcade racers).
     1. Setup        2. Track        3. Sprites      4. Race logic
     5. Drawing      6. Online       7. Screens      8. Main loop
   ========================================================================== */
const VERSION = '1.2.0';
let skyGrad = null, bgOffset = 0;   // sky gradient (rebuilt on resize) and how far the background has scrolled
const canvas = document.getElementById('screen');
const S = PX.makeScreen(canvas, { H: 240, minW: 400, maxW: 560, onResize: () => { skyGrad = null; } });
const ctx = S.ctx, H = S.H;
const UI = PX.makeUI(S, canvas);
const T = (str, x, y, color = '#fff', size = 1, align = 'left', shadow = null) => PX.drawText(ctx, str, x, y, color, size, align, shadow);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const fmt = t => { if (!isFinite(t) || t <= 0) return '--:--.-'; const m = Math.floor(t / 60), s = t % 60; return String(m).padStart(2, '0') + ':' + s.toFixed(1).padStart(4, '0'); };
const profile = PX.Profile.load();
const SAVE_KEY = 'pixelGP.save';
let save = { bestLap: 0, bestRace: 0, wins: 0, races: 0, music: true,
             tiers: {}, cars: ['classic'], car: 'classic', paints: [], paint: 'auto' };   // the garage
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY)) || {}); } catch (e) { /* new player */ }
const store = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* private mode */ } };
if (!save.tiers || typeof save.tiers !== 'object') save.tiers = {};
if (!Array.isArray(save.cars)) save.cars = ['classic'];
if (!Array.isArray(save.paints)) save.paints = [];

/* --- GARAGE: abilities, car designs and paint, bought with the arcade's ★ (shared with Mouse Thief) --- */
const ABILITIES = [
  { id: 'nitro', name: 'NITRO', color: '#2ad4c4', prices: [40, 90, 160], active: true, key: '1',
    stat: t => ({ uses: t }), desc: s => s.uses + ' BOOST' + (s.uses > 1 ? 'S' : '') + ' PER RACE' },
  { id: 'shield', name: 'SHIELD', color: '#58e0a0', prices: [60, 150], active: true, key: '2',
    stat: t => ({ uses: t }), desc: s => 'BLOCKS ' + s.uses + ' HIT' + (s.uses > 1 ? 'S' : '') },
  { id: 'armor', name: 'ARMOR', color: '#ff3b5a', prices: [80, 200],
    stat: t => ({ hp: 3 + t }), desc: s => s.hp + ' HEARTS' },
  { id: 'grip', name: 'GRIP', color: '#ffd23f', prices: [50, 110, 220],
    stat: t => ({ k: [0.8, 0.65, 0.5][t - 1] }), desc: s => Math.round((1 - s.k) * 100) + '% LESS SLIDING' },
  { id: 'magnet', name: 'MAGNET', color: '#9a5ae0', prices: [60, 140],
    stat: t => ({ w: [2, 3][t - 1] }), desc: s => 'GRABS STARS ' + s.w + 'X WIDER' },
];
const ABIL = Object.fromEntries(ABILITIES.map(a => [a.id, a]));
const tierOf = id => Math.max(0, Math.min(ABIL[id].prices.length, save.tiers[id] | 0));
const stat = id => tierOf(id) ? ABIL[id].stat(tierOf(id)) : null;
const CARS = [
  { id: 'classic', name: 'CLASSIC', price: 0 }, { id: 'stripe', name: 'STRIPE', price: 60 }, { id: 'checker', name: 'CHECKER', price: 90 },
  { id: 'flames', name: 'FLAMES', price: 140 }, { id: 'bolt', name: 'LIGHTNING', price: 180 }, { id: 'gold', name: 'GOLD', price: 300 },
];
const PAINTS = ['#e01e1e', '#ff8a1f', '#ffd23f', '#5ad43f', '#1f8a4a', '#2ad4c4', '#2a7fd4', '#1d3f8f', '#9a5ae0', '#ff6fb0', '#f2f2f2', '#3a3a46'];
const PAINT_PRICE = 25;
const myColor = () => save.paint !== 'auto' && save.paints.includes(save.paint) ? save.paint : PX.AVATAR_COLORS[profile.avatar.color] || '#2a7fd4';
const myCar = () => save.cars.includes(save.car) ? save.car : 'classic';

/* --- 1. SETUP --------------------------------------------------------------- */
const SEG = 200;                        // length of one road segment
const RUMBLE = 3;                       // segments per red/white rumble stripe
const ROAD_W = 2000;                    // half the road's width
const LANES = 3;
const CAM_H = 1000, FOV = 100, DRAW_DIST = 220, FOG = 5;
const CAM_DEPTH = 1 / Math.tan((FOV / 2) * Math.PI / 180);
const PLAYER_Z = CAM_H * CAM_DEPTH;     // how far in front of the camera your car is
const MAX_SPEED = SEG * 60;
const ACCEL = MAX_SPEED / 5, BRAKE = -MAX_SPEED, DECEL = -MAX_SPEED / 5;
const OFFROAD_DECEL = -MAX_SPEED / 2, OFFROAD_LIMIT = MAX_SPEED / 4, CENTRIFUGAL = 0.3;
const LAPS = 3;
const CAR_W = 520;                      // a car's width in road units
const COL = { grass: ['#3fae4a', '#36a041'], road: ['#6b6b73', '#64646c'], rumble: ['#e01e1e', '#f4f4f4'], lane: '#f4f4f4', fog: '#b8e0f4' };

/* --- 2. TRACK: built from straights, curves and hills ------------------------- */
let segments = [], trackLength = 0;
const lastY = () => segments.length ? segments[segments.length - 1].p2.world.y : 0;
function addSegment(curve, y) {
  const n = segments.length;
  segments.push({ index: n, curve, sprites: [], cars: [], dark: Math.floor(n / RUMBLE) % 2 === 1,
                  p1: { world: { y: lastY(), z: n * SEG }, camera: {}, screen: {} },
                  p2: { world: { y, z: (n + 1) * SEG }, camera: {}, screen: {} } });
}
const easeIn = (a, b, p) => a + (b - a) * p * p;
const easeInOut = (a, b, p) => a + (b - a) * (-Math.cos(p * Math.PI) / 2 + 0.5);
function addRoad(enter, hold, leave, curve, height) {
  const y0 = lastY(), y1 = y0 + height * SEG, total = enter + hold + leave;
  for (let n = 0; n < enter; n++) addSegment(easeIn(0, curve, n / enter), easeInOut(y0, y1, n / total));
  for (let n = 0; n < hold; n++) addSegment(curve, easeInOut(y0, y1, (enter + n) / total));
  for (let n = 0; n < leave; n++) addSegment(easeInOut(curve, 0, n / leave), easeInOut(y0, y1, (enter + hold + n) / total));
}
function rng(seed) { return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function buildTrack(seed = 1) {
  segments = [];
  addRoad(25, 25, 25, 0, 0);          // start / finish straight
  addRoad(30, 40, 30, 2, 20);         // sweeping right, uphill
  addRoad(25, 25, 25, 0, -10);
  addRoad(30, 30, 30, -3, 0);         // left
  addRoad(20, 20, 20, 2, 0);          // the esses
  addRoad(20, 20, 20, -2, 0);
  addRoad(20, 20, 20, 2, 10);
  addRoad(50, 50, 50, 0, -20);        // long straight, downhill
  addRoad(30, 50, 30, -4, 0);         // hairpin
  addRoad(25, 25, 25, 0, 30);         // the big hill
  addRoad(25, 25, 25, 0, -30);
  addRoad(30, 40, 30, 3, 0);          // right
  addRoad(20, 20, 20, -3, 15);        // a twisty climb
  addRoad(30, 30, 30, 3, -15);
  addRoad(40, 60, 40, 0, 0);          // back straight
  addRoad(25, 40, 25, -5, 0);         // the tight hairpin: brake!
  addRoad(30, 30, 30, 4, 20);
  addRoad(20, 20, 20, 0, -20);
  addRoad(25, 25, 25, 0, 0);
  addRoad(40, 40, 40, -2, -lastY() / SEG);   // back down to the start
  addRoad(25, 25, 25, 0, 0);
  for (const n of [2, 3]) segments[n].start = true;
  trackLength = segments.length * SEG;
  // scenery
  const r = rng(7);
  const put = (n, kind, offset) => { if (segments[n]) segments[n].sprites.push({ kind, offset }); };
  put(4, 'flag', -1.15); put(4, 'flag', 1.15);
  for (let n = 12; n < segments.length; n += 5) {
    if (r() < 0.7) put(n, r() < 0.8 ? 'tree' : 'bush', -(1.5 + r() * 2));
    if (r() < 0.7) put(n, r() < 0.8 ? 'tree' : 'bush', 1.5 + r() * 2);
  }
  for (let n = 40; n < segments.length - 20; n += 140) put(n, 'board', n % 280 ? 1.3 : -1.3);
  for (const s of segments) if (Math.abs(s.curve) > 2.5 && s.index % 4 === 0) put(s.index, 'tires', s.curve > 0 ? -1.15 : 1.15);   // outside of the tight corners
  // on the road: barrels, crates, cones and oil to dodge, now and then a wrench that repairs your car
  const o = rng(seed * 7919 + 13), LANE = [-0.62, 0, 0.62];
  for (let n = 90; n < segments.length - 40; n += 60 + Math.floor(o() * 60)) {   // about 1-2 seconds apart at full speed
    if ([0, 10, 20].some(k => Math.abs((segments[n + k] || segments[n]).curve) > 1.6)) { n -= 50; continue; }   // only on straights and gentle bends
    const r = o(), free = Math.floor(o() * 3);                  // one lane always stays free
    if (r < 0.12) { put(n, 'wrench', LANE[free]); continue; }
    if (r < 0.2) { const lane = Math.floor(o() * 3); for (let k = 0; k < 8; k++) put(n + k * 3, 'star', LANE[(lane + (k >> 2)) % 3]); continue; }   // a star trail
    if (r < 0.3) { put(n, 'oil', LANE[(free + 1 + Math.floor(o() * 2)) % 3]); continue; }
    if (r < 0.5) { const lane = LANE[(free + 1) % 3]; for (let k = 0; k < 3; k++) put(n + k * 3, 'cone', lane); continue; }
    const two = o() < 0.35;                                       // usually one lane blocked, sometimes two
    if (o() < 0.5) for (let k = 0; k < 5; k++) put(n + 14 + k * 3, 'star', LANE[free]);   // a row of stars in the free lane, after the obstacle
    for (let k = 0, placed = 0; k < 3; k++) if (k !== free && (placed === 0 || two)) { if (!two && o() < 0.5 && placed === 0 && k < 2) continue; put(n, o() < 0.5 ? 'barrel' : 'crate', LANE[k]); placed++; }
  }
}
const findSegment = z => segments[Math.floor(z / SEG) % segments.length];
const increase = (start, inc, max) => { let r = start + inc; while (r >= max) r -= max; while (r < 0) r += max; return r; };
const percentRemaining = (n, total) => (n % total) / total;

/* --- 3. SPRITES (pixel art drawn in code) ----------------------------------- */
function sprite(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d')); return c; }
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  return '#' + [n >> 16 & 255, n >> 8 & 255, n & 255].map(v => Math.min(255, Math.round(v * k)).toString(16).padStart(2, '0')).join('');
}
// An open-wheel race car seen from behind. turn: -1 left, 0 straight, 1 right.
const carCache = {};
function carSprite(color, turn = 0, deco = 'classic') {
  if (deco === 'gold') color = '#e0b030';
  const key = color + turn + deco;
  if (carCache[key]) return carCache[key];
  return (carCache[key] = sprite(36, 22, g => {
    const dark = '#16161c', tyre = '#111111', b = shade(color, 0.7), t = turn;
    g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(2, 19, 32, 3);                        // shadow
    for (const wx of [1, 27]) {                                                        // big rear tyres
      g.fillStyle = tyre; g.fillRect(wx + t, 8, 8, 12);
      g.fillStyle = '#2c2c34'; for (let y = 9; y < 20; y += 3) g.fillRect(wx + 1 + t, y, 6, 1);
    }
    g.fillStyle = color; g.fillRect(11 + t, 9, 14, 8); g.fillRect(9 + t, 11, 18, 5);   // body
    g.fillStyle = b; g.fillRect(9 + t, 15, 18, 1); g.fillRect(14 + t, 6, 8, 4);         // engine cover
    if (deco === 'stripe') { g.fillStyle = '#f4f4f4'; g.fillRect(17 + t, 6, 2, 11); }
    else if (deco === 'checker') { for (let y = 10; y < 16; y += 2) for (let x = 9; x < 27; x += 2) { g.fillStyle = ((x + y) >> 1) % 2 ? '#111' : '#f4f4f4'; g.fillRect(x + t, y, 2, 2); } }
    else if (deco === 'flames') { g.fillStyle = '#ffd23f'; g.fillRect(9 + t, 13, 4, 2); g.fillRect(23 + t, 13, 4, 2); g.fillStyle = '#ff5a1a'; g.fillRect(10 + t, 11, 3, 2); g.fillRect(23 + t, 11, 3, 2); g.fillRect(12 + t, 9, 2, 2); g.fillRect(22 + t, 9, 2, 2); }
    else if (deco === 'bolt') { g.fillStyle = '#ffd23f'; g.fillRect(14 + t, 9, 3, 2); g.fillRect(16 + t, 11, 3, 2); g.fillRect(18 + t, 13, 3, 2); }
    else if (deco === 'gold') { g.fillStyle = '#fff6c0'; g.fillRect(11 + t, 9, 2, 6); g.fillRect(13 + t, 9, 1, 2); }
    g.fillStyle = '#ffd23f'; g.fillRect(16 + t, 5, 4, 3);                               // helmet
    g.fillStyle = dark; g.fillRect(16 + t, 7, 4, 1);
    g.fillStyle = dark; g.fillRect(15 + t * 2, 3, 2, 4); g.fillRect(19 + t * 2, 3, 2, 4); // wing pillars
    g.fillStyle = dark; g.fillRect(4 + t * 2, 1, 28, 3);                                // rear wing
    g.fillStyle = color; g.fillRect(4 + t * 2, 1, 28, 1);
    g.fillStyle = dark; g.fillRect(3 + t * 2, 0, 2, 6); g.fillRect(31 + t * 2, 0, 2, 6);  // end plates
    g.fillStyle = '#ff3030'; g.fillRect(17 + t, 14, 2, 2);                              // rain light
    g.fillStyle = dark; g.fillRect(10 + t, 17, 16, 2);                                  // diffuser
  }));
}
const SPR = {
  tree: { w: 900, img: sprite(18, 28, g => {
    g.fillStyle = '#5a3a1e'; g.fillRect(8, 21, 3, 7);
    for (const [y0, h, w0] of [[0, 9, 8], [6, 9, 12], [12, 10, 16]]) for (let r = 0; r < h; r++) {
      const w = Math.round(w0 * (r + 1) / h) + 2; g.fillStyle = r % 3 ? '#1f7a34' : '#2a9a44'; g.fillRect(9 - (w >> 1), y0 + r, w, 1);
    }
  }) },
  bush: { w: 700, img: sprite(16, 9, g => { g.fillStyle = '#2a8a3a'; g.fillRect(1, 3, 14, 6); g.fillRect(3, 1, 10, 3); g.fillStyle = '#3fae4a'; g.fillRect(4, 2, 4, 2); }) },
  tires: { w: 520, img: sprite(12, 12, g => {
    for (const [x, y] of [[0, 6], [6, 6], [3, 0]]) { g.fillStyle = '#111'; g.fillRect(x, y, 6, 6); g.fillStyle = (x + y) % 12 ? '#f4f4f4' : '#e01e1e'; g.fillRect(x + 1, y + 2, 4, 2); }
  }) },
  flag: { w: 600, img: sprite(14, 32, g => {
    g.fillStyle = '#ddd'; g.fillRect(1, 0, 2, 32);
    for (let y = 0; y < 4; y++) for (let x = 0; x < 5; x++) { g.fillStyle = (x + y) % 2 ? '#111' : '#fff'; g.fillRect(3 + x * 2, 1 + y * 2, 2, 2); }
  }) },
  // things on the road (road: true): hit one and your car takes damage
  barrel: { w: 380, road: true, img: sprite(12, 15, g => {
    g.fillStyle = '#111'; g.fillRect(0, 0, 12, 15);
    g.fillStyle = '#d42020'; g.fillRect(1, 1, 10, 13); g.fillStyle = '#ff5a3a'; g.fillRect(2, 2, 2, 11);
    g.fillStyle = '#f4f4f4'; g.fillRect(1, 4, 10, 2); g.fillRect(1, 10, 10, 2);
  }) },
  crate: { w: 440, road: true, img: sprite(13, 13, g => {
    g.fillStyle = '#3a2410'; g.fillRect(0, 0, 13, 13); g.fillStyle = '#b07a3a'; g.fillRect(1, 1, 11, 11);
    g.fillStyle = '#7a4a1e'; for (let i = 1; i < 12; i++) { g.fillRect(i, i, 1, 1); g.fillRect(12 - i, i, 1, 1); } g.fillRect(1, 1, 11, 1); g.fillRect(1, 11, 11, 1);
  }) },
  cone: { w: 250, road: true, img: sprite(9, 12, g => {
    g.fillStyle = '#111'; g.fillRect(0, 10, 9, 2);
    for (let y = 0; y < 10; y++) { const w = 1 + Math.floor(y * 0.7); g.fillStyle = y === 4 || y === 5 ? '#f4f4f4' : '#ff7a1a'; g.fillRect(4 - (w >> 1), y, w + 1, 1); }
    g.fillStyle = '#ff7a1a'; g.fillRect(0, 10, 9, 1);
  }) },
  oil: { w: 900, road: true, flat: true, img: sprite(28, 7, g => {
    g.fillStyle = '#111118'; g.fillRect(3, 0, 22, 7); g.fillRect(0, 2, 28, 3);
    g.fillStyle = '#4a3a6a'; g.fillRect(8, 2, 6, 1); g.fillStyle = '#2a6a7a'; g.fillRect(16, 3, 5, 1);
  }) },
  wrench: { w: 420, road: true, img: sprite(13, 13, g => {
    g.fillStyle = '#111'; g.fillRect(0, 0, 13, 13); g.fillStyle = '#ffd23f'; g.fillRect(1, 1, 11, 11);
    g.fillStyle = '#3a3a46'; g.fillRect(3, 8, 2, 2); g.fillRect(4, 7, 2, 2); g.fillRect(5, 6, 2, 2); g.fillRect(6, 5, 2, 2);
    g.fillRect(7, 3, 3, 2); g.fillRect(8, 2, 1, 1); g.fillRect(9, 5, 1, 1);
  }) },
  star: { w: 330, road: true, img: sprite(11, 11, g => {
    const rows = ['....#....', '....#....', '...###...', '#########', '.#######.', '..#####..', '.###.###.', '.##...##.', '#.......#'];
    g.fillStyle = '#7a5a10'; rows.forEach((row, y) => [...row].forEach((c, x) => { if (c === '#') g.fillRect(x + 1, y + 2, 1, 1); }));
    rows.forEach((row, y) => [...row].forEach((c, x) => { if (c === '#') { g.fillStyle = y < 3 ? '#fff6c0' : '#ffd23f'; g.fillRect(x + 1, y + 1, 1, 1); } }));
  }) },
  board: { w: 2600, img: sprite(48, 28, g => {
    g.fillStyle = '#3a3a46'; g.fillRect(8, 18, 3, 10); g.fillRect(37, 18, 3, 10);
    g.fillStyle = '#111'; g.fillRect(0, 0, 48, 19); g.fillStyle = '#e01e1e'; g.fillRect(1, 1, 46, 17);
    PX.drawText(g, 'PIXEL', 24, 3, '#fff', 1, 'center'); PX.drawText(g, 'GP', 24, 10, '#ffd23f', 1, 'center');
  }) },
};

/* --- 4. RACE LOGIC ------------------------------------------------------------ */
let state = 'title';          // title | race | result | garage
let mode = 'race';            // race (vs rivals) | free (just drive) | mp (vs a friend)
let race = null, attract = null, paused = false;
const keys = {};
const RIVAL_PACE = [0.99, 0.97, 0.95, 0.93, 0.91];
const RIVAL_COLORS = ['#e01e1e', '#ffd23f', '#5ad43f', '#9a5ae0', '#2ad4c4', '#f2f2f2', '#ff8a1f', '#2a7fd4'];
// rival colors that don't look like your car
function rivalColors() {
  const mine = PX.AVATAR_COLORS[profile.avatar.color] || '#2a7fd4', rgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
  const far = c => { const a = rgb(c), b = rgb(mine); return Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]) > 110; };
  return RIVAL_COLORS.filter(far).slice(0, 5);
}
function newDriver() {
  const armor = stat('armor');
  return { x: 0, speed: 0, position: 0, dist: 0, lapStart: 0, lap: 1, lapTime: 0, lastLap: 0, bestLap: 0, time: 0, turn: 0, bump: 0, offroad: false,
           hp: armor ? armor.hp : 3, maxHp: armor ? armor.hp : 3, spin: 0, hurtT: 0, smokeT: 0, nitroT: 0, shieldOn: false };
}
const HP = 3;
function startRace(m, seed) {
  if (seed === undefined) seed = 1 + Math.floor(Math.random() * 100000);
  buildTrack(seed); mode = m; paused = false;
  const p = newDriver();
  race = { p, cars: [], countdown: 3.6, over: false, place: 0, banner: null, ghost: null, result: null, msgT: 0, fx: [], shake: 0, flash: 0, seed,
           stars: 0, uses: { nitro: stat('nitro') ? stat('nitro').uses : 0, shield: stat('shield') ? stat('shield').uses : 0 } };
  Music.play('race');
  if (m === 'race') rivalColors().forEach((color, i) => {   // you start at the back of the grid
    const z = PLAYER_Z + 300 + (4 - i) * 360, car = { color, offset: i % 2 ? 0.45 : -0.45, z, dist: z - PLAYER_Z, speed: 0, pace: RIVAL_PACE[i], finished: 0 };
    race.cars.push(car); findSegment(car.z).cars.push(car);
  });
  race.place = 1 + race.cars.length + (m === 'mp' ? 1 : 0);
  if (m === 'mp') race.ghost = { dist: 0, x: 0, speed: 0, fin: 0, t: 0 };
  state = 'race'; PX.Sound.unlock(); Engine.on();
}

const seq = str => str.trim().split(/\s+/).map(v => v === '.' ? 0 : +v);

  race: { bpm: 140, leadType: 'square', vol: 0.07, drums: true, roots: [45, 48, 41, 43, 45, 48, 41, 40], lead: seq(`

         69 . . . 71 . 72 . 74 . 72 . 71 . 67 .
         76 . . 76 . 74 . 76 . 79 . . 76 . 74 .
         72 . . 72 . 71 . 72 . 76 . . 72 . 71 .
         69 . . 69 . 67 . 69 . 72 . 74 . 76 . .
         74 . 72 . 71 . 67 . 69 . . . . . . .`) },
  menu: { bpm: 100, leadType: 'triangle', vol: 0.13, drums: false, roots: [48, 43, 45, 43], lead: seq(`
         72 . . 76 . . 79 . . . 76 . 74 . . .
         71 . . 74 . . 79 . . . 77 . 76 . 74 .

         71 . . 72 . . 74 . . . 67 . . . . .`) },

  stop() { this.track = null; },

  },
  tick() {
    const c = PX.Sound.ctx; if (!c || !this.track || c.state !== 'running') return;

/* --- 6. ONLINE: race a friend (the same free PeerJS server as Mouse Thief) ---------- */
const Net = {
  peer: null, conn: null, live: false, isHost: false, code: '', screen: 'home', msg: '', friend: null, sendT: 0, wait: false,
  reset() { try { if (this.peer) this.peer.destroy(); } catch (e) { /* gone */ } this.peer = null; this.conn = null; this.live = false; this.code = ''; this.friend = null; this.screen = 'home'; this.msg = ''; },
  fail(msg) { this.reset(); this.screen = 'error'; this.msg = msg; },
  opts() { return { debug: 0, config: { iceServers: PX.ICE_SERVERS } }; },
  async host() {
    this.reset(); this.isHost = true; this.screen = 'connecting'; this.msg = 'CREATING A GAME';
    try { await PX.loadPeer(); } catch (e) { return this.fail("COULDN'T LOAD ONLINE PLAY. CHECK YOUR INTERNET."); }
    const open = attempt => {
      let code = ''; for (let i = 0; i < 4; i++) code += PX.CODE_CHARS[Math.floor(Math.random() * PX.CODE_CHARS.length)];
      const peer = new Peer('pixel-gp-room-' + code, this.opts()); this.peer = peer;
      peer.on('open', () => { this.code = code; this.screen = 'hosting'; this.msg = ''; });
      peer.on('connection', c => { if (this.live) { c.close(); return; } this.bind(c); });
      peer.on('disconnected', () => { if (this.peer === peer && !peer.destroyed) peer.reconnect(); });
      peer.on('error', e => { if (e.type === 'unavailable-id' && attempt < 3) { peer.destroy(); open(attempt + 1); } else if (!this.live && e.type !== 'network') this.fail("CAN'T REACH THE GAME SERVER. CHECK YOUR INTERNET."); });
    };
    open(0);
  },
  async join(code) {
    this.reset(); this.isHost = false; this.screen = 'connecting'; this.msg = 'CONNECTING TO ' + code;
    try { await PX.loadPeer(); } catch (e) { return this.fail("COULDN'T LOAD ONLINE PLAY. CHECK YOUR INTERNET."); }
    const peer = new Peer(this.opts()); this.peer = peer;
    peer.on('open', () => this.bind(peer.connect('pixel-gp-room-' + code, { reliable: true, serialization: 'json' })));
    peer.on('error', e => { if (!this.live) this.fail(e && e.type === 'peer-unavailable' ? 'NO GAME WITH THAT CODE.' : "COULDN'T CONNECT. TRY AGAIN."); });
    setTimeout(() => { if (!this.live && this.screen === 'connecting') this.fail("COULDN'T REACH YOUR FRIEND'S PHONE. TRY THE SAME WI-FI."); }, 25000);
  },
  joinTyped() { if (codeInput.value.length === 4) { codeInput.blur(); this.join(codeInput.value); } },
  bind(c) {
    this.conn = c;
    c.on('open', () => { this.live = true; this.screen = 'lobby'; this.send({ t: 'me', name: profile.name, av: profile.avatar, car: { c: myColor(), d: myCar() }, v: VERSION }); PX.Sound.tone([523, 784], 0.2); });
    c.on('data', m => this.onData(m));
    c.on('close', () => this.lost());
  },
  lost() { if (!this.live) return; this.live = false; this.conn = null; if (state !== 'race') { this.screen = 'error'; this.msg = 'YOUR FRIEND LEFT.'; } },
  leave() { this.send({ t: 'bye' }); this.live = false; setTimeout(() => this.reset(), 150); },
  send(m) { if (this.conn && this.conn.open) try { this.conn.send(m); } catch (e) { /* closing */ } },
  sendPos(p) { const now = performance.now(); if (now - this.sendT < 50) return; this.sendT = now; this.send({ t: 'p', d: Math.round(p.dist), x: Math.round(p.x * 100) / 100, s: Math.round(p.speed) }); },
  start() { const seed = 1 + Math.floor(Math.random() * 100000); this.send({ t: 'go', seed }); startRace('mp', seed); },
  onData(m) {
    switch (m.t) {
      case 'me':
        if (m.v !== VERSION) { this.fail('YOUR FRIEND HAS V' + m.v + ', YOU HAVE V' + VERSION + '. RELOAD BOTH.'); break; }
        this.friend = { name: PX.cleanName(m.name) || 'FRIEND', av: m.av, car: m.car && /^#[0-9a-f]{6}$/i.test(m.car.c) && CARS.some(k => k.id === m.car.d) ? m.car : null };
        break;
      case 'go': startRace('mp', m.seed); break;
      case 'wreck': if (race && race.ghost) race.ghost.wrecked = true; break;
      case 'p': if (race && race.ghost) { race.ghost.dist = m.d; race.ghost.x = m.x; race.ghost.speed = m.s; } break;
      case 'fin': if (race && race.ghost) race.ghost.fin = m.tm; break;
      case 'bye': this.lost(); break;
    }
  },
};

    case 'error':
      T(Net.msg, cx, y + 50, '#ff6b6b', 1, 'center');
      back(y + 100, 'OK');
      break;
  }
}
function drawResult() {
  const W = S.W, R = race, r = R.result || {};
  drawWorld(R, W);
  const { x, y } = drawPanel(280, 150), cx = W / 2;
  if (r.wrecked) T('WRECKED!', cx, y + 12, '#ff6b6b', 3, 'center');
  else if (mode === 'mp') T(r.won ? 'YOU WIN!' : (Net.friend ? Net.friend.name : 'FRIEND') + ' WINS!', cx, y + 12, r.won ? '#5ad43f' : '#ff6b6b', 3, 'center');
  else T(r.place === 1 ? 'YOU WIN!' : r.place === 2 ? '2ND PLACE!' : r.place === 3 ? '3RD PLACE!' : r.place + 'TH PLACE', cx, y + 12, r.place === 1 ? '#ffd23f' : '#fff', 3, 'center');
  if (mode === 'race' && r.place === 1 && !r.wrecked) T('★ ★ ★', cx, y + 34, '#ffd23f', 2, 'center');
  if (r.wrecked) T(mode === 'mp' ? (Net.friend ? Net.friend.name : 'FRIEND') + ' WINS' : 'OUT ON LAP ' + Math.min(r.lap, mode === 'free' ? 99 : LAPS), cx, y + 34, '#efe9ff', 2, 'center');
  T('TIME', x + 30, y + 52, '#efe9ff', 2); T(fmt(r.time), x + 250, y + 52, '#fff', 2, 'right');
  T('BEST LAP', x + 30, y + 72, '#efe9ff', 2); T(fmt(R.p.bestLap), x + 250, y + 72, '#efe9ff', 2, 'right');
  T('STARS', x + 30, y + 92, '#efe9ff', 2); T('★ +' + (R.stars + (r.bonus || 0)), x + 250, y + 92, '#ffd23f', 2, 'right');
  const bw = 110;
  if (mode === 'mp') {
    if (Net.live && Net.isHost) { if (UI.button('again', Math.round(cx - bw - 4), y + 112, bw, 24, 'REMATCH', { accent: '#e01e1e' })) Net.start(); }
    else T(Net.live ? 'WAITING FOR A REMATCH...' : 'YOUR FRIEND LEFT', cx - 60, y + 120, '#efe9ff', 1, 'center');
  } else if (UI.button('again', Math.round(cx - bw - 4), y + 112, bw, 24, 'RACE AGAIN', { accent: '#e01e1e' })) startRace(mode);
  if (UI.button('menu', Math.round(cx + 4), y + 112, bw, 24, 'MENU') || UI.back) toTitle();
}
// A note icon: tap to switch the music on / off.
function musicButton(x, y) {
  if (UI.button('music', x, y, 22, 20, '')) { save.music = !save.music; store(); Music.bus(); }
  ctx.fillStyle = save.music ? '#efe9ff' : '#5b5275';
  ctx.fillRect(x + 7, y + 12, 4, 3); ctx.fillRect(x + 10, y + 4, 1, 9); ctx.fillRect(x + 11, y + 4, 4, 2); ctx.fillRect(x + 14, y + 6, 1, 2);
  if (!save.music) { ctx.fillStyle = '#e01e1e'; for (let i = 0; i < 14; i++) ctx.fillRect(x + 4 + i, y + 3 + i, 2, 1); }
}
/* --- GARAGE ------------------------------------------------------------------------- */
let garageTab = 'abil', garageMsg = { text: '', t: 0 };
function buy(price, then) {
  if (!PX.Wallet.spend(price)) { PX.Sound.tone(150, 0.2); garageMsg = { text: 'NEED ' + (price - PX.Wallet.get()) + ' MORE ★', t: 2 }; return; }
  then(); store(); PX.Sound.tone([523, 784, 1047], 0.3, { vol: 0.12 });
}
function drawGarage() {
  const W = S.W;
  drawWorld({ p: attract, cars: [] }, W);
  ctx.fillStyle = 'rgba(8,6,14,0.75)'; ctx.fillRect(0, 0, W, H);
  T('GARAGE', 10, 8, '#fff', 3, 'left', '#000');
  T('★ ' + PX.Wallet.get(), W - 10, 10, '#ffd23f', 2, 'right', '#000');
  const tabs = [['abil', 'ABILITIES'], ['cars', 'CARS'], ['paint', 'PAINT']], tw = 96;
  tabs.forEach(([id, label], i) => { if (UI.button('tab_' + id, Math.round(W / 2 - 150 + i * 102), 32, tw, 18, label, { on: garageTab === id, accent: '#ffd23f' })) garageTab = id; });
  if (garageTab === 'abil') ABILITIES.forEach((a, i) => {
    const y = 58 + i * 30, t = tierOf(a.id), max = a.prices.length;
    ctx.fillStyle = 'rgba(29,24,48,0.9)'; ctx.fillRect(10, y, W - 20, 26);
    ctx.fillStyle = a.color; ctx.fillRect(10, y, 3, 26);
    T(a.name, 20, y + 4, '#fff', 2);
    for (let k = 0; k < max; k++) { ctx.fillStyle = '#111'; ctx.fillRect(20 + PX.textWidth(a.name, 2) + 8 + k * 9, y + 5, 7, 7); ctx.fillStyle = k < t ? a.color : '#3a2f5c'; ctx.fillRect(21 + PX.textWidth(a.name, 2) + 8 + k * 9, y + 6, 5, 5); }
    T(a.desc(a.stat(Math.max(1, t))), 20, y + 17, '#9a92b8', 1);
    if (UI.button('buy_' + a.id, W - 100, y + 4, 86, 18, t >= max ? 'MAX' : '★ ' + a.prices[t], { size: 2, disabled: t >= max, accent: a.color })) buy(a.prices[t], () => { save.tiers[a.id] = t + 1; });
  });
  if (garageTab === 'cars') CARS.forEach((c, i) => {
    const cw = Math.floor((W - 40) / 3), x = 10 + (i % 3) * (cw + 10), y = 58 + Math.floor(i / 3) * 78, owned = save.cars.includes(c.id), on = myCar() === c.id;
    ctx.fillStyle = on ? '#3a2f5c' : 'rgba(29,24,48,0.9)'; ctx.fillRect(x, y, cw, 72);
    ctx.drawImage(carSprite(myColor(), 0, c.id), Math.round(x + cw / 2 - 36), y + 4, 72, 44);
    if (!owned) { if (UI.button('car_' + c.id, x + 6, y + 50, cw - 12, 18, '★ ' + c.price, { accent: '#ffd23f' })) buy(c.price, () => { save.cars.push(c.id); save.car = c.id; }); }
    else if (UI.button('car_' + c.id, x + 6, y + 50, cw - 12, 18, on ? 'DRIVING' : c.name, { on, accent: '#5ad43f', size: on ? 2 : 1 }) && !on) { save.car = c.id; store(); }
  });
  if (garageTab === 'paint') {
    ctx.drawImage(carSprite(myColor(), 0, myCar()), Math.round(W / 2 - 54), 54, 108, 66);
    const sw = 26, cols = 7, x0 = Math.round(W / 2 - (cols * (sw + 6) - 6) / 2);
    ['auto', ...PAINTS].forEach((col, i) => {
      const x = x0 + (i % cols) * (sw + 6), y = 128 + Math.floor(i / cols) * (sw + 14), owned = col === 'auto' || save.paints.includes(col), on = save.paint === col || (col === 'auto' && !save.paints.includes(save.paint));
      if (UI.button('paint_' + i, x, y, sw, sw, '', { on, accent: '#ffd23f' })) {
        if (owned) { save.paint = col; store(); PX.Sound.tone(700, 0.05); } else buy(PAINT_PRICE, () => { save.paints.push(col); save.paint = col; });
      }
      ctx.fillStyle = col === 'auto' ? PX.AVATAR_COLORS[profile.avatar.color] : col; ctx.fillRect(x + 4, y + 4, sw - 8, sw - 8);
      if (col === 'auto') PX.drawAvatar(ctx, profile.avatar, x + 6, y + 6, 1, null);
      if (!owned) T('★' + PAINT_PRICE, x + sw / 2, y + sw + 2, '#ffd23f', 1, 'center', '#000');
      if (on) { ctx.fillStyle = '#ffd23f'; ctx.fillRect(x, y + sw + 2, sw, 2); }
    });
  }
  if ((garageMsg.t -= 1 / 60) > 0) T(garageMsg.text, W / 2 + 10, 12, '#ff6b6b', 2, 'center', '#000');
  if (UI.button('gback', Math.round(W / 2 - 60), H - 26, 120, 22, 'BACK') || UI.back) state = 'title';
}
function drawPause() {
  const W = S.W, { y } = drawPanel(200, 130), bw = 150, bx = Math.round(W / 2 - bw / 2);
  T('PAUSED', W / 2, y + 12, '#fff', 3, 'center');
  if (UI.button('resume', bx, y + 40, bw, 22, 'RESUME', { accent: '#5ad43f' }) || UI.back) setPause(false);
  if (UI.button('restart', bx, y + 68, bw, 22, 'RESTART')) startRace(mode);
  if (UI.button('quit', bx, y + 96, bw, 22, 'MENU')) toTitle();
}
function toTitle() {
  if (mode === 'mp' && Net.live) { Net.screen = 'lobby'; }
  state = 'title'; paused = false; race = null; attract = null; Engine.off(); Ctl.ptrs.clear(); Ctl.sync(); Music.play('menu');
}

/* --- 8. MAIN LOOP ------------------------------------------------------------- */
const STEP = 1 / 60;
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  UI.begin();
  if (state === 'title') { attractMode(dt); drawTitle(); }
  else if (state === 'race') {
    if (!paused) { acc += dt; while (acc >= STEP) { updateRace(STEP); acc -= STEP; } } else acc = 0;
    const sh = race.shake > 0.5 ? race.shake : 0;
    ctx.save(); if (sh) ctx.translate(Math.round((Math.random() - 0.5) * sh), Math.round((Math.random() - 0.5) * sh));
    drawWorld(race, S.W); ctx.restore();
    drawHUD(race, S.W);
    if (paused) drawPause();
  } else if (state === 'result') drawResult();
  else if (state === 'garage') { attractMode(dt); drawGarage(); }
  if (!(state === 'title' && Net.screen === 'join')) codeInput.style.display = 'none';
  UI.end();
  S.blit();
  requestAnimationFrame(frame);
}
buildTrack();
requestAnimationFrame(frame);
</script>
