'use strict';
/* ==========================================================================
   PIXEL HORDE: survive the horde (part of the PIXEL ARCADE).
   You only walk: your weapons fire by themselves. Monsters come from every side,
   more and stronger every minute. Pick up the gems they drop; every level you
   pick 1 of 3: a new weapon, a better weapon, or a passive. A weapon at level 5
   with its partner passive EVOLVES. Survive 10 minutes and beat the final boss.
   Gold from every run (win or lose) buys upgrades that stay, heroes and maps.
     1. Setup   2. Weapons and passives   3. Monsters   4. The run   5. Drawing   6. Screens   7. Sound   8. Input   9. Main loop
   ========================================================================== */

/* --- 1. SETUP --------------------------------------------------------------- */
const VERSION = '1.0.0';

const NEW_SAVE = () => ({ gold: 0, meta: {}, heroes: { knight: 1, mage: 1 }, maps: 1, best: {}, kills: 0, ach: {}, sfx: true, music: true, runs: 0, goldAll: 0, hero: 'knight', map: 0, evos: {} });
let save = NEW_SAVE();
try { save = Object.assign(NEW_SAVE(), JSON.parse(localStorage.getItem(SAVE_KEY)) || {}); } catch (e) { /* new player */ }

const profile = PX.Profile.get();

const S = PX.makeScreen(canvas, { H: 240, minW: 400, maxW: 560 });
const ctx = S.ctx, H = S.H;
const UI = PX.makeUI(S, canvas);
const T = (str, x, y, color = '#fff', size = 1, align = 'left', shadow = null) => PX.drawText(ctx, str, x, y, color, size, align, shadow);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rnd = (a, b) => a + Math.random() * (b - a);
const hash = (a, b = 0) => { let h = (a * 374761393 + b * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
const OUT = '#0b0614';
const RUN_TIME = 600;          // 10 minutes, then the final boss

const META = [
  ['might', 'MIGHT', '+5% DAMAGE', 5, 120], ['hp', 'MAX HP', '+10% HP', 5, 100], ['armor', 'ARMOR', '-1 DAMAGE TAKEN', 3, 300], ['speed', 'SPEED', '+5% SPEED', 5, 120],
  ['magnet', 'MAGNET', '+15% PICKUP RANGE', 5, 80], ['growth', 'GROWTH', '+5% XP', 5, 150], ['greed', 'GREED', '+10% GOLD', 5, 150], ['haste', 'COOLDOWN', 'WEAPONS 3% FASTER', 5, 200],
  ['revive', 'REVIVE', 'COME BACK ONCE A RUN', 1, 1500], ['reroll', 'REROLL', '+1 REROLL OF THE CHOICES', 3, 400],
];
const metaCost = (m, lvl) => Math.round(m[4] * Math.pow(1.7, lvl) / 10) * 10;
const ACH = [
  ['m1', 'SURVIVE 1 MINUTE', r => r.t >= 60], ['m5', 'SURVIVE 5 MINUTES', r => r.t >= 300], ['k500', 'DEFEAT 500 IN ONE RUN', r => r.kills >= 500],
  ['k2000', 'DEFEAT 2000 IN ONE RUN', r => r.kills >= 2000], ['l20', 'REACH LEVEL 20', r => r.lvl >= 20], ['l40', 'REACH LEVEL 40', r => r.lvl >= 40],
  ['evo', 'EVOLVE A WEAPON', r => r.evos > 0], ['evo3', 'EVOLVE 3 WEAPONS IN ONE RUN', r => r.evos >= 3], ['boss', 'BEAT THE MID BOSS', r => r.bosses >= 1],
  ['win0', 'WIN GREEN MEADOW', r => r.won && r.map === 0], ['win1', 'WIN HAUNTED GRAVEYARD', r => r.won && r.map === 1], ['win2', 'WIN LAVA LANDS', r => r.won && r.map === 2],
  ['nohit', 'SURVIVE 3 MINUTES WITHOUT A HIT', r => r.cleanT >= 180], ['rich', 'PICK UP 300 GOLD IN ONE RUN', r => r.gold >= 300],
];

/* --- 3. MONSTERS ---------------------------------------------------------------------- */
// pixel art: '#' body, 'd' dark, 'w' white, 'k' black, 'r' red, 'y' yellow
const FOES = {
  blob: { hp: 9, spd: 30, dmg: 5, xp: 1, r: 5, pal: { '#': '#5ad43f', d: '#2a8a2a' }, art: ['..........', '...####...', '..######..', '.##w##w##.', '.##k##k##.', '.########.', '.########.', '.#d####d#.', '..dd..dd..'] },
  bat: { hp: 6, spd: 50, dmg: 4, xp: 1, r: 4, wob: 1, pal: { '#': '#7a3fc4', d: '#4a1a8a' }, art: ['#........#', '##......##', '###.##.###', '.###rr###.', '..######..', '...#dd#...', '....##....'] },
  skel: { hp: 20, spd: 36, dmg: 7, xp: 2, r: 5, pal: { '#': '#e8e4dc', d: '#a8a49c' }, art: ['...####...', '..######..', '..#kk#k#..', '..######..', '...#dd#...', '.########.', '...####...', '..#.##.#..', '...#..#...', '..##..##..'] },
  ghost: { hp: 16, spd: 42, dmg: 6, xp: 2, r: 5, ghost: 1, pal: { '#': '#d8e8ff', d: '#9ab0d8' }, art: ['...####...', '..######..', '.##k##k##.', '.##k##k##.', '.########.', '.###dd###.', '.########.', '.##.##.##.', '.#..#...#.'] },
  brute: { hp: 70, spd: 24, dmg: 12, xp: 6, r: 8, pal: { '#': '#c86a3a', d: '#8a4020' }, art: ['....####....', '...######...', '..##r##r##..', '..########..', '.###dddd###.', '############', '##.######.##', '##.######.##', '...######...', '...##..##...', '..###..###..'] },
  eye: { hp: 24, spd: 26, dmg: 6, xp: 3, r: 6, shoot: 1, pal: { '#': '#e01e5a', d: '#8a0a2a' }, art: ['...####...', '.########.', '##wwwwww##', '#wwwkkwww#', '#wwkkkkww#', '#wwwkkwww#', '##wwwwww##', '.########.', '..d.dd.d..'] },
  boss: { hp: 900, spd: 30, dmg: 20, xp: 80, r: 14, boss: 1, pal: { '#': '#9a2ad4', d: '#5a0a8a' }, art: ['....y..y..y....', '....yyyyyyy....', '...#########...', '..###########..', '.###ww###ww###.', '.###wr###wr###.', '###############', '###kkkkkkkkk###', '###kwkwkwkwk###', '.#############.', '..###########..', '..##d##.##d##..', '.###d##.##d###.', '.##.......d.##.'] },
};
const sprites = {};
function sprite(type, flash, flip) {
  const key = type + (flash ? 'f' : '') + (flip ? 'x' : ''); if (sprites[key]) return sprites[key];
  const f = FOES[type], w = Math.max(...f.art.map(r => r.length)), h = f.art.length;
  const pal = Object.assign({ w: '#ffffff', k: '#0b0614', r: '#ff2a2a', y: '#ffd23f' }, f.pal);
  const c = document.createElement('canvas'); c.width = w + 2; c.height = h + 2; const g = c.getContext('2d');
  const px = (x, y, col) => { g.fillStyle = col; g.fillRect((flip ? w - 1 - x : x) + 1, y + 1, 1, 1); };
  f.art.forEach((row, y) => [...row].forEach((ch, x) => { if (ch !== '.') for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) { const xx = (flip ? w - 1 - x : x) + 1 + dx, yy = y + 1 + dy; g.fillStyle = OUT; g.fillRect(xx, yy, 1, 1); } }));
  f.art.forEach((row, y) => [...row].forEach((ch, x) => { if (ch !== '.') px(x, y, flash ? '#ffffff' : pal[ch] || '#f0f'); }));
  sprites[key] = c; return c;
}

/* --- 4. THE RUN ----------------------------------------------------------------------- */
let R = null;
const metaL = id => save.meta[id] | 0;
function stats() {                                   // what your hero can do now: hero + gold upgrades + passives
  const h = HEROES.find(q => q.id === R.hero), m = h.mod, p = R.pas;
  R.S = {
    might: (1 + metaL('might') * 0.05 + (p.might | 0) * 0.1 + (m.might || 0)),
    cd: 1 / (1 + metaL('haste') * 0.03 + (p.haste | 0) * 0.08 + (m.haste || 0)),
    area: 1 + (p.area | 0) * 0.1 + (m.area || 0),
    speed: 64 * (1 + metaL('speed') * 0.05 + (p.speed | 0) * 0.08 + (m.speed || 0)),
    maxHp: Math.round(100 * (1 + metaL('hp') * 0.1 + (p.vit | 0) * 0.2 + (m.hp || 0))),
    armor: metaL('armor') + (p.armor | 0) + (m.armor || 0),
    magnet: 34 * (1 + metaL('magnet') * 0.15 + (p.magnet | 0) * 0.35),
    growth: 1 + metaL('growth') * 0.05, greed: 1 + metaL('greed') * 0.1,
  };
}
function newRun(heroId, map) {
  const h = HEROES.find(q => q.id === heroId);
  R = { hero: heroId, map, t: 0, x: 0, y: 0, hp: 100, face: 1, mx: 0, my: 0, inv: 0, lvl: 1, xp: 0, next: 5, kills: 0, gold: 0,
    weapons: [], pas: {}, foes: [], shots: [], eshots: [], gems: [], drops: [], fx: [], texts: [], spawnAcc: 0, nextElite: 60, boss1: false, boss2: false,
    pending: 0, choice: null, later: [], over: false, won: false, rerolls: metaL('reroll'), revive: metaL('revive'), evos: 0, bosses: 0, cleanT: 0, shake: 0, walkT: 0, swarmAt: [120, 240, 420, 520], dead: 0, overT: 0, newAch: [], hitSnd: 0, gemSnd: 0, gemPitch: 0 };
  stats(); R.hp = R.S.maxHp;
  addWeapon(h.start);
}
function addWeapon(id) { R.weapons.push({ id, lvl: 1, cd: 0.3, evo: false, a: 0 }); }
const wLvl = id => { const w = R.weapons.find(q => q.id === id); return w ? (w.evo ? 6 : w.lvl) : 0; };
function choices() {                                 // 3 things to pick from at a level up
  const pool = [];
  for (const w of R.weapons) {
    const W = WEAPONS[w.id];
    if (!w.evo && w.lvl >= 5 && (R.pas[W.partner] | 0) > 0) pool.push({ kind: 'evo', id: w.id, wt: 100 });
    else if (w.lvl < 5) pool.push({ kind: 'w', id: w.id, wt: 3 });
  }
  if (R.weapons.length < 5) for (const id in WEAPONS) if (!R.weapons.some(w => w.id === id)) pool.push({ kind: 'w', id, wt: 1.6 });
  const npas = Object.keys(R.pas).length;
  for (const id in PASSIVES) { const l = R.pas[id] | 0; if (l < 5 && (l > 0 || npas < 5)) pool.push({ kind: 'p', id, wt: l ? 2 : 1.2 }); }
  const out = [];
  while (out.length < 3 && pool.length) {
    let tot = pool.reduce((a, q) => a + q.wt, 0), r = Math.random() * tot, k = 0;
    for (; k < pool.length; k++) { r -= pool[k].wt; if (r <= 0) break; }
    out.push(pool.splice(Math.min(k, pool.length - 1), 1)[0]);
  }
  if (!out.length) out.push({ kind: 'gold', id: 'gold' }, { kind: 'heal', id: 'heal' });
  return out;
}
function take(c) {
  if (c.kind === 'evo') { const w = R.weapons.find(q => q.id === c.id); w.evo = true; R.evos++; save.evos[c.id] = 1; sfx('evo'); R.shake = 6; }
  else if (c.kind === 'w') { const w = R.weapons.find(q => q.id === c.id); if (w) w.lvl++; else addWeapon(c.id); sfx('pick'); }
  else if (c.kind === 'p') { R.pas[c.id] = (R.pas[c.id] | 0) + 1; const was = R.S.maxHp; stats(); if (c.id === 'vit') R.hp = Math.min(R.S.maxHp, R.hp + (R.S.maxHp - was) + 20); sfx('pick'); }
  else if (c.kind === 'gold') { R.gold += 25; sfx('coin'); }
  else { R.hp = R.S.maxHp; sfx('heal'); }
  R.choice = null;
}
function openChoice(title) { R.choice = { title, opts: choices() }; R.mx = 0; R.my = 0; }
function grid() {                                   // a grid of the monsters, for quick hit tests
  const G = new Map();
  for (const e of R.foes) { const k = ((e.x >> 5) & 0xffff) * 65536 + ((e.y >> 5) & 0xffff); let a = G.get(k); if (!a) G.set(k, a = []); a.push(e); }
  R.G = G;
}
function near(x, y, r, f) {
  const c0 = (x - r) >> 5, c1 = (x + r) >> 5, r0 = (y - r) >> 5, r1 = (y + r) >> 5;
  for (let cx = c0; cx <= c1; cx++) for (let cy = r0; cy <= r1; cy++) { const a = R.G.get((cx & 0xffff) * 65536 + (cy & 0xffff)); if (a) for (const e of a) if (!e.dead && Math.abs(e.x - x) < r + e.r && Math.abs(e.y - y) < r + e.r) f(e); }
}
function nearest(n, range = 260) {
  const list = [];
  for (const e of R.foes) if (!e.dead) { const d = (e.x - R.x) ** 2 + (e.y - R.y) ** 2; if (d < range * range) list.push([d, e]); }
  list.sort((a, b) => a[0] - b[0]); return list.slice(0, n).map(q => q[1]);
}
function hit(e, dmg, kx = 0, ky = 0, kb = 1) {
  if (e.dead) return;
  dmg = Math.round(dmg * R.S.might * (0.9 + Math.random() * 0.2));
  e.hp -= dmg; e.flash = 0.08;
  if (!e.boss) { e.kx += kx * kb * (e.type === 'brute' ? 0.4 : 1); e.ky += ky * kb * (e.type === 'brute' ? 0.4 : 1); }
  if (R.texts.length < 60) R.texts.push({ x: e.x + rnd(-3, 3), y: e.y - e.r - 4, txt: String(dmg), t: 0, col: dmg >= 50 ? '#ffd23f' : '#fff' });
  if ((R.hitSnd -= 1) <= 0) { R.hitSnd = 4; sfx('hit'); }
  if (e.hp <= 0) kill(e);
}
function kill(e) {
  e.dead = true; R.kills++;
  R.fx.push({ k: 'pop', x: e.x, y: e.y, t: 0, col: FOES[e.type].pal['#'], r: e.r });
  const xp = FOES[e.type].xp * (e.elite ? 10 : 1);
  R.gems.push({ x: e.x, y: e.y, v: xp, mag: false });
  if (Math.random() < 0.035 * R.S.greed || e.elite) R.drops.push({ k: 'coin', x: e.x + 4, y: e.y, v: e.elite ? 20 : 1 + (Math.random() < 0.2 ? 4 : 0) });
  if (Math.random() < 0.008) R.drops.push({ k: 'heart', x: e.x, y: e.y });
  if (Math.random() < 0.0015) R.drops.push({ k: 'magnet', x: e.x, y: e.y });
  if (Math.random() < 0.0012) R.drops.push({ k: 'nuke', x: e.x, y: e.y });
  if (e.elite) R.drops.push({ k: 'chest', x: e.x, y: e.y });
  if (e.boss) {
    R.bosses++; R.shake = 10; sfx('boom');
    for (let i = 0; i < 12; i++) R.drops.push({ k: 'coin', x: e.x + rnd(-30, 30), y: e.y + rnd(-30, 30), v: 10 });
    if (e.final) { R.won = true; R.over = true; R.overT = 0; sfx('win'); }
    else R.drops.push({ k: 'chest', x: e.x, y: e.y });
  }
}

    else { PX.drawIcon(ctx, ['.###.', '#...#', '#####', '##.##', '#####'], { '#': '#5b5275' }, x + bw / 2, y + 20, 2); T(h.name, x + bw / 2, y + 36, '#7a7298', 1, 'center'); wrap(h.unlock[2], x + bw / 2, y + 45, bw - 4, '#7a7298'); }
  });

    T(m.name, x + 22, y + 6, open ? '#fff' : '#5b5275', 1);
    const b = save.best[i] || 0;
    T(open ? (save.ach['win' + i] ? 'WON! ' : 'BEST ') + Math.floor(b / 60) + ':' + String(Math.floor(b % 60)).padStart(2, '0') : 'WIN THE MAP BEFORE', x + 22, y + 18, open ? '#c8b8ff' : '#5b5275', 1);
    if (open) T('MONSTERS X' + m.hp, x + 22, y + 28, '#7a7298', 1);

}
function drawShop(t) {
  const W = S.W;
  drawMenuBack(t); topBar();
  if (UI.button('back', 6, 6, 56, 20, '< BACK', { size: 1 }) || UI.back) { state = 'title'; sfx('click'); }
  T('UPGRADES THAT STAY', W / 2, 32, '#ffd23f', 2, 'center', '#000');
  const cw = Math.floor((W - 24) / 2), ch = 30;
  META.forEach((m, i) => {
    const x = 8 + (i % 2) * (cw + 8), y = 50 + Math.floor(i / 2) * (ch + 4), l = metaL(m[0]), max = l >= m[3], cost = metaCost(m, l);
    if (UI.button('meta' + i, x, y, cw, ch, '', { disabled: max || save.gold < cost, accent: '#ffd23f' })) { save.gold -= cost; save.meta[m[0]] = l + 1; store(); sfx('chest'); }
    T(m[1], x + 6, y + 5, '#fff', 1); T(m[2], x + 6, y + 15, '#9a92b8', 1);
    for (let p = 0; p < m[3]; p++) { ctx.fillStyle = p < l ? '#ffd23f' : '#3a3258'; ctx.fillRect(x + 6 + p * 6, y + 24, 4, 3); }
    T(max ? 'MAX' : String(cost), x + cw - 8, y + 10, max ? '#5ad43f' : save.gold >= cost ? '#ffd23f' : '#7a7298', 1, 'right');
  });
  T('GOLD: PICK IT UP IN RUNS (MORE THE LONGER YOU LAST)', W / 2, H - 14, '#c8b8ff', 1, 'center', '#000');
}
function drawAch(t) {
  const W = S.W;
  drawMenuBack(t); topBar();
  if (UI.button('back', 6, 6, 56, 20, '< BACK', { size: 1 }) || UI.back) { state = 'title'; sfx('click'); }
  T('TROPHIES  (★1 EACH, WINS ★3)', W / 2, 32, '#5ad43f', 2, 'center', '#000');
  ACH.forEach((a, i) => { const x = 16 + (i % 2) * (W / 2), y = 54 + Math.floor(i / 2) * 18, has = save.ach[a[0]]; T(has ? '★' : '-', x, y, has ? '#ffd23f' : '#5b5275', 1); T(a[1], x + 10, y, has ? '#fff' : '#7a7298', 1); });
  const ev = Object.keys(WEAPONS); T('EVOLUTIONS FOUND: ' + ev.filter(k => save.evos[k]).length + '/' + ev.length, W / 2, 190, '#c8b8ff', 1, 'center', '#000');
  ev.forEach((k, i) => { const x = Math.round(W / 2 - ev.length * 9 + i * 18 + 9); icon(k, x, 206, 1, !!save.evos[k]); if (!save.evos[k]) { ctx.fillStyle = 'rgba(11,6,20,0.6)'; ctx.fillRect(x - 5, 201, 11, 11); } });
}
function finishRun() {                             // gold, best time, trophies
  if (R.done) return; R.done = true;
  const bonus = Math.floor(R.t / 30) * 3 + (R.won ? 100 : 0);
  R.goldAll = Math.round((R.gold + bonus) * (1 + MAPS[R.map].hp * 0.0)); R.bonus = bonus;
  save.gold += R.goldAll; save.goldAll += R.goldAll; save.kills += R.kills; save.runs++;
  save.best[R.map] = Math.max(save.best[R.map] || 0, Math.min(R.t, RUN_TIME));
  R.map === save.maps - 1 && R.won && save.maps < MAPS.length && (save.maps++, R.newMap = true);
  R.stars = 0;
  for (const [id, , test] of ACH) if (!save.ach[id] && test(R)) { save.ach[id] = 1; const s = id.startsWith('win') ? 3 : 1; R.stars += s; R.newAch.push(id); }
  if (R.stars) PX.Wallet.add(R.stars);
  for (const h of HEROES) if (!save.heroes[h.id] && h.unlock && h.unlock[0] !== 'gold' && heroOpen(h)) { save.heroes[h.id] = 1; R.newHero = h.name; }
  store();
}
function drawOver(t) {
  const W = S.W, { x, y } = panel(300, 196, R.won ? '#ffd23f' : '#ff4a4a');
  T(R.won ? 'YOU SURVIVED!' : 'DEFEATED', W / 2, y + 10, R.won ? '#ffd23f' : '#ff4a4a', 3, 'center', '#000');
  const mm = Math.floor(R.t / 60), ss = Math.floor(R.t % 60);
  T('TIME ' + mm + ':' + String(ss).padStart(2, '0') + '   LEVEL ' + R.lvl + '   DEFEATED ' + R.kills, W / 2, y + 38, '#fff', 1, 'center');
  ctx.fillStyle = OUT; ctx.fillRect(W / 2 - 50, y + 51, 9, 9); ctx.fillStyle = '#ffd23f'; ctx.fillRect(W / 2 - 49, y + 52, 7, 7);
  T('+' + R.goldAll + ' GOLD', W / 2 - 36, y + 52, '#ffd23f', 2, 'left', '#000');
  T('(' + R.gold + ' PICKED UP + ' + R.bonus + ' FOR LASTING)', W / 2, y + 70, '#9a92b8', 1, 'center');
  R.weapons.forEach((w, i) => { const xx = Math.round(W / 2 - R.weapons.length * 8 + i * 16 + 8); icon(w.id, xx, y + 88, 1, w.evo); });
  let yy = y + 102;
  if (R.stars) { T('★ +' + R.stars, W / 2, yy, '#ffd23f', 2, 'center', '#000'); yy += 14; }
  for (const id of R.newAch.slice(0, 3)) { T('TROPHY: ' + ACH.find(a => a[0] === id)[1], W / 2, yy, '#5ad43f', 1, 'center'); yy += 10; }
  if (R.newHero) { T('NEW HERO: ' + R.newHero + '!', W / 2, yy, '#ff6bd0', 1, 'center'); yy += 10; }
  if (R.newMap) { T('NEW MAP: ' + MAPS[R.map + 1].name + '!', W / 2, yy, '#ff6bd0', 1, 'center'); yy += 10; }
  if (UI.button('menu', x + 20, y + 166, 120, 22, 'MENU', { size: 1 }) || UI.back) { R = null; state = 'title'; }
  else if (UI.button('again', x + 160, y + 166, 120, 22, 'AGAIN', { accent: '#5ad43f' })) start();
}
function drawPause() {
  const W = S.W, { x, y } = panel(220, 120);
  T('PAUSED', W / 2, y + 10, '#fff', 3, 'center');
  if (UI.button('resume', x + 35, y + 40, 150, 22, 'RESUME', { accent: '#5ad43f' }) || UI.back) setPause(false);
  if (UI.button('sfx2', x + 35, y + 66, 72, 20, save.sfx ? 'SND ON' : 'SND OFF', { size: 1, on: save.sfx })) { save.sfx = !save.sfx; store(); }
  if (UI.button('quit', x + 113, y + 66, 72, 20, 'GIVE UP', { size: 1 })) { paused = false; R.over = true; R.won = false; R.overT = 1; }
  T('GIVING UP STILL KEEPS THE GOLD', W / 2, y + 100, '#9a92b8', 1, 'center');
}
function start() { newRun(save.hero, save.map); state = 'play'; paused = false; keys.clear(); stick.on = false; inp.x = inp.y = 0; Music.reset(); }
function setPause(v) { if (state !== 'play' || !R || R.over) return; paused = v; keys.clear(); stick.on = false; inp.x = inp.y = 0; }

/* --- 7. SOUND --------------------------------------------------------------------- */
function sfx(k, n = 0) {
  if (!save.sfx) return;
  const s = PX.Sound;
  if (k === 'click') s.tone([523, 784], 0.1, { vol: 0.1 });
  else if (k === 'hit') s.noise(0.04, { freq: 1200, vol: 0.05, filter: 'bandpass' });
  else if (k === 'shoot') s.tone([900, 1400], 0.05, { vol: 0.03 });
  else if (k === 'whip') s.noise(0.1, { freq: 2500, vol: 0.06, filter: 'highpass' });
  else if (k === 'throw') s.noise(0.12, { freq: 900, vol: 0.05, filter: 'bandpass' });
  else if (k === 'zap') { s.noise(0.15, { freq: 4000, vol: 0.08, filter: 'highpass' }); s.tone([1200, 200], 0.15, { vol: 0.05, type: 'sawtooth' }); }
  else if (k === 'boom') s.noise(0.3, { freq: 350, vol: 0.18 });
  else if (k === 'gem') s.tone(700 + n * 40, 0.05, { vol: 0.04 });
  else if (k === 'coin') s.tone([1320, 1760], 0.07, { vol: 0.06 });
  else if (k === 'level') [523, 659, 784, 1047].forEach((f, i) => s.tone(f, 0.12, { vol: 0.09, delay: i * 0.06 }));
  else if (k === 'pick') s.tone([660, 990], 0.12, { vol: 0.08 });
  else if (k === 'evo') [392, 523, 659, 784, 1047, 1319].forEach((f, i) => s.tone(f, 0.18, { vol: 0.09, delay: i * 0.07, type: 'triangle' }));
  else if (k === 'chest') [784, 988, 1175, 1568].forEach((f, i) => s.tone(f, 0.1, { vol: 0.08, delay: i * 0.06 }));
  else if (k === 'heal') s.tone([500, 1000], 0.2, { vol: 0.08, type: 'triangle' });
  else if (k === 'hurt') s.tone([260, 120], 0.12, { vol: 0.09, type: 'sawtooth' });
  else if (k === 'die') s.tone([400, 60], 0.8, { vol: 0.12, type: 'sawtooth' });
  else if (k === 'roar') { s.tone([120, 60], 0.8, { vol: 0.14, type: 'sawtooth' }); s.noise(0.6, { freq: 300, vol: 0.12 }); }
  else if (k === 'win') [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => s.tone(f, 0.18, { vol: 0.1, delay: i * 0.1 }));
  else if (k === 'no') s.tone([220, 160], 0.2, { vol: 0.1 });
}
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
const Music = {                                    // a driving minor loop that speeds up a little as the run goes on
  next: 0, step: 0,
  reset() { this.next = 0; this.step = 0; },
  tick() {
    const c = PX.Sound.ctx;
    if (!c || !save.music || !save.sfx || state !== 'play' || paused || !R || R.over || R.choice) { this.next = 0; return; }
    const bpm = 132 + Math.min(24, R.t / 25), sp = 60 / bpm / 2, prog = [[57, 60, 64], [53, 57, 60], [55, 59, 62], [52, 56, 59]];
    if (!this.next || this.next < c.currentTime) this.next = c.currentTime + 0.05;
    while (this.next < c.currentTime + 0.2) {
      const i = this.step++ % 64, ch = prog[(i >> 4) % 4], d = this.next - c.currentTime;
      if (i % 2 === 0) PX.Sound.tone(midi(ch[0] - 12), sp * 0.9, { vol: 0.045, type: 'triangle', delay: d });
      if ([0, 3, 6, 8, 11, 14].includes(i & 15)) PX.Sound.tone(midi(ch[[0, 1, 2, 1, 2, 0][[0, 3, 6, 8, 11, 14].indexOf(i & 15)]] + 12), sp * 0.7, { vol: 0.02, delay: d });
      if ((i & 3) === 2) PX.Sound.noise(0.03, { freq: 7000, vol: 0.015, filter: 'highpass', delay: d });
      this.next += sp;
    }
  },
};

/* --- 8. INPUT: keys, a stick where you touch, or a controller -------------------------------- */
const keys = new Set(), stick = { on: false, id: null, x0: 0, y0: 0 };
function keyDir() {
  let x = 0, y = 0;
  if (keys.has('ArrowLeft') || keys.has('KeyA')) x--; if (keys.has('ArrowRight') || keys.has('KeyD')) x++;
  if (keys.has('ArrowUp') || keys.has('KeyW')) y--; if (keys.has('ArrowDown') || keys.has('KeyS')) y++;

}
let padMove = false;
UI.onDown = (e, x, y) => {
  PX.Sound.unlock();
  if (state !== 'play' || paused || !R || R.over || R.choice || UI.downId !== null || stick.on) return;
  stick.on = true; stick.id = e.pointerId; stick.x0 = x; stick.y0 = y; inp.x = 0; inp.y = 0;
};
UI.onMove = (e, x, y) => { if (stick.on && stick.id === e.pointerId) { const dx = x - stick.x0, dy = y - stick.y0, d = Math.hypot(dx, dy); const k = d < 3 ? 0 : Math.min(1, d / 18) / d; inp.x = dx * k; inp.y = dy * k; } };

window.addEventListener('keydown', e => {
  PX.Sound.unlock();
  if (state === 'play' && R && R.choice && /^Digit[123]$/.test(e.code)) { const o = R.choice.opts[+e.code.slice(5) - 1]; if (o) take(o); return; }
  if (/^(Arrow|Key[WASD])/.test(e.code)) { keys.add(e.code); keyDir(); if (state === 'play') e.preventDefault(); }
  if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'play' && R && !R.over && !R.choice) setPause(!paused);
  else if (e.code === 'Escape') UI.back = true;

window.addEventListener('keyup', e => { if (keys.delete(e.code)) keyDir(); });
window.addEventListener('blur', () => setPause(true));
document.addEventListener('visibilitychange', () => { if (document.hidden) setPause(true); });

/* --- 9. MAIN LOOP ----------------------------------------------------------------- */
let last = performance.now();
function frame(now) {

    if (!R.over) drawHUD(t);

  help: [['STICK|D-PAD', 'WALK (YOUR WEAPONS FIRE BY THEMSELVES)'], ['START', 'PAUSE'], ['STICK|D-PAD', 'MENUS: PICK'], ['A', 'MENUS: OK'], ['B', 'MENUS: BACK']],
