<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Pixel Arcade: use your phone as a game controller for the arcade on an Xbox, a TV or a computer.">
<meta name="theme-color" content="#0d0b13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pixel Arcade">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Pixel Arcade: phone controller</title>
<style>
  :root { --bg: #0d0b13; --panel: #1d1830; --line: #efe9ff; --dim: #9a92b8; --gold: #ffd23f; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--line); }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
         font: bold 15px/1.35 ui-monospace, Menlo, Consolas, monospace; text-transform: uppercase; }
  button { font: inherit; text-transform: inherit; color: #111; background: var(--line); border: 3px solid #111; box-shadow: 4px 4px 0 #000; padding: 10px 16px; cursor: pointer; }
  button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #000; }
  .hidden { display: none !important; }

  /* --- typing the code ------------------------------------------------------------------ */
  #join { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; box-sizing: border-box; overflow-y: auto; touch-action: auto; }
  #join h1 { margin: 0; font-size: 26px; color: #fff; text-shadow: 3px 3px 0 #e01e1e; letter-spacing: 0.05em; text-align: center; }
  #me { display: flex; align-items: center; gap: 10px; color: #fff; }
  #me img { width: 42px; height: 42px; image-rendering: pixelated; }
  #code { width: 5.2em; font: bold 44px ui-monospace, Menlo, Consolas, monospace; text-align: center; letter-spacing: 0.25em; text-transform: uppercase;
          color: #111; background: #fbf9f3; border: 3px solid #111; box-shadow: 4px 4px 0 #000; outline: none; padding: 2px 0 2px 0.25em; border-radius: 0; }
  #go { background: #5ad43f; font-size: 20px; }
  #joinMsg { min-height: 1.4em; color: #ff8a8a; text-align: center; max-width: 32em; }
  .how { color: var(--dim); font-size: 12px; text-align: center; max-width: 34em; }
  #home { background: var(--panel); color: var(--line); border-color: var(--line); font-size: 12px; padding: 6px 12px; position: fixed; left: 10px; top: 10px; }

  /* --- the controller --------------------------------------------------------------------- */
  #pad { position: fixed; inset: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr;
         padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #bar { grid-column: 1 / 3; display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: var(--panel); border-bottom: 3px solid #000; }
  #bar .small { font-size: 12px; padding: 5px 10px; box-shadow: 2px 2px 0 #000; }
  #leave { background: var(--panel); color: var(--line); border-color: var(--line); }
  #title { flex: 1; text-align: center; color: #fff; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #title span { color: var(--gold); }
  #start { background: var(--gold); }
  #left, #right { position: relative; overflow: hidden; }
  #stickHint, #modeHint { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; color: var(--dim); font-size: 12px; pointer-events: none; }
  #base { position: absolute; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%; background: #1d1830; border: 4px solid #3a2f5c; box-sizing: border-box; pointer-events: none; }
  #knob { position: absolute; width: 66px; height: 66px; margin: -33px 0 0 -33px; border-radius: 50%; background: var(--line); border: 4px solid #111; box-sizing: border-box; box-shadow: 3px 3px 0 #000; pointer-events: none; }
  #dpad { position: absolute; left: 50%; top: 50%; width: 180px; height: 180px; margin: -90px 0 0 -90px; pointer-events: none; }
  #dpad div { position: absolute; width: 60px; height: 60px; background: var(--panel); border: 3px solid var(--line); box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  #dpad div.on { background: var(--gold); color: #111; }
  #dpad .u { left: 60px; top: 0; } #dpad .d { left: 60px; top: 120px; } #dpad .l { left: 0; top: 60px; } #dpad .r { left: 120px; top: 60px; } #dpad .c { left: 60px; top: 60px; border: none; background: #3a2f5c; }
  /* a touch pad, like playing on a tablet: where you touch is where your bat goes (a little map of its area) */
  #tpad { position: absolute; left: 50%; top: calc(50% - 10px); transform: translate(-50%, -50%); border: 4px solid #3a2f5c; border-radius: 10px;
          background: #16122a; box-sizing: border-box; pointer-events: none; overflow: hidden; }
  #tpad.on { border-color: var(--line); }
  #ttable { position: absolute; background: #3ec84a; border: 3px solid #fff; box-sizing: border-box; opacity: 0.55; }
  #ttable::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; border-top: 2px solid #fff; }
  #ttable.open-r { border-right: 3px dashed #fff; } #ttable.open-l { border-left: 3px dashed #fff; }
  #tpad span { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); color: #fff; font-size: 13px; text-align: center; padding: 0 10px; text-shadow: 2px 2px 0 #000; }
  #tpad.used span { display: none; }
  #tdot { position: absolute; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; background: var(--line); border: 4px solid #111; box-sizing: border-box; opacity: 0.35; display: none; }
  #tpad.used #tdot { display: block; } #tpad.on #tdot { opacity: 0.9; }
  #shoulders { position: absolute; left: 8px; right: 8px; top: 8px; display: flex; justify-content: space-between; gap: 8px; }
  #shoulders .grp { display: flex; gap: 6px; }
  .sh { min-width: 64px; padding: 6px 10px; background: var(--panel); border: 3px solid var(--line); text-align: center; font-size: 13px; }
  .sh small { display: block; font-size: 10px; color: var(--dim); }
  .sh.on { background: var(--line); color: #111; } .sh.on small { color: #111; }
  #face { position: absolute; left: 50%; top: 54%; width: var(--fs); height: var(--fs); transform: translate(-50%, -50%); --fs: min(62vh, 44vw, 300px); }
  .fb { position: absolute; width: 34%; height: 34%; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: var(--panel); border: 4px solid var(--c); color: var(--c); box-sizing: border-box; box-shadow: 3px 3px 0 #000; text-align: center; }
  .fb b { font-size: calc(var(--fs) * 0.09); line-height: 1; }
  .fb small { font-size: 10px; line-height: 1.1; color: var(--line); max-width: 92%; overflow-wrap: anywhere; }
  .fb.on { background: var(--c); color: #111; transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; } .fb.on small { color: #111; }
  .fb[data-k="Y"] { left: 33%; top: 0; --c: #ffd23f; } .fb[data-k="X"] { left: 0; top: 33%; --c: #4aa8ff; }
  .fb[data-k="B"] { left: 66%; top: 33%; --c: #ff5a5a; } .fb[data-k="A"] { left: 33%; top: 66%; --c: #5ad43f; }
  #face.solo .fb[data-k="A"] { left: 25%; top: 25%; width: 50%; height: 50%; }
  #pad.nostick #left { display: none; } #pad.nostick #right { grid-column: 1 / 3; grid-row: 2; }
  #pad.nostick #face { --fs: min(66vh, 60vw, 340px); }
  #wait { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(13,11,19,0.88); text-align: center; padding: 20px; }
  #wait p { margin: 0; max-width: 30em; } #waitMsg { color: var(--gold); font-size: 18px; }
  @media (orientation: portrait) {
    #pad { grid-template-columns: 1fr; grid-template-rows: auto 1fr 1.25fr; }
    #bar { grid-column: 1; } #pad.nostick #right { grid-column: 1; grid-row: 2 / 4; }
    #face { --fs: min(40vh, 80vw, 300px); }
  }
</style>
</head>
<body>
<div id="join">
  <button id="home">◀ ARCADE</button>
  <h1>BE A CONTROLLER</h1>
  <div id="me"><img id="meImg" alt=""><span id="meName"></span></div>
  <div class="how">On the Xbox, TV or computer: open Pixel Arcade, press the controller button next to the ★ and SHOW CODE. Type that code here:</div>
  <input id="code" maxlength="4" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" inputmode="text" enterkeyhint="go" placeholder="CODE" aria-label="Code from the big screen">
  <button id="go">CONNECT</button>
  <div id="joinMsg"></div>
  <div class="how">Each game shows its own buttons here. Tip: turn your phone sideways.</div>
</div>

<div id="pad" class="hidden">
  <div id="bar">
    <button id="leave" class="small">✕</button>
    <div id="title">…</div>
    <button id="start" class="small" data-b="9">❚❚</button>
  </div>
  <div id="left">
    <div id="base" class="hidden"></div><div id="knob" class="hidden"></div>
    <div id="dpad" class="hidden"><div class="u">▲</div><div class="l">◀</div><div class="c"></div><div class="r">▶</div><div class="d">▼</div></div>
    <div id="tpad" class="hidden"><div id="ttable"></div><div id="tdot"></div><span></span></div>
    <div id="stickHint"></div>
  </div>
  <div id="right">
    <div id="shoulders"><div class="grp" id="shL"></div><div class="grp" id="shR"></div></div>
    <div id="face"></div>
    <div id="modeHint"></div>
  </div>
</div>
<div id="wait" class="hidden"><p id="waitMsg"></p><p class="how" id="waitHow"></p><button id="waitBack">CHANGE CODE</button></div>

<script>window.PX_NO_REMOTE = true;   // this phone is a controller, not a big screen</script>
<script src="common.js"></script>
<script>
'use strict';
/* PIXEL ARCADE: the phone controller. Connects to a big screen (index.html, the controller button: SHOW CODE)
   and works as one more game controller there. The screen tells it which buttons the game uses. */
const $ = id => document.getElementById(id);
PX.Remote.stop();                                   // if this tab was a big screen, it isn't any more
const profile = PX.Profile.load();
$('meImg').src = PX.avatarIconURL(profile.avatar, 84); $('meName').textContent = profile.name;
const PREFIX = 'pixel-arcade-pad-', LAST_KEY = 'pixelArcade.padCode', ID_KEY = 'pixelArcade.padId';
// this phone's own id: the big screen uses it to keep this phone's controller number when it changes game
let padId = '';
try { padId = localStorage.getItem(ID_KEY) || ''; } catch (e) { /* private mode */ }
if (!/^[a-z0-9]{4,24}$/.test(padId)) { padId = ''; for (let i = 0; i < 10; i++) padId += 'abcdefghijklmnopqrstuvwxyz0123456789'[Math.floor(Math.random() * 36)]; try { localStorage.setItem(ID_KEY, padId); } catch (e) { /* private mode */ } }
const N = PX.PADNUM;

// --- the code ---------------------------------------------------------------------------
const codeIn = $('code');
codeIn.addEventListener('input', () => { codeIn.value = codeIn.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4); if (codeIn.value.length === 4) $('joinMsg').textContent = ''; });
codeIn.addEventListener('keydown', e => { if (e.key === 'Enter') start(); });
$('go').addEventListener('click', () => start());
$('home').addEventListener('click', () => { location.href = './'; });
let fromHash = (location.hash || '').replace('#', '').toUpperCase();
try { codeIn.value = /^[A-Z0-9]{4}$/.test(fromHash) ? fromHash : (localStorage.getItem(LAST_KEY) || ''); } catch (e) { /* private mode */ }

// --- the connection ---------------------------------------------------------------------
const net = { peer: null, conn: null, dialing: null, code: null, on: false, fails: 0, stuck: 0, noServer: 0, ever: false, retryT: 0, dialT: 0, openT: 0 };
const HELP_NET = 'TURN OFF VPN / PRIVATE RELAY / AD BLOCKER, OR TRY THE SAME WI-FI AS THE BIG SCREEN. STILL TRYING…';
function start() {
  const c = codeIn.value.toUpperCase();
  if (!/^[A-Z0-9]{4}$/.test(c)) { $('joinMsg').textContent = 'TYPE THE 4 LETTERS FROM THE BIG SCREEN'; return; }
  try { localStorage.setItem(LAST_KEY, c); } catch (e) { /* private mode */ }
  codeIn.blur();
  // full screen and sideways, where the phone allows it
  try { const el = document.documentElement; if (el.requestFullscreen && !document.fullscreenElement) el.requestFullscreen().then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) { /* no lock */ } }).catch(() => {}); } catch (e) { /* not allowed */ }
  net.code = c; net.on = true; net.fails = 0; net.stuck = 0; net.noServer = 0; net.ever = false;
  $('join').classList.add('hidden'); $('pad').classList.remove('hidden');
  wait('CONNECTING TO ' + c + '…', '');
  connect();
}
function stopNet() {
  net.on = false; clearTimeout(net.retryT); clearTimeout(net.dialT); clearTimeout(net.openT);
  if (net.conn) { try { net.conn.close(); } catch (e) { /* gone */ } net.conn = null; }
  if (net.dialing) { try { net.dialing.close(); } catch (e) { /* gone */ } net.dialing = null; }
  if (net.peer) { try { net.peer.destroy(); } catch (e) { /* gone */ } net.peer = null; }
}
function backToJoin(msg) {
  stopNet(); release();
  $('pad').classList.add('hidden'); $('wait').classList.add('hidden'); $('join').classList.remove('hidden');
  $('joinMsg').textContent = msg || '';
}
function retry() {
  if (!net.on) return;
  // quick at first (the screen is usually back within a second after changing game), then slower
  clearTimeout(net.retryT); net.retryT = setTimeout(connect, net.fails < 6 ? 600 : 1500);
}
function connect() {
  if (!net.on) return;
  PX.loadPeer().then(() => {
    if (!net.on) return;
    if (net.peer && !net.peer.destroyed && !net.peer.disconnected) { if (net.peer.open) dial(); return; }
    if (net.peer) { try { net.peer.destroy(); } catch (e) { /* gone */ } }
    if (!net.ever && !net.noServer && !net.stuck) wait('CONNECTING TO ' + net.code + '…', 'REACHING THE SERVER…');
    const peer = new Peer({ debug: 0, config: { iceServers: PX.ICE_SERVERS } });
    net.peer = peer;
    // the server can just never answer (a filter or a bad network): don't wait forever, start again
    const noServer = () => {
      if (net.peer !== peer) return;
      clearTimeout(net.openT);
      try { peer.destroy(); } catch (x) { /* gone */ }
      net.peer = null; net.noServer++;
      if (!net.ever || net.noServer >= 2) wait("CAN'T REACH THE CONNECTION SERVER", net.noServer >= 2 ? HELP_NET : 'TRYING AGAIN…');
      retry();
    };
    clearTimeout(net.openT); net.openT = setTimeout(noServer, 10000);
    peer.on('open', () => { clearTimeout(net.openT); net.noServer = 0; dial(); });
    peer.on('error', e => {
      if (net.peer !== peer) return;
      if (e.type === 'peer-unavailable') { net.dialing = null; clearTimeout(net.dialT); failed(); return; }
      noServer();
    });
    peer.on('disconnected', () => { if (net.peer === peer && !net.conn) { net.peer = null; try { peer.destroy(); } catch (x) { /* gone */ } retry(); } });
  }).catch(() => { wait("COULDN'T LOAD THE CONNECTION.", 'IS THIS PHONE ON THE INTERNET? TRYING AGAIN…'); retry(); });
  if (!window.Peer && !net.ever) wait('CONNECTING TO ' + net.code + '…', 'LOADING…');
}
function failed() {                                 // no screen with that code (yet), or it's changing game: try again
  net.fails++;
  if (net.ever) wait('THE SCREEN IS CHANGING GAME…', 'RECONNECTING TO ' + net.code);
  else if (net.fails >= 3) wait('NO SCREEN WITH CODE ' + net.code, 'CHECK THE CODE ON THE BIG SCREEN. STILL TRYING…');
  retry();
}
function stuck() {                                  // the screen is there, but the two can't make a link
  net.stuck++;
  if (net.ever) wait('THE SCREEN IS CHANGING GAME…', 'RECONNECTING TO ' + net.code);
  else if (net.stuck >= 2) wait('FOUND ' + net.code + " BUT CAN'T LINK TO IT", HELP_NET);
  retry();
}
function dial() {
  if (!net.on || !net.peer || net.conn) return;
  // only one try at a time: two at once would make this phone two controllers on the screen
  if (net.dialing) { try { net.dialing.close(); } catch (e) { /* gone */ } }
  const c = net.peer.connect(PREFIX + net.code, { reliable: true, serialization: 'json' });
  net.dialing = c;
  if (!net.ever && !net.stuck && net.fails < 3) wait('CONNECTING TO ' + net.code + '…', 'CALLING THE SCREEN…');
  clearTimeout(net.dialT);
  net.dialT = setTimeout(() => { if (net.dialing === c) { net.dialing = null; try { c.close(); } catch (e) { /* gone */ } stuck(); } }, 8000);
  c.on('open', () => {
    if (net.dialing !== c || net.conn) { try { c.close(); } catch (e) { /* gone */ } return; }
    clearTimeout(net.dialT);
    net.dialing = null; net.conn = c; net.fails = 0; net.stuck = 0; net.ever = true;
    c.send({ t: 'hello', id: padId, name: profile.name, avatar: profile.avatar });
    send(true); wake();
    $('wait').classList.add('hidden');
    if (navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate([20, 40, 20]);
  });
  c.on('data', d => {
    if (!d || typeof d !== 'object') return;
    if (d.t === 'layout') show(d);
    else if (d.t === 'full') backToJoin('THAT SCREEN ALREADY HAS 4 PHONES.');
    else if (d.t === 'bye') backToJoin('THE BIG SCREEN STOPPED THE PHONE CONTROLLERS.');
  });
  const lost = () => {
    if (net.conn !== c) return;
    net.conn = null; release();
    if (!net.on) return;
    wait('THE SCREEN IS CHANGING GAME…', 'RECONNECTING TO ' + net.code); retry();
  };
  c.on('close', lost); c.on('error', lost);
}
function wait(msg, how) { $('waitMsg').textContent = msg; $('waitHow').textContent = how; $('wait').classList.remove('hidden'); }
$('waitBack').addEventListener('click', () => backToJoin(''));
$('leave').addEventListener('click', () => backToJoin(''));
// keep the phone awake while it's a controller
let lock = null;
function wake() { try { if (navigator.wakeLock && !lock) navigator.wakeLock.request('screen').then(l => { lock = l; l.addEventListener('release', () => { lock = null; }); }).catch(() => {}); } catch (e) { /* no wake lock */ } }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { release(); return; }
  if (net.conn) wake();
  if (net.on && !net.conn) connect();
});

// --- what the game wants: the stick (or a d-pad) and its buttons, with what each one does -------
let L = { stick: 'PICK', dpad: true, buttons: [['A', 'OK'], ['B', 'BACK']], mode: 'menu', title: 'PIXEL ARCADE' };
function show(d) {
  L = d;
  $('title').innerHTML = '';
  const t = document.createElement('span'); t.textContent = 'CONTROLLER ' + (d.player || '?');
  $('title').append(String(d.title || '') + ' · ', t);
  const hasStick = !!d.stick, hasTouch = !hasStick && !!d.touch;
  $('pad').classList.toggle('nostick', !hasStick && !hasTouch);
  $('tpad').classList.toggle('hidden', !hasTouch); $('tpad').classList.remove('on', 'used');
  $('tpad').querySelector('span').textContent = hasTouch ? (typeof d.touch === 'string' ? d.touch : d.touch.text || '') : '';
  if (hasTouch) fitPad();
  $('dpad').classList.toggle('hidden', !(hasStick && d.dpad));
  rest();
  $('stickHint').textContent = hasStick ? (d.dpad ? d.stick : 'STICK: ' + d.stick) : '';
  $('modeHint').textContent = d.mode === 'menu' ? 'MENU' : '';
  // face buttons in the Xbox places, shoulders above them
  const face = $('face'); face.innerHTML = ''; $('shL').innerHTML = ''; $('shR').innerHTML = '';
  const faceKeys = d.buttons.filter(([k]) => 'ABXY'.includes(k) && k.length === 1);
  face.classList.toggle('solo', faceKeys.length === 1 && faceKeys[0][0] === 'A');
  for (const [k, what] of d.buttons) {
    if (N[k] === undefined) continue;
    const el = document.createElement('div');
    el.dataset.b = N[k]; el.dataset.k = k;
    const b = document.createElement('b'), s = document.createElement('small'); b.textContent = k; s.textContent = what;
    el.append(b, s);
    if (faceKeys.some(f => f[0] === k)) { el.className = 'fb'; face.appendChild(el); }
    else { el.className = 'sh'; (/^L/.test(k) ? $('shL') : $('shR')).appendChild(el); }
  }
  release();
}

// --- touch: the stick on the left, buttons on the right (fingers can slide between buttons) -------
const touches = new Map();          // pointerId -> { kind: 'stick' | 'touch' | 'btn', b, x0, y0 }
const st = { x: 0, y: 0, dirs: 0, p: null };   // p: [x, y] where the finger is on the touch pad (0..1), null when not touching
let dirty = false, tapped = 0;      // tapped: pressed since the last send (a quick tap is still sent)
const R = 60;
function leftRect() { return $('left').getBoundingClientRect(); }
function btnAt(x, y) { const el = document.elementFromPoint(x, y); const b = el && el.closest && el.closest('[data-b]'); return b ? +b.dataset.b : null; }
function stickMove(t, x, y) {
  if (L.dpad) {                                         // d-pad: which arrow, from the middle of the cross
    const r = $('dpad').getBoundingClientRect(), dx = x - (r.left + r.width / 2), dy = y - (r.top + r.height / 2);
    let d = 0;
    if (Math.hypot(dx, dy) > 18) { if (Math.abs(dx) > Math.abs(dy)) d = dx < 0 ? 1 << N.left : 1 << N.right; else d = dy < 0 ? 1 << N.up : 1 << N.down; }
    st.dirs = d; tapped |= d; st.x = st.y = 0;
  } else {                                              // a stick: it starts where your thumb lands
    let dx = x - t.x0, dy = y - t.y0; const m = Math.hypot(dx, dy);
    if (m > R) { dx *= R / m; dy *= R / m; }
    st.x = dx / R; st.y = dy / R;
    const lr = leftRect();
    Object.assign($('knob').style, { left: (t.x0 - lr.left + dx) + 'px', top: (t.y0 - lr.top + dy) + 'px' });
  }
  dirty = true;
}
document.addEventListener('pointerdown', e => {
  if ($('pad').classList.contains('hidden') || !$('wait').classList.contains('hidden')) return;
  const b = btnAt(e.clientX, e.clientY);
  if (b !== null) { e.preventDefault(); touches.set(e.pointerId, { kind: 'btn', b }); tapped |= 1 << b; buzz(); dirty = true; return; }
  const lr = leftRect();
