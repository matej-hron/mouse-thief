<style>

         color: #ece3d0; font: 500 15px/1.3 'Alegreya Sans', system-ui, sans-serif; }
  :root { --ink: #ece3d0; --muted: #a99fc4; --gold: #ffd23f; --good: #8ff08f; --bad: #ff8a78; --line: #3a2f52; --panel: rgba(27,22,40,.86);
          --sl: env(safe-area-inset-left); --sr: env(safe-area-inset-right); --st: env(safe-area-inset-top); --sb: env(safe-area-inset-bottom); }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }

  /* --- buttons (the same everywhere) --- */
  .ch { display: flex; align-items: center; gap: 9px; text-align: left; padding: 8px 12px; min-height: 42px; box-sizing: border-box;
        background: linear-gradient(#2e2648, #241d3a); border: 1px solid #4a3e70; border-bottom: 3px solid #8a7ad8; border-radius: 8px;
        font-weight: 700; font-size: 16px; transition: background .1s, transform .05s; }
  .ch:hover { background: #3a2f5c; } .ch:active { transform: translateY(1px); }
  .ch kbd { flex: none; min-width: 20px; height: 20px; line-height: 20px; text-align: center; border-radius: 4px; background: #0b0912; color: var(--muted); font: 700 12px system-ui, sans-serif; }
  .ch .ic { flex: none; width: 22px; text-align: center; font-size: 17px; }

  .ch.gold { border-bottom-color: #ffd23f; }

  /* --- title, party, rules: HTML over the 3D world --- */
  .screen { display: flex; align-items: center; justify-content: center; padding: max(12px, var(--st)) max(14px, var(--sr)) max(12px, var(--sb)) max(14px, var(--sl)); box-sizing: border-box; }
  #title { flex-direction: column; gap: 10px; background: radial-gradient(ellipse at 50% 60%, rgba(8,6,12,0) 0%, rgba(8,6,12,.55) 70%); }
  #logo { width: min(86vw, 520px); image-rendering: pixelated; filter: drop-shadow(0 6px 18px rgba(0,0,0,.7)); }
  #title .sub { font: 800 italic 22px 'Alegreya', Georgia, serif; color: var(--gold); text-shadow: 0 2px 8px #000; margin: -4px 0 6px; text-align: center; }
  #title .col { display: flex; flex-direction: column; gap: 8px; width: min(300px, 86vw); }
  #title .ch { justify-content: center; }

  .card { width: 100%; max-width: 620px; max-height: 100%; overflow: auto; box-sizing: border-box; padding: 16px 18px; border-radius: 12px;
          background: linear-gradient(rgba(37,30,56,.96), rgba(27,22,40,.96)); border: 1px solid var(--line); border-top: 3px solid var(--c, #8a7ad8); box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .card h2 { margin: 0 0 8px; font: 800 24px 'Alegreya', Georgia, serif; }
  .card h4 { margin: 12px 0 4px; font-size: 15px; color: var(--gold); }
  .card p { margin: 0 0 8px; font: 400 16.5px/1.45 'Alegreya', Georgia, serif; }
  .card .muted, .muted { color: var(--muted); font-weight: 500; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; justify-content: flex-end; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pill { padding: 6px 12px; border-radius: 20px; background: #1d1830; border: 1px solid var(--line); font-weight: 800; min-width: 38px; }
  .pill.on { background: #3a2f5c; border-color: var(--c, var(--gold)); box-shadow: 0 0 0 1px var(--c, var(--gold)); }
  .heroRow { display: grid; grid-template-columns: 76px 1fr auto; gap: 4px 10px; align-items: center; padding: 8px 10px; margin-top: 8px; border-radius: 8px;
             background: #1d1830; border: 1px solid var(--line); border-left: 4px solid var(--c); }
  .heroRow img { grid-row: 1 / 4; width: 76px; height: 76px; }
  .pt { border-radius: 10px; background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--c) 45%, #2a2340), #120f1c 72%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
  .heroRow input { width: 120px; font: 800 17px 'Alegreya Sans', sans-serif; background: #0b0912; color: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; user-select: text; -webkit-user-select: text; }
  .heroRow .cls { grid-column: 2 / 4; display: flex; gap: 5px; flex-wrap: wrap; }
  .heroRow .cls .pill { padding: 4px 9px; font-size: 14px; }
  .heroRow .st { grid-column: 2 / 4; color: var(--muted); font-size: 13.5px; }
  .heroRow .st b { color: var(--ink); }

  /* --- the play screen --- */
  #play { display: grid; grid-template-columns: 1fr; grid-template-rows: auto 1fr; padding: max(6px, var(--st)) max(8px, var(--sr)) max(6px, var(--sb)) max(8px, var(--sl)); box-sizing: border-box; pointer-events: none; }
  #top { display: flex; gap: 6px; pointer-events: auto; }
  #party { flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .hero { display: grid; grid-template-columns: 38px 1fr; column-gap: 7px; align-items: center; text-align: left; padding: 4px 8px 5px; background: var(--panel);
          border: 1px solid var(--line); border-top: 2px solid var(--c); border-radius: 7px; min-width: 0; backdrop-filter: blur(4px); }
  .hero img { grid-row: 1 / 4; width: 38px; height: 38px; }
  .hero .hn { font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hero .hs { display: flex; justify-content: space-between; gap: 6px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .hero .bar { height: 4px; background: #0b0912; border-radius: 2px; overflow: hidden; margin-top: 2px; }
  .hero .bar span { display: block; height: 100%; background: var(--good); transition: width .3s; }
  .hero.low .bar span { background: #ffb03a; } .hero.down { opacity: .6; } .hero.down .hs span:first-child { color: var(--bad); font-weight: 700; }
  .hero.turn { background: rgba(58,47,92,.95); border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 0 14px rgba(255,210,63,.35); }
  .tag { font-style: normal; font-size: 11px; font-weight: 700; margin-left: 6px; padding: 0 5px; border-radius: 3px; background: #4a2a6a; color: #e0b0ff; }
  .tag.hid { background: #1e4a2a; color: #9af59a; }
  #pause { width: 44px; flex: none; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; font-weight: 800; letter-spacing: 1px; }
  #side { position: fixed; display: flex; flex-direction: column; gap: 6px; pointer-events: none; box-sizing: border-box; }
  #side > * { pointer-events: auto; }
  #story { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--line);
           background: linear-gradient(180deg, rgba(36,29,51,.9), rgba(27,22,38,.9)); box-shadow: inset 0 0 40px rgba(0,0,0,.45), 0 8px 30px rgba(0,0,0,.4);
           font: 400 18px/1.5 'Alegreya', Georgia, 'Times New Roman', serif; color: var(--ink); user-select: text; -webkit-user-select: text;

  .roll { display: flex; gap: 9px; align-items: flex-start; margin: 3px 0 7px; padding: 4px 9px; border-radius: 4px; border-left: 3px solid;

  .roll b { flex: none; min-width: 24px; padding: 1px 4px; text-align: center; border-radius: 3px; background: #f0e8d8; color: #1a1018; font-weight: 800; }
  .roll.ok { color: var(--good); border-color: #4ac24a; } .roll.no { color: var(--bad); border-color: #d84a3a; } .roll.info { color: #ffe07a; border-color: #c8a030; }

  #ask { text-align: center; font-weight: 800; color: var(--gold); font-size: 14.5px; letter-spacing: .03em; min-height: 18px; text-shadow: 0 1px 4px #000; }

  .hint { text-align: center; color: #8a80a8; font-size: 13px; padding: 6px; text-shadow: 0 1px 3px #000; }

  /* the battle: the story becomes a short log, the actions sit in a fixed panel beside (or under) the scene */
  body.battle #story { flex: 1 1 0; min-height: 40px; font-size: 15px; padding: 6px 12px; }
  body.battle #story h3 { display: none; }
  body.battle #ask { font-size: 14px; }
  body.battle #choices { grid-template-columns: 1fr 1fr; flex: none; min-height: 168px; align-content: start; }
  body.battle #choices .ch { min-height: 38px; padding: 5px 9px; font-size: 15px; gap: 6px; }
  body.battle #choices .ch kbd { display: none; }
  body.battle #choices .ch small { font-size: 12px; }
  body.battle #inv { display: none; }
  #banner { position: fixed; left: 50%; transform: translateX(-50%); padding: 6px 16px; border-radius: 20px; background: rgba(13,11,19,.82); border: 1px solid var(--gold);
            color: var(--gold); font-weight: 800; font-size: 15px; white-space: nowrap; pointer-events: none; text-shadow: 0 1px 3px #000; transition: opacity .2s; }
  #die { position: fixed; width: 52px; height: 56px; border-radius: 9px; display: flex; flex-direction: column; align-items: center; justify-content: center;

  #die b { font: 800 24px/1 'Alegreya Sans', sans-serif; } #die span { font: 700 11px 'Alegreya Sans', sans-serif; opacity: .7; }
  #die.ok { background: #2a7a3a; color: #fff; } #die.no { background: #8a2a2a; color: #fff; } #die.info { background: #6a5a1a; color: #fff; }
  #die.spin { transform: rotate(-8deg) scale(1.05); }
  #fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .num { position: absolute; transform: translate(-50%, -50%); font: 800 22px 'Alegreya Sans', sans-serif; text-shadow: 0 2px 0 #000, 0 0 8px #000; white-space: nowrap; }
  .num.miss { font-size: 16px; color: #c8bfdc; } .num.dmg { color: #ff6a50; } .num.heal { color: #8ff08f; } .num.info { font-size: 16px; color: #ffd23f; }
  .ut { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 2px; pointer-events: none; }
  .ut i { font: 700 11.5px 'Alegreya Sans', sans-serif; font-style: normal; color: #fff; text-shadow: 0 1px 2px #000, 0 0 4px #000; white-space: nowrap; }
  .ut s { display: block; width: 40px; height: 5px; background: #0b0912; border-radius: 3px; overflow: hidden; border: 1px solid rgba(0,0,0,.6); }
  .ut s u { display: block; height: 100%; background: #e8303a; text-decoration: none; transition: width .25s; }
  .ut.hero s u { background: #5ad43f; }

  /* the films: letterbox bars and a caption */
  #film { position: fixed; inset: 0; pointer-events: none; }
  #film .bar { position: absolute; left: 0; right: 0; height: 11vh; background: #000; transition: transform .6s ease; }
  #film .bar.t { top: 0; transform: translateY(-100%); } #film .bar.b { bottom: 0; transform: translateY(100%); }
  #film.on .bar { transform: none; }
  #film .cap { position: absolute; left: 0; right: 0; bottom: 13vh; text-align: center; opacity: 0; transition: opacity .8s; padding: 0 20px; }
  #film .cap b { display: block; font: 800 italic clamp(26px, 6vw, 46px)/1.1 'Alegreya', Georgia, serif; color: #fff4d8; text-shadow: 0 3px 16px #000, 0 0 30px rgba(0,0,0,.8); letter-spacing: .02em; }
  #film .cap span { display: block; margin-top: 4px; font: 400 italic clamp(15px, 3vw, 20px) 'Alegreya', Georgia, serif; color: #d8cdb8; text-shadow: 0 2px 10px #000; }
  #film .cap.on { opacity: 1; }
  #film .skip { position: absolute; right: 14px; bottom: 4vh; color: rgba(255,255,255,.45); font-size: 12px; opacity: 0; transition: opacity .6s; }
  #film.on .skip { opacity: 1; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .45s; }
  #fade.on { opacity: 1; }
  body.film #play, body.film #side, body.film #banner, body.film #die, body.film #fx { visibility: hidden; }

  .modal { position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; background: rgba(8,6,12,.72); padding: 16px; box-sizing: border-box; pointer-events: auto; }
  .card.small { max-width: 300px; display: flex; flex-direction: column; gap: 8px; }
  .sh-head { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
  .sh-head img { width: 96px; height: 96px; }
  .sh-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .stats { border-collapse: collapse; font-size: 15px; }
  .stats th { text-align: left; padding: 1px 8px 1px 0; color: var(--muted); } .stats td { padding: 1px 8px 1px 0; font-weight: 800; } .stats td.muted { font-size: 13px; font-weight: 500; }
  .stats tr.prime th, .stats tr.prime td:nth-child(2) { color: var(--gold); }
  .combat { display: flex; flex-direction: column; gap: 3px; } .combat .ok { color: var(--good); } .combat .low { color: #ffb03a; } .combat .down { color: var(--bad); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; } .chips span { padding: 2px 8px; border-radius: 4px; background: #0b0912; font-size: 13.5px; }
  .spells { margin: 0; padding-left: 18px; font-size: 14.5px; }
  @media (max-aspect-ratio: 1/1) {
    #party { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .sh-cols { grid-template-columns: 1fr; }
    #story { font-size: 17px; padding: 10px 13px; }
    #choices.two { grid-template-columns: 1fr; }
  }
  @media (max-height: 430px) and (min-aspect-ratio: 1/1) {
    .hero { padding: 3px 7px 4px; } .hero .hn { font-size: 14px; }
    #story { font-size: 16px; padding: 8px 12px; } .ch { min-height: 34px; padding: 5px 10px; font-size: 15px; }
  }
</style>

<script type="module">
/* ==========================================================================
   PIXEL QUEST: UTOPENÝ ZVON. An old-school dungeon adventure in 3D, in Czech, for children (part of the PIXEL GAMES).
   A proof of concept, not in the arcade's menu yet: it lives at /adad.
   A party of 1 to 4 heroes (VÁLEČNÍK, KNĚZ, ČARODĚJ, ZLODĚJ) takes turns on one phone. The game is the dungeon master:
   it tells you where you are, you pick what the party does, and the dice decide. Every roll is shown.
   Every scene is a small 3D set (three.js, vendor/, MIT licence), built in code: no image or model files. The first
   time the party comes to a scene, a few seconds of film (the camera flies through the set, a caption) set the mood.
   Fights happen on the set's floor, on a grid: the hero whose turn it is gets a gold ring, tap a blue tile to walk
   there, and pick what they do in the panel (or tap a monster to attack it).
   The rules are the classic 1st-level ones, cut down, and kind to children:
     - six abilities, 4d6 drop the lowest, put where the class needs them most
     - descending armour class and THAC0 (shown as "need 12 or more"), saving throws, ability checks (d20 <= ability),
       thief skills in % (d100), d10 initiative per side, surprise, morale (2d10)
     - 0 HP: the hero falls and can't fight (a potion or a cure gets them up); after a won fight they get up with 1 HP.
       Nobody dies: if the whole party falls, they wake up in the inn and can try again.
   THE ADVENTURE IS DATA: ROOMS (section 5) is a list of scenes: their set, film, text and choices.
     1. Setup   2. Rules   3. Heroes   4. The story queue   5. The adventure   6. Fights   7. The 3D world
     8. Figures   9. Sets   10. Films   11. The battle on the grid   12. Screens   13. Sound   14. Input   15. Main loop
   ========================================================================== */
import * as THREE from './vendor/three.module.min.js';

/* --- 1. SETUP --------------------------------------------------------------- */
const VERSION = '0.2.3';
const SAVE_KEY = 'pixelQuest.save', GAME_KEY = 'pixelQuest.game2';
const save = { sfx: true, music: true, wins: 0 };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY)) || {}); } catch (e) { /* new player */ }
const store = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* private mode */ } };
const profile = PX.Profile.get();
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = k => { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); };
const rnd = n => 1 + Math.floor(Math.random() * n);                  // one die
const dice = (n, s, b = 0) => { let t = b; for (let i = 0; i < n; i++) t += rnd(s); return t; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const esc = v => String(v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const nice = v => String(v).toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase());   // BRAN -> Bran

/* --- 2. RULES ----------------------------------------------------------------- */
const STATS = ['str', 'dex', 'con', 'int', 'wis', 'cha'];
const STAT_NAME = { str: 'Síla', dex: 'Obratnost', con: 'Odolnost', int: 'Inteligence', wis: 'Moudrost', cha: 'Charisma' };
const STAT_SHORT = { str: 'SÍL', dex: 'OBR', con: 'ODL', int: 'INT', wis: 'MOU', cha: 'CHA' };
const strHit = s => s <= 3 ? -3 : s <= 5 ? -2 : s <= 7 ? -1 : s <= 16 ? 0 : 1;
const strDmg = s => s <= 5 ? -1 : s <= 15 ? 0 : s <= 17 ? 1 : 2;
const dexAC = s => s <= 3 ? 4 : s <= 5 ? 6 - s : s === 6 ? 1 : s <= 14 ? 0 : -(s - 14);
const dexMissile = s => s <= 3 ? -3 : s <= 5 ? s - 6 : s <= 15 ? 0 : s === 16 ? 1 : 2;

/* --- 4. THE STORY QUEUE -------------------------------------------------------
   Everything the game says or shows goes through a queue, one piece at a time: text, a dice roll (the die spins, then
   the result), a film, an animation in the 3D world (wait until it's done), or a function to run when its turn comes.
   The choices only show when the queue is empty. Tap to skip ahead. */
let G = null;                       // the adventure in progress (saved): heroes, gold, items, flags, room
let F = null;                       // the fight in progress (not saved)
const Q = [];
let cur = null;                     // the queue entry being shown
let choices = [], ask = '', choicesVer = 0;   // the buttons and the question above them
let die = null;                     // the die being rolled { sides, shown, value, ok, t, done }
let skip = false, tapped = false;
const say = (txt, col) => Q.push({ k: 'say', txt, col });
const head = txt => Q.push({ k: 'say', txt, cls: 'title' });
const then = fn => Q.push({ k: 'fn', fn });
const gap = () => Q.push({ k: 'say', txt: '', cls: 'gap' });
const play = (fn, dur) => Q.push({ k: 'anim', fn, dur });   // start something in the 3D world, then wait dur seconds
function rollFx(sides, value, txt, ok, fast) { Q.push({ k: 'roll', sides, value, txt, ok, fast }); }
// a choice somebody has to try (a check): only shown while some hero can still try it
function setChoices(q, list) { ask = q; choicesVer++; choices = list.filter(c => c && (!c.if || c.if()) && (!c.who || G.heroes.some(h => up(h) && c.who(h) > 0))); }
const pickWho = (q, chance, fn) => ({ who: chance, act: () => choose(q, chance, fn, stay) });

const storyEl = $('story'), storyIn = $('storyIn');
const COLS = { '#7aea7a': 'good', '#ff7a6a': 'bad', '#ff3a3a': 'bad', '#ffaa8a': 'hurt', '#ffd23f': 'gold', '#c8b8ff': 'muted', '#6aa8ff': 'magic', '#f0e070': 'holy', '#c06aff': 'evil' };
let stick = true;
storyEl.addEventListener('scroll', () => { stick = storyEl.scrollTop + storyEl.clientHeight >= storyEl.scrollHeight - 40; });
function clearText() { storyIn.textContent = ''; stick = true; }
const hasText = () => storyIn.childElementCount > 0;
function addLine(tag, cls) {
  const el = document.createElement(tag); if (cls) el.className = cls; storyIn.appendChild(el);
  while (storyIn.childElementCount > 160) storyIn.firstChild.remove();
  return el;
}
function follow() { if (stick) storyEl.scrollTop = storyEl.scrollHeight; }
function pump(dt) {
  for (let guard = 0; guard < 200; guard++) {
    if (!cur) {
      if (!Q.length) { skip = false; return; }
      cur = Q.shift(); cur.t = 0;
      if (cur.k === 'say') cur.paras = cur.txt.split('\n').map(x => ({ x, el: addLine(cur.cls === 'title' ? 'h3' : 'p', cur.cls === 'title' ? '' : cur.cls || COLS[cur.col] || '') }));
      if (cur.k === 'roll') { die = { sides: cur.sides, value: cur.value, ok: cur.ok, t: 0, shown: rnd(cur.sides) }; sfx('dice'); }
      if (cur.k === 'anim' && cur.fn) cur.fn();
      if (cur.k === 'film') startFilm(cur.id);
    }
    cur.t += dt;
    if (cur.k === 'fn') { const fn = cur.fn; cur = null; fn(); continue; }
    if (cur.k === 'wait') { skip = false; if (!tapped) return; tapped = false; cur = null; continue; }
    if (cur.k === 'film') { if (film) return; cur = null; skip = false; continue; }
    if (cur.k === 'anim') { if (skip) finishAnims(); if (cur.t < cur.dur && !skip) return; cur = null; continue; }
    if (cur.k === 'say') {
      const total = cur.txt.length, chars = skip || cur.cls ? total : Math.floor(cur.t * 240);
      let left = chars;
      for (const p of cur.paras) { p.el.textContent = p.x.slice(0, clamp(left, 0, p.x.length)); left -= p.x.length + 1; }
      follow();
      if (chars >= total) { cur = null; continue; }
      return;
    }
    if (cur.k === 'roll') {
      const dur = cur.fast ? 0.3 : 0.6;
      die.t = cur.t;
      if (cur.t < dur && !skip) { if (Math.floor(cur.t * 18) !== Math.floor((cur.t - dt) * 18)) die.shown = rnd(cur.sides); return; }
      die.shown = cur.value; die.done = true; die.t = 0;
      const el = addLine('div', 'roll ' + (cur.ok === true ? 'ok' : cur.ok === false ? 'no' : 'info'));
      el.innerHTML = `<b title="k${cur.sides}">${cur.value}</b><span>${esc(cur.txt)}</span>`;
      follow();
      if (cur.ok === true) sfx('ok'); else if (cur.ok === false) sfx('bad');
      cur = null;
      continue;
    }
  }
}
const busy = () => !!cur || Q.length > 0;

// checks: they roll, show the roll, and give back true or false
const okTxt = ok => ok ? 'Povedlo se!' : 'Nevyšlo to.';
function abilityChance(h, stat, mod = 0) { return clamp(h.st[stat] + mod, 1, 19) / 20; }
function checkAbility(h, stat, mod = 0) {
  const need = clamp(h.st[stat] + mod, 1, 19), r = rnd(20), ok = r <= need;
  rollFx(20, r, `${h.name}: ${STAT_NAME[stat]}, k20 = ${r} (potřeba ${need} nebo méně). ${okTxt(ok)}`, ok);
  return ok;
}
function skillChance(h, k) { return h.cls === 'thief' ? thiefSkill(h, k) / 100 : 0; }
function checkSkill(h, k) {
  const need = thiefSkill(h, k), r = rnd(100), ok = r <= need;
  rollFx(100, r, `${h.name}: ${SKILL_NAMES[k]}, k100 = ${r} (potřeba ${need} nebo méně). ${okTxt(ok)}`, ok);
  return ok;
}
function checkSave(h, kind, mod = 0, fast) {
  const need = saveOf(h, kind), r = rnd(20), ok = r + mod >= need;
  rollFx(20, r, `${h.name}: záchrana proti ${SAVE_NAMES[SV[kind]]}, k20 = ${r}${mod ? (mod > 0 ? '+' : '') + mod : ''} (potřeba ${need} nebo víc). ${ok ? 'Zachráněno!' : 'Nevyšlo to.'}`, ok, fast);
  return ok;
}
const pct = c => Math.round(c * 100) + ' %';
// the party picks who does it: a button for every hero who can, with their chance
function choose(q, chance, fn, back) {
  const list = G.heroes.filter(h => up(h) && chance(h) > 0).map(h => ({ label: h.name, note: pct(chance(h)), act: () => fn(h) }));
  if (!list.length) { say('To nikdo z družiny neumí.', '#ff7a6a'); then(back); return; }
  list.push({ label: 'Nic, zpátky', act: back, dim: true });
  setChoices(q, list);
}
// hurt a hero: the number changes at once, what you see (the card, the bar) when the queue gets there
function hurt(h, n, floor1) {
  h.hp -= n;
  if (floor1 && h.hp < 1) h.hp = 1;
  if (h.hp < 0) h.hp = 0;
  const hp = h.hp;
  then(() => { h.shp = hp; const u = unitOf(h); if (u) { hitFlash(u); floatNum(u, '-' + n, 'dmg'); if (hp <= 0) setPose(u, 'down'); } });
}
function heal(h, n) {
  const was = h.hp; h.hp = Math.min(h.max, Math.max(0, h.hp) + n);
  const hp = h.hp, got = hp - was;
  then(() => { h.shp = hp; const u = unitOf(h); if (u) { floatNum(u, '+' + got, 'heal'); burst(u.pos, 0x8ff08f, 24, 1.2); if (hp > 0 && u.pose === 'down') setPose(u, 'idle'); } });
  return got;
}
function giveXP(n, why) {
  const live = G.heroes;
  if (!live.length || n <= 0) return;
  const each = Math.floor(n / live.length);
  for (const h of live) h.xp += each;
  say(`${why}: ${each} zkušeností pro každého hrdinu.`, '#ffd23f');
}

/* --- 5. THE ADVENTURE: UTOPENÝ ZVON (THE DROWNED BELL) ---------------------------------------------
   Each scene: set (the 3D set), view (where the camera looks in it), film (played the first time), text (the first
   visit), again (when you come back), foes (the monsters standing there, before the fight starts), choices().
   Flags (G.f) remember what happened. The heroes' words are in the present tense, so they fit a boy and a girl. */
const f = () => G.f;
const n = () => G.heroes.length;
const stay = () => { store2(); showChoices(); };
function go(id) {
  // a new scene: first let the party read what just happened (tap to go on), then fade to black, then a clean page
  if (G.room !== id && hasText()) Q.push({ k: 'wait' });
  if (G.room !== id) { play(() => fade(true), 0.5); then(() => { clearText(); enter(id); }); return; }
  enter(id);
}
function enter(id) {
  const R = ROOMS[id];
  const first = !f()['seen_' + id];
  G.room = id;
  f()['seen_' + id] = 1;
  Music.play(roomMusic());
  showSet(R.set, R.view);
  showPreview(R.foes && !(R.beaten && R.beaten()) ? R.foes() : null);
  if (first && R.film && !skipFilms) Q.push({ k: 'film', id: R.film });
  else then(() => fade(false));
  head(R.title);
  say(first || !R.again ? (typeof R.text === 'function' ? R.text() : R.text) : (typeof R.again === 'function' ? R.again() : R.again));
  if (R.enter) R.enter(first);
  then(stay);
}
function showChoices() { const R = ROOMS[G.room]; setChoices(typeof R.ask === 'function' ? R.ask() : R.ask || 'Co družina udělá?', R.choices()); }
function needle(h) {
  say(`Au! Do ruky se zabodne malá jehla. ${h.name} sykne bolestí.`, '#ff7a6a');
  f().trapGone = 1;
  if (checkSave(h, 'poison')) { hurt(h, 1, true); say('Jen škrábnutí. 1 zranění.'); }
  else { const d = dice(2, 4); hurt(h, d, true); say(`Jed pálí. ${d} zranění.`, '#ff7a6a'); }
}
function openTrapdoor() {
  f().open = 1; say('Dvířka se otevřou. Zespodu stoupá studený vzduch a vůně svíček.');

function answerDoor(word) {

  then(stay);
}

  else if (k === 'coin') { s.tone(988, 0.06, { vol: 0.06 }); s.tone(1319, 0.1, { vol: 0.06, delay: 0.07 }); }
  else if (k === 'fight') s.tone([220, 330, 220], 0.3, { vol: 0.08, type: 'sawtooth' });
  else if (k === 'win') [523, 659, 784, 1047].forEach((fq, i) => s.tone(fq, 0.18, { vol: 0.06, delay: i * 0.1, type: 'triangle' }));
  else if (k === 'lose') [392, 330, 262, 196].forEach((fq, i) => s.tone(fq, 0.3, { vol: 0.07, delay: i * 0.25, type: 'triangle' }));
  else if (k === 'bell' || k === 'bellFar') {               // a bronze bell: a low hum and its overtones, dying away slowly
    const v = k === 'bell' ? 1 : 0.35;
    [[98, 5, 0.11], [196, 4, 0.08], [235, 3.4, 0.06], [294, 2.8, 0.05], [392, 2.2, 0.04], [522, 1.6, 0.025]].forEach(([fq, d, vol]) => s.tone(fq, d, { vol: vol * v, type: 'sine' }));
    s.noise(0.05, { vol: 0.08 * v, freq: 2500 });
  }
  else if (k === 'wind') { s.noise(6, { vol: 0.05, filter: 'bandpass', freq: 380 }); s.noise(4, { vol: 0.03, filter: 'bandpass', freq: 700, delay: 1.5 }); }
  else if (k === 'owl') { s.tone([420, 380], 0.35, { vol: 0.05, type: 'sine' }); s.tone([400, 360], 0.6, { vol: 0.05, type: 'sine', delay: 0.5 }); }
  else if (k === 'squeak') s.tone([1800, 2600, 1500], 0.14, { vol: 0.035, type: 'triangle' });
  else if (k === 'bones') for (let i = 0; i < 5; i++) s.noise(0.04, { vol: 0.08, filter: 'highpass', freq: 2200 + i * 300, delay: i * 0.07 + Math.random() * 0.04 });
  else if (k === 'step') s.noise(0.05, { vol: 0.05, freq: 300 });
  else if (k === 'groan') s.tone([110, 90, 70], 0.6, { vol: 0.05, type: 'sawtooth' });
  else if (k === 'splash') { s.noise(0.5, { vol: 0.15, freq: 900 }); s.noise(0.3, { vol: 0.08, filter: 'highpass', freq: 3000, delay: 0.05 }); }
  else if (k === 'creak') s.tone([90, 140, 110], 0.7, { vol: 0.04, type: 'sawtooth' });
  else if (k === 'rumble') { s.noise(1.6, { vol: 0.2, freq: 140 }); s.tone([60, 45], 1.5, { vol: 0.08, type: 'sine' }); }
}

/* MUSIC: dramatic music made live with Web Audio (no files), one piece per mood. A piece is a tempo, a list of chords
   (one a bar, as MIDI note numbers) and step(i, t, chord): what plays on each 16th note. Pieces cross-fade. */
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const CH = {                                       // chords (MIDI numbers, around the middle of the keyboard)
  Dm: [50, 53, 57], Bb: [46, 50, 53], Gm: [43, 50, 55], A: [45, 49, 52], C: [48, 52, 55], F: [41, 48, 53], Eb: [51, 55, 58],
  Em: [52, 55, 59], Am: [45, 52, 57], B: [47, 51, 54], G: [43, 50, 55], E: [40, 47, 52], Cm: [48, 51, 55], Ab: [44, 48, 51],
  Fm: [41, 48, 53], Gs: [43, 47, 50], Cdim: [49, 52, 55], D: [50, 54, 57], Bm: [47, 50, 54], Gmaj: [43, 47, 50],
};
const Music = {
  want: null, id: null, bus: null, nextT: 0, i: 0,
  ctx() { return PX.Sound.ctx; },
  play(id) { this.want = id; },
  stopBus(fadeS) {
    const c = this.ctx(); if (!c || !this.bus) return;
    const g = this.bus; try { g.gain.cancelScheduledValues(c.currentTime); g.gain.setValueAtTime(g.gain.value, c.currentTime); g.gain.linearRampToValueAtTime(0.0001, c.currentTime + fadeS); } catch (e) { /* fine */ }
    setTimeout(() => { try { g.disconnect(); } catch (e) { /* fine */ } }, fadeS * 1000 + 200);
    this.bus = null;
  },
  update() {
    const c = this.ctx(); if (!c || !PX.Sound.out) return;
    const want = save.music !== false ? this.want : null;
    if (want !== this.id) {
      this.stopBus(this.id && TRACKS[this.id] && TRACKS[this.id].sting ? 0.3 : 1.6);
      this.id = want;
      if (want && TRACKS[want]) {
        const g = c.createGain(); g.gain.setValueAtTime(0.0001, c.currentTime); g.gain.linearRampToValueAtTime(TRACKS[want].vol || 0.55, c.currentTime + 1.4);
        g.connect(PX.Sound.out); this.bus = g; this.i = 0; this.nextT = c.currentTime + 0.1;
      }
    }
    if (!this.bus) return;
    const T = TRACKS[this.id], sd = 60 / T.bpm / 4;
    if (this.nextT < c.currentTime) this.nextT = c.currentTime + 0.05;   // the tab was asleep: don't play the missed notes
    while (this.nextT < c.currentTime + 0.25) {
      if (T.sting && this.i >= T.sting) { this.want = T.then; break; }
      const bar = Math.floor(this.i / 16), chord = CH[T.chords[bar % T.chords.length]];
      T.step(this.i % 16, this.nextT, chord, bar, sd);
      this.i++; this.nextT += sd;
    }
  },
  // the instruments: every note is a few oscillators with an envelope, into the piece's bus
  env(t, a, d, vol) { const g = this.ctx().createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + a); g.gain.setTargetAtTime(0.0001, t + a, d / 3); g.connect(this.bus); return g; },
  osc(type, f, t, dur, dest, detune = 0) { const o = this.ctx().createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); o.detune.value = detune; o.connect(dest); o.start(t); o.stop(t + dur + 0.1); return o; },
  filt(type, f, q, dest) { const b = this.ctx().createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q || 0.7; b.connect(dest); return b; },
  pad(ch, t, dur, vol = 0.022, cut = 900) { const g = this.env(t, Math.min(1.2, dur * 0.3), dur, vol), f = this.filt('lowpass', cut, 0.5, g); for (const m of ch) for (const d of [-8, 8]) this.osc('sawtooth', mtof(m), t, dur * 1.6, f, d); },
  choir(ch, t, dur, vol = 0.014) {
    const g = this.env(t, 0.9, dur, vol), f = this.filt('bandpass', 750, 1.4, g), lfo = this.ctx().createOscillator(), lg = this.ctx().createGain();
    lfo.frequency.value = 5; lg.gain.value = 9; lfo.connect(lg); lfo.start(t); lfo.stop(t + dur * 1.6);
    for (const m of ch) for (const d of [-6, 5]) { const o = this.osc('sawtooth', mtof(m + 12), t, dur * 1.6, f, d); lg.connect(o.detune); }
  },
  drone(m, t, dur, vol = 0.07) { const g = this.env(t, 1.5, dur, vol); this.osc('sine', mtof(m - 12), t, dur * 1.5, g); this.osc('triangle', mtof(m - 5), t, dur * 1.5, g); },
  bass(m, t, dur, vol = 0.07, cut = 600) { const g = this.env(t, 0.01, dur, vol), f = this.filt('lowpass', cut, 3, g); this.osc('sawtooth', mtof(m - 12), t, dur, f); this.osc('square', mtof(m - 24), t, dur, f); },
  pluck(m, t, vol = 0.05) { const g = this.env(t, 0.005, 0.6, vol); this.osc('triangle', mtof(m), t, 0.7, g); },
  brass(ch, t, dur, vol = 0.03) { const g = this.env(t, 0.04, dur, vol), f = this.filt('lowpass', 1800, 1, g); for (const m of ch) this.osc('sawtooth', mtof(m), t, dur, f); },
  kick(t, vol = 0.32) { const c = this.ctx(), g = this.env(t, 0.003, 0.25, vol), o = c.createOscillator(); o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(38, t + 0.22); o.connect(g); o.start(t); o.stop(t + 0.4); },
  timp(t, m = 38, vol = 0.3) { const c = this.ctx(), g = this.env(t, 0.005, 1.4, vol), o = c.createOscillator(); o.frequency.setValueAtTime(mtof(m) * 1.3, t); o.frequency.exponentialRampToValueAtTime(mtof(m), t + 0.12); o.connect(g); o.start(t); o.stop(t + 1.8); this.noise(t, 0.3, vol * 0.4, 'lowpass', 300); },
  noise(t, dur, vol, type = 'highpass', f = 1800) {
    const c = this.ctx(), len = Math.ceil(c.sampleRate * dur), b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(); s.buffer = b; const g = this.env(t, 0.002, dur, vol); s.connect(this.filt(type, f, 0.8, g)); s.start(t);
  },
  bell(m, t, vol = 0.05) { [[1, 1], [2, 0.6], [2.4, 0.4], [3, 0.3], [4.2, 0.2]].forEach(([k, v]) => { const g = this.env(t, 0.005, 4 / k, vol * v); this.osc('sine', mtof(m) * k, t, 5 / k, g); }); },
};
const M = Music;
const TRACKS = {
  // the village at night: a sad little music box over a soft pad
  village: { bpm: 72, chords: ['Dm', 'Bb', 'Gm', 'A'], vol: 0.5, step(i, t, ch, bar, sd) {
    if (i === 0) { M.pad(ch, t, sd * 16, 0.016, 700); M.drone(ch[0], t, sd * 16, 0.05); }
    if (i % 4 === 0) M.pluck(ch[(i / 4 + bar) % 3] + 24, t, 0.035);
    if (i === 14 && bar % 2) M.pluck(ch[2] + 26, t, 0.025);
  } },
  // the hill in the mist: a low drone, a ghostly choir, a far drum
  hill: { bpm: 56, chords: ['Dm', 'Gm', 'Dm', 'Bb'], vol: 0.6, step(i, t, ch, bar, sd) {
    if (i === 0) { M.drone(50, t, sd * 16, 0.07); M.choir(ch, t, sd * 16, 0.012); M.pad(ch, t, sd * 16, 0.012, 500); if (bar % 2 === 0) M.timp(t, 38, 0.18); }
    if (i === 8 && bar % 4 === 3) M.bell(74, t, 0.02);
  } },
  // inside the church: a heartbeat and strings that won't settle
  nave: { bpm: 66, chords: ['Em', 'C', 'Am', 'B'], vol: 0.55, step(i, t, ch, bar, sd) {
    if (i === 0) { M.pad(ch, t, sd * 16, 0.018, 800); M.drone(40, t, sd * 16, 0.05); }
    if (i % 2 === 0) M.bass(ch[0], t, sd * 1.6, 0.035, 450);
    if (i === 0 || i === 3) M.kick(t, 0.2);
    if (i === 12 && bar % 2) M.pluck(ch[2] + 24, t, 0.03);
  } },
  // the crypt: a dark staccato ostinato, timpani, a choir
  crypt: { bpm: 76, chords: ['Cm', 'Ab', 'Fm', 'Gs'], vol: 0.6, step(i, t, ch, bar, sd) {
    if (i === 0) { M.choir(ch, t, sd * 16, 0.013); M.pad(ch, t, sd * 16, 0.014, 600); M.drone(36, t, sd * 16, 0.06); }
    if (i % 2 === 0) M.bass(ch[(i / 2) % 3 === 2 ? 2 : 0], t, sd * 1.2, 0.045, 550);
    if (i === 0 || i === 8) M.timp(t, 36, 0.22);
  } },
  // the bell of the drowned: huge and slow, a choir, the bell itself
  bell: { bpm: 54, chords: ['Dm', 'Eb', 'Dm', 'Cdim'], vol: 0.65, step(i, t, ch, bar, sd) {
    if (i === 0) { M.drone(38, t, sd * 16, 0.09); M.choir(ch, t, sd * 16, 0.017); M.pad(ch, t, sd * 16, 0.02, 700); M.bell(62, t, 0.04); M.timp(t, 38, 0.26); }
    if (i === 8) M.timp(t, 38, 0.14);
  } },
  // a fight: driving bass, drums, brass on the chord changes
  battle: { bpm: 124, chords: ['Am', 'F', 'G', 'E'], vol: 0.5, step(i, t, ch, bar, sd) {
    if (i === 0) { M.pad(ch, t, sd * 16, 0.014, 1200); M.brass(ch.map(m => m + 12), t, sd * 3, 0.022); }
    if (i % 2 === 0) M.bass(ch[0] + (i % 8 === 6 ? 7 : 0), t, sd * 1.5, 0.05, 900);
    if (i === 0 || i === 6 || i === 8) M.kick(t, 0.28);
    if (i === 4 || i === 12) M.noise(t, 0.14, 0.09, 'highpass', 1500);
    if (i % 2 === 1) M.noise(t, 0.03, 0.025, 'highpass', 6000);
    if (i === 14 && bar % 4 === 3) M.timp(t, 40, 0.25);
  } },
  // the boss: faster, darker, with the choir
  boss: { bpm: 134, chords: ['Dm', 'Bb', 'C', 'A'], vol: 0.55, step(i, t, ch, bar, sd) {
    if (i === 0) { M.choir(ch, t, sd * 16, 0.015); M.brass(ch.map(m => m + 12), t, sd * 4, 0.025); M.timp(t, 38, 0.3); }
    if (i % 2 === 0) M.bass(ch[0] + (i % 4 === 2 ? 12 : 0), t, sd * 1.4, 0.055, 1000);
    if (i % 4 === 0) M.kick(t, 0.3);
    if (i === 4 || i === 12) M.noise(t, 0.16, 0.11, 'highpass', 1400);
    if (i % 2 === 1) M.noise(t, 0.03, 0.03, 'highpass', 6000);
    if (i === 8 && bar % 2) M.bell(74, t, 0.025);
  } },
  // victory: a short fanfare, then back to the scene
  win: { bpm: 120, chords: ['C', 'F', 'C'], vol: 0.6, sting: 24, then: null, step(i, t, ch, bar, sd) {
    if (bar === 0 && i % 4 === 0 && i < 12) M.brass([60, 64, 67].map(m => m + [0, 0, 5][i / 4]), t, sd * 3, 0.03);
    if (bar === 0 && i === 12) { M.brass([60, 64, 67, 72], t, sd * 12, 0.035); M.timp(t, 36, 0.3); M.kick(t); }
  } },
  // dawn: warm, major, slow
  dawn: { bpm: 76, chords: ['D', 'A', 'Bm', 'Gmaj'], vol: 0.5, step(i, t, ch, bar, sd) {
    if (i === 0) { M.pad(ch, t, sd * 16, 0.02, 1400); M.drone(ch[0], t, sd * 16, 0.04); }
    if (i % 2 === 0) M.pluck(ch[(i / 2) % 3] + 24, t, 0.03);
  } },
};
const ROOM_MUSIC = { inn: 'village', hill: 'hill', nave: 'nave', altar: 'nave', crypt: 'crypt', door: 'crypt', bell: 'bell', end: 'dawn', tpk: 'village' };
const roomMusic = () => (G && ROOM_MUSIC[G.room]) || 'hill';

/* --- 14. INPUT: drag the 3D world to look around; tap a tile, a monster or a hero. Keys: 1-9 pick, Space/Enter skip, Esc menu --- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let drag = null;
worldEl.addEventListener('pointerdown', e => { PX.Sound.unlock(); drag = { x: e.clientX, y: e.clientY, moved: false, id: e.pointerId }; try { worldEl.setPointerCapture(e.pointerId); } catch (er) { /* fine */ } });
worldEl.addEventListener('pointermove', e => {
  if (!drag || film) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 9) return;
  drag.moved = true; drag.x = e.clientX; drag.y = e.clientY;
  orbit.uyaw = clamp(orbit.uyaw - dx * 0.006, -1.4, 1.4); orbit.upitch = clamp(orbit.upitch + dy * 0.004, -0.4, 0.5);
});
worldEl.addEventListener('pointerup', e => { const d = drag; drag = null; if (d && !d.moved) tapWorld(e.clientX, e.clientY); });
worldEl.addEventListener('wheel', e => { orbit.uzoom = clamp(orbit.uzoom * (e.deltaY > 0 ? 1.08 : 0.93), 0.55, 1.6); }, { passive: true });
function tapWorld(x, y) {
  if (state !== 'play' || sheet || menu) return;
  if (film) { endFilm(); return; }
  if (busy()) { if (cur && cur.k === 'wait') tapped = true; else skip = true; return; }
  if (!F || !F.actor || !choices.length) return;
  ndc.set(x / window.innerWidth * 2 - 1, -(y / window.innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const figs = units.filter(u => standing(u) && !u.gone).map(u => u.fig);
  const hit = ray.intersectObjects(figs, true)[0];
  let u = hit ? units.find(v => v.fig === hit.object.userData.fig) : null;
  let tile = null;
  if (!u) {
    const A = arena(), pl = new THREE.Plane(V(0, 1, 0), -A.y), p = V();
    if (ray.ray.intersectPlane(pl, p)) { tile = [Math.round(p.x - A.cx + (A.w - 1) / 2), Math.round(p.z - A.cz + (A.d - 1) / 2)]; u = unitAt(tile); }
  }
  const h = F.actor, hu = unitOf(h);
  if (!tile) { const A = arena(), pl = new THREE.Plane(V(0, 1, 0), -A.y), p = V(); if (ray.ray.intersectPlane(pl, p)) tile = [Math.round(p.x - A.cx + (A.w - 1) / 2), Math.round(p.z - A.cz + (A.d - 1) / 2)]; }
  if (u && !(F.target && F.target.ok(u.ref)) && u !== hu && tile && !unitAt(tile)) u = null;
  if (u && F.target && F.target.ok(u.ref) && (F.target.kind === 'foe' ? !G.heroes.includes(u.ref) : G.heroes.includes(u.ref))) { const fn = F.target.fn; doChoice(() => fn(u.ref)); return; }
  if (u === hu) { sfx('click'); doChoice(() => heroMenu(h)); return; }
  if (tile && !u && F.menuTop && !F.moved) {
    const m = reach(hu), v = m.get(key(tile));
    if (v) { const path = pathFrom(m, tile); doChoice(() => { walk(hu, path); F.moved = true; then(() => { focusOn(hu); heroMenu(h); }); }); }
  }
}
window.addEventListener('keydown', e => {
  PX.Sound.unlock();
  if (e.target && e.target.tagName === 'INPUT') return;
  if (state === 'play' && G) {
    if (e.code === 'Escape') { if (sheet) closeSheet(); else if (menu) closeMenu(); else openMenu(); return; }
    if (sheet || menu) return;
    if (film && (e.code === 'Space' || e.code === 'Enter' || e.code === 'Escape')) { e.preventDefault(); endFilm(); return; }
    if (/^(Digit|Numpad)[1-9]$/.test(e.code)) { choose1(+e.code.slice(-1) - 1); return; }
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if (cur && cur.k === 'wait') tapped = true; else if (busy()) skip = true; return; }
  }
});

/* --- 15. MAIN LOOP ---------------------------------------------------------------------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000), t = now / 1000; last = now;
  checkLayout();
  if (state === 'play' && G) {
    if (!menu && !sheet) pump(dt);
    if (G) {
      renderParty(); renderInv(); renderChoices(); renderBanner(); renderDie(dt); refreshMarks();
    }
  }
  updateWorld(dt, t);
  Music.update();
  updateCamera(dt, t);
  if (renderer) renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
resize3d();
setState('title');
requestAnimationFrame(frame);
// for the tests: jump into the adventure (a party of n, in a scene), without films
window.PQ = {
  quick(nh = 4, room = 'inn', films = false) {
    skipFilms = !films; newSetup(); party.size = nh;
    for (const h of party) { h.vals = [16, 15, 14, 13, 12, 11]; setClass(h, h.cls); }
    startGame(); if (room !== 'inn') { Q.length = 0; cur = null; G.room = null; clearText(); go(room); }
  },
  get G() { return G; }, get F() { return F; }, get music() { return Music.id; }, get state() { return state; }, get busy() { return busy(); }, get film() { return !!film; },
  choices: () => choices.map(c => c.label), choose: i => choose1(i), skip: () => { skip = true; if (film) endFilm(); if (cur && cur.k === 'wait') tapped = true; },
  units: () => units.map(u => ({ name: u.ref.name, tile: u.tile, pose: u.pose })), tap: tapWorld, toScreen: (x, y, z) => toScreen(V(x, y, z)),
  tileScreen: t => toScreen(tileWorld(t)),
};
</script>
