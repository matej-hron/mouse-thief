<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Pixel Party: a tournament of quick mini-games for 2 to 4 players on one phone. Pick the games, the rounds and the trophy you play for.">
<meta name="theme-color" content="#0d0b13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Pixel Party</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a0f2e; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #screen { position: fixed; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
  #code { position: fixed; display: none; box-sizing: border-box; text-align: center; text-transform: uppercase;
          font: bold 32px ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.3em; padding: 0 0 0 0.3em;
          color: #111; background: #fbf9f3; border: 3px solid #111; border-radius: 0; outline: none; }
  #pname { position: fixed; display: none; box-sizing: border-box; text-align: center; text-transform: uppercase;
          font: bold 22px ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.15em;
          color: #111; background: #fbf9f3; border: 3px solid #111; border-radius: 0; outline: none; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<input id="code" maxlength="4" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" inputmode="text" aria-label="Room code">
<input id="pname" maxlength="10" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" inputmode="text" aria-label="Player name">
<script src="common.js"></script>
<script src="cs.js"></script>
<script>
'use strict';
/* ==========================================================================
   PIXEL PARTY: a tournament of quick mini-games for 2 to 4 players (part of the PIXEL ARCADE).
   ONLINE: 2-4 phones, each player on their own (a 4-letter code or an invite). The host sets the tournament up;
   everybody plays every round at the same time, and the host's phone collects the scores.
   ONE PHONE: the players take turns, passing the phone. Every round is one mini-game: everybody plays the same one
   (the same fruit, the same rocks: it is built from the round's seed), and the best score wins the round.
   Points for a round: 1st 3, 2nd 2, 3rd 1. After the last round the most points wins the tournament's TROPHY.
     Setup: 2-4 players (names), the PLAYLIST (RANDOM, or pick the mini-games), ROUNDS (3, 5 or 7) and the TROPHY
     (BRONZE: 3+ rounds, SILVER: 5+, GOLD: 7). When the phone's own player (player 1) wins, the trophy goes on
     their shelf and on the TROPHIES leaderboard (gold 3, silver 2, bronze 1), and ★ into the arcade's wallet.
   Mini-games: SLICE, TAP RACE, DODGE, CATCH, REACTION, TARGETS, MEMORY, HOP.
     1. Setup   2. Mini-games   3. The tournament   4. Screens   5. Sound   6. Input   7. Main loop
   ========================================================================== */

/* --- 1. SETUP --------------------------------------------------------------- */
const VERSION = '1.1.0';
const SAVE_KEY = 'pixelParty.save';
const save = { sfx: true, names: ['', 'PLAYER 2', 'PLAYER 3', 'PLAYER 4'], n: 2, rounds: 5, trophy: 'silver', random: true, pick: [],
               shelf: { gold: 0, silver: 0, bronze: 0 }, points: 0, played: 0, days: {} };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY)) || {}); } catch (e) { /* new player */ }
const store = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* private mode */ } };
const profile = PX.Profile.get();
save.names[0] = profile.name;

const canvas = document.getElementById('screen');
const S = PX.makeScreen(canvas, { H: 240, minW: 400, maxW: 560 });
const ctx = S.ctx, H = S.H;
const UI = PX.makeUI(S, canvas);
const T = (str, x, y, color = '#fff', size = 1, align = 'left', shadow = null) => PX.drawText(ctx, str, x, y, color, size, align, shadow);
const raw = (...a) => PX.Lang.raw(() => T(...a));   // (names the players typed: never translated)
PX.Lang.page('party');                             // Czech when SETTINGS → LANGUAGE says so (cs.js)
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const nameInput = document.getElementById('pname');
nameInput.addEventListener('input', () => { nameInput.value = nameInput.value.toUpperCase().replace(/[^A-Z0-9 ]/g, '').slice(0, 10); });

const COLS = ['#ff5a5a', '#4aa8ff', '#5ad43f', '#ffd23f'];            // player 1..4
const TROPHIES = [
  { id: 'bronze', name: 'BRONZE', min: 3, pts: 1, stars: 3, col: '#d08a4a', dark: '#8a5424' },
  { id: 'silver', name: 'SILVER', min: 5, pts: 2, stars: 6, col: '#d8dce8', dark: '#8a90a4' },
  { id: 'gold', name: 'GOLD', min: 7, pts: 3, stars: 10, col: '#ffd23f', dark: '#c88a10' },
];
const trophyOf = id => TROPHIES.find(t => t.id === id) || TROPHIES[1];
const DAY_MAX = 5;           // at most 5 trophies a day count on the leaderboard (the shelf keeps them all)

// a seeded random: every player of a round gets the same one
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/* --- 2. MINI-GAMES ----------------------------------------------------------------- */
// Each one: name, how (one line), dur (seconds, or the most), low (true: a lower score is better), unit, and
//   start(r): a fresh game from the random r; step(g, dt); draw(g, t); down(g, x, y) / move(g, x, y) / up(g);
//   g.score; g.done (it can end before the time is up).
const ball = (x, y, r, c, d) => { for (let dy = -r; dy <= r; dy++) { const w = Math.round(Math.sqrt(Math.max(0, r * r - dy * dy))); ctx.fillStyle = d && dy > r * 0.35 ? d : c; ctx.fillRect(Math.round(x - w), Math.round(y + dy), w * 2, 1); } };
const GAMES = {
  slice: {
    name: 'SLICE', how: 'SWIPE ACROSS THE FRUIT. NOT THE BOMBS!', dur: 20, unit: 'FRUIT', bg: '#3a2214',
    start(r) { return { r, fruit: [], spawn: 0.4, blade: null, trail: [], bits: [] }; },
    step(g, dt) {
      const W = S.W;
      if ((g.spawn -= dt) <= 0) {
        g.spawn = 0.7 - Math.min(0.35, g.t * 0.015);
        const n = 1 + Math.floor(g.r() * 3);
        for (let i = 0; i < n; i++) { const x = W * (0.15 + g.r() * 0.7); g.fruit.push({ x, y: H + 16, vx: (W / 2 - x) * (0.2 + g.r() * 0.4), vy: -(260 + g.r() * 70), bomb: g.r() < 0.15, c: ['#e8303a', '#ff9a1e', '#ffe03a', '#3aa83a', '#8a3ac8'][Math.floor(g.r() * 5)] }); }
      }
      for (const f of g.fruit) { f.vy += 330 * dt; f.x += f.vx * dt; f.y += f.vy * dt; }
      g.fruit = g.fruit.filter(f => f.y < H + 30 && !f.cut);
      for (const b of g.bits) { b.vy += 300 * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.l -= dt; }
      g.bits = g.bits.filter(b => b.l > 0);
    },
    draw(g, t) {
      const W = S.W;
      for (let i = 0; i * 22 < W; i++) { ctx.fillStyle = i & 1 ? '#3a2214' : '#43281a'; ctx.fillRect(i * 22, 0, 22, H); }
      for (const f of g.fruit) {
        if (f.bomb) { ball(f.x, f.y, 11, '#2a2a34', '#111118'); ctx.fillStyle = Math.sin(t * 20) > 0 ? '#ffe03a' : '#ff6a1e'; ctx.fillRect(Math.round(f.x) + 2, Math.round(f.y) - 15, 3, 3); }
        else { ball(f.x, f.y, 11, f.c, '#0006'); ctx.fillStyle = '#ffffff88'; ctx.fillRect(Math.round(f.x) - 5, Math.round(f.y) - 6, 3, 3); }
      }
      for (const b of g.bits) { ctx.fillStyle = b.c; ctx.fillRect(Math.round(b.x), Math.round(b.y), 3, 3); }
      const now = performance.now() / 1000; g.trail = g.trail.filter(p => now - p.t < 0.15);
      ctx.strokeStyle = '#ffffff'; ctx.lineCap = 'round';
      for (let i = 1; i < g.trail.length; i++) { if (g.trail[i].gap) continue; ctx.lineWidth = 1 + i / g.trail.length * 4; ctx.beginPath(); ctx.moveTo(g.trail[i - 1].x, g.trail[i - 1].y); ctx.lineTo(g.trail[i].x, g.trail[i].y); ctx.stroke(); }
    },
    down(g, x, y) { g.blade = { x, y, at: performance.now() }; g.trail.push({ x, y, t: performance.now() / 1000, gap: true }); },
    move(g, x, y) {
      if (!g.blade) return;
      const now = performance.now(), dt = Math.max(4, now - g.blade.at) / 1000, dx = x - g.blade.x, dy = y - g.blade.y, len = Math.hypot(dx, dy);
      if (len / dt > 240 && len > 1) for (const f of g.fruit) {
        if (f.cut) continue;
        const k = clamp(((f.x - g.blade.x) * dx + (f.y - g.blade.y) * dy) / (len * len), 0, 1);
        if (Math.hypot(f.x - g.blade.x - dx * k, f.y - g.blade.y - dy * k) < 15) {
          f.cut = true; g.score = Math.max(0, g.score + (f.bomb ? -3 : 1)); sfx(f.bomb ? 'bad' : 'cut');
          for (let i = 0; i < 10; i++) g.bits.push({ x: f.x, y: f.y, vx: (Math.random() - 0.5) * 220, vy: (Math.random() - 0.7) * 200, l: 0.6, c: f.bomb ? '#ff8a1e' : f.c });
        }
      }
      g.blade = { x, y, at: now }; g.trail.push({ x, y, t: now / 1000 });
    },
    up(g) { g.blade = null; },
  },
  tap: {
    name: 'TAP RACE', how: 'TAP AS FAST AS YOU CAN!', dur: 10, unit: 'TAPS', bg: '#2a1050',
    start(r) { return { r, pops: [] }; },
    step(g, dt) { for (const p of g.pops) p.l -= dt; g.pops = g.pops.filter(p => p.l > 0); },
    draw(g, t) {
      const W = S.W; ctx.fillStyle = '#2a1050'; ctx.fillRect(0, 0, W, H);
      const s = 1 + Math.min(0.3, g.pops.length * 0.03);
      ball(W / 2, H / 2 + 10, Math.round(40 * s), '#ff5a8a', '#c83a6a');
      T(String(g.score), W / 2, H / 2, '#fff', 4, 'center', '#000');
      for (const p of g.pops) T('+1', p.x, p.y - (0.5 - p.l) * 40, '#ffd23f', 1, 'center', '#000');
    },
    down(g, x, y) { g.score++; g.pops.push({ x, y, l: 0.5 }); sfx('tap'); },
  },
  dodge: {
    name: 'DODGE', how: 'MOVE YOUR FINGER. DON\'T GET HIT!', dur: 30, unit: 'S', bg: '#0b1a2e', tenths: true,
    start(r) { return { r, x: S.W / 2, rocks: [], spawn: 0.5 }; },
    step(g, dt) {
      const W = S.W;
      if ((g.spawn -= dt) <= 0) { g.spawn = Math.max(0.12, 0.55 - g.t * 0.02); g.rocks.push({ x: g.r() * W, y: -10, v: 90 + g.r() * 60 + g.t * 6, s: 5 + Math.floor(g.r() * 6) }); }
      for (const k of g.rocks) k.y += k.v * dt;
      g.rocks = g.rocks.filter(k => k.y < H + 20);
      g.score = Math.round(g.t * 10) / 10;
      if (g.rocks.some(k => Math.abs(k.x - g.x) < k.s + 6 && Math.abs(k.y - (H - 24)) < k.s + 6)) { g.done = true; sfx('bad'); }
    },
    draw(g, t) {
      const W = S.W; ctx.fillStyle = '#0b1a2e'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#1e3a5a'; ctx.fillRect(0, H - 14, W, 14);
      for (const k of g.rocks) { ctx.fillStyle = '#111'; ctx.fillRect(Math.round(k.x - k.s - 1), Math.round(k.y - k.s - 1), k.s * 2 + 2, k.s * 2 + 2); ctx.fillStyle = '#8a7a6a'; ctx.fillRect(Math.round(k.x - k.s), Math.round(k.y - k.s), k.s * 2, k.s * 2); }
      ctx.fillStyle = '#111'; ctx.fillRect(Math.round(g.x) - 7, H - 31, 14, 16); ctx.fillStyle = COLS[Party.turn % 4]; ctx.fillRect(Math.round(g.x) - 6, H - 30, 12, 14);
      ctx.fillStyle = '#fff'; ctx.fillRect(Math.round(g.x) - 3, H - 26, 2, 2); ctx.fillRect(Math.round(g.x) + 1, H - 26, 2, 2);
    },
    down(g, x) { g.x = x; }, move(g, x) { g.x = clamp(x, 6, S.W - 6); },
  },
  catch: {
    name: 'CATCH', how: 'CATCH THE STARS. NOT THE SKULLS!', dur: 20, unit: '★', bg: '#10203a',
    start(r) { return { r, x: S.W / 2, stuff: [], spawn: 0.3 }; },
    step(g, dt) {
      const W = S.W;
      if ((g.spawn -= dt) <= 0) { g.spawn = 0.45; g.stuff.push({ x: 12 + g.r() * (W - 24), y: -8, v: 100 + g.r() * 80 + g.t * 4, bad: g.r() < 0.22 }); }
      for (const s of g.stuff) {
        s.y += s.v * dt;
        if (!s.got && s.y > H - 30 && s.y < H - 14 && Math.abs(s.x - g.x) < 20) { s.got = true; g.score = Math.max(0, g.score + (s.bad ? -2 : 1)); sfx(s.bad ? 'bad' : 'coin'); }
      }
      g.stuff = g.stuff.filter(s => !s.got && s.y < H + 10);
    },
    draw(g, t) {
      const W = S.W; ctx.fillStyle = '#10203a'; ctx.fillRect(0, 0, W, H);
      for (const s of g.stuff) { if (s.bad) T('X', s.x, s.y - 4, '#ff5a5a', 2, 'center', '#000'); else T('★', s.x, s.y - 4, '#ffd23f', 2, 'center', '#000'); }
      const x = Math.round(g.x); ctx.fillStyle = '#111'; ctx.fillRect(x - 21, H - 23, 42, 12); ctx.fillStyle = COLS[Party.turn % 4]; ctx.fillRect(x - 20, H - 22, 40, 10); ctx.fillStyle = '#0006'; ctx.fillRect(x - 16, H - 22, 32, 3);
    },
    down(g, x) { g.x = x; }, move(g, x) { g.x = clamp(x, 20, S.W - 20); },
  },
  react: {
    name: 'REACTION', how: 'WAIT FOR GREEN, THEN TAP. 5 TIMES.', dur: 40, unit: 'MS', low: true, bg: '#3a0a10',
    start(r) { return { r, tries: [], wait: 1.2 + r() * 2.2, green: false, gt: 0, early: 0, msg: '' }; },
    step(g, dt) {
      if (g.tries.length >= 5) { g.done = true; return; }
      if (!g.green && (g.wait -= dt) <= 0) { g.green = true; g.gt = performance.now(); sfx('go'); }
      g.score = g.tries.length ? Math.round(g.tries.reduce((a, b) => a + b, 0) / g.tries.length) : 9999;
    },
    draw(g, t) {
      const W = S.W; ctx.fillStyle = g.green ? '#1ea83a' : '#a8141e'; ctx.fillRect(0, 0, W, H);
      T(g.green ? 'TAP!' : 'WAIT...', W / 2, H / 2 - 20, '#fff', 4, 'center', '#000');
      T(g.msg, W / 2, H / 2 + 20, '#fff', 2, 'center', '#000');
      T(g.tries.length + ' / 5', W / 2, H - 30, '#fff', 1, 'center', '#000');
    },
    down(g) {
      if (g.tries.length >= 5) return;
      if (g.green) { const ms = Math.round(performance.now() - g.gt); g.tries.push(ms); g.msg = ms + ' MS'; g.green = false; g.wait = 1 + g.r() * 2.4; sfx('tap'); }
      else { g.tries.push(1000); g.msg = 'TOO EARLY! +1000 MS'; g.wait = 1 + g.r() * 2.4; sfx('bad'); }
    },
  },
  targets: {
    name: 'TARGETS', how: 'TAP THE TARGETS BEFORE THEY GO!', dur: 20, unit: 'HITS', bg: '#123a20',
    start(r) { return { r, list: [], spawn: 0.2, fx: [] }; },
    step(g, dt) {
      const W = S.W;
      if ((g.spawn -= dt) <= 0) { g.spawn = Math.max(0.35, 0.75 - g.t * 0.02); g.list.push({ x: 24 + g.r() * (W - 48), y: 40 + g.r() * (H - 70), l: 1.3, r: 13 }); }
      for (const o of g.list) o.l -= dt;
      g.list = g.list.filter(o => o.l > 0 && !o.hit);
      for (const f of g.fx) f.l -= dt; g.fx = g.fx.filter(f => f.l > 0);
    },
    draw(g, t) {
      const W = S.W; ctx.fillStyle = '#123a20'; ctx.fillRect(0, 0, W, H);
      for (const o of g.list) { const r = Math.round(o.r * Math.min(1, o.l * 3)); ball(o.x, o.y, r + 1, '#111'); ball(o.x, o.y, r, '#ffffff'); ball(o.x, o.y, Math.round(r * 0.66), '#e8303a'); ball(o.x, o.y, Math.round(r * 0.33), '#ffffff'); }
      for (const f of g.fx) T('+1', f.x, f.y - (0.5 - f.l) * 30, '#ffd23f', 1, 'center', '#000');
    },
    down(g, x, y) {
      const o = g.list.find(o => !o.hit && Math.hypot(o.x - x, o.y - y) < o.r + 6);
      if (o) { o.hit = true; g.score++; g.fx.push({ x: o.x, y: o.y, l: 0.5 }); sfx('coin'); }
    },
  },
  memory: {
    name: 'MEMORY', how: 'WATCH THE COLORS, THEN TAP THEM IN ORDER.', dur: 60, unit: 'LONG', bg: '#1a1030',
    start(r) { const seq = []; for (let i = 0; i < 30; i++) seq.push(Math.floor(r() * 4)); return { r, seq, len: 3, show: 0.8, i: 0, input: [], lit: -1, litT: 0 }; },
    pads() { const W = S.W, s = 64, gx = W / 2 - s - 4, gy = 54; return [0, 1, 2, 3].map(k => ({ x: gx + (k % 2) * (s + 8), y: gy + Math.floor(k / 2) * (s + 8), s })); },
    step(g, dt) {
      if (g.litT > 0 && (g.litT -= dt) <= 0) g.lit = -1;
      if (g.show !== null && g.show !== undefined && g.show > -1) {      // showing the colors one by one
        if ((g.show -= dt) <= 0) {
          if (g.i < g.len) { g.lit = g.seq[g.i]; g.litT = 0.45; g.i++; g.show = 0.65; sfx('note', g.lit); }
          else { g.show = -1; g.input = []; }
        }
      }
    },
    draw(g, t) {
      const W = S.W; ctx.fillStyle = '#1a1030'; ctx.fillRect(0, 0, W, H);
      const cols = [['#e8303a', '#ff8a8a'], ['#2a7ad8', '#8ac8ff'], ['#3aa83a', '#a8ff8a'], ['#e0a820', '#fff08a']];
      this.pads().forEach((p, k) => { ctx.fillStyle = '#111'; ctx.fillRect(p.x - 2, p.y - 2, p.s + 4, p.s + 4); ctx.fillStyle = cols[k][g.lit === k ? 1 : 0]; ctx.fillRect(p.x, p.y, p.s, p.s); });
      T(g.show > -1 ? 'WATCH...' : 'YOUR TURN: ' + g.input.length + ' / ' + g.len, W / 2, 34, '#fff', 1, 'center', '#000');
    },
    down(g, x, y) {
      if (g.show > -1 || g.done) return;
      const k = this.pads().findIndex(p => x >= p.x && x < p.x + p.s && y >= p.y && y < p.y + p.s); if (k < 0) return;
      g.lit = k; g.litT = 0.2; sfx('note', k);
      if (g.seq[g.input.length] !== k) { g.done = true; sfx('bad'); return; }
      g.input.push(k);
      if (g.input.length === g.len) { g.score = g.len; g.len++; g.i = 0; g.show = 0.9; if (g.len > 30) g.done = true; }
    },
  },
  hop: {
    name: 'HOP', how: 'TAP TO JUMP OVER THE GAPS.', dur: 40, unit: 'M', bg: '#5ab4f0',
    start(r) {
      const gaps = []; let x = 220;
      for (let i = 0; i < 120; i++) { x += 70 + r() * 90; gaps.push({ x, w: 22 + r() * 22 }); }
      return { r, x: 0, y: 0, vy: 0, on: true, gaps, speed: 120 };
    },
    step(g, dt) {
      g.speed = Math.min(260, 120 + g.t * 6); g.x += g.speed * dt;
      g.vy += 900 * dt; g.y = Math.min(0, g.y + g.vy * dt);
      const px = g.x + 60, over = g.gaps.find(gp => px > gp.x && px < gp.x + gp.w);
      if (g.y >= 0) { if (over) { g.y = 1; g.done = true; sfx('bad'); } else { g.vy = 0; g.on = true; } }
      g.score = Math.floor(g.x / 10);
    },
    draw(g, t) {
      const W = S.W, gy = H - 50; ctx.fillStyle = '#5ab4f0'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#3aa83a'; ctx.fillRect(0, gy, W, H - gy); ctx.fillStyle = '#7a4c2a'; ctx.fillRect(0, gy + 6, W, H - gy);
      for (const gp of g.gaps) { const sx = gp.x - g.x; if (sx > W || sx + gp.w < 0) continue; ctx.fillStyle = '#5ab4f0'; ctx.fillRect(Math.round(sx), gy, Math.round(gp.w), H - gy); }
      const y = gy - 12 + g.y; ctx.fillStyle = '#111'; ctx.fillRect(59, Math.round(y) - 1, 12, 13); ctx.fillStyle = COLS[Party.turn % 4]; ctx.fillRect(60, Math.round(y), 10, 11);
      ctx.fillStyle = '#fff'; ctx.fillRect(66, Math.round(y) + 2, 2, 2);
    },
    down(g) { if (g.on && g.y >= 0) { g.vy = -330; g.on = false; sfx('jump'); } },
  },
};
const GAME_IDS = Object.keys(GAMES);
const fmt = (id, v) => (GAMES[id].tenths ? v.toFixed(1) : String(v)) + ' ' + GAMES[id].unit;

/* --- 3. THE TOURNAMENT ----------------------------------------------------------- */
// Party: the tournament being played. players [{ name, col, pts }], list: the mini-game of each round,
// round, turn: whose turn it is, scores: this round's scores
const Party = {
  players: [], list: [], round: 0, turn: 0, scores: [], seed: 0, phase: 'intro', mg: null, count: 0, trophy: 'silver', results: null,
  online: false, me: 0, seeds: [], ready: new Set(), gone: new Set(), introT: 0, waitT: 0,
  // the playlist of a tournament: rounds mini-games, never the same one twice in a row
  makeList(rounds) {
    const pool = save.random || !save.pick.length ? GAME_IDS : save.pick.filter(id => GAMES[id]), list = [];
    let last = '';
    for (let i = 0; i < rounds; i++) { let id; do { id = pool[Math.floor(Math.random() * pool.length)]; } while (pool.length > 1 && id === last); list.push(id); last = id; }
    return list;
  },
  // ONLINE: the host sent the tournament (everybody gets the same list, seeds and players)
  startOnline(m) {
    this.online = true; this.me = m.you | 0; this.gone = new Set();
    this.players = m.players.map((p, i) => ({ name: PX.cleanName(p.name) || 'PLAYER ' + (i + 1), col: COLS[i], pts: 0 }));
    this.list = m.list.filter(id => GAMES[id]); this.seeds = m.seeds; this.trophy = trophyOf(m.trophy).id;
    this.round = 0; this.newRound(); state = 'party'; paused = false; sfx('click');
  },
  start() {
    this.online = false; this.me = 0;
    const n = clamp(save.n | 0, 2, 4), tr = trophyOf(save.trophy), rounds = Math.max(save.rounds, tr.min);
    this.players = [...Array(n)].map((_, i) => ({ name: (i === 0 ? profile.name : save.names[i]) || 'PLAYER ' + (i + 1), col: COLS[i], pts: 0 }));
    this.list = this.makeList(rounds);
    this.round = 0; this.trophy = tr.id; this.newRound();
    state = 'party'; sfx('click');
  },
  newRound() {
    this.turn = this.online ? this.me : 0; this.scores = []; this.ready = new Set(); this.introT = 0; this.waitT = 0; this.phase = 'intro';
    this.seed = this.online ? this.seeds[this.round] >>> 0 : Math.floor(Math.random() * 1e9);
  },
  // ONLINE: I'm ready (the host starts the round when everybody is)
  imReady() { if (this.ready.has(this.me)) return; this.ready.add(this.me); if (Net.isHost) { Net.broadcast({ t: 'rdy', i: this.me }); this.checkReady(); } else Net.send({ t: 'ready', round: this.round }); sfx('click'); },
  present() { return this.players.map((p, i) => i).filter(i => !this.gone.has(i)); },
  checkReady(force) {
    if (!Net.isHost || this.phase !== 'intro') return;
    if (force || this.present().every(i => this.ready.has(i))) { Net.broadcast({ t: 'go', round: this.round }); this.go(); }
  },
  // ONLINE (the host): a score came in; with everybody's, the results go out
  gotScore(i, round, v) {
    if (round !== this.round || !Number.isFinite(v)) return;
    this.scores[i] = v; this.checkScores(false);
  },
  checkScores(force) {
    if (!Net.isHost || this.phase === 'results' || this.phase === 'final') return;
    const M = GAMES[this.id()], miss = this.present().filter(i => this.scores[i] === undefined);
    if (miss.length && !force) return;
    const worst = M.low ? 99999 : -1;
    const scores = this.players.map((p, i) => (this.scores[i] === undefined ? worst : this.scores[i]));
    Net.broadcast({ t: 'res', round: this.round, scores }); this.applyResults(scores);
  },
  id() { return this.list[this.round]; },
  go() {                                         // this player's turn starts: 3, 2, 1
    const M = GAMES[this.id()];
    this.mg = Object.assign(M.start(rng(this.seed)), { t: 0, score: 0, done: false });
    this.phase = 'count'; this.count = 3;
  },
  step(dt) {
    if (this.phase === 'count') { const was = Math.ceil(this.count); this.count -= dt; if (Math.ceil(this.count) !== was && this.count > 0) sfx('beep'); if (this.count <= 0) { this.phase = 'play'; sfx('go'); } }
    else if (this.phase === 'play') {
      const M = GAMES[this.id()], g = this.mg;
      g.t += dt; M.step(g, dt);
      if (g.t >= M.dur || g.done) {
        this.scores[this.turn] = g.score; this.phase = 'done'; this.doneT = 0; sfx('end');
        if (this.online) { this.phase = 'wait'; this.waitT = 0; if (Net.isHost) this.checkScores(false); else Net.send({ t: 'score', round: this.round, v: g.score }); }
      }
    } else if (this.phase === 'done') this.doneT += dt;
    else if (this.phase === 'wait') { this.waitT += dt; if (Net.isHost && this.waitT > 25) this.checkScores(true); }   // (a phone that went quiet: last place)
    else if (this.phase === 'intro') this.introT += dt;
  },
  next() {                                       // the next player, or the round's results
    if (this.turn < this.players.length - 1) { this.turn++; this.phase = 'intro'; return; }
    this.applyResults(this.scores);
  },
  applyResults(scores) {                         // places: equal scores share a place
    this.scores = scores;
    const M = GAMES[this.id()], order = this.players.map((p, i) => i).sort((a, b) => (M.low ? this.scores[a] - this.scores[b] : this.scores[b] - this.scores[a]));
    const place = []; order.forEach((i, k) => { place[i] = k > 0 && this.scores[i] === this.scores[order[k - 1]] ? place[order[k - 1]] : k; });
    this.places = place;
    this.players.forEach((p, i) => { p.got = [3, 2, 1, 0][place[i]] || 0; p.pts += p.got; });
    this.phase = 'results'; sfx('win');
  },
  afterResults() {
    if (this.round < this.list.length - 1) { this.round++; this.newRound(); return; }
    this.finish();
  },
  finish() {
    const best = Math.max(...this.players.map(p => p.pts)), winners = this.players.filter(p => p.pts === best);
    const tr = trophyOf(this.trophy), meWon = this.players[this.me].pts === best;
    this.results = { winners, tr, meWon };
    save.played = (save.played | 0) + 1;
    if (meWon) {
      save.shelf[tr.id] = (save.shelf[tr.id] | 0) + 1;
      const day = new Date().toISOString().slice(0, 10);
      save.days = { [day]: ((save.days || {})[day] | 0) + 1 };          // (only today is kept)
      if (save.days[day] <= DAY_MAX) save.points = (save.points | 0) + tr.pts;
      else this.results.capped = true;
      PX.Wallet.add(tr.stars);
    }
    store();
    this.phase = 'final'; sfx(meWon ? 'trophy' : 'end');
  },
};

function panel(w, h, y, col = '#ff7ab8') {

    const p = P.players[i], yy = y + k * 18;

    if (showGot) T('+' + (p.got | 0), x + w - 50, yy + 5, '#5ad43f', 1, 'right');
    T(p.pts + ' PTS', x + w - 6, yy + 5, '#ffd23f', 1, 'right');

    standings(cx - 160, 126, 320, false);

    if (P.online) {
      if (Net.isHost && UI.button('again', cx - 152, 214, 148, 22, 'NEW TOURNAMENT', { size: 1, accent: '#5ad43f' })) Net.toLobby();
      if (!Net.isHost) T('THE HOST CAN START A NEW ONE', cx - 78, 221, '#9a92b8', 1, 'center', '#000');
      if (UI.button('menu', cx + 4, 214, 148, 22, 'LEAVE', { size: 1 }) || UI.back) { Net.leave(); state = 'title'; }
    } else {
      if (UI.button('again', cx - 152, 214, 148, 22, 'PLAY AGAIN', { size: 1, accent: '#5ad43f' })) Party.start();
      if (UI.button('menu', cx + 4, 214, 148, 22, 'MENU', { size: 1 }) || UI.back) state = 'title';
    }
  }
}
function drawPause() {
  const W = S.W, { y } = panel(220, 110), bw = 170, bx = Math.round(W / 2 - bw / 2);
  T('PAUSED', W / 2, y + 12, '#fff', 3, 'center');
  if (UI.button('resume', bx, y + 40, bw, 22, 'RESUME', { accent: '#5ad43f' }) || UI.back) paused = false;
  if (UI.button('quit', bx, y + 72, bw, 22, Party.online ? 'LEAVE THE TOURNAMENT' : 'END THE TOURNAMENT', { size: 1, accent: '#ff5a5a' })) { paused = false; if (Party.online) Net.leave(); state = 'title'; }
}


/* --- ONLINE: 2-4 phones (the same free PeerJS server as the other games) --------------------------------------------
   The host's phone is the room 'pixel-party-room-' + a 4-letter code; up to 3 friends connect to it (the code, or an
   invite from FRIENDS). The host sets the tournament up and starts it; every round everybody taps READY, the host
   says GO, each phone plays the same mini-game (the same seed) and sends its score; the host sends the results.
   host → guests: lobby { players, you, cfg }, full, old { v }, start { players, you, list, seeds, trophy },
                  go { round }, res { round, scores }, next { round }, gone { i }, lobby2 (back to the lobby), bye
   guests → host: me { name, av, v }, ready { round }, score { round, v }, bye                                       */
const codeInput = document.getElementById('code');
codeInput.addEventListener('input', () => { codeInput.value = codeInput.value.toUpperCase().split('').filter(c => PX.CODE_CHARS.includes(c)).join('').slice(0, 4); });
const ROOM = 'pixel-party-room-';
const Net = {
  peer: null, conns: [], conn: null, isHost: false, live: false, code: '', screen: 'pick', msg: '', players: [], cfg: null, started: false,
  reset() {
    try { if (this.peer) this.peer.destroy(); } catch (e) { /* gone */ }
    this.peer = null; this.conns = []; this.conn = null; this.isHost = false; this.live = false; this.code = ''; this.screen = 'pick'; this.msg = ''; this.players = []; this.cfg = null; this.started = false;
    Party.online = false;
  },
  fail(msg) { this.reset(); state = 'online'; this.screen = 'error'; this.msg = msg; },
  opts() { return { debug: 0, config: { iceServers: PX.ICE_SERVERS } }; },
  me() { return { name: profile.name, av: profile.avatar }; },
  async host() {
    this.reset(); this.isHost = true; this.screen = 'connecting'; this.msg = 'CREATING A GAME';
    try { await PX.loadPeer(); } catch (e) { return this.fail("COULDN'T LOAD ONLINE PLAY. CHECK YOUR INTERNET."); }
    const open = attempt => {
      let code = ''; for (let i = 0; i < 4; i++) code += PX.CODE_CHARS[Math.floor(Math.random() * PX.CODE_CHARS.length)];
      const peer = new Peer(ROOM + code, this.opts()); this.peer = peer;
      peer.on('open', () => { this.code = code; this.screen = 'hosting'; this.msg = ''; this.live = true; this.lobbySync(); });
      peer.on('connection', c => this.guest(c));
      peer.on('disconnected', () => { if (this.peer === peer && !peer.destroyed) peer.reconnect(); });
      peer.on('error', e => { if (e.type === 'unavailable-id' && attempt < 3) { peer.destroy(); open(attempt + 1); } else if (!this.code && e.type !== 'network') this.fail("CAN'T REACH THE GAME SERVER. CHECK YOUR INTERNET."); });
    };
    open(0);
  },
  // a friend connects to my room
  guest(c) {
    c.on('open', () => {
      if (this.started || this.conns.filter(k => k.player).length >= 3) { try { c.send({ t: 'full' }); } catch (e) { /* closing */ } setTimeout(() => c.close(), 300); return; }
      this.conns.push(c);
    });
    c.on('data', m => this.fromGuest(c, m));
    c.on('close', () => this.guestLeft(c));
  },
  fromGuest(c, m) {
    if (!m || typeof m !== 'object') return;
    if (m.t === 'me') {
      if (m.v !== VERSION) { try { c.send({ t: 'old', v: VERSION }); } catch (e) { /* closing */ } setTimeout(() => c.close(), 300); return; }
      c.player = { name: PX.cleanName(m.name) || 'FRIEND', av: m.av }; this.lobbySync(); sfx('join');
    } else if (m.t === 'ready' && c.idx !== undefined && m.round === Party.round) { Party.ready.add(c.idx); Net.broadcast({ t: 'rdy', i: c.idx }); Party.checkReady(); }
    else if (m.t === 'score' && c.idx !== undefined) Party.gotScore(c.idx, m.round, +m.v);
    else if (m.t === 'bye') this.guestLeft(c);
  },
  guestLeft(c) {
    if (c.left) return; c.left = true;
    this.conns = this.conns.filter(k => k !== c);
    if (!this.started) { this.lobbySync(); return; }
    if (c.idx !== undefined) { Party.gone.add(c.idx); this.broadcast({ t: 'gone', i: c.idx }); Party.checkReady(); Party.checkScores(false); }
  },
  // the host: who is in the room and how the tournament is set up, to everybody
  lobbySync() {
    const here = this.conns.filter(c => c.player && !c.left);
    this.players = [this.me(), ...here.map(c => c.player)];
    this.cfg = { rounds: Math.max(save.rounds, trophyOf(save.trophy).min), trophy: save.trophy, random: save.random, pick: save.pick };
    here.forEach((c, i) => { try { c.send({ t: 'lobby', players: this.players, you: i + 1, cfg: this.cfg }); } catch (e) { /* closing */ } });
  },
  start() {
    const here = this.conns.filter(c => c.player && !c.left);
    if (!here.length) return;
    this.started = true;
    here.forEach((c, i) => { c.idx = i + 1; });
    const tr = trophyOf(save.trophy), rounds = Math.max(save.rounds, tr.min), list = Party.makeList(rounds);
    const seeds = list.map(() => Math.floor(Math.random() * 1e9));
    const players = [this.me(), ...here.map(c => c.player)];
    here.forEach(c => { try { c.send({ t: 'start', players, you: c.idx, list, seeds, trophy: tr.id }); } catch (e) { /* closing */ } });
    Party.startOnline({ players, you: 0, list, seeds, trophy: tr.id });
  },
  // the host: back to the room, for a new tournament with whoever is still here
  toLobby() { this.started = false; this.broadcast({ t: 'lobby2' }); state = 'online'; this.screen = 'hosting'; Party.online = false; this.lobbySync(); },
  async join(code) {
    this.reset(); this.isHost = false; this.screen = 'connecting'; this.msg = 'CONNECTING TO ' + code; this.code = code;
    try { await PX.loadPeer(); } catch (e) { return this.fail("COULDN'T LOAD ONLINE PLAY. CHECK YOUR INTERNET."); }
    const peer = new Peer(this.opts()); this.peer = peer;
    peer.on('open', () => {
      const c = peer.connect(ROOM + code, { reliable: true, serialization: 'json' }); this.conn = c;
      c.on('open', () => { this.live = true; this.send({ t: 'me', ...this.me(), v: VERSION }); });
      c.on('data', m => this.fromHost(m));
      c.on('close', () => { if (this.live) { this.live = false; if (state === 'party' && Party.phase === 'final') return; this.fail('THE HOST LEFT.'); } });
    });
    peer.on('error', e => { if (!this.live) this.fail(e && e.type === 'peer-unavailable' ? 'NO GAME WITH THAT CODE.' : "COULDN'T CONNECT. TRY AGAIN."); });
    setTimeout(() => { if (!this.live && this.screen === 'connecting' && this.peer === peer) this.fail("COULDN'T REACH YOUR FRIEND'S PHONE. TRY THE SAME WI-FI."); }, 25000);
  },
  joinTyped() { if (codeInput.value.length === 4) { codeInput.blur(); this.join(codeInput.value); } },
  fromHost(m) {
    if (!m || typeof m !== 'object') return;
    switch (m.t) {
      case 'lobby': this.players = Array.isArray(m.players) ? m.players.slice(0, 4) : []; this.cfg = m.cfg; this.screen = 'lobby'; if (state !== 'party') state = 'online'; break;
      case 'full': this.fail('THAT TOURNAMENT IS FULL OR HAS STARTED.'); break;
      case 'old': this.fail('THE HOST HAS V' + m.v + ', YOU HAVE V' + VERSION + '. RELOAD BOTH.'); break;
      case 'start': if (Array.isArray(m.players) && Array.isArray(m.list) && Array.isArray(m.seeds)) Party.startOnline(m); break;
      case 'go': if (m.round === Party.round && Party.phase === 'intro') Party.go(); break;
      case 'rdy': Party.ready.add(m.i | 0); break;
      case 'res': if (m.round === Party.round && Array.isArray(m.scores)) Party.applyResults(m.scores.map(Number)); break;
      case 'next': if (m.round === Party.round && Party.phase === 'results') Party.afterResults(); break;
      case 'gone': Party.gone.add(m.i | 0); break;
      case 'lobby2': state = 'online'; this.screen = 'lobby'; Party.online = false; break;
      case 'bye': this.fail('THE HOST LEFT.'); break;
    }
  },
  send(m) { if (this.conn && this.conn.open) try { this.conn.send(m); } catch (e) { /* closing */ } },
  broadcast(m) { if (this.isHost) for (const c of this.conns) if (c.open && c.idx !== undefined) try { c.send(m); } catch (e) { /* closing */ } },
  leave() {
    if (this.isHost) for (const c of this.conns) try { c.send({ t: 'bye' }); } catch (e) { /* closing */ }
    else this.send({ t: 'bye' });
    this.live = false; const p = this.peer; this.peer = null; this.conns = []; this.conn = null; Party.online = false;
    setTimeout(() => { try { if (p) p.destroy(); } catch (e) { /* gone */ } }, 200);
  },
};
function drawOnline(t) {
  const W = S.W, cx = Math.round(W / 2), bw = 200, bx = Math.round(cx - bw / 2), dots = '.'.repeat(1 + Math.floor(t * 3) % 3);
  if (Net.screen !== 'join') codeInput.style.display = 'none';
  if (Net.screen === 'hosting') { if (PX.Invite.draw(S, UI, Net.code)) return; drawSetup(t, true); return; }
  const back = (y, label = '< BACK') => { if (UI.button('nback', bx, y, bw, 22, label, { size: 1 }) || UI.back) { Net.leave(); Net.reset(); state = 'title'; } };
  switch (Net.screen) {
    case 'pick':
      T('ONLINE TOURNAMENT', cx, 24, '#5ad43f', 2, 'center', '#000');
      T('2 TO 4 PLAYERS, EACH ON THEIR OWN PHONE.', cx, 50, '#c8b8ff', 1, 'center', '#000');
      T('EVERYBODY PLAYS EVERY ROUND AT THE SAME TIME.', cx, 62, '#c8b8ff', 1, 'center', '#000');
      if (UI.button('host', bx, 84, bw, 28, 'CREATE GAME', { accent: '#5ad43f' })) Net.host();
      if (UI.button('join', bx, 120, bw, 28, 'JOIN WITH A CODE', { accent: '#7af0ff' })) { Net.screen = 'join'; codeInput.value = ''; setTimeout(() => codeInput.focus(), 0); }
      back(180);
      break;
    case 'join': {
      T("TYPE YOUR FRIEND'S CODE", cx, 30, '#fff', 2, 'center', '#000');
      S.placeInput(codeInput, cx - 80, 56, 160, 40);
      if (UI.button('jgo', bx, 110, bw, 28, 'JOIN', { accent: '#5ad43f', disabled: codeInput.value.length !== 4 })) Net.joinTyped();
      back(180);
      break;
    }
    case 'connecting': T(Net.msg + dots, cx, 90, '#fff', 1, 'center', '#000'); back(180, 'CANCEL'); break;
    case 'lobby': {
      T('CODE: ' + Net.code, cx, 14, '#ffd23f', 2, 'center', '#000');
      T('PLAYERS', cx, 40, '#9a92b8', 1, 'center');
      Net.players.forEach((q, i) => { const x = cx - 150 + i * 76; ctx.fillStyle = '#16121f'; ctx.fillRect(x, 52, 70, 20); ctx.fillStyle = COLS[i]; ctx.fillRect(x, 52, 70, 2); raw(PX.cleanName(q.name) || 'PLAYER', x + 35, 59, '#fff', 1, 'center'); });
      const c = Net.cfg || {}, tr = trophyOf(c.trophy);
      trophyIcon(cx, 98, tr, 2);
      T(tr.name + ' TROPHY, ' + (c.rounds | 0) + ' ROUNDS', cx, 114, tr.col, 1, 'center', '#000');
      T(c.random || !(c.pick || []).length ? 'PLAYLIST: RANDOM' : 'PLAYLIST: ' + c.pick.map(id => (GAMES[id] ? PX.tr(GAMES[id].name) : '')).join(', '), cx, 128, '#c8b8ff', 1, 'center', '#000');
      T('WAITING FOR THE HOST TO START' + dots, cx, 150, '#fff', 1, 'center', '#000');
      back(190, 'LEAVE');
      break;
    }
    case 'error': T(Net.msg, cx, 90, '#ff8a8a', 1, 'center', '#000'); back(180, 'OK'); break;
  }
}
/* --- 5. SOUND --------------------------------------------------------------------- */
function sfx(k, n = 0) {
  if (!save.sfx) return;
  const s = PX.Sound;
  if (k === 'click') s.tone([523, 784], 0.1, { vol: 0.1 });
  else if (k === 'tap') s.tone(880 + Math.random() * 200, 0.04, { vol: 0.07, type: 'square' });
  else if (k === 'cut') s.noise(0.08, { freq: 3200, vol: 0.08, filter: 'highpass' });
  else if (k === 'coin') s.tone([1320, 1760], 0.06, { vol: 0.06 });
  else if (k === 'bad') s.tone([300, 90], 0.3, { vol: 0.12, type: 'sawtooth' });
  else if (k === 'jump') s.tone([400, 800], 0.1, { vol: 0.07, type: 'triangle' });
  else if (k === 'note') s.tone([392, 494, 587, 698][n], 0.2, { vol: 0.09, type: 'triangle' });
  else if (k === 'beep') s.tone(660, 0.08, { vol: 0.09 });
  else if (k === 'go') s.tone(1320, 0.15, { vol: 0.1 });
  else if (k === 'end') s.tone([784, 523], 0.25, { vol: 0.1 });
  else if (k === 'win') [523, 659, 784].forEach((f, i) => s.tone(f, 0.12, { vol: 0.09, delay: i * 0.08 }));
  else if (k === 'join') [659, 880].forEach((f, i) => s.tone(f, 0.1, { vol: 0.08, delay: i * 0.08 }));
  else if (k === 'trophy') [523, 659, 784, 1047, 1319].forEach((f, i) => s.tone(f, 0.2, { vol: 0.1, delay: i * 0.1 }));
}

/* --- 6. INPUT: taps and swipes go to the mini-game being played -------------------------- */
const playing = () => state === 'party' && !paused && Party.phase === 'play';
UI.onDown = (e, x, y) => { PX.Sound.unlock(); if (playing() && UI.downId === null) { const M = GAMES[Party.id()]; if (M.down) M.down(Party.mg, x, y); } };
UI.onMove = (e, x, y) => { if (playing()) { const M = GAMES[Party.id()]; if (M.move) M.move(Party.mg, x, y); } };
UI.onUp = () => { if (playing()) { const M = GAMES[Party.id()]; if (M.up) M.up(Party.mg); } };
window.addEventListener('keydown', e => {
  PX.Sound.unlock();
  if (e.target === nameInput) { if (e.key === 'Enter' || e.key === 'Escape') endEdit(); return; }
  if (e.target === codeInput) { if (e.key === 'Enter') Net.joinTyped(); else if (e.key === 'Escape') { codeInput.blur(); UI.back = true; } return; }
  if (playing() && (e.code === 'Space' || e.code === 'Enter')) { e.preventDefault(); if (!e.repeat) { const M = GAMES[Party.id()]; if (M.down) M.down(Party.mg, S.W / 2, H / 2); } return; }
  if (e.code === 'Escape' || e.code === 'KeyP') { if (state === 'party' && Party.phase === 'play') paused = !paused; else UI.back = true; }
});
window.addEventListener('blur', () => { if (playing()) paused = true; });
document.addEventListener('visibilitychange', () => { if (document.hidden && playing()) paused = true; });

/* --- 7. MAIN LOOP ---------------------------------------------------------------------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000), t = now / 1000; last = now;
  UI.begin();
  if (state === 'party') { if (!paused || Party.online) Party.step(dt); drawParty(t); if (paused) drawPause(); }
  else {
    background(t);
    if (state === 'title') drawTitle(t); else if (state === 'setup') drawSetup(t, false); else if (state === 'shelf') drawShelf(t); else if (state === 'online') drawOnline(t);
  }
  if (state !== 'online') codeInput.style.display = 'none';
  if (!nameInput.placed) nameInput.style.display = 'none';
  nameInput.placed = false;
  if (msg) { T(msg.txt, S.W / 2, H - 14, '#fff', 1, 'center', '#000'); if ((msg.t -= dt) <= 0) msg = null; }
  UI.end();
  S.blit('#1a0f2e');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => { /* offline mode unavailable */ }));
}
PX.Pad.setup({
  title: 'Pixel Party: controller', ui: UI, menu: () => !playing(),
  phone: { buttons: [['A', 'TAP']] },
  keys: () => ({ A: 'Space', START: 'KeyP' }),
  help: [['A', 'TAP (TAP RACE, REACTION, HOP)'], ['START', 'PAUSE'], ['STICK|D-PAD', 'MENUS: PICK A BUTTON'], ['A', 'MENUS: OK'], ['B', 'MENUS: BACK']],
});
// an invite from a friend (the arcade opens this page with ?join=CODE): join that tournament right away
PX.Invite.auto(code => { state = 'online'; Net.join(code); });
</script>
