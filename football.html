<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Pixel Football: a retro pixel football game. Run your club, win the league, buy and sell players, play and trade with friends online.">
<meta name="theme-color" content="#0d0b13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Pixel Football</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0b13; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #screen { position: fixed; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
  #code, #nm { position: fixed; display: none; box-sizing: border-box; text-align: center; text-transform: uppercase;
          font: bold 32px ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.3em; padding: 0 0 0 0.3em;
          color: #111; background: #fbf9f3; border: 3px solid #111; border-radius: 0; outline: none; }
  #nm { letter-spacing: 0.08em; padding: 0; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<input id="code" maxlength="4" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" inputmode="text" aria-label="Room code">
<input id="nm" maxlength="14" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" aria-label="Club name">
<script src="common.js"></script>
<script>
'use strict';
/* ==========================================================================
   PIXEL FOOTBALL: a retro side-on football game (part of the PIXEL ARCADE).
   Six a side. You control the player nearest the ball: PASS and SHOOT
   (hold to shoot harder). Run your own club: an 8-club league, a squad of
   players with stats who improve as they play, training, a transfer market.
   Online: play your squad against a friend's, or trade players with them.
     1. Setup     2. Players, clubs, league     3. The match     4. AI
     5. Drawing   6. Online                     7. Sound         8. Screens
     9. Input    10. Main loop
   ========================================================================== */

/* --- 1. SETUP --------------------------------------------------------------- */
const VERSION = '1.2.0';
const SAVE_KEY = 'pixelFootball.save.v1';
const profile = PX.Profile.get();
const canvas = document.getElementById('screen');
const S = PX.makeScreen(canvas, { H: 240, minW: 400, maxW: 560 });
const ctx = S.ctx, H = S.H;
const UI = PX.makeUI(S, canvas);
const T = (str, x, y, color = '#fff', size = 1, align = 'left', shadow = null) => PX.drawText(ctx, str, x, y, color, size, align, shadow);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const hyp = Math.hypot;
const money = n => (n < 0 ? '-$' : '$') + String(Math.abs(Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const moneyK = n => (n >= 1000 ? '$' + Math.round(n / 100) / 10 + 'K' : '$' + Math.round(n));

// The pitch, in its own units: L long (left to right), WD deep (far touchline y=0, near y=WD).
const L = 720, WD = 260, GW = 64, GH = 20, G1 = WD / 2 - GW / 2, G2 = WD / 2 + GW / 2;
const BOX_D = 100, BOX_W = 170, GRAV = 330;
const PZ = 1.25, PY0 = 66, PY1 = 222;          // zoom, screen y of the far and near touchlines
const SQUAD_MIN = 6, SQUAD_MAX = 12;

const KITS = ['#e01e1e', '#2a7fd4', '#f2f2f2', '#ffd23f', '#3fae4a', '#7a3fc4', '#ff8a2a', '#22222a', '#2ad4c4', '#e01e5a', '#8a5a2a', '#9be36b', '#7af0ff', '#ff8ad0', '#9b9b9b'];
const SKINS = ['#f2c9a0', '#e0a878', '#b47a4e', '#7a4a2a'];
const HAIRS = ['#2a1a10', '#6b4a2a', '#e0c060', '#111111', '#a03a1a'];
function colorDist(a, b) {
  const p = parseInt(a.slice(1), 16), q = parseInt(b.slice(1), 16);
  return hyp((p >> 16) - (q >> 16), (p >> 8 & 255) - (q >> 8 & 255), (p & 255) - (q & 255));
}
const okHex = c => typeof c === 'string' && /^#[0-9a-f]{6}$/i.test(c);

/* --- 2. PLAYERS, CLUBS, LEAGUE ------------------------------------------------- */
const SYL_A = ['KO', 'MA', 'RI', 'DE', 'LU', 'NO', 'VA', 'SA', 'BE', 'RO', 'ZE', 'PA', 'TI', 'GO', 'LA', 'MI', 'DO', 'HA', 'JU', 'FE', 'KA', 'BO', 'SI', 'TO', 'ME', 'NA', 'VE', 'RU'];
const SYL_B = ['RAN', 'LIK', 'VEN', 'SKI', 'LOS', 'NEZ', 'TAK', 'RIS', 'BEK', 'LON', 'DIC', 'MAN', 'ROS', 'TEL', 'VIC', 'SEN', 'GAN', 'RUP', 'NOR', 'DAL', 'REZ', 'TON', 'KAS', 'MIR', 'LDO', 'NIK'];
const INITIALS = 'ABCDEFGHJKLMNOPRSTVZ';
const genName = () => INITIALS[ri(0, INITIALS.length - 1)] + '. ' + (Math.random() < 0.35 ? pick(SYL_A) : '') + pick(SYL_A) + pick(SYL_B);
const TOWNS = ['RIVERTON', 'HILLFORD', 'PORTVALE', 'OAKMOOR', 'REDWICK', 'ASHBURY', 'NORTHGATE', 'LAKEMOOR', 'FERNDALE', 'MILLBROOK', 'DUNMORE', 'WESTBAY', 'ELMSTEAD', 'CRAGMOOR'];
const SUFFIX = ['UTD', 'CITY', 'ROVERS', 'TOWN', 'FC', 'ATHLETIC'];

const ROLES = ['GK', 'DF', 'DF', 'MF', 'MF', 'FW'];          // the six places in the team
const STATS = ['spd', 'sho', 'pas', 'def', 'gk'];
const STAT_LABEL = { spd: 'PAC', sho: 'SHO', pas: 'PAS', def: 'DEF', gk: 'GK' };
const POS_W = { GK: { gk: 0.85, spd: 0.15 }, DF: { def: 0.5, spd: 0.25, pas: 0.25 }, MF: { pas: 0.4, spd: 0.2, sho: 0.2, def: 0.2 }, FW: { sho: 0.5, spd: 0.35, pas: 0.15 } };
const POS_OFF = { GK: { gk: 10, spd: -10, sho: -25, pas: -10, def: -12 }, DF: { def: 8, spd: 0, pas: -4, sho: -14, gk: -38 },
                  MF: { pas: 7, spd: 0, sho: -2, def: -4, gk: -38 }, FW: { sho: 9, spd: 5, pas: -4, def: -18, gk: -40 } };
const ovr = p => { const w = POS_W[p.pos]; let s = 0; for (const k in w) s += p[k] * w[k]; return Math.round(s); };
const newId = () => Math.random().toString(36).slice(2, 9) + Math.random().toString(36).slice(2, 6);
function genPlayer(pos, lvl, age) {
  const p = { id: newId(), n: genName(), pos, age: age || ri(17, 33), sk: ri(0, SKINS.length - 1), hr: ri(0, HAIRS.length - 1) };
  for (const k of STATS) p[k] = clamp(Math.round(lvl + POS_OFF[pos][k] + rnd(-7, 7)), 12, 95);
  const o = ovr(p);
  p.pot = clamp(o + (p.age <= 20 ? ri(6, 22) : p.age <= 24 ? ri(2, 12) : p.age <= 28 ? ri(0, 4) : 0), o, 95);
  return p;
}
function value(p) {
  const o = ovr(p), a = p.age <= 21 ? 1.35 : p.age <= 25 ? 1.15 : p.age <= 29 ? 1 : p.age <= 32 ? 0.7 : 0.45;
  return Math.max(100, Math.round(Math.pow(Math.max(0, o - 28), 2) * 4 * a * (1 + Math.max(0, p.pot - o) / 50) / 50) * 50);
}
const sellPrice = p => Math.round(value(p) * 0.75 / 50) * 50;
const trainCost = p => Math.round((100 + ovr(p) * 8) / 50) * 50;
// +1 to one of the stats that matter for the player's position
function improve(p) {
  const w = POS_W[p.pos]; let r = Math.random(), k = 'spd';
  for (const s in w) { k = s; if ((r -= w[s]) <= 0) break; }
  p[k] = Math.min(97, p[k] + 1);
  return k;
}
const strength = club => { const ps = club.players.slice(0, 6); return ps.reduce((s, p) => s + ovr(p), 0) / Math.max(1, ps.length); };
// a player from someone else's phone: keep only what we know, in range
function sanPlayer(p) {
  if (!p || typeof p !== 'object') return null;
  const q = { id: String(p.id || newId()).replace(/[^a-z0-9]/gi, '').slice(0, 16) || newId(), n: String(p.n || '').toUpperCase().replace(/[^A-Z0-9 .]/g, '').slice(0, 12) || 'PLAYER',
              pos: ['GK', 'DF', 'MF', 'FW'].includes(p.pos) ? p.pos : 'MF', age: clamp(p.age | 0, 15, 45), sk: clamp(p.sk | 0, 0, SKINS.length - 1), hr: clamp(p.hr | 0, 0, HAIRS.length - 1) };
  for (const k of STATS) q[k] = clamp(p[k] | 0, 1, 99);
  q.pot = clamp(p.pot | 0, ovr(q), 99);
  return q;
}
function sanClub(c) {
  if (!c || typeof c !== 'object') return null;
  const players = (Array.isArray(c.players) ? c.players : []).slice(0, SQUAD_MAX).map(sanPlayer).filter(Boolean);
  if (players.length < SQUAD_MIN) return null;
  return { name: String(c.name || 'FRIENDS FC').toUpperCase().replace(/[^A-Z0-9 ]/g, '').slice(0, 14) || 'FRIENDS FC',
           kit: okHex(c.kit) ? c.kit : '#2a7fd4', shorts: okHex(c.shorts) ? c.shorts : '#f2f2f2', money: Math.max(0, Number(c.money) || 0), players };
}

function newClub() {
  const kit = PX.AVATAR_COLORS[profile.avatar.color] || '#e01e1e';
  const players = ['GK', 'DF', 'DF', 'MF', 'MF', 'FW', 'DF', 'MF', 'FW'].map((pos, i) => genPlayer(pos, i < 6 ? 46 : 42));
  return { name: (profile.name.trim().slice(0, 10) + ' FC'), kit, shorts: colorDist(kit, '#f2f2f2') < 120 ? '#22222a' : '#f2f2f2',
           money: 5000, players, trophies: 0, seasons: 0, w: 0, d: 0, l: 0 };
}
function makeFixtures(n) {
  const t = [...Array(n).keys()], rounds = [];
  for (let r = 0; r < n - 1; r++) {
    const pairs = [];
    for (let i = 0; i < n / 2; i++) { const a = t[i], b = t[n - 1 - i]; pairs.push(r % 2 ? [b, a] : [a, b]); }
    rounds.push(pairs);
    t.splice(1, 0, t.pop());
  }
  return rounds.concat(rounds.map(r => r.map(([a, b]) => [b, a])));
}
const emptyTable = n => Array.from({ length: n }, () => ({ p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 }));
function newLeague() {
  const towns = TOWNS.slice().sort(() => Math.random() - 0.5), lvls = [40, 44, 47, 50, 53, 56, 60].sort(() => Math.random() - 0.5);
  const kits = KITS.slice().sort(() => Math.random() - 0.5), clubs = [{ me: true }];
  for (let i = 0; i < 7; i++) {
    let suf = pick(SUFFIX); if (towns[i].length + suf.length > 13) suf = pick(['FC', 'UTD']);
    const kit = kits[i];
    clubs.push({ name: towns[i] + ' ' + suf, kit, shorts: pick(['#f2f2f2', '#22222a', kits[(i + 7) % kits.length]]), lvl: lvls[i], players: ROLES.map(pos => genPlayer(pos, lvls[i])) });
  }
  return { season: 1, round: 0, clubs, fixtures: makeFixtures(8), table: emptyTable(8), last: [] };
}
function genMarket(season) {
  const out = [];
  for (let i = 0; i < 8; i++) {
    const pos = pick(['GK', 'DF', 'DF', 'MF', 'MF', 'FW', 'FW']);
    const p = genPlayer(pos, clamp(rnd(38, 62) + season * 2 + (Math.random() < 0.2 ? 12 : 0), 30, 88));
    out.push({ p, price: Math.round(value(p) * rnd(1, 1.25) / 50) * 50 });
  }
  return out.sort((a, b) => ovr(b.p) - ovr(a.p));
}
let save;
function loadSave() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { d = null; }
  if (!d || !d.club || !Array.isArray(d.club.players) || d.club.players.length < SQUAD_MIN || !d.lg) {
    d = Object.assign({ sfx: true, music: true, len: 4 }, d && typeof d === 'object' ? { sfx: d.sfx !== false, music: d.music !== false } : {});
    d.club = newClub(); d.lg = newLeague(); d.market = genMarket(1); d.trainLeft = 3; d.news = null;
  }
  return d;
}
const store = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* private mode */ } };
save = loadSave(); store();
const clubAt = i => (i === 0 ? save.club : save.lg.clubs[i]);
function myFixture() {
  const lg = save.lg, r = lg.fixtures[lg.round];
  if (!r) return null;
  const pair = r.find(p => p.includes(0));
  return { pair, opp: pair[0] === 0 ? pair[1] : pair[0], home: pair[0] === 0 };
}
function tableOrder() {
  const t = save.lg.table;
  return [...t.keys()].sort((a, b) => t[b].pts - t[a].pts || (t[b].gf - t[b].ga) - (t[a].gf - t[a].ga) || t[b].gf - t[a].gf);
}
function recordResult(a, b, ga, gb) {
  const t = save.lg.table, A = t[a], B = t[b];
  A.p++; B.p++; A.gf += ga; A.ga += gb; B.gf += gb; B.ga += ga;
  if (ga > gb) { A.w++; B.l++; A.pts += 3; } else if (ga < gb) { B.w++; A.l++; B.pts += 3; } else { A.d++; B.d++; A.pts++; B.pts++; }
  save.lg.last.push([a, b, ga, gb]);
}
function poisson(l) { const e = Math.exp(-l); let k = 0, p = 1; do { k++; p *= Math.random(); } while (p > e); return Math.min(k - 1, 7); }
// After your match: the other matches of the round are played, the market changes, maybe the season ends.
function finishRound(myGoals, oppGoals) {
  const lg = save.lg, f = myFixture();
  lg.last = [];
  recordResult(0, f.opp, myGoals, oppGoals);
  for (const [a, b] of lg.fixtures[lg.round]) {
    if (a === 0 || b === 0) continue;
    const sa = strength(clubAt(a)), sb = strength(clubAt(b));
    recordResult(a, b, poisson(1.35 * Math.exp((sa - sb) / 22)), poisson(1.35 * Math.exp((sb - sa) / 22)));
  }
  lg.round++;
  save.market = genMarket(lg.season); save.trainLeft = 3;
  if (lg.round >= lg.fixtures.length) endSeason();
  store();
}
const PRIZES = [20000, 12000, 8000, 5000, 4000, 3000, 2500, 2000];
function ageUp(p) {
  p.age++;
  if (p.age >= 30) for (const k of STATS) if (Math.random() < 0.5) p[k] = Math.max(10, p[k] - ri(1, 3));
  if (p.age >= 27) p.pot = Math.min(p.pot, ovr(p) + 1);
}
function endSeason() {
  const lg = save.lg, order = tableOrder(), pos = order.indexOf(0) + 1, prize = PRIZES[pos - 1];
  save.club.money += prize; save.club.seasons++;
  if (pos === 1) { save.club.trophies++; PX.Wallet.add(50); }
  save.news = { season: lg.season, pos, prize, champ: clubAt(order[0]).name, top: order.slice(0, 3).map(i => clubAt(i).name) };
  for (const p of save.club.players) ageUp(p);
  lg.clubs.forEach((c, i) => {
    if (!i) return;
    c.lvl = clamp(c.lvl + ri(-2, 4), 36, 85);
    c.players.forEach((p, j) => { ageUp(p); if (p.age > 33 || Math.random() < 0.2) c.players[j] = genPlayer(ROLES[j], c.lvl, ri(18, 26)); });
  });
  lg.season++; lg.round = 0; lg.fixtures = makeFixtures(8); lg.table = emptyTable(8);
}

/* --- 3. THE MATCH ----------------------------------------------------------------- */
// mode: 'league' | 'local' (two players, one phone) | 'online' | 'attract' (the title screen)
const BASE = [[0.035, 0.5], [0.19, 0.27], [0.19, 0.73], [0.38, 0.22], [0.38, 0.78], [0.55, 0.5]];
let M = null;
// a = PASS presses, bp / br = SHOOT pressed / released, tp = taps and g = swipes (gx, gy, gp: direction and power)
const mkInp = () => ({ mx: 0, my: 0, a: 0, a0: 0, bp: 0, bp0: 0, br: 0, br0: 0, held: false, tp: 0, tp0: 0, g: 0, g0: 0, gx: 1, gy: 0, gp: 0 });
let Inp = [mkInp(), mkInp()];
const consume = i => { i.a0 = i.a; i.bp0 = i.bp; i.br0 = i.br; i.tp0 = i.tp; i.g0 = i.g; };

function makeTeam(side, club, human) {
  const t = { side, dir: side === 0 ? 1 : -1, name: club.name, kit: club.kit, shorts: club.shorts, gkKit: '#c8e03a', human, ctrl: 5, switchT: 0, chaser: null, players: [] };
  club.players.slice(0, 6).forEach((d, i) => t.players.push({
    team: side, idx: i, role: ROLES[i], id: d.id, name: d.n, spd: d.spd, sho: d.sho, pas: d.pas, def: d.def, gk: d.gk,
    skin: SKINS[d.sk | 0] || SKINS[0], hair: HAIRS[d.hr | 0] || HAIRS[0],
    x: 0, y: 0, vx: 0, vy: 0, fx: t.dir, fy: 0, mx: 0, my: 0, anim: 0, st: 0,
    slide: 0, slideCd: 0, kickCd: 0, tackleCd: 0, down: 0, dive: 0, diveV: 0, hold: 0, recv: 0, think: 0, charge: 0, charging: false, taker: 0, takeWait: 0 }));
  return t;
}
function fixKits(a, b) {
  if (colorDist(a.kit, b.kit) < 120) b.kit = colorDist(b.shorts, a.kit) >= 120 ? b.shorts : colorDist('#f2f2f2', a.kit) > 200 ? '#f2f2f2' : '#22222a';
  const gks = ['#c8e03a', '#3fd4a0', '#ff8ad0', '#ff8a2a', '#7af0ff'];
  a.gkKit = gks.find(c => colorDist(c, a.kit) > 120 && colorDist(c, b.kit) > 120) || gks[0];
  b.gkKit = gks.find(c => c !== a.gkKit && colorDist(c, a.kit) > 120 && colorDist(c, b.kit) > 120) || gks[1];
}
function makeMatch(mode, c0, c1, o = {}) {
  const m = { mode, t: [makeTeam(0, c0, mode !== 'attract'), makeTeam(1, c1, mode === 'local' || mode === 'online')],
    ball: { x: L / 2, y: WD / 2, z: 0, vx: 0, vy: 0, vz: 0, px: L / 2, py: WD / 2, ign: [0, 0] },
    owner: null, last: 0, lastP: null, protect: 0, phase: 'kickoff', pt: 1.2, clock: 0, dur: (o.len || save.len) * 60, half: 1, score: [0, 0],
    first: Math.random() < 0.5 ? 0 : 1, msg: '', msgT: 0, flash: 0, cam: L / 2, me: mode === 'online' ? (Net.isHost ? 0 : 1) : 0,
    mirror: mode === 'online' && !Net.isHost, opp: o.opp, goals: [], next: null, report: [], c1 };
  fixKits(m.t[0], m.t[1]);
  return m;
}
function startMatch(mode, c0, c1, o) {
  M = makeMatch(mode, c0, c1, o); Inp = [mkInp(), mkInp()]; Ctl.clear();
  kickoff(M.first); state = 'play'; paused = false; Music.play(null);
}
const say = (text, t = 1.4) => { M.msg = text; M.msgT = t; };
// How good is the computer? Only the computer's team changes (and a little help for yours on EASY).
// spd: running speed, think: extra time before it decides, err: how wild its passes and shots are,
// save: its keeper, tackle / slide: winning the ball, my*: help for your team, pay: money for a match.
const LEVELS = {
  easy:   { name: 'EASY',   spd: 0.8,  think: 0.3,  err: 2.2, shoot: 0.5, save: -0.2,  tackle: -0.14, slide: 0.25, mySave: 0.12, myTackle: 0.12, pay: 0.6, color: '#5ad43f' },
  normal: { name: 'NORMAL', spd: 0.91, think: 0.12, err: 1.4, shoot: 0.8, save: -0.08, tackle: -0.06, slide: 0.6,  mySave: 0.05, myTackle: 0.05, pay: 1,   color: '#ffd23f' },
  hard:   { name: 'HARD',   spd: 1,    think: 0,    err: 1,   shoot: 1,   save: 0,     tackle: 0,     slide: 1,    mySave: 0,    myTackle: 0,    pay: 1.3, color: '#ff6b6b' },
};
const NO_HELP = { spd: 1, think: 0, err: 1, shoot: 1, save: 0, tackle: 0, slide: 1, mySave: 0, myTackle: 0 };
// the level for one side: the computer's team in a match against a person; nothing in online, 2-player or title-screen games
function lvl(side) {
  if (!M || M.mode === 'attract' || !M.t || !M.t.some(t => t.human) || M.t.every(t => t.human)) return NO_HELP;
  return LEVELS[save.level] || LEVELS.normal;
}
const cpu = side => M && M.t && !M.t[side].human && lvl(side) !== NO_HELP;
const maxSpd = p => (58 + p.spd * 0.42) * (M.owner === p ? 0.86 : 1) * (cpu(p.team) ? lvl(p.team).spd : 1);
const minute = () => Math.min(90, Math.floor(M.clock / M.dur * 90));
const inBox = (x, y, t) => Math.abs(x - (t.dir > 0 ? 0 : L)) < BOX_D && Math.abs(y - WD / 2) < BOX_W / 2;
function homePos(p) {
  const t = M.t[p.team];
  let x = BASE[p.idx][0] * L * 0.85; if (x > L / 2 - 20) x = L / 2 - 20;
  if (M.kick !== p.team) x = Math.min(x, L / 2 - 58);
  return [t.dir > 0 ? x : L - x, BASE[p.idx][1] * WD];
}
function resetMan(p) { Object.assign(p, { vx: 0, vy: 0, slide: 0, down: 0, dive: 0, hold: 0, recv: 0, charge: 0, charging: false, taker: 0, kickCd: 0, tackleCd: 0 }); }
function kickoff(team) {
  M.kick = team;
  for (const t of M.t) for (const p of t.players) { const [x, y] = homePos(p); p.x = x; p.y = y; p.fx = t.dir; p.fy = 0; resetMan(p); }

    if (k.pass.includes(e.code)) Inp[side].a++;
    if (k.shoot.includes(e.code)) { Inp[side].bp++; Inp[side].held = true; }
  }
});
window.addEventListener('keyup', e => {
  keys[e.code] = false;
  if (state === 'play') for (const [side, k] of keySets()) if (k.shoot.includes(e.code) && Inp[side].held) { Inp[side].br++; Inp[side].held = false; }
});
function keyMove() {
  for (const [side, k] of keySets()) {
    if (Ctl.stick[side] || Pads.active[side]) continue;
    const on = a => a.some(c => keys[c]);
    let dx = (on(k.right) ? 1 : 0) - (on(k.left) ? 1 : 0), dy = (on(k.down) ? 1 : 0) - (on(k.up) ? 1 : 0);
    const d = hyp(dx, dy) || 1; if (M.mirror) dx = -dx;
    Inp[side].mx = dx / d; Inp[side].my = dy / d;
  }
}
// Game controllers (Xbox and others, on an Xbox, a PC or a phone): the left stick or the d-pad runs,
// A passes (or tackles), B or X shoots, hold for power (or switches player), START pauses.
// In the menus the stick moves between the buttons, A presses, B goes back.
// Two controllers in 2 PLAYERS: the first is player 1, the second player 2.
const Pads = { prev: [{}, {}], active: [false, false], used: false, focus: null, list: [], navT: 0 };
try { if ('gamepadInputEmulation' in navigator) navigator.gamepadInputEmulation = 'gamepad'; } catch (e) { /* not an Xbox */ }
function padNav(dx, dy) {
  const list = Pads.list.filter(b => !b.disabled);
  if (!list.length) return;
  const cur = list.find(b => b.id === Pads.focus);
  let best = null, bs = 1e9;
  if (cur) {
    const cx = cur.x + cur.w / 2, cy = cur.y + cur.h / 2;
    for (const b of list) {
      if (b === cur) continue;
      const ox = b.x + b.w / 2 - cx, oy = b.y + b.h / 2 - cy, along = ox * dx + oy * dy;
      if (along <= 2) continue;
      const s = along + Math.abs(ox * dy - oy * dx) * 4;
      if (s < bs) { bs = s; best = b; }
    }
  }
  if (!cur) return;
  if (best) { Pads.focus = best.id; sfx('click'); }
}
function padPoll(dt) {
  let pads = [];
  try { pads = navigator.getGamepads ? [...navigator.getGamepads()].filter(g => g && g.connected) : []; } catch (e) { pads = []; }
  const inMenu = state !== 'play' || paused;
  pads.slice(0, 2).forEach((gp, n) => {
    const now = {}; for (const i of [0, 1, 2, 3, 8, 9, 12, 13, 14, 15]) now[i] = !!(gp.buttons[i] && gp.buttons[i].pressed);
    const prev = Pads.prev[n], edge = i => now[i] && !prev[i], up = i => !now[i] && prev[i];
    let ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    if (now[14]) ax = -1; if (now[15]) ax = 1; if (now[12]) ay = -1; if (now[13]) ay = 1;
    const m = hyp(ax, ay);
    if (m > 0.4 || Object.values(now).some(Boolean)) { if (!Pads.used) { Pads.used = true; PX.Sound.unlock(); if (!Music.cur && state !== 'play') Music.play('menu'); } }
    if (inMenu) {
      if (n === 0 || state === 'over') {
        if (m > 0.6) { if ((Pads.navT -= dt) <= 0) { Pads.navT = Pads.navT < -1 ? 0.35 : 0.2; Math.abs(ax) > Math.abs(ay) ? padNav(Math.sign(ax), 0) : padNav(0, Math.sign(ay)); } }
        else Pads.navT = 0;
        if (edge(0) && Pads.focus) UI.click = Pads.focus;
        if (edge(1)) UI.back = true;
        if (edge(9) && paused) setPause(false);
      }
    } else if (M) {
      const sides = localSides(), side = M.mode === 'local' ? n : (n === 0 ? sides[0] : undefined);
      if (side !== undefined) {
        const inp = Inp[side];
        if (m > 0.25) { const k = Math.min(1, (m - 0.25) / 0.55) / m; inp.mx = ax * k * (M.mirror ? -1 : 1); inp.my = ay * k; Pads.active[side] = true; }
        else if (Pads.active[side]) { inp.mx = inp.my = 0; Pads.active[side] = false; }
        if (edge(0)) inp.a++;
        if ((edge(1) || edge(2)) && !inp.held) { inp.bp++; inp.held = true; }
        if ((up(1) || up(2)) && inp.held && !now[1] && !now[2]) { inp.br++; inp.held = false; }
        if (edge(9) && M.mode !== 'online') setPause(true);
      }
    }
    Pads.prev[n] = now;
  });
  // in the menus: keep a button picked, and show it as picked (the buttons light up under the "mouse")
  if (Pads.used && inMenu) {
    if (!Pads.list.some(b => b.id === Pads.focus && !b.disabled)) { Pads.focus = null; let big = 0; for (const b of Pads.list) if (!b.disabled && b.w * b.h > big) { big = b.w * b.h; Pads.focus = b.id; } }
    const b = Pads.list.find(q => q.id === Pads.focus); if (b) { UI.mx = b.x + b.w / 2; UI.my = b.y + b.h / 2; }
  }
}
window.addEventListener('pointerdown', () => { Pads.used = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play') setPause(true); });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') setPause(true); });

/* --- 10. MAIN LOOP ----------------------------------------------------------------- */
const STEP = 1 / 120;
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  UI.begin();
  padPoll(dt);
  if ((state === 'play' || state === 'over') && M) {
    if (!paused) {
      acc += dt;
      while (acc >= STEP) { if (state === 'play') keyMove(); if (M.mode === 'online' && !Net.isHost) guestStep(STEP); else step(STEP); acc -= STEP; }
    } else acc = 0;
    Net.tick();
    if (M) { drawGame(now); if (paused) drawPause(); else if (state === 'over') drawOver(now); }
  } else {
    acc += dt; while (acc >= STEP) { attractStep(STEP); acc -= STEP; }
    ({ title: drawHub, squad: drawSquad, market: drawMarket, league: drawLeague, club: drawClub, prematch: drawPrematch, local: drawLocal,
       help: drawHelp, season: drawSeason, net: drawNet })[state in { title: 1, squad: 1, market: 1, league: 1, club: 1, prematch: 1, local: 1, help: 1, season: 1, net: 1 } ? state : 'title'](now);
  }
  drawToast(dt);
  if (!(state === 'net' && Net.screen === 'join')) codeInput.style.display = 'none';
  if (state !== 'club') nameInput.style.display = 'none';
  Pads.list = UI.list.slice();
  UI.end();
  S.blit('#0d0b13');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => { /* offline mode unavailable */ }));
}
PX.Pad.setup({                                     // football reads the controller itself; this is just the help box
  title: 'Pixel Football: controller', menu: () => false,
  help: [['STICK|D-PAD', 'RUN'], ['A', 'PASS (WITHOUT THE BALL: SLIDING TACKLE)'], ['B|X', 'SHOOT, HOLD FOR POWER (WITHOUT THE BALL: SWITCH PLAYER)'], ['STICK', 'WHILE SHOOTING: UP / DOWN AIMS'], ['START', 'PAUSE'], ['STICK|D-PAD', 'MENUS: PICK A BUTTON'], ['A', 'MENUS: OK'], ['B', 'MENUS: BACK'], ['2ND PAD', 'PLAYER 2 IN 2 PLAYERS']],
});
</script>
