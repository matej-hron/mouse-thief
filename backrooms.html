<script type="module">
/* ==========================================================================
   TOM IN THE BACKROOMS: a short cartoon to watch (part of the PIXEL GAMES).
   (A player's wish: a short in the style of the cartoons with flat 2D characters in a 3D world, eyes that dart
   around and moody lighting: Tom and Max survive the Backrooms, and when Tom finally gets home, he can finally play
   pixel games in peace.)
   The world is 3D (three.js, vendor/, MIT licence): endless yellow rooms, a damp carpet, buzzing ceiling lights
   that flicker and go out. The characters are flat paper cut-outs drawn on a 2D canvas every frame (so the eyes can
   dart, blink, widen and the mouths can talk) and stood up in the 3D world, always turned to the camera.
   The whole film is a function of the time: shot(t) puts the camera, the characters, the lights and the words where
   they are at second t, so it can be paused, started over or jumped (window.SHORT.seek for the tests).
     1. Setup   2. Textures   3. The Backrooms   4. Home   5. Cut-outs   6. The film   7. Sound   8. Screens   9. Main loop
   ========================================================================== */
import * as THREE from './vendor/three.module.min.js';

/* --- 1. SETUP --------------------------------------------------------------- */
const VERSION = '1.0.0';
const SAVE_KEY = 'pixelBackrooms.save';
const save = { sfx: true, watched: 0 };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY)) || {}); } catch (e) { /* new viewer */ }
const store = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* private mode */ } };

const hud = document.getElementById('hud');
const S = PX.makeScreen(hud, { H: 240, minW: 400, maxW: 560 });
const ctx = S.ctx, H = S.H, hctx = hud.getContext('2d');
const UI = PX.makeUI(S, hud);
const T = (str, x, y, color = '#fff', size = 1, align = 'left', shadow = '#000') => PX.drawText(ctx, str, x, y, color, size, align, shadow);
PX.Lang.page('backrooms');                         // Czech when SETTINGS → LANGUAGE says so (cs.js)

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = k => { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); };
const span = (t, a, b) => clamp((t - a) / (b - a), 0, 1);          // 0 before a, 1 after b
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const noise1 = x => { const i = Math.floor(x), f = x - i; return lerp(hash(i), hash(i + 1), f * f * (3 - 2 * f)); };
// keyframes: [[t, value], ...] (numbers or [x, y, z]), eased between
function key(t, ks) {
  if (t <= ks[0][0]) return ks[0][1];
  for (let i = 1; i < ks.length; i++) if (t < ks[i][0]) {
    const [t0, a] = ks[i - 1], [t1, b] = ks[i], k = smooth((t - t0) / (t1 - t0));
    return Array.isArray(a) ? a.map((v, j) => lerp(v, b[j], k)) : lerp(a, b, k);
  }
  return ks[ks.length - 1][1];
}
function lin(t, ks) {                               // the same, without easing (steady walking)
  if (t <= ks[0][0]) return ks[0][1];
  for (let i = 1; i < ks.length; i++) if (t < ks[i][0]) {
    const [t0, a] = ks[i - 1], [t1, b] = ks[i], k = (t - t0) / (t1 - t0);
    return Array.isArray(a) ? a.map((v, j) => lerp(v, b[j], k)) : lerp(a, b, k);
  }
  return ks[ks.length - 1][1];
}

let renderer = null;
try { renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('world'), antialias: true, powerPreference: 'high-performance' }); }
catch (e) { renderer = null; }
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(58, 1, 0.05, 120);
function resize3d() {
  if (!renderer) return;
  const w = window.innerWidth, h = window.innerHeight;
  let pr = Math.min(window.devicePixelRatio || 1, 1.5);
  if (w * h * pr * pr > 2.2e6) pr = Math.sqrt(2.2e6 / (w * h));       // keep phones fast
  renderer.setPixelRatio(pr);
  renderer.setSize(w, h);
  const f = filmRect(); camera.aspect = f.w / f.h; camera.updateProjectionMatrix();
}
// the film is shown in the band of the pixel screen (a phone held upright: a wide band in the middle, black around)
function filmRect() { const w = window.innerWidth, h = window.innerHeight, bh = Math.min(h, Math.round(H * S.view.scale / S.view.dpr)); return { w, h: bh, top: Math.round((h - bh) / 2), full: h }; }
window.addEventListener('resize', resize3d);
resize3d();

/* --- 2. TEXTURES (painted on canvases, no image files) --------------------------- */
function canvasTex(w, h, paint, repeat = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  paint(c.getContext('2d'), w, h);
  const tx = new THREE.CanvasTexture(c);
  tx.colorSpace = THREE.SRGBColorSpace;
  if (repeat) tx.wrapS = tx.wrapT = THREE.RepeatWrapping;
  tx.anisotropy = 4;
  return tx;
}
const speckle = (g, w, h, n, cols, size = 1) => { for (let i = 0; i < n; i++) { g.fillStyle = cols[i % cols.length]; g.fillRect(Math.random() * w, Math.random() * h, size, size); } };
// the wallpaper: mono-yellow with thin stripes and a faint pattern, a stain, a dark skirting board at the bottom
const wallTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#cdb85e'; g.fillRect(0, 0, w, h);
  for (let x = 0; x < w; x += 16) { g.fillStyle = 'rgba(255,240,170,0.18)'; g.fillRect(x, 0, 3, h); g.fillStyle = 'rgba(120,95,30,0.10)'; g.fillRect(x + 8, 0, 1, h); }
  g.strokeStyle = 'rgba(130,105,40,0.16)'; g.lineWidth = 1.5;
  for (let y = 10; y < h - 20; y += 22) for (let x = 0; x < w; x += 32) { g.beginPath(); g.moveTo(x + 4, y); g.lineTo(x + 12, y + 7); g.lineTo(x + 20, y); g.stroke(); }
  speckle(g, w, h, 900, ['rgba(90,70,20,0.10)', 'rgba(255,250,200,0.10)'], 2);
  const st = g.createRadialGradient(170, 200, 4, 170, 200, 60); st.addColorStop(0, 'rgba(110,85,25,0.22)'); st.addColorStop(1, 'rgba(110,85,25,0)');
  g.fillStyle = st; g.fillRect(0, 0, w, h);
  g.fillStyle = '#6e5a2a'; g.fillRect(0, h - 14, w, 14); g.fillStyle = '#8a7438'; g.fillRect(0, h - 14, w, 2);
});
const carpetTex = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = '#9c8a48'; g.fillRect(0, 0, w, h);
  speckle(g, w, h, 4000, ['#8a7838', '#ad9a58', '#94823f', '#b5a364'], 1);
  for (let i = 0; i < 3; i++) { const x = Math.random() * w, y = Math.random() * h, r = 14 + Math.random() * 20, d = g.createRadialGradient(x, y, 2, x, y, r); d.addColorStop(0, 'rgba(80,65,25,0.35)'); d.addColorStop(1, 'rgba(80,65,25,0)'); g.fillStyle = d; g.fillRect(0, 0, w, h); }
});
carpetTex.repeat.set(70, 30);
const ceilTex = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = '#d8cd98'; g.fillRect(0, 0, w, h);
  speckle(g, w, h, 1500, ['#c9bd86', '#e2d8a6', '#bfb27a'], 1);
  g.fillStyle = '#a99d6a'; g.fillRect(0, 0, w, 3); g.fillRect(0, 0, 3, h);
});
ceilTex.repeat.set(90, 40);
const woodTex = canvasTex(256, 256, (g, w, h) => {
  for (let y = 0; y < h; y += 32) {
    for (let x = -((y / 32) % 2) * 64; x < w; x += 128) {
      g.fillStyle = ['#9a6438', '#a86e3e', '#8e5a32', '#b07644'][(x / 128 + y / 32 + 8) % 4 | 0]; g.fillRect(x, y, 128, 32);
      g.fillStyle = 'rgba(60,30,10,0.5)'; g.fillRect(x, y, 2, 32);
    }
    g.fillStyle = 'rgba(50,25,10,0.55)'; g.fillRect(0, y, w, 2);
  }
  speckle(g, w, h, 800, ['rgba(60,30,10,0.18)', 'rgba(255,220,170,0.08)'], 2);
});
woodTex.repeat.set(3, 3);
const homeWallTex = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = '#5f7fa8'; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(255,255,255,0.08)'; for (let y = 0; y < h; y += 16) for (let x = (y / 16) % 2 * 8; x < w; x += 16) g.fillRect(x + 6, y + 6, 4, 4);
});
homeWallTex.repeat.set(4, 2);

/* --- 3. THE BACKROOMS --------------------------------------------------------------
   A grid of 5 m cells. The long corridor (row 0, along +x) is where the film happens; the rest is a maze of random
   walls and pillars seen through the gaps. At the end of the corridor: the EXIT door. */
const C = 5, WH = 3.0, I0 = -5, I1 = 18, J0 = -5, J1 = 5, DOOR_X = 17 * C + C / 2;     // the end wall at x = 87.5
const BACK = new THREE.Group(), HOME = new THREE.Group();
scene.add(BACK, HOME);
const wallMat = new THREE.MeshLambertMaterial({ map: wallTex });
let seed = 7;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
function wallBox(x, z, len, along, mat = wallMat, h = WH, y0 = 0) {                  // along 'x' or 'z'
  const g = new THREE.BoxGeometry(along === 'x' ? len : 0.22, h, along === 'x' ? 0.22 : len);
  const uv = g.attributes.uv, k = len / 2.5;
  for (let f = 0; f < 6; f++) {                                     // the long faces repeat the wallpaper along the wall
    const long = along === 'x' ? (f === 4 || f === 5) : (f === 0 || f === 1);
    for (let v = 0; v < 4; v++) { const i = f * 4 + v; uv.setX(i, uv.getX(i) * (long ? k : 0.1)); uv.setY(i, uv.getY(i) * (h / WH)); }
  }
  const m = new THREE.Mesh(g, mat); m.position.set(x, y0 + h / 2, z); BACK.add(m); return m;
}
function buildBackrooms() {
  const W = (I1 - I0 + 1) * C, D = (J1 - J0 + 1) * C, cx = (I0 + I1) / 2 * C, cz = (J0 + J1) / 2 * C;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, D), new THREE.MeshLambertMaterial({ map: carpetTex }));
  floor.rotation.x = -Math.PI / 2; floor.position.set(cx, 0, cz); BACK.add(floor);
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(W, D), new THREE.MeshLambertMaterial({ map: ceilTex }));
  ceil.rotation.x = Math.PI / 2; ceil.position.set(cx, WH, cz); BACK.add(ceil);
  // walls between cells: x-edges (a wall along z between cell i and i+1), z-edges (a wall along x between j and j+1)
  for (let i = I0; i <= I1; i++) for (let j = J0; j <= J1; j++) {
    const x = i * C, z = j * C;
    if (i < I1 && j !== 0 && rnd() < 0.36) {                        // (never across the corridor)
      if (rnd() < 0.5) wallBox(x + C / 2, z, C, 'z');
      else { wallBox(x + C / 2, z - C / 2 + 1.1, 2.2, 'z'); }       // half a wall: a doorway-sized gap
    }
    if (j < J1) {
      const side = j === 0 || j === -1;                              // the corridor's two sides: mostly wall, some gaps
      const gap = (j === 0 && i === 3) || (j === -1 && (i === 5 || i === 9 || i === 12)) || (j === 0 && (i === 7 || i === 13)) || (j === -1 && i === -2);
      if (side ? !gap && i < 17 && i > -4 : rnd() < 0.42) wallBox(x, z + C / 2, C, 'x');
    }
    if (j !== 0 && rnd() < 0.18) {                                   // a square pillar
      const p = new THREE.Mesh(new THREE.BoxGeometry(0.7, WH, 0.7), wallMat); p.position.set(x + (rnd() - 0.5) * 2, WH / 2, z + (rnd() - 0.5) * 2); BACK.add(p);
    }
  }
  // the outside walls
  wallBox(cx, J0 * C - C / 2, W, 'x'); wallBox(cx, J1 * C + C / 2, W, 'x'); wallBox(I0 * C - C / 2, cz, D, 'z'); wallBox(I1 * C + C / 2, cz, D, 'z');
  // the corridor's end: a wall with the EXIT door
  wallBox(DOOR_X, -1.65, 1.7, 'z'); wallBox(DOOR_X, 1.65, 1.7, 'z'); wallBox(DOOR_X, 0, 1.6, 'z', wallMat, WH - 2.15, 2.15);
  wallBox(DOOR_X, -(C / 2 + 0.6), 0.9, 'z');  wallBox(DOOR_X, C / 2 + 0.6, 0.9, 'z');
  // stop the corridor's side walls at the door wall
  wallBox(DOOR_X + 2.5, -2.5, 5, 'x'); wallBox(DOOR_X + 2.5, 2.5, 5, 'x');
}
// the ceiling lights: one panel in every cell (some dead), drawn as one instanced mesh; 8 real lights follow the action
const PANELS = [];
let panelMesh = null;
function buildPanels() {
  for (let i = I0; i <= I1; i++) for (let j = J0; j <= J1; j++) {
    const dead = j !== 0 && rnd() < 0.14, buzz = j !== 0 && rnd() < 0.08;
    PANELS.push({ x: i * C, z: j * C, dead, buzz, b: dead ? 0 : 1, ph: rnd() * 100 });
  }
  const g = new THREE.BoxGeometry(1.5, 0.06, 0.7);
  panelMesh = new THREE.InstancedMesh(g, new THREE.MeshBasicMaterial({ color: 0xffffff, fog: false }), PANELS.length);
  const m = new THREE.Matrix4();
  PANELS.forEach((p, k) => { m.makeTranslation(p.x, WH - 0.03, p.z); panelMesh.setMatrixAt(k, m); panelMesh.setColorAt(k, new THREE.Color(1, 1, 1)); });
  BACK.add(panelMesh);
}
const POOL = [];
for (let i = 0; i < 12; i++) { const l = new THREE.PointLight(0xffefc0, 0, 12.5, 1.1); POOL.push(l); BACK.add(l); }
const hemi = new THREE.HemisphereLight(0xfff0b8, 0x5a4a1e, 0.5);
scene.add(hemi);
const backFog = new THREE.Fog(0x2b2410, 6, 42);
// the EXIT door, the green sign and the white light behind it
const exitSign = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 0.4), new THREE.MeshBasicMaterial({ fog: false, map: canvasTex(128, 48, (g, w, h) => {
  g.fillStyle = '#1a9a3a'; g.fillRect(0, 0, w, h); g.fillStyle = '#d8ffd8'; g.font = 'bold 34px Arial, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('EXIT', w / 2, h / 2 + 2);
  g.strokeStyle = '#d8ffd8'; g.lineWidth = 3; g.strokeRect(3, 3, w - 6, h - 6);
}, false) }));
exitSign.position.set(DOOR_X - 0.13, 2.55, 0); exitSign.rotation.y = -Math.PI / 2;
const doorHinge = new THREE.Group(); doorHinge.position.set(DOOR_X - 0.05, 0, -0.8);
const doorMesh = new THREE.Mesh(new THREE.BoxGeometry(0.08, 2.15, 1.6), new THREE.MeshLambertMaterial({ color: 0x7a6a50 }));
doorMesh.position.set(0, 1.075, 0.8); doorHinge.add(doorMesh);
const knob = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 6), new THREE.MeshLambertMaterial({ color: 0xd8c070 })); knob.position.set(-0.07, 1.05, 1.4); doorHinge.add(knob);
const doorLight = new THREE.Mesh(new THREE.PlaneGeometry(1.7, 2.3), new THREE.MeshBasicMaterial({ color: 0xffffff, fog: false }));
doorLight.position.set(DOOR_X + 0.3, 1.1, 0); doorLight.rotation.y = -Math.PI / 2;
const greenGlow = new THREE.PointLight(0x40ff70, 0, 9, 1.3); greenGlow.position.set(DOOR_X - 0.8, 2.3, 0);
BACK.add(exitSign, doorHinge, doorLight, greenGlow);

/* --- 4. HOME: Tom's living room (far from the Backrooms; only one of the two is shown) ----- */
const HX = 0, HZ = 400;                                 // the room's middle
const homeLamp = new THREE.PointLight(0xffc880, 0, 12, 1.2);
const tvLight = new THREE.PointLight(0x80b0ff, 0, 7, 1.4);
const homeHemi = new THREE.HemisphereLight(0xffe0b0, 0x40304a, 0.0);
let tvTex = null, tvCanvas = null, ceilingBulb = null;
function box(w, h, d, color, x, y, z, parent = HOME, mat = null) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat || new THREE.MeshLambertMaterial({ color }));
  m.position.set(HX + x, y, HZ + z); parent.add(m); return m;
}
function buildHome() {
  const RW = 7, RD = 6, RH = 2.8;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(RW, RD), new THREE.MeshLambertMaterial({ map: woodTex }));
  floor.rotation.x = -Math.PI / 2; floor.position.set(HX, 0, HZ); HOME.add(floor);
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(RW, RD), new THREE.MeshLambertMaterial({ color: 0xe8e0d0 }));
  ceil.rotation.x = Math.PI / 2; ceil.position.set(HX, RH, HZ); HOME.add(ceil);
  const wm = new THREE.MeshLambertMaterial({ map: homeWallTex });
  box(RW, RH, 0.2, 0, 0, RH / 2, -RD / 2, HOME, wm); box(RW, RH, 0.2, 0, 0, RH / 2, RD / 2, HOME, wm);
  box(0.2, RH, RD, 0, -RW / 2, RH / 2, 0, HOME, wm); box(0.2, RH, RD, 0, RW / 2, RH / 2, 0, HOME, wm);
  // the door (back wall, left) and a window with the night and the moon
  box(1.0, 2.1, 0.06, 0x8a5a34, -2.6, 1.05, -2.88);
  box(0.08, 0.08, 0.04, 0xe0c060, -2.25, 1.0, -2.84);
  const win = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 1.1), new THREE.MeshBasicMaterial({ map: canvasTex(128, 88, (g, w, h) => {
    const sky = g.createLinearGradient(0, 0, 0, h); sky.addColorStop(0, '#0b1438'); sky.addColorStop(1, '#2a3a78'); g.fillStyle = sky; g.fillRect(0, 0, w, h);
    speckle(g, w, h * 0.7, 40, ['#ffffff', '#c8d8ff'], 1);
    g.fillStyle = '#fff6c8'; g.beginPath(); g.arc(92, 24, 10, 0, 7); g.fill(); g.fillStyle = '#1a2450'; g.beginPath(); g.arc(97, 21, 9, 0, 7); g.fill();
    g.fillStyle = '#10142a'; for (let x = 0; x < w; x += 14) g.fillRect(x, h - 10 - (x * 7 % 19), 12, 30);
    g.fillStyle = '#ffd860'; for (let x = 3; x < w; x += 14) if (x % 3) g.fillRect(x + 2, h - 6 - (x * 7 % 13) / 2, 2, 2);
    g.fillStyle = '#e8e0d0'; g.fillRect(w / 2 - 2, 0, 4, h); g.fillRect(0, h / 2 - 2, w, 4); g.strokeStyle = '#e8e0d0'; g.lineWidth = 6; g.strokeRect(0, 0, w, h);
  }, false) }));
  win.position.set(HX + 0.9, 1.6, HZ - 2.89); HOME.add(win);
  // the rug, the couch (facing the TV), a little table, a plant, a floor lamp, a poster
  const rug = new THREE.Mesh(new THREE.CircleGeometry(1.5, 32), new THREE.MeshLambertMaterial({ color: 0x3a8a6a }));
  rug.rotation.x = -Math.PI / 2; rug.position.set(HX + 0.6, 0.01, HZ); HOME.add(rug);
  const red = 0xc0483e, dark = 0x963630;
  box(0.95, 0.42, 2.3, red, -1.45, 0.21, 0); box(0.3, 0.6, 2.3, dark, -1.85, 0.72, 0);
  box(0.95, 0.35, 0.22, dark, -1.45, 0.58, -1.2); box(0.95, 0.35, 0.22, dark, -1.45, 0.58, 1.2);
  box(0.5, 0.1, 0.5, 0xe0c060, -1.4, 0.47, -0.6);                               // a cushion
  box(0.7, 0.35, 0.5, 0x6a4a30, 0.6, 0.18, 0.9);                                // the table; a soda can on it
  const can = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.12, 12), new THREE.MeshLambertMaterial({ color: 0xe03030 })); can.position.set(HX + 0.5, 0.42, HZ + 0.9); HOME.add(can);
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.15, 0.35, 12), new THREE.MeshLambertMaterial({ color: 0xb0603a })); pot.position.set(HX + 3.0, 0.18, HZ - 2.5); HOME.add(pot);
  for (let i = 0; i < 6; i++) { const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.22, 8, 6), new THREE.MeshLambertMaterial({ color: 0x3a9a4a })); leaf.scale.set(1, 1.6, 0.5); leaf.position.set(HX + 3.0 + Math.cos(i) * 0.15, 0.6 + (i % 3) * 0.12, HZ - 2.5 + Math.sin(i) * 0.15); leaf.rotation.y = i; HOME.add(leaf); }
  box(0.06, 1.5, 0.06, 0x30303a, -2.9, 0.75, 2.2); box(0.3, 0.04, 0.3, 0x30303a, -2.9, 0.02, 2.2);
  const shade = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.28, 0.32, 16), new THREE.MeshBasicMaterial({ color: 0xffd890 })); shade.position.set(HX - 2.9, 1.6, HZ + 2.2); HOME.add(shade);
  homeLamp.position.set(HX - 2.6, 1.7, HZ + 1.8);

  lines.forEach((l, i) => PX.drawText(ctx, l, bx + bw / 2, by + 5 + i * 8, '#1a1020', 1, 'center'));
}
function drawFilm(t) {
  const W = S.W;
  for (const b of bubbles) drawBubble(b);
  if (caption) {
    const lines = wrap(caption, 2, W - 40);
    const y0 = H - BAR - 8 - lines.length * 14;
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, y0 - 5, W, lines.length * 14 + 8);
    lines.forEach((l, i) => T(l, W / 2, y0 + i * 14, '#fff6c8', 2, 'center', '#000'));
  }
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash})`; ctx.fillRect(0, 0, W, H); }
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, BAR); ctx.fillRect(0, H - BAR, W, BAR);
  if (theEnd > 0) {
    ctx.fillStyle = `rgba(0,0,0,${theEnd * 0.85})`; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = theEnd; PX.drawLogo(ctx, PX.tr('THE END'), W / 2, 90, 6); ctx.globalAlpha = 1;
  }
  // the progress line in the bottom bar
  ctx.fillStyle = '#3a2f5c'; ctx.fillRect(8, H - 9, W - 16, 2); ctx.fillStyle = '#ffd23f'; ctx.fillRect(8, H - 9, Math.round((W - 16) * clamp(t / LENGTH, 0, 1)), 2);
  if (UI.button('pause', W - 28, 0, 24, 15, 'II', { size: 1 })) setPause(true);
  if (UI.button('sfx', W - 54, 0, 24, 15, save.sfx ? 'SND' : 'OFF', { size: 1, on: save.sfx })) { save.sfx = !save.sfx; store(); }
}
function drawTitle(now) {
  const W = S.W;
  ctx.fillStyle = 'rgba(10,8,4,0.35)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, BAR); ctx.fillRect(0, H - BAR, W, BAR);
  PX.drawLogo(ctx, PX.tr('TOM IN THE'), W / 2, 34, 4, { color: '#fff6c8' });
  PX.drawLogo(ctx, PX.tr('BACKROOMS'), W / 2, 62, 6, { color: '#fff6c8' });
  T('A SHORT CARTOON', W / 2, 106, '#ffd23f', 1, 'center');
  if (window.innerHeight > window.innerWidth) T('TURN YOUR PHONE FOR A BIGGER PICTURE', W / 2, 196, '#a898d0', 1, 'center');
  if (UI.button('watch', Math.round(W / 2 - 70), 124, 140, 30, 'WATCH', { accent: '#ffd23f' })) start();
  if (UI.button('games', Math.round(W / 2 - 70), 162, 140, 22, '< ALL GAMES', { size: 1 }) || UI.back) location.href = './';
  if (UI.button('sfx', W - 30, 20, 24, 20, save.sfx ? 'SND' : 'OFF', { size: 1, on: save.sfx })) { save.sfx = !save.sfx; store(); }
  if (save.watched) T(PX.tr('WATCHED') + ': ' + save.watched + 'x', 8, H - BAR - 10, '#a898d0', 1, 'left');
  T('V' + VERSION, W - 6, H - BAR - 10, '#5b5275', 1, 'right', null);
}
function drawPause() {
  const W = S.W;
  ctx.fillStyle = 'rgba(8,6,14,0.72)'; ctx.fillRect(0, 0, W, H);
  T('PAUSED', W / 2, 52, '#fff', 3, 'center');
  if (UI.button('cont', Math.round(W / 2 - 70), 86, 140, 26, 'RESUME', { accent: '#9be36b' }) || UI.back) setPause(false);
  if (UI.button('again', Math.round(W / 2 - 70), 120, 140, 22, 'RESTART', { size: 1 })) start();
  if (UI.button('menu', Math.round(W / 2 - 70), 148, 140, 22, 'MENU', { size: 1 })) toTitle();
  if (UI.button('games', Math.round(W / 2 - 70), 176, 140, 22, '< ALL GAMES', { size: 1 })) location.href = './';
}
function drawEnd() {
  const W = S.W;
  if (UI.button('again', Math.round(W / 2 - 145), 150, 140, 26, 'WATCH AGAIN', { accent: '#ffd23f' })) start();
  if (UI.button('games', Math.round(W / 2 + 5), 150, 140, 26, '< ALL GAMES', { size: 1 }) || UI.back) location.href = './';
}
function start() { PX.Sound.unlock(); state = 'film'; playing = true; paused = false; seek(0); }
function seek(t) { playhead = t; cueAt = 0; while (cueAt < CUES.length && CUES[cueAt][0] < t) cueAt++; beatAt = -1; }
function setPause(v) { if (state !== 'film') return; paused = v; }
function toTitle() { state = 'title'; playing = false; paused = false; }

/* --- 9. MAIN LOOP ---------------------------------------------------------------------------- */
const col = new THREE.Color();
function stageLights(t) {
  const back = setName === 'back';
  BACK.visible = back; HOME.visible = !back;
  scene.fog = back ? backFog : null;
  scene.background = back ? backFog.color : col.set(0x101020);
  if (back) {
    // every panel: its own buzz, dead ones, the film's override; then the 8 real lights go to the nearest lit panels
    for (let k = 0; k < PANELS.length; k++) {
      const p = PANELS[k];
      let b = p.dead ? 0 : p.buzz ? (noise1(t * 9 + p.ph) > 0.3 ? 1 : 0.1) : 1;
      if (panelOverride) b = panelOverride(p, b);
      p.b = b; panelMesh.setColorAt(k, col.setRGB(0.25 + b * 0.75, 0.24 + b * 0.73, 0.2 + b * 0.6));
    }
    panelMesh.instanceColor.needsUpdate = true;
    const near = PANELS.filter(p => p.b > 0.02).map(p => ({ p, d: Math.hypot(p.x - lightFocus, p.z) })).sort((a, b) => a.d - b.d).slice(0, POOL.length);
    POOL.forEach((l, i) => { const n = near[i]; if (n) { l.position.set(n.p.x, WH - 0.25, n.p.z); l.intensity = 10 * n.p.b; } else l.intensity = 0; });
    hemi.intensity = 0.2 * globalPower; hemi.color.setHex(0xfff0b8);
    // how lit each cut-out is: the lit panels near it
    for (const c of CAST) {
      if (c === thing) continue;
      let lt = 0.18; for (const p of PANELS) { if (p.b <= 0.02) continue; const d = Math.hypot(p.x - c.x, p.z - c.z); if (d < 9) lt += p.b * (1 - d / 9) * 0.9; }
      c.light = clamp(lt, 0.15, 1.08);
    }
    greenGlow.intensity = 6; doorHinge.rotation.y = -key(playhead, [[53.5, 0], [53.9, 1.6]]);
    doorLight.visible = playhead > 53.5;
  } else {
    POOL.forEach(l => { l.intensity = 0; }); greenGlow.intensity = 0;
    const flick = playhead > 73.9 && playhead < 74.6 ? (noise1(playhead * 40) > 0.5 ? 1 : 0.1) : 1;
    hemi.intensity = 0; homeHemi.intensity = 0.9 * flick;
    homeLamp.intensity = 7 * flick;
    ceilingBulb.material.color.setRGB(flick, flick * 0.94, flick * 0.8);
    const g = (Math.sin(t * 3) + 1) / 2; tvLight.color.setRGB(0.4 + g * 0.5, 0.5, 1 - g * 0.3); tvLight.intensity = 4;
    for (const c of CAST) c.light = 1.0 * (0.55 + 0.45 * flick);
    drawTV(t);
  }
}
let last = performance.now(), titleT = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  UI.begin();
  hctx.setTransform(1, 0, 0, 1, 0, 0); hctx.clearRect(0, 0, hud.width, hud.height);
  ctx.clearRect(0, 0, S.W, H);
  if (!renderer) {
    ctx.fillStyle = '#0d0b13'; ctx.fillRect(0, 0, S.W, H);
    T("SORRY, THIS DEVICE CAN'T SHOW 3D.", S.W / 2, 100, '#fff', 1, 'center');
    if (UI.button('games', Math.round(S.W / 2 - 70), 130, 140, 24, '< ALL GAMES') || UI.back) location.href = './';
  } else {
    const fovWas = camera.fov;
    if (state === 'title') {
      titleT += dt;                                                               // an empty corridor, drifting slowly
      setName = 'back'; panelOverride = null; caption = ''; bubbles = []; hum = 0.05; globalPower = 1;
      for (const c of CAST) c.visible = false;
      const x = -14 + (titleT * 0.7) % 60;
      camPos.set(x, 1.5, Math.sin(titleT * 0.2) * 0.6); camAt.set(x + 10, 1.4, Math.sin(titleT * 0.15) * 1.5);
      lightFocus = x + 4; t_now = titleT;
      stageLights(titleT);
    } else {
      if (playing && !paused && !frozen) playhead = Math.min(LENGTH, playhead + dt);
      if (playhead >= LENGTH - 0.01 && state === 'film') { state = 'end'; save.watched++; store(); }
      t_now = playhead;
      camera.fov = 58;
      shot(playhead);
      stageLights(playhead);
    }
    const fr = filmRect();
    camera.aspect = fr.w / fr.h;
    camera.position.copy(camPos); camera.lookAt(camAt); camera.updateProjectionMatrix();
    for (const c of CAST) c.update(t_now, dt);
    renderer.setScissorTest(true);
    renderer.setViewport(0, 0, fr.w, fr.full); renderer.setScissor(0, 0, fr.w, fr.full); renderer.setClearColor(0x000000, 1); renderer.clear();
    renderer.setViewport(0, fr.top, fr.w, fr.h); renderer.setScissor(0, fr.top, fr.w, fr.h);
    renderer.render(scene, camera);
    camera.fov = fovWas;
    if (state === 'title') drawTitle(now);
    else { drawFilm(playhead); if (paused) drawPause(); if (state === 'end') drawEnd(); }
  }
  soundFrame(playhead, dt);
  UI.end();
  S.blit('rgba(0,0,0,0)');
  requestAnimationFrame(frame);
}
if (renderer) { buildBackrooms(); buildPanels(); buildHome(); }
requestAnimationFrame(frame);

/* --- input ----------------------------------------------------------------------- */
UI.onDown = () => { PX.Sound.unlock(); };
window.addEventListener('keydown', e => {
  PX.Sound.unlock();
  if (e.code === 'Space' || e.code === 'KeyP') { if (state === 'film') setPause(!paused); else if (state === 'title' || state === 'end') start(); e.preventDefault(); }
  else if (e.code === 'Escape') { if (state === 'film' && !paused) setPause(true); else UI.back = true; }
  else if (e.code === 'KeyM') { save.sfx = !save.sfx; store(); }
  else if (state === 'film' && e.code === 'ArrowRight') seek(Math.min(LENGTH - 0.1, playhead + 5));
  else if (state === 'film' && e.code === 'ArrowLeft') seek(Math.max(0, playhead - 5));
});
window.addEventListener('blur', () => setPause(true));
document.addEventListener('visibilitychange', () => { if (document.hidden) setPause(true); });

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => { /* offline mode unavailable */ }));
}
// for the tests: jump to a second of the film and stop there
window.SHORT = { start, seek: t => { if (state !== 'film') start(); seek(t); frozen = true; }, play: () => { frozen = false; }, get t() { return playhead; }, get state() { return state; }, LENGTH };
PX.Pad.setup({
  title: 'Tom in the Backrooms: controller', ui: UI,
  phone: { stick: '', buttons: [['A', 'PAUSE']] },
  menu: () => true,
  keys: () => ({ START: 'KeyP' }),
  help: [['START', 'PAUSE'], ['STICK|D-PAD', 'MENUS: PICK A BUTTON'], ['A', 'MENUS: OK'], ['B', 'MENUS: BACK']],
});
