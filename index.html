<!DOCTYPE html>
<html lang="en">
<head>

<meta name="theme-color" content="#0d0b13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Pixel Arcade</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0b13; }

          font: bold 24px ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.2em;
          color: #111; background: #fbf9f3; border: 3px solid #111; border-radius: 0; outline: none; }

</head>
<body>
<canvas id="screen"></canvas>
<input id="name" maxlength="10" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" inputmode="text" aria-label="Your name">
<script src="common.js"></script>
<script>
'use strict';
/* PIXEL ARCADE: the dashboard. Pick a game, set your name and avatar (all the games use them). */
const VERSION = '2.5.0';
const canvas = document.getElementById('screen');
const S = PX.makeScreen(canvas, { H: 240, minW: 400, maxW: 560 });
const ctx = S.ctx, H = S.H;
const UI = PX.makeUI(S, canvas);
const T = (str, x, y, color = '#fff', size = 1, align = 'left', shadow = null) => PX.drawText(ctx, str, x, y, color, size, align, shadow);
let profile = PX.Profile.load();
PX.Profile.save(profile);
let screen = 'home';                  // home | profile
let draft = null;                     // the profile being edited
const nameInput = document.getElementById('name');
nameInput.addEventListener('input', () => { nameInput.value = nameInput.value.toUpperCase().replace(/[^A-Z0-9 ]/g, '').slice(0, 10); });
window.addEventListener('keydown', e => {
  if (e.target === nameInput) { if (e.key === 'Enter') saveProfile(); else if (e.key === 'Escape') { nameInput.blur(); screen = 'home'; } return; }
  if (e.key === 'Escape') UI.back = true;
  if (screen === 'home') {
    const step = { ArrowDown: 40, ArrowUp: -40, PageDown: 150, PageUp: -150 }[e.key];
    if (step) { e.preventDefault(); scroll.v = 0; scrollTo(scroll.y + step); }
    if (e.key === 'Home') scrollTo(0); else if (e.key === 'End') scrollTo(1e9);
  }
});
UI.onDown = (e, x, y) => {
  PX.Sound.unlock();
  if (screen !== 'home') return;
  const L = layout();
  if (y < L.top) return;
  if (L.max > 0 && x >= S.W - 18) { scroll.bar = true; scroll.v = 0; UI.downId = null; barTo(y); return; }
  scroll.v = 0; scroll.drag = { id: e.pointerId, last: y, t: performance.now(), moved: 0 };
};
const thiefIcon = new Image(); thiefIcon.src = 'icons/icon-192.png';
const GAMES = [
  { id: 'thief', name: 'MOUSE THIEF', sub: 'RUN FROM THE CAT!', url: 'thief.html', color: '#e01e1e' },
  { id: 'racer', name: 'PIXEL GP', sub: 'RACE CARS!', url: 'racer.html', color: '#2a7fd4' },
  { id: 'heist', name: 'PIXEL HEIST', sub: 'ROB THE BANK!', url: 'heist.html', color: '#ffd23f' },
  { id: 'pong', name: 'PIXEL PONG', sub: 'TABLE TENNIS!', url: 'pong.html', color: '#1ec8e0' },
  { id: 'football', name: 'PIXEL FOOTBALL', sub: 'RUN YOUR CLUB!', url: 'football.html', color: '#3fae4a' },
  { id: 'hoops', name: 'PIXEL HOOPS', sub: 'SHOOT BASKETS!', url: 'hoops.html', color: '#ff8a2a' },
  { id: 'wings', name: 'PIXEL WINGS', sub: 'AIR BATTLE!', url: 'wings.html', color: '#7ac8ff' },
];
let installPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => { /* offline mode unavailable */ }));
}
function play(g) { PX.Sound.tone([523, 784], 0.15, { vol: 0.12 }); setTimeout(() => { location.href = g.url; }, 120); }

// --- background: a slowly scrolling pixel starfield and floor grid ------------------------------
function background(t) {
  const W = S.W;
  ctx.fillStyle = '#0d0b13'; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 70; i++) {
    const x = ((i * 73.7 + t * (6 + (i % 3) * 6)) % (W + 10)) - 5, y = (i * 37.3) % 150;
    ctx.fillStyle = i % 5 ? '#4a4068' : '#efe9ff'; ctx.fillRect(Math.round(W - x), Math.round(y), 1, 1);
  }
  ctx.fillStyle = '#1d1830'; ctx.fillRect(0, 150, W, H - 150);
  ctx.fillStyle = '#3a2f5c';
  for (let k = 0; k < 8; k++) { const y = 150 + Math.round(Math.pow((k + (t * 0.6) % 1) / 8, 2) * (H - 150)); ctx.fillRect(0, y, W, 1); }
  for (let k = -10; k <= 10; k++) { const x0 = W / 2 + k * 14, x1 = W / 2 + k * 70; ctx.beginPath(); ctx.moveTo(x0, 150); ctx.lineTo(x1, H); ctx.strokeStyle = '#3a2f5c'; ctx.stroke(); }
}
// --- little animated previews on the game cards -----------------------------------------
function previewThief(x, y, w, h, t) {
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.fillStyle = '#140f24'; ctx.fillRect(x, y, w, h);
  for (let i = 0; i < 14; i++) { ctx.fillStyle = i % 4 ? '#6a5f90' : '#ffffff'; ctx.fillRect(x + (i * 37) % w, y + 4 + (i * 13) % (h - 26), 1, 1); }
  ctx.fillStyle = '#f3e9c8'; ctx.fillRect(x + w - 22, y + 6, 10, 10); ctx.fillRect(x + w - 23, y + 8, 12, 6);   // moon
  const sc = (t * 40) % 30;
  ctx.fillStyle = '#2a2240';                                               // far buildings
  for (let i = -1; i < 7; i++) { const bh = 14 + ((i + Math.floor(t * 40 / 30)) * 7) % 16; ctx.fillRect(Math.round(x + i * 30 - sc), y + h - 14 - bh, 24, bh); }
  ctx.fillStyle = '#e9c46a';
  for (let i = -1; i < 7; i++) ctx.fillRect(Math.round(x + i * 30 - sc + 6), y + h - 24, 2, 3);
  ctx.fillStyle = '#0d0b13'; ctx.fillRect(x, y + h - 14, w, 14); ctx.fillStyle = '#8070b0'; ctx.fillRect(x, y + h - 14, w, 1);
  const g = y + h - 14, leg = Math.floor(t * 12) % 2;
  // the thief, with the mouse on his head
  const tx = Math.round(x + w * 0.62), ty = g - 14 - (leg ? 1 : 0);
  ctx.fillStyle = '#8b7fb0'; ctx.fillRect(tx - 1, ty - 1, 9, 13);
  ctx.fillStyle = '#000'; ctx.fillRect(tx, ty, 7, 11); ctx.fillRect(tx + (leg ? 0 : 1), ty + 11, 2, 3); ctx.fillRect(tx + (leg ? 5 : 4), ty + 11, 2, 3);
  ctx.fillStyle = '#ff2424'; ctx.fillRect(tx + 3, ty + 3, 1, 2); ctx.fillRect(tx + 5, ty + 3, 1, 2);
  ctx.fillStyle = '#9b9b9b'; ctx.fillRect(tx + 1, ty - 4, 6, 3); ctx.fillStyle = '#e7a3ad'; ctx.fillRect(tx + 5, ty - 5, 2, 1);
  // the cat, right behind him
  const cx = Math.round(x + w * 0.18 + Math.sin(t * 2) * 4), cy = g - 12;
  ctx.fillStyle = '#8b7fb0'; ctx.fillRect(cx - 1, cy + 1, 24, 10);
  ctx.fillStyle = '#000';
  ctx.fillRect(cx, cy + 3, 16, 6); ctx.fillRect(cx + 14, cy, 8, 7); ctx.fillRect(cx + 14, cy - 2, 2, 2); ctx.fillRect(cx + 20, cy - 2, 2, 2);
  ctx.fillRect(cx - 4, cy + 1, 4, 2); ctx.fillRect(cx - 5, cy - 2, 2, 4);
  ctx.fillRect(cx + 1 + leg * 2, cy + 9, 2, 3); ctx.fillRect(cx + 11 - leg * 2, cy + 9, 2, 3);
  ctx.fillStyle = '#ff3b3b'; ctx.fillRect(cx + 16, cy + 2, 2, 2); ctx.fillRect(cx + 19, cy + 2, 2, 2);
  ctx.restore();
}
function previewRacer(x, y, w, h, t) {
  ctx.fillStyle = '#7ec4ec'; ctx.fillRect(x, y, w, h / 2);
  ctx.fillStyle = '#3fae4a'; ctx.fillRect(x, y + h / 2, w, h / 2);
  const hz = y + h / 2, cx = x + w / 2;
  for (let r = 0; r < h / 2; r++) {                              // road with moving stripes
    const k = r / (h / 2), half = 4 + k * w * 0.45, yy = hz + r;
    const stripe = Math.floor((1 / (k + 0.05)) * 3 - t * 12) % 2;
    ctx.fillStyle = stripe ? '#e01e1e' : '#f4f4f4'; ctx.fillRect(Math.round(cx - half - 3 - k * 4), yy, Math.round(3 + k * 4), 1); ctx.fillRect(Math.round(cx + half), yy, Math.round(3 + k * 4), 1);
    ctx.fillStyle = stripe ? '#6b6b73' : '#64646c'; ctx.fillRect(Math.round(cx - half), yy, Math.round(half * 2), 1);
  }
  const cw = 34, ch = 16, carX = Math.round(cx - cw / 2 + Math.sin(t * 1.5) * 10), carY = y + h - ch - 2;   // a little race car
  ctx.fillStyle = '#111'; ctx.fillRect(carX, carY + 5, 7, 11); ctx.fillRect(carX + cw - 7, carY + 5, 7, 11);
  ctx.fillStyle = PX.AVATAR_COLORS[profile.avatar.color]; ctx.fillRect(carX + 9, carY + 6, 16, 8);
  ctx.fillStyle = '#ffd23f'; ctx.fillRect(carX + 15, carY + 3, 4, 3);
  ctx.fillStyle = '#16161c'; ctx.fillRect(carX + 3, carY, 28, 3); ctx.fillStyle = PX.AVATAR_COLORS[profile.avatar.color]; ctx.fillRect(carX + 3, carY, 28, 1);
}
function previewHeist(x, y, w, h, t) {
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.fillStyle = '#14123a'; ctx.fillRect(x, y, w, h);                     // night
  for (let i = 0; i < 8; i++) {                                           // the city, with lit windows
    const bx = x + i * 18 - 4, bh = 18 + (i * 37) % 22, by = y + h - 14 - bh;
    ctx.fillStyle = i % 2 ? '#2a2850' : '#33305e'; ctx.fillRect(bx, by, 16, bh);
    for (let r = 0; r < bh - 4; r += 5) for (let c = 2; c < 14; c += 4) if ((i * 7 + r * 3 + c) % 5 < 3) { ctx.fillStyle = '#ffcf70'; ctx.fillRect(bx + c, by + 3 + r, 2, 2); }
  }
  const bkx = Math.round(x + w / 2 - 22), bky = y + h - 36;                // the bank
  ctx.fillStyle = '#e8e4dc'; ctx.fillRect(bkx, bky, 44, 22); ctx.fillRect(bkx + 4, bky - 4, 36, 4); ctx.fillRect(bkx + 12, bky - 8, 20, 4);
  ctx.fillStyle = '#b8b0a0'; for (let c = 0; c < 5; c++) ctx.fillRect(bkx + 4 + c * 9, bky + 3, 3, 19);
  ctx.fillStyle = '#4a3a2a'; ctx.fillRect(bkx + 19, bky + 10, 6, 12);
  ctx.fillStyle = '#4a4a55'; ctx.fillRect(x, y + h - 14, w, 14);          // the road
  ctx.fillStyle = '#e8d36a'; for (let k = 0; k < 6; k++) ctx.fillRect(x + ((k * 24 - t * 60) % (w + 24) + w + 24) % (w + 24) - 12, y + h - 8, 10, 1);
  const run = (t * 0.35) % 1, tx = Math.round(x + 6 + run * (w - 30)), ty = y + h - 24, leg = Math.floor(t * 10) % 2;   // the thief with the loot
  ctx.fillStyle = '#111'; ctx.fillRect(tx + 1, ty, 6, 3);
  ctx.fillStyle = '#f0c090'; ctx.fillRect(tx + 1, ty + 3, 6, 2);
  ctx.fillStyle = PX.AVATAR_COLORS[profile.avatar.color]; ctx.fillRect(tx, ty + 5, 8, 6);
  ctx.fillStyle = '#c8a060'; ctx.fillRect(tx - 4, ty + 4, 5, 6); ctx.fillStyle = '#5ab04a'; ctx.fillRect(tx - 3, ty + 6, 3, 2);
  ctx.fillStyle = '#2a2a34'; ctx.fillRect(tx + (leg ? 0 : 2), ty + 11, 2, 3); ctx.fillRect(tx + (leg ? 6 : 4), ty + 11, 2, 3);
  const px = Math.round(tx - 30), py = y + h - 20, fl = Math.floor(t * 6) % 2;   // the police, close behind
  if (px > x - 24) {
    ctx.fillStyle = '#f4f4f4'; ctx.fillRect(px, py + 2, 22, 5); ctx.fillStyle = '#111'; ctx.fillRect(px + 5, py + 3, 10, 3); ctx.fillStyle = '#22304a'; ctx.fillRect(px + 6, py - 2, 10, 4);
    ctx.fillStyle = fl ? '#ff2a2a' : '#2a6bff'; ctx.fillRect(px + 8, py - 4, 3, 2); ctx.fillStyle = fl ? '#2a6bff' : '#ff2a2a'; ctx.fillRect(px + 12, py - 4, 3, 2);
    ctx.fillStyle = '#151515'; ctx.fillRect(px + 2, py + 7, 4, 3); ctx.fillRect(px + 16, py + 7, 4, 3);
  }
  ctx.restore();
}
function previewPong(x, y, w, h, t) {
  ctx.fillStyle = '#1ec8e0'; ctx.fillRect(x, y, w, h);
  const tx = x + 10, ty = y + 8, tw = w - 20, th = h - 16;
  ctx.fillStyle = '#111'; ctx.fillRect(tx - 2, ty - 2, tw + 4, th + 4);
  ctx.fillStyle = '#3ad44f'; ctx.fillRect(tx, ty, tw, th);
  ctx.fillStyle = '#d8f8d8'; ctx.fillRect(tx, ty + th / 2 - 1, tw, 2);
  ctx.fillStyle = '#111'; ctx.fillRect(tx + tw / 2 - 1, ty - 3, 2, th + 6);
  const k = (t * 0.8) % 2, f = k < 1 ? k : 2 - k;                            // the ball goes back and forth
  const bx = tx + 6 + f * (tw - 12), by = ty + th / 2 + Math.sin(t * 2.3) * (th / 2 - 5);
  const bat = (px, py, c) => { ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(px, py, 7, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = c; ctx.beginPath(); ctx.arc(px, py, 5.5, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillRect(px - 4, py - 1, 8, 2); };
  const yy = (side) => ty + th / 2 + Math.sin(t * 2.3 + (side ? 0.3 : -0.3)) * (th / 2 - 5);
  bat(tx - 2, yy(0), PX.AVATAR_COLORS[profile.avatar.color]); bat(tx + tw + 2, yy(1), '#e01e1e');
  ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fillRect(Math.round(bx - (k < 1 ? 8 : -2)), Math.round(by) - 1, 6, 2);
  ctx.fillStyle = '#111'; ctx.fillRect(Math.round(bx) - 2, Math.round(by) - 2, 5, 5); ctx.fillStyle = '#ffe23a'; ctx.fillRect(Math.round(bx) - 1, Math.round(by) - 1, 3, 3);
}
function previewFootball(x, y, w, h, t) {
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.fillStyle = '#231c3a'; ctx.fillRect(x, y, w, 14);                    // the crowd
  for (let i = 0; i < w; i += 4) { ctx.fillStyle = ['#e01e1e', '#2a7fd4', '#f2f2f2', '#ffd23f'][(i / 4) % 4]; ctx.fillRect(x + i, y + 4 + ((i / 4) % 2) * 4 - (Math.floor(t * 6 + i) % 5 === 0 ? 1 : 0), 3, 2); }
  for (let r = 14; r < h; r++) for (let i = -1; i < 6; i++) {               // striped grass, slightly in perspective
    const k = (r - 14) / (h - 14), sw = (w / 4) * (0.8 + 0.2 * k), ox = ((t * 14) % (sw * 2));
    ctx.fillStyle = i % 2 ? '#3c9e46' : '#45ab4f'; ctx.fillRect(Math.round(x + i * sw - ox + sw), y + r, Math.ceil(sw), 1);
  }
  ctx.fillStyle = '#e8f6e8'; ctx.fillRect(x, y + 16, w, 1); ctx.fillRect(x, y + h - 3, w, 1);
  const gx = x + w - 10; ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(gx, y + 26, 8, 16);    // the goal
  ctx.fillStyle = '#fff'; ctx.fillRect(gx - 1, y + 24, 2, 20); ctx.fillRect(gx - 1, y + 24, 9, 2);
  const man = (mx, my, kit, leg) => {
    ctx.fillStyle = '#111'; ctx.fillRect(mx - 3, my - 13, 7, 13);
    ctx.fillStyle = '#f2c9a0'; ctx.fillRect(mx - 1, my - 12, 3, 3);
    ctx.fillStyle = kit; ctx.fillRect(mx - 2, my - 9, 5, 4);
    ctx.fillStyle = '#fff'; ctx.fillRect(mx - 2, my - 5, 5, 2);
    ctx.fillStyle = '#f2c9a0'; ctx.fillRect(mx - 2 + leg, my - 3, 2, 3); ctx.fillRect(mx + 1 - leg, my - 3, 2, 3);
  };
  const run = (t * 0.3) % 1, px = Math.round(x + 8 + run * (w - 34)), leg = Math.floor(t * 10) % 2;
  man(px, y + 42, PX.AVATAR_COLORS[profile.avatar.color], leg);
  man(Math.round(px - 14 + Math.sin(t * 3) * 2), y + 54, '#2a7fd4', 1 - leg);
  const bx = px + 5 + (run > 0.85 ? (run - 0.85) * 120 : 0), by = y + 41 - (run > 0.85 ? Math.sin((run - 0.85) / 0.15 * Math.PI) * 8 : 0);
  ctx.fillStyle = '#111'; ctx.fillRect(Math.round(bx) - 1, Math.round(by) - 1, 4, 4); ctx.fillStyle = '#fff'; ctx.fillRect(Math.round(bx), Math.round(by), 2, 2);
  ctx.restore();
}
function previewHoops(x, y, w, h, t) {
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.fillStyle = '#2b1d4a'; ctx.fillRect(x, y, w, h);
  for (let i = 0; i < w; i += 6) { ctx.fillStyle = ['#e01e1e', '#2a7fd4', '#f2f2f2', '#ffd23f'][(i / 6) % 4]; ctx.fillRect(x + i + 1, y + 3 - (Math.floor(t * 4 + i) % 7 === 0 ? 1 : 0), 4, 4); }
  const gy = y + h - 10;
  ctx.fillStyle = '#c8874a'; ctx.fillRect(x, gy, w, 10); ctx.fillStyle = '#b5763c'; ctx.fillRect(x, gy + 5, w, 1);
  const bx = x + w - 12, ry = y + 26, front = bx - 20;                     // the hoop
  ctx.fillStyle = '#4a4a55'; ctx.fillRect(bx + 4, ry - 10, 3, gy - ry + 10);
  ctx.fillStyle = '#f4f4f4'; ctx.fillRect(bx, ry - 18, 3, 24); ctx.fillStyle = '#e01e1e'; ctx.fillRect(bx, ry - 10, 2, 8);
  const k = (t * 0.6) % 1, x0 = x + 14, y0 = gy - 22, x1 = front + 10, y1 = ry + 10;   // the ball: up and in
  const bxp = x0 + (x1 - x0) * k, byp = y0 + (y1 - y0) * k - Math.sin(k * Math.PI) * 34 - (k > 0.8 ? 0 : 0);
  const drawB = () => { ctx.fillStyle = '#111'; ctx.fillRect(Math.round(bxp) - 3, Math.round(byp) - 3, 7, 7); ctx.fillStyle = '#f08a24'; ctx.fillRect(Math.round(bxp) - 2, Math.round(byp) - 2, 5, 5); ctx.fillStyle = '#5a2a0a'; ctx.fillRect(Math.round(bxp) - 2, Math.round(byp), 5, 1); };
  if (k < 0.85) drawB();
  ctx.fillStyle = '#f4f4f4'; for (let i = 0; i < 4; i++) ctx.fillRect(front + 2 + i * 5, ry + 1, 1, 9);
  ctx.fillStyle = '#ff6a1a'; ctx.fillRect(front, ry, 21, 2);
  if (k >= 0.85) drawB();
  ctx.fillStyle = '#111'; ctx.fillRect(x0 - 5, gy - 18, 9, 18);              // the shooter, in your color
  ctx.fillStyle = PX.AVATAR_COLORS[profile.avatar.color]; ctx.fillRect(x0 - 4, gy - 14, 7, 8);
  ctx.fillStyle = '#f0c090'; ctx.fillRect(x0 - 3, gy - 18, 5, 4); ctx.fillRect(x0 - 3, gy - 6, 2, 6); ctx.fillRect(x0 + 1, gy - 6, 2, 6);
  ctx.restore();
}
function previewWings(x, y, w, h, t) {
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.fillStyle = '#2263a3'; ctx.fillRect(x, y, w, h);                    // the sea, seen from above
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  for (let i = 0; i < 9; i++) { const wx = x + ((i * 37 + t * 12) % w), wy = y + (i * 23) % h; ctx.fillRect(Math.round(wx), wy, 4, 1); }
  const ix = x + w - 30 - ((t * 10) % (w + 60)) + 60, iy = y + 34;          // the island slides by
  ctx.fillStyle = '#e6d28c'; ctx.beginPath(); ctx.arc(ix, iy, 20, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#4f9e3a'; ctx.beginPath(); ctx.arc(ix, iy, 16, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#4a4a4f'; ctx.fillRect(Math.round(ix - 12), Math.round(iy + 3), 24, 4);
  const plane = (px, py, a, body, sh) => {                                 // a little plane: fuselage, wings, tail
    const c = Math.cos(a), s = Math.sin(a), P = (fx, fy, ww, hh, col) => { ctx.fillStyle = col; ctx.fillRect(Math.round(px + fx * c - fy * s - ww / 2), Math.round(py + fx * s + fy * c - hh / 2), ww, hh); };
    for (let k = -4; k <= 4; k++) P(k, 0, 2, 2, body);
    for (let k = -5; k <= 5; k++) P(1, k, 2, 2, body);
    for (let k = -2; k <= 2; k++) P(-4, k, 2, 2, body);
    if (sh) return;
    P(2, 0, 2, 2, '#bff0ff');
  };
  const a1 = Math.sin(t * 0.9) * 0.6, p1x = x + w / 2 + Math.sin(t * 0.9) * 20, p1y = y + 30 + Math.cos(t * 1.3) * 10;
  const a2 = a1 + Math.sin(t * 2) * 0.3, p2x = p1x - 26 + Math.sin(t * 1.7) * 4, p2y = p1y + 12 + Math.cos(t * 1.1) * 6;
  plane(p1x + 5, p1y + 8, a1, 'rgba(0,0,0,0.3)', true); plane(p2x + 5, p2y + 8, a2, 'rgba(0,0,0,0.3)', true);
  plane(p1x, p1y, a1, '#e0402a'); plane(p2x, p2y, a2, '#2a7fd4');
  if (Math.floor(t * 8) % 2) { ctx.fillStyle = '#ffe680'; ctx.fillRect(Math.round(p2x + Math.cos(a2) * 12), Math.round(p2y + Math.sin(a2) * 12), 3, 1); }
  ctx.restore();
}
function card(g, i, x, y, w, h, t) {
  ctx.fillStyle = '#111'; ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
  ctx.fillStyle = '#262036'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = g ? g.color : '#3a2f5c'; ctx.fillRect(x, y, w, 2);
  if (!g) { T('?', x + w / 2, y + 44, '#3a2f5c', 8, 'center'); return; }
  ({ thief: previewThief, racer: previewRacer, heist: previewHeist, pong: previewPong, football: previewFootball, hoops: previewHoops, wings: previewWings })[g.id](x + 6, y + 8, w - 12, 62, t);
  if (PX.textWidth(g.name, 2) <= w - 4) T(g.name, x + w / 2, y + 80, '#fff', 2, 'center', '#000');
  else g.name.split(' ').forEach((part, k) => T(part, x + w / 2, y + 76 + k * 12, '#fff', 2, 'center', '#000'));
  T(g.sub, x + w / 2, y + 101, '#9a92b8', 1, 'center');
  if (pad.used && pad.focus === i) {                                    // the game the controller picked
    ctx.fillStyle = '#ffd23f'; ctx.fillRect(x - 3, y - 3, w + 6, 2); ctx.fillRect(x - 3, y + h + 1, w + 6, 2); ctx.fillRect(x - 3, y - 3, 2, h + 6); ctx.fillRect(x + w + 1, y - 3, 2, h + 6);
    UI.mx = x + w / 2; UI.my = y + h - 16;
  }
  if (UI.button('play_' + g.id, x + 8, y + h - 26, w - 16, 20, pad.used && pad.focus === i ? 'A: PLAY' : 'PLAY', { accent: g.color })) play(g);
}
function drawHome(t) {
  const W = S.W;
  background(t);
  T('PIXEL ARCADE', W / 2 + 2, 10, '#e01e1e', 4, 'center');
  T('PIXEL ARCADE', W / 2, 8, '#fff', 4, 'center');
  T('★ ' + PX.Wallet.get(), W - 10, 12, '#ffd23f', 2, 'right', '#000');   // one wallet for all the games
  // you
  const nw = PX.textWidth(profile.name, 2), rowW = 30 + nw + 8 + 46, rx = Math.round(W / 2 - rowW / 2);
  PX.drawAvatar(ctx, profile.avatar, rx, 34, 2);
  T(profile.name, rx + 36, 44, '#fff', 2, 'left', '#000');
  if (UI.button('edit', rx + 36 + nw + 8, 40, 46, 16, 'EDIT', { size: 1, accent: '#e0a820' })) { draft = JSON.parse(JSON.stringify(profile)); screen = 'profile'; nameInput.value = profile.name; }
  // the games: rows of cards in a box you can swipe (or scroll, or drag the slider on the right)
  const L = layout(), { top, bottom } = L;
  ctx.save(); ctx.beginPath(); ctx.rect(0, top, W, bottom - top); ctx.clip();
  const first = UI.list.length;
  GAMES.forEach((g, i) => {
    const r = Math.floor(i / L.cols), c = i % L.cols, inRow = Math.min(L.cols, GAMES.length - r * L.cols);
    const rx0 = Math.round(L.cx - (L.cw * inRow + L.gap * (inRow - 1)) / 2);
    const y = Math.round(top + L.pad + r * (CARD_H + L.gap) - scroll.y);
    if (y > bottom || y + CARD_H < top) return;
    card(g, i, rx0 + c * (L.cw + L.gap), y, L.cw, CARD_H, t);
  });
  ctx.restore();
  // buttons scrolled out of the box can't be pressed
  for (let k = UI.list.length - 1; k >= first; k--) {
    const b = UI.list[k], y0 = Math.max(b.y, top), y1 = Math.min(b.y + b.h, bottom);
    if (y1 - y0 < 4) UI.list.splice(k, 1); else { b.y = y0; b.h = y1 - y0; }
  }
  // fade the edges of the box, and the slider
  ctx.fillStyle = 'rgba(13,11,19,0.5)';
  if (scroll.y > 1) ctx.fillRect(0, top, W - 16, 2);
  if (scroll.y < L.max - 1) ctx.fillRect(0, bottom - 2, W - 16, 2);
  if (L.max > 0) {
    const tx = W - 11, th = Math.max(20, Math.round(L.view * L.view / (L.view + L.max))), ty = Math.round(top + (L.view - th) * scroll.y / L.max);
    ctx.fillStyle = '#111'; ctx.fillRect(tx - 1, top - 1, 8, L.view + 2);
    ctx.fillStyle = '#1d1830'; ctx.fillRect(tx, top, 6, L.view);
    const hot = scroll.bar || (UI.mx >= tx - 6 && UI.my >= ty && UI.my < ty + th);
    ctx.fillStyle = hot ? '#ffd23f' : '#8070b0'; ctx.fillRect(tx, ty, 6, th);
    ctx.fillStyle = hot ? '#fff' : '#b0a4d8'; ctx.fillRect(tx, ty, 6, 1);
    ctx.fillStyle = '#3a2f5c'; for (let k = -1; k <= 1; k++) ctx.fillRect(tx + 1, ty + Math.round(th / 2) + k * 3, 4, 1);
    if (scroll.y < 4 && Math.floor(t * 2) % 2) T('↓', tx + 3, bottom - 10, '#ffd23f', 1, 'center');
  }
  if (installPrompt && UI.button('install', 8, 8, 72, 16, 'INSTALL', { size: 1, accent: '#5ad43f' })) { installPrompt.prompt(); installPrompt.userChoice.finally(() => { installPrompt = null; }); }
}
// --- swiping through the games -----------------------------------------------------------
const CARD_H = 140;
const scroll = { y: 0, v: 0, drag: null, bar: false };
function layout() {
  const W = S.W, top = 66, bottom = H, gap = 8, pad = 4, slider = 16;
  const avail = W - 16 - slider, cols = Math.max(2, Math.floor((avail + gap) / (116 + gap)));
  const cw = Math.min(150, Math.floor((avail - gap * (cols - 1)) / cols)), rows = Math.ceil(GAMES.length / cols);
  const view = bottom - top, content = pad * 2 + rows * CARD_H + (rows - 1) * gap;
  return { top, bottom, gap, pad, cols, cw, cx: 8 + avail / 2, view, max: Math.max(0, content - view) };
}
function scrollTo(y) { const m = layout().max; scroll.y = Math.max(0, Math.min(m, y)); }
function barTo(y) { const L = layout(), th = Math.max(20, Math.round(L.view * L.view / (L.view + L.max))); scrollTo((y - L.top - th / 2) / Math.max(1, L.view - th) * L.max); }
function scrollStep(dt) {
  if (scroll.drag || scroll.bar) return;
  if (Math.abs(scroll.v) < 4) { scroll.v = 0; return; }
  const before = scroll.y; scrollTo(scroll.y + scroll.v * dt);
  if (scroll.y === before) scroll.v = 0;
  scroll.v *= Math.exp(-4 * dt);
}
UI.onMove = (e, x, y) => {
  if (screen !== 'home') return;
  if (scroll.bar) { barTo(y); return; }
  const d = scroll.drag; if (!d || d.id !== e.pointerId) return;
  const now = performance.now(), dy = y - d.last, dt = Math.max(1, now - d.t) / 1000;
  scrollTo(scroll.y - dy);
  scroll.v = scroll.v * 0.3 + (-dy / dt) * 0.7;
  d.moved += Math.abs(dy); d.last = y; d.t = now;
  if (d.moved > 6) UI.downId = null;               // a swipe, not a tap: don't press the button under the finger
};
UI.onUp = e => {
  if (scroll.drag && scroll.drag.id === e.pointerId) { if (performance.now() - scroll.drag.t > 80) scroll.v = 0; scroll.drag = null; }
  scroll.bar = false;
};
// --- game controllers (an Xbox, or a controller on a PC or phone) ------------------------------
// The stick or d-pad picks a game (the screen scrolls to it), A plays it, the right stick scrolls.
const pad = { used: false, focus: 0, prev: {}, navT: 0 };
try { if ('gamepadInputEmulation' in navigator) navigator.gamepadInputEmulation = 'gamepad'; } catch (e) { /* not an Xbox */ }
function cardBox(i) {
  const L = layout(), r = Math.floor(i / L.cols), c = i % L.cols, inRow = Math.min(L.cols, GAMES.length - r * L.cols);
  const x = Math.round(L.cx - (L.cw * inRow + L.gap * (inRow - 1)) / 2) + c * (L.cw + L.gap), y = L.pad + r * (CARD_H + L.gap);
  return { x, y, w: L.cw, r, c };
}
function padFocus(i) {
  pad.focus = Math.max(0, Math.min(GAMES.length - 1, i));
  const L = layout(), b = cardBox(pad.focus);                          // scroll so the whole card shows
  if (b.y - scroll.y < 0) scrollTo(b.y - L.pad); else if (b.y + CARD_H - scroll.y > L.view) scrollTo(b.y + CARD_H + L.pad - L.view);
  scroll.v = 0; PX.Sound.tone(660, 0.05, { vol: 0.06 });
}
function padPoll(dt) {
  let gps = [];
  try { gps = navigator.getGamepads ? [...navigator.getGamepads()].filter(g => g && g.connected) : []; } catch (e) { gps = []; }
  for (const gp of gps.slice(0, 2)) {
    const now = {}; for (const i of [0, 1, 9, 12, 13, 14, 15]) now[i] = !!(gp.buttons[i] && gp.buttons[i].pressed);
    const edge = i => now[i] && !pad.prev[i];
    let ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    if (now[14]) ax = -1; if (now[15]) ax = 1; if (now[12]) ay = -1; if (now[13]) ay = 1;
    const any = Math.hypot(ax, ay) > 0.5 || Object.values(now).some(Boolean);
    if (any && !pad.used) { pad.used = true; PX.Sound.unlock(); padFocus(pad.focus); }
    if (screen === 'home') {
      const cols = layout().cols;
      if (Math.hypot(ax, ay) > 0.6) {
        if ((pad.navT -= dt) <= 0) {
          pad.navT = pad.navT < -1 ? 0.35 : 0.22;
          if (Math.abs(ax) > Math.abs(ay)) padFocus(pad.focus + Math.sign(ax));
          else { const n = pad.focus + Math.sign(ay) * cols; if (n >= 0 && n < GAMES.length) padFocus(n); else if (ay > 0 && Math.floor(pad.focus / cols) < Math.floor((GAMES.length - 1) / cols)) padFocus(GAMES.length - 1); }
        }
      } else pad.navT = 0;
      const ry = gp.axes[3] || 0; if (Math.abs(ry) > 0.25) { scroll.v = 0; scrollTo(scroll.y + ry * 300 * dt); }
      if (edge(0) || edge(9)) play(GAMES[pad.focus]);
    } else if (edge(1)) UI.back = true;
    pad.prev = now;
  }
}
window.addEventListener('pointerdown', () => { pad.used = false; });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  if (screen !== 'home') return;
  const k = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 200 : 1;
  scroll.v = 0; scrollTo(scroll.y + e.deltaY * k * S.view.dpr / S.view.scale);
}, { passive: false });
// --- your name and avatar ------------------------------------------------------------------
function saveProfile() {
  const name = PX.cleanName(nameInput.value);
  if (name.length < 2) { PX.Sound.tone(150, 0.2); return; }
  draft.name = name; profile = draft; PX.Profile.save(profile);
  // Mouse Thief keeps its own copy of the name: update it too
  try { const k = 'mouseThief.save.v1', d = JSON.parse(localStorage.getItem(k)); if (d) { d.name = name; localStorage.setItem(k, JSON.stringify(d)); } } catch (e) { /* no save */ }
  nameInput.blur(); screen = 'home'; PX.Sound.tone([523, 659, 784], 0.25, { vol: 0.12 });
}
function drawProfile(t) {
  const W = S.W;
  background(t);
  T('YOU', W / 2, 8, '#fff', 3, 'center', '#000');
  PX.drawAvatar(ctx, draft.avatar, 18, 40, 5);
  S.placeInput(nameInput, 108, 34, Math.min(220, W - 120), 26);
  T('NICKNAME ONLY!', 108, 64, '#ff8a8a', 2);
  PX.AVATAR_SHAPES.forEach((shape, i) => {
    const x = 108 + (i % 8) * 34, y = 90, on = draft.avatar.shape === shape;
    if (UI.button('shape_' + shape, x, y, 30, 30, '', { on, accent: '#e0a820' })) draft.avatar.shape = shape;
    PX.drawAvatar(ctx, { shape, color: draft.avatar.color }, x + 1, y + 1, 2, null);
  });
  PX.AVATAR_COLORS.forEach((c, i) => {
    const x = 108 + i * 22, y = 140, on = draft.avatar.color === i;
    if (UI.button('color_' + i, x, y, 18, 18, '', { on })) draft.avatar.color = i;
    ctx.fillStyle = c; ctx.fillRect(x + 3, y + 3, 12, 12);
    if (on) { ctx.fillStyle = '#e0a820'; ctx.fillRect(x, y + 20, 18, 2); }
  });
  const bw = 110;
  if (UI.button('save', Math.round(W / 2 - bw - 4), 190, bw, 22, 'SAVE', { accent: '#5ad43f' })) saveProfile();
  if (UI.button('cancel', Math.round(W / 2 + 4), 190, bw, 22, 'BACK') || UI.back) { nameInput.blur(); screen = 'home'; }
}

let t0 = performance.now(), tPrev = t0;
function frame(now) {
  const t = (now - t0) / 1000;
  padPoll(Math.min(0.05, (now - tPrev) / 1000));
  scrollStep(Math.min(0.05, (now - tPrev) / 1000)); tPrev = now;
  UI.begin();
  if (screen === 'home') drawHome(t); else drawProfile(t);
  if (screen !== 'profile') nameInput.style.display = 'none';
  UI.end();
  S.blit('#0d0b13');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
PX.Pad.setup({                                     // the arcade reads the controller itself; this is just the help box
  title: 'Pixel Arcade: controller', menu: () => false,
  help: [['STICK|D-PAD', 'PICK A GAME'], ['A', 'PLAY IT'], ['R-STICK', 'SCROLL'], ['Y', 'IN EVERY GAME\'S MENUS: WHAT THE BUTTONS DO']],
});
</script>
