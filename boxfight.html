<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Pixel Box Fight: a boxing match in the ring. Fight a bot, a friend online, or a friend on the same phone. With free power-ups.">
<meta name="theme-color" content="#0d0b13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Pixel Box Fight</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1230; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #screen { position: fixed; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
  #code { position: fixed; display: none; box-sizing: border-box; text-align: center; text-transform: uppercase;
          font: bold 32px ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.3em; padding: 0 0 0 0.3em;
          color: #111; background: #fbf9f3; border: 3px solid #111; border-radius: 0; outline: none; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<input id="code" maxlength="4" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" inputmode="text" aria-label="Room code">
<script src="common.js"></script>
<script>
'use strict';
/* ==========================================================================
   PIXEL BOX FIGHT: boxing in the ring, seen from the side (part of the PIXEL ARCADE).
   Punch, block, knock the other boxer out. Best of 3 rounds.
   Fight a bot, a friend online (with a code) or a friend on the same phone.
   Landing punches charges free power-ups: UPPERCUT, DASH, SHIELD and STUN.
   Win against a bot or a friend online: ★5. Lose: nothing.
     1. Setup     2. The fight     3. Bots     4. Drawing     5. Online
     6. Sound     7. Screens       8. Input    9. Main loop
   ========================================================================== */

/* --- 1. SETUP --------------------------------------------------------------- */
const VERSION = '1.0.0';
const SAVE_KEY = 'pixelBoxFight.save';
const save = { wins: 0, played: 0, kos: 0, music: true, sfx: true };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY)) || {}); } catch (e) { /* new player */ }
const store = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* private mode */ } };
const profile = PX.Profile.get();
const MY_COLOR = PX.AVATAR_COLORS[profile.avatar.color];

const canvas = document.getElementById('screen');
const S = PX.makeScreen(canvas, { H: 240, minW: 400, maxW: 560 });
const ctx = S.ctx, H = S.H;
const UI = PX.makeUI(S, canvas);
const T = (str, x, y, color = '#fff', size = 1, align = 'left', shadow = null) => PX.drawText(ctx, str, x, y, color, size, align, shadow);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

// The ring, in its own units (1 unit = 1 screen pixel): RW wide. Feet stand on FY.
const RW = 340, FY = 156;
const WIN_ROUNDS = 2, ROUND_TIME = 45, MAX_HP = 100;
const REWARD = 5;                                     // ★ for a win (bot or online); a loss gives nothing
const REACH = 46, MIN_GAP = 28, WALK = 100;
const PUNCH = { dur: 0.3, hit: 0.08, dmg: 6 }, UPPER = { dur: 0.45, hit: 0.15, dmg: 20 };
const ABILITIES = [
  { id: 'upper', name: 'UPPERCUT', cost: 2, color: '#ff5a2a', info: 'YOUR NEXT PUNCH IS A BIG UPPERCUT' },
  { id: 'dash', name: 'DASH', cost: 2, color: '#ffd23f', info: 'RUSH IN AND PUNCH' },
  { id: 'shield', name: 'SHIELD', cost: 3, color: '#3fd45a', info: 'NO DAMAGE FOR 4 SECONDS' },
  { id: 'stun', name: 'STUN', cost: 4, color: '#b06bff', info: 'THE OTHER BOXER SEES STARS' },
];
const MAX_ENERGY = 6;
// a pixel icon for each power-up ('#' = its color)
const ABIL_ICONS = {
  upper:  ['...#...', '..##...', '..###.#', '.####.#', '.######', '###y###', '##yyy##', '##yyy##', '.#####.'],   // a fireball
  dash:   ['....###', '...###.', '..###..', '.######', '...###.', '..###..', '.###...', '###....'],          // a lightning bolt
  shield: ['.#####.', '#######', '##w####', '##w####', '#######', '.#####.', '..###..', '...#...'],          // a shield
  stun:   ['...#...', '..###..', '#######', '.#####.', '..#y#..', '.##.##.', '.#...#.'],                    // a star
};
function abilIcon(id, cx, cy, s) { const a = ABILITIES.find(q => q.id === id); PX.drawIcon(ctx, ABIL_ICONS[id], { '#': a.color, w: '#ffffff', y: '#ffe23a' }, cx, cy, s); }
const BOTS = {
  easy:   { name: 'EASY BOT', react: 0.5, block: 0.15, aggr: 0.45, abil: 0, speed: 0.75, color: '#3fae4a', av: { shape: 'frog', color: 3 } },
  normal: { name: 'BOT', react: 0.28, block: 0.4, aggr: 0.6, abil: 0.4, speed: 0.9, color: '#e0b030', av: { shape: 'robot', color: 6 } },
  hard:   { name: 'MEGA BOT', react: 0.14, block: 0.65, aggr: 0.75, abil: 1, speed: 1, color: '#e01e1e', av: { shape: 'robot', color: 4 } },
};
const GLOVES = ['#e01e1e', '#2a6ad4'];

/* --- 2. THE FIGHT --------------------------------------------------------------- */
// mode: 'bot' | 'local' (two players, one phone) | 'online'
let M = null;
function newBoxer(side, who) {
  return { side, x: side === 0 ? RW / 2 - 70 : RW / 2 + 70, tx: 0, face: side === 0 ? 1 : -1, hp: MAX_HP, act: 'idle', at: 0, arm: 0, upper: false, dashHit: false,
           hitDone: true, pending: null, shield: 0, stun: 0, energy: 0, regen: 0, flash: 0, kb: 0, walk: 0, koT: 0, q: 0, pid: 0, seen: -1,
           in: { l: false, r: false, blk: false }, name: who.name, av: who.av, color: who.color, bot: who.bot || null, think: 0, plan: 'in', blockT: 0, landed: 0 };
}
function makeMatch(mode, opts = {}) {
  const me = { name: profile.name, av: profile.avatar, color: MY_COLOR };
  let left = me, right;
  if (mode === 'bot') { const b = BOTS[opts.bot]; right = { name: b.name, av: b.av, color: b.color, bot: opts.bot }; }
  else if (mode === 'local') { left = { name: 'PLAYER 1', av: profile.avatar, color: MY_COLOR }; right = { name: 'PLAYER 2', av: { shape: 'bear', color: 2 }, color: '#2a7fd4' }; }
  else { const f = Net.friend || { name: 'FRIEND', av: { shape: 'cat', color: 2 }, color: '#2a7fd4' };
    if (Net.isHost) right = f; else { left = f; right = me; } }
  if (right.color === left.color) right.color = left.color === '#2a7fd4' ? '#e01e1e' : '#2a7fd4';
  return { mode, bot: opts.bot || null, p: [newBoxer(0, left), newBoxer(1, right)], wins: [0, 0], round: 1, timer: ROUND_TIME,
           phase: 'count', t: 2.2, msg: '', msgT: 0, winner: -1, overT: 0, koSide: -1, fx: null, sparks: [], shake: 0,
           me: mode === 'online' ? (Net.isHost ? 0 : 1) : 0 };
}
function startMatch(mode, opts = {}) { M = makeMatch(mode, opts); state = 'play'; paused = false; Ctl.clear(); Music.play('game'); }
function resetRound() {
  for (const f of M.p) {
    Object.assign(f, { x: f.side === 0 ? RW / 2 - 70 : RW / 2 + 70, hp: MAX_HP, act: 'idle', at: 0, pending: null, shield: 0, stun: 0, flash: 0, kb: 0, koT: 0, q: 0, energy: Math.min(f.energy, 2), blockT: 0 });
  }
  M.timer = ROUND_TIME; M.phase = 'count'; M.t = 2.2; M.koSide = -1;
}
function say(text, t = 1.6) { M.msg = text; M.msgT = t; }
// effects and sounds the host also sends to the friend's phone
function event(kind, x, y) {
  sfx(kind); if (x !== undefined) spark(kind, x, y);
  if (M.mode === 'online' && Net.isHost) Net.send({ t: 'ev', k: kind, x: Math.round(x || 0), y: Math.round(y || 0), n: x !== undefined ? 1 : 0 });
}
function spark(kind, x, y) { M.sparks.push({ kind, x, y, t: 0.35 }); if (kind === 'upperhit') M.shake = 0.35; else if (kind === 'hit') M.shake = Math.max(M.shake, 0.1); }
// a player presses PUNCH or a power-up (online, the friend's presses go to the host)
function press(side, what) {
  if (!M || state !== 'play' || paused) return;
  if (M.mode === 'online' && side === M.me && !Net.isHost) { Net.send(what === 'punch' ? { t: 'pu' } : { t: 'ab', k: what }); return; }
  if (what === 'punch') M.p[side].q = 0.25; else useAbility(side, what);
}
function useAbility(side, id) {
  if (!M || M.phase !== 'fight') return;
  const f = M.p[side], o = M.p[1 - side], a = ABILITIES.find(q => q.id === id);
  if (!a || f.energy < a.cost || f.act === 'ko' || f.stun > 0) return;
  if (id === 'upper') { if (f.pending === 'upper') return; f.pending = 'upper'; }
  else if (id === 'dash') { if (f.act === 'punch' || f.act === 'hurt' || f.act === 'dash') return; f.act = 'dash'; f.at = 0.3; }
  else if (id === 'shield') { if (f.shield > 0) return; f.shield = 4; }
  else if (id === 'stun') { if (o.act === 'ko' || o.stun > 0) return; o.stun = 1.3; o.act = 'idle'; o.q = 0; }
  f.energy -= a.cost;
  fxAt(side, a);
}
function fxAt(side, a) { M.fx = { side, a, t: 0.9 }; sfx(a.id); if (M.mode === 'online' && Net.isHost) Net.send({ t: 'fx', s: side, k: a.id }); }
function startPunch(f, dash) {
  f.act = 'punch'; f.at = 0; f.hitDone = false; f.arm = 1 - f.arm; f.q = 0; f.pid++;
  f.upper = f.pending === 'upper'; f.pending = null; f.dashHit = !!dash;
  sfx(f.upper ? 'whoosh2' : 'whoosh');
}
function resolvePunch(f) {
  const o = M.p[1 - f.side], d = Math.abs(o.x - f.x);
  f.hitDone = true;
  if (o.act === 'ko' || d > (f.upper ? REACH - 4 : REACH)) return;
  const hx = (f.x + o.x) / 2 + f.face * 8, hy = FY - (f.upper ? 66 : 58);
  if (o.shield > 0) { event('shieldhit', hx, hy); o.kb = f.face * 60; return; }
  let dmg = f.upper ? UPPER.dmg : f.dashHit ? 10 : PUNCH.dmg + Math.floor(Math.random() * 3);
  if (o.act === 'block' && o.stun <= 0) {                                    // a block stops most of it (an uppercut breaks through)
    if (!f.upper) { o.hp -= 1; o.kb = f.face * 70; o.energy = Math.min(MAX_ENERGY, o.energy + 0.5); event('block', hx, hy); checkKO(f, o); return; }
    dmg = Math.round(dmg / 2);
  }
  o.hp = Math.max(0, o.hp - dmg); o.flash = 0.15; o.kb = f.face * (f.upper ? 260 : f.dashHit ? 180 : 110);
  if (o.stun <= 0) { o.act = 'hurt'; o.at = f.upper ? 0.5 : 0.22; o.q = 0; }
  f.energy = Math.min(MAX_ENERGY, f.energy + 1); f.landed++;
  event(f.upper ? 'upperhit' : 'hit', hx, hy);
  checkKO(f, o);
}
function checkKO(f, o) {
  if (o.hp > 0) return;
  o.hp = 0; o.act = 'ko'; o.koT = 0; o.stun = 0; o.shield = 0;
  M.koSide = o.side; endRound(f.side, true);
}
function endRound(winner, ko) {
  M.phase = 'ko'; M.t = ko ? 3 : 2.4;
  if (winner >= 0) M.wins[winner]++;
  say(ko ? 'K.O.!' : winner < 0 ? 'TIME! A DRAW' : 'TIME!', M.t);
  if (ko) { event('ko'); if (M.mode !== 'local' && winner === M.me) save.kos++; } else event('bell');
  M.roundWinner = winner;
}
function endMatch(winner) {
  M.phase = 'over'; M.winner = winner; M.overT = 0; state = 'over';
  M.stars = 0;
  const iWon = M.mode === 'local' ? null : winner === M.me;
  if (iWon && M.mode !== 'local') { M.stars = REWARD; PX.Wallet.add(REWARD); save.wins++; }
  save.played++; store();
  sfx(iWon === false ? 'lose' : 'win'); Music.play(null);
  if (M.mode === 'online' && Net.isHost) Net.send({ t: 'end', w: winner, wn: M.wins });
}
function updateBoxer(f, dt) {
  const o = M.p[1 - f.side];
  f.face = Math.sign(o.x - f.x) || (f.side === 0 ? 1 : -1);
  if (f.flash > 0) f.flash -= dt;
  if (f.shield > 0) f.shield -= dt;
  if (f.q > 0) f.q -= dt;
  f.x += f.kb * dt; f.kb *= Math.exp(-9 * dt);
  if (f.act === 'ko') { f.koT += dt; return; }
  if (M.phase !== 'fight') { f.act = f.act === 'punch' ? 'idle' : f.act; f.in.l = f.in.r = false; }
  if ((f.regen += dt) >= 5) { f.regen = 0; f.energy = Math.min(MAX_ENERGY, f.energy + 1); }
  if (f.stun > 0) { f.stun -= dt; f.act = 'idle'; return; }
  if (f.act === 'punch') {
    const P = f.upper ? UPPER : PUNCH;
    f.at += dt;
    if (!f.hitDone && f.at >= P.hit) resolvePunch(f);
    if (f.at >= P.dur) f.act = 'idle';
    return;
  }
  if (f.act === 'hurt') { if ((f.at -= dt) <= 0) f.act = 'idle'; return; }
  if (f.act === 'dash') {
    f.at -= dt; f.x += f.face * 330 * dt; f.walk += dt * 20;
    if (f.at <= 0 || Math.abs(o.x - f.x) <= REACH - 8) startPunch(f, true);
    return;
  }
  if (M.phase !== 'fight') { f.act = 'idle'; return; }
  f.act = f.in.blk ? 'block' : 'idle';
  const dir = (f.in.r ? 1 : 0) - (f.in.l ? 1 : 0), sp = (f.in.blk ? 40 : WALK) * (f.bot ? BOTS[f.bot].speed : 1);
  if (dir) { f.x += dir * sp * dt; f.walk += dt * 12; }
  if (f.q > 0 && !f.in.blk) startPunch(f, false);
}
function keepApart() {
  const [a, b] = M.p;
  for (const f of M.p) f.x = clamp(f.x, 16, RW - 16);
  const d = b.x - a.x;
  if (Math.abs(d) < MIN_GAP) {
    const push = (MIN_GAP - Math.abs(d)) / 2, s = d >= 0 ? 1 : -1;
    a.x -= push * s; b.x += push * s;
    if (a.x < 16) { b.x += 16 - a.x; a.x = 16; } if (b.x > RW - 16) { a.x -= b.x - (RW - 16); b.x = RW - 16; }
    if (a.x > RW - 16) { b.x -= a.x - (RW - 16); a.x = RW - 16; } if (b.x < 16) { a.x += 16 - b.x; b.x = 16; }
  }
}
// One step of the fight (the host runs it for online games).
function step(dt) {
  if (M.msgT > 0) M.msgT -= dt;
  if (M.fx && (M.fx.t -= dt) <= 0) M.fx = null;
  stepSparks(dt);
  for (const f of M.p) if (f.bot) botThink(f, dt);
  for (const f of M.p) updateBoxer(f, dt);
  keepApart();
  if (M.phase === 'count') {
    const was = M.t; M.t -= dt;
    if (was > 0.6 && M.t <= 0.6) say('FIGHT!', 0.8);
    if (M.t <= 0) { M.phase = 'fight'; event('bell'); }
  } else if (M.phase === 'fight') {
    M.timer -= dt;
    if (M.timer <= 0) {
      M.timer = 0;
      const [a, b] = M.p;
      endRound(a.hp > b.hp ? 0 : b.hp > a.hp ? 1 : -1, false);
    }
  } else if (M.phase === 'ko') {
    if ((M.t -= dt) <= 0) {
      const w = M.wins[0] >= WIN_ROUNDS ? 0 : M.wins[1] >= WIN_ROUNDS ? 1 : -1;
      if (w >= 0) endMatch(w); else { M.round++; resetRound(); }
    }
  }
}
function stepSparks(dt) { M.shake = Math.max(0, M.shake - dt); for (const s of M.sparks) s.t -= dt; M.sparks = M.sparks.filter(s => s.t > 0); }

/* --- 3. BOTS -------------------------------------------------------------------- */
function botThink(f, dt) {
  const D = BOTS[f.bot], o = M.p[1 - f.side], d = Math.abs(o.x - f.x);
  f.in.l = f.in.r = f.in.blk = false;
  if (M.phase !== 'fight' || f.act === 'ko' || f.stun > 0) return;
  // the other boxer just started a punch: maybe put the gloves up
  const threat = (o.act === 'punch' && o.at < 0.06) || o.act === 'dash';
  if (threat && d < REACH + 30 && f.seen !== o.pid + (o.act === 'dash' ? 0.5 : 0)) {
    f.seen = o.pid + (o.act === 'dash' ? 0.5 : 0);
    if (Math.random() < D.block * (o.upper ? 0.6 : 1)) f.blockT = 0.3 + Math.random() * 0.2;
  }
  if (f.blockT > 0) { f.blockT -= dt; f.in.blk = true; return; }
  if ((f.think -= dt) <= 0) {
    f.think = D.react * (0.6 + Math.random() * 0.8);
    const low = f.hp < 30 && o.hp > f.hp;
    if (low && Math.random() < 0.35) f.plan = 'back';
    else if (d > REACH - 6) f.plan = 'in';
    else f.plan = Math.random() < D.aggr ? 'punch' : Math.random() < 0.5 ? 'guard' : 'back';
    // power-ups
    if (D.abil && Math.random() < D.abil) {
      if (f.energy >= 4 && d < REACH + 20 && D.abil > 0.5 && o.shield <= 0) useAbility(f.side, 'stun');
      else if (f.energy >= 3 && f.hp < 45 && f.shield <= 0 && Math.random() < 0.5) useAbility(f.side, 'shield');
      else if (f.energy >= 2 && d <= REACH && !f.pending) useAbility(f.side, 'upper');
      else if (f.energy >= 2 && d > 110 && Math.random() < 0.5) useAbility(f.side, 'dash');
    }
  }
  const toward = f.face > 0 ? 'r' : 'l', away = f.face > 0 ? 'l' : 'r';
  if (f.plan === 'in') f.in[toward] = true;
  else if (f.plan === 'back') { f.in[away] = true; if (d > 120) f.plan = 'in'; }
  else if (f.plan === 'guard') f.in.blk = true;
  else if (f.plan === 'punch') { if (d <= REACH && f.act === 'idle') { M.p[f.side].q = 0.2; f.plan = o.stun > 0 ? 'punch' : 'wait'; } else f.in[toward] = true; }
}

/* --- 4. DRAWING ----------------------------------------------------------------- */
const X0 = () => Math.round(S.W / 2 - RW / 2);
const SKIN = '#e8b088', SKIN_D = '#c48a64';
function drawArena(now) {
  const W = S.W, x0 = X0();
  ctx.fillStyle = '#1a1230'; ctx.fillRect(0, 0, W, H);
  // the crowd in the dark
  const cols = ['#3a2f5c', '#4a3a6a', '#2f2650', '#55406e'];
  for (let row = 0; row < 4; row++) {
    const y = 56 + row * 14;
    for (let x = (row % 2) * 6; x < W; x += 12) {
      const c = cols[(x / 12 + row) % 4 | 0], j = Math.sin(now / 160 + x * 0.7 + row) > 0.85 ? -2 : 0;
      ctx.fillStyle = c; ctx.fillRect(x, y + j, 8, 8); ctx.fillRect(x - 1, y + 8 + j, 10, 8);
    }
  }
  // flashes from cameras
  const fl = Math.floor(now / 230); if (fl % 7 === 0) { ctx.fillStyle = '#fff'; ctx.fillRect((fl * 97) % W, 60 + (fl * 13) % 40, 3, 3); }
  // spotlights
  ctx.fillStyle = 'rgba(255,240,200,0.06)';
  ctx.beginPath(); ctx.moveTo(W / 2 - 30, 0); ctx.lineTo(W / 2 + 30, 0); ctx.lineTo(x0 + RW - 20, FY + 6); ctx.lineTo(x0 + 20, FY + 6); ctx.fill();
  // the ring: posts, ropes, mat and apron
  ctx.fillStyle = '#111'; ctx.fillRect(x0 - 12, FY - 78, 10, 88); ctx.fillRect(x0 + RW + 2, FY - 78, 10, 88);
  ctx.fillStyle = '#c8c8d8'; ctx.fillRect(x0 - 10, FY - 76, 6, 84); ctx.fillRect(x0 + RW + 4, FY - 76, 6, 84);
  ctx.fillStyle = '#e01e1e'; ctx.fillRect(x0 - 12, FY - 80, 10, 6); ctx.fillStyle = '#2a6ad4'; ctx.fillRect(x0 + RW + 2, FY - 80, 10, 6);
  [FY - 70, FY - 50, FY - 30].forEach((y, i) => { ctx.fillStyle = '#111'; ctx.fillRect(x0 - 4, y - 1, RW + 8, 4); ctx.fillStyle = ['#e01e1e', '#f2f2f2', '#2a6ad4'][i]; ctx.fillRect(x0 - 4, y, RW + 8, 2); });
  ctx.fillStyle = '#111'; ctx.fillRect(x0 - 14, FY - 2, RW + 28, 22);
  ctx.fillStyle = '#5a7ab8'; ctx.fillRect(x0 - 12, FY, RW + 24, 6);
  ctx.fillStyle = '#4a68a4'; for (let i = 0; i < RW + 24; i += 16) ctx.fillRect(x0 - 12 + i, FY + 2, 8, 2);
  ctx.fillStyle = '#2a1f4a'; ctx.fillRect(x0 - 12, FY + 6, RW + 24, 12);
  T('PIXEL BOX FIGHT', W / 2, FY + 9, '#ffd23f', 1, 'center', null);
}
function glove(x, y, c, glow) {
  x = Math.round(x); y = Math.round(y);
  if (glow) { ctx.fillStyle = glow; ctx.fillRect(x - 7, y - 7, 14, 13); }
  ctx.fillStyle = '#111'; ctx.fillRect(x - 6, y - 6, 12, 11);
  ctx.fillStyle = c; ctx.fillRect(x - 5, y - 5, 10, 9);
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.fillRect(x - 4, y - 4, 4, 2);
  ctx.fillStyle = '#f2f2f2'; ctx.fillRect(x - 5, y + 3, 10, 2);
}
function arm(x1, y1, x2, y2) {
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#111'; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.strokeStyle = SKIN; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
// how far a punching glove is out, 0..1
function punchExt(f) {

         ['STICK|D-PAD', 'MENUS: PICK A BUTTON'], ['A', 'MENUS: OK'], ['B', 'MENUS: BACK'], ['2ND PAD', 'PLAYER 2 IN 2 PLAYERS (THE RIGHT BOXER)']],
