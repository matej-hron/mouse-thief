  if (R.fadeT > 0) { ctx.fillStyle = 'rgba(0,0,0,' + (R.fadeT / 0.5) + ')'; ctx.fillRect(0, 0, W, H); }
}

/* --------------------------------------------------------------------------
   10b. TUTORIAL — a hand-built level for new players.
   At each obstacle the game freezes and shows which button to press; the
   action unfreezes it. Falling or hitting spikes respawns at a checkpoint,
   and the cat comes close but never catches you.
   -------------------------------------------------------------------------- */
const Tutorial = {
  // Lays out the level (positions are tuned to the physics) and returns the steps.
  build() {
    const L = Level, gy = 190;
    L.solids = []; L.hazards = []; L.gy = gy; L.genX = 1e9;
    L.ground(-600, 1240, gy);                                         // start ... gap 1 at 640
    L.ground(704, 396, gy);                                           // ... gap 2 at 1100 (needs a double jump)
    L.ground(1200, 1700, gy);                                         // bar, spikes, tower ... fake floor at 2900
    L.add({ type: 'bar', x: 1400, y: -30, w: 60, h: gy - 13 + 30 });
    L.spikes(1600, gy, 32);
    L.add({ type: 'block', x: 2200, y: gy - 120, w: 28, h: 120 });    // too tall without a wall jump
    L.add({ type: 'fake', x: 2900, y: gy, w: 60, h: H + 60 - gy, state: 0 });
    L.ground(2960, 3400, gy);
    return [
      { at: 0, title: 'YOU RUN BY YOURSELF', sub: 'THE CAT IS RIGHT BEHIND YOU. NEVER STOP!', dur: 2.4 },
      { at: 626, wait: 'jump', cp: 400, title: 'JUMP!' },
      { at: 1076, wait: 'jump', cp: 860, title: 'BIG GAP! JUMP...' },
      { cond: p => !p.onGround && p.vy > -60 && p.x > 1090, pass: 1210, wait: 'djump', title: '...AND JUMP AGAIN IN THE AIR!' },
      { at: 1370, wait: 'slide', cp: 1250, title: 'SLIDE UNDER IT!' },
      { at: 1576, wait: 'jump', cp: 1480, title: 'SPIKES! JUMP OVER THEM' },
      { at: 1720, title: 'TALL WALL AHEAD!', sub: 'JUMP AT IT, THEN JUMP AGAIN WHILE TOUCHING IT', dur: 2.2, cp: 1700 },
      { cond: p => p.touchWall && !p.onGround, pass: 2232, wait: 'wall', title: 'WALL JUMP!' },
      { at: 2450, title: 'CAREFUL...', sub: 'NOT EVERYTHING HERE IS WHAT IT SEEMS', dur: 2.0, cp: 2400 },
      { cond: p => p.hangT > 0, pass: 2970, wait: 'fake', title: 'LOL, A FAKE FLOOR!' },
      { at: 3100, title: 'THIS BAR IS HOW CLOSE SHE IS', sub: 'WHEN IT FILLS UP, SHE GOT YOU!', dur: 2.8, highlight: 'meter', demo: true, cp: 3050 },
      { at: 3700, title: 'SHE GETS 20% FASTER EVERY 30S', sub: "SO DON'T GET STUCK ON WALLS!", dur: 2.4 },
      { at: 4200, title: 'EVERY 5 SECONDS = +1 ★', sub: 'SPEND YOUR ★ IN THE SHOP ON ABILITIES', dur: 2.4, star: true },
      { at: 4700, title: 'YOUR ABILITIES ARE DOWN HERE', sub: 'abil', dur: 2.4, highlight: 'abil', needAbil: true },
      { at: 5200, title: "YOU'RE READY!", sub: 'NOW FOR REAL. RUN!', dur: 2.0, end: true },
    ];
  },

  // Called every physics step. Returns true when the tutorial has finished.
  update(dt) {
    const T = run.tut, p = run.player;
    T.nudge = Math.max(0, T.nudge - dt);
    if (T.info) {
      T.info.t += dt;
      if (T.info.t >= T.info.dur) { const end = T.info.end; T.info = null; if (end) { finishTutorial(); return true; } }
    }
    const s = T.steps[T.idx];
    if (!s) return false;
    if (s.pass && p.x > s.pass) { T.idx++; return false; }   // got past it some other way
    if (!(s.cond ? s.cond(p) : p.x + p.w >= s.at)) return false;
    T.idx++;
    if (s.cp != null) T.cp = s.cp;
    if (s.wait) {
      T.freeze = s; T.freezeT = 0;
      Input.jumpQ = Input.slideQ = Input.releaseQ = 0;
      sfx('popWarn');
    } else if (!s.needAbil || run.abil.length) {
      T.info = Object.assign({ t: 0 }, s);
      if (s.star) { popup('+1', p.x + 4, p.y - 10, PAL.gold, 2, { vy: -40 }); sfx('point'); }
    }
    return false;
  },

  // While frozen, only the right action continues the game.
  frozenInput(dt) {
    const T = run.tut, f = T.freeze;
    T.freezeT += dt;
    T.nudge = Math.max(0, T.nudge - dt);
    Input.releaseQ = 0;
    if (f.wait === 'slide') {
      if (Input.slideQ > 0) T.freeze = null;
      else if (Input.jumpQ > 0) { Input.jumpQ = 0; T.nudge = 0.4; sfx('deny'); }
    } else {
      if (Input.jumpQ > 0) { T.freeze = null; run.player.noCut = 0.35; }   // always a full jump here
      else if (Input.slideQ > 0) { Input.slideQ = 0; T.nudge = 0.4; sfx('deny'); }
    }
  },

  respawn() {
    const T = run.tut;
    this.build();                                           // restores fake floors etc.
    T.idx = T.steps.findIndex(s => (s.at ?? s.pass) > T.cp);
    if (T.idx < 0) T.idx = T.steps.length;
    T.freeze = null; T.info = null;
    const p = Object.assign(run.player, makePlayer(), { x: T.cp, y: Level.gy - P_H });
    Object.assign(run.cat, { x: T.cp - 120, y: Level.gy, vy: 0, onGround: true, floor: Level.gy });
    run.camX = p.x - W * 0.36;
    run.fadeT = 0.35; run.shake = 4;
    Input.clear();
    sfx('hit');
    popup('OOPS! TRY AGAIN', p.x + 4, p.y - 16, '#ff6b6b', 2, { life: 1.4, vy: -15 });
  },

  how(wait) {
    const mode = touchButtonsOn() ? 'btn' : Input.touch ? 'tap' : 'key';
    const T = {
      jump:  { btn: 'TAP JUMP (OR TAP ANYWHERE)', tap: 'TAP THE SCREEN', key: 'PRESS SPACE OR ↑' },
      djump: { btn: 'TAP JUMP AGAIN, IN THE AIR', tap: 'TAP AGAIN, IN THE AIR', key: 'PRESS SPACE AGAIN, IN THE AIR' },
      wall:  { btn: 'TAP JUMP WHILE ON THE WALL', tap: 'TAP WHILE ON THE WALL', key: 'PRESS SPACE WHILE ON THE WALL' },
      fake:  { btn: 'QUICK, TAP JUMP!', tap: 'QUICK, TAP THE SCREEN!', key: 'QUICK, PRESS SPACE!' },
      slide: { btn: 'TAP SLIDE (OR SWIPE DOWN)', tap: 'SWIPE DOWN', key: 'PRESS ↓ OR S' },
    };
    return T[wait][mode];
  },

  // Pulsing frame + bouncing arrow pointing at something on screen.
  point(r, from = 'above') {
    if (!r) return;
    const on = Math.floor(menuT * 4) % 2;
    ctx.fillStyle = on ? PAL.gold : '#fff';
    ctx.fillRect(r.x - 3, r.y - 3, r.w + 6, 2); ctx.fillRect(r.x - 3, r.y + r.h + 1, r.w + 6, 2);
    ctx.fillRect(r.x - 3, r.y - 3, 2, r.h + 6); ctx.fillRect(r.x + r.w + 1, r.y - 3, 2, r.h + 6);
    const b = Math.round(Math.abs(Math.sin(menuT * 6)) * 4);
    if (from === 'above') drawText('↓', r.x + r.w / 2, r.y - 22 - b, PAL.gold, 3, 'center', '#000');
    else drawText('↑', r.x + r.w / 2, r.y + r.h + 6 + b, PAL.gold, 3, 'center', '#000');
  },
  keycap(label, cx, y) {
    const w = textWidth(label, 2) + 18, x = Math.round(cx - w / 2), press = Math.floor(menuT * 2.5) % 2;
    ctx.fillStyle = '#000'; ctx.fillRect(x + 2, y + 3, w, 20);
    ctx.fillStyle = PAL.ink; ctx.fillRect(x, y + press, w, 20);
    ctx.fillStyle = PAL.paper; ctx.fillRect(x + 1, y + 1 + press, w - 2, 18);
    drawText(label, cx, y + 5 + press, PAL.ink, 2, 'center');
  },

  draw(camX) {
    const T = run.tut, p = run.player;
    if (T.freeze) {
      const f = T.freeze, wait = f.wait;
      ctx.fillStyle = 'rgba(8,6,14,0.45)'; ctx.fillRect(0, 0, W, H);
      const nx = T.nudge > 0 ? Math.round(Math.sin(menuT * 70) * 3) : 0;
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 50, W, 56);
      drawText(f.title, W / 2 + nx, 58, PAL.gold, 3, 'center', '#000');
      drawText(this.how(wait), W / 2 + nx, 82, '#fff', 2, 'center', '#000');
      if (T.nudge > 0) drawText(wait === 'slide' ? 'NOT JUMP - SLIDE!' : 'NOT SLIDE - JUMP!', W / 2, 112, '#ff6b6b', 2, 'center', '#000');
      else if (!Input.touch) this.keycap(wait === 'slide' ? '↓' : 'SPACE', W / 2, 112);
      if (touchButtonsOn()) this.point(wait === 'slide' ? run.ui.slide : run.ui.jump);
      // circle the obstacle / the player so it's clear what's going on
      const px = Math.round(p.x - camX) + 4, py = Math.round(p.y + p.h / 2);
      ctx.fillStyle = Math.floor(menuT * 4) % 2 ? PAL.gold : '#fff';
      for (let a = 0; a < 48; a++) { const t = a / 48 * Math.PI * 2; ctx.fillRect(Math.round(px + Math.cos(t) * 20), Math.round(py + Math.sin(t) * 20), 1, 1); }
      return;
    }
    if (T.info) {
      const i = T.info, k = Math.min(1, i.t / 0.2, (i.dur - i.t) / 0.25);
      const sub = i.sub === 'abil' ? (Input.touch ? 'TAP ONE TO USE IT' : 'PRESS 1, 2 OR 3 TO USE THEM') : i.sub;
      ctx.globalAlpha = clamp(k, 0, 1);
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 50, W, 40);
      drawText(i.title, W / 2, 56, i.end ? '#ff6b6b' : PAL.gold, i.end ? 3 : 2, 'center', '#000');
      drawText(sub, W / 2, i.end ? 78 : 74, '#fff', i.end ? 2 : 1, 'center', '#000');
      ctx.globalAlpha = 1;
      if (i.highlight === 'meter') this.point(run.ui.meter, 'below');
      if (i.highlight === 'abil') this.point(run.ui.abil);
    }
    // live nudges while on your own
    const sx = Math.round(p.x - camX) + 4;
    if (p.blocked && p.onGround && !p.sliding) drawText('JUMP!', sx, p.y - 26, PAL.gold, 2, 'center', '#000');
    else if (p.touchWall && !p.onGround) drawText('JUMP AGAIN!', sx, p.y - 26, PAL.gold, 2, 'center', '#000');
  },
};

const Intro = {
  t: 0, fired: {}, shake: 0,
  start() { this.t = 0; this.fired = {}; this.shake = 0; state = 'intro'; Music.play('menu'); },
  once(key, at, fn) { if (this.t >= at && !this.fired[key]) { this.fired[key] = true; fn(); } },
  update(dt) {
    this.t += dt;
    this.shake = Math.max(0, this.shake - dt * 6);
    this.once('purr', 2.75, () => sfx('purr'));
    this.once('grab', 4.9, () => sfx('grab'));
    this.once('hehe', 5.35, () => sfx('nyah'));
    this.once('q', 6.0, () => sfx('question'));
    this.once('bang', 6.6, () => { Music.stop(); sfx('scratch'); sfx('alert'); this.shake = 3; });
    this.once('scream', 7.0, () => { sfx('scream'); this.shake = 7; });
    this.once('uhoh', 7.9, () => sfx('uhoh'));
    if (this.t >= 10.2) this.finish();
  },
  skip() { if (this.t > 0.25) this.finish(); },
  finish() { if (state === 'intro') { if (Save.data.tutorialDone) startRun(); else startTutorial(); } },
  bubble(text, cx, bottom) {
    const w = textWidth(text, 2) + 12, h = 18, x = Math.round(cx - w / 2), y = bottom - h - 4;
    ctx.fillStyle = PAL.ink; ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
    ctx.fillStyle = '#fff'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = PAL.ink; ctx.fillRect(Math.round(cx) - 2, y + h + 1, 5, 1); ctx.fillRect(Math.round(cx) - 1, y + h + 2, 3, 1); ctx.fillRect(Math.round(cx), y + h + 3, 1, 1);
    ctx.fillStyle = '#fff'; ctx.fillRect(Math.round(cx) - 1, y + h, 3, 1);
    drawText(text, cx, y + 4, PAL.ink, 2, 'center');
  },
  draw() {
    const t = this.t;
    const dk = clamp((t - 8.6) / 1.0, 0, 1);              // light paper → night rooftops
    ctx.fillStyle = lerpColor(PAL.paper, '#2a2142', dk); ctx.fillRect(0, 0, W, H);
    ctx.save();
    if (this.shake > 0 && Save.data.shake) ctx.translate(Math.round(rand(-1, 1) * this.shake), Math.round(rand(-1, 1) * this.shake));
    if (t > 6.6 && t < 8.2 && Math.floor(t * 12) % 2 === 0) { ctx.fillStyle = 'rgba(255,40,40,0.16)'; ctx.fillRect(-10, -10, W + 20, H + 20); }
    const floorY = 196;
    ctx.fillStyle = lerpColor(PAL.ink, PAL.ground, dk); ctx.fillRect(-10, floorY, W + 20, H - floorY + 10);
    const rim = dk > 0.5;

    // --- the cat
    const stop = Math.round(W * 0.36);
    let catX = stop;
    if (t < 2.6) catX = lerp(-20, stop, easeOut(t / 2.6));
    else if (t >= 8.4) catX = stop + 0.5 * 900 * (t - 8.4) * (t - 8.4);
    let pose = 'stand', eyes = 'normal', scream = false, puff = false;
    if (t < 2.6) { pose = 'walk'; eyes = 'closed'; }
    else if (t < 4.9) eyes = 'closed';
    else if (t < 6.6) eyes = t < 5.9 ? 'closed' : 'normal';
    else if (t < 8.2) { eyes = 'rage'; puff = t > 6.9; scream = t > 7.0; }
    else if (t < 8.4) { pose = 'crouch'; eyes = 'rage'; puff = true; }
    else { pose = 'run'; eyes = 'rage'; puff = true; }
    drawCat(catX, floorY, { t, pose, eyes, scream, puff, hold: t < 4.9, outline: lerpColor('#4a4a4a', PAL.rimCat, dk) });
    if (t < 4.9) drawMouse(catX - 9, floorY - 22, false, rim);

    // --- the thief
    let px = W + 40, py = floorY - P_H, pPose = 'run1', flip = false;
    if (t >= 2.6 && t < 4.6) { px = lerp(W + 10, stop + 4, (t - 2.6) / 2.0); pPose = 'sneak'; flip = true; py -= Math.round(Math.abs(Math.sin(t * 7)) * 2); }
    else if (t >= 4.6 && t < 4.9) { px = stop + 4; pPose = 'sneak'; flip = true; }
    else if (t >= 4.9 && t < 5.3) { const k = (t - 4.9) / 0.4; px = lerp(stop + 4, stop + 64, k); py -= Math.round(Math.sin(k * Math.PI) * 20); pPose = 'jump'; flip = true; }
    else if (t >= 5.3 && t < 6.6) { px = stop + 64; py -= Math.round(Math.abs(Math.sin(t * 9)) * 4); pPose = 'taunt'; flip = true; }
    else if (t >= 6.6 && t < 8.2) { px = stop + 64; pPose = 'scared'; flip = true; }
    else if (t >= 8.2) { px = stop + 64 + (t - 8.2) * 380; pPose = Math.floor(t * 16) % 2 ? 'run1' : 'run2'; }
    if (t >= 2.6) {
      drawPlayerSprite(pPose, px - 1, py, flip, rim);
      if (t >= 4.9) {
        if (pPose === 'taunt') drawMouse(px + 4 + Math.round(Math.sin(t * 14) * 2), py - 4, true, rim);   // waving it around
        else drawMouse(px, py - 5, flip, rim);
      }
    }

    // --- effects & dialogue
    if (t > 2.7 && t < 4.9) {
      for (let k = 0; k < 5; k++) {
        const ht = t - (2.7 + k * 0.45);
        if (ht > 0 && ht < 1.3) drawText('♥', catX - 12 + (k % 3) * 6, floorY - 48 - ht * 18, '#ff6b9a', 2, 'center');
      }
      drawText('PRRR…', catX - 40, floorY - 50, PAL.inkSoft, 1, 'center');
    }
    if (t > 2.8 && t < 4.6) drawText('*SNEAK SNEAK*', px + 4, py - 14, PAL.inkSoft, 1, 'center');
    if (t > 5.35 && t < 5.95) this.bubble('HEHE!', px + 4, py - 6);
    if (t > 5.95 && t < 6.6) this.bubble('JUST FOR FUN!', px + 4, py - 6);
    if (t > 6.0 && t < 6.6) drawText('?', catX - 12, floorY - 56, PAL.ink, 3, 'center');
    if (t > 6.6 && t < 8.4) {
      const pop = Math.max(0, 0.15 - (t - 6.6)) * 60;
      drawText('!', catX - 12, floorY - 60 - pop, '#e01e1e', 4, 'center', '#000');
    }
    if (t > 7.0 && t < 8.3) shakyText('MRRRAAAWWW!!!', W / 2, 46, '#e01e1e', 4, 2);
    if (t > 7.8 && t < 8.3) this.bubble('UH OH.', px + 4, py - 6);
    ctx.restore();

    // --- cinematic bars, captions, skip hint
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, 20); ctx.fillRect(0, H - 18, W, 18);
    const caps = [[0, 2.6, 'THIS IS HER MOUSE.'], [2.6, 4.9, 'SHE LOVES HER MOUSE VERY MUCH.'], [4.9, 6.6, 'YOU TOOK IT. JUST FOR FUN.'],
                  [6.6, 8.3, 'SHE TAKES THIS VERY SERIOUSLY.'], [8.3, 10.2, 'RUN.']];
    for (const [a, b, s] of caps) if (t >= a && t < b) drawText(s, W / 2, 5, '#fff', 2, 'center');
    if (Math.floor(menuT * 2) % 2) drawText((Input.touch ? 'TAP' : 'PRESS ANY KEY') + ' TO SKIP >>', W - 8, H - 12, '#aaa', 1, 'right');
    if (t > 9.6) { ctx.fillStyle = 'rgba(0,0,0,' + clamp((t - 9.6) / 0.6, 0, 1) + ')'; ctx.fillRect(0, 0, W, H); }
  },
};

/* --------------------------------------------------------------------------
   12a. MULTIPLAYER — two devices, one room code.
   Devices find each other through the free PeerJS server, then talk directly
   (WebRTC). The THIEF's device runs the game (so jumping never lags) and
   streams snapshots; the CAT's device draws them and sends back her moves.
   -------------------------------------------------------------------------- */
const PEERJS_URLS = ['https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js',
                     'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js'];
const PEER_PREFIX = 'mouse-thief-room-';
// Phones on mobile data (or behind strict routers) can't reach each other directly and need a
// relay (TURN) server in between. PeerJS's free public relays are often down, so add a TURN
// account of your own to TURN_SERVERS (e.g. metered.ca's free plan) to make those connections work.
const TURN_SERVERS = [];
const ICE_SERVERS = [
  { urls: ['stun:stun.l.google.com:19302', 'stun:stun.cloudflare.com:3478'] },
  ...TURN_SERVERS,
  { urls: ['turn:eu-0.turn.peerjs.com:3478', 'turn:us-0.turn.peerjs.com:3478'], username: 'peerjs', credential: 'peerjsp' },
];
const PEER_OPTS = { debug: 0, config: { iceServers: ICE_SERVERS } };
const CODE_CHARS = 'ABCDEFGHJKLMNPRSTUVWXYZ23456789';   // no I/O/Q/0/1: easy to mix up in pixel font
// True on the device that runs a multiplayer round: its events get mirrored to the friend.
function netEmit() { return Net.live && Net.role === 'thief' && state === 'run' && run && run.mp && !run.view && !run.race; }
// True while racing: my thief's position goes to the friend's screen.
function raceEmit() { return Net.live && state === 'run' && run && run.race && run.phase !== 'over'; }

// Positions from the friend's phone arrive unevenly, so they are drawn NET_DELAY ms late,
// interpolated between the two updates around that moment: smooth instead of jumpy.
const NET_DELAY = 100;
function netPush(buf, st, d) { buf.push({ st, d }); if (buf.length > 60) buf.shift(); }
function netPick(buf) {
  if (!buf.length) return null;
  const rt = performance.now() - Net.clockOff - NET_DELAY;
  let i = buf.length - 1;
  while (i >= 0 && buf[i].st > rt) i--;
  if (i < 0) return { a: buf[0], b: buf[0], k: 0 };
  if (i === buf.length - 1) return { a: buf[i], b: buf[i], k: 0 };
  const a = buf[i], b = buf[i + 1];
  return { a, b, k: b.st > a.st ? (rt - a.st) / (b.st - a.st) : 1 };
}
// Player as sent over the network: [x, y, h, vy, flags, anim, hangT, invuln].
function packPlayer(p) {
  const r1 = v => Math.round(v * 10) / 10;
  const f = (p.onGround ? 1 : 0) | (p.touchWall ? 2 : 0) | (p.sliding ? 4 : 0) | (p.dead ? 8 : 0) | (p.blocked ? 16 : 0) | (p.shield ? 32 : 0) | (p.stunT > 0 ? 64 : 0);
  return [r1(p.x), r1(p.y), p.h, Math.round(p.vy), f, Math.round(p.anim * 1000) / 1000, r1(p.hangT), r1(p.invuln)];
}
function unpackPlayer(t, a, b, k) {
  const [, , h, vy, f, anim, hangT, invuln] = a;
  Object.assign(t, { x: lerp(a[0], b[0], k), y: lerp(a[1], b[1], k), h, vy, anim, hangT, invuln, onGround: !!(f & 1), touchWall: !!(f & 2),
                     sliding: !!(f & 4), dead: !!(f & 8), blocked: !!(f & 16), shield: !!(f & 32), stunT: f & 64 ? 1 : 0 });
}
function netSample(buf, t) {
  const s = netPick(buf);
  if (s) unpackPlayer(t, s.a.d, s.b.d, s.k);
  return !!s;
}

const Net = {
  peer: null, conn: null, live: false, isHost: false, role: 'thief', code: '',
  mode: 'cat', round: 0, clockOff: Infinity,   // mode: 'cat' (thief vs cat) or 'race' (two thieves)
  screen: 'home', msg: '', ev: [], byId: new Map(), timer: 0,
  log: [], t0: 0, showLog: false, ice: null, iceT: 0, copiedT: -9,   // connection log, shown under DETAILS

  // --- connection log (what went wrong, for the DETAILS screen) ------------
  startLog(what) {
    this.log = []; this.t0 = performance.now(); this.ice = null;
    const nc = navigator.connection;
    this.note(what + ' (V' + VERSION + ')');
    this.note((navigator.onLine ? 'ONLINE' : 'OFFLINE') + (nc && nc.type ? ', ' + nc.type : '') + (nc && nc.effectiveType ? ', ' + nc.effectiveType : '') +
              ', RELAYS: ' + (TURN_SERVERS.length ? 'OWN + PEERJS' : 'PEERJS ONLY'));
  },
  note(s) {
    this.log.push(((performance.now() - this.t0) / 1000).toFixed(1) + 'S ' + s);
    if (this.log.length > 80) this.log.shift();
  },
  // Watch the WebRTC side of a link: which routes each phone found and whether any relay answered.
  watchIce(c) {
    const pc = c.peerConnection;
    if (!pc) return;
    const NAMES = { host: 'LOCAL', srflx: 'PUBLIC', prflx: 'PUBLIC', relay: 'RELAY' };
    const count = list => ['host', 'srflx', 'relay'].map(t => NAMES[t] + ' ' + (list[t] || 0)).join(', ');
    const mine = {}, errs = new Set();
    pc.addEventListener('icecandidate', e => {
      if (e.candidate) { const t = e.candidate.type || (/ typ (\w+)/.exec(e.candidate.candidate) || [])[1]; mine[t] = (mine[t] || 0) + 1; }
      else this.note('MY ROUTES: ' + count(mine));
    });
    pc.addEventListener('icecandidateerror', e => {
      const k = e.errorCode + ' ' + (e.url || e.address || '');
      if (errs.has(k) || errs.size > 6) return;
      errs.add(k); this.note('ICE SERVER ERROR ' + k + (e.errorText ? ' ' + e.errorText : ''));
    });
    pc.addEventListener('iceconnectionstatechange', () => {
      this.note('ICE ' + pc.iceConnectionState + (pc.iceConnectionState === 'failed' && this.ice ? ' - ' + this.ice : ''));
    });
    // the connection is closed as soon as it fails, so keep a fresh summary of what was tried
    clearInterval(this.iceT);
    this.iceT = setInterval(() => {
      if (pc.connectionState === 'closed' || this.live) { clearInterval(this.iceT); return; }
      pc.getStats().then(r => {
        const ours = {}, theirs = {}; let pairs = 0, failed = 0;
        r.forEach(st => {
          if (st.type === 'local-candidate') ours[st.candidateType] = (ours[st.candidateType] || 0) + 1;
          else if (st.type === 'remote-candidate') theirs[st.candidateType] = (theirs[st.candidateType] || 0) + 1;
          else if (st.type === 'candidate-pair') { pairs++; if (st.state === 'failed') failed++; }
        });
        this.ice = 'ROUTES MINE: ' + count(ours) + ' / FRIEND: ' + count(theirs) + ' - PAIRS TRIED ' + pairs + ', FAILED ' + failed;
      }).catch(() => { /* closed meanwhile */ });
    }, 1000);
  },

  loadLib() {
    if (window.Peer) return Promise.resolve();
    const tryUrl = i => new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = PEERJS_URLS[i]; s.onload = () => { this.note('PEERJS LOADED FROM ' + new URL(s.src).host); res(); };
      s.onerror = () => {
        this.note('COULD NOT LOAD ' + new URL(s.src).host);
        if (i + 1 < PEERJS_URLS.length) tryUrl(i + 1).then(res, rej); else rej();
      };
      document.head.appendChild(s);
    });
    return tryUrl(0);
  },
  fail(msg) { if (this.ice) this.note(this.ice); this.reset(); this.screen = 'error'; this.msg = msg; sfx('deny'); },
  errText(e) {
    if (e && e.type === 'peer-unavailable') return 'NO GAME WITH THAT CODE.';
    if (e && (e.type === 'network' || e.type === 'server-error' || e.type === 'socket-error')) return "CAN'T REACH THE GAME SERVER. CHECK YOUR INTERNET.";
    if (e && e.type === 'negotiation-failed') return "COULDN'T REACH YOUR FRIEND'S PHONE. TRY BOTH ON THE SAME WI-FI.";
    if (e && e.type === 'browser-incompatible') return "THIS BROWSER CAN'T PLAY ONLINE.";
    return 'SOMETHING WENT WRONG. TRY AGAIN.';
  },
  reset() {
    clearTimeout(this.timer); clearInterval(this.iceT); this.showLog = false;
    try { if (this.peer) this.peer.destroy(); } catch (_) { /* already gone */ }
    this.peer = null; this.conn = null; this.live = false; this.code = ''; this.screen = 'home'; this.ev = [];
  },

  async host(role, mode) {
    this.reset(); this.role = role; this.mode = mode; this.isHost = true;
    this.startLog('HOST ' + (mode === 'race' ? 'A RACE' : 'AS ' + role));
    this.screen = 'connecting'; this.msg = 'CREATING A GAME';
    try { await this.loadLib(); } catch (_) { return this.fail("COULDN'T LOAD ONLINE PLAY. CHECK YOUR INTERNET."); }
    const open = attempt => {
      let code = '';
      for (let i = 0; i < 4; i++) code += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
      const peer = new Peer(PEER_PREFIX + code, PEER_OPTS);
      this.peer = peer;
      peer.on('open', id => { this.note('GAME SERVER OK, ID ' + id); this.code = code; this.screen = 'hosting'; this.msg = ''; });
      peer.on('connection', c => {
        this.note('FRIEND KNOCKING (' + c.peer + ')');
        if (this.live) { c.close(); return; }
        if (this.conn) try { this.conn.close(); } catch (_) { /* already gone */ }   // a friend's earlier attempt that never got through
        this.msg = ''; this.bind(c);
      });
      // the phone dropped off the game server (e.g. the app was in the background while sharing the code): get back on
      peer.on('disconnected', () => {
        if (this.peer !== peer || peer.destroyed) return;
        this.note('LOST THE GAME SERVER, RECONNECTING'); peer.reconnect();
      });
      peer.on('error', e => {
        this.note('SERVER ERROR ' + e.type + ': ' + e.message);
        if (e.type === 'unavailable-id' && attempt < 3) { peer.destroy(); open(attempt + 1); }   // code taken, roll another
        else if (e.type === 'network' && this.screen === 'hosting') { /* reconnecting, see 'disconnected' */ }
        else if (!this.live) this.fail(this.errText(e));
      });
    };
    open(0);
  },
  async join(code) {
    this.reset(); this.isHost = false;
    this.startLog('JOIN ' + code);
    this.screen = 'connecting'; this.msg = 'CONNECTING TO ' + code;
    try { await this.loadLib(); } catch (_) { return this.fail("COULDN'T LOAD ONLINE PLAY. CHECK YOUR INTERNET."); }
    const peer = new Peer(PEER_OPTS);
    this.peer = peer;
    peer.on('open', id => { this.note('GAME SERVER OK, ID ' + id); this.bind(peer.connect(PEER_PREFIX + code, { reliable: true, serialization: 'json' })); });
    peer.on('error', e => { this.note('SERVER ERROR ' + e.type + ': ' + e.message); if (!this.live) this.fail(this.errText(e)); });
    // the code was right (otherwise the server says so right away) but the phones couldn't link up
    this.timer = setTimeout(() => {
      if (this.live || this.screen !== 'connecting') return;
      this.note('GAVE UP AFTER 25S');
      this.fail("COULDN'T REACH YOUR FRIEND'S PHONE. TRY BOTH ON THE SAME WI-FI.");
    }, 25000);
  },
  joinTyped() {
    const code = codeInput.value.toUpperCase();
    if (code.length === 4) { codeInput.blur(); this.join(code); }
  },
  bind(c) {
    this.conn = c;
    this.note('LINKING WITH ' + c.peer);
    this.watchIce(c);
    c.on('open', () => {
      this.note('LINK OPEN');
      clearTimeout(this.timer);
      this.live = true; this.screen = 'lobby'; sfx('buy');
      this.send({ t: 'ver', v: VERSION });
      if (this.isHost) this.send({ t: 'hello', role: this.role, mode: this.mode, v: VERSION });
    });
    c.on('data', m => this.onData(m));
    c.on('close', () => { this.note('LINK CLOSED'); this.lost(); });
    c.on('error', e => {
      this.note('LINK ERROR ' + e.type + ': ' + e.message);
      if (this.live || this.conn !== c) return;        // a dropped message is not a disconnect; 'close' handles that
      if (this.isHost) { if (this.ice) this.note(this.ice); this.conn = null; this.msg = "YOUR FRIEND COULDN'T CONNECT. TRY THE SAME WI-FI."; }
      else this.fail(this.errText(e));
    });
  },
  lost() {
    if (!this.live) return;
    this.live = false; this.conn = null;
    if (state === 'run' && run && run.mp) run.netLost = true;
    else if (state === 'mp') { this.screen = 'error'; this.msg = 'YOUR FRIEND LEFT.'; }
  },
  leave() {
    this.send({ t: 'bye' });
    this.live = false;
    setTimeout(() => this.reset(), 150);
  },
  send(m) { if (this.conn && this.conn.open) try { this.conn.send(m); } catch (_) { /* channel closing */ } },

  // --- roles & rounds ----------------------------------------------------
  swap(tell) { this.role = this.role === 'thief' ? 'cat' : 'thief'; if (tell) this.send({ t: 'swap' }); },
  setMode(m, tell) { this.mode = m; if (tell) this.send({ t: 'mode', m }); },
  requestRound() {
    if (this.mode === 'race') { if (this.isHost) startRace(); else this.send({ t: 'req' }); }
    else if (this.role === 'thief') startMpRound(); else this.send({ t: 'req' });
  },
  noteClock(st) { const off = performance.now() - st; if (off < this.clockOff) this.clockOff = off; },   // fastest delivery seen
  swapAndPlay() { this.swap(true); this.requestRound(); },
  act(id) { sfx('click'); this.send({ t: 'act', a: id }); },

  onData(m) {
    switch (m.t) {
      case 'ver':
        if (m.v !== VERSION) this.fail('YOUR FRIEND HAS V' + m.v + ', YOU HAVE V' + VERSION + '. RELOAD THE GAME ON BOTH PHONES.');
        break;
      case 'hello': this.role = m.role === 'thief' ? 'cat' : 'thief'; this.mode = m.mode || 'cat'; break;
      case 'swap': this.swap(false); break;
      case 'mode': this.setMode(m.m, false); break;
      case 'req': if (this.mode === 'race') { if (this.isHost) startRace(); } else if (this.role === 'thief') startMpRound(); break;
      case 'race': this.round = m.r; startRaceRound(m.seed); break;
      case 'g':
        if (!run || !run.race || m.r !== this.round) break;
        this.noteClock(m.st); netPush(run.ghost.buf, m.st, m.p); run.ghost.time = m.tm;
        break;
      case 'done': if (run && run.race && m.r === this.round) { run.ghost.done = true; run.ghost.time = m.tm; } break;
      case 'round': startViewRound(); break;
      case 'act': catMove(m.a); break;
      case 's': applySnap(m); break;
      case 'bye': this.lost(); break;
    }
  },

  // Thief's device → cat's device, every frame: positions, timers, new level pieces, effects.
  sendSnap() {
    const R = run, c = R.cat, r1 = v => Math.round(v * 10) / 10;
    const dyn = [], x0 = R.camX - 120, x1 = R.camX + W + 200;
    for (const s of Level.solids) {
      if (s.x > x1 || s.x + s.w < x0) continue;
      if (s.type === 'crumble') dyn.push(['s' + s.id, s.state, Math.round(s.y)]);
      else if (s.type === 'fake') dyn.push(['s' + s.id, s.state]);
      else if (s.type === 'invis' && s.revealed) dyn.push(['s' + s.id, 1]);
    }
    for (const z of Level.hazards) if (z.pop && z.x < x1 && z.x + z.w > x0) dyn.push(['h' + z.id, z.state, Math.round(z.t * 1000) / 1000]);
    this.send({
      t: 's', st: Math.round(performance.now()), tm: R.time, ph: R.phase, cd: R.countdown, oT: R.overT, ca: R.cause, li: R.line,
      p: packPlayer(R.player),
      c: [r1(c.x), r1(c.y), Math.round(c.vy), c.onGround ? 1 : 0, Math.round(c.anim * 1000) / 1000, r1(c.rageT), r1(c.pounceT)],
      an: R.anger, g: R.gain, dz: Math.round(R.danger * 1000) / 1000, fz: r1(R.frozenT), bo: r1(R.boostT),
      sh: r1(R.shake), fl: Math.round(R.flash * 100) / 100, fc: R.flashColor, bn: R.banner,
      cc: R.catAbil.map(m => Math.round(m.cd / m.cdMax * 100) / 100),
      add: Level.outbox.splice(0), dyn, ev: this.ev.splice(0),
    });
  },
  // Race: my thief, every frame, for the friend's screen.
  sendGhost() { this.send({ t: 'g', r: this.round, st: Math.round(performance.now()), tm: run.time, p: packPlayer(run.player) }); },
};

function startMpRound() {
  Net.clockOff = Infinity;
  state = 'run'; UI.focus = 0;       // set first: level pieces created by newRun are queued for the friend
  newRun({ mp: true });
  Net.send({ t: 'round' });
  Music.stop(); Music.play('chase');
}
function startViewRound() {
  Net.clockOff = Infinity;
  newRun({ mp: true, view: true });
  state = 'run'; UI.focus = 0;
  Music.stop(); Music.play('chase');
}
// Race: the host picks the level (a seed) and both phones start on it.
function startRace() {
  if (state === 'run' && run && run.race && run.phase !== 'over') return;   // already racing
  const seed = Math.floor(Math.random() * 2147483647);
  Net.round++;
  Net.send({ t: 'race', seed, r: Net.round });
  startRaceRound(seed);
}
function startRaceRound(seed) {
  Net.clockOff = Infinity;
  newRun({ mp: true, race: true, seed });
  state = 'run'; UI.focus = 0;
  Music.stop(); Music.play('chase');
}
// Cat's device: copy the thief's snapshot into the local run so the normal renderer can draw it.
function applySnap(m) {
  const R = run;
  if (!R || !R.view || state !== 'run') return;
  if (R.countdown > 0 && m.cd <= 0) R.startT = 0.8;
  R.time = m.tm; R.phase = m.ph; R.countdown = m.cd; R.overT = m.oT; R.cause = m.ca; R.line = m.li;
  Net.noteClock(m.st); netPush(R.buf, m.st, [m.p, m.c]);     // positions are drawn a bit later, smoothly (updateView)
  R.anger = m.an; R.gain = m.g; R.danger = m.dz; R.frozenT = m.fz; R.boostT = m.bo;
  R.shake = Math.max(R.shake, m.sh); R.flash = Math.max(R.flash, m.fl); R.flashColor = m.fc; R.banner = m.bn; R.catCd = m.cc;
  for (const [k, o] of m.add) { (k === 's' ? Level.solids : Level.hazards).push(o); Net.byId.set(k + o.id, o); }
  for (const [key, a, b] of m.dyn) {
    const o = Net.byId.get(key);
    if (!o) continue;
    if (o.type === 'crumble') { o.state = a; o.y = b; }
    else if (o.type === 'fake') o.state = a;
    else if (o.type === 'invis') o.revealed = true;
    else if (o.pop) { o.state = a; o.t = b; }
  }
  for (const e of m.ev) {
    if (e[0] === 's') sfx(e[1]);
    else if (e[0] === 'p') popup(e[1], e[2], e[3], e[4], e[5], e[6]);
    else if (e[0] === 'b') burst(e[1], e[2], e[3], e[4], e[5]);
    else if (e[0] === 'r') ring(e[1], e[2], e[3]);
  }
}
// Cat's device, every frame: local-only things (camera, particles, moving platforms).
function updateView(dt) {
  const R = run;
  R.shake = Math.max(0, R.shake - dt * 12); R.flash = Math.max(0, R.flash - dt); R.fadeT = Math.max(0, R.fadeT - dt);
  R.startT = Math.max(0, R.startT - dt);
  if (R.banner) R.banner.t -= dt;
  const s = netPick(R.buf);
  if (s) {
    unpackPlayer(R.player, s.a.d[0], s.b.d[0], s.k);
    const [, cy, cvy, cg, canim, rageT, pounceT] = s.a.d[1];
    Object.assign(R.cat, { x: lerp(s.a.d[1][0], s.b.d[1][0], s.k), y: lerp(cy, s.b.d[1][1], s.k), vy: cvy, onGround: !!cg, anim: canim, rageT, pounceT });
  }
  updateFx(dt);
  updateCamera(dt);
  Level.updateMovers(R.time);
  Level.prune(Math.min(R.camX, R.cat.x - 70) - 100);
  Music.bpmBoost = Math.min(42, R.anger * 7);
}

function buy(a) {
  const tier = tierOf(a.id);
  if (tier >= 3) return;
  const price = a.prices[tier];
  if (Save.data.points < price) { sfx('deny'); say('NEED ' + (price - Save.data.points) + ' MORE ★', '#e01e1e'); return; }
  Save.data.points -= price;
  Save.data.tiers[a.id] = tier + 1;
  if (tier === 0 && Save.data.equipped.length < MAX_SLOTS) Save.data.equipped.push(a.id);
  Save.save();
  sfx('buy');
  say(tier === 0 ? a.name + ' UNLOCKED!' : a.name + ' UPGRADED TO TIER ' + (tier + 1) + '!', PAL.green);
}
function toggleEquip(a) {
  const eq = Save.data.equipped, i = eq.indexOf(a.id);
  if (i >= 0) { eq.splice(i, 1); sfx('click'); }
  else if (eq.length >= MAX_SLOTS) { sfx('deny'); say('ALL ' + MAX_SLOTS + ' SLOTS FULL. UNEQUIP SOMETHING.', '#e01e1e'); return; }
  else { eq.push(a.id); sfx('click'); }
  Save.save();
}

function wrapText(str, maxW) {
  const out = [];
  let line = '';
  for (const word of String(str).toUpperCase().split(' ')) {
    const next = line ? line + ' ' + word : word;
    if (line && textWidth(next) > maxW) { out.push(line); line = '  ' + word; } else line = next;
  }
  out.push(line);
  return out;
}

      const race = Net.mode === 'race', me = Net.role, friend = race ? 'friend' : me === 'cat' ? 'thief' : 'cat';
      drawText('CONNECTED!', W / 2, 36, PAL.green, 2, 'center');
      drawRolePortrait(race ? 'thief' : me, W / 2 - 90, 124, 'YOU', race ? 'THIEF' : me === 'cat' ? 'THE CAT' : 'THE THIEF');
      drawRolePortrait(friend, W / 2 + 90, 124, 'FRIEND', race ? 'BLUE THIEF' : friend === 'cat' ? 'THE CAT' : 'THE THIEF');
      drawText('VS', W / 2, 92, '#e01e1e', 3, 'center');
      if (race) { if (UI.button('start', bx, 162, bw, 22, 'START THE RACE!', { accent: '#e01e1e' })) Net.requestRound(); }
      else {
        if (UI.button('start', W / 2 - 150, 162, 140, 22, 'START!', { accent: '#e01e1e' })) Net.requestRound();
        if (UI.button('swaproles', W / 2 + 10, 162, 140, 22, 'SWAP ROLES', { accent: '#2f9a5a' })) { Net.swap(true); sfx('click'); }
      }
      if (UI.button('mode', bx, 190, bw, 20, race ? 'MODE: RACE (TAP TO CHANGE)' : 'MODE: THIEF VS CAT (TAP TO CHANGE)', { size: 1 })) {
        Net.setMode(race ? 'cat' : 'race', true); sfx('click');
      }
      if (UI.button('mpleave', bx, 216, bw, 20, 'LEAVE') || UI.back) { Net.leave(); Net.screen = 'home'; }
      break;
    }
    case 'error':
      drawText(Net.msg, W / 2, 90, '#e01e1e', 1, 'center');
      back(130, 'OK');
      if (Net.log.length && UI.button('details', bx, 160, bw, 22, 'DETAILS')) Net.showLog = true;
      break;
  }
}

let resetArm = 0;
function drawSettings(dt) {
  bgLight();
  drawText('SETTINGS', W / 2, 16, PAL.ink, 4, 'center');
  const d = Save.data, bw = 240, bx = Math.round(W / 2 - bw / 2), on = v => v ? 'ON' : 'OFF';
  resetArm = Math.max(0, resetArm - dt);
  let y = 44;
  const row = (id, label, fn, o) => { if (UI.button(id, bx, y, bw, 21, label, o)) fn(); y += 26; };
  row('snd', 'SOUND: ' + on(d.sound), () => { d.sound = !d.sound; Save.save(); Sound.apply(); sfx('click'); });
  row('mus', 'MUSIC: ' + on(d.music), () => { d.music = !d.music; Save.save(); Sound.apply(); sfx('click'); });
  row('intro', 'INTRO CUTSCENE: ' + on(d.intro), () => { d.intro = !d.intro; Save.save(); sfx('click'); });
  row('shake', 'SCREEN SHAKE: ' + on(d.shake), () => { d.shake = !d.shake; Save.save(); sfx('click'); });
  row('touchbtn', 'TOUCH BUTTONS: ' + on(d.touchButtons), () => { d.touchButtons = !d.touchButtons; Save.save(); sfx('click'); });
  row('reset', resetArm > 0 ? 'TAP AGAIN TO ERASE ALL' : 'RESET PROGRESS', () => {
    if (resetArm > 0) {
      const keep = { sound: d.sound, music: d.music, intro: d.intro, shake: d.shake, touchButtons: d.touchButtons };
      Save.data = Object.assign(Save.defaults(), keep); Save.save(); resetArm = 0; sfx('hit');
    } else { resetArm = 3; sfx('deny'); }
  }, { accent: '#e01e1e', textColor: '#b03030' });
  const hw = (bw - 8) / 2;
  if (UI.button('about', bx, y + 4, hw, 21, 'ABOUT')) go('about');
  if (UI.button('back', bx + hw + 8, y + 4, hw, 21, 'BACK') || UI.back) go('menu');
}

function drawAbout() {
  bgLight();
  drawText('ABOUT', W / 2, 16, PAL.ink, 4, 'center');
  drawRolePortrait('thief', W / 2 - 150, 150, '', '');
  drawRolePortrait('cat', W / 2 + 160, 150, '', '');
  drawText('MOUSE THIEF', W / 2 + 2, 58, '#e01e1e', 3, 'center');
  drawText('MOUSE THIEF', W / 2, 56, PAL.ink, 3, 'center');
  drawText('VERSION ' + VERSION, W / 2, 80, PAL.inkSoft, 2, 'center');
  drawText('CREATED WITH LOVE', W / 2, 108, PAL.ink, 2, 'center');
  drawText('BY A SON AND HIS DAD', W / 2, 124, PAL.ink, 2, 'center');
  drawText('♥', W / 2, 142, '#e01e1e', 3, 'center');
  const bw = 160;
  if (UI.button('back', Math.round(W / 2 - bw / 2), 190, bw, 22, 'BACK') || UI.back) go('settings');
}

/* --------------------------------------------------------------------------
   13. MAIN LOOP
   -------------------------------------------------------------------------- */
let lastT = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000);
  lastT = now;
  menuT += dt;
  Input.update();
  if (state === 'run' && run) {
    if (run.view) updateView(dt);                                               // multiplayer cat: just draw what the thief sends
    else if (run.paused || run.netLost) acc = 0;
    else if (run.tut && run.tut.freeze) { acc = 0; Tutorial.frozenInput(dt); }   // tutorial waiting for an action
    else { acc += dt; while (acc >= STEP && !(run.tut && run.tut.freeze)) { updateRun(STEP); acc -= STEP; } }
  } else if (state === 'intro') Intro.update(dt);

  UI.begin();
  switch (state) {
    case 'menu': drawMenu(); break;
    case 'shop': drawShop(dt); break;
    case 'scores': drawScores(); break;
    case 'settings': drawSettings(dt); break;
    case 'about': drawAbout(); break;
    case 'intro': Intro.draw(); break;
    case 'run': drawRun(); break;
    case 'mp': drawMP(); break;
  }
  if (state !== 'mp') codeInput.style.display = 'none';
  if (netEmit()) Net.sendSnap();
  else if (raceEmit()) Net.sendGhost();
  UI.end();
  blit();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
