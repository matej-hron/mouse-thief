<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Pixel Hoops: arcade basketball that looks 3D. Pull back and let go to shoot. Every basket is 2 points.">
<meta name="theme-color" content="#0d0b13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Pixel Hoops</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1030; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #screen { position: fixed; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<script src="common.js"></script>
<script>
'use strict';
/* ==========================================================================
   PIXEL HOOPS: arcade basketball (part of the PIXEL ARCADE).
   It is drawn flat in 2D, but the court, the hoop and the ball live in 3D
   (in metres) and every frame they are projected through a camera standing
   behind your player, so it looks 3D (like Pixel GP).
   Pull back (down) anywhere on the screen and let go to shoot (like a slingshot).
   Pull further for a harder throw, sideways to aim the other way. Every basket is +2 points.
     TIME ATTACK: 60 seconds, as many baskets as you can. Late in the game the hoop moves.
     FREE SHOOT: no clock, just shoot.
     1. Setup   2. The game   3. Physics   4. Drawing   5. Screens   6. Input   7. Main loop
   ========================================================================== */

/* --- 1. SETUP --------------------------------------------------------------- */
const VERSION = '2.1.0';
const SAVE_KEY = 'pixelHoops.save';
const save = { best: 0, made: 0, shots: 0, sfx: true };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY)) || {}); } catch (e) { /* new player */ }
const store = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* private mode */ } };
const profile = PX.Profile.get();
const MY_COLOR = PX.AVATAR_COLORS[profile.avatar.color];

const canvas = document.getElementById('screen');
const S = PX.makeScreen(canvas, { H: 240, minW: 400, maxW: 560 });
const ctx = S.ctx, H = S.H;
const UI = PX.makeUI(S, canvas);
const T = (str, x, y, color = '#fff', size = 1, align = 'left', shadow = null) => PX.drawText(ctx, str, x, y, color, size, align, shadow);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rnd = (a, b) => a + Math.random() * (b - a);

// the world, in metres: the hoop is at x = 0, z = 0, the court runs towards +z, y is up
const GRAV = 9.8;
const BR = 0.12;                                // ball radius
const RIM_R = 0.27, RIM_T = 0.02, RIM_Y = 3.05; // rim radius (a bit bigger than a real one), its thickness, its height
const BOARD_Z = -0.4, BOARD_HW = 0.9, BOARD_Y0 = 2.9, BOARD_Y1 = 3.97;
const POLE_Z = -1.9;
const BASE_Z = -1.575, HALF_Z = 12.4, SIDE_X = 7.5, KEY_Z = 4.225;
const REL_Y = 2.12, ANGLE = 52 * Math.PI / 180;  // the ball leaves your hands this high, at this angle
const MAX_PULL = 100;                            // longest pull (screen pixels)
const SWEET_LO = 0.32, SWEET_HI = 0.68;          // pull this much (of the longest pull) and the power is just right
// the camera: F = focal length in pixels, HOR = the horizon on the screen; it looks over your shoulder (CAM_BACK behind you, CAM_SIDE to your left)
const F = 340, HOR = 80, CAM_Y = 3.2, CAM_BACK = 3.6, CAM_SIDE = 0.7, NEAR = 0.3;
const GAME_TIME = 60;
const POINTS = 2;

/* --- 2. THE GAME --------------------------------------------------------------- */
let state = 'title';            // title | play | over
let paused = false;
let G = null;
function hoop(ahead = 0) {      // where the hoop is now, or in a moment (it slides left and right late in TIME ATTACK)
  let x = 0;
  if (G && G.mode === 'timed' && G.time < 30) x = Math.sin((G.hoopT + ahead) * 0.8) * 0.7 * Math.min(1, (30 - G.time) / 4);
  return { x, z: 0 };
}
function shooterAt(a, d) { return { a, d, x: Math.sin(a) * d, z: Math.cos(a) * d }; }   // a = angle around the hoop, d = distance
function handPos(me) {          // where your player holds the ball (right hand, a bit in front)
  const fx = -Math.sin(me.a), fz = -Math.cos(me.a), rx = Math.cos(me.a), rz = -Math.sin(me.a);
  return { x: me.x + rx * 0.12 + fx * 0.2, y: REL_Y, z: me.z + rz * 0.12 + fz * 0.2 };
}
function newGame(mode) {
  G = { mode, score: 0, made: 0, shots: 0, streak: 0, bestStreak: 0, time: GAME_TIME, hoopT: 0,
        balls: [], spot: null, me: null, cam: null, throwT: 9, next: 0, pops: [], net: 0, stars: 0, newBest: false, overT: 0, buzz: 3 };
  newSpot();
  G.cam = { a: G.me.a, d: G.me.d + CAM_BACK };
  state = 'play'; paused = false; aim = null;
}
function newSpot() {            // a new place to shoot from: the camera glides there behind you
  const far = G.mode === 'timed' ? clamp(0.3 + G.made * 0.025, 0.3, 1) : 1;   // in TIME ATTACK the spots move further away
  const d = 2.6 + 3.4 * rnd(0.1, 1) * far, a = rnd(-0.8, 0.8);
  G.me = shooterAt(a, d); G.spot = G.me;
}
function shoot(v) {
  const p = handPos(G.me);
  G.balls.push({ x: p.x, y: p.y, z: p.z, vx: v.x, vy: v.y, vz: v.z, rot: 0, age: 0, rest: 0, touched: false, scored: false, fire: G.streak >= 3 });
  G.shots++; save.shots++;
  G.spot = null; G.next = 0.6; G.throwT = 0;
  sfx('throw');
}
function scored(b) {
  b.scored = true; G.made++; save.made++; G.streak++; G.bestStreak = Math.max(G.bestStreak, G.streak);
  G.score += POINTS; G.net = 1;
  const h = hoop();
  G.pops.push({ wx: h.x, wy: RIM_Y + 0.5, wz: h.z, text: '+' + POINTS, t: 0, color: '#ffd23f' });
  if (!b.touched) G.pops.push({ wx: h.x, wy: RIM_Y - 0.9, wz: h.z, text: 'SWISH!', t: 0, color: '#7af0ff' });
  if (G.streak === 3) G.pops.push({ x: S.W / 2, y: 70, text: 'ON FIRE!', t: 0, color: '#ff6a2a', big: true });
  sfx(b.touched ? 'score' : 'swish');
  store();
}
function endGame() {
  state = 'over'; G.overT = 0; aim = null;
  if (G.score > save.best) { save.best = G.score; G.newBest = true; }
  G.stars = Math.floor(G.score / 10);
  if (G.stars) PX.Wallet.add(G.stars);
  store(); sfx('buzzer');
}

/* --- 3. PHYSICS (in 3D) --------------------------------------------------------- */
function bounceOff(b, px, py, pz, minD, k) {   // push the ball out of a point and bounce
  const dx = b.x - px, dy = b.y - py, dz = b.z - pz, d = Math.hypot(dx, dy, dz);
  if (d >= minD || d === 0) return false;
  const nx = dx / d, ny = dy / d, nz = dz / d;
  b.x = px + nx * minD; b.y = py + ny * minD; b.z = pz + nz * minD;
  const vn = b.vx * nx + b.vy * ny + b.vz * nz;
  if (vn < 0) {
    b.vx -= (1 + k) * vn * nx; b.vy -= (1 + k) * vn * ny; b.vz -= (1 + k) * vn * nz;
    b.vx *= 0.92; b.vy *= 0.92; b.vz *= 0.92;
    return Math.abs(vn) > 1;
  }
  return false;
}
function stepBall(b, dt, h) {
  const py = b.y;
  b.vy -= GRAV * dt;
  b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
  b.rot += dt * 9; b.age += dt;
  // the rim: a ring; bounce off its nearest point
  const dx = b.x - h.x, dz = b.z - h.z, r = Math.hypot(dx, dz);
  if (r > 1e-6 && Math.abs(b.y - RIM_Y) < BR + RIM_T && Math.abs(r - RIM_R) < BR + RIM_T)
    if (bounceOff(b, h.x + dx / r * RIM_R, RIM_Y, h.z + dz / r * RIM_R, BR + RIM_T, 0.5)) { b.touched = true; sfx('rim'); }
  // the backboard: a thin box
  const bz = h.z + BOARD_Z;
  if (bounceOff(b, clamp(b.x, h.x - BOARD_HW, h.x + BOARD_HW), clamp(b.y, BOARD_Y0, BOARD_Y1), clamp(b.z, bz - 0.04, bz), BR, 0.6)) { b.touched = true; sfx('board'); }
  // went down through the hoop?
  if (!b.scored && py > RIM_Y && b.y <= RIM_Y && b.vy < 0 && Math.hypot(b.x - h.x, b.z - h.z) < RIM_R + 0.04) scored(b);
  // the floor, and the boards around the court
  if (b.y < BR) {
    b.y = BR;
    if (b.vy < -1.5) sfx('bounce');
    b.vy = -b.vy * 0.62; b.vx *= 0.85; b.vz *= 0.85;
    if (Math.abs(b.vy) < 1) { b.vy = 0; b.rest += dt; }
  }
  if (b.z < -3) { b.z = -3; b.vz = Math.abs(b.vz) * 0.5; }
  if (Math.abs(b.x) > 9.3) { b.x = Math.sign(b.x) * 9.3; b.vx = -b.vx * 0.5; }
  return b.rest < 0.5 && b.age < 7 && b.z < 16;
}
function step(dt) {
  const h = hoop();
  G.hoopT += dt; G.throwT += dt;
  if (G.mode === 'timed' && state === 'play') {
    G.time -= dt;
    if (G.time <= G.buzz && G.buzz > 0) { sfx('tick'); G.buzz--; }
    if (G.time <= 0) { G.time = 0; endGame(); }
  }
  G.balls = G.balls.filter(b => {
    const keep = stepBall(b, dt, h);
    if (!keep && !b.scored) G.streak = 0;     // a miss ends the streak
    return keep;
  });
  if (!G.spot && state === 'play') { G.next -= dt; if (G.next <= 0) newSpot(); }
  const k = Math.min(1, dt * 4);              // the camera glides behind you, circling the hoop
  G.cam.a += (G.me.a - G.cam.a) * k; G.cam.d += (G.me.d + CAM_BACK - G.cam.d) * k;
  G.net = Math.max(0, G.net - dt * 2.5);
  for (const p of G.pops) p.t += dt;
  G.pops = G.pops.filter(p => p.t < 1.1);
}

/* --- 4. DRAWING: 3D points projected onto the flat screen ---------------------------- */
const cam = { x: 0, z: 8, fx: 0, fz: -1, rx: 1, rz: 0, yaw: 0 };
function setCam(a, d) {         // stand at angle a, distance d from the hoop (a bit to the side) and look at the hoop
  const rx = Math.cos(a), rz = -Math.sin(a);
  cam.x = Math.sin(a) * d - rx * CAM_SIDE; cam.z = Math.cos(a) * d - rz * CAM_SIDE;
  const l = Math.hypot(cam.x, cam.z);
  cam.fx = -cam.x / l; cam.fz = -cam.z / l; cam.rx = -cam.fz; cam.rz = cam.fx;
  cam.yaw = Math.atan2(cam.fx, -cam.fz);
}
function view(x, y, z) {        // world -> camera: [right, up, depth]
  const dx = x - cam.x, dz = z - cam.z;
  return [dx * cam.rx + dz * cam.rz, y - CAM_Y, dx * cam.fx + dz * cam.fz];
}
function scr(v) { const k = F / v[2]; return { x: S.W / 2 + v[0] * k, y: HOR - v[1] * k, k }; }   // k = pixels per metre there
function proj(x, y, z) { const v = view(x, y, z); return v[2] < NEAR ? null : scr(v); }
function cut(a, b) { const t = (NEAR - a[2]) / (b[2] - a[2]); return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, NEAR]; }
function poly(pts, fill) {      // a flat 3D polygon, cut where it goes behind the camera
  const vs = pts.map(p => view(p[0], p[1], p[2])), out = [];
  for (let i = 0; i < vs.length; i++) {
    const a = vs[i], b = vs[(i + 1) % vs.length];
    if (a[2] >= NEAR) out.push(a);
    if ((a[2] >= NEAR) !== (b[2] >= NEAR)) out.push(a[2] < NEAR ? cut(a, b) : cut(b, a));
  }
  if (out.length < 3) return;
  ctx.fillStyle = fill; ctx.beginPath();
  out.forEach((v, i) => { const s = scr(v); if (i) ctx.lineTo(s.x, s.y); else ctx.moveTo(s.x, s.y); });
  ctx.closePath(); ctx.fill();
}
function path3(pts, color, w = 1, closed = false) {   // 3D lines
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.beginPath();
  const n = pts.length;
  for (let i = 0; i < (closed ? n : n - 1); i++) {
    let a = view(...pts[i]), b = view(...pts[(i + 1) % n]);
    if (a[2] < NEAR && b[2] < NEAR) continue;
    if (a[2] < NEAR) a = cut(a, b); else if (b[2] < NEAR) b = cut(b, a);
    const sa = scr(a), sb = scr(b);
    ctx.moveTo(sa.x, sa.y); ctx.lineTo(sb.x, sb.y);
  }
  ctx.stroke();
}
function arc3(cx, cz, r, a0, a1, n = 24) {   // points on a floor circle (angle 0 = towards the court)
  const pts = [];
  for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; pts.push([cx + Math.sin(a) * r, 0, cz + Math.cos(a) * r]); }
  return pts;
}
function ellipse(x, y, rx, ry, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.5, rx), Math.max(0.5, ry), 0, 0, Math.PI * 2); ctx.fill(); }

// the arena, built once
const T3 = Math.asin(6.6 / 6.75);
const COURT_LINES = [
  { pts: [[-SIDE_X, 0, BASE_Z], [SIDE_X, 0, BASE_Z], [SIDE_X, 0, HALF_Z], [-SIDE_X, 0, HALF_Z]], closed: true },
  { pts: [[-2.45, 0, BASE_Z], [2.45, 0, BASE_Z], [2.45, 0, KEY_Z], [-2.45, 0, KEY_Z]], closed: true },   // the key
  { pts: arc3(0, KEY_Z, 1.8, 0, Math.PI * 2, 28), closed: true },                                     // free-throw circle
  { pts: [[-6.6, 0, BASE_Z], ...arc3(0, 0, 6.75, -T3, T3, 36), [6.6, 0, BASE_Z]] },                    // the three-point line
  { pts: arc3(0, HALF_Z, 1.8, Math.PI / 2, Math.PI * 1.5, 14) },                                     // centre circle
  { pts: arc3(0, 0, 1.25, -Math.PI / 2, Math.PI / 2, 12) },
];
const TRIBUNES = [              // the stands on three sides, rising away from the court
  { c: [0, 3, -6], pts: [[-9.5, 0.9, -3.1], [9.5, 0.9, -3.1], [15.1, 5.4, -8.7], [-15.1, 5.4, -8.7]], fans: [] },
  { c: [12.3, 3, 5], pts: [[9.5, 0.9, -3.1], [9.5, 0.9, 16], [15.1, 5.4, 16], [15.1, 5.4, -8.7]], fans: [] },
  { c: [-12.3, 3, 5], pts: [[-9.5, 0.9, -3.1], [-9.5, 0.9, 16], [-15.1, 5.4, 16], [-15.1, 5.4, -8.7]], fans: [] },
];
const BOARDS = [];              // advertising boards around the court
(function buildArena() {
  const cols = ['#e01e1e', '#2a7fd4', '#f2f2f2', '#ffd23f', '#3fae4a', '#ff8a2a', '#b25ad4'];
  const skins = ['#f0c090', '#c98a5a', '#8a5a3a', '#f4d2b0'];
  let n = 0;
  const fan = (tr, x, y, z, r) => { n++; tr.fans.push({ x, y, z, r, c: cols[(n * 7 + r * 3) % cols.length], s: skins[(n * 5) % skins.length], j: n % 3 === 0 }); };
  for (let r = 7; r >= 0; r--) {          // the back rows first (they are further away)
    const t = (r + 0.5) / 8, y = 0.9 + t * 4.5, o = 9.5 + t * 5.6, back = -3.1 - t * 5.6;
    for (let x = -o + 0.3; x < o; x += 0.62) fan(TRIBUNES[0], x, y, back, r);
    for (let z = back + 0.4; z < 16; z += 0.62) { fan(TRIBUNES[1], o, y, z, r); fan(TRIBUNES[2], -o, y, z, r); }
  }
  const bc = ['#e01e1e', '#2a7fd4', '#ffd23f', '#3fae4a', '#ff8a2a'];
  for (let i = 0; i < 10; i++) { const x0 = -9.5 + i * 1.9; BOARDS.push({ c: bc[i % 5], pts: [[x0, 0, -3.1], [x0 + 1.9, 0, -3.1], [x0 + 1.9, 0.9, -3.1], [x0, 0.9, -3.1]] }); }
  for (let i = 0; i < 10; i++) for (const sx of [-9.5, 9.5]) {
    const z0 = -3.1 + i * 1.91;
    BOARDS.push({ c: bc[(i + 2) % 5], pts: [[sx, 0, z0], [sx, 0, z0 + 1.91], [sx, 0.9, z0 + 1.91], [sx, 0.9, z0]] });
  }
})();

function drawArena(t, cheer) {
  const W = S.W;
  ctx.fillStyle = '#120c22'; ctx.fillRect(0, 0, W, HOR + 1);           // the dark roof
  for (let i = 0; i < 24; i++) {                                        // lights, far away: they only turn with the camera
    let rel = i * Math.PI / 12 - cam.yaw; rel = Math.atan2(Math.sin(rel), Math.cos(rel));
    if (Math.abs(rel) > 1.2) continue;
    const x = Math.round(W / 2 + Math.tan(rel) * F), y = 10 + (i % 2) * 7;
    ctx.fillStyle = 'rgba(255,240,180,0.15)'; ctx.fillRect(x - 6, y - 3, 14, 8);
    ctx.fillStyle = '#fff8d0'; ctx.fillRect(x - 3, y, 8, 2);
  }
  ctx.fillStyle = '#4a2f1e'; ctx.fillRect(0, HOR, W, H - HOR);           // the floor around the court
  poly([[-SIDE_X, 0, BASE_Z], [SIDE_X, 0, BASE_Z], [SIDE_X, 0, HALF_Z], [-SIDE_X, 0, HALF_Z]], '#c8874a');
  for (let x = -SIDE_X; x < SIDE_X; x += 1) poly([[x, 0, BASE_Z], [x + 0.5, 0, BASE_Z], [x + 0.5, 0, HALF_Z], [x, 0, HALF_Z]], '#bd7c42');   // planks
  poly([[-2.45, 0, BASE_Z], [2.45, 0, BASE_Z], [2.45, 0, KEY_Z], [-2.45, 0, KEY_Z]], '#3d64b8');                                              // the paint
  for (const l of COURT_LINES) path3(l.pts, '#f4ead8', 1, l.closed);
  // the stands with the crowd (further side first)
  const order = TRIBUNES.map(tr => ({ tr, d: view(...tr.c)[2] })).sort((a, b) => b.d - a.d);
  for (const { tr } of order) {
    poly(tr.pts, '#251842');
    for (const f of tr.fans) {
      const v = view(f.x, f.y, f.z); if (v[2] < 1) continue;
      const k = F / v[2], sx = W / 2 + v[0] * k; if (sx < -8 || sx > W + 8) continue;
      const jump = cheer && f.j ? Math.abs(Math.sin(t * 14 + f.x)) * 0.25 * k : (Math.floor(t * 3 + f.x * 2 + f.r) % 9 === 0 ? 0.06 * k : 0);
      const sy = HOR - v[1] * k - jump, w = Math.max(1, Math.round(0.36 * k)), bh = Math.max(1, Math.round(0.34 * k)), hw = Math.max(1, Math.round(0.2 * k));
      ctx.fillStyle = f.c; ctx.fillRect(Math.round(sx - w / 2), Math.round(sy - bh), w, bh);
      ctx.fillStyle = f.s; ctx.fillRect(Math.round(sx - hw / 2), Math.round(sy - bh - hw), hw, hw);
    }
  }
  for (const b of BOARDS) { poly(b.pts, b.c); path3([b.pts[3], b.pts[2]], '#111', 1); }
}
function drawShadow(x, y, z, size) {    // a shadow on the floor (smaller and lighter the higher it is)
  const v = view(x, 0, z); if (v[2] < NEAR) return;
  const s = scr(v), rx = size * s.k * (1 - Math.min(0.5, y / 8));
  ctx.globalAlpha = 0.35 * clamp(1 - y / 5, 0.25, 1);
  ellipse(s.x, s.y, rx, rx * Math.min(1, CAM_Y / v[2]), '#000');
  ctx.globalAlpha = 1;
}
function drawBoard(h) {
  const bz = h.z + BOARD_Z, top = proj(h.x, 3.45, POLE_Z), bot = proj(h.x, 0, POLE_Z);
  if (top && bot) {                                                                // the pole and the arm
    const w = Math.max(2, 0.18 * top.k);
    ctx.fillStyle = '#111'; ctx.fillRect(Math.round(top.x - w / 2 - 1), Math.round(top.y), Math.round(w + 2), Math.round(bot.y - top.y));
    ctx.fillStyle = '#4a4a55'; ctx.fillRect(Math.round(top.x - w / 2), Math.round(top.y), Math.round(w), Math.round(bot.y - top.y));
    const pad = Math.max(2, 0.5 * bot.k), ph = 0.9 * bot.k;
    ctx.fillStyle = '#2a7fd4'; ctx.fillRect(Math.round(bot.x - pad / 2), Math.round(bot.y - ph), Math.round(pad), Math.round(ph));
  }
  const arm = proj(h.x, 3.4, (POLE_Z + bz) / 2);
  path3([[h.x, 3.4, POLE_Z], [h.x, 3.4, bz - 0.04]], '#111', Math.max(2, 0.16 * (arm ? arm.k : 10)) + 2);
  path3([[h.x, 3.4, POLE_Z], [h.x, 3.4, bz - 0.04]], '#4a4a55', Math.max(2, 0.16 * (arm ? arm.k : 10)));
  // the glass board with its red square
  poly([[h.x - BOARD_HW, BOARD_Y0, bz], [h.x + BOARD_HW, BOARD_Y0, bz], [h.x + BOARD_HW, BOARD_Y1, bz], [h.x - BOARD_HW, BOARD_Y1, bz]], '#111');
  const e = 0.05;

  if (state === 'title') drawTitle(t);
  else {
    if (!paused) { acc += dt; while (acc >= STEP) { step(STEP); acc -= STEP; } } else acc = 0;
    drawGame(t);
    if (paused) drawPause(); else if (state === 'over') drawOver(t);
  }
  UI.end();
  S.blit('#1a1030');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => { /* offline mode unavailable */ }));
}
PX.Pad.setup({
  title: 'Pixel Hoops: controller', ui: UI, menu: () => state !== 'play' || paused,
  phone: { stick: 'AIM', buttons: [['A', 'THROW']] },
  keys: () => ({ START: 'KeyP' }),
  onPlay: (h, n, dt, edge) => {                    // the stick aims (where to throw, further = harder), A throws
    if (n !== 0) return;
    const m = Math.hypot(h.ax, h.ay), mine = aim && aim.id === 'pad';
    if (m > 0.2 && (!aim || mine)) {
      if (!mine) aim = { id: 'pad', x0: S.W / 2, y0: H / 2, x: S.W / 2, y: H / 2 };
      const k = Math.min(1, m) / m; aim.x = aim.x0 - h.ax * k * MAX_PULL; aim.y = aim.y0 - h.ay * k * MAX_PULL;
    }
    if (edge('A') && mine) { const v = aimVelocity(); if (v && G && G.spot && !paused) shoot(v); aim = null; }
    else if (m <= 0.2 && mine) aim = null;
  },
  help: [['STICK', 'AIM: POINT WHERE TO THROW, FURTHER = HARDER'], ['A', 'THROW'], ['START', 'PAUSE'], ['STICK|D-PAD', 'MENUS: PICK A BUTTON'], ['A', 'MENUS: OK'], ['B', 'MENUS: BACK']],
});
</script>
