<script>
'use strict';
/* ==========================================================================
   PIXEL BIKE RUN: mountain biking down sunset hills (part of the PIXEL ARCADE).
   Seen from the side, in layered pixel silhouettes. The bike is a little physics model:
   two wheels and the rider (three points held together by springs), so it rolls, bounces,
   wheelies and flips for real. GAS and BRAKE ride it; LEAN BACK / LEAN FORWARD tip it,
   and in the air they spin it: land a flip and you get money. Hit your head and you crash.
     TRAILS: 8 trails with jumps, gaps, cliff drops and rollers, 3 stars each.
     FREE RIDE: an endless trail to farm money (a crash puts you back at the last checkpoint).
     RACE A FRIEND: online with a 4-letter code, the same trail, first to the bottom wins.
     BIKE SHOP: 7 bikes, and abilities (power pedals, flip spin, trick cash, nitro, second chance, magnet).
   1. Setup  2. Trails and terrain  3. The bike  4. Riding  5. Drawing  6. Screens  7. Online  8. Input  9. Loop
   ========================================================================== */

/* --- 1. SETUP --------------------------------------------------------------- */
const VERSION = '1.0.0';
const SAVE_KEY = 'pixelBikeRun.save';
const save = { money: 0, bikes: { starter: 1 }, bike: 'starter', up: {}, best: {}, stars: {}, done: {}, sfx: true, seenHelp: false, freeBest: 0, helmet: 0 };
try {
  const s = JSON.parse(localStorage.getItem(SAVE_KEY));
  if (s) { Object.assign(save, s); save.bikes = Object.assign({ starter: 1 }, s.bikes); save.up = Object.assign({}, s.up); save.best = Object.assign({}, s.best); save.stars = Object.assign({}, s.stars); save.done = Object.assign({}, s.done); save.money = s.money | 0; }
} catch (e) { /* new player */ }
const store = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* private mode */ } };
const lvl = id => save.up[id] | 0;
const profile = PX.Profile.get();
const MY_COLOR = PX.AVATAR_COLORS[profile.avatar.color];

// bikes: top pedal speed (m/s), pedal power, flip spin, grip, frame color
const BIKES = [
  { id: 'starter', name: 'TRAIL BIKE', desc: 'A GOOD ALL-ROUNDER', speed: 13, power: 6, spin: 20, grip: 1, col: '#3a7ad4', cost: 0 },
  { id: 'bmx', name: 'BMX', desc: 'SMALL AND LIGHT: FLIPS FAST', speed: 12.5, power: 7, spin: 29, grip: 1, col: '#ff6bd0', cost: 900 },
  { id: 'enduro', name: 'ENDURO', desc: 'FASTER, AND STILL FLIPS WELL', speed: 15, power: 7.5, spin: 24, grip: 1.1, col: '#5ad43f', cost: 1800 },
  { id: 'fat', name: 'FAT BIKE', desc: 'HUGE GRIP: CLIMBS ANYTHING', speed: 14, power: 9, spin: 22, grip: 1.6, col: '#ff8a2a', cost: 2600 },
  { id: 'downhill', name: 'DOWNHILL', desc: 'BUILT FOR SPEED', speed: 18, power: 8, spin: 21, grip: 1.2, col: '#e8303a', cost: 4200 },
  { id: 'rocket', name: 'ROCKET', desc: 'VERY FAST, SPINS FAST', speed: 21, power: 10, spin: 28, grip: 1.3, col: '#2ad4c4', cost: 9000 },
  { id: 'golden', name: 'GOLDEN BIKE', desc: 'THE BEST BIKE THERE IS', speed: 23, power: 11, spin: 32, grip: 1.4, col: '#ffd23f', cost: 20000 },
];
const ABILITIES = [
  { id: 'pedal', name: 'POWER PEDALS', desc: 'FASTER, AND MORE POWER UPHILL', col: '#5ad43f', max: 5, cost: [150, 350, 700, 1200, 2000] },
  { id: 'spin', name: 'FLIP SPIN', desc: 'SPIN FASTER IN THE AIR: MORE FLIPS', col: '#ff6bd0', max: 5, cost: [150, 350, 700, 1200, 2000] },
  { id: 'cash', name: 'TRICK CASH', desc: '+20% MONEY FOR EVERY TRICK', col: '#ffd23f', max: 5, cost: [200, 500, 1000, 1800, 3000] },
  { id: 'nitro', name: 'NITRO', desc: 'A BOOST BUTTON (PER LEVEL, EACH RUN)', col: '#ff5ad0', max: 3, cost: [300, 800, 1600] },
  { id: 'revive', name: 'SECOND CHANCE', desc: 'CRASH ON A TRAIL AND KEEP GOING (PER LEVEL)', col: '#e8303a', max: 2, cost: [600, 1500] },
  { id: 'magnet', name: 'MONEY MAGNET', desc: 'GRAB MONEY FROM FURTHER AWAY', col: '#4aa8ff', max: 3, cost: [150, 400, 900] },
];
const bikeOf = id => BIKES.find(b => b.id === id) || BIKES[0];

const canvas = document.getElementById('screen');
const S = PX.makeScreen(canvas, { H: 240, minW: 400, maxW: 560 });
const ctx = S.ctx, H = S.H;
const UI = PX.makeUI(S, canvas);
const T = (str, x, y, color = '#fff', size = 1, align = 'left', shadow = null) => PX.drawText(ctx, str, x, y, color, size, align, shadow);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, k) => a + (b - a) * k;
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hex(c) { const n = parseInt(c.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
const mixCache = new Map();
function mix(a, b, k) {
  k = Math.round(clamp(k, 0, 1) * 32) / 32;
  const key = a + b + k; let c = mixCache.get(key);
  if (!c) { const x = hex(a), y = hex(b); c = '#' + x.map((v, i) => clamp(Math.round(v + (y[i] - v) * k), 0, 255).toString(16).padStart(2, '0')).join(''); mixCache.set(key, c); }
  return c;
}
function shade(c, k) { return '#' + hex(c).map(v => clamp(Math.round(v * k), 0, 255).toString(16).padStart(2, '0')).join(''); }
const fmtTime = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(Math.floor(s % 60)).padStart(2, '0') + '.' + String(Math.floor(s * 100 % 100)).padStart(2, '0');
const fmtMoney = n => '$' + Math.floor(n).toLocaleString('en-US');

/* --- 2. TRAILS AND TERRAIN --------------------------------------------------- */
// each trail: a look (sky, sun, four mountain layers far to near, the ground) and how hard it is
const THEMES = [
  { name: 'SUNSET HILLS', sky: ['#5a4a7a', '#b07a9a', '#f0b08a'], sun: '#fff0c8', layers: ['#a8809c', '#86688c', '#634e76', '#40345a'], ground: '#231b33', grass: '#3a2e52' },
  { name: 'MISTY PINES', sky: ['#7a90ac', '#b8c8d8', '#e0e8ee'], sun: '#ffffff', layers: ['#b0bece', '#8a9cb2', '#647892', '#425470'], ground: '#1c2634', grass: '#2e3c50' },
  { name: 'GOLDEN MEADOW', sky: ['#e09a50', '#f4c878', '#fff0c0'], sun: '#fffbe0', layers: ['#d8a868', '#b48450', '#8a6040', '#5c4230'], ground: '#2e2018', grass: '#4a3626' },
  { name: 'AUTUMN RIDGE', sky: ['#a0405a', '#e07a5a', '#f8c890'], sun: '#ffe8a0', layers: ['#c47860', '#9c5448', '#743c3a', '#4c2a2e'], ground: '#24141a', grass: '#40242a' },
  { name: 'NIGHT MOUNTAIN', sky: ['#05060f', '#141a3a', '#2a3060'], moon: true, stars: true, layers: ['#2a3062', '#20264e', '#181c3c', '#10132a'], ground: '#070816', grass: '#141836' },
  { name: 'SNOW PEAK', sky: ['#3a6ab8', '#7aaee0', '#d0e6f8'], sun: '#ffffff', layers: ['#e8f0f8', '#bccde0', '#8ea8c4', '#5e7698'], ground: '#1e2a40', grass: '#e8f0ff', snow: true },
  { name: 'VOLCANO', sky: ['#200608', '#6a1a14', '#d0502a'], sun: '#ffb070', layers: ['#7a2c22', '#5a1e1a', '#401416', '#28090c'], ground: '#120305', grass: '#ff6a1a', lava: true },
  { name: 'AURORA', sky: ['#02040e', '#081830', '#0e3040'], stars: true, aurora: true, layers: ['#16324c', '#10283e', '#0c1e30', '#081422'], ground: '#03080f', grass: '#0e2a3a' },
];
const TRAILS = THEMES.map((th, i) => ({ id: 't' + i, theme: i, name: th.name, len: 600 + i * 110, d: i / 7, seed: 77 + i * 131 }));
const trailOpen = i => i === 0 || !!save.done[TRAILS[i - 1].id];

// the terrain: heights every half metre, built from features (slopes, kickers, gaps, drops, rollers, climbs)
const STEP = 0.5;
function makeTrack(seed, d, len, endless) {
  const k = { h: [], rnd: mulberry(seed), d, y: 0, len, endless, coins: [], trees: [], cps: [], gaps: [], themeAt: null };
  const push = y => { k.h.push(y); k.y = y; };
  const xEnd = () => k.h.length * STEP;
  const seg = (L, f) => { const y0 = k.y, n = Math.max(1, Math.round(L / STEP)); for (let i = 1; i <= n; i++) push(y0 + f(i / n)); };
  const coinArc = (x0, y0, x1, y1, n, hgt) => { for (let i = 0; i < n; i++) { const u = (i + 0.5) / n; k.coins.push({ x: lerp(x0, x1, u), y: lerp(y0, y1, u) + Math.sin(u * Math.PI) * hgt, got: false }); } };
  push(0); seg(24, u => -u * 2);                                        // the start: a gentle roll-in
  k.feature = () => {
    const r = k.rnd(), dd = k.d;
    const slopeL = 14 + k.rnd() * 22, drop = slopeL * (0.14 + k.rnd() * 0.18), amp = k.rnd() < 0.5 ? 0.25 + k.rnd() * (0.4 + dd * 0.6) : 0, wl = 6 + k.rnd() * 6;
    seg(slopeL, u => -drop * u + amp * Math.sin(u * slopeL / wl * Math.PI * 2) * Math.sin(u * Math.PI));   // a downhill to get speed, maybe with rollers
    if (r < 0.3) {                                                    // a KICKER: a ramp that throws you up
      const rise = 1.2 + k.rnd() * (1.2 + dd), L = 4 + k.rnd() * 2, x0 = xEnd(), y0 = k.y;
      seg(L, u => rise * Math.pow(u, 1.7));
      const lip = k.y; seg(2, u => -u * 2.5); seg(10, u => -u * 4);
      coinArc(x0 + L, lip + 1.5, x0 + L + 12, lip - 1, 5, 2.5 + rise);
    } else if (r < 0.3 + 0.2 + dd * 0.15 && xEnd() > 90) {            // a GAP: fly over the hole (or fall in it)
      const rise = 1.6 + k.rnd() * 1.2, L = 5, G = 4 + dd * 5 + k.rnd() * 2;
      seg(20, u => -u * 5.5);                                         // a fast run-in, so there's always the speed to make it
      seg(L, u => rise * Math.pow(u, 1.6));
      const lip = k.y, gx0 = xEnd();
      for (let q = 0; q < Math.round(G / STEP); q++) push(lip - 24);
      k.gaps.push([gx0, xEnd(), lip]);
      k.y = lip - 1.5 - dd * 2; seg(0.5, () => 0); seg(12, u => -u * 4.5);
      coinArc(gx0, lip + 2, xEnd() - 10, lip, 6, 3.5);
    } else if (r < 0.65 + dd * 0.1) {                                 // a DROP: off a ledge onto a steep landing
      seg(4, u => -u * 0.3);
      const hd = 2.5 + k.rnd() * (2 + dd * 4); k.y -= hd; seg(0.5, () => 0); seg(10, u => -u * 4.5);
    } else if (r < 0.8) {                                             // a TABLE: up, a flat top, down
      const rise = 1.5 + k.rnd() * 1.5; seg(5, u => rise * Math.pow(u, 1.5)); seg(5 + k.rnd() * 4, () => 0); seg(6, u => -rise * 1.6 * u);
    } else if (dd > 0.25) {                                           // a CLIMB: pedal up
      const L = 10 + k.rnd() * 8, rise = L * (0.12 + dd * 0.08); seg(L, u => rise * (u - 0.5 * Math.sin(u * Math.PI) * 0.2)); seg(6, u => -u * 1.5);
    } else seg(12, u => -u * 2 + 0.5 * Math.sin(u * Math.PI * 3));
  };
  k.extend = toX => {
    while (xEnd() < toX) {
      const x = xEnd();
      if (!k.endless && x > len) { seg(60, u => -u * 1); break; }    // the finish area
      if (k.cps.length === 0 || x - k.cps[k.cps.length - 1] > 110) k.cps.push(x);
      k.feature();
      // trees beside the trail, and a few on the way (only where there's ground)
      for (let t = x; t < xEnd(); t += 3 + k.rnd() * 9) if (k.rnd() < 0.55 && !k.gaps.some(([a, b]) => t > a - 2 && t < b + 2)) k.trees.push({ x: t, s: 0.7 + k.rnd() * 0.8, f: k.rnd() < 0.22 });
    }
  };
  k.extend(endless ? 400 : len + 70);
  k.finishX = endless ? Infinity : len;
  return k;
}
function ground(k, x) {
  const f = x / STEP, i = Math.floor(f);
  if (i < 0) return k.h[0] - i * STEP * 0.1;
  if (i >= k.h.length - 1) return k.h[k.h.length - 1];
  return lerp(k.h[i], k.h[i + 1], f - i);
}

/* --- 3. THE BIKE: two wheels and the rider, three points held together by springs ----------------- */
const WR = 0.36, WB = 1.1, HEAD = 0.3;
const REST = { rh: Math.hypot(0.42, 1.28), fh: Math.hypot(0.68, 1.28) };
function makeBike(x, k, col) {
  // the wheels just on the ground, the rider exactly where the springs want them (so nothing jumps at the start)
  const y = ground(k, x) + WR, y2 = ground(k, x + WB) + WR, a = Math.atan2(y2 - y, WB), ax = Math.cos(a), ay = Math.sin(a);
  const p = [{ x, y }, { x: x + ax * WB, y: y + ay * WB }, { x: x + ax * 0.42 - ay * 1.28, y: y + ay * 0.42 + ax * 1.28 }];
  return { p, pp: p.map(q => ({ ...q })), contact: [false, false], col, crashed: false, rot: 0, air: 0, wheel: 0, crank: 0, lastA: 0, rag: null, airRot: 0, wheelieT: 0, landT: [0, 0] };
}
const bAngle = b => Math.atan2(b.p[1].y - b.p[0].y, b.p[1].x - b.p[0].x);
const bVel = (b, dt) => ({ x: ((b.p[0].x - b.pp[0].x) + (b.p[1].x - b.pp[1].x)) / 2 / dt, y: ((b.p[0].y - b.pp[0].y) + (b.p[1].y - b.pp[1].y)) / 2 / dt });
// a circle (a wheel, the head) against the ground: the nearest point of the trail's line, the push-out and its normal
function dig(k, q, r) {
  const gy = ground(k, q.x);
  if (q.y < gy) {                                                       // under the surface: straight out along the slope's normal
    const s = (ground(k, q.x + 0.25) - ground(k, q.x - 0.25)) / 0.5, n = Math.hypot(s, 1);
    return { pen: r + (gy - q.y) / n, nx: -s / n, ny: 1 / n };
  }
  let best = null;
  const i0 = Math.max(0, Math.floor((q.x - r) / STEP) - 1), i1 = Math.min(k.h.length - 2, Math.floor((q.x + r) / STEP) + 1);
  for (let i = i0; i <= i1; i++) {
    const ax = i * STEP, ay = k.h[i], bx = ax + STEP, by = k.h[i + 1], dx = bx - ax, dy = by - ay;
    const u = clamp(((q.x - ax) * dx + (q.y - ay) * dy) / (dx * dx + dy * dy), 0, 1), cx = ax + dx * u, cy = ay + dy * u;
    const ex = q.x - cx, ey = q.y - cy, d = Math.hypot(ex, ey);
    if (d < r + 0.03 && d > 1e-6 && (!best || d < best.d)) best = { d, pen: Math.max(0, r - d), nx: ex / d, ny: ey / d };
  }
  return best;
}
function bikeStep(b, k, dt, c, stats) {
  const g = 9.8;
  // move (Verlet), with a little air drag
  for (let i = 0; i < 3; i++) {
    const q = b.p[i], o = b.pp[i], vx = (q.x - o.x) * 0.9993, vy = (q.y - o.y) * 0.9993;
    o.x = q.x; o.y = q.y; q.x += vx; q.y += vy - g * dt * dt;
  }
  const R = b.p[0], F = b.p[1], Hh = b.p[2];
  let ax = F.x - R.x, ay = F.y - R.y; const al = Math.hypot(ax, ay) || 1; ax /= al; ay /= al;
  const px = -ay, py = ax;                                             // "up" for the bike
  b.offT = b.contact[0] || b.contact[1] ? 0 : (b.offT || 0) + dt;
  const air = b.offT > 0.2;                                           // really flying (not a little bounce)
  if (!b.crashed && c) {
    // lean: tips the bike (and spins it in the air), and the rider shifts their weight
    const vRel = ((F.x - b.pp[1].x) - (R.x - b.pp[0].x)) * px + ((F.y - b.pp[1].y) - (R.y - b.pp[0].y)) * py;
    const omega = vRel / dt / WB, maxW = air ? stats.spinMax : 3;
    let want = -c.lean;                                                // lean back = nose up = turn counterclockwise
    // on the ground with no lean, the bike settles level with the slope by itself (no surprise front flips)
    if (!want && !air) {
      const xm = (R.x + F.x) / 2, slope = Math.atan2(ground(k, xm + 0.6) - ground(k, xm - 0.6), 1.2);
      let e = Math.atan2(ay, ax) - slope; if (e > Math.PI) e -= Math.PI * 2; if (e < -Math.PI) e += Math.PI * 2;
      want = clamp(-e * 3 - omega * 0.6, -1, 1) * 0.8;
    }
    // a wheelie holds at its balance point (about 55 degrees) instead of looping out
    if (!air && want > 0) {
      const xm = (R.x + F.x) / 2, slope = Math.atan2(ground(k, xm + 0.6) - ground(k, xm - 0.6), 1.2);
      let rel = Math.atan2(ay, ax) - slope; if (rel > Math.PI) rel -= Math.PI * 2; if (rel < -Math.PI) rel += Math.PI * 2;
      if (rel > 0.85) want = clamp((0.95 - rel) * 4 - omega * 0.5, -1, 1);
    }
    if (want && !(Math.sign(omega) === Math.sign(want) && Math.abs(omega) > maxW)) {
      const tq = want * (air ? stats.spin : 13) * dt * dt;
      F.x += px * tq; F.y += py * tq; R.x -= px * tq; R.y -= py * tq;
    }
    if (c.lean) { const sh = c.lean * 2.2 * dt * dt; Hh.x += ax * sh; Hh.y += ay * sh; }
  }
  // springs: the frame is stiff, the rider is springy (that's the suspension)
  const link = (a, b2, L, st, wa, wb) => {
    const dx = b2.x - a.x, dy = b2.y - a.y, d = Math.hypot(dx, dy) || 1e-6, e = (d - L) / d * st;
    a.x += dx * e * wa; a.y += dy * e * wa; b2.x -= dx * e * wb; b2.y -= dy * e * wb;
  };
  for (let it = 0; it < 5; it++) {
    link(R, F, WB, 1, 0.5, 0.5);
    if (!b.crashed) { link(R, Hh, REST.rh, 0.5, 0.3, 0.7); link(F, Hh, REST.fh, 0.5, 0.3, 0.7); }
  }
  // the wheels on the ground: push out, bounce a little, roll; GAS on the back wheel, BRAKE on both
  b.contact = [false, false];
  for (let i = 0; i < 2; i++) {
    const q = b.p[i], o = b.pp[i], hit = dig(k, q, WR);
    if (!hit) continue;
    b.contact[i] = true;
    let vx = q.x - o.x, vy = q.y - o.y;                                // the speed before the push-out
    q.x += hit.nx * hit.pen; q.y += hit.ny * hit.pen;
    const tx = hit.ny, ty = -hit.nx;                                   // along the slope, forwards
    let vn = vx * hit.nx + vy * hit.ny, vt = vx * tx + vy * ty;
    if (vn < 0) vn = -vn * 0.08;
    vt *= 1 - 0.15 * dt;                                               // rolling
    if (c && !b.crashed) {
      if (c.brake) vt *= 1 - 3.5 * dt;
      if (i === 0) b.drive = { tx, ty, vt: vt / dt };
    }
    o.x = q.x - (hit.nx * vn + tx * vt); o.y = q.y - (hit.ny * vn + ty * vt);
  }
  if (c && !b.crashed && b.contact[0] && b.drive) {
    const d = b.drive, acc = (c.gas && d.vt < stats.top ? stats.power * stats.grip : 0) + (c.nitro ? 12 : 0);
    if (acc) for (const q of b.p) { q.x += d.tx * acc * dt * dt; q.y += d.ty * acc * dt * dt; }
  }
  b.drive = null;
  // the head on the ground (or falling into a gap): a crash
  if (!b.crashed) {
    const hh = dig(k, Hh, HEAD);
    if (hh || Hh.y < ground(k, Hh.x) - 1) return 'crash';
    if (R.y < ground(k, R.x) - 6 && F.y < ground(k, F.x) - 6) return 'fell';
  } else {
    const hh = dig(k, Hh, HEAD); if (hh) { Hh.x += hh.nx * hh.pen; Hh.y += hh.ny * hh.pen; }
  }
  // the wheels turn as you go, the cranks turn when you pedal
  const v = (R.x - b.pp[0].x) * ax + (R.y - b.pp[0].y) * ay;
  b.wheel += v / WR; if (c && c.gas && !b.crashed) b.crank += 10 * dt;
  return null;

/* --- 4. RIDING -------------------------------------------------------------------- */

  ctx.fillStyle = 'rgba(13,11,19,0.45)'; ctx.fillRect(0, 0, W, H);
  glass(x - 4, y - 4, pw + 8, 162, ok ? '#5ad43f' : '#e8303a');
  if (G.mp) {
    T(G.won ? 'YOU WIN!' : (Net.friend ? Net.friend.name : 'FRIEND') + ' WINS!', W / 2, y + 12, G.won ? '#ffd23f' : '#ff8a8a', 3, 'center', '#000');
    T(fmtTime(G.t), W / 2, y + 44, '#fff', 2, 'center'); T('MONEY +' + fmtMoney(G.money) + (G.won ? '   ★ +2' : ''), W / 2, y + 66, '#5ad43f', 1, 'center');
    if (Net.live && Net.isHost) {
      const hw = Math.floor((pw - 34) / 2);
      if (UI.button('rematch', x + 14, y + 100, hw, 20, 'REMATCH', { size: 1, accent: '#5ad43f' })) Net.start(trailIdx);
      if (UI.button('other', x + 20 + hw, y + 100, hw, 20, 'OTHER TRAIL', { size: 1, accent: '#ffd23f' })) { Net.send({ t: 'lobby' }); state = 'online'; Net.screen = 'lobby'; }
    } else if (Net.live) T('THE HOST PICKS WHAT\'S NEXT', W / 2, y + 106, '#9a92b8', 1, 'center'); else T('YOUR FRIEND LEFT', W / 2, y + 106, '#ff8a8a', 1, 'center');
    if (UI.button('leave', x + 14, y + 128, pw - 28, 18, 'LEAVE', { size: 1 }) || UI.back) { Net.leave(); Net.reset(); toTitle(); }
    return;
  }
  if (ok) {
    G.endT = G.endT || 0;
    T('FINISHED!', W / 2, y + 6, '#5ad43f', 2, 'center', '#000');
    const lab = ['FINISH', 'TRICKS ' + fmtMoney(cashGoal(trailIdx)), 'PAR ' + fmtTime(parTime(trailIdx)).slice(0, 5)];
    for (let q = 0; q < 3; q++) {
      const cx = W / 2 - 90 + q * 90, on = !!(G.stars & (1 << q)), shown = G.endT > 0.35 + q * 0.35, a = G.endT - 0.35 - q * 0.35;
      if (on && shown && !(G.starSnd & (1 << q))) { G.starSnd = (G.starSnd | 0) | (1 << q); sfx('star'); }
      PX.drawIcon(ctx, ['....#....', '...###...', '#########', '.#######.', '..#####..', '.###.###.', '##.....##'], { '#': on && shown ? '#ffd23f' : '#3a2f5c' }, cx, y + 32, on && shown && a < 0.12 ? 3 : 2, '#111');
      T(lab[q], cx, y + 44, on ? '#fff' : '#9a92b8', 1, 'center');
    }
    T(fmtTime(G.t) + (G.newBest ? '  NEW BEST!' : ''), W / 2, y + 58, '#ffd23f', 2, 'center', '#000');
    const cnt = Math.min(G.money, Math.floor(Math.max(0, G.endT - 1.3) * 1500));
    T('TRICKS ' + fmtMoney(G.earned) + '  +  FINISH ' + fmtMoney(G.bonus) + '  =  ' + fmtMoney(cnt), W / 2, y + 76, '#5ad43f', 1, 'center');
    T('FLIPS ' + G.flipsTotal + '   BEST TRICK ' + fmtMoney(G.bestTrick) + (G.newStars ? '   ★ +' + G.newStars : ''), W / 2, y + 87, '#fff', 1, 'center');
    const nx = nextTrail();
    if (nx !== null && UI.button('next', x + 14, y + 100, pw - 28, 22, 'NEXT TRAIL', { accent: '#5ad43f' })) startRide('trail', nx);
    if (nx === null) T('YOU RODE EVERY TRAIL!', W / 2, y + 108, '#ffd23f', 1, 'center');
  } else {
    T('CRASH!', W / 2, y + 8, '#e8303a', 4, 'center', '#000');
    T(G.cause, W / 2, y + 40, '#fff', 1, 'center');
    T(Math.round(clamp(G.maxX / G.k.finishX, 0, 1) * 100) + '% OF THE TRAIL', W / 2, y + 54, '#9a92b8', 1, 'center');
    T('YOU KEEP YOUR ' + fmtMoney(G.money), W / 2, y + 68, '#5ad43f', 1, 'center');
    T(!lvl('revive') ? 'TIP: SECOND CHANCE IN THE SHOP LETS YOU KEEP GOING' : 'TIP: LAND WITH BOTH WHEELS, LEVEL WITH THE SLOPE', W / 2, y + 82, '#9a92b8', 1, 'center');
    if (UI.button('retry', x + 14, y + 100, pw - 28, 22, 'TRY AGAIN', { accent: '#ffd23f' })) startRide(mode, trailIdx);
  }
  const hw = Math.floor((pw - 34) / 2);
  if (UI.button('shop2', x + 14, y + 128, hw, 18, 'BIKE SHOP', { size: 1, accent: '#ff6bd0' })) { toTitle(); state = 'shop'; }
  if (UI.button('menu', x + 20 + hw, y + 128, hw, 18, 'TRAILS', { size: 1 }) || UI.back) { toTitle(); state = 'trails'; }
}
function toTitle() { state = 'title'; paused = false; codeInput.style.display = 'none'; save.seenHelp = save.seenHelp || (G && G.t > 6); store(); demo = null; }

// the title and the menus show a rider going down a trail by themselves
let demo = null;
function autopilot(b, k) {
  const a = bAngle(b), mx = (b.p[0].x + b.p[1].x) / 2, air = !b.contact[0] && !b.contact[1];
  const v = bVel(b, 1 / 240), look = mx + (air ? v.x * 0.5 : 2);
  const slope = Math.atan2(ground(k, look + 1) - ground(k, look - 1), 2);
  const err = a - slope;
  return { lean: clamp(err * (air ? 2.5 : 1.6), -1, 1), gas: v.x < 16, brake: v.x > 19, nitro: false };
}
function demoWorld(t, dt) {
  if (!demo) { const k = makeTrack(4242, 0.15, 0, true); demo = { k }; G = { k, theme: Math.floor(Date.now() / 600000) % THEMES.length, b: makeBike(4, k, '#3a7ad4'), parts: [], pops: [], camX: 4, camY: 0, zoom: 15, mp: false, t: 0 }; }
  const k = demo.k, b = G.b;
  k.extend(b.p[0].x + 200);
  for (let s = 0; s < 4; s++) { const r = bikeStep(b, k, dt / 4, autopilot(b, k), stats()); if (r) { G.b = makeBike(Math.max(4, ...k.cps.filter(c => c < b.p[0].x - 2)), k, '#3a7ad4'); break; } }
  drawWorld(t, dt);
}

/* --- sound --- */
function sfx(n) {
  if (!save.sfx) return;
  const s = PX.Sound;
  if (n === 'click') s.tone([523, 784], 0.12, { vol: 0.1 });
  else if (n === 'beep') s.tone(440, 0.15, { vol: 0.1 });
  else if (n === 'go') s.tone(880, 0.4, { vol: 0.12 });
  else if (n === 'land') s.noise(0.12, { freq: 380, vol: 0.18 });
  else if (n === 'trick') s.tone([660, 880, 1320], 0.3, { vol: 0.08 });
  else if (n === 'cash') s.tone([1200, 1600], 0.08, { vol: 0.05 });
  else if (n === 'coin') s.tone([988, 1319], 0.07, { vol: 0.04 });
  else if (n === 'crash') { s.noise(0.45, { freq: 350, vol: 0.3 }); s.tone([300, 80], 0.35, { vol: 0.08, type: 'sawtooth' }); }
  else if (n === 'nitro') { s.tone([200, 800], 0.5, { vol: 0.07, type: 'sawtooth' }); s.noise(0.5, { freq: 1500, vol: 0.08, filter: 'bandpass' }); }
  else if (n === 'saved') s.tone([1200, 600, 1200], 0.4, { vol: 0.09, type: 'triangle' });
  else if (n === 'star') s.tone([784, 1047, 1568], 0.4, { vol: 0.1 });
  else if (n === 'buy') s.tone([523, 659, 784, 1047], 0.35, { vol: 0.1 });
  else if (n === 'finish') s.tone([523, 659, 784, 1047, 1319], 0.8, { vol: 0.1 });
}

/* --- 7. RACE A FRIEND: online, the same free PeerJS server as the other games --------------- */
// You both ride the same trail (built the same on both phones). Each phone runs its own bike and sends
// where it is 20 times a second; you see your friend as a ghost. A crash puts you back at the last checkpoint.
const FR = { seen: false, p: null, fin: 0, out: false, x: 0 };
const codeInput = document.getElementById('code');
codeInput.addEventListener('input', () => { codeInput.value = codeInput.value.toUpperCase().split('').filter(c => PX.CODE_CHARS.includes(c)).join('').slice(0, 4); });
const Net = {
  peer: null, conn: null, live: false, isHost: false, code: '', screen: 'pick', msg: '', friend: null, sendT: 0, pick: 0,
  reset() { try { if (this.peer) this.peer.destroy(); } catch (e) { /* gone */ } this.peer = null; this.conn = null; this.live = false; this.code = ''; this.friend = null; this.screen = 'pick'; this.msg = ''; },
  fail(msg) { this.reset(); this.screen = 'error'; this.msg = msg; },
  opts() { return { debug: 0, config: { iceServers: PX.ICE_SERVERS } }; },
  async host() {
    this.reset(); this.isHost = true; this.screen = 'connecting'; this.msg = 'CREATING A GAME';
    try { await PX.loadPeer(); } catch (e) { return this.fail("COULDN'T LOAD ONLINE PLAY. CHECK YOUR INTERNET."); }
    const open = attempt => {
      let code = ''; for (let i = 0; i < 4; i++) code += PX.CODE_CHARS[Math.floor(Math.random() * PX.CODE_CHARS.length)];
      const peer = new Peer('pixel-bike-room-' + code, this.opts()); this.peer = peer;
      peer.on('open', () => { this.code = code; this.screen = 'hosting'; this.msg = ''; });
      peer.on('connection', c => { if (this.live) { c.close(); return; } this.bind(c); });
      peer.on('disconnected', () => { if (this.peer === peer && !peer.destroyed) peer.reconnect(); });
      peer.on('error', e => { if (e.type === 'unavailable-id' && attempt < 3) { peer.destroy(); open(attempt + 1); } else if (!this.live && e.type !== 'network') this.fail("CAN'T REACH THE GAME SERVER. CHECK YOUR INTERNET."); });
    };
    open(0);
  },
  async join(code) {
    this.reset(); this.isHost = false; this.screen = 'connecting'; this.msg = 'CONNECTING TO ' + code;
    try { await PX.loadPeer(); } catch (e) { return this.fail("COULDN'T LOAD ONLINE PLAY. CHECK YOUR INTERNET."); }
    const peer = new Peer(this.opts()); this.peer = peer;
    peer.on('open', () => this.bind(peer.connect('pixel-bike-room-' + code, { reliable: true, serialization: 'json' })));
    peer.on('error', e => { if (!this.live) this.fail(e && e.type === 'peer-unavailable' ? 'NO GAME WITH THAT CODE.' : "COULDN'T CONNECT. TRY AGAIN."); });
    setTimeout(() => { if (!this.live && this.screen === 'connecting') this.fail("COULDN'T REACH YOUR FRIEND'S PHONE. TRY THE SAME WI-FI."); }, 25000);
  },
  joinTyped() { if (codeInput.value.length === 4) { codeInput.blur(); this.join(codeInput.value); } },
  bind(c) {
    this.conn = c;
    c.on('open', () => { this.live = true; this.screen = 'lobby'; this.send({ t: 'me', name: profile.name, av: profile.avatar, color: bikeOf(save.bike).col, v: VERSION }); sfx('click'); });
    c.on('data', m => this.onData(m));
    c.on('close', () => this.lost());
  },
  lost() { if (!this.live) return; this.live = false; this.conn = null; if (state === 'online') { this.screen = 'error'; this.msg = 'YOUR FRIEND LEFT.'; } },
  leave() { this.send({ t: 'bye' }); this.live = false; const p = this.peer; this.peer = null; this.conn = null; setTimeout(() => { try { if (p) p.destroy(); } catch (e) { /* gone */ } }, 150); },
  send(m) { if (this.conn && this.conn.open) try { this.conn.send(m); } catch (e) { /* closing */ } },
  sendPos() {
    const now = performance.now(); if (now - this.sendT < 50) return; this.sendT = now;
    const r = v => Math.round(v * 100) / 100;
    this.send({ t: 'p', q: G.b.p.flatMap(p => [r(p.x), r(p.y)]), c: G.b.crashed ? 1 : 0 });
  },
  start(i) { this.pick = i; this.send({ t: 'go', i }); startRide('trail', i, true); },
  onData(m) {
    if (!m || typeof m !== 'object') return;
    switch (m.t) {
      case 'me':
        if (m.v !== VERSION) { this.fail('YOUR FRIEND HAS V' + m.v + ', YOU HAVE V' + VERSION + '. RELOAD BOTH.'); break; }
        this.friend = { name: PX.cleanName(m.name) || 'FRIEND', av: m.av, color: /^#[0-9a-f]{6}$/i.test(m.color) ? m.color : '#4aa8ff' };
        break;
      case 'go': if (TRAILS[m.i]) { this.pick = m.i; startRide('trail', m.i, true); } break;
      case 'lobby': if (state !== 'play' || (G && G.done)) { state = 'online'; this.screen = 'lobby'; } break;
      case 'p': {
        if (!G || !G.mp || !Array.isArray(m.q) || m.q.length !== 6) break;
        const q = m.q.map(v => +v || 0);
        FR.p = [{ x: q[0], y: q[1] }, { x: q[2], y: q[3] }, { x: q[4], y: q[5] }]; FR.x = (q[0] + q[2]) / 2; FR.seen = true; FR.out = !!m.c;
        break;
      }
      case 'fin': FR.fin = +m.tm || 1; break;
      case 'bye': this.lost(); break;
    }
  },
};
function onlineScreen(t) {
  const W = S.W, bw = 200, bx = Math.round(W / 2 - bw / 2), dots = '.'.repeat(1 + Math.floor(performance.now() / 333) % 3);
  const pw = Math.min(W - 16, 340), y = 30, cx = W / 2;
  ctx.fillStyle = 'rgba(13,11,19,0.55)'; ctx.fillRect(0, 0, W, H);
  glass(Math.round(cx - pw / 2), y, pw, 188, '#4aa8ff');
  const back = (yy, label = 'BACK') => { if (UI.button('nback', bx, yy, bw, 20, label, { size: 1 }) || UI.back) { if (Net.live || Net.peer) Net.leave(); Net.reset(); toTitle(); } };
  if (Net.screen !== 'join') codeInput.style.display = 'none';
  switch (Net.screen) {
    case 'pick':
      T('RACE A FRIEND ONLINE', cx, y + 12, '#4aa8ff', 2, 'center', '#000');
      T('THE SAME TRAIL. FIRST TO THE FINISH WINS!', cx, y + 32, '#9a92b8', 1, 'center');
      T('A CRASH PUTS YOU BACK AT THE LAST CHECKPOINT.', cx, y + 42, '#9a92b8', 1, 'center');
      if (UI.button('create', bx, y + 60, bw, 26, 'CREATE GAME', { accent: '#4aa8ff' })) Net.host();
      if (UI.button('join', bx, y + 94, bw, 26, 'JOIN WITH A CODE', { accent: '#5ad43f' })) { Net.screen = 'join'; codeInput.value = ''; }
      back(y + 156);
      break;
    case 'hosting':
      T('YOUR GAME CODE', cx, y + 12, '#efe9ff', 1, 'center');
      T(Net.code, cx, y + 30, '#ffd23f', 7, 'center', '#000');
      T('YOUR FRIEND: PIXEL BIKE RUN > RACE A FRIEND > JOIN', cx, y + 80, '#efe9ff', 1, 'center');
      T('WAITING' + dots, cx, y + 100, '#fff', 1, 'center');
      back(y + 156, 'CANCEL');
      break;
    case 'join':
      T("TYPE YOUR FRIEND'S CODE", cx, y + 12, '#fff', 2, 'center');
      S.placeInput(codeInput, cx - 70, y + 38, 140, 36);
      if (UI.button('dojoin', bx, y + 90, bw, 24, 'JOIN', { disabled: codeInput.value.length !== 4, accent: '#5ad43f' })) Net.joinTyped();
      back(y + 156);
      break;
    case 'connecting':
      T(Net.msg + dots, cx, y + 80, '#fff', 1, 'center');
      back(y + 156, 'CANCEL');
      break;
    case 'lobby': {
      T('CONNECTED!', cx, y + 8, '#5ad43f', 2, 'center');
      PX.drawAvatar(ctx, profile.avatar, cx - 96, y + 24, 2); T(profile.name, cx - 82, y + 56, '#fff', 1, 'center');
      T('VS', cx, y + 34, '#ff8a2a', 3, 'center');
      const f = Net.friend;
      if (f) { PX.drawAvatar(ctx, f.av, cx + 68, y + 24, 2); T(f.name, cx + 82, y + 56, '#fff', 1, 'center'); }
      if (Net.isHost) {
        T('PICK THE TRAIL (ALL OPEN ONLINE):', cx, y + 72, '#efe9ff', 1, 'center');
        if (UI.button('tprev', cx - 130, y + 86, 24, 22, '<', { size: 2 })) Net.pick = (Net.pick + TRAILS.length - 1) % TRAILS.length;
        if (UI.button('tnext', cx + 106, y + 86, 24, 22, '>', { size: 2 })) Net.pick = (Net.pick + 1) % TRAILS.length;
        T((Net.pick + 1) + '. ' + TRAILS[Net.pick].name, cx, y + 93, '#ffd23f', 1, 'center', '#000');
        if (UI.button('mpgo', cx - 70, y + 116, 140, 24, 'RACE!', { accent: '#5ad43f', disabled: !f })) Net.start(Net.pick);
      } else T('WAITING FOR ' + (f ? f.name : 'THE HOST') + ' TO PICK A TRAIL' + dots, cx, y + 104, '#efe9ff', 1, 'center');
      back(y + 156, 'LEAVE');
      break;
    }
    case 'error':
      T(Net.msg, cx, y + 70, '#ff6b6b', 1, 'center');
      back(y + 156, 'OK');
      break;
  }
}

/* --- 8. INPUT: buttons on a touch screen, keys, a controller ------------------------------ */
UI.onDown = (e, x, y) => {
  PX.Sound.unlock();
  if (e.pointerType === 'touch') touchUI = true;
  if (state !== 'play' || !G || G.done) return;
  if (!G.mp && x < 32 && y < 32) { paused = !paused; return; }
  if (paused) return;
  const B = buttons();
  if (lvl('nitro') && Math.hypot(x - B.nitro.x, y - B.nitro.y) < B.nitro.r + 4) { useNitro(); return; }
  // the nearest button within reach (generous, for thumbs)
  let best = null, bd = 1e9;
  for (const id of ['back', 'fwd', 'brake', 'gas']) { const b = B[id], d = Math.hypot(x - b.x, y - b.y); if (d < b.r + 18 && d < bd) { bd = d; best = id; } }
  if (!best) best = x < S.W / 2 ? (x < 56 ? 'back' : 'fwd') : 'gas';         // anywhere else: the closest side's job
  inp.touch.set(e.pointerId, best);
};
UI.onMove = (e, x, y) => {
  if (!inp.touch.has(e.pointerId) || state !== 'play') return;
  const B = buttons(), cur = inp.touch.get(e.pointerId);
  // slide your thumb from one button to the next
  for (const id of ['back', 'fwd', 'brake', 'gas']) { const b = B[id]; if (Math.hypot(x - b.x, y - b.y) < b.r + 4 && id !== cur) inp.touch.set(e.pointerId, id); }
};
UI.onUp = e => inp.touch.delete(e.pointerId);
const KEYMAP = { ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r', ArrowUp: 'u', KeyW: 'u', ArrowDown: 'd', KeyS: 'd' };
window.addEventListener('keydown', e => {
  PX.Sound.unlock();
  if (e.target === codeInput) { if (e.code === 'Enter') Net.joinTyped(); else if (e.code === 'Escape') { codeInput.blur(); UI.back = true; } return; }
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
  if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'play' && G && !G.done && !G.mp) { paused = !paused; return; }
  if (e.code === 'Escape') { UI.back = true; return; }
  if (KEYMAP[e.code]) { inp.keys[KEYMAP[e.code]] = true; touchUI = false; }
  if ((e.code === 'Space' || e.code === 'KeyN' || e.code === 'ShiftLeft') && state === 'play' && !e.repeat) { useNitro(); touchUI = false; }
  if (e.code === 'Enter' && (state === 'finished' || (state === 'crashed' && G.crashT > 0.9)) && !G.mp) { const nx = state === 'finished' ? nextTrail() : null; startRide(mode, nx !== null && nx !== undefined ? nx : trailIdx); }
});
window.addEventListener('keyup', e => { if (KEYMAP[e.code]) inp.keys[KEYMAP[e.code]] = false; });
window.addEventListener('blur', () => { inp.keys = {}; inp.touch.clear(); if (state === 'play' && G && !G.done && !G.mp) paused = true; });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play' && G && !G.done && !G.mp) paused = true; });

/* --- 9. MAIN LOOP ----------------------------------------------------------------- */
let last = performance.now(), lastState = '', fadeT = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000), t = now / 1000; last = now;
  UI.begin();
  if (state === 'title' || state === 'trails' || state === 'shop' || state === 'online') {
    demoWorld(t, dt);
    if (state === 'title') title(t); else if (state === 'trails') trails(t); else if (state === 'shop') shopScreen(t); else onlineScreen(t);
  } else {
    const sub = Math.max(2, Math.ceil(dt / (1 / 240))); for (let k = 0; k < sub; k++) step(dt / sub);
    const sh = G.shake > 0 ? Math.min(3, G.shake * 10) : 0;
    if (sh) { ctx.save(); ctx.translate(Math.round((Math.random() - 0.5) * sh * 2), Math.round((Math.random() - 0.5) * sh * 2)); }
    drawWorld(t, dt);
    if (sh) ctx.restore();
    hud(t);
    if (state === 'crashed' || state === 'finished') endScreen(t);
    else if (paused) pauseMenu();
  }
  if (state !== lastState) { fadeT = 0.22; lastState = state; }
  if (fadeT > 0) { fadeT -= dt; ctx.fillStyle = 'rgba(13,11,19,' + clamp(fadeT / 0.22, 0, 1) * 0.85 + ')'; ctx.fillRect(0, 0, S.W, H); }
  UI.end();
  S.blit('#0d0b13');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => { /* offline mode unavailable */ }));
}
PX.setIcon && PX.setIcon();
PX.Pad.setup({
  title: 'Pixel Bike Run: controller', ui: UI, menu: () => state !== 'play' || paused || (G && G.done),
  phone: { stick: 'LEAN', dpad: true, buttons: [['RT', 'GAS'], ['LT', 'BRAKE'], ['A', 'GAS'], ['B', 'BRAKE'], ['X', 'NITRO']] },
  keys: () => ({ START: 'KeyP' }),
  onPlay(h, n, dt, edge) {
    if (edge('X') || edge('RB')) useNitro();
    inp.pad.lean = Math.abs(h.ax) > 0.2 ? clamp(h.ax, -1, 1) : 0;
    inp.pad.gas = h.RT || h.A || h.up ? 1 : 0; inp.pad.brake = h.LT || h.B || h.down ? 1 : 0;
  },
  help: [['LEFT|RIGHT', 'LEAN BACK / FORWARD (FLIP IN THE AIR)'], ['RT|A', 'GAS'], ['LT|B', 'BRAKE'], ['X|RB', 'NITRO (FROM THE SHOP)'], ['START', 'PAUSE'], ['A', 'MENUS: OK'], ['B', 'MENUS: BACK']],
});
</script>
