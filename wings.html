<script>
'use strict';
/* ==========================================================================
   PIXEL WINGS: an air battle seen from above (part of the PIXEL ARCADE).
   Every plane always flies forward; you steer it and set its speed.
     AIR RAID: the attack (red) flies bombers and fighters at the island air base.
               The defense (blue) takes off from the runway and shoots the bombers down.
     DOGFIGHT: red fighters against blue fighters, first team to the kill target wins.
   Play alone with bots, two on one screen (split), or online (up to 6 phones).
   Online: the host's device runs the battle; the others send their sticks and draw
   what the host sends (each one follows their own plane).
     1. Setup   2. The map   3. Sprites   4. The battle (sim)   5. Bots   6. Effects + sound
     7. Drawing   8. Input   9. Online   10. Screens   11. Main loop
   ========================================================================== */

/* --- 1. SETUP --------------------------------------------------------------- */
const VERSION = '1.9.0';
const SAVE_KEY = 'pixelWings.save';
const save = { introSeen: false, scenes: true, stats: { battles: 0, deaths: 0, hits: 0, medals: 0, memorials: 0 }, school: [], schoolAsked: false, sfx: true, voice: true, cam: 'north', wins: 0, kills: 0, mode: 'raid', size: 1, level: 1, side: 0, plane: 1, side2: 1, plane2: 0 };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY)) || {}); } catch (e) { /* new player */ }
const store = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* private mode */ } };
const profile = PX.Profile.get();
const MY_COLOR = PX.AVATAR_COLORS[profile.avatar.color];

const canvas = document.getElementById('screen');
const S = PX.makeScreen(canvas, { H: 240, minW: 400, maxW: 560 });
const ctx = S.ctx, H = S.H;
const UI = PX.makeUI(S, canvas);
const T = (str, x, y, color = '#fff', size = 1, align = 'left', shadow = null) => PX.drawText(ctx, str, x, y, color, size, align, shadow);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rnd = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;
const angDiff = (to, from) => { let d = (to - from) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

const WW = 3200, WH = 2000;                        // the world, in screen pixels
const ATT = 0, DEF = 1;                            // the two sides
const TEAM_COL = ['#e0402a', '#2a7fd4'], TEAM_DARK = ['#8a2014', '#164a80'];
const TEAM_NAME = ['ATTACK', 'DEFENSE'], DOG_NAME = ['RED', 'BLUE'];
const FIGHTER = 0, BOMBER = 1, TORPEDO = 2;
const TYPES = [
  { name: 'FIGHTER', vmin: 50, vmax: 105, turn: 2.1, hp: 8, r: 8, acc: 50 },
  { name: 'BOMBER', vmin: 38, vmax: 66, turn: 1.0, hp: 22, r: 11, acc: 25 },
  { name: 'TORPEDO', vmin: 42, vmax: 80, turn: 1.45, hp: 18, r: 9, acc: 32 },
];
const BULLET_V = 260, BULLET_LIFE = 0.8, GUN_RATE = 0.16, GUN_DMG = 2;
const AMMO_MAX = 40, AMMO_BACK = 3, GUN_RELOAD = 3;      // rounds; rounds back per second when not firing; seconds to reload an empty gun
const BOMB_FALL = 1.0, BOMB_R = 18, BOMB_DMG = 2, BOMB_MAX = 4, BOMB_RELOAD = 8, BOMB_RATE = 0.28, BOMB_DRIFT = 0.7;
const GUNNER_RANGE = 135, GUNNER_RATE = 0.7;
// REAR GUNNER (a test mode): a bot flies your bomber, you man the turret behind the wings (drawn in 3D by gunner.js).
// The battle stays flat, but planes also get a height (z) so fighters dive in from above or come up from below.
const CREW_RATE = 0.08, CREW_DMG = 1, HEAT_SHOT = 0.03, HEAT_COOL = 0.35, JAM_T = 2;  // the turret's twin guns overheat
const GUN_YAW = 1.95, GUN_PITCH = [-0.55, 0.95];   // how far the turret turns from straight back, and down / up
const Z_BOMBER = 60, Z_FIGHTER = 72;               // how high the bombers and the fighters cruise
const TAKEOFF_V = 44, GROUND_ACC = 19;
const TIMES = { raid: 240, dog: 180, carrier: 240, school: 999 }, DOG_KILLS = [10, 15, 25];
const TORP_V = 62, TORP_LIFE = 10, TORP_DMG = 14, TORP_MAX = 1, TORP_RELOAD = 6;
const SHIP_V = 8, DESTROYER_HP = 24, FLEET_X = [460, 3200 - 460];
const RESPAWN = 4, HANGAR_EVERY = 30;
// per size: raid bombers, escorts, defenders, raid target strength; dogfight per team;
// carriers: fighters, torpedo planes, bombers per side and the carrier's strength
const SIZES = [
  { name: 'SMALL', bomb: 3, esc: 4, def: 4, dog: 3, hp: 1, cF: 3, cT: 2, cB: 0, cv: 40 },
  { name: 'NORMAL', bomb: 5, esc: 5, def: 7, dog: 5, hp: 1.5, cF: 4, cT: 3, cB: 1, cv: 50 },
  { name: 'BIG', bomb: 8, esc: 7, def: 12, dog: 8, hp: 2.5, cF: 5, cT: 4, cB: 2, cv: 65 },
];
const LEVELS = [                                   // how good the bots are; armor: how many more hits a player's plane takes
  { name: 'EASY', turn: 0.72, err: 0.32, cone: 0.05, react: 0.9, gun: 0.6, aa: 2.2, armor: 3 },
  { name: 'NORMAL', turn: 0.88, err: 0.16, cone: 0.08, react: 0.55, gun: 0.85, aa: 1.5, armor: 2 },
  { name: 'HARD', turn: 1.0, err: 0.06, cone: 0.11, react: 0.3, gun: 1.0, aa: 1.0, armor: 1.25 },
];

/* --- 2. THE MAP: ocean, the island with the air base, a few islets ----------------------- */
const IX = 2240, IY = 1000;                         // the island's middle
const RUNWAY = { x0: IX - 240, x1: IX + 180, y: IY + 62, w: 24 };
const STRIP = { x0: IX + 410, x1: IX + 560, y: IY + 50, w: 16 };   // the reserve airstrip, far from the targets: defenders come back here
const TARGET_DEFS = [
  { k: 'hangar', name: 'HANGAR', dx: -160, dy: -52, w: 34, h: 24, hp: 12 },
  { k: 'hangar', name: 'HANGAR', dx: -100, dy: -52, w: 34, h: 24, hp: 12 },
  { k: 'fuel', name: 'FUEL DEPOT', dx: 70, dy: -72, w: 34, h: 26, hp: 10 },
  { k: 'radar', name: 'RADAR', dx: 170, dy: -150, w: 20, h: 20, hp: 8 },
  { k: 'tower', name: 'CONTROL TOWER', dx: 4, dy: 8, w: 14, h: 14, hp: 8 },
  { k: 'ammo', name: 'AMMO DUMP', dx: -230, dy: -140, w: 28, h: 18, hp: 10 },
];
const AA_DEFS = [[-290, 10], [240, -30], [-40, 168], [130, 130], [-60, -170]];
const APRON = { x: IX - 200, y: IY + 32, dx: 20 };   // where the defenders wait to take off
const ISLETS = [[700, 460, 70], [1100, 1560, 90], [1500, 700, 50], [2900, 320, 60], [2850, 1720, 80], [320, 1450, 45]];
function seeded(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function islandR(ang) { return 390 + 48 * Math.sin(3 * ang + 1) + 30 * Math.sin(5 * ang + 2) + 16 * Math.sin(9 * ang + 0.5) + 8 * Math.sin(17 * ang); }
let mapKind = 'island';                             // 'island' (air raid, dogfight) or 'sea' (carriers: only the islets)
function landDepth(x, y) {                          // > 0 on land (how far in), < 0 in water
  let best = -1e9;
  if (mapKind === 'island') { const dx = (x - IX) / 1.25, dy = y - IY; best = islandR(Math.atan2(dy, dx)) - Math.hypot(dx, dy); }
  for (const [ix, iy, r] of ISLETS) best = Math.max(best, r + 8 * Math.sin(Math.atan2(y - iy, x - ix) * 4 + ix) - Math.hypot(x - ix, y - iy));
  return best;
}
const isLand = (x, y) => landDepth(x, y) > 0;
let mapCanvas = null;                               // the map, drawn once at half size (each texel is 2x2 pixels)
const maps = {};
function setMapKind(k) { if (mapKind === k && mapCanvas) return; mapKind = k; mapCanvas = maps[k] || (maps[k] = buildMap()); }
function buildMap() {
  const w = WW / 2, h = WH / 2, c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'), img = g.createImageData(w, h), d = img.data, rand = seeded(7);
  const hex = s => [parseInt(s.slice(1, 3), 16), parseInt(s.slice(3, 5), 16), parseInt(s.slice(5, 7), 16)];
  const C = { deep: hex('#1b4f8a'), sea: hex('#2263a3'), sea2: hex('#2669ab'), shal: hex('#3a8cc6'), shal2: hex('#55a8d6'),
              sand: hex('#e6d28c'), sand2: hex('#d8c27a'), grass: hex('#4f9e3a'), grass2: hex('#468f33'), grass3: hex('#5aab42'), tree: hex('#2d6b28'), tree2: hex('#24591f') };
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const wx = x * 2 + 1, wy = y * 2 + 1, dep = landDepth(wx, wy), n = rand();
    const wave = Math.sin(wx * 0.013 + Math.sin(wy * 0.02) * 2) + Math.sin(wy * 0.011 + wx * 0.004);
    let col;
    if (dep < -46) col = wave > 1.1 ? C.deep : n < 0.04 ? C.sea2 : C.sea;
    else if (dep < -14) col = n < 0.08 ? C.shal : C.sea2;
    else if (dep < 0) col = n < 0.1 ? C.shal2 : C.shal;
    else if (dep < 14) col = n < 0.15 ? C.sand2 : C.sand;
    else {
      const f = Math.sin(wx * 0.05) * Math.sin(wy * 0.043) + Math.sin(wx * 0.017 + wy * 0.021);
      col = f > 1.05 ? (n < 0.3 ? C.tree2 : C.tree) : n < 0.12 ? C.grass2 : n < 0.2 ? C.grass3 : C.grass;
    }
    const i = (y * w + x) * 4; d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  // the air base: concrete apron, taxiway and the runway (half-size coordinates)
  const R = (x, y, ww, hh, col) => { g.fillStyle = col; g.fillRect(Math.round(x / 2), Math.round(y / 2), Math.round(ww / 2), Math.round(hh / 2)); };
  if (mapKind === 'island') {
  R(IX - 270, IY - 90, 220, 70, '#9a9a8e'); R(IX - 270, IY - 90, 220, 2, '#b4b4a8');            // hangar apron
  R(IX - 220, IY + 20, 200, 26, '#9a9a8e');                                                      // the waiting line
  R(IX - 60, IY - 30, 22, 52, '#9a9a8e'); R(IX + 40, IY - 100, 80, 60, '#8e8e82');
  R(RUNWAY.x0 - 4, RUNWAY.y - RUNWAY.w / 2 - 4, RUNWAY.x1 - RUNWAY.x0 + 8, RUNWAY.w + 8, '#6f6f68');
  R(RUNWAY.x0, RUNWAY.y - RUNWAY.w / 2, RUNWAY.x1 - RUNWAY.x0, RUNWAY.w, '#4a4a4f');
  for (let x = RUNWAY.x0 + 30; x < RUNWAY.x1 - 20; x += 28) R(x, RUNWAY.y - 1, 14, 2, '#f2f2f2');
  for (let k = 0; k < 4; k++) { R(RUNWAY.x0 + 6, RUNWAY.y - 10 + k * 6, 14, 2, '#f2f2f2'); R(RUNWAY.x1 - 20, RUNWAY.y - 10 + k * 6, 14, 2, '#f2f2f2'); }
  R(STRIP.x0 - 4, STRIP.y - STRIP.w / 2 - 4, STRIP.x1 - STRIP.x0 + 8, STRIP.w + 8, '#6f6f68'); R(STRIP.x0, STRIP.y - STRIP.w / 2, STRIP.x1 - STRIP.x0, STRIP.w, '#4a4a4f');
  for (let x = STRIP.x0 + 14; x < STRIP.x1 - 10; x += 24) R(x, STRIP.y - 1, 10, 2, '#f2f2f2');
  }
  // little boats here and there
  const boats = seeded(3);
  for (let k = 0; k < 14; k++) {
    const bx = boats() * WW, by = boats() * WH;
    if (landDepth(bx, by) > -40) continue;
    R(bx, by, 12, 4, '#e8e8e8'); R(bx + 2, by - 2, 4, 2, '#c84a3a'); R(bx - 8, by, 8, 2, '#5aa0d8');
  }
  return c;
}

/* --- 3. SPRITES: planes drawn at 32 angles, so they stay crisp pixel art ------------------- */
// facing east. '#' team color, 'd' dark team color, 't' the pilot's color (white for bots), 'w' cockpit, 'p' propeller
const SPR = [
  ['...............',
   '......tt.......',
   '......##.......',
   '......###......',
   '.t....###......',
   '.#....###......',
   '.##..######..p.',
   '###d####ww###p.',
   '.##..######..p.',
   '.#....###......',
   '.t....###......',
   '......###......',
   '......##.......',
   '......tt.......',
   '...............'],
  ['.....................',
   '.........tt..........',
   '.........##..........',
   '.........###.........',
   '.........###.p.......',
   '.........#####p......',
   '.........###.p.......',
   '..t......###.........',
   '..#......###.........',
   '.###..############...',
   '###dddd##########wwp.',
   '.###..############...',
   '..#......###.........',
   '..t......###.........',
   '.........###.p.......',
   '.........#####p......',
   '.........###.p.......',
   '.........###.........',
   '.........##..........',
   '.........tt..........',
   '.....................'],
  ['.................',
   '.......tt........',
   '.......##........',
   '.......##........',
   '.......###.......',
   '..t....###.......',
   '..#....###.......',
   '.##...######...p.',
   '####d###kkkww##p.',
   '.##...######...p.',
   '..#....###.......',
   '..t....###.......',
   '.......###.......',
   '.......##........',
   '.......##........',
   '.......tt........',
   '.................'],
];
const DIRS = 32, sprCache = {};
function planeFrames(type, side, accent) {
  const key = type + '|' + side + '|' + accent;
  return sprCache[key] || (sprCache[key] = rotFrames(SPR[type], { '#': TEAM_COL[side], d: TEAM_DARK[side], t: accent, w: '#bff0ff', p: '#d8d8d8', k: '#2a2a30' }));
}
// ships are drawn the same way: a pixel picture facing east, turned to 32 angles
function shipRows(kind) {
  const L = kind === 'carrier' ? 96 : 48, W = kind === 'carrier' ? 22 : 10, rows = [];
  for (let y = 0; y < W; y++) {
    let r = '';
    for (let x = 0; x < L; x++) {
      const cy = Math.abs(y - (W - 1) / 2), halfW = W / 2 * (x > L - 14 ? Math.max(0.15, (L - x) / 14) : x < 3 ? 0.8 : 1);
      let ch = '.';
      if (cy <= halfW - 0.5) {
        ch = '#';
        if (kind === 'carrier') {
          if (cy <= halfW - 2.5 && x > 3 && x < L - 8) ch = 'g';                    // the flight deck
          if (ch === 'g' && y === W >> 1 && x % 8 < 4 && x > 12) ch = 'w';            // its middle line
          if (ch === 'g' && x < 12) ch = 't';
          if (x >= 58 && x <= 70 && y >= 1 && y <= 5) ch = 'k';                      // the island (bridge)
          if (x >= 62 && x <= 65 && y >= 2 && y <= 3) ch = 'w';
        } else {
          if (cy <= halfW - 2) ch = 'g';
          if (x >= 18 && x <= 26 && cy < 3) ch = 'k';                                // bridge and guns
          if ((x === 9 || x === 10 || x === 34 || x === 35 || x === 40 || x === 41) && cy < 2) ch = 'k';
          if (x < 6 && cy <= halfW - 2) ch = 't';
        }
      }
      r += ch;
    }
    rows.push(r);
  }
  return rows;
}
function shipFrames(kind, side) {
  const key = 'ship|' + kind + '|' + side;
  return sprCache[key] || (sprCache[key] = rotFrames(shipRows(kind), { '#': '#5d6570', g: kind === 'carrier' ? '#6f737c' : '#868d97', w: '#e8e8e8', k: '#3a3f48', t: TEAM_COL[side] }));
}
function rotFrames(rows, pal) {
  const w = rows[0].length, h = rows.length, hx = (w - 1) / 2, hy = (h - 1) / 2, size = (Math.ceil(Math.hypot(w, h)) + 3) | 1, c0 = (size - 1) / 2;
  const frames = [], shadows = [];
  for (let f = 0; f < DIRS; f++) {
    const a = f / DIRS * TAU, ca = Math.cos(a), sa = Math.sin(a);
    const c = document.createElement('canvas'); c.width = c.height = size;
    const s = document.createElement('canvas'); s.width = s.height = size;
    const g = c.getContext('2d'), gs = s.getContext('2d');
    gs.fillStyle = 'rgba(0,0,0,0.32)';
    const at = (x, y) => (x >= 0 && y >= 0 && x < w && y < h ? rows[y][x] : '.');
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      const dx = x - c0, dy = y - c0, sx = Math.round(dx * ca + dy * sa + hx), sy = Math.round(-dx * sa + dy * ca + hy);
      const ch = at(sx, sy);
      if (ch === '.') {                                               // a dark outline around the plane
        let edge = false;
        for (const [ox, oy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const ex = x + ox - c0, ey = y + oy - c0;
          if (at(Math.round(ex * ca + ey * sa + hx), Math.round(-ex * sa + ey * ca + hy)) !== '.') edge = true;
        }
        if (edge) { g.fillStyle = 'rgba(17,17,17,0.85)'; g.fillRect(x, y, 1, 1); }
        continue;
      }
      g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); gs.fillRect(x, y, 1, 1);
    }
    frames.push(c); shadows.push(s);
  }

}
const frameOf = a => ((Math.round(a / TAU * DIRS) % DIRS) + DIRS) % DIRS;
let clouds = [];
function buildClouds() {
  const r = seeded(11); clouds = [];
  for (let k = 0; k < 16; k++) {
    const w = 60 + r() * 90, h = 30 + r() * 40, c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h);
    const g = c.getContext('2d');
    for (let b = 0; b < 9; b++) {
      const bx = w * (0.2 + r() * 0.6), by = h * (0.3 + r() * 0.4), br = Math.min(w, h) * (0.25 + r() * 0.25);
      for (let y = -br; y <= br; y += 2) for (let x = -br; x <= br; x += 2) if (x * x + y * y < br * br) { g.fillStyle = y < -br * 0.3 ? '#ffffff' : '#e6ecf4'; g.fillRect(Math.round((bx + x) / 2) * 2, Math.round((by + y) / 2) * 2, 2, 2); }
    }
    clouds.push({ c, x: r() * WW, y: r() * WH, v: 4 + r() * 5 });
  }
}

/* --- 4. THE BATTLE (runs on this device, or on the host's device when online) ------------------ */
let G = null;          // the battle being simulated here (solo, two on one screen, or the online host)
let nextId = 1;
function newBattle(cfg, players) {
  setMapKind(cfg.mode === 'carrier' ? 'sea' : 'island');
  G = { cfg, time: TIMES[cfg.mode], planes: [], bullets: [], bombs: [], flak: [], fx: [], ships: [], torps: [], fleet: [],
        targets: [], aa: [], players, radioCD: {}, callN: [0, 0, 0, 0, 0, 0], launchT: 2, over: false, winner: -1, score: [0, 0], reserve: 0, endT: 0, t: 0 };
  nextId = 1;
  const size = SIZES[cfg.size];
  if (cfg.mode === 'raid') {
    for (const d of TARGET_DEFS) { const hp = Math.round(d.hp * size.hp); G.targets.push({ k: d.k, name: d.name, x: IX + d.dx, y: IY + d.dy, w: d.w, h: d.h, hp, max: hp }); }
    for (const [dx, dy] of AA_DEFS) G.aa.push({ x: IX + dx, y: IY + dy, hp: 3, a: Math.PI, t: rnd(0, 2) });
  }
  if (cfg.mode === 'school') { newSchool(); return; }
  const want = cfg.mode === 'raid'
    ? { [ATT]: { [BOMBER]: size.bomb, [FIGHTER]: size.esc, [TORPEDO]: 0 }, [DEF]: { [BOMBER]: 0, [FIGHTER]: size.def, [TORPEDO]: 0 } }
    : cfg.mode === 'carrier'
      ? { [ATT]: { [FIGHTER]: size.cF, [TORPEDO]: size.cT, [BOMBER]: size.cB }, [DEF]: { [FIGHTER]: size.cF, [TORPEDO]: size.cT, [BOMBER]: size.cB } }
      : { [ATT]: { [BOMBER]: 0, [FIGHTER]: size.dog, [TORPEDO]: 0 }, [DEF]: { [BOMBER]: 0, [FIGHTER]: size.dog, [TORPEDO]: 0 } };
  for (const pl of players) {
    pl.kills = 0; pl.deaths = 0; pl.hits = 0; pl.respawn = 0; pl.planeId = 0; pl.gone = false;
    if (cfg.mode === 'dog' || (cfg.mode === 'raid' && pl.side === DEF)) pl.plane = FIGHTER;

    const gz = me.z + 3, rx = lead.x - me.x, ry = lead.y - me.y, rz = (lead.z || 0) - gz;
    const ux = Math.cos(lead.a) * lead.v - Math.cos(me.a) * me.v, uy = Math.sin(lead.a) * lead.v - Math.sin(me.a) * me.v, uz = (lead.vz || 0) - (me.vz || 0);
    const a = ux * ux + uy * uy + uz * uz - BULLET_V * BULLET_V, b = 2 * (rx * ux + ry * uy + rz * uz), c = rx * rx + ry * ry + rz * rz, disc = b * b - 4 * a * c;
    if (a < 0 && disc >= 0) {
      const tt = (-b - Math.sqrt(disc)) / (2 * a);
      if (tt > 0 && tt < BULLET_LIFE) {
        const P = Gun.view.project(me.x + rx + ux * tt, me.y + ry + uy * tt, gz + rz + uz * tt, S.W, H);
        if (!P.behind) {
          onTarget = Math.hypot(P.x - cx, P.y - cy) < 7;
          ctx.strokeStyle = '#5ad43f'; ctx.lineWidth = 1; ctx.beginPath();
          ctx.moveTo(P.x, P.y - 4); ctx.lineTo(P.x + 4, P.y); ctx.lineTo(P.x, P.y + 4); ctx.lineTo(P.x - 4, P.y); ctx.closePath(); ctx.stroke();
        }
      }
    }
  }
  // the ring sight
  if (live) {
    const col = me.jam ? '#ff4040' : onTarget ? '#5ad43f' : '#ffd23f';
    ctx.strokeStyle = col; ctx.globalAlpha = 0.85; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx + 0.5, cy + 0.5, 20, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx + 0.5, cy + 0.5, 7, 0, TAU); ctx.stroke();
    ctx.fillStyle = col; ctx.fillRect(cx, cy, 1, 1);
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) ctx.fillRect(cx + dx * 22 + (dx ? 0 : 0), cy + dy * 22, dx ? 5 * dx : 1, dy ? 5 * dy : 1);
    ctx.globalAlpha = 1;
    if (onTarget) T('FIRE!', cx, cy + 24, '#5ad43f', 1, 'center', '#000');
    // the guns' heat, bottom middle
    const bw = 90, bx = cx - bw / 2, by = H - 16;
    ctx.fillStyle = 'rgba(13,11,19,0.7)'; ctx.fillRect(bx - 26, by - 3, bw + 30, 11);
    T('GUNS', bx - 23, by, '#9a92b8', 1);
    ctx.fillStyle = '#111'; ctx.fillRect(bx, by, bw, 5);
    const hk = me.jam ? 1 : me.heat || 0;
    ctx.fillStyle = me.jam ? (Math.floor(t * 6) % 2 ? '#ff4040' : '#8a2014') : hk > 0.7 ? '#ff6a20' : '#ffd23f';
    ctx.fillRect(bx + 1, by + 1, Math.round((bw - 2) * hk), 3);
    if (me.jam) T('JAMMED! WAIT...', cx, cy - 36, '#ff4040', 1, 'center', '#000');
    else if (hk > 0.75) T('TOO HOT! SHORT BURSTS!', cx, cy - 36, '#ff8a2a', 1, 'center', '#000');
  }
  drawHUD(V, 0, 0, S.W, { gunner: true, local: 0, cam: cams[0] }, t);
  // how to aim on this device
  const sinceStart = performance.now() - hintT;
  if (live && !paused) {
    let hint = null;
    if (Ctl.touch) hint = sinceStart < 9000 ? ['DRAG ANYWHERE TO TURN THE GUNS', 'HOLD FIRE TO SHOOT'] : null;
    else if (PX.Pad.used) hint = sinceStart < 9000 ? ['STICK = AIM THE GUNS', 'A = FIRE'] : null;
    else if (!mouseLocked()) hint = ['CLICK TO AIM WITH THE MOUSE', 'OR: ARROWS = AIM, SPACE = FIRE'];
    else if (sinceStart < 9000) hint = ['MOUSE = AIM   CLICK = FIRE', 'ESC = PAUSE'];
    if (hint && (sinceStart > 9000 || Math.floor(sinceStart / 400) % 6)) {
      const hy = cy + 34;                                              // under the sight (the big news sits above it)
      ctx.fillStyle = 'rgba(13,11,19,0.7)'; ctx.fillRect(cx - 80, hy - 4, 160, 26);
      T(hint[0], cx, hy, '#fff', 1, 'center'); T(hint[1], cx, hy + 11, '#7ac8ff', 1, 'center');
    }
  }
  if (Ctl.touch) {                                                     // the FIRE button
    const fb = fireBtn({ x: 0, w: S.W }), on = lp.fireId !== null;
    ctx.fillStyle = on ? 'rgba(255,90,60,0.7)' : 'rgba(13,11,19,0.45)'; ctx.beginPath(); ctx.arc(fb.x, fb.y, fb.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#efe9ff'; ctx.lineWidth = 2; ctx.stroke();
    T('FIRE', fb.x, fb.y - 3, '#fff', 1, 'center');
  }
}
// the battle screen: one view, or two side by side
function drawPlay(t, dt) {
  const V = viewOf();
  if (V && Local.gunner && !Net.isClient()) {
    drawGunner(V, t, dt);
    if (V.over) { const w = V.winner; T(w === 2 ? 'TIME UP: A DRAW!' : TEAM_NAME[w] + ' WINS!', S.W / 2, H / 2 - 50, w === 2 ? '#fff' : TEAM_COL[w], 3, 'center', '#000'); }
    else if (!mouseLocked() && UI.button('pause', S.W / 2 + 96, 4, 22, 18, 'II', { size: 1 })) setPause(true);
    return;
  }
  if (!V) { ctx.fillStyle = '#1b4f8a'; ctx.fillRect(0, 0, S.W, H); T('GETTING READY...', S.W / 2, H / 2, '#fff', 2, 'center'); return; }
  setMapKind(V.cfg.mode === 'carrier' ? 'sea' : 'island');
  planeTrails(V, dt);
  const locals = Net.isClient() ? [Net.myPid] : V.players.map((p, i) => (p.local !== undefined ? i : -1)).filter(i => i >= 0);
  const n = Math.max(1, locals.length), vw = Math.floor(S.W / n);
  while (cams.length < n) cams.push({ x: IX, y: IY, plane: null, ang: -Math.PI / 2, rot: 0 });
  cams.length = n;
  locals.forEach((pi, li) => {
    const pl = V.players[pi], me = pl ? V.planes.find(p => p.id === pl.planeId) : null, cam = cams[li];
    if (me && me.state !== 'dead') {
      const up = save.cam === 'plane';
      const lx = up ? me.x : me.x + Math.cos(me.a) * 40, ly = up ? me.y : me.y + Math.sin(me.a) * 30;
      const first = !cam.plane || cam.plane.id !== me.id;
      const jump = first && (!cam.plane || Math.hypot(lx - cam.x, ly - cam.y) > 400);
      const k = jump ? 1 : Math.min(1, dt * (up ? 10 : 4));
      cam.x += (lx - cam.x) * k; cam.y += (ly - cam.y) * k; cam.plane = me;
      cam.ang = jump ? me.a : cam.ang + angDiff(me.a, cam.ang) * Math.min(1, dt * 5);   // the view turns a little behind the plane
    }
    cam.rot = save.cam === 'plane' ? -Math.PI / 2 - cam.ang : 0;
    const vx = li * vw, w = li === n - 1 ? S.W - vx : vw;
    const view = drawWorld(V, cam, vx, w, t, save.cam === 'plane');
    drawHUD(V, pi, vx, w, { sx: view.sx, sy: view.sy, proj: view.proj, local: li, cam }, t);
  });
  if (n > 1) { ctx.fillStyle = '#111'; ctx.fillRect(vw - 1, 0, 2, H); }
  if (V.over) {
    const w = V.winner, names = V.cfg.mode === 'raid' ? TEAM_NAME : DOG_NAME;
    T(w === 2 ? 'TIME UP: A DRAW!' : names[w] + ' WINS!', S.W / 2, H / 2 - 50, w === 2 ? '#fff' : TEAM_COL[w], 3, 'center', '#000');
  }
  if (!V.over) {
    if (Net.mode === 'off') { if (UI.button('pause', S.W / 2 - 11, H - 24, 22, 18, 'II', { size: 1 })) setPause(true); }
    else if (UI.button('leave', S.W / 2 - 18, H - 22, 36, 16, 'MENU', { size: 1 })) leaveAsk = true;
  }
}

/* --- 11. MAIN LOOP ---------------------------------------------------------------- */
const STEP = 1 / 60;
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000), t = now / 1000; last = now;
  UI.begin();
  if (state === 'play') {
    readKeys(dt);
    if (Net.isClient()) { Net.clientTick(now); Net.buildView(now); if (Net.view && Net.view.over && !Net.result) { /* waiting for the result */ } }
    else if (G && !paused) {
      acc += dt;
      while (acc >= STEP) {
        const inputs = G.players.map((p, i) => (p.local !== undefined ? Local.input(p.local) : Net.inputs[i] || NO_INPUT));
        stepBattle(STEP, inputs);
        for (const e of G.fx) handleFx(e);
        if (Net.mode === 'host') Net.fxOut = (Net.fxOut || []).concat(G.fx.filter(e => e.k !== 'gun' || Math.random() < 0.5));
        G.fx = [];
        acc -= STEP;
      }
      Net.hostTick(now);
      if (G.over && G.endT > 2.2 && state === 'play') {
        if (Net.mode === 'host') Net.broadcast({ t: 'end' });
        Net.hostTick(now + SNAP_MS);
        toOver();
      }
    } else acc = 0;
    if (!paused) { stepParts(dt); Radio.step(performance.now()); }
    if (state === 'play') {
      drawPlay(t, dt);
      if (paused) drawPause(); else if (leaveAsk) drawLeave();
    } else if (state === 'over') { drawPlay(t, 0); drawOver(t); }
  } else if (state === 'over') {
    if (Net.isClient()) Net.buildView(now); else if (G) { stepBattle(STEP, []); G.fx = []; }
    stepParts(dt); Radio.step(performance.now());
    drawPlay(t, 0); ctx.fillStyle = 'rgba(13,11,19,0.4)'; ctx.fillRect(0, 0, S.W, H);
    drawOver(t);
  } else if (state === 'title') drawTitle(t, dt);
  else if (state === 'help') drawHelp(t, dt);
  else if (state === 'setup') drawSetup(t, dt);
  else if (state === 'online') drawOnline(t, dt);
  else if (state === 'school') drawSchool(t, dt);
  else if (state === 'scene') drawScene(t, dt);
  else if (state === 'intro') drawIntro(t, dt);
  if (!(state === 'online' && Net.screen === 'join')) codeInput.style.display = 'none';
  UI.end();
  S.blit('#1b4f8a');
  requestAnimationFrame(frame);
}
setMapKind('island'); buildClouds();
if (!save.introSeen) startIntro();                     // the very first time: the intro
requestAnimationFrame(frame);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => { /* offline mode unavailable */ }));
}
PX.Pad.setup({
  title: 'Pixel Wings: controller', ui: UI, menu: () => state !== 'play' || paused || leaveAsk,
  phone: { stick: 'POINT WHERE TO FLY', buttons: [['A', 'FIRE'], ['LB', 'SLOWER'], ['RB', 'FASTER']] },
  keys: () => ({ START: 'KeyP' }),
  onPlay: (h, n, dt) => {                    // left stick: where to fly; A / RT / X: fire; LB / RB or the right stick: speed
    const p = Local.pilots[n]; if (!p) return;
    if (Local.gunner) {                       // the turret: the stick turns and tilts the guns
      const dz = v => (Math.abs(v) < 0.15 ? 0 : v);
      aimGun(p, dz(h.ax) * Math.abs(dz(h.ax)) * 2 * dt, -dz(h.ay) * Math.abs(dz(h.ay)) * 1.5 * dt);
      p.padFire = h.A || h.RT || h.X;
      return;
    }
    const m = Math.hypot(h.ax, h.ay);
    p.padAim = m > 0.4 ? Math.atan2(h.ay, h.ax) : null;
    p.padFire = h.A || h.RT || h.X;
    p.padThr = (h.RB || h.rup ? 1 : 0) - (h.LB || h.rdown ? 1 : 0);
    if (p.padThr) p.thr = clamp(p.thr + p.padThr * dt * 0.9, 0, 1);
    p.padThr = 0;
  },
  help: [['STICK', 'POINT WHERE TO FLY'], ['A|RT', 'FIRE / DROP BOMBS'], ['LB|RB', 'SLOWER / FASTER'], ['START', 'PAUSE / MENU'],
         ['STICK|D-PAD', 'MENUS: PICK A BUTTON'], ['A', 'MENUS: OK'], ['B', 'MENUS: BACK']],
});
</script>
