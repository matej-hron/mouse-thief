<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Pixel Cook: cook meals to order. Start with a pizza restaurant, open a burger restaurant, then a luxury restaurant. 3 minutes for one meal.">
<meta name="theme-color" content="#0d0b13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Pixel Cook</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1030; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #screen { position: fixed; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<script src="common.js"></script>
<script>
'use strict';
/* ==========================================================================
   PIXEL COOK: cook meals to order (part of the PIXEL ARCADE).
   A customer walks in and orders. The ticket on the left shows the meal and
   every step. You cook it on the table: tap the ingredients in the tray, roll
   the dough, bake / grill / cook it (take it out in the green!) and SERVE.
   You have 3 minutes for one meal; the faster you are, the bigger the tip.
   You start with a PIZZA RESTAURANT, then buy a BURGER RESTAURANT and at last
   a LUXURY RESTAURANT. New players get a tutorial.
     1. Setup   2. Restaurants and meals   3. The game   4. Drawing food
     5. Drawing the kitchen   6. Screens   7. Input and the main loop
   ========================================================================== */

/* --- 1. SETUP --------------------------------------------------------------- */
const VERSION = '1.0.0';
const SAVE_KEY = 'pixelCook.save';
const save = { money: 0, earned: 0, rest: 0, owned: [true, false, false], up: { timer: 0, stove: 0, tips: 0, menu: 0 },
               shifts: [0, 0, 0], served: 0, best: 0, tut: false, tips: [false, false, false], hat: false, sfx: true };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY)) || {}); } catch (e) { /* new player */ }
const store = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* private mode */ } };
const profile = PX.Profile.get();

const canvas = document.getElementById('screen');
const S = PX.makeScreen(canvas, { H: 240, minW: 400, maxW: 560 });
const ctx = S.ctx, H = S.H;
const UI = PX.makeUI(S, canvas);
const T = (str, x, y, color = '#fff', size = 1, align = 'left', shadow = null) => PX.drawText(ctx, str, x, y, color, size, align, shadow);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const pick = a => a[Math.floor(Math.random() * a.length)];
const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
function disc(cx, cy, r, c) {              // a pixel circle
  ctx.fillStyle = c; cx = Math.round(cx); cy = Math.round(cy);
  for (let dy = -r; dy <= r; dy++) { const w = Math.round(Math.sqrt(r * r - dy * dy + r * 0.8)); ctx.fillRect(cx - w, cy + dy, w * 2 + 1, 1); }
}

const MEAL_TIME = 180;                     // 3 minutes for one meal
const ROLLS = 4;                           // taps of the rolling pin to roll the dough flat
const HEARTS = 3;                          // customers who may leave hungry before you close early

/* --- 2. RESTAURANTS AND MEALS --------------------------------------------------- */
// everything in the trays: n = the name on the button, s = the step on the ticket (tools have tool: true)
const ITEMS = {
  dough: { n: 'DOUGH', s: 'PIZZA DOUGH' }, roll: { n: 'ROLL PIN', s: 'ROLL IT FLAT', tool: true }, sauce: { n: 'SAUCE', s: 'TOMATO SAUCE' },
  mozz: { n: 'MOZZARELLA' }, salami: { n: 'SALAMI' }, mush: { n: 'MUSHROOM', s: 'MUSHROOMS' }, ham: { n: 'HAM' },
  pine: { n: 'PINEAPPLE' }, olive: { n: 'OLIVES' }, pepper: { n: 'PEPPER' }, oven: { n: 'OVEN', s: 'BAKE IT', tool: true },
  bun: { n: 'BUN' }, patty: { n: 'PATTY', s: 'MEAT PATTY' }, grill: { n: 'GRILL', s: 'GRILL IT', tool: true }, cheese: { n: 'CHEESE' },
  lettuce: { n: 'LETTUCE' }, tomato: { n: 'TOMATO' }, onion: { n: 'ONION' }, bacon: { n: 'BACON' }, pickle: { n: 'PICKLE' },
  ketchup: { n: 'KETCHUP' }, egg: { n: 'EGG', s: 'FRIED EGG' },
  plate: { n: 'PLATE' }, steak: { n: 'STEAK' }, lobster: { n: 'LOBSTER' }, pasta: { n: 'PASTA' }, cake: { n: 'CAKE' },
  stove: { n: 'COOK', s: 'COOK IT', tool: true }, potato: { n: 'POTATO', s: 'POTATOES' }, aspar: { n: 'ASPARAG.', s: 'ASPARAGUS' },
  lemon: { n: 'LEMON' }, butter: { n: 'BUTTER' }, cream: { n: 'CREAM' }, truffle: { n: 'TRUFFLE' }, parm: { n: 'PARMESAN' },
  choco: { n: 'CHOCO', s: 'CHOCOLATE' }, berry: { n: 'BERRY', s: 'STRAWBERRY' }, gold: { n: 'GOLD', s: 'GOLD LEAF' },
};
const pizza = (name, price, top) => ({ name, price, groups: [['dough'], ['roll'], ['sauce'], ['mozz', ...top], ['oven']] });
const burger = (name, price, top) => ({ name, price, groups: [['bun'], ['patty'], ['grill'], ...top.map(x => [x]), ['bun']] });
const lux = (name, price, main, sides) => ({ name, price, groups: [['plate'], [main], ['stove'], sides] });
// a meal's steps are groups: the groups go in order, the things inside one group in any order
const REST = [
  { id: 'pizza', name: 'PIZZA RESTAURANT', price: 0, color: '#e8402a', tool: 'oven', verb: 'BAKING',
    tray: ['dough', 'roll', 'sauce', 'mozz', 'salami', 'mush', 'ham', 'pine', 'olive', 'pepper', 'oven'],
    dishes: [pizza('PIZZA WITH MOZZARELLA', 20, []), pizza('SALAMI PIZZA', 26, ['salami']), pizza('MUSHROOM PIZZA', 26, ['mush']),
             pizza('HAWAII PIZZA', 32, ['ham', 'pine']), pizza('VEGGIE PIZZA', 38, ['mush', 'pepper', 'olive']),
             pizza('DELUXE PIZZA', 46, ['salami', 'ham', 'mush', 'olive'])] },
  { id: 'burger', name: 'BURGER RESTAURANT', price: 1500, color: '#ffb020', tool: 'grill', verb: 'GRILLING',
    tray: ['bun', 'patty', 'grill', 'cheese', 'lettuce', 'tomato', 'onion', 'bacon', 'pickle', 'ketchup', 'egg'],
    dishes: [burger('HAMBURGER', 45, ['ketchup']), burger('CHEESEBURGER', 55, ['cheese', 'ketchup']),
             burger('SALAD BURGER', 65, ['cheese', 'lettuce', 'tomato']), burger('BACON BURGER', 78, ['cheese', 'bacon', 'onion', 'ketchup']),
             burger('EGG BURGER', 85, ['egg', 'bacon', 'lettuce', 'pickle']), burger('MEGA BURGER', 98, ['cheese', 'bacon', 'lettuce', 'tomato', 'pickle'])] },
  { id: 'lux', name: 'LUXURY RESTAURANT', price: 5000, color: '#c89aff', tool: 'stove', verb: 'COOKING',
    tray: ['plate', 'steak', 'lobster', 'pasta', 'cake', 'stove', 'potato', 'aspar', 'lemon', 'butter', 'cream', 'truffle', 'parm', 'choco', 'berry', 'gold'],
    dishes: [lux('STEAK AND POTATOES', 150, 'steak', ['potato', 'butter']), lux('CHOCOLATE CAKE', 160, 'cake', ['choco', 'berry']),
             lux('TRUFFLE PASTA', 185, 'pasta', ['cream', 'truffle', 'parm']), lux('LEMON LOBSTER', 220, 'lobster', ['lemon', 'butter', 'aspar']),
             lux('ROYAL STEAK', 280, 'steak', ['potato', 'aspar', 'truffle', 'butter']), lux('GOLDEN CAKE', 320, 'cake', ['choco', 'berry', 'cream', 'gold'])] },
];
const UPGRADES = [
  { id: 'timer', name: 'KITCHEN TIMER', text: 'THE GREEN ZONE LASTS LONGER', cost: [150, 500, 1500] },
  { id: 'stove', name: 'TURBO STOVE', text: 'BAKES AND GRILLS FASTER', cost: [120, 450, 1300] },
  { id: 'tips', name: 'TIP JAR', text: '+25% TIPS A LEVEL', cost: [100, 400, 1200] },
  { id: 'menu', name: 'FANCY MENU', text: '+15% PRICES A LEVEL', cost: [200, 700, 2000] },
];
const HAT_PRICE = 25000;
const COOK_WAIT = [3.2, 2.7, 2.2, 1.7], COOK_GREEN = [1.4, 1.8, 2.2, 2.6], COOK_BURN = 1.2;
const dishCount = r => Math.min(REST[r].dishes.length, 2 + save.shifts[r]);     // new meals open as you finish shifts
const shiftSize = r => 4 + Math.min(4, Math.floor(save.shifts[r] / 2));         // 4 customers at first, up to 8
const priceOf = d => Math.round(d.price * (1 + 0.15 * save.up.menu));
const CUSTOMER_SHAPES = PX.AVATAR_SHAPES.filter(s => !PX.GIFT_SHAPES.includes(s));

/* --- 3. THE GAME --------------------------------------------------------------- */
let state = 'title';            // title | rests | shop | play | over
let paused = false;
let G = null;
function newShift(tut = false) {
  const rest = tut ? 0 : save.rest;
  G = { rest, tut, tutPage: tut ? 0 : -1, total: tut ? 1 : shiftSize(rest), n: 0, hearts: HEARTS, servedN: 0, earned: 0, tipsSum: 0, mist: 0,
        O: null, phase: 'wait', phaseT: 0, pops: [], shake: 0, stars: 0, newDish: null, tip: null, last: -1 };
  if (!tut && !save.tips[rest] && rest > 0) G.tip = rest;          // a short tip the first time in a new restaurant
  state = 'play'; paused = false;
  if (!tut) nextCustomer();
}
function nextCustomer() {
  const rest = REST[G.rest];
  let i = 0;
  if (!G.tut) do { i = Math.floor(Math.random() * dishCount(G.rest)); } while (i === G.last && dishCount(G.rest) > 1);
  G.last = i; G.n++;
  G.O = { dish: rest.dishes[i], price: priceOf(rest.dishes[i]), time: MEAL_TIME, mist: 0,
          who: { shape: pick(CUSTOMER_SHAPES), color: Math.floor(Math.random() * PX.AVATAR_COLORS.length) }, shirt: pick(['#3a7ad4', '#3fae4a', '#e0782a', '#b07aff', '#e01e5a', '#2ad4c4']),
          say: '', pay: 0, tipPay: 0 };
  resetDish();
  G.phase = 'enter'; G.phaseT = 0;
  sfx('bell');
}
function resetDish() { G.D = { done: [], gi: 0, got: [], rolls: 0, perfect: false }; G.cook = null; }
const dishReady = () => G.D.gi >= G.O.dish.groups.length;
const needs = () => (dishReady() ? [] : G.O.dish.groups[G.D.gi].filter(id => !G.D.got.includes(id)));
function pop(text, color = '#fff', x, y, big = false) {
  if (y === undefined) y = 108 + G.pops.filter(p => p.t < 0.5).length * 16;      // two at once: one under the other
  G.pops.push({ text, color, x: x === undefined ? tableX() + tableW() / 2 : x, y, t: 0, big });
}
function mistake(text) {
  G.O.mist++; G.mist++; G.shake = 0.3;
  pop(text, '#ff6a5a'); sfx('wrong');
}
function addItem(id) {
  if (state !== 'play' || paused || G.phase !== 'cook' || G.cook) return;
  const D = G.D, dish = G.O.dish, need = needs();
  if (!need.includes(id)) {
    if (dishReady()) mistake('IT IS DONE: SERVE IT!');
    else if (dish.groups.some((g, k) => k > D.gi && g.includes(id))) mistake('NOT YET!');
    else if (dish.groups.some(g => g.includes(id))) mistake('ALREADY ON IT!');
    else mistake('NOT IN THE ORDER!');
    return;
  }
  if (id === 'roll') {
    D.rolls++; sfx('roll');
    if (D.rolls < ROLLS) return;
  } else if (ITEMS[id].tool) {             // into the oven / onto the grill / into the pan
    G.cook = { t: 0, wait: COOK_WAIT[save.up.stove], green: COOK_GREEN[save.up.timer] };
    sfx('sizzle'); return;
  } else sfx('put');
  D.done.push(id); D.got.push(id);
  if (!needs().length) { D.gi++; D.got = []; }
  if (dishReady()) { pop('READY! SERVE IT', '#9be36b'); sfx('ready'); }
}
function takeOut() {
  if (state !== 'play' || paused || !G.cook) return;
  const c = G.cook, D = G.D;
  if (c.t < c.wait) { pop('NOT READY YET!', '#7ac8ff'); sfx('wrong'); return; }
  const k = (c.t - c.wait) / c.green;       // 0..1 through the green zone
  D.perfect = k > 0.3 && k < 0.7;
  G.cook = null;
  const tool = G.O.dish.groups[D.gi][0];
  D.done.push(tool); D.gi++; D.got = [];
  pop(D.perfect ? 'PERFECT!' : 'GOOD!', D.perfect ? '#ffd23f' : '#9be36b'); sfx(D.perfect ? 'perfect' : 'put');
  if (dishReady()) sfx('ready');
}
function burnt() {
  resetDish();
  mistake('BURNT! MAKE A NEW ONE');
}
function trash() {
  if (state !== 'play' || paused || G.phase !== 'cook' || !G.D.done.length && !G.D.rolls && !G.cook) return;
  resetDish(); pop('IN THE BIN. START AGAIN', '#9a92b8'); sfx('trash');
}
function serve() {
  if (state !== 'play' || paused || G.phase !== 'cook' || !dishReady()) return;
  const O = G.O, left = O.time / MEAL_TIME;
  let tip = O.price * (0.4 * left + (G.D.perfect ? 0.15 : 0)) * (1 + 0.25 * save.up.tips) * Math.pow(0.8, O.mist);
  tip = Math.round(tip);
  O.pay = O.price; O.tipPay = tip;
  save.money += O.price + tip; save.earned += O.price + tip; save.served++;
  G.earned += O.price + tip; G.tipsSum += tip; G.servedN++;
  O.say = pick(['YUMMY!', 'DELICIOUS!', 'THANK YOU!', 'SO GOOD!', 'WOW!']);
  pop('+$' + O.price, '#ffd23f', undefined, 100, true);
  if (tip) pop('TIP +$' + tip, '#9be36b', undefined, 122);
  G.phase = 'served'; G.phaseT = 0;
  store(); sfx('cash');
}
function customerLeaves() {
  G.hearts--; G.O.say = 'TOO SLOW! BYE!';
  G.cook = null; G.phase = 'left'; G.phaseT = 0; G.shake = 0.4;
  sfx('angry');
}
function endShift() {
  state = 'over';
  if (G.tut) { save.tut = true; store(); return; }
  const before = dishCount(G.rest);
  if (G.servedN > 0) {
    save.shifts[G.rest]++;
    G.stars = 1 + (G.servedN === G.total && G.mist === 0 ? 1 : 0);
    PX.Wallet.add(G.stars);
  }
  if (dishCount(G.rest) > before) G.newDish = REST[G.rest].dishes[before].name;
  if (G.earned > save.best) { save.best = G.earned; G.newBest = true; }
  store(); sfx('done');
}
function step(dt) {
  G.phaseT += dt; G.shake = Math.max(0, G.shake - dt);
  G.pops = G.pops.filter(p => (p.t += dt) < 1.4);
  if (G.tutPage >= 0 || G.tip !== null) return;
  if (G.phase === 'enter' && G.phaseT > 0.7) { G.phase = 'cook'; G.phaseT = 0; }
  else if (G.phase === 'cook') {
    if (!G.tut) G.O.time -= dt;                          // the clock waits for you in the tutorial
    if (G.O.time <= 10 && Math.floor(G.O.time) !== Math.floor(G.O.time + dt)) sfx('tick');
    if (G.cook) { G.cook.t += dt; if (G.cook.t > G.cook.wait + G.cook.green + COOK_BURN) burnt(); else if (G.cook.t > G.cook.wait + G.cook.green && !G.cook.smoke) { G.cook.smoke = true; sfx('wrong'); } }
    if (G.O.time <= 0) { G.O.time = 0; customerLeaves(); }
  } else if ((G.phase === 'served' || G.phase === 'left') && G.phaseT > 1.6) {
    if (G.n >= G.total || G.hearts <= 0) endShift(); else nextCustomer();
  }
}

/* --- 4. DRAWING FOOD --------------------------------------------------------------- */
// little pictures for the tray buttons (about 14 x 12, around cx, cy)
function icon(id, cx, cy) {
  const r = (x, y, w, h, c) => R(cx + x, cy + y, w, h, c), d = (x, y, rr, c) => disc(cx + x, cy + y, rr, c);
  switch (id) {
    case 'dough': d(0, 0, 5, '#f0dca8'); r(-3, -3, 3, 2, '#fff4d8'); break;
    case 'roll': r(-8, -1, 3, 2, '#8a5a2a'); r(5, -1, 3, 2, '#8a5a2a'); r(-5, -3, 10, 6, '#d8a868'); r(-5, -3, 10, 1, '#f0c890'); break;
    case 'sauce': d(0, 0, 5, '#d8301e'); r(-3, -3, 3, 2, '#ff7a5a'); break;
    case 'mozz': d(-2, 1, 4, '#fff8e8'); d(4, -2, 2, '#fff8e8'); r(-4, 3, 5, 1, '#d8d0c0'); break;
    case 'salami': d(0, 0, 5, '#b83a3a'); r(-3, -2, 1, 1, '#f0b0a0'); r(1, -3, 1, 1, '#f0b0a0'); r(2, 1, 1, 1, '#f0b0a0'); r(-2, 2, 1, 1, '#f0b0a0'); break;
    case 'mush': r(-4, -5, 8, 1, '#d8c8b0'); r(-6, -4, 12, 4, '#d8c8b0'); r(-2, 0, 4, 5, '#f4ecdc'); r(-4, -3, 2, 1, '#b8a890'); break;
    case 'ham': r(-5, -4, 10, 8, '#f08aa0'); r(-5, -4, 10, 2, '#f8c8d0'); r(-2, 0, 2, 2, '#d86a84'); break;
    case 'pine': d(0, 0, 5, '#f0c830'); d(0, 0, 1, '#b88a10'); r(-1, -7, 2, 2, '#3fae4a'); break;
    case 'olive': d(-3, 1, 3, '#2a2a3a'); d(4, -1, 3, '#2a2a3a'); r(-4, 0, 2, 2, '#b83a2a'); r(3, -2, 2, 2, '#b83a2a'); break;
    case 'pepper': r(-4, -3, 9, 8, '#3fae4a'); r(-5, -1, 11, 4, '#3fae4a'); r(-1, -6, 2, 3, '#2a6a2a'); r(-3, -2, 2, 3, '#7ad46a'); break;
    case 'oven': r(-7, -6, 14, 12, '#a8502a'); r(-7, -6, 14, 1, '#c8703a'); r(-4, -3, 8, 9, '#1a1010'); r(-3, 2, 6, 4, '#ff8a2a'); r(-1, 3, 2, 3, '#ffd23f'); break;
    case 'bun': r(-4, -6, 8, 1, '#d89a48'); r(-6, -5, 12, 5, '#d89a48'); r(-3, -4, 1, 1, '#fff0c0'); r(1, -5, 1, 1, '#fff0c0'); r(3, -3, 1, 1, '#fff0c0'); r(-6, 2, 12, 3, '#c8883a'); break;
    case 'patty': r(-6, -3, 12, 6, '#6a3a1a'); r(-5, -4, 10, 8, '#6a3a1a'); r(-4, -2, 2, 1, '#8a5a3a'); r(1, 1, 3, 1, '#4a2410'); break;
    case 'grill': r(-7, -1, 14, 6, '#4a4a58'); for (let i = -6; i < 7; i += 3) r(i, -3, 1, 2, '#9a9aa8'); r(-7, -1, 14, 1, '#ff6a2a'); r(-5, 5, 2, 2, '#333'); r(3, 5, 2, 2, '#333'); break;
    case 'cheese': r(-6, -3, 12, 7, '#ffc830'); r(-6, -3, 12, 1, '#ffe680'); r(-3, 0, 2, 2, '#d89a10'); r(2, -1, 2, 2, '#d89a10'); break;
    case 'lettuce': r(-6, -2, 12, 5, '#5ad43f'); for (let i = -6; i < 6; i += 4) { r(i, -4, 2, 2, '#5ad43f'); r(i + 2, 3, 2, 2, '#3a9a2a'); } break;
    case 'tomato': d(0, 0, 5, '#e8302a'); r(-3, -3, 2, 2, '#ff8a7a'); r(-1, -1, 2, 2, '#f8c060'); break;
    case 'onion': d(0, 0, 5, '#b07ac8'); d(0, 0, 3, '#f0e0f8'); d(0, 0, 1, '#b07ac8'); break;
    case 'bacon': r(-6, -4, 12, 2, '#b8322a'); r(-6, -2, 12, 2, '#f0c0b0'); r(-6, 0, 12, 2, '#b8322a'); r(-6, 2, 12, 2, '#f0c0b0'); break;
    case 'pickle': d(0, 0, 4, '#4a9a3a'); d(0, 0, 2, '#9ad47a'); break;
    case 'ketchup': r(-3, -2, 6, 8, '#d8201a'); r(-2, -4, 4, 2, '#d8201a'); r(-1, -7, 2, 3, '#f4f4f4'); r(-2, 0, 4, 3, '#fff'); break;
    case 'egg': r(-6, -3, 12, 7, '#fff'); r(-4, -5, 8, 10, '#fff'); d(0, 0, 2, '#ffb820'); break;
    case 'plate': d(0, 0, 6, '#f4f4f8'); d(0, 0, 4, '#d0d0e0'); d(0, 0, 3, '#f4f4f8'); break;
    case 'steak': r(-6, -3, 11, 7, '#8a3a2a'); r(-4, -5, 8, 10, '#8a3a2a'); r(4, -2, 2, 5, '#f0d8c0'); r(-3, -2, 5, 1, '#5a2014'); r(-3, 1, 5, 1, '#5a2014'); break;
    case 'lobster': r(-2, -3, 4, 8, '#e8402a'); r(-6, -6, 3, 4, '#e8402a'); r(3, -6, 3, 4, '#e8402a'); r(-4, -3, 2, 1, '#e8402a'); r(2, -3, 2, 1, '#e8402a'); r(-3, 5, 6, 2, '#c82a1a'); break;
    case 'pasta': d(0, 0, 5, '#f0d060'); r(-3, -2, 6, 1, '#c8a030'); r(-4, 1, 7, 1, '#c8a030'); r(-1, -4, 1, 8, '#c8a030'); break;
    case 'cake': r(-5, -4, 10, 3, '#4a2414'); r(-5, -1, 10, 1, '#fff0e0'); r(-5, 0, 10, 5, '#7a4428'); r(-1, -6, 2, 2, '#e8203a'); break;
    case 'stove': d(-1, 0, 5, '#3a3a46'); d(-1, 0, 3, '#6a6a78'); r(4, -1, 5, 2, '#3a3a46'); break;
    case 'potato': d(-2, 1, 3, '#e0b060'); d(3, -2, 3, '#e0b060'); r(-3, 0, 1, 1, '#b88a40'); r(3, -3, 1, 1, '#b88a40'); break;

  else if (k === 'cash') { s.tone([988, 1319], 0.1, { vol: 0.1 }); s.tone([1319, 1976], 0.2, { vol: 0.1, delay: 0.1 }); }
  else if (k === 'bell') { s.tone(1568, 0.25, { vol: 0.08, type: 'triangle' }); s.tone(1245, 0.3, { vol: 0.08, type: 'triangle', delay: 0.15 }); }
  else if (k === 'angry') s.tone([300, 150, 100], 0.5, { vol: 0.14, type: 'sawtooth' });
  else if (k === 'tick') s.tone(880, 0.06, { vol: 0.1 });
  else if (k === 'done') [523, 659, 784, 1047].forEach((f, i) => s.tone(f, 0.18, { vol: 0.1, delay: i * 0.11 }));
}

/* --- 7. INPUT AND THE MAIN LOOP ---------------------------------------------------- */
UI.onDown = () => PX.Sound.unlock();
window.addEventListener('keydown', e => {
  PX.Sound.unlock();
  if (state === 'play' && !paused && G.tutPage < 0 && G.tip === null && (e.code === 'Space' || e.code === 'Enter')) { e.preventDefault(); if (G.cook) takeOut(); else serve(); }
  else if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'play') setPause(!paused);
  else if (e.code === 'Escape') UI.back = true;
});
window.addEventListener('blur', () => setPause(true));
document.addEventListener('visibilitychange', () => { if (document.hidden) setPause(true); });

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000), t = now / 1000; last = now;
  UI.begin();
  if (state === 'title') drawTitle(t);
  else if (state === 'rests') drawRests(t);
  else if (state === 'shop') drawShop(t);
  else {
    const overlay = paused || state === 'over' || G.tutPage >= 0 || G.tip !== null;
    if (state === 'play' && !paused) step(dt);
    if (overlay) { const mx = UI.mx, my = UI.my; UI.mx = UI.my = -99; drawPlay(t); UI.list = []; UI.mx = mx; UI.my = my; } else drawPlay(t);   // the kitchen is only a picture under a panel
    if (paused) drawPause();
    else if (state === 'over') drawOver(t);
    else if (G.tip !== null) { if (infoPanel(REST_TIPS[G.tip], 'GOT IT!', t)) { save.tips[G.tip] = true; store(); G.tip = null; sfx('click'); } }
    else if (G.tut) drawTutorial(t);
  }
  UI.end();
  S.blit('#1a1030');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => { /* offline mode unavailable */ }));
}
PX.Pad.setup({
  title: 'Pixel Cook: controller', ui: UI, menu: () => true,      // everything is a button: the stick picks one, A presses it
  help: [['STICK|D-PAD', 'PICK A BUTTON'], ['A', 'PRESS IT'], ['B', 'BACK']],
});
</script>
