  #screen { position: fixed; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }

<body>
<canvas id="screen"></canvas>
<input id="name" maxlength="10" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" inputmode="text" enterkeyhint="done" aria-label="Hero name">
<script src="common.js"></script>
<script>
'use strict';
/* ==========================================================================
   PIXEL QUEST: an old-school dungeon adventure (part of the PIXEL GAMES). A proof of concept, not in the arcade's menu
   yet: it lives at /adad.
   A party of 1 to 4 heroes (FIGHTER, CLERIC, MAGE, THIEF) takes turns on one phone. The game is the dungeon master:
   it tells you where you are, you pick what the party does, and the dice decide. Every roll is shown.
   The rules are the classic 1st-level ones, cut down:
     - six abilities (STR DEX CON INT WIS CHA), 4d6 drop the lowest, put where the class needs them most
     - descending armour class (10 = no armour, lower is better) and THAC0: to hit, roll d20 + bonuses >= THAC0 - AC
     - five saving throws (POISON, WANDS, PARALYSIS, BREATH, SPELLS): roll d20 >= the number
     - ability checks: roll d20 <= the ability. Thief skills: roll d100 <= the skill
     - initiative: d10 for each side every round, low goes first. Zombies always go last
     - 0 HP: down and dying (lose 1 HP a round), -10: dead. After a won fight the downed wake up at 1 HP
     - morale: 2d10 above a monster's morale and it runs (or gives up)
     - XP for monsters beaten, and 1 XP for every gold piece brought home
   THE ADVENTURE IS DATA: ROOMS (section 5) is a list of rooms, each with its text and its choices. A choice can ask
   for a check (who tries it is up to the party), start a fight, give an item, set a flag. A new adventure is a new
   ROOMS list; new rules go into section 2.
     1. Setup   2. Rules   3. Heroes   4. The story queue   5. The adventure   6. Fights   7. Drawing   8. Screens
     9. Sound   10. Input   11. Main loop
   ========================================================================== */

/* --- 1. SETUP --------------------------------------------------------------- */
const VERSION = '0.1.0';
const SAVE_KEY = 'pixelQuest.save', GAME_KEY = 'pixelQuest.game';
const save = { sfx: true, wins: 0 };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY)) || {}); } catch (e) { /* new player */ }
const store = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* private mode */ } };
const profile = PX.Profile.get();

const canvas = document.getElementById('screen');
const S = PX.makeScreen(canvas, { H: 240, minW: 400, maxW: 560 });
const ctx = S.ctx, H = S.H;
const UI = PX.makeUI(S, canvas);
const T = (str, x, y, color = '#fff', size = 1, align = 'left', shadow = null) => PX.drawText(ctx, str, x, y, color, size, align, shadow);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rnd = n => 1 + Math.floor(Math.random() * n);                  // one die
const dice = (n, s, b = 0) => { let t = b; for (let i = 0; i < n; i++) t += rnd(s); return t; };
const pick = a => a[Math.floor(Math.random() * a.length)];

/* --- 2. RULES ----------------------------------------------------------------- */
const STATS = ['str', 'dex', 'con', 'int', 'wis', 'cha'];
const STAT_NAME = { str: 'STR', dex: 'DEX', con: 'CON', int: 'INT', wis: 'WIS', cha: 'CHA' };
// STR: to hit and damage
const strHit = s => s <= 3 ? -3 : s <= 5 ? -2 : s <= 7 ? -1 : s <= 16 ? 0 : 1;
const strDmg = s => s <= 5 ? -1 : s <= 15 ? 0 : s <= 17 ? 1 : 2;
// DEX: armour class (lower is better) and thrown weapons
const dexAC = s => s <= 3 ? 4 : s <= 5 ? 6 - s : s === 6 ? 1 : s <= 14 ? 0 : -(s - 14);
const dexMissile = s => s <= 3 ? -3 : s <= 5 ? s - 6 : s <= 15 ? 0 : s === 16 ? 1 : 2;
// CON: hit points (only fighters get more than +2)
const conHP = (s, fighter) => s <= 3 ? -2 : s <= 6 ? -1 : s <= 14 ? 0 : s === 15 ? 1 : s === 16 ? 2 : fighter ? s - 14 : 2;
// thief skills by DEX
const THIEF_DEX = { 16: [5, 0, 0, 0], 17: [10, 0, 5, 5], 18: [15, 5, 10, 10] };
const SAVE_NAMES = ['POISON', 'WANDS', 'PARALYSIS', 'BREATH', 'SPELLS'];
const SV = { poison: 0, wand: 1, para: 2, breath: 3, spell: 4 };
const CLASSES = {
  fighter: { name: 'FIGHTER', hd: 10, prime: 'str', order: ['str', 'con', 'dex', 'wis', 'cha', 'int'], armour: 4, armourName: 'CHAIN MAIL, SHIELD',
             weapon: { name: 'LONG SWORD', n: 1, s: 8, b: 0, edged: true }, saves: [14, 16, 15, 17, 17], next: 2000, col: '#e8a040' },
  cleric:  { name: 'CLERIC', hd: 8, prime: 'wis', order: ['wis', 'con', 'str', 'cha', 'dex', 'int'], armour: 4, armourName: 'CHAIN MAIL, SHIELD',
             weapon: { name: 'MACE', n: 1, s: 6, b: 1 }, saves: [10, 14, 13, 16, 15], next: 1500, col: '#f0e070', spells: ['cure', 'bless'] },
  mage:    { name: 'MAGE', hd: 4, prime: 'int', order: ['int', 'dex', 'con', 'wis', 'cha', 'str'], armour: 10, armourName: 'ROBES',
             weapon: { name: 'STAFF', n: 1, s: 6, b: 0 }, saves: [14, 11, 13, 15, 12], next: 2500, col: '#6aa8ff', spells: ['missile', 'sleep'] },
  thief:   { name: 'THIEF', hd: 6, prime: 'dex', order: ['dex', 'int', 'con', 'cha', 'str', 'wis'], armour: 8, armourName: 'LEATHER',
             weapon: { name: 'SHORT SWORD', n: 1, s: 6, b: 0, edged: true }, saves: [13, 14, 12, 16, 15], next: 1250, col: '#6ad46a' },
};
const CLASS_IDS = ['fighter', 'cleric', 'mage', 'thief'];
const SPELLS = {
  missile: { name: 'MAGIC MISSILE', target: 'foe', info: '1D4+1, NEVER MISSES' },
  sleep:   { name: 'SLEEP', target: 'none', info: '2D4 HIT DICE OF FOES FALL ASLEEP' },
  cure:    { name: 'CURE LIGHT WOUNDS', target: 'hero', info: 'HEALS 1D8', calm: true },
  bless:   { name: 'BLESS', target: 'none', info: '+1 TO HIT FOR THE PARTY' },
};
// monsters: hp = [dice, sides, bonus], dmg the same; turn = what a 1st level cleric needs on d20 to turn it
const MON = {
  rat:    { name: 'GIANT RAT', hd: 0.5, hp: [1, 4, 0], ac: 7, thac0: 20, dmg: [1, 3, 0], morale: 7, xp: 7, spr: 'rat' },
  skel:   { name: 'SKELETON', hd: 1, hp: [1, 8, 0], ac: 7, thac0: 19, dmg: [1, 6, 0], morale: 99, xp: 35, undead: true, turn: 10, halfEdged: true, spr: 'skel' },
  cent:   { name: 'CENTIPEDE', hd: 0.5, hp: [1, 3, 0], ac: 9, thac0: 20, dmg: [1, 1, 0], morale: 8, xp: 35, poison: true, spr: 'cent' },
  zomb:   { name: 'ZOMBIE', hd: 2, hp: [2, 8, 0], ac: 8, thac0: 19, dmg: [1, 8, 0], morale: 99, xp: 65, undead: true, turn: 13, slow: true, spr: 'zomb' },
  malrec: { name: 'MALREC', hd: 3, hp: [0, 0, 17], ac: 6, thac0: 18, dmg: [1, 6, 1], morale: 12, xp: 120, noSleep: true, boss: true, spr: 'cult' },
};
const ITEMS = { potion: 'HEALING POTION', holy: 'HOLY WATER', food: 'FOOD' };

/* --- 3. HEROES ------------------------------------------------------------- */
const NAMES = ['BRAN', 'MIRA', 'OSWIN', 'TESS', 'GARRICK', 'ELWYN', 'HOB', 'SABLE', 'ROWAN', 'IDA', 'CORVIN', 'NELL', 'AUGUST', 'WREN'];
function rollStats() { return Array.from({ length: 6 }, () => { const r = [rnd(6), rnd(6), rnd(6), rnd(6)].sort((a, b) => a - b); return r[1] + r[2] + r[3]; }).sort((a, b) => b - a); }
function makeHero(name, cls, vals) {
  const h = { name, cls, vals, st: {}, xp: 0, tried: {} };
  setClass(h, cls);
  return h;
}
function setClass(h, cls) {
  const C = CLASSES[cls]; h.cls = cls;
  C.order.forEach((k, i) => { h.st[k] = h.vals[i]; });
  h.max = Math.max(1, C.hd + conHP(h.st.con, cls === 'fighter'));
  h.hp = h.max;
  h.weapon = Object.assign({}, C.weapon);
  h.spellMax = cls === 'mage' ? 1 : cls === 'cleric' ? 1 + (h.st.wis >= 13 ? 1 : 0) : 0;
  h.spells = h.spellMax;
}
const acOf = h => CLASSES[h.cls].armour + dexAC(h.st.dex);
const thac0Of = () => 20;
const hitOf = h => strHit(h.st.str) + (h.weapon.hit || 0);
const dmgOf = h => strDmg(h.st.str);
const up = h => h.hp > 0 && !h.dead;                       // can act (if not held)
const alive = h => !h.dead;
function thiefSkill(h, k) {                                 // k: 0 open locks, 1 find traps, 2 move silently, 3 hide in shadows
  const base = [35, 25, 35, 25][k], adj = THIEF_DEX[Math.min(18, h.st.dex)] || [0, 0, 0, 0];
  return base + adj[k];
}
const SKILL_NAMES = ['OPEN LOCKS', 'FIND TRAPS', 'MOVE SILENTLY', 'HIDE IN SHADOWS'];
const saveOf = (h, kind) => CLASSES[h.cls].saves[SV[kind]];

/* --- 4. THE STORY QUEUE -------------------------------------------------------
   Everything the game says goes through a queue, so it shows up one piece at a time: text, a dice roll (a die spins,
   then the result), or a function to run when its turn comes (the next room, the next hero's turn...).
   The choices only show when the queue is empty. Tap to skip ahead. */
let G = null;                       // the adventure in progress (saved): heroes, gold, items, flags, room
let F = null;                       // the fight in progress (not saved)
const Q = [];
let lines = [];                     // the text panel: { txt, col }
let cur = null;                     // the queue entry being shown
let choices = [], ask = '';         // the buttons and the question above them
let die = null;                     // the big die in the picture { sides, shown, value, ok, t }
let skip = false, tapped = false;
const say = (txt, col = '#efe9ff') => Q.push({ k: 'say', txt, col });
const then = fn => Q.push({ k: 'fn', fn });
const gap = () => Q.push({ k: 'say', txt: '', col: '#fff' });
function rollFx(sides, value, txt, ok, fast) { Q.push({ k: 'roll', sides, value, txt, ok, fast }); }
// a choice somebody has to try (a check): only shown while some hero can still try it
function setChoices(q, list) { ask = q; choices = list.filter(c => c && (!c.if || c.if()) && (!c.who || G.heroes.some(h => up(h) && c.who(h) > 0))); }
const pickWho = (q, chance, fn) => ({ who: chance, act: () => choose(q, chance, fn, stay) });
function clearText() { lines = []; }

function textW() { return S.W - 146 - 8; }
function wrap(str, w) {
  const out = [];
  for (const para of String(str).toUpperCase().split('\n')) {
    let line = '';
    for (const word of para.split(' ')) {
      const t = line ? line + ' ' + word : word;
      if (line && PX.textWidth(t) > w) { out.push(line); line = word; } else line = t;
    }
    out.push(line);
  }
  return out;
}
function pump(dt) {
  for (let guard = 0; guard < 200; guard++) {
    if (!cur) {
      if (!Q.length) { skip = false; return; }
      cur = Q.shift(); cur.t = 0;
      if (cur.k === 'say') { cur.lines = wrap(cur.txt, textW()); cur.n = 0; for (const l of cur.lines) lines.push({ txt: '', col: cur.col }); cur.at = lines.length - cur.lines.length; }
      if (cur.k === 'roll') { die = { sides: cur.sides, value: cur.value, ok: cur.ok, t: 0, shown: rnd(cur.sides) }; sfx('dice'); }
    }
    cur.t += dt;
    if (cur.k === 'fn') { const fn = cur.fn; cur = null; fn(); continue; }
    if (cur.k === 'wait') { skip = false; if (!tapped) return; tapped = false; cur = null; continue; }
    if (cur.k === 'say') {
      const total = cur.txt.length, chars = skip ? total : Math.floor(cur.t * 220);
      let left = chars;
      cur.lines.forEach((l, i) => { const n = clamp(left, 0, l.length); lines[cur.at + i].txt = l.slice(0, n); left -= l.length + 1; });
      if (chars >= total) { cur = null; continue; }
      return;
    }
    if (cur.k === 'roll') {
      const dur = cur.fast ? 0.28 : 0.55;
      die.t = cur.t;
      if (cur.t < dur && !skip) { if (Math.floor(cur.t * 18) !== Math.floor((cur.t - dt) * 18)) die.shown = rnd(cur.sides); return; }
      die.shown = cur.value; die.done = true;
      lines.push({ txt: '', col: '#fff' });
      const l = wrap(cur.txt, textW());
      lines.pop();
      for (const x of l) lines.push({ txt: x, col: cur.ok === true ? '#7aea7a' : cur.ok === false ? '#ff7a6a' : '#ffd23f' });
      if (cur.ok === true) sfx('ok'); else if (cur.ok === false) sfx('bad');
      cur = null;
      continue;
    }
  }
}
const busy = () => !!cur || Q.length > 0;

// checks: they roll, show the roll, and give back true or false
function abilityChance(h, stat, mod = 0) { return clamp(h.st[stat] + mod, 1, 19) / 20; }
function checkAbility(h, stat, mod = 0) {
  const need = clamp(h.st[stat] + mod, 1, 19), r = rnd(20), ok = r <= need;
  rollFx(20, r, `${h.name}: ${STAT_NAME[stat]} CHECK, D20 = ${r} (NEED ${need} OR LESS) ${ok ? 'SUCCESS' : 'FAIL'}`, ok);
  return ok;
}
function skillChance(h, k) { return h.cls === 'thief' ? thiefSkill(h, k) / 100 : 0; }
function checkSkill(h, k) {
  const need = thiefSkill(h, k), r = rnd(100), ok = r <= need;
  rollFx(100, r, `${h.name}: ${SKILL_NAMES[k]}, D100 = ${r} (NEED ${need} OR LESS) ${ok ? 'SUCCESS' : 'FAIL'}`, ok);
  return ok;
}
function saveChance(h, kind, mod = 0) { return clamp(21 - saveOf(h, kind) + mod, 1, 20) / 20; }
function checkSave(h, kind, mod = 0, fast) {
  const need = saveOf(h, kind), r = rnd(20), ok = r + mod >= need;
  rollFx(20, r, `${h.name}: SAVE VS ${SAVE_NAMES[SV[kind]]}, D20 = ${r}${mod ? (mod > 0 ? '+' : '') + mod : ''} (NEED ${need}) ${ok ? 'SAVED' : 'FAILED'}`, ok, fast);
  return ok;
}
const pct = c => Math.round(c * 100) + '%';
// the party picks who does it: a button for every hero who can, with their chance
function choose(q, chance, fn, back) {
  const list = G.heroes.filter(h => up(h) && chance(h) > 0).map(h => ({ label: `${h.name} (${pct(chance(h))})`, act: () => fn(h) }));
  if (!list.length) { say('NOBODY IN THE PARTY CAN DO THAT.', '#ff7a6a'); then(back); return; }
  list.push({ label: 'NEVER MIND', act: back, dim: true });
  setChoices(q, list);
}
function hurt(h, n, floor1) {
  h.hp -= n;
  if (floor1 && h.hp < 1) h.hp = 1;
  if (h.hp <= -10) { h.hp = -10; h.dead = true; }
}
function giveXP(n, why) {
  const live = G.heroes.filter(alive);
  if (!live.length || n <= 0) return;
  const each = Math.floor(n / live.length);
  for (const h of live) h.xp += each;
  say(`${why}: ${each} XP FOR EVERY HERO.`, '#ffd23f');
}

/* --- 5. THE ADVENTURE: THE DROWNED BELL ---------------------------------------------
   An original intro adventure for 1st level heroes. Each room: pic (the picture), text (the first visit), again (when
   you come back), choices(). Flags (G.f) remember what happened. */
const f = () => G.f;
const n = () => G.heroes.length;
const stay = () => { store2(); showChoices(); };
function go(id) {
  // a new room: first let the party read what just happened (tap to go on), then a clean page
  if (G.room !== id && lines.some(l => l.txt)) { Q.push({ k: 'wait' }); then(() => { clearText(); enter(id); }); return; }
  if (G.room !== id) clearText();
  enter(id);
}
function enter(id) {
  const R = ROOMS[id];
  G.room = id;
  const first = !f()['seen_' + id];
  f()['seen_' + id] = 1;
  say(R.title, '#ffd23f');
  say(first || !R.again ? (typeof R.text === 'function' ? R.text() : R.text) : (typeof R.again === 'function' ? R.again() : R.again));
  if (R.enter) R.enter(first);
  then(stay);
}
function showChoices() { const R = ROOMS[G.room]; setChoices(R.ask || 'WHAT DOES THE PARTY DO?', R.choices()); }
function buy(item, price) {
  if (G.gold < price) { say(`YOU HAVE ONLY ${G.gold} GOLD.`, '#ff7a6a'); then(stay); return; }
  G.gold -= price; G.items[item]++;
  say(`YOU BUY ${ITEMS[item]}. (${G.gold} GOLD LEFT)`); sfx('coin'); then(stay);
}
function needle(h) {
  say(`A NEEDLE JABS ${h.name}'S HAND!`, '#ff7a6a');
  f().trapGone = 1;
  if (checkSave(h, 'poison')) { hurt(h, 1, true); say('JUST A SCRATCH. 1 DAMAGE.'); }
  else { const d = dice(2, 4); hurt(h, d, true); say(`THE POISON BURNS. ${d} DAMAGE.`, '#ff7a6a'); }
}
function openTrapdoor() { f().open = 1; say('THE TRAPDOOR SWINGS UP. COLD AIR AND CANDLE SMOKE RISE FROM BELOW.'); then(() => go('stairs')); }
function rest() {
  G.items.food--; f().rested = 1;
  const r = rnd(6);
  rollFx(6, r, `WANDERING MONSTERS: D6 = ${r} (1 OR 2: SOMETHING COMES)`, r > 2);
  if (r <= 2) {
    say('YOU HAVE BARELY CLOSED YOUR EYES WHEN BONES CLATTER IN THE DARK.', '#ff7a6a');
    then(() => fight({ foes: [['skel', 2]], surprise: 'foes', win: () => go('junction'), flee: () => go('altar') }));
    return;
  }
  say('YOU EAT, BANDAGE YOUR CUTS AND SLEEP IN TURNS. NOTHING COMES. SPELLS COME BACK TO THE CLERIC AND THE MAGE.');
  for (const h of G.heroes) if (alive(h)) { const d = rnd(3); h.hp = Math.min(h.max, Math.max(1, h.hp) + d); h.spells = h.spellMax; }
  then(stay);
}
function answerDoor(word) {
  if (word === 'BELL') {
    say(`"A BELL." THE BRONZE MOUTH SPEAKS THE WORD BACK, SLOWLY, AND THE DOOR GRINDS OPEN.`, '#7aea7a'); sfx('ok');
    then(() => go('bell')); return;
  }
  say(`"${word}." THE BRONZE MOUTH SPITS A JET OF ICY BLACK WATER AT THE PARTY!`, '#ff7a6a');
  f().alarm = (f().alarm || 0) + 1;
  for (const h of G.heroes) if (up(h)) { if (!checkSave(h, 'breath', 0, true)) { const d = rnd(4); hurt(h, d, true); say(`${h.name} TAKES ${d} DAMAGE.`, '#ff7a6a'); } }
  then(stay);
}
function endText() {
  const hammer = G.heroes.find(h => h.weapon.blessed && up(h));
  let t = 'YOU CUT MILA FREE. SHE HOLDS ON TO THE NEAREST HERO AND WILL NOT LET GO.\n';
  t += hammer ? `${hammer.name} LIFTS SAINT ALDER'S HAMMER AND STRIKES THE BELL. IT CRACKS WITH A SOUND LIKE A LONG SIGH, AND IS SILENT FOR GOOD.\n`
              : 'THE BELL STOPS SWINGING. FOR NOW, AT LEAST.\n';
  t += f().surrender ? 'MALREC GOES DOWN THE HILL WITH YOU, HANDS TIED, CRYING FOR HIS BROTHER.\n' : '';
  t += 'DAWN IS BREAKING WHEN YOU WALK MILA DOWN THE HILL. THE MILLER WEEPS. REEVE HOLLIS COUNTS OUT 200 GOLD.';
  return t;
}
const ROOMS = {
  inn: {
    title: 'THORNWALL, THE CROOKED LANTERN INN', pic: 'village',
    text: 'AN AUTUMN EVENING. FOR SEVEN NIGHTS A BELL HAS TOLLED UNDER THE OLD CHAPEL ON THE HILL, THOUGH ITS BELL FELL INTO THE RIVER A HUNDRED YEARS AGO.\n' +
          'LAST NIGHT MILA, THE MILLER\'S DAUGHTER, WENT UP THE HILL TO SEE. SHE DID NOT COME BACK. REEVE HOLLIS OFFERS 200 GOLD TO WHOEVER BRINGS HER HOME.',
    again: 'THE FIRE CRACKLES. UP ON THE HILL, THE BELL TOLLS AGAIN.',
    choices: () => [
      { label: 'ASK FOR RUMOURS', if: () => !f().rumour, ...pickWho('WHO ASKS AROUND? (CHA CHECK)', h => abilityChance(h, 'cha'), h => {
        if (checkAbility(h, 'cha')) {
          f().rumour = 2;
          say('OLD WREN LEANS IN. "BROTHER MALREC, THE SEXTON, WENT STRANGE WHEN HIS BROTHER DROWNED. HE KEEPS HUMMING THE OLD BELL HYMN: I HAVE A TONGUE BUT NEVER TASTE..."');
          say('"AND THE DEAD MONKS UNDER THAT CHAPEL? BLADES SLIDE OFF OLD BONES. TAKE A HAMMER."');
        } else {
          f().rumour = 1;
          say('THE FARMERS ONLY GRUMBLE ABOUT THE RATS UP IN THE CHAPEL. "BIG AS DOGS," ONE SAYS. "THEY\'LL FOLLOW ANYTHING YOU CAN EAT."');
        }
        then(stay);
      }) },
      { label: 'VISIT GRANNY SEDGE', act: () => go('shop') },
      { label: f().open ? 'BACK DOWN INTO THE CRYPT' : 'CLIMB UP TO THE CHAPEL', act: () => f().open ? (say('YOU HURRY BACK UP THE HILL AND DOWN THE CRYPT STAIRS.'), then(() => go('junction'))) : go('chapel') },
    ],
  },
  shop: {
    title: 'GRANNY SEDGE, HERB-WIFE', pic: 'shop',
    text: 'A HUT THAT SMELLS OF SMOKE AND MINT. GRANNY SEDGE LOOKS YOU OVER. "GOING UP THE HILL? THEN YOU\'LL WANT SOME OF THESE."',
    again: '"BACK ALREADY?" GRANNY SEDGE SAYS.',
    ask: () => 'WHAT DO YOU BUY?',
    choices: () => [
      { label: `HEALING POTION: 30 GOLD`, act: () => buy('potion', 30) },
      { label: `HOLY WATER: 25 GOLD`, act: () => buy('holy', 25) },
      { label: `FOOD FOR A DAY: 2 GOLD`, act: () => buy('food', 2) },
      { label: 'BACK TO THE INN', act: () => go('inn'), dim: true },
    ],

const ratsN = () => [2, 3, 4, 5][n() - 1];
const skelN = () => Math.min(4, [1, 2, 2, 3][n() - 1] + (f().alarm ? 1 : 0));
function bossFight(surprise) {
  const z = Math.min(3, [0, 1, 2, 2][n() - 1] + (f().alarm >= 2 ? 1 : 0));
  const foes = [['malrec', 1]]; if (z) foes.push(['zomb', z]);
  fight({ foes, surprise, boss: true, win: () => go('end'), flee: null });
}

/* --- 6. FIGHTS ---------------------------------------------------------------
   Every round: initiative (d10 for each side, low first; a surprise gives one side a free round). The party's heroes
   act one after another, the monsters attack, zombies always last. Downed heroes bleed 1 HP a round. */
function fight(def) {
  const foes = [];
  for (const [id, cnt] of def.foes) for (let i = 0; i < cnt; i++) {
    const M = MON[id], hp = Math.max(1, dice(M.hp[0], M.hp[1], M.hp[2]) - (M.boss ? (4 - G.heroes.length) * 3 : 0));
    foes.push(Object.assign({}, M, { id, hp, max: hp, name: M.name + (cnt > 1 ? ' ' + (i + 1) : ''), state: 'ok', fx: 0 }));
  }
  F = { def, foes, round: 0, xp: 0, bless: false, turned: {}, cast: {}, over: false };
  for (const h of G.heroes) { h.held = 0; h.hidden = false; }
  gap();
  say('FIGHT!', '#ff7a6a'); sfx('fight');
  let s = def.surprise;
  if (s === undefined || s === null && !def.boss) {
    const a = rnd(10), b = rnd(10);
    s = a <= 3 && b > 3 ? 'foes' : b <= 3 && a > 3 ? 'party' : null;
    if (s) rollFx(10, s === 'foes' ? a : b, `SURPRISE ROLL: D10 = ${s === 'foes' ? a : b} (1-3: SURPRISED). ${s === 'foes' ? 'THE PARTY IS' : 'THE MONSTERS ARE'} SURPRISED!`, s === 'party');
  }
  F.free = s || null;
  then(newRound);
}
const active = m => m.state === 'ok' || m.state === 'asleep';
const foesLeft = () => F.foes.filter(active);
function endCheck() {
  if (F.over) return true;
  if (!foesLeft().length) { F.over = true; winFight(); return true; }
  if (!G.heroes.some(up)) { F.over = true; then(() => { F = null; go('tpk'); }); return true; }
  return false;
}
function winFight() {
  gap();
  say('VICTORY!', '#7aea7a'); sfx('win');
  giveXP(F.xp, 'MONSTERS BEATEN');
  for (const h of G.heroes) {
    if (!h.dead && h.hp <= 0) { h.hp = 1; say(`${h.name} COMES TO, BRUISED BUT ALIVE. (1 HP)`); }
    h.held = 0; h.hidden = false;
  }
  const win = F.def.win;
  then(() => { F = null; win(); });
}
function newRound() {
  if (endCheck()) return;
  F.round++;
  gap();
  say(`ROUND ${F.round}`, '#c8b8ff');
  if (F.free) {
    F.order = F.free === 'party' ? ['party'] : ['foes', 'slow'];
    F.free = null;
  } else {
    const a = rnd(10), b = rnd(10);
    const partyFirst = a <= b;
    rollFx(10, a, `INITIATIVE: PARTY ${a}, MONSTERS ${b}. ${partyFirst ? 'THE PARTY GOES FIRST.' : 'THE MONSTERS GO FIRST.'}`, null, true);
    F.order = partyFirst ? ['party', 'foes', 'slow'] : ['foes', 'party', 'slow'];
  }
  F.step = -1;
  then(nextPhase);
}
function nextPhase() {
  if (endCheck()) return;
  F.step++;
  if (F.step >= F.order.length) { bleed(); then(newRound); return; }
  const p = F.order[F.step];
  if (p === 'party') { F.hi = -1; nextHero(); }
  else {
    const list = F.foes.filter(m => m.state === 'ok' && !!m.slow === (p === 'slow'));
    for (const m of list) then(() => { if (!F.over && m.state === 'ok' && !endCheck()) foeAct(m); });
    then(nextPhase);
  }
}
function nextHero() {
  if (endCheck()) return;
  for (;;) {
    F.hi++;
    if (F.hi >= G.heroes.length) { nextPhase(); return; }
    const h = G.heroes[F.hi];
    if (!up(h)) continue;
    if (h.held > 0) { h.held--; say(`${h.name} IS HELD AND CAN'T MOVE.`, '#c8b8ff'); continue; }
    heroMenu(h); return;
  }
}
const doneTurn = () => then(nextHero);
function heroMenu(h) {
  F.actor = h;
  const undead = foesLeft().some(m => m.undead && m.state === 'ok');
  const list = [
    { label: 'ATTACK', act: () => pickFoe(h, `${h.name} ATTACKS WHO?`, m => attack(h, m)) },
    { label: `CAST A SPELL (${h.spells})`, if: () => h.spells > 0, act: () => spellMenu(h) },
    { label: 'TURN UNDEAD', if: () => h.cls === 'cleric' && undead && !F.turned[h.name], act: () => turnUndead(h) },
    { label: 'HIDE IN SHADOWS', if: () => h.cls === 'thief' && !h.hidden, act: () => {
      if (checkSkill(h, 3)) { h.hidden = true; say(`${h.name} MELTS INTO THE SHADOWS. NEXT ATTACK: A BACKSTAB (+4 TO HIT, DOUBLE DAMAGE).`, '#7aea7a'); }
      else say(`${h.name} CAN'T FIND A DARK ENOUGH CORNER.`);
      doneTurn();
    } },
    { label: 'USE AN ITEM', if: () => G.items.potion > 0 || G.items.holy > 0, act: () => itemMenu(h) },
    { label: 'RUN AWAY', if: () => !!F.def.flee, dim: true, act: () => runAway() },
  ];
  setChoices(`${h.name} THE ${CLASSES[h.cls].name}: YOUR TURN`, list);
}
function back(h) { return () => heroMenu(h); }
function pickFoe(h, q, fn) {
  const list = foesLeft().map(m => ({ label: `${m.name} ${m.state === 'asleep' ? '(ASLEEP)' : ''}`, act: () => fn(m), foe: m }));
  list.push({ label: 'BACK', act: back(h), dim: true });
  setChoices(q, list);
}
function pickHero(h, q, fn, filter = up) {
  const list = G.heroes.filter(x => !x.dead && filter(x)).map(x => ({ label: `${x.name} (${x.hp}/${x.max} HP)`, act: () => fn(x) }));
  list.push({ label: 'BACK', act: back(h), dim: true });
  setChoices(q, list);
}
function attack(h, m) {
  if (m.state === 'asleep') {
    say(`${h.name} STRIKES THE SLEEPING ${m.name}. IT NEVER WAKES.`, '#7aea7a');
    kill(m); doneTurn(); return;
  }
  const back = h.hidden; h.hidden = false;
  const bonus = hitOf(h) + (F.bless ? 1 : 0) + (back ? 4 : 0), need = thac0Of(h) - m.ac, r = rnd(20), tot = r + bonus;
  const hit = r === 20 || (r !== 1 && tot >= need);
  rollFx(20, r, `${h.name}${back ? ' BACKSTABS' : ' ATTACKS'} ${m.name}: D20 ${r}${bonus ? (bonus > 0 ? '+' : '') + bonus : ''} = ${tot} (NEED ${need}) ${hit ? 'HIT!' : 'MISS'}`, hit);
  if (hit) {
    const w = h.weapon;
    let d = Math.max(1, dice(w.n, w.s, w.b) + dmgOf(h));
    if (w.blessed && m.undead) d += 2;
    if (back) d *= 2;
    if (m.halfEdged && w.edged) { d = Math.max(1, Math.floor(d / 2)); say(`THE BLADE SLIDES OFF THE BONES: HALF DAMAGE.`, '#c8b8ff'); }
    wound(m, d);
  }
  doneTurn();
}
function wound(m, d) {
  m.hp -= d; m.fx = 0.3;
  if (m.hp <= 0) { say(`${d} DAMAGE. ${m.name} ${m.undead ? 'COLLAPSES INTO BONES AND RAGS' : 'IS DEAD'}!`, '#7aea7a'); kill(m); }
  else { say(`${d} DAMAGE. (${m.name}: ${m.hp} HP LEFT)`); if (m.boss) bossMorale(m); }
  sfx('hit');
}
function kill(m) {
  m.state = 'dead'; m.hp = Math.min(m.hp, 0); F.xp += m.xp;
  if (m.boss) {
    say('AS MALREC FALLS, THE BELL GOES QUIET, AND THE DROWNED SINK BACK INTO THE POOL.', '#7aea7a');
    for (const o of F.foes) if (active(o)) { o.state = 'gone'; F.xp += o.xp; }
    return;
  }
  morale();
}
// when the first of a group falls, and when half are gone: 2d10 over their morale and the rest run
function morale() {
  const all = F.foes.filter(m => !m.boss), left = all.filter(active), lost = all.length - left.length;
  if (!left.length || left[0].morale >= 99 || left.some(m => m.boss)) return;
  const key = lost === 1 ? 'first' : lost * 2 >= all.length ? 'half' : null;
  if (!key || F['m_' + key]) return;
  F['m_' + key] = 1;
  const r = dice(2, 10), M = left[0].morale;
  rollFx(20, r, `MORALE: 2D10 = ${r} (OVER ${M}: THEY RUN) ${r > M ? 'THEY FLEE!' : 'THEY STAND.'}`, r > M);
  if (r > M) for (const m of left) { m.state = 'gone'; F.xp += Math.floor(m.xp / 2); }
}
function bossMorale(m) {
  if (F.m_boss || m.hp * 2 > m.max) return;
  F.m_boss = 1;
  const r = dice(2, 10);
  rollFx(20, r, `MALREC'S MORALE: 2D10 = ${r} (OVER ${m.morale}: HE GIVES UP) ${r > m.morale ? 'HE GIVES UP!' : 'HE FIGHTS ON.'}`, r > m.morale);
  if (r > m.morale) {
    say('MALREC DROPS HIS MACE AND FALLS TO HIS KNEES. "ENOUGH... I ONLY WANTED MY BROTHER BACK." THE BELL STOPS. THE DROWNED SINK INTO THE POOL.', '#7aea7a');
    f().surrender = 1;
    for (const o of F.foes) if (active(o)) { o.state = 'gone'; F.xp += o.xp; }
  }
}
function spellMenu(h) {

function castSpell(h, id) {
  const sp = SPELLS[id];
  if (sp.target === 'foe') { pickFoe(h, `${sp.name} AT WHO?`, m => { h.spells--; sfx('spell'); const d = dice(1, 4, 1); say(`${h.name} CASTS ${sp.name}. A BOLT OF LIGHT STRIKES ${m.name}.`, '#6aa8ff'); if (m.state === 'asleep') m.state = 'ok'; wound(m, d); doneTurn(); }); return; }
  if (sp.target === 'hero') { pickHero(h, `${sp.name} ON WHO?`, x => { h.spells--; sfx('spell'); cure(h, x); doneTurn(); }, x => x.hp < x.max); return; }
  h.spells--; sfx('spell');
  if (id === 'bless') { F.bless = true; say(`${h.name} CASTS BLESS. A WARM LIGHT: +1 TO HIT FOR THE PARTY FOR THE REST OF THE FIGHT.`, '#6aa8ff'); doneTurn(); return; }
  if (id === 'sleep') {
    let hd = dice(2, 4);
    rollFx(8, hd, `${h.name} CASTS SLEEP: 2D4 = ${hd} HIT DICE OF MONSTERS.`, null);
    const list = foesLeft().filter(m => m.state === 'ok').sort((a, b) => a.hd - b.hd);
    let slept = 0;
    for (const m of list) {
      if (m.undead || m.noSleep) { say(`${m.name} DOESN'T SLEEP${m.undead ? ': THE DEAD NEVER DO' : ': HIS AMULET GLOWS'}.`, '#c8b8ff'); continue; }
      const c = Math.max(1, Math.ceil(m.hd));
      if (c > hd) break;
      hd -= c; m.state = 'asleep'; slept++;
      say(`${m.name} FALLS ASLEEP.`, '#6aa8ff');
    }
    if (!slept) say('NOTHING FALLS ASLEEP.');
    doneTurn();
  }
}
function cure(h, x) {
  const d = dice(1, 8), was = x.hp;
  x.hp = Math.min(x.max, x.hp + d);
  say(`${h.name} CASTS CURE LIGHT WOUNDS ON ${x.name}: +${x.hp - was} HP (${x.hp}/${x.max}).`, '#6aa8ff');
}
function turnUndead(h) {
  F.turned[h.name] = 1;
  const und = foesLeft().filter(m => m.undead && m.state === 'ok').sort((a, b) => a.turn - b.turn);
  const need = und[0].turn, r = rnd(20), ok = r >= need;
  rollFx(20, r, `${h.name} RAISES THE HOLY SYMBOL: TURN UNDEAD, D20 = ${r} (NEED ${need}) ${ok ? 'SUCCESS!' : 'FAIL'}`, ok);
  if (ok) {
    let k = dice(2, 6);
    say(`"BEGONE!" (2D6 = ${k}: SO MANY UNDEAD TURN)`, '#f0e070');
    for (const m of und) { if (k <= 0 || m.turn > need) break; m.state = 'gone'; F.xp += m.xp; k--; say(`${m.name} FLEES FROM THE LIGHT.`, '#7aea7a'); }
  } else say('THE DEAD KEEP COMING.');
  doneTurn();
}

function runAway() {
  say('THE PARTY RUNS! THE MONSTERS GET A PARTING BLOW.', '#ff7a6a');
  F.over = true;
  for (const m of F.foes.filter(x => x.state === 'ok')) foeAttack(m, true);
  const flee = F.def.flee;
  then(() => {
    F = null;
    if (!G.heroes.some(up)) { go('tpk'); return; }
    for (const h of G.heroes) if (!h.dead && h.hp <= 0) h.hp = 1;
    flee();
  });
}
function targetHero() {
  const live = G.heroes.filter(up);
  if (!live.length) return null;
  const front = live.slice(0, 2);
  return Math.random() < 0.7 ? pick(front) : pick(live);
}
function foeAct(m) {
  if (m.boss) {
    if (!F.cast.hold) {
      F.cast.hold = 1;
      const h = targetHero();
      say(`MALREC POINTS AT ${h.name}: "BE STILL!" (HOLD PERSON)`, '#c06aff'); sfx('spell');
      if (!checkSave(h, 'spell')) { h.held = 2; say(`${h.name} FREEZES, HELD FOR 2 ROUNDS.`, '#ff7a6a'); } else say(`${h.name} SHAKES IT OFF.`);
      return;
    }
    if (!F.cast.wound) {
      F.cast.wound = 1;
      say('MALREC\'S HAND GLOWS BLACK: CAUSE WOUNDS!', '#c06aff');
      foeAttack(m, false, [1, 8, 0]);
      return;
    }
  }
  foeAttack(m);
}
function foeAttack(m, fast, dmg) {
  const h = targetHero();
  if (!h) return;
  const ac = acOf(h), need = m.thac0 - ac, bonus = h.held ? 4 : 0, r = rnd(20), hit = r === 20 || (r !== 1 && r + bonus >= need);
  rollFx(20, r, `${m.name} ATTACKS ${h.name}: D20 ${r}${bonus ? '+4 (HELD)' : ''} (NEED ${need}) ${hit ? 'HIT' : 'MISS'}`, !hit, true);
  if (!hit) return;
  const D = dmg || m.dmg, d = Math.max(1, dice(D[0], D[1], D[2]));
  hurt(h, d);
  sfx('ouch');
  if (h.dead) say(`${d} DAMAGE. ${h.name} IS DEAD.`, '#ff3a3a');
  else if (h.hp <= 0) say(`${d} DAMAGE. ${h.name} FALLS AND LIES BLEEDING! (${h.hp} HP)`, '#ff7a6a');
  else say(`${d} DAMAGE TO ${h.name}. (${h.hp}/${h.max} HP)`, '#ffaa8a');
  if (m.poison && h.hp > 0) {
    if (!checkSave(h, 'poison', 4, true)) { const p = rnd(3); hurt(h, p); say(`POISON! ${p} MORE DAMAGE.`, '#ff7a6a'); }
  }
}
function bleed() {
  for (const h of G.heroes) if (!h.dead && h.hp <= 0) {
    hurt(h, 1);
    say(h.dead ? `${h.name} HAS BLED TO DEATH.` : `${h.name} IS BLEEDING: ${h.hp} HP. (-10 IS DEATH)`, '#ff3a3a');
  }
}

function sfx(k) {
  if (!save.sfx) return;
  const s = PX.Sound;
  if (k === 'click') s.tone(660, 0.05, { vol: 0.05 });
  else if (k === 'dice') { s.noise(0.08, { vol: 0.05 }); s.noise(0.06, { vol: 0.04, delay: 0.1 }); }
  else if (k === 'ok') s.tone([523, 784], 0.12, { vol: 0.06 });
  else if (k === 'bad') s.tone([300, 200], 0.15, { vol: 0.06 });
  else if (k === 'hit') s.tone([180, 90], 0.12, { vol: 0.1, type: 'sawtooth' });
  else if (k === 'ouch') s.tone([140, 70], 0.15, { vol: 0.1, type: 'sawtooth' });
  else if (k === 'spell') s.tone([400, 1200, 800], 0.3, { vol: 0.06, type: 'triangle' });
  else if (k === 'coin') { s.tone(988, 0.06, { vol: 0.06 }); s.tone(1319, 0.1, { vol: 0.06, delay: 0.07 }); }
  else if (k === 'fight') s.tone([220, 330, 220], 0.3, { vol: 0.08, type: 'sawtooth' });
  else if (k === 'win') [523, 659, 784, 1047].forEach((fq, i) => s.tone(fq, 0.15, { vol: 0.06, delay: i * 0.1 }));
  else if (k === 'lose') [392, 330, 262, 196].forEach((fq, i) => s.tone(fq, 0.3, { vol: 0.07, delay: i * 0.25, type: 'triangle' }));
}

/* --- 10. INPUT: tap a button; tap anywhere else to skip the text. Keys: 1-8 pick, Space/Enter skip, Esc menu --- */
UI.onDown = () => { PX.Sound.unlock(); if (state === 'play' && busy() && UI.downId === null && !sheet && !menu) { if (cur && cur.k === 'wait') tapped = true; else skip = true; } };
window.addEventListener('keydown', e => {
  PX.Sound.unlock();
  if (naming >= 0) return;
  if (state === 'play' && !sheet && !menu) {
    if (/^Digit[1-8]$/.test(e.code)) { choose1(+e.code.slice(5) - 1); return; }
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if (cur && cur.k === 'wait') tapped = true; else if (busy()) skip = true; return; }
  }
  if (e.code === 'Escape') { if (state === 'play' && !sheet && !menu) menu = true; else UI.back = true; }
});

/* --- 11. MAIN LOOP ---------------------------------------------------------------------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000), t = now / 1000; last = now;
  UI.begin();
  if (state === 'play' && G) {
    if (!menu && !sheet) pump(dt);
    if (die && !busy()) die.t += dt;
    drawPlay(t);
  } else if (state === 'setup') drawSetup(t);
  else if (state === 'rules') drawRules(t);
  else drawTitle(t);
  UI.end();
  S.blit('#0d0b13');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => { /* offline mode unavailable */ }));
}
</script>
