<body>
<canvas id="screen"></canvas>
<input id="code" maxlength="4" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" inputmode="text" aria-label="Room code">
<script src="common.js"></script>
<script>
'use strict';
/* ==========================================================================
   PIXEL SKY GP: Pixel GP with flying cars (part of the PIXEL ARCADE).
   The same pseudo-3D idea as Pixel GP: the skyway is a list of short segments,
   each projected from 3D to the screen every frame. New here: every car also
   has an ALTITUDE, so you steer left / right AND climb / dive.
     1. Setup        2. Track        3. Sprites      4. Race logic
     5. Drawing      6. Online       7. Screens      8. Main loop
   ========================================================================== */
const VERSION = '1.3.0';
let skyGrad = null, bgOffset = 0;   // sky gradient (rebuilt on resize or a new track) and how far the background has scrolled
const canvas = document.getElementById('screen');
const S = PX.makeScreen(canvas, { H: 240, minW: 400, maxW: 560, onResize: () => { skyGrad = null; } });
const ctx = S.ctx, H = S.H;
const UI = PX.makeUI(S, canvas);
const T = (str, x, y, color = '#fff', size = 1, align = 'left', shadow = null) => PX.drawText(ctx, str, x, y, color, size, align, shadow);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const fmt = t => { if (!isFinite(t) || t <= 0) return '--:--.-'; const m = Math.floor(t / 60), s = t % 60; return String(m).padStart(2, '0') + ':' + s.toFixed(1).padStart(4, '0'); };
const profile = PX.Profile.load();
const SAVE_KEY = 'pixelSkyGP.save';
let save = { best: {}, bestRace: 0, wins: 0, races: 0, music: true, engine: false,   // engine sound: off unless you switch it on
             track: 'cloud', tiers: {}, cars: ['classic'], car: 'classic', paints: [], paint: 'auto' };   // the garage
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY)) || {}); } catch (e) { /* new player */ }
const store = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* private mode */ } };
if (!save.tiers || typeof save.tiers !== 'object') save.tiers = {};
if (!save.best || typeof save.best !== 'object') save.best = {};
if (!Array.isArray(save.cars)) save.cars = ['classic'];
if (!Array.isArray(save.paints)) save.paints = [];

/* --- GARAGE: abilities, car designs and paint, bought with the arcade's ★ (one wallet for all the games) --- */
const ABILITIES = [
  { id: 'nitro', name: 'NITRO', color: '#2ad4c4', prices: [40, 90, 160], active: true, key: '1',
    stat: t => ({ uses: t }), desc: s => s.uses + ' BOOST' + (s.uses > 1 ? 'S' : '') + ' PER RACE' },
  { id: 'shield', name: 'SHIELD', color: '#58e0a0', prices: [60, 150], active: true, key: '2',
    stat: t => ({ uses: t }), desc: s => 'BLOCKS ' + s.uses + ' HIT' + (s.uses > 1 ? 'S' : '') },
  { id: 'armor', name: 'ARMOR', color: '#ff3b5a', prices: [80, 200],
    stat: t => ({ hp: HEARTS + t }), desc: s => s.hp + ' HEARTS' },
  { id: 'grip', name: 'FINS', color: '#ffd23f', prices: [50, 110, 220],
    stat: t => ({ k: [0.8, 0.65, 0.5][t - 1] }), desc: s => Math.round((1 - s.k) * 100) + '% LESS DRIFT IN CURVES' },
  { id: 'magnet', name: 'MAGNET', color: '#9a5ae0', prices: [60, 140],
    stat: t => ({ w: [2, 3][t - 1] }), desc: s => 'GRABS STARS ' + s.w + 'X WIDER' },
];
const ABIL = Object.fromEntries(ABILITIES.map(a => [a.id, a]));
// a pixel icon for each ability ('#' = the ability's color)
const ABIL_ICONS = {
  nitro:  ['....##.', '...##..', '..##...', '.#####.', '...##..', '..##...', '.##....', '##.....'],
  shield: ['.#####.', '##w####', '#w#####', '#######', '#######', '.#####.', '..###..', '...#...'],
  armor:  ['.##.##.', '#w#####', '#######', '#######', '.#####.', '..###..', '...#...'],
  grip:   ['...#...', '..##...', '.###...', '####ggg', '####ggg', '.###...', '..##...', '...#...'],
  magnet: ['ww...ww', '##...##', '##...##', '##...##', '###.###', '.#####.', '..###..'],
};
function abilIcon(id, cx, cy, s, color) { PX.drawIcon(ctx, ABIL_ICONS[id], { '#': color || ABIL[id].color, w: '#ffffff', g: '#7a7a8a' }, cx, cy, s); }
const tierOf = id => Math.max(0, Math.min(ABIL[id].prices.length, save.tiers[id] | 0));
const stat = id => tierOf(id) ? ABIL[id].stat(tierOf(id)) : null;
const CARS = [
  { id: 'classic', name: 'CLASSIC', price: 0 }, { id: 'stripe', name: 'STRIPE', price: 60 }, { id: 'checker', name: 'CHECKER', price: 90 },
  { id: 'flames', name: 'FLAMES', price: 140 }, { id: 'bolt', name: 'LIGHTNING', price: 180 }, { id: 'gold', name: 'GOLD', price: 300 },
];
const PAINTS = ['#e01e1e', '#ff8a1f', '#ffd23f', '#5ad43f', '#1f8a4a', '#2ad4c4', '#2a7fd4', '#1d3f8f', '#9a5ae0', '#ff6fb0', '#f2f2f2', '#3a3a46'];
const PAINT_PRICE = 25;
const myColor = () => save.paint !== 'auto' && save.paints.includes(save.paint) ? save.paint : PX.AVATAR_COLORS[profile.avatar.color] || '#2a7fd4';
const myCar = () => save.cars.includes(save.car) ? save.car : 'classic';

/* --- 1. SETUP --------------------------------------------------------------- */
const SEG = 200;                        // length of one skyway segment
const RUMBLE = 3;                       // segments per light / dark stripe
const ROAD_W = 2000;                    // half the skyway's width
const LANES = 3;
const CAM_H = 1000, FOV = 100, DRAW_DIST = 220, FOG = 5;
const CAM_DEPTH = 1 / Math.tan((FOV / 2) * Math.PI / 180);
const PLAYER_Z = CAM_H * CAM_DEPTH * 2.3;// how far in front of the camera your car is
const CAM_LIFT = 0.9;                   // the camera climbs with your car, so you always see what's ahead at your height
const MAX_SPEED = SEG * 52;
const ACCEL = MAX_SPEED / 5, BRAKE = -MAX_SPEED * 0.6, DECEL = -MAX_SPEED / 5;
const OFFROAD_DECEL = -MAX_SPEED / 2, OFFROAD_LIMIT = MAX_SPEED / 3, CENTRIFUGAL = 0.22;
const LAPS = 3;
const HEARTS = 3;                       // hits your car takes before it's wrecked (ARMOR adds more)
const HURT_TIME = 1.5;                  // after a hit nothing can hurt you for a moment
const CAR_W = 520, CAR_H = 300;         // a car's width and height
// ALTITUDE: how high a car's belly is above the skyway. Things in the air sit on three levels.
const ALT_MIN = 40, ALT_MAX = 1040, ALT_RATE = 1300;
const LEVELS = [90, 540, 990];
const LEVEL_NAMES = ['LOW', 'MID', 'HIGH'];

/* --- 2. TRACKS: built from straights, curves and hills ------------------------ */
// layout: [segments in, hold, out, curve, height]; height null = back down to the start
const CIRCUITS = [
  { id: 'cloud', name: 'CLOUD CITY', accent: '#ff8a5a',
    sky: ['#2b1a5e', '#ff9a6a'], sea: ['#f2bcc6', '#e8acbc'], road: ['#2c315e', '#272b54'], edge: ['#2ad4c4', '#f4f4f4'], lane: '#8adcff', fog: '#ffae8a',
    city: ['#8a4a8a', '#4a2a68'], win: '#ffd890', orb: { c: '#fff0c0', x: 0.72, y: 78, r: 12 }, stars: 0,
    layout: [[25, 25, 25, 0, 0], [30, 40, 30, 2, 25], [25, 25, 25, 0, -15], [30, 30, 30, -3, 10], [20, 20, 20, 2, 0], [20, 20, 20, -2, -20],
             [40, 50, 40, 0, 30], [30, 50, 30, -4, 0], [25, 25, 25, 0, -40], [25, 25, 25, 0, 20], [30, 40, 30, 3, 0], [20, 20, 20, -3, 25],
             [30, 30, 30, 3, -25], [40, 60, 40, 0, 0], [25, 40, 25, 5, 0], [30, 30, 30, -4, 20], [20, 20, 20, 0, -20], [40, 40, 40, -2, null], [25, 25, 25, 0, 0]] },
  { id: 'neon', name: 'NEON NIGHT', accent: '#ff3ad0',
    sky: ['#04041a', '#3a1a6a'], sea: ['#1c1c46', '#18183e'], road: ['#0e0e26', '#0a0a20'], edge: ['#ff3ad0', '#2ad4c4'], lane: '#ff3ad0', fog: '#2c1658',
    city: ['#241a5a', '#120e34'], win: '#7af0ff', orb: { c: '#e8ecff', x: 0.25, y: 40, r: 9 }, stars: 60,
    layout: [[25, 25, 25, 0, 0], [20, 30, 20, -3, 0], [20, 30, 20, 3, 20], [20, 20, 20, -4, 0], [20, 20, 20, 4, -20], [40, 40, 40, 0, 40],
             [25, 45, 25, 5, 0], [30, 30, 30, 0, -40], [20, 25, 20, -3, 0], [20, 25, 20, 3, 0], [20, 25, 20, -3, 15], [50, 60, 50, 0, -15],
             [25, 45, 25, -5, 0], [20, 20, 20, 2, 30], [20, 20, 20, -2, 0], [30, 40, 30, 4, -30], [30, 30, 30, 0, 0], [40, 40, 40, -2, null], [25, 25, 25, 0, 0]] },
  { id: 'bay', name: 'SUNRISE BAY', accent: '#5ab8ff',
    sky: ['#3a8ad8', '#d4f0ff'], sea: ['#ffffff', '#eaf2fb'], road: ['#4a5a7e', '#445476'], edge: ['#ff8a1f', '#f4f4f4'], lane: '#ffffff', fog: '#d4f0ff',
    city: ['#8aa8d0', '#5a78a8'], win: '#fff6c0', orb: { c: '#fff6c0', x: 0.5, y: 96, r: 16 }, stars: 0,
    layout: [[25, 25, 25, 0, 0], [40, 60, 40, 0, 50], [40, 60, 40, 1.5, -50], [30, 40, 30, -2, 40], [30, 30, 30, 0, -60], [30, 50, 30, 3, 20],
             [50, 70, 50, 0, 0], [30, 40, 30, -3, 40], [25, 25, 25, 0, -40], [30, 50, 30, -4, 0], [40, 40, 40, 0, 60], [40, 40, 40, 2, -60],
             [20, 20, 20, -2, 0], [20, 20, 20, 2, 0], [40, 60, 40, 0, 30], [30, 40, 30, 4, 0], [40, 40, 40, -1.5, null], [25, 25, 25, 0, 0]] },
];
const circuitOf = id => CIRCUITS.find(c => c.id === id) || CIRCUITS[0];
let circuit = circuitOf(save.track);
let segments = [], trackLength = 0;
const lastY = () => segments.length ? segments[segments.length - 1].p2.world.y : 0;
function addSegment(curve, y) {
  const n = segments.length;
  segments.push({ index: n, curve, sprites: [], cars: [], dark: Math.floor(n / RUMBLE) % 2 === 1,
                  p1: { world: { y: lastY(), z: n * SEG }, camera: {}, screen: {} },
                  p2: { world: { y, z: (n + 1) * SEG }, camera: {}, screen: {} } });
}
const easeIn = (a, b, p) => a + (b - a) * p * p;
const easeInOut = (a, b, p) => a + (b - a) * (-Math.cos(p * Math.PI) / 2 + 0.5);
function addRoad(enter, hold, leave, curve, height) {
  const y0 = lastY(), y1 = y0 + height * SEG, total = enter + hold + leave;
  for (let n = 0; n < enter; n++) addSegment(easeIn(0, curve, n / enter), easeInOut(y0, y1, n / total));
  for (let n = 0; n < hold; n++) addSegment(curve, easeInOut(y0, y1, (enter + n) / total));
  for (let n = 0; n < leave; n++) addSegment(easeInOut(curve, 0, n / leave), easeInOut(y0, y1, (enter + hold + n) / total));
}
function rng(seed) { return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function buildTrack(seed = 1, id = save.track) {
  circuit = circuitOf(id); skyGrad = null;
  segments = [];
  for (const [a, b, c, curve, h] of circuit.layout) addRoad(a, b, c, curve, h === null ? -lastY() / SEG : h);
  for (const n of [2, 3]) segments[n].start = true;
  trackLength = segments.length * SEG;
  // scenery: towers that poke out of the clouds, masts, balloons
  const r = rng(7 + circuit.layout.length);
  const put = (n, kind, offset, alt = 0, lvl = -1) => { if (segments[n]) segments[n].sprites.push({ kind, offset, alt, lvl }); };
  put(4, 'flag', -1.15); put(4, 'flag', 1.15);
  for (let n = 12; n < segments.length; n += 6) {
    for (const side of [-1, 1]) {
      const v = r();
      if (v < 0.45) put(n, v < 0.2 ? 'tower' : v < 0.34 ? 'tower2' : 'mast', side * (1.6 + r() * 2.4));
      else if (v < 0.52) put(n, 'balloon', side * (2.6 + r() * 3), 500 + r() * 2600);
    }
  }
  for (let n = 40; n < segments.length - 20; n += 140) put(n, 'board', n % 280 ? 1.3 : -1.3);
  for (const s of segments) if (Math.abs(s.curve) > 2.5 && s.index % 8 === 0) put(s.index, s.curve > 0 ? 'chevR' : 'chevL', s.curve > 0 ? -1.15 : 1.15);   // outside of the tight corners
  // in the air: mines, storm clouds and laser gates to dodge, boost rings and stars to fly through, now and then a wrench
  const o = rng(seed * 7919 + 13), LANE = [-0.62, 0, 0.62];
  const cell = (n, kind, lane, lvl) => put(n, kind, kind === 'gate' ? 0 : LANE[lane], LEVELS[lvl] + CAR_H / 2 - SPR[kind].h / 2, lvl);
  for (let n = 90; n < segments.length - 40; n += 52 + Math.floor(o() * 50)) {   // more than a second apart at full speed
    const bend = [0, 10, 20].some(k => Math.abs((segments[n + k] || segments[n]).curve) > 2.4);   // in the tight corners: only stars
    const v = bend ? 0.1 + o() * 0.16 : o(), lane = bend ? 1 : Math.floor(o() * 3), lvl = Math.floor(o() * 3);
    if (v < 0.1) { cell(n, 'wrench', lane, lvl); continue; }
    if (v < 0.26) {                                               // an arc of stars from one level to another
      const to = (lvl + 1 + Math.floor(o() * 2)) % 3;
      for (let k = 0; k < 10; k++) put(n + k * 3, 'star', LANE[lane], lerp(LEVELS[lvl], LEVELS[to], 0.5 - 0.5 * Math.cos(k / 9 * Math.PI)));
      continue;
    }
    if (v < 0.48) { cell(n, 'ring', lane, lvl); for (let k = 0; k < 3; k++) put(n + 10 + k * 3, 'star', LANE[lane], LEVELS[lvl]); continue; }
    if (v < 0.56) { cell(n, 'storm', lane, lvl); continue; }
    if (v < 0.72) {                                               // a laser gate across the whole skyway: one level (sometimes two) is closed
      const second = o() < 0.12 ? (lvl + 1 + Math.floor(o() * 2)) % 3 : -1;
      cell(n, 'gate', 1, lvl); if (second >= 0) cell(n, 'gate', 1, second);
      const open = [0, 1, 2].filter(l => l !== lvl && l !== second), free = open[Math.floor(o() * open.length)];
      if (o() < 0.6) for (let k = 0; k < 5; k++) put(n + 6 + k * 3, 'star', LANE[lane], LEVELS[free]);
      continue;
    }
    const used = new Set();                                       // 1 or 2 mines: 9 places, at least 7 stay free
    for (let k = 1 + Math.floor(o() * 2); k > 0; k--) { const c = Math.floor(o() * 9); if (!used.has(c)) { used.add(c); cell(n, 'mine', c % 3, Math.floor(c / 3)); } }
  }
}
const findSegment = z => segments[Math.floor(z / SEG) % segments.length];
const increase = (start, inc, max) => { let r = start + inc; while (r >= max) r -= max; while (r < 0) r += max; return r; };
const percentRemaining = (n, total) => (n % total) / total;

/* --- 3. SPRITES (pixel art drawn in code) ----------------------------------- */
function sprite(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d')); return c; }
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  return '#' + [n >> 16 & 255, n >> 8 & 255, n & 255].map(v => Math.min(255, Math.round(v * k)).toString(16).padStart(2, '0')).join('');
}
// A flying car seen from behind: the wheels are folded flat into hover pods. turn: -1 left, 0 straight, 1 right.
const carCache = {};
function carSprite(color, turn = 0, deco = 'classic') {
  if (deco === 'gold') color = '#e0b030';
  const key = color + turn + deco;
  if (carCache[key]) return carCache[key];
  return (carCache[key] = sprite(36, 22, g => {
    const dark = '#16161c', b = shade(color, 0.7), t = turn;
    for (const wx of [0, 28]) {                                                        // hover pods, glowing underneath
      g.fillStyle = dark; g.fillRect(wx + t, 11, 8, 6);
      g.fillStyle = '#3a3a46'; g.fillRect(wx + 1 + t, 12, 6, 1); g.fillRect(wx + 1 + t, 14, 6, 1);
      g.fillStyle = '#b8f8ff'; g.fillRect(wx + 1 + t, 17, 6, 1);
      g.fillStyle = '#2ad4c4'; g.fillRect(wx + 2 + t, 18, 4, 1);
    }
    g.fillStyle = b; g.fillRect(7 + t, 13, 22, 2);                                      // stub wings
    g.fillStyle = dark; g.fillRect(8 + t * 2, 2, 2, 9); g.fillRect(26 + t * 2, 2, 2, 9); // tail fins
    g.fillStyle = color; g.fillRect(8 + t * 2, 1, 2, 3); g.fillRect(26 + t * 2, 1, 2, 3);
    g.fillStyle = color; g.fillRect(11 + t, 8, 14, 9); g.fillRect(9 + t, 11, 18, 5);   // body
    g.fillStyle = b; g.fillRect(9 + t, 15, 18, 1); g.fillRect(11 + t, 16, 14, 1);
    if (deco === 'stripe') { g.fillStyle = '#f4f4f4'; g.fillRect(17 + t, 8, 2, 9); }
    else if (deco === 'checker') { for (let y = 10; y < 16; y += 2) for (let x = 9; x < 27; x += 2) { g.fillStyle = ((x + y) >> 1) % 2 ? '#111' : '#f4f4f4'; g.fillRect(x + t, y, 2, 2); } }
    else if (deco === 'flames') { g.fillStyle = '#ffd23f'; g.fillRect(9 + t, 13, 4, 2); g.fillRect(23 + t, 13, 4, 2); g.fillStyle = '#ff5a1a'; g.fillRect(10 + t, 11, 3, 2); g.fillRect(23 + t, 11, 3, 2); g.fillRect(12 + t, 9, 2, 2); g.fillRect(22 + t, 9, 2, 2); }
    else if (deco === 'bolt') { g.fillStyle = '#ffd23f'; g.fillRect(11 + t, 9, 3, 2); g.fillRect(22 + t, 9, 3, 2); g.fillRect(10 + t, 11, 2, 2); g.fillRect(24 + t, 11, 2, 2); }
    else if (deco === 'gold') { g.fillStyle = '#fff6c0'; g.fillRect(11 + t, 9, 2, 6); g.fillRect(13 + t, 9, 1, 2); }
    g.fillStyle = dark; g.fillRect(13 + t, 3, 10, 6);                                   // glass bubble with the driver's helmet
    g.fillStyle = '#7ad8ff'; g.fillRect(14 + t, 4, 8, 5);
    g.fillStyle = '#d8f4ff'; g.fillRect(14 + t, 4, 3, 1); g.fillRect(14 + t, 5, 1, 2);
    g.fillStyle = '#ffd23f'; g.fillRect(16 + t, 5, 4, 3);
    g.fillStyle = dark; g.fillRect(16 + t, 7, 4, 1);
    for (const nx of [12, 20]) {                                                        // two thrusters
      g.fillStyle = dark; g.fillRect(nx + t, 11, 4, 4);
      g.fillStyle = '#ff8a1f'; g.fillRect(nx + 1 + t, 12, 2, 2);
      g.fillStyle = '#fff6c0'; g.fillRect(nx + 1 + t, 12, 1, 1);
    }
    g.fillStyle = '#ff3030'; g.fillRect(17 + t, 12, 2, 2);                              // tail light
  }));
}
const SPR = {
  // scenery next to the skyway: fly into it and it costs a heart
  tower: { w: 1500, img: sprite(22, 60, g => {
    const r = rng(3);
    g.fillStyle = '#9aa8c8'; g.fillRect(10, 0, 1, 8); g.fillStyle = '#ff3030'; g.fillRect(10, 0, 1, 1);
    g.fillStyle = '#1d2248'; g.fillRect(3, 8, 16, 52); g.fillRect(6, 5, 10, 3);
    g.fillStyle = '#2c3468'; g.fillRect(3, 8, 3, 52);
    for (let y = 11; y < 58; y += 4) for (let x = 7; x < 17; x += 3) { if (r() < 0.55) { g.fillStyle = r() < 0.8 ? '#ffd890' : '#7af0ff'; g.fillRect(x, y, 2, 2); } }
  }) },
  tower2: { w: 1900, img: sprite(28, 46, g => {
    const r = rng(5);
    g.fillStyle = '#3a2a5e'; g.fillRect(2, 6, 24, 40); g.fillRect(8, 0, 12, 6);
    g.fillStyle = '#4c3a78'; g.fillRect(2, 6, 24, 2); g.fillRect(8, 0, 12, 1);
    g.fillStyle = '#2ad4c4'; g.fillRect(2, 20, 24, 1);
    for (let y = 10; y < 44; y += 4) for (let x = 4; x < 24; x += 3) { if (y !== 18 && r() < 0.5) { g.fillStyle = '#ffd890'; g.fillRect(x, y, 2, 2); } }
  }) },
  mast: { w: 320, img: sprite(7, 40, g => {
    g.fillStyle = '#9aa8c8'; g.fillRect(3, 2, 1, 38); for (let y = 8; y < 40; y += 8) g.fillRect(1, y, 5, 1);
    g.fillStyle = '#ff3030'; g.fillRect(2, 0, 3, 3); g.fillStyle = '#ffb0b0'; g.fillRect(3, 1, 1, 1);

/* --- 6. ONLINE: race a friend (the same free PeerJS server as the other games) ---------- */
const Net = {
  peer: null, conn: null, live: false, isHost: false, code: '', screen: 'home', msg: '', friend: null, sendT: 0, wait: false,
  reset() { try { if (this.peer) this.peer.destroy(); } catch (e) { /* gone */ } this.peer = null; this.conn = null; this.live = false; this.code = ''; this.friend = null; this.screen = 'home'; this.msg = ''; PX.Bet.reset(); },
  fail(msg) { this.reset(); this.screen = 'error'; this.msg = msg; },
  opts() { return { debug: 0, config: { iceServers: PX.ICE_SERVERS } }; },
  async host() {
    this.reset(); this.isHost = true; this.screen = 'connecting'; this.msg = 'CREATING A GAME';
    try { await PX.loadPeer(); } catch (e) { return this.fail("COULDN'T LOAD ONLINE PLAY. CHECK YOUR INTERNET."); }
    const open = attempt => {
      let code = ''; for (let i = 0; i < 4; i++) code += PX.CODE_CHARS[Math.floor(Math.random() * PX.CODE_CHARS.length)];
      const peer = new Peer('pixel-skygp-room-' + code, this.opts()); this.peer = peer;
      peer.on('open', () => { this.code = code; this.screen = 'hosting'; this.msg = ''; });
      peer.on('connection', c => { if (this.live) { c.close(); return; } this.bind(c); });
      peer.on('disconnected', () => { if (this.peer === peer && !peer.destroyed) peer.reconnect(); });
      peer.on('error', e => { if (e.type === 'unavailable-id' && attempt < 3) { peer.destroy(); open(attempt + 1); } else if (!this.live && e.type !== 'network') this.fail("CAN'T REACH THE GAME SERVER. CHECK YOUR INTERNET."); });
    };
    open(0);
  },
  async join(code) {
    this.reset(); this.isHost = false; this.screen = 'connecting'; this.msg = 'CONNECTING TO ' + code;
    try { await PX.loadPeer(); } catch (e) { return this.fail("COULDN'T LOAD ONLINE PLAY. CHECK YOUR INTERNET."); }
    const peer = new Peer(this.opts()); this.peer = peer;
    peer.on('open', () => this.bind(peer.connect('pixel-skygp-room-' + code, { reliable: true, serialization: 'json' })));
    peer.on('error', e => { if (!this.live) this.fail(e && e.type === 'peer-unavailable' ? 'NO GAME WITH THAT CODE.' : "COULDN'T CONNECT. TRY AGAIN."); });
    setTimeout(() => { if (!this.live && this.screen === 'connecting') this.fail("COULDN'T REACH YOUR FRIEND'S PHONE. TRY THE SAME WI-FI."); }, 25000);
  },
  joinTyped() { if (codeInput.value.length === 4) { codeInput.blur(); this.join(codeInput.value); } },
  bind(c) {
    this.conn = c;
    c.on('open', () => { this.live = true; this.screen = 'lobby'; this.send({ t: 'me', name: profile.name, av: profile.avatar, car: { c: myColor(), d: myCar() }, v: VERSION }); PX.Bet.connect(m => this.send(m), this.isHost); PX.Sound.tone([523, 784], 0.2); });
    c.on('data', m => this.onData(m));
    c.on('close', () => this.lost());
  },
  // (the friend left in the middle of a race for a bet: I win it. A race that is already over is settled by its own result.)
  lost() { if (!this.live) return; this.live = false; this.conn = null; if (state === 'race' && mode === 'mp' && race && !race.over) PX.Bet.settle(true); if (state !== 'race') { this.screen = 'error'; this.msg = 'YOUR FRIEND LEFT.'; } },
  leave() { this.send({ t: 'bye' }); this.live = false; setTimeout(() => this.reset(), 150); },
  send(m) { if (this.conn && this.conn.open) try { this.conn.send(m); } catch (e) { /* closing */ } },
  sendPos(p) { const now = performance.now(); if (now - this.sendT < 50) return; this.sendT = now; this.send({ t: 'p', d: Math.round(p.dist), x: Math.round(p.x * 100) / 100, a: Math.round(p.alt), s: Math.round(p.speed) }); },
  start() { const seed = 1 + Math.floor(Math.random() * 100000); this.send({ t: 'go', seed, tr: save.track }); PX.Bet.start(); startRace('mp', seed); },   // the host's track
  onData(m) {
    if (!m || typeof m !== 'object') return;
    if (PX.Bet.onData(m)) return;                            // the bet's own messages
    switch (m.t) {
      case 'me':
        if (m.v !== VERSION) { this.fail('YOUR FRIEND HAS V' + m.v + ', YOU HAVE V' + VERSION + '. RELOAD BOTH.'); break; }
        this.friend = { name: PX.cleanName(m.name) || 'FRIEND', av: m.av, car: m.car && /^#[0-9a-f]{6}$/i.test(m.car.c) && CARS.some(k => k.id === m.car.d) ? m.car : null };
        break;
      case 'go': PX.Bet.start(); startRace('mp', +m.seed || 1, circuitOf(m.tr).id); break;
      // (two messages that crossed: we both wrecked at the same moment = nobody wins; we both finished = the faster time wins)
      case 'wreck': if (race && race.ghost) { race.ghost.wrecked = true; if (state === 'race' && race.result && race.result.wrecked) race.result.draw = true; } break;
      case 'p': if (race && race.ghost) { race.ghost.dist = +m.d || 0; race.ghost.x = clamp(+m.x || 0, -3, 3); race.ghost.alt = clamp(+m.a || 0, 0, ALT_MAX); race.ghost.speed = +m.s || 0; } break;
      case 'fin': if (race && race.ghost) { race.ghost.fin = m.tm; const r = race.result; if (state === 'race' && r && r.won) { if (m.tm < r.time) r.won = false; else if (m.tm === r.time) r.draw = true; } } break;
      case 'bye': this.lost(); break;
    }
  },
};

  p.position = increase(p.position, dt * p.speed, trackLength); p.t += dt;
  const target = -seg.curve * 0.08;

  p.va = (alt - p.alt) / dt; p.alt = alt; p.bank = lerp(p.bank, p.turn * 0.17, Math.min(1, dt * 8));
  bgOffset += seg.curve * sp * dt * 0.0045;
}

      if (UI.button('join', bx, y + 66, bw, 24, 'JOIN WITH A CODE', { accent: '#5ad43f' })) { Net.screen = 'join'; codeInput.value = ''; }
      back(y + 120);
      break;
    case 'hosting':
      T('YOUR GAME CODE', cx, y + 10, '#efe9ff', 1, 'center');
      T(Net.code, cx, y + 26, '#ffd23f', 7, 'center', '#000');
      T('YOUR FRIEND: RACE A FRIEND > JOIN WITH A CODE', cx, y + 70, '#efe9ff', 1, 'center');
      T('WAITING' + dots, cx, y + 86, '#fff', 1, 'center');
      PX.Invite.button(UI, bx, y + 97, bw, 20);
      back(y + 120, 'CANCEL');
      break;
    case 'join':
      T("TYPE YOUR FRIEND'S CODE", cx, y + 10, '#fff', 2, 'center');
      S.placeInput(codeInput, cx - 70, y + 30, 140, 36);
      if (UI.button('dojoin', bx, y + 76, bw, 22, 'JOIN', { disabled: codeInput.value.length !== 4, accent: '#5ad43f' })) Net.joinTyped();
      back(y + 120);
      break;
    case 'connecting':
      T(Net.msg + dots, cx, y + 60, '#fff', 1, 'center');
      back(y + 120, 'CANCEL');
      break;
    case 'lobby': {
      T('CONNECTED!', cx, y + 8, '#5ad43f', 2, 'center');
      PX.drawAvatar(ctx, profile.avatar, cx - 100, y + 30, 3); T(profile.name, cx - 79, y + 76, '#fff', 1, 'center');
      T('VS', cx, y + 46, '#e01e1e', 3, 'center');
      const f = Net.friend;
      if (f) { PX.drawAvatar(ctx, f.av, cx + 58, y + 30, 3); T(f.name, cx + 79, y + 76, '#fff', 1, 'center'); }
      // the bet: the host picks it (tap to change), the friend sees it. The winner of the race wins it from the loser.
      if (Net.isHost) {
        if (UI.button('bet', bx, y + 92, bw, 20, PX.Bet.label(), { accent: '#ffd23f', disabled: !f })) PX.Bet.next();
        if (UI.button('go', bx, y + 118, bw, 22, 'START: ' + circuit.name, { accent: '#e01e1e', disabled: !f })) Net.start();
      } else {
        T(PX.Bet.label(), cx, y + 96, PX.Bet.amount ? '#ffd23f' : '#efe9ff', 2, 'center');
        T('WAITING FOR ' + (f ? f.name : 'THE HOST') + ' TO START' + dots, cx, y + 124, '#efe9ff', 1, 'center');
      }
      back(y + 148, 'LEAVE');
      break;
    }
    case 'error':
      T(Net.msg, cx, y + 50, '#ff6b6b', 1, 'center');
      back(y + 100, 'OK');
      break;
  }
}
function drawResult() {
  const W = S.W, R = race, r = R.result || {}, bet = mode === 'mp' ? PX.Bet.resultLabel() : '';
  drawWorld(R, W);
  const { x, y } = drawPanel(280, bet ? 170 : 150), cx = W / 2, by = y + (bet ? 132 : 112);   // (a bet: one more line, the buttons move down)
  if (r.wrecked) T('WRECKED!', cx, y + 12, '#ff6b6b', 3, 'center');
  else if (mode === 'mp') T(r.won ? 'YOU WIN!' : (Net.friend ? Net.friend.name : 'FRIEND') + ' WINS!', cx, y + 12, r.won ? '#5ad43f' : '#ff6b6b', 3, 'center');
  else T(r.place === 1 ? 'YOU WIN!' : r.place === 2 ? '2ND PLACE!' : r.place === 3 ? '3RD PLACE!' : r.place + 'TH PLACE', cx, y + 12, r.place === 1 ? '#ffd23f' : '#fff', 3, 'center');
  if (mode === 'race' && r.place === 1 && !r.wrecked) T('★ ★ ★', cx, y + 34, '#ffd23f', 2, 'center');
  if (r.wrecked) T(mode === 'mp' ? r.draw ? 'YOU BOTH WRECKED' : (Net.friend ? Net.friend.name : 'FRIEND') + ' WINS' : 'OUT ON LAP ' + Math.min(r.lap, mode === 'free' ? 99 : LAPS), cx, y + 34, '#efe9ff', 2, 'center');
  T('TIME', x + 30, y + 52, '#efe9ff', 2); T(fmt(r.time), x + 250, y + 52, '#fff', 2, 'right');
  T('BEST LAP', x + 30, y + 72, '#efe9ff', 2); T(fmt(R.p.bestLap), x + 250, y + 72, '#efe9ff', 2, 'right');
  T('STARS', x + 30, y + 92, '#efe9ff', 2); T('★ +' + (R.stars + (r.bonus || 0)), x + 250, y + 92, '#ffd23f', 2, 'right');
  if (bet) T(bet, cx, y + 112, PX.Bet.result > 0 ? '#5ad43f' : PX.Bet.result < 0 ? '#ff6b6b' : '#ffd23f', 2, 'center');
  const bw = 110;
  if (mode === 'mp') {
    if (Net.live && Net.isHost) { if (UI.button('again', Math.round(cx - bw - 4), by, bw, 24, 'REMATCH', { accent: '#e01e1e' })) Net.start(); }
    else T(Net.live ? 'WAITING FOR A REMATCH...' : 'YOUR FRIEND LEFT', cx - 60, by + 8, '#efe9ff', 1, 'center');
  } else if (UI.button('again', Math.round(cx - bw - 4), by, bw, 24, mode === 'free' ? 'FLY AGAIN' : 'RACE AGAIN', { accent: '#e01e1e' })) startRace(mode);
  if (UI.button('menu', Math.round(cx + 4), by, bw, 24, 'MENU') || UI.back) toTitle();
}
// An engine icon: tap to switch the engine sound on / off (off at first). A note icon: the music.
function engineButton(x, y) {
  if (UI.button('engine', x, y, 22, 20, '')) { save.engine = !save.engine; store(); }
  ctx.fillStyle = save.engine ? '#efe9ff' : '#5b5275';                 // a little flying car from behind
  ctx.fillRect(x + 8, y + 5, 6, 3); ctx.fillRect(x + 6, y + 8, 10, 5); ctx.fillRect(x + 3, y + 10, 16, 2); ctx.fillRect(x + 3, y + 14, 3, 2); ctx.fillRect(x + 16, y + 14, 3, 2);
  if (!save.engine) { ctx.fillStyle = '#e01e1e'; for (let i = 0; i < 14; i++) ctx.fillRect(x + 4 + i, y + 3 + i, 2, 1); }
}
function musicButton(x, y) {
  if (UI.button('music', x, y, 22, 20, '')) { save.music = !save.music; store(); Music.bus(); }
  ctx.fillStyle = save.music ? '#efe9ff' : '#5b5275';
  ctx.fillRect(x + 7, y + 12, 4, 3); ctx.fillRect(x + 10, y + 4, 1, 9); ctx.fillRect(x + 11, y + 4, 4, 2); ctx.fillRect(x + 14, y + 6, 1, 2);
  if (!save.music) { ctx.fillStyle = '#e01e1e'; for (let i = 0; i < 14; i++) ctx.fillRect(x + 4 + i, y + 3 + i, 2, 1); }
}
/* --- GARAGE ------------------------------------------------------------------------- */
let garageTab = 'abil', garageMsg = { text: '', t: 0 };
function buy(price, then) {
  if (!PX.Wallet.spend(price)) { PX.Sound.tone(150, 0.2); garageMsg = { text: 'NEED ' + (price - PX.Wallet.get()) + ' MORE ★', t: 2 }; return; }
  then(); store(); PX.Sound.tone([523, 784, 1047], 0.3, { vol: 0.12 });
}
function drawGarage() {
  const W = S.W;
  drawWorld({ p: attract, cars: [] }, W);
  ctx.fillStyle = 'rgba(8,6,14,0.75)'; ctx.fillRect(0, 0, W, H);
  T('GARAGE', 10, 8, '#fff', 3, 'left', '#000');
  T('★ ' + PX.Wallet.get(), W - 10, 10, '#ffd23f', 2, 'right', '#000');
  const tabs = [['abil', 'ABILITIES'], ['cars', 'CARS'], ['paint', 'PAINT']], tw = 96;
  tabs.forEach(([id, label], i) => { if (UI.button('tab_' + id, Math.round(W / 2 - 150 + i * 102), 32, tw, 18, label, { on: garageTab === id, accent: '#ffd23f' })) garageTab = id; });
  if (garageTab === 'abil') ABILITIES.forEach((a, i) => {
    const y = 58 + i * 30, t = tierOf(a.id), max = a.prices.length;
    ctx.fillStyle = 'rgba(29,24,48,0.9)'; ctx.fillRect(10, y, W - 20, 26);
    ctx.fillStyle = a.color; ctx.fillRect(10, y, 3, 26);
    abilIcon(a.id, 28, y + 13, 2);
    T(a.name, 44, y + 4, '#fff', 2);
    for (let k = 0; k < max; k++) { ctx.fillStyle = '#111'; ctx.fillRect(44 + PX.textWidth(a.name, 2) + 8 + k * 9, y + 5, 7, 7); ctx.fillStyle = k < t ? a.color : '#3a2f5c'; ctx.fillRect(45 + PX.textWidth(a.name, 2) + 8 + k * 9, y + 6, 5, 5); }
    T(a.desc(a.stat(Math.max(1, t))), 44, y + 17, '#9a92b8', 1);
    if (UI.button('buy_' + a.id, W - 100, y + 4, 86, 18, t >= max ? 'MAX' : '★ ' + a.prices[t], { size: 2, disabled: t >= max, accent: a.color })) buy(a.prices[t], () => { save.tiers[a.id] = t + 1; });
  });
  if (garageTab === 'cars') CARS.forEach((c, i) => {
    const cw = Math.floor((W - 40) / 3), x = 10 + (i % 3) * (cw + 10), y = 58 + Math.floor(i / 3) * 78, owned = save.cars.includes(c.id), on = myCar() === c.id;
    ctx.fillStyle = on ? '#3a2f5c' : 'rgba(29,24,48,0.9)'; ctx.fillRect(x, y, cw, 72);
    ctx.drawImage(carSprite(myColor(), 0, c.id), Math.round(x + cw / 2 - 36), y + 4, 72, 44);
    if (!owned) { if (UI.button('car_' + c.id, x + 6, y + 50, cw - 12, 18, '★ ' + c.price, { accent: '#ffd23f' })) buy(c.price, () => { save.cars.push(c.id); save.car = c.id; }); }
    else if (UI.button('car_' + c.id, x + 6, y + 50, cw - 12, 18, on ? 'FLYING' : c.name, { on, accent: '#5ad43f', size: on ? 2 : 1 }) && !on) { save.car = c.id; store(); }
  });
  if (garageTab === 'paint') {
    ctx.drawImage(carSprite(myColor(), 0, myCar()), Math.round(W / 2 - 54), 54, 108, 66);
    const sw = 26, cols = 7, x0 = Math.round(W / 2 - (cols * (sw + 6) - 6) / 2);
    ['auto', ...PAINTS].forEach((col, i) => {
      const x = x0 + (i % cols) * (sw + 6), y = 128 + Math.floor(i / cols) * (sw + 14), owned = col === 'auto' || save.paints.includes(col), on = save.paint === col || (col === 'auto' && !save.paints.includes(save.paint));
      if (UI.button('paint_' + i, x, y, sw, sw, '', { on, accent: '#ffd23f' })) {
        if (owned) { save.paint = col; store(); PX.Sound.tone(700, 0.05); } else buy(PAINT_PRICE, () => { save.paints.push(col); save.paint = col; });
      }
      ctx.fillStyle = col === 'auto' ? PX.AVATAR_COLORS[profile.avatar.color] : col; ctx.fillRect(x + 4, y + 4, sw - 8, sw - 8);
      if (col === 'auto') PX.drawAvatar(ctx, profile.avatar, x + 6, y + 6, 1, null);
      if (!owned) T('★' + PAINT_PRICE, x + sw / 2, y + sw + 2, '#ffd23f', 1, 'center', '#000');
      if (on) { ctx.fillStyle = '#ffd23f'; ctx.fillRect(x, y + sw + 2, sw, 2); }
    });
  }
  if ((garageMsg.t -= 1 / 60) > 0) T(garageMsg.text, W / 2 + 10, 12, '#ff6b6b', 2, 'center', '#000');
  if (UI.button('gback', Math.round(W / 2 - 60), H - 26, 120, 22, 'BACK') || UI.back) state = 'title';
}
function drawPause() {
  const W = S.W, { y } = drawPanel(200, 130), bw = 150, bx = Math.round(W / 2 - bw / 2);
  T('PAUSED', W / 2, y + 12, '#fff', 3, 'center');
  if (UI.button('resume', bx, y + 40, bw, 22, 'RESUME', { accent: '#5ad43f' }) || UI.back) setPause(false);
  if (UI.button('restart', bx, y + 68, bw, 22, 'RESTART')) startRace(mode);
  if (UI.button('quit', bx, y + 96, bw, 22, 'MENU')) toTitle();
  engineButton(Math.round(W / 2 - 94), y + 6); musicButton(Math.round(W / 2 + 72), y + 6);
}
function toTitle() {
  if (mode === 'mp' && Net.live) { Net.screen = 'lobby'; }
  state = 'title'; paused = false; race = null; attract = null; Engine.off(); Ctl.ptrs.clear(); Ctl.sync(); Ctl.stopDrag(); Music.play('menu');
}

/* --- 8. MAIN LOOP ------------------------------------------------------------- */
const STEP = 1 / 60;
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  UI.begin();
  if (state === 'title') { attractMode(dt || STEP); drawTitle(); }
  else if (state === 'race') {
    if (!paused) { acc += dt; while (acc >= STEP) { updateRace(STEP); acc -= STEP; } } else acc = 0;
    const sh = race.shake > 0.5 ? race.shake : 0;
    ctx.save(); if (sh) ctx.translate(Math.round((Math.random() - 0.5) * sh), Math.round((Math.random() - 0.5) * sh));
    drawWorld(race, S.W); ctx.restore();
    drawHUD(race, S.W);
    if (paused) drawPause();
  } else if (state === 'result') drawResult();
  else if (state === 'garage') { attractMode(dt || STEP); drawGarage(); }
  if (!(state === 'title' && Net.screen === 'join')) codeInput.style.display = 'none';
  UI.end();
  S.blit();
  requestAnimationFrame(frame);
}
buildTrack();
requestAnimationFrame(frame);
PX.Pad.setup({
  title: 'Pixel Sky GP: controller', ui: UI, menu: () => state !== 'race' || paused,
  phone: { stick: 'FLY', buttons: [['A', 'NITRO'], ['B', 'BRAKE'], ['Y', 'SHIELD']] },
  keys: () => ({ left: 'ArrowLeft', right: 'ArrowRight', up: 'ArrowUp', down: 'ArrowDown', A: 'Digit1', X: 'Digit1', RB: 'Digit1', B: 'Space', LT: 'Space', RT: 'Space', Y: 'Digit2', LB: 'Digit2', START: 'KeyP' }),
  help: [['STICK|D-PAD', 'STEER, CLIMB AND DIVE'], ['B|LT|RT', 'BRAKE'], ['A|X|RB', 'NITRO'], ['Y|LB', 'SHIELD'], ['START', 'PAUSE'], ['STICK|D-PAD', 'MENUS: PICK A BUTTON'], ['A', 'MENUS: OK'], ['B', 'MENUS: BACK']],
});
// an invite from a friend (the arcade opens this page with ?join=CODE): join that game right away
PX.Invite.auto(code => { state = 'title'; Net.join(code); });
</script>
