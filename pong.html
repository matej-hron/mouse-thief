<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Pixel Pong: table tennis from above. Play a bot, a random player online, a friend online, or a friend on the same phone. With power-ups.">
<meta name="theme-color" content="#0d0b13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Pixel Pong</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1ec8e0; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #screen { position: fixed; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
  #code { position: fixed; display: none; box-sizing: border-box; text-align: center; text-transform: uppercase;
          font: bold 32px ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.3em; padding: 0 0 0 0.3em;
          color: #111; background: #fbf9f3; border: 3px solid #111; border-radius: 0; outline: none; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<input id="code" maxlength="4" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" inputmode="text" aria-label="Room code">
<script src="common.js"></script>
<script>
'use strict';
/* ==========================================================================
   PIXEL PONG: table tennis seen from above (part of the PIXEL ARCADE).
   Hit the ball past the other player's bat to score; first to 7 wins.
   Play a bot, a random player online, a friend online (with a code) or a
   friend on the same phone. Hitting the ball charges power-ups:
   SMASH, CURVE, BIG BAT and FREEZE.
     1. Setup     2. The match     3. Bots     4. Drawing     5. Online
     6. Sound     7. Screens       8. Input    9. Main loop
   ========================================================================== */

/* --- 1. SETUP --------------------------------------------------------------- */
const VERSION = '1.0.1';
const SAVE_KEY = 'pixelPong.save';
const save = { wins: 0, played: 0, music: true, sfx: true, best: {} };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY)) || {}); } catch (e) { /* new player */ }
const store = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* private mode */ } };
const profile = PX.Profile.get();
const MY_COLOR = PX.AVATAR_COLORS[profile.avatar.color];

const canvas = document.getElementById('screen');
const S = PX.makeScreen(canvas, { H: 240, minW: 400, maxW: 560 });
const ctx = S.ctx, H = S.H;
const UI = PX.makeUI(S, canvas);
const T = (str, x, y, color = '#fff', size = 1, align = 'left', shadow = null) => PX.drawText(ctx, str, x, y, color, size, align, shadow);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

// The table, in its own units: L long (left to right), WD wide.
const L = 340, WD = 150, TY = 50, BR = 5;            // BR: the ball's radius
const WIN = 7;
const BASE_SPEED = 165, MAX_SPEED = 430;
const ABILITIES = [
  { id: 'smash', name: 'SMASH', cost: 2, color: '#ff5a2a', info: 'YOUR NEXT HIT IS SUPER FAST' },
  { id: 'curve', name: 'CURVE', cost: 2, color: '#b06bff', info: 'YOUR NEXT HIT CURVES' },
  { id: 'big', name: 'BIG BAT', cost: 3, color: '#3fd45a', info: 'A BIGGER BAT FOR 7 SECONDS' },
  { id: 'freeze', name: 'FREEZE', cost: 4, color: '#7af0ff', info: 'THE OTHER BAT FREEZES FOR A MOMENT' },
];
const MAX_ENERGY = 6;
// a pixel icon for each power-up ('#' = its color)
const ABIL_ICONS = {
  smash:  ['...#...', '..##...', '..###.#', '.####.#', '.######', '###y###', '##yyy##', '##yyy##', '.#####.'],      // a fireball
  curve:  ['.####....', '######...', '##..##...', '##..##...', '##.######', '##..####.', '##...##..', '##.......'],   // a curved arrow
  big:    ['..###....', '.#####.w.', '#######ww', '#######w.', '#######..', '.#####...', '..###....', '...hh....', '...hh....'], // a bat and a plus
  freeze: ['....#....', '.#..#..#.', '..#.#.#..', '...###...', '#########', '...###...', '..#.#.#..', '.#..#..#.', '....#....'],  // a snowflake
};
function abilIcon(id, cx, cy, s) { const a = ABILITIES.find(q => q.id === id); PX.drawIcon(ctx, ABIL_ICONS[id], { '#': a.color, w: '#ffffff', y: '#ffe23a', h: '#a0662a' }, cx, cy, s); }
const BOTS = {
  easy:   { name: 'EASY BOT', speed: 120, err: 18, react: 0.35, abil: 0, reward: 3, color: '#3fae4a', av: { shape: 'frog', color: 3 } },
  normal: { name: 'BOT', speed: 175, err: 12, react: 0.2, abil: 0.3, reward: 6, color: '#e0b030', av: { shape: 'robot', color: 6 } },
  hard:   { name: 'MEGA BOT', speed: 250, err: 7, react: 0.1, abil: 1, reward: 10, color: '#e01e1e', av: { shape: 'robot', color: 4 } },
};

/* --- 2. THE MATCH --------------------------------------------------------------- */
// mode: 'bot' | 'local' (two players, one phone) | 'online'
let M = null;
function newPaddle(side, who) {
  const x = side === 0 ? -6 : L + 6;
  return { side, x, y: WD / 2, tx: x, ty: WD / 2, vx: 0, vy: 0, big: 0, frozen: 0, energy: 0, pending: null, hitT: 0, home: x,
           name: who.name, av: who.av, color: who.color, bot: who.bot || null, think: 0, aimY: WD / 2 };
}
function makeMatch(mode, opts = {}) {
  const me = { name: profile.name, av: profile.avatar, color: MY_COLOR };
  let left = me, right;
  if (mode === 'bot') { const b = BOTS[opts.bot]; right = { name: b.name, av: b.av, color: b.color, bot: opts.bot }; }
  else if (mode === 'local') { left = { name: 'PLAYER 1', av: profile.avatar, color: MY_COLOR }; right = { name: 'PLAYER 2', av: { shape: 'bear', color: 2 }, color: '#2a7fd4' }; }
  else { const f = Net.friend || { name: 'FRIEND', av: { shape: 'cat', color: 2 }, color: '#2a7fd4' };
    if (Net.isHost) right = f; else { left = f; right = me; } }
  if (right.color === left.color) right.color = left.color === '#2a7fd4' ? '#e01e1e' : '#2a7fd4';
  return { mode, bot: opts.bot || null, p: [newPaddle(0, left), newPaddle(1, right)], score: [0, 0], speed: BASE_SPEED,
        ball: { x: L / 2, y: WD / 2, vx: 0, vy: 0, spin: 0, smash: false, curve: false, z: 0, ph: 0, last: -1 },
        phase: 'count', t: 3, serveTo: Math.random() < 0.5 ? 0 : 1, hits: 0, rally: 0, best: 0, msg: '', msgT: 0, flash: 0, winner: -1, overT: 0,
        me: mode === 'online' ? (Net.isHost ? 0 : 1) : 0, mirror: mode === 'online' && !Net.isHost, trail: [] };
}
function startMatch(mode, opts = {}) { M = makeMatch(mode, opts); state = 'play'; paused = false; Ctl.clear(); Music.play('game'); }
const padR = p => p.big > 0 ? 21 : 13;
function serve() {
  const b = M.ball, dir = M.serveTo === 0 ? -1 : 1, a = (Math.random() - 0.5) * 0.9;
  Object.assign(b, { x: L / 2, y: WD / 2, vx: Math.cos(a) * BASE_SPEED * dir, vy: Math.sin(a) * BASE_SPEED, spin: 0, smash: false, curve: false, last: -1 });
  M.speed = BASE_SPEED; M.phase = 'live'; M.rally = 0; M.trail = [];
}
function say(text, t = 1.6) { M.msg = text; M.msgT = t; }
function useAbility(side, id) {
  if (!M || M.phase === 'over') return;
  if (M.mode === 'online' && side === M.me && !Net.isHost) { Net.send({ t: 'ab', k: id }); return; }   // the host decides
  const p = M.p[side], a = ABILITIES.find(q => q.id === id);
  if (!a || p.energy < a.cost) return;
  if ((id === 'smash' || id === 'curve') && p.pending === id) return;
  if (id === 'big' && p.big > 0) return;
  p.energy -= a.cost;
  if (id === 'smash' || id === 'curve') p.pending = id;
  else if (id === 'big') p.big = 7;
  else if (id === 'freeze') M.p[1 - side].frozen = 1.1;
  sfx(id); fxAt(side, a);
}
function fxAt(side, a) { M.fx = { side, a, t: 0.8 }; if (M.mode === 'online' && Net.isHost) Net.send({ t: 'fx', s: side, k: a.id }); }
// Move a bat toward where it wants to be (bots and fingers both set tx, ty).
function movePaddle(p, dt, maxSpeed) {
  const x0 = p.x, y0 = p.y;
  if (p.frozen > 0) { p.frozen -= dt; p.vx = p.vy = 0; return; }
  const lo = p.side === 0 ? -26 : L * 0.6, hi = p.side === 0 ? L * 0.4 : L + 26;
  p.tx = clamp(p.tx, lo, hi); p.ty = clamp(p.ty, -12, WD + 12);
  const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy), step = Math.min(d, maxSpeed * dt);
  if (d > 0.01) { p.x += dx / d * step; p.y += dy / d * step; }
  p.vx = (p.x - x0) / dt; p.vy = (p.y - y0) / dt;
}
function hitTest(p) {
  const b = M.ball, R = padR(p), dx = b.x - p.x, dy = b.y - p.y, d = Math.hypot(dx, dy);
  if (p.hitT > 0 || d > R + BR || d < 0.001) return;
  const nx = dx / d, ny = dy / d, rel = (b.vx - p.vx) * nx + (b.vy - p.vy) * ny;
  const dir = p.side === 0 ? 1 : -1;
  if (rel >= 0 && Math.sign(b.vx) === dir) return;                       // already going away
  b.x = p.x + nx * (R + BR); b.y = p.y + ny * (R + BR);
  let vx = b.vx - 2 * Math.min(rel, 0) * nx, vy = b.vy - 2 * Math.min(rel, 0) * ny;
  M.speed = Math.min(MAX_SPEED, M.speed * 1.06);
  let spd = M.speed + Math.max(0, p.vx * dir) * 0.3;
  let ang = Math.atan2(vy, Math.abs(vx) + 1e-3);
  ang = clamp(ang + ny * 0.5, -0.95, 0.95);                               // where it hits the bat aims the ball
  b.smash = p.pending === 'smash'; b.curve = p.pending === 'curve';
  if (b.smash) spd = Math.min(560, spd * 1.75);
  b.vx = Math.cos(ang) * spd * dir; b.vy = Math.sin(ang) * spd;
  b.spin = b.curve ? -Math.sign(b.vy || (Math.random() - 0.5)) * 420 : 0;
  p.pending = null; p.energy = Math.min(MAX_ENERGY, p.energy + 1); p.hitT = 0.15;
  b.last = p.side; M.hits++; M.rally++;
  sfx(b.smash ? 'smash' : 'hit', spd);
  if (M.mode === 'online' && Net.isHost) Net.send({ t: 'hit', k: b.smash ? 1 : 0 });
}
function point(winner) {
  M.score[winner]++; M.best = Math.max(M.best, M.rally);
  M.serveTo = 1 - winner; M.flash = 0.5;
  const loserBall = M.ball; loserBall.vx = loserBall.vy = 0;
  if (M.score[winner] >= WIN) { endMatch(winner); return; }
  M.phase = 'point'; M.t = 1.3;
  const name = M.p[winner].name;
  say(M.mode !== 'local' && winner === M.me ? 'POINT!' : name + ' SCORES!');
  sfx(winner === M.me || M.mode === 'local' ? 'point' : 'lose');
  if (M.score[0] === WIN - 1 || M.score[1] === WIN - 1) setTimeout(() => { if (M && M.phase !== 'over') say('MATCH POINT!', 1.2); }, 900);
}
function endMatch(winner) {
  M.phase = 'over'; M.winner = winner; M.overT = 0; state = 'over';
  M.stars = 0;
  const iWon = M.mode === 'local' ? null : winner === M.me;
  if (M.mode === 'bot') { M.stars = iWon ? BOTS[M.bot].reward : 1; if (iWon) { save.wins++; save.best[M.bot] = (save.best[M.bot] | 0) + 1; } }
  else if (M.mode === 'online') M.stars = iWon && !M.left ? 10 : 2;
  if (M.stars) PX.Wallet.add(M.stars);
  save.played++; store();
  sfx(iWon === false ? 'lose' : 'win'); Music.play(null);
  if (M.mode === 'online' && Net.isHost) Net.send({ t: 'end', w: winner, sc: M.score });
}
// One step of the match (the host runs it for online games).
function step(dt) {
  const b = M.ball;
  if (M.msgT > 0) M.msgT -= dt;
  if (M.fx && (M.fx.t -= dt) <= 0) M.fx = null;
  M.flash = Math.max(0, M.flash - dt);
  for (const p of M.p) {
    if (p.big > 0) p.big -= dt;
    if (p.hitT > 0) p.hitT -= dt;
    if (p.bot) botThink(p, dt);
    const human = !p.bot && !(M.mode === 'online' && p.side !== M.me);
    if (M.mode === 'online' && p.side !== M.me) { if (p.frozen > 0) p.frozen -= dt; continue; }   // the friend moves their own bat
    movePaddle(p, dt, p.bot ? BOTS[p.bot].speed : human ? 700 : 400);
  }
  if (M.phase === 'count' || M.phase === 'point') {
    if ((M.t -= dt) <= 0) serve();
    return;
  }
  if (M.phase !== 'live') return;
  b.vy += b.spin * dt;
  b.x += b.vx * dt; b.y += b.vy * dt;
  b.ph += Math.hypot(b.vx, b.vy) * dt / (L / 2) * Math.PI;              // the bounce on the table (just for looks)
  b.z = Math.abs(Math.sin(b.ph)) * (b.smash ? 4 : 9);
  if (b.y < BR) { b.y = BR; b.vy = Math.abs(b.vy); b.spin *= -0.5; sfx('wall'); }
  if (b.y > WD - BR) { b.y = WD - BR; b.vy = -Math.abs(b.vy); b.spin *= -0.5; sfx('wall'); }
  for (const p of M.p) hitTest(p);
  M.trail.push({ x: b.x, y: b.y - b.z }); if (M.trail.length > 8) M.trail.shift();
  if (b.x < -46) point(1); else if (b.x > L + 46) point(0);
}

/* --- 3. BOTS -------------------------------------------------------------------- */
function predictY(xLine) {
  const b = M.ball; if (Math.abs(b.vx) < 1) return b.y;
  const t = (xLine - b.x) / b.vx; if (t < 0) return b.y;
  let y = b.y + b.vy * t + 0.5 * b.spin * t * t * 0.6;
  const lo = BR, span = WD - 2 * BR;
  y -= lo; y = ((y % (2 * span)) + 2 * span) % (2 * span); if (y > span) y = 2 * span - y;
  return y + lo;
}
function botThink(p, dt) {
  const D = BOTS[p.bot], b = M.ball, dir = p.side === 0 ? 1 : -1, coming = M.phase === 'live' && Math.sign(b.vx) === -dir;
  if ((p.think -= dt) <= 0) {
    p.think = D.react;
    const err = D.err * Math.pow(M.speed / BASE_SPEED, 1.4) * (b.smash ? 2 : 1) * (b.curve ? 1.6 : 1);   // fast balls are harder to read
    p.lean = coming && Math.abs(b.x - p.x) < 90 && D.abil > 0.5 ? dir * 18 : 0;                       // the mega bot steps in
    p.aimY = coming ? predictY(p.home + p.lean) + (Math.random() - 0.5) * 2 * err : WD / 2 + (Math.random() - 0.5) * 40;
  }
  p.ty = p.aimY; p.tx = p.home + (p.lean || 0);
  if (D.abil && Math.random() < dt * D.abil * 1.5) {
    const away = M.phase === 'live' && Math.sign(b.vx) === dir, opp = M.p[1 - p.side];
    if (away && Math.abs(b.x - opp.x) < 90 && p.energy >= 4 && D.abil > 0.5) useAbility(p.side, 'freeze');
    else if (coming && Math.abs(b.x - p.x) < 140 && p.energy >= 2) useAbility(p.side, Math.random() < 0.5 ? 'smash' : 'curve');
    else if (coming && p.energy >= 5 && p.big <= 0) useAbility(p.side, 'big');
  }
}

/* --- 4. DRAWING ----------------------------------------------------------------- */
const TX = () => Math.round(S.W / 2 - L / 2);
const sx = x => TX() + (M && M.mirror ? L - x : x);
const sy = y => TY + y;
function drawTable() {
  const x0 = TX();
  ctx.fillStyle = '#111'; ctx.fillRect(x0 - 5, TY - 5, L + 10, WD + 10);
  ctx.fillStyle = '#3ad44f'; ctx.fillRect(x0, TY, L, WD);
  ctx.fillStyle = '#5ae06a'; for (let i = 0; i < L; i += 20) ctx.fillRect(x0 + i, TY, 10, WD);   // a little texture
  ctx.fillStyle = '#d8f8d8'; ctx.fillRect(x0, TY + WD / 2 - 3, L, 6);                            // the middle line
  ctx.fillStyle = '#111'; ctx.fillRect(x0 + L / 2 - 3, TY - 9, 6, WD + 18);                       // the net
  ctx.fillStyle = '#fff'; ctx.fillRect(x0 + L / 2 - 1, TY - 8, 2, WD + 16);
}
function drawPaddle(p) {
  const x = sx(p.x), y = sy(p.y), r = padR(p), out = (p.side === 0) !== !!(M && M.mirror) ? -1 : 1;
  // the handle points away from the table
  const hx = x + out * (r + 9) * 0.75, hy = y + (p.side === 0 ? 1 : -1) * (r + 9) * 0.65;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#111'; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(hx, hy); ctx.stroke();
  ctx.strokeStyle = '#6b4a2a'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(hx, hy); ctx.stroke();
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.arc(x + 3, y + 4, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x, y, r + 2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = p.frozen > 0 ? '#bff4ff' : p.color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.clip();                       // the white stripe
  ctx.translate(x, y); ctx.rotate(out * 0.8); ctx.fillStyle = '#fff'; ctx.fillRect(-r, -3, r * 2, 6); ctx.restore();
  if (p.pending) { ctx.strokeStyle = ABILITIES.find(a => a.id === p.pending).color; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, r + 4 + Math.sin(performance.now() / 80), 0, Math.PI * 2); ctx.stroke(); }
  if (p.frozen > 0) { ctx.fillStyle = '#e8fcff'; for (let i = 0; i < 6; i++) { const a = i * 1.05; ctx.fillRect(Math.round(x + Math.cos(a) * (r + 3)) - 1, Math.round(y + Math.sin(a) * (r + 3)) - 1, 3, 3); } }
}
function drawBall() {
  const b = M.ball, x = sx(b.x), y = sy(b.y);
  if (M.phase === 'live' && M.trail.length > 1) {                                   // the white streak behind it
    const t0 = M.trail[0], a = Math.atan2(y - b.z - sy(t0.y), x - sx(t0.x));
    ctx.fillStyle = b.smash ? 'rgba(255,110,40,0.85)' : b.curve ? 'rgba(190,120,255,0.85)' : 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.moveTo(sx(t0.x), sy(t0.y)); ctx.lineTo(x + Math.cos(a + 1.57) * 4, y - b.z + Math.sin(a + 1.57) * 4); ctx.lineTo(x + Math.cos(a - 1.57) * 4, y - b.z + Math.sin(a - 1.57) * 4); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(x + 2, y + 3, BR, BR * 0.7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x, y - b.z, BR + 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = b.smash ? '#ff8a3a' : '#ffe23a'; ctx.beginPath(); ctx.arc(x, y - b.z, BR, 0, Math.PI * 2); ctx.fill();
}
function drawScores(now) {
  const W = S.W, L0 = M.mirror ? M.p[1] : M.p[0], R0 = M.mirror ? M.p[0] : M.p[1], s0 = M.score[L0.side], s1 = M.score[R0.side];
  PX.drawAvatar(ctx, L0.av, 8, 8, 2); T(L0.name, 40, 10, '#fff', 2, 'left', '#000');
  PX.drawAvatar(ctx, R0.av, W - 36, 8, 2); T(R0.name, W - 44, 10, '#fff', 2, 'right', '#000');
  ctx.fillStyle = L0.color; ctx.fillRect(40, 27, 30, 3); ctx.fillStyle = R0.color; ctx.fillRect(W - 74, 27, 30, 3);
  T(s0 + ' - ' + s1, W / 2, 8, M.flash > 0 && Math.floor(now / 80) % 2 ? '#ffd23f' : '#fff', 4, 'center', '#000');
  T('FIRST TO ' + WIN, W / 2, 32, '#0d6a7a', 1, 'center');
}
function drawEnergy(p, x, y, w, right) {
  // the energy bar and the 4 ability buttons of one player
  const local = M.mode !== 'online' || p.side === M.me;
  if (!local || p.bot) return;
  for (let i = 0; i < MAX_ENERGY; i++) { ctx.fillStyle = '#111'; ctx.fillRect(x + i * 9, y - 6, 8, 5); ctx.fillStyle = i < p.energy ? '#ffd23f' : '#0d6a7a'; ctx.fillRect(x + i * 9 + 1, y - 5, 6, 3); }
  const bw = Math.floor((w - 9) / 4);
  ABILITIES.forEach((a, i) => {
    const ok = p.energy >= a.cost && M.phase !== 'over', id = 'ab' + p.side + a.id;
    if (UI.button(id, x + i * (bw + 3), y, bw, 24, '', { disabled: !ok, accent: a.color })) useAbility(p.side, a.id);
    const bx = x + i * (bw + 3);
    ctx.globalAlpha = ok ? 1 : 0.35; abilIcon(a.id, bx + bw / 2 - 3, y + 12, 2); ctx.globalAlpha = 1;
    T(String(a.cost), bx + bw - 3, y + 15, ok ? '#ffd23f' : '#5b5275', 1, 'right', '#000');
  });
  const keysTxt = M.mode === 'local' ? (p.side === 0 ? 'KEYS 1 2 3 4' : 'KEYS 7 8 9 0') : 'KEYS 1 2 3 4';
  if (!Ctl.touch && M.mode !== 'local') T(keysTxt, x + w + 6, y + 9, '#0d6a7a', 1, 'left', null);
}
function drawGame(now) {
  const W = S.W;
  ctx.fillStyle = '#1ec8e0'; ctx.fillRect(0, 0, W, H);
  drawTable();
  for (const p of M.p) drawPaddle(p);
  drawBall();

    T('WAITING' + '.'.repeat(1 + Math.floor(performance.now() / 400) % 3), cx, y + 82, '#9a92b8', 1, 'center');
    if (UI.button('nb', bx, y + 136, bw, 22, 'CANCEL') || UI.back) back();
  } else if (Net.screen === 'connecting' || Net.screen === 'searching' || Net.screen === 'waiting') {
    T(Net.random ? 'RANDOM PLAYER' : 'ONLINE', cx, y + 12, '#fff', 2, 'center');
    T(Net.msg + '.'.repeat(1 + Math.floor(performance.now() / 400) % 3), cx, y + 50, '#ffd23f', 1, 'center');
    if (Net.screen === 'waiting') T('NOBODY IS WAITING RIGHT NOW. YOU ARE FIRST IN LINE!', cx, y + 66, '#9a92b8', 1, 'center');
    if (Net.screen === 'waiting' && UI.button('nbot', bx, y + 100, bw, 24, 'PLAY A BOT INSTEAD', { accent: '#3fd45a' })) { Net.reset(); menu = 'bot'; state = 'title'; }
    if (UI.button('nb', bx, y + 136, bw, 22, 'CANCEL') || UI.back) back();
  } else if (Net.screen === 'lobby') {
    const f = Net.friend;
    T(Net.random ? 'FOUND A PLAYER!' : 'CONNECTED!', cx, y + 12, '#9be36b', 2, 'center');
    PX.drawAvatar(ctx, profile.avatar, cx - 90, y + 36, 2); T(profile.name, cx - 76, y + 70, '#fff', 1, 'center');
    T('VS', cx, y + 46, '#ffd23f', 2, 'center');
    if (f) { PX.drawAvatar(ctx, f.av, cx + 62, y + 36, 2); T(f.name, cx + 76, y + 70, '#fff', 1, 'center'); }
    if (Net.isHost && !Net.random) { if (UI.button('st', bx, y + 96, bw, 26, 'START!', { disabled: !f, accent: '#5ad43f' })) Net.start(); }
    else T(Net.random ? 'STARTING' + '.'.repeat(1 + Math.floor(performance.now() / 400) % 3) : 'WAITING FOR YOUR FRIEND TO START', cx, y + 104, '#9a92b8', 1, 'center');
    if (UI.button('nb', bx, y + 136, bw, 22, 'LEAVE') || UI.back) { Net.leave(); state = 'title'; }
  } else {
    T('OOPS', cx, y + 12, '#ff6b6b', 2, 'center');
    const words = (Net.msg || 'SOMETHING WENT WRONG.').split(' '); let line = '', ly = y + 40;
    for (const w of words) { if (PX.textWidth(line + ' ' + w, 1) > 230) { T(line, cx, ly, '#fff', 1, 'center'); ly += 10; line = w; } else line = line ? line + ' ' + w : w; }
    T(line, cx, ly, '#fff', 1, 'center');
    if (UI.button('nb', bx, y + 136, bw, 22, 'BACK') || UI.back) back();
  }
}
function drawPause() {
  const W = S.W, { y } = panel(200, 120), bw = 150, bx = Math.round(W / 2 - bw / 2);
  T('PAUSED', W / 2, y + 12, '#fff', 3, 'center');
  soundButtons(Math.round(W / 2 + 46), y + 8);
  if (UI.button('resume', bx, y + 40, bw, 22, 'RESUME', { accent: '#5ad43f' }) || UI.back) setPause(false);
  if (UI.button('quit', bx, y + 70, bw, 22, 'MENU')) toTitle();
  T('POWER-UPS: HIT THE BALL TO FILL THE YELLOW BAR', W / 2, y + 100, '#9a92b8', 1, 'center');
}
function drawOver(now) {
  const W = S.W, w = M.winner, iWon = M.mode === 'local' ? null : w === M.me, { y } = panel(260, 150, 44);
  if (iWon !== false) for (let i = 0; i < 24; i++) { const t = now / 1000 + i; ctx.fillStyle = ['#ffd23f', '#ff6bd0', '#7af0ff', '#9be36b'][i % 4]; ctx.fillRect(Math.round((i * 47 + t * 30) % W), Math.round((t * (40 + i * 3)) % H), 3, 3); }
  T(iWon === null ? M.p[w].name + ' WINS!' : iWon ? 'YOU WIN!' : 'YOU LOSE', W / 2, y + 12, iWon === false ? '#ff6b6b' : '#ffd23f', iWon === null ? 2 : 4, 'center', '#000');
  const sL = M.mirror ? M.score[1] : M.score[0], sR = M.mirror ? M.score[0] : M.score[1];
  T(sL + ' - ' + sR, W / 2, y + 44, '#fff', 3, 'center');
  T('LONGEST RALLY: ' + M.best + ' HITS', W / 2, y + 68, '#9a92b8', 1, 'center');
  if (M.left) T('THE OTHER PLAYER LEFT', W / 2, y + 78, '#ff6b6b', 1, 'center');
  if (M.stars) T('★ +' + M.stars, W / 2, y + 88, '#ffd23f', 2, 'center', '#000');
  const again = M.mode !== 'online' || (Net.live && !M.left);
  if (again && UI.button('again', Math.round(W / 2 + 4), y + 116, 120, 24, 'PLAY AGAIN', { accent: '#5ad43f' })) {
    if (M.mode === 'online') { if (Net.isHost) Net.start(); else { Net.send({ t: 'again' }); M.waitAgain = true; } }
    else startMatch(M.mode, { bot: M.bot });
  }
  if (M.waitAgain) T('ASKED FOR A REMATCH...', W / 2, y + 104, '#9a92b8', 1, 'center');
  if (UI.button('menu', Math.round(W / 2 - 124), y + 116, 120, 24, 'MENU') || UI.back) toTitle();
}
function setPause(v) { if (state !== 'play' || !M || M.mode === 'online') return; paused = v; Ctl.clear(); Music.play(v ? null : 'game'); }
function toTitle() { if (M && M.mode === 'online') Net.leave(); M = null; state = 'title'; menu = 'main'; paused = false; Music.play('menu'); }

/* --- 8. INPUT: drag to move your bat (each player on their own half on one phone) ----- */
const keys = {};
const Ctl = {
  touch: false, ptrs: new Map(),
  clear() { this.ptrs.clear(); },
  // which bat does a finger at screen x control?
  side(x) { if (!M) return null; if (M.mode === 'local') return x < S.W / 2 ? 0 : 1; return M.me; },
};
UI.onDown = (e, x, y) => {
  PX.Sound.unlock(); if (!Music.cur) Music.play(state === 'play' ? 'game' : 'menu');
  if (e.pointerType === 'touch') Ctl.touch = true;
  if (state !== 'play' || paused || UI.downId !== null) return;
  const side = Ctl.side(x); if (side === null) return;
  Ctl.ptrs.set(e.pointerId, { side, x, y });
};
UI.onMove = (e, x, y) => {
  const c = Ctl.ptrs.get(e.pointerId); if (!c || !M) return;
  const p = M.p[c.side], k = 1.25, dx = (x - c.x) * k * (M.mirror ? -1 : 1), dy = (y - c.y) * k;
  p.tx = clamp(p.tx + dx, -40, L + 40); p.ty = clamp(p.ty + dy, -20, WD + 20);
  c.x = x; c.y = y;
};
UI.onUp = e => { Ctl.ptrs.delete(e.pointerId); };
// a mouse just moving (no button) also moves your bat, in one-player games
window.addEventListener('mousemove', e => {
  if (state !== 'play' || paused || !M || M.mode === 'local' || Ctl.touch) return;
  const { x, y } = S.toLogical(e), p = M.p[M.me];
  if (x < 0 || x > S.W) return;
  p.tx = M.mirror ? L - (x - TX()) : x - TX(); p.ty = y - TY;
});
const KEYSETS = [{ up: ['KeyW'], down: ['KeyS'], left: ['KeyA'], right: ['KeyD'], ab: ['Digit1', 'Digit2', 'Digit3', 'Digit4'] },
                 { up: ['ArrowUp'], down: ['ArrowDown'], left: ['ArrowLeft'], right: ['ArrowRight'], ab: ['Digit7', 'Digit8', 'Digit9', 'Digit0'] }];
window.addEventListener('keydown', e => {
  PX.Sound.unlock(); if (!Music.cur) Music.play(state === 'play' ? 'game' : 'menu');
  if (e.target === codeInput) { if (e.code === 'Enter') Net.joinTyped(); return; }
  keys[e.code] = true;
  if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
  if (state === 'play' && M && !paused) {
    if (M.mode === 'local') KEYSETS.forEach((k, side) => { const i = k.ab.indexOf(e.code); if (i >= 0) useAbility(side, ABILITIES[i].id); });
    else { const i = KEYSETS[0].ab.indexOf(e.code); if (i >= 0) useAbility(M.me, ABILITIES[i].id); }
  }
  if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'play') setPause(!paused);
  else if (e.code === 'Escape') UI.back = true;
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
function keyMove(dt) {
  if (!M) return;
  const sets = M.mode === 'local' ? [[0, KEYSETS[0]], [1, KEYSETS[1]]] : [[M.me, { up: ['KeyW', 'ArrowUp'], down: ['KeyS', 'ArrowDown'], left: ['KeyA', 'ArrowLeft'], right: ['KeyD', 'ArrowRight'] }]];
  for (const [side, k] of sets) {
    const on = a => a.some(c => keys[c]);
    let dx = (on(k.right) ? 1 : 0) - (on(k.left) ? 1 : 0), dy = (on(k.down) ? 1 : 0) - (on(k.up) ? 1 : 0);
    if (!dx && !dy) continue;
    if (M.mirror) dx = -dx;
    const p = M.p[side]; p.tx = p.x + dx * 12; p.ty = p.y + dy * 12;
  }
}
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play') setPause(true); });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') setPause(true); });

/* --- 9. MAIN LOOP ----------------------------------------------------------------- */
const STEP = 1 / 120;
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  UI.begin();
  if (state === 'play' || state === 'over') {
    if (!paused) {
      acc += dt;
      while (acc >= STEP) { keyMove(STEP); if (M.mode === 'online' && !Net.isHost) guestStep(STEP); else if (state === 'play') step(STEP); else M.overT += STEP; acc -= STEP; }
    } else acc = 0;
    Net.tick();
    drawGame(now);
    if (paused) drawPause(); else if (state === 'over') drawOver(now);
  } else {
    acc += dt; while (acc >= STEP) { attractStep(STEP); acc -= STEP; }
    if (state === 'net') drawNet(); else drawTitle(now);
  }
  if (!(state === 'net' && Net.screen === 'join')) codeInput.style.display = 'none';
  UI.end();
  S.blit('#1ec8e0');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => { /* offline mode unavailable */ }));
}
PX.Pad.setup({
  title: 'Pixel Pong: controller', ui: UI, menu: () => state !== 'play' || paused,
  phone: { touch: 'DRAG HERE TO MOVE YOUR BAT', buttons: [['A', 'SMASH'], ['B', 'CURVE'], ['X', 'BIG BAT'], ['Y', 'FREEZE']] },
  // the power-ups are keys; the stick moves the bat smoothly: the further you push, the faster it goes.
  // A phone is a touch pad instead: the bat follows your finger, like dragging on a tablet.
  // 2 players on one screen: the second controller is player 2
  keys: n => n === 1 ? (M && M.mode === 'local' ? { A: 'Digit7', B: 'Digit8', X: 'Digit9', Y: 'Digit0', START: 'KeyP' } : null)
                     : { A: 'Digit1', B: 'Digit2', X: 'Digit3', Y: 'Digit4', START: 'KeyP' },
  onPlay: (h, n, dt) => {
    if (!M || (n === 1 && M.mode !== 'local')) return;
    const p = M.p[M.mode === 'local' ? n : M.me], m = Math.hypot(h.ax, h.ay);
    if (h.tdx || h.tdy) {                     // a slide across the whole touch pad = about 1.3 tables
      const k = 440;
      p.tx = clamp(p.tx + h.tdx * k * (M.mirror ? -1 : 1), -40, L + 40); p.ty = clamp(p.ty + h.tdy * k, -20, WD + 20);
      return;
    }
    if (m < 0.15) return;
    const k = Math.pow(Math.min(1, (m - 0.15) / 0.8), 1.4) * 340 * Math.max(dt, 1 / 60) / m;   // up to 340 units a second
    p.tx = p.x + h.ax * k * (M.mirror ? -1 : 1); p.ty = p.y + h.ay * k;
  },
  help: [['STICK|D-PAD', 'MOVE YOUR BAT (PUSH FURTHER = FASTER; A PHONE: DRAG ON ITS TOUCH PAD)'], ['A', 'SMASH'], ['B', 'CURVE'], ['X', 'BIG BAT'], ['Y', 'FREEZE'], ['START', 'PAUSE'], ['STICK|D-PAD', 'MENUS: PICK A BUTTON'], ['A', 'MENUS: OK'], ['B', 'MENUS: BACK'], ['2ND PAD', 'PLAYER 2 IN 2 PLAYERS (THE RIGHT BAT)']],
});
</script>
