<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Pixel Arcade: Mouse Thief, Pixel GP, Pixel Heist, Pixel Pong, Pixel Football, Pixel Hoops, Pixel Wings, Deep Catch, Pixel Skate, Pixel Ski, Pixel Box Fight, Pixel Bike Run, Pixel Cook, Pixel Runs, Pixel Sky GP, Pixel Moto, Pixel Defense, Pixel Hook, Pixel Miner, Pixel Horde, Pixel Snake and Pixel Farmings. Pixel-art games to play alone or with a friend.">

<meta name="mobile-web-app-capable" content="yes">

<title>Pixel Arcade</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0b13; }

  #screen { position: fixed; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
  #name, #search, #giveid, #chatmsg { position: fixed; display: none; box-sizing: border-box; text-align: center; text-transform: uppercase;
          font: bold 24px ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.2em;
          color: #111; background: #fbf9f3; border: 3px solid #111; border-radius: 0; outline: none; }
  #search, #chatmsg { text-align: left; letter-spacing: 0.1em; padding: 0 0.4em; }
  #pw1, #pw2, #code { position: fixed; display: none; box-sizing: border-box; text-align: center;

<body>
<canvas id="screen"></canvas>
<input id="search" maxlength="20" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" inputmode="search" enterkeyhint="search" placeholder="TYPE A GAME..." aria-label="Search games">

<script>
'use strict';
/* PIXEL ARCADE: the dashboard. Pick a game, set your name and avatar (all the games use them). */
const VERSION = '2.63.0';
const COFFEE_URL = '';                    // the maker's "buy me a coffee" page (Buy Me a Coffee, Ko-fi...); '' = no button
const canvas = document.getElementById('screen');
const S = PX.makeScreen(canvas, { H: 240, minW: 400, maxW: 560 });
const ctx = S.ctx, H = S.H;
const UI = PX.makeUI(S, canvas);
const T = (str, x, y, color = '#fff', size = 1, align = 'left', shadow = null) => PX.drawText(ctx, str, x, y, color, size, align, shadow);
let profile = PX.Profile.load();
PX.Profile.save(profile);

let draft = null;                     // the profile being edited

const searchInput = document.getElementById('search');
searchInput.addEventListener('input', () => { searchInput.value = searchInput.value.toUpperCase().replace(/[^A-Z0-9 ]/g, '').slice(0, 20); search.q = searchInput.value; scrollTo(0); pad.focus = 0; });
nameInput.addEventListener('input', () => { nameInput.value = nameInput.value.toUpperCase().replace(/[^A-Z0-9 ]/g, '').slice(0, 10); });
window.addEventListener('keydown', e => {
  if (e.target === chatInput) { if (e.key === 'Enter') Chat.send(); else if (e.key === 'Escape') Chat.leave(); return; }
  if (e.target === giveInput && screen === 'friends') { if (e.key === 'Enter') Friends.request(); else if (e.key === 'Escape') Friends.leave(); return; }
  if (e.target === giveInput) { if (e.key === 'Enter') Give.send(); else if (e.key === 'Escape') Give.leave(); return; }
  if (e.target === pw1 || e.target === pw2 || e.target === codeInput) { if (e.key === 'Enter') Account.enter(); else if (e.key === 'Escape') Account.back(); return; }
  if (e.target === nameInput && screen === 'account') { if (e.key === 'Enter') Account.enter(); else if (e.key === 'Escape') Account.back(); return; }
  if (e.target === nameInput) { if (e.key === 'Enter') saveProfile(); else if (e.key === 'Escape') { nameInput.blur(); screen = 'home'; } return; }
  if (e.target === ideaTitleInput) { if (e.key === 'Enter') { e.preventDefault(); ideaBodyInput.focus(); } else if (e.key === 'Escape') Ideas.back(); return; }
  if (e.target === ideaBodyInput) { if (e.key === 'Enter') { e.preventDefault(); Ideas.send(); } else if (e.key === 'Escape') Ideas.back(); return; }
  if (e.target === searchInput) { if (e.key === 'Enter') searchInput.blur(); else if (e.key === 'Escape') closeSearch(); return; }
  if (e.key === 'Escape') UI.back = true;
  if (screen === 'gift') { if (e.key === 'Enter' || e.key === ' ') claimGift(); return; }
  if (screen === 'stars') { if (e.key === 'Enter' || e.key === ' ') claimStars(); return; }
  if (screen === 'home' && e.key === '/') { e.preventDefault(); openSearch(); return; }
  if (screen === 'home' || screen === 'search') {
    const step = { ArrowDown: 40, ArrowUp: -40, PageDown: 150, PageUp: -150 }[e.key];
    if (step) { e.preventDefault(); scroll.v = 0; scrollTo(scroll.y + step); }
    if (e.key === 'Home') scrollTo(0); else if (e.key === 'End') scrollTo(1e9);
  }
});
UI.onDown = (e, x, y) => {

  const L = layout();

};
const thiefIcon = new Image(); thiefIcon.src = 'icons/icon-192.png';
const GAMES = [
  { id: 'thief', name: 'MOUSE THIEF', sub: 'RUN FROM THE CAT!', url: 'thief.html', color: '#e01e1e', cats: ['ACTION', 'RUNNING', 'ONLINE'], tags: 'CAT MOUSE CITY ROOFS' },
  { id: 'racer', name: 'PIXEL GP', sub: 'RACE CARS!', url: 'racer.html', color: '#2a7fd4', cats: ['RACING', 'ONLINE'], tags: 'CAR CARS DRIVE F1 FORMULA GRAND PRIX' },

  { id: 'fish', name: 'DEEP CATCH', sub: 'CATCH LEGENDARY FISH!', url: 'fish.html', color: '#2ad4d0', cats: ['SPORTS'], tags: 'FISH FISHING ROD SEA OCEAN BOAT LEGENDARY' },
  { id: 'skate', name: 'PIXEL SKATE', sub: 'SKATE, TRICK AND RACE!', url: 'skate.html', color: '#b07aff', cats: ['RACING', 'SPORTS', 'ONLINE'], tags: 'SKATEBOARD SKATE BOARD TRICK TRICKS KICKFLIP OLLIE GRIND RAMP RACE COINS' },

  { id: 'boxfight', name: 'PIXEL BOX FIGHT', sub: 'KNOCK THEM OUT!', url: 'boxfight.html', color: '#ff5a4a', cats: ['ACTION', 'SPORTS', 'ONLINE', '2 PLAYERS'], tags: 'BOX BOXING FIGHT PUNCH RING KO KNOCKOUT GLOVES UPPERCUT' },
  { id: 'bike', name: 'PIXEL BIKE RUN', sub: 'RIDE AND FLIP!', url: 'bike.html', color: '#f0a07a', cats: ['RACING', 'SPORTS', 'ONLINE'], tags: 'BIKE BICYCLE MOUNTAIN MTB BMX FLIP BACKFLIP WHEELIE TRICK TRICKS HILLS SUNSET MONEY' },

  { id: 'runs', name: 'PIXEL RUNS', sub: 'PARKOUR OVER THE ROOFS!', url: 'runs.html', color: '#ff7a3a', cats: ['RUNNING', 'ACTION'], tags: 'PARKOUR RUN RUNNER ROOF ROOFTOP JUMP SLIDE WALL ZIP LINE CITY ENDLESS MISSIONS COINS' },
  { id: 'skygp', name: 'PIXEL SKY GP', sub: 'RACE FLYING CARS!', url: 'skygp.html', color: '#9a6aff', cats: ['RACING', 'ONLINE'], tags: 'FLYING CAR CARS FLY SKY HOVER RACE GRAND PRIX GP FUTURE RINGS LASER CLOUD CITY NEON' },
  { id: 'moto', name: 'PIXEL MOTO', sub: 'MOTOCROSS: FLIP AND TRICK!', url: 'moto.html', color: '#e8303a', cats: ['RACING', 'SPORTS', 'ONLINE'], tags: 'MOTO MOTORBIKE MOTORCYCLE MOTOCROSS DIRT BIKE ENGINE FLIP BACKFLIP SUPERMAN WHEELIE TRICK TRICKS DESERT MONEY' },
  { id: 'defense', name: 'PIXEL DEFENSE', sub: 'STOP THE BLOBS!', url: 'defense.html', color: '#4ad48a', cats: ['ACTION'], tags: 'TOWER DEFENSE TD STRATEGY TOWERS BUILD UPGRADE WAVES ENEMIES BLOBS BOSS CASTLE CANNON SNIPER TESLA FROST METEOR MAPS ENDLESS WORKSHOP' },
  { id: 'farm', name: 'PIXEL FARMINGS', sub: 'GROW IT, SELL IT!', url: 'farm.html', color: '#7ad84a', cats: [], tags: 'FARM FARMING FARMINGS FARMER CROPS PLANT GROW SEEDS HARVEST CARROT WHEAT PUMPKIN CORN COW PIG SHEEP CHICKEN EGG MILK ANIMALS MARKET BARN TRACTOR' },
  { id: 'snake', name: 'PIXEL SNAKE', sub: 'EAT, GROW, CUT THEM OFF!', url: 'snake.html', color: '#5ad43f', cats: ['ACTION', 'ONLINE'], tags: 'SNAKE SNAKES IO ARENA BOTS DOTS EAT GROW BOOST KILLS MULTIPLAYER REAL PLAYERS ROOM SKINS' },
  { id: 'horde', name: 'PIXEL HORDE', sub: 'SURVIVE THE HORDE!', url: 'horde.html', color: '#ff4a4a', cats: ['ACTION'], tags: 'HORDE SURVIVE SURVIVOR SURVIVORS MONSTERS ARENA WAVES ROGUELITE LEVEL UP UPGRADES WEAPONS EVOLVE EVOLUTION BOSS HEROES KNIGHT MAGE MAGIC WHIP BOMBS LIGHTNING' },
  { id: 'miner', name: 'PIXEL MINER', sub: 'DIG DEEP, GET RICH!', url: 'miner.html', color: '#ffc81e', cats: ['ACTION'], tags: 'MINER MINING MINE DIG DIGGING DRILL ORE ORES GOLD DIAMOND GEMS UPGRADE UPGRADES CAVE LAVA CORE MONEY ARTIFACTS DEEP' },
  { id: 'hook', name: 'PIXEL HOOK', sub: 'SWING, FLY, FLIP!', url: 'hook.html', color: '#ff3a3a', cats: ['ACTION', 'ONLINE'], tags: 'HOOK GRAPPLE GRAPPLING ROPE SWING STICKMAN STICK FLY FLIP JUMP BOUNCE LEVELS ENDLESS PHYSICS LASER SAW NEON LAVA SKINS RACE TAG CHASE CATCH MULTIPLAYER FRIEND' },
];
// --- search: type a name, or pick a category -----------------------------------------------
const CATEGORIES = ['ALL', 'ACTION', 'RACING', 'SPORTS', 'RUNNING', 'PLANES', 'ONLINE', '2 PLAYERS'];
const search = { q: '', cat: 'ALL' };
function matches(g) {
  if (search.cat !== 'ALL' && !g.cats.includes(search.cat)) return false;
  const words = search.q.trim().split(/\s+/).filter(Boolean), hay = [g.name, g.sub, g.tags, ...g.cats].join(' ');
  return words.every(w => hay.includes(w));
}
function shown() { return screen === 'search' ? GAMES.filter(matches) : GAMES; }
function openSearch() { screen = 'search'; scroll.y = 0; scroll.v = 0; pad.focus = 0; searchInput.value = search.q; PX.Sound.tone(660, 0.05, { vol: 0.06 }); if (!pad.used) setTimeout(() => searchInput.focus(), 0); }
function closeSearch() { searchInput.blur(); screen = 'home'; scroll.y = 0; scroll.v = 0; pad.focus = 0; }
function magnifier(cx, cy, s, color = '#fff') { PX.drawIcon(ctx, ['.###..', '#...#.', '#...#.', '#...#.', '.####.', '....##', '.....#'], { '#': color }, cx, cy, s); }
let installPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => { /* offline mode unavailable */ }));
}
function play(g) { PX.Sound.tone([523, 784], 0.15, { vol: 0.12 }); setTimeout(() => Shell.go(g.url), 120); }
// GAMES DURING A CALL: a game is a page of its own, so opening it would end a call from the chat. During a call the
// arcade opens the game in a frame over itself instead: the call and its bar go on above the game, and < ALL GAMES
// (or the phone's back button) closes the frame (common.js catches the game going back to './'). While a game is in
// the frame the arcade stops drawing and lets go of the controller. Without a call, games open as always.
const Shell = window.ArcadeShell = {
  frame: null, popping: false,
  wanted() { return !!(PX.Voice.direct && PX.Voice.phase !== 'off'); },
  go(url) { if (this.wanted()) this.open(url); else location.href = url; },
  open(url) {
    if (this.frame) this.frame.remove();
    for (const el of [giveInput, pw1, pw2, codeInput, nameInput, ideaTitleInput, ideaBodyInput, searchInput, chatInput]) { el.blur(); el.style.display = 'none'; }
    const f = document.createElement('iframe');
    f.src = url; f.title = 'game';
    f.allow = 'autoplay; fullscreen; gamepad; microphone';
    f.style.cssText = 'position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;border:0;margin:0;z-index:50;background:#000;display:block;';
    f.addEventListener('load', () => { try { f.contentWindow.focus(); } catch (e) { /* fine */ } });
    document.body.appendChild(f); this.frame = f; screen = 'game'; PX.Pad.off = true;
    try { history.pushState({ game: 1 }, ''); } catch (e) { /* fine */ }      // (so the phone's back button closes the game)
  },
  back() {
    const f = this.frame; if (!f) return;
    this.frame = null; screen = 'home'; PX.Pad.off = false;
    setTimeout(() => f.remove(), 0);                                         // (after the game's own script step)
    if (!this.popping) try { history.back(); } catch (e) { /* fine */ }
    this.popping = false;
  },
};
addEventListener('popstate', () => { if (Shell.frame) { Shell.popping = true; Shell.back(); } });

// --- background: a slowly scrolling pixel starfield and floor grid ------------------------------
function background(t) {
  const W = S.W;
  ctx.fillStyle = '#0d0b13'; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 70; i++) {
    const x = ((i * 73.7 + t * (6 + (i % 3) * 6)) % (W + 10)) - 5, y = (i * 37.3) % 150;
    ctx.fillStyle = i % 5 ? '#4a4068' : '#efe9ff'; ctx.fillRect(Math.round(W - x), Math.round(y), 1, 1);
  }
  ctx.fillStyle = '#1d1830'; ctx.fillRect(0, 150, W, H - 150);
  ctx.fillStyle = '#3a2f5c';
  for (let k = 0; k < 8; k++) { const y = 150 + Math.round(Math.pow((k + (t * 0.6) % 1) / 8, 2) * (H - 150)); ctx.fillRect(0, y, W, 1); }
  for (let k = -10; k <= 10; k++) { const x0 = W / 2 + k * 14, x1 = W / 2 + k * 70; ctx.beginPath(); ctx.moveTo(x0, 150); ctx.lineTo(x1, H); ctx.strokeStyle = '#3a2f5c'; ctx.stroke(); }
}
// --- little animated previews on the game cards -----------------------------------------
function previewThief(x, y, w, h, t) {
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.fillStyle = '#140f24'; ctx.fillRect(x, y, w, h);
  for (let i = 0; i < 14; i++) { ctx.fillStyle = i % 4 ? '#6a5f90' : '#ffffff'; ctx.fillRect(x + (i * 37) % w, y + 4 + (i * 13) % (h - 26), 1, 1); }
  ctx.fillStyle = '#f3e9c8'; ctx.fillRect(x + w - 22, y + 6, 10, 10); ctx.fillRect(x + w - 23, y + 8, 12, 6);   // moon
  const sc = (t * 40) % 30;
  ctx.fillStyle = '#2a2240';                                               // far buildings
  for (let i = -1; i < 7; i++) { const bh = 14 + ((i + Math.floor(t * 40 / 30)) * 7) % 16; ctx.fillRect(Math.round(x + i * 30 - sc), y + h - 14 - bh, 24, bh); }
  ctx.fillStyle = '#e9c46a';
  for (let i = -1; i < 7; i++) ctx.fillRect(Math.round(x + i * 30 - sc + 6), y + h - 24, 2, 3);
  ctx.fillStyle = '#0d0b13'; ctx.fillRect(x, y + h - 14, w, 14); ctx.fillStyle = '#8070b0'; ctx.fillRect(x, y + h - 14, w, 1);
  const g = y + h - 14, leg = Math.floor(t * 12) % 2;
  // the thief, with the mouse on his head
  const tx = Math.round(x + w * 0.62), ty = g - 14 - (leg ? 1 : 0);
  ctx.fillStyle = '#8b7fb0'; ctx.fillRect(tx - 1, ty - 1, 9, 13);
  ctx.fillStyle = '#000'; ctx.fillRect(tx, ty, 7, 11); ctx.fillRect(tx + (leg ? 0 : 1), ty + 11, 2, 3); ctx.fillRect(tx + (leg ? 5 : 4), ty + 11, 2, 3);
  ctx.fillStyle = '#ff2424'; ctx.fillRect(tx + 3, ty + 3, 1, 2); ctx.fillRect(tx + 5, ty + 3, 1, 2);
  ctx.fillStyle = '#9b9b9b'; ctx.fillRect(tx + 1, ty - 4, 6, 3); ctx.fillStyle = '#e7a3ad'; ctx.fillRect(tx + 5, ty - 5, 2, 1);
  // the cat, right behind him
  const cx = Math.round(x + w * 0.18 + Math.sin(t * 2) * 4), cy = g - 12;
  ctx.fillStyle = '#8b7fb0'; ctx.fillRect(cx - 1, cy + 1, 24, 10);
  ctx.fillStyle = '#000';
  ctx.fillRect(cx, cy + 3, 16, 6); ctx.fillRect(cx + 14, cy, 8, 7); ctx.fillRect(cx + 14, cy - 2, 2, 2); ctx.fillRect(cx + 20, cy - 2, 2, 2);
  ctx.fillRect(cx - 4, cy + 1, 4, 2); ctx.fillRect(cx - 5, cy - 2, 2, 4);
  ctx.fillRect(cx + 1 + leg * 2, cy + 9, 2, 3); ctx.fillRect(cx + 11 - leg * 2, cy + 9, 2, 3);
  ctx.fillStyle = '#ff3b3b'; ctx.fillRect(cx + 16, cy + 2, 2, 2); ctx.fillRect(cx + 19, cy + 2, 2, 2);
  ctx.restore();
}
function previewRacer(x, y, w, h, t) {
  ctx.fillStyle = '#7ec4ec'; ctx.fillRect(x, y, w, h / 2);
  ctx.fillStyle = '#3fae4a'; ctx.fillRect(x, y + h / 2, w, h / 2);
  const hz = y + h / 2, cx = x + w / 2;
  for (let r = 0; r < h / 2; r++) {                              // road with moving stripes
    const k = r / (h / 2), half = 4 + k * w * 0.45, yy = hz + r;
    const stripe = Math.floor((1 / (k + 0.05)) * 3 - t * 12) % 2;
    ctx.fillStyle = stripe ? '#e01e1e' : '#f4f4f4'; ctx.fillRect(Math.round(cx - half - 3 - k * 4), yy, Math.round(3 + k * 4), 1); ctx.fillRect(Math.round(cx + half), yy, Math.round(3 + k * 4), 1);
    ctx.fillStyle = stripe ? '#6b6b73' : '#64646c'; ctx.fillRect(Math.round(cx - half), yy, Math.round(half * 2), 1);
  }
  const cw = 34, ch = 16, carX = Math.round(cx - cw / 2 + Math.sin(t * 1.5) * 10), carY = y + h - ch - 2;   // a little race car
  ctx.fillStyle = '#111'; ctx.fillRect(carX, carY + 5, 7, 11); ctx.fillRect(carX + cw - 7, carY + 5, 7, 11);
  ctx.fillStyle = PX.AVATAR_COLORS[profile.avatar.color]; ctx.fillRect(carX + 9, carY + 6, 16, 8);
  ctx.fillStyle = '#ffd23f'; ctx.fillRect(carX + 15, carY + 3, 4, 3);
  ctx.fillStyle = '#16161c'; ctx.fillRect(carX + 3, carY, 28, 3); ctx.fillStyle = PX.AVATAR_COLORS[profile.avatar.color]; ctx.fillRect(carX + 3, carY, 28, 1);
}
function previewSkyGP(x, y, w, h, t) {            // a flying car over the skyway at dusk, a boost ring comes closer
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ['#2b1a5e', '#5a2a78', '#a8487a', '#ff9a6a'].forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(x, y + i * 7, w, 8); });

// --- GIVE STARS: send some of your own stars to a friend, by their ID -----------------------------------------
// The arcade has no server of its own, and the stars live on each phone. So a gift waits on ntfy.sh, a free public
// message service: your phone posts "N stars for this ID" there, and the arcade of the player with that ID asks for
// its messages when it is opened (and once a minute after that) and shows a popup. ntfy.sh keeps a message for about
// 12 hours: a gift nobody picks up in that time is lost. What goes through ntfy.sh: the two IDs, your name, the amount.
// (Anyone who knows how can post there too, so this is for friends, not a bank.)
const RELAY = 'https://ntfy.sh/', relayTopic = id => 'pixel-arcade-stars-' + id;
const giveInput = document.getElementById('giveid');
giveInput.addEventListener('input', () => { giveInput.value = giveInput.value.replace(/[^0-9]/g, '').slice(0, 6); Give.told = false; Friends.told = false; });
const validId = id => /^[1-9][0-9]{5}$/.test(id);
const newTx = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const GIVE_AMOUNTS = [10, 50, 100, 500, 1000];
const Give = {
  msg: '', col: '#9a92b8', amount: 50, busy: false, told: false, from: 'home',
  say(m, col = '#9a92b8') { this.msg = m; this.col = col; },
  fail(m) { this.busy = false; this.told = true; this.say(m, '#ff8a8a'); PX.Sound.tone(150, 0.2); },
  open(id = '') { this.from = screen === 'friends' ? 'friends' : 'home'; screen = 'give'; giveInput.value = id; this.told = false; PX.Sound.unlock(); this.say('YOUR FRIEND GETS A POPUP THE NEXT TIME THEY OPEN THE ARCADE.'); },
  leave() { giveInput.blur(); screen = this.from; this.from = 'home'; },
  check() {                                          // what is wrong with what you typed, if anything
    const id = giveInput.value;
    if (!/^[1-9][0-9]{5}$/.test(id)) return "TYPE THE 6 DIGITS OF YOUR FRIEND'S ID.";
    if (id === profile.id) return "THAT'S YOUR OWN ID!";
    const w = Who.ask(id);                           // is it a player at all?
    if (w.s !== 'yes') return Who.line(w)[0];
    if (PX.Wallet.get() < this.amount) return "YOU DON'T HAVE ★" + this.amount + '.';
    return '';
  },
  async send() {
    if (this.busy) return;
    const bad = this.check(); if (bad) return this.fail(bad);
    const id = giveInput.value, n = this.amount;
    if (!PX.Wallet.spend(n)) return this.fail("YOU DON'T HAVE ★" + n + '.');        // the stars leave your wallet now (and come back if sending fails)
    this.busy = true; giveInput.blur(); this.say('SENDING...');
    try {
      const gift = { v: 1, tx: newTx(), n, from: profile.name, fid: profile.id };
      const res = await fetch(RELAY + relayTopic(id), { method: 'POST', body: JSON.stringify(gift) });
      if (!res.ok) throw new Error('relay ' + res.status);
      PX.Push.tell(id, 'gift', { n });
      this.busy = false; giveInput.value = ''; this.told = true;
      this.say('★' + n + ' SENT TO ' + Who.ask(id).name + ' (' + id + ')! IT WAITS 12 HOURS FOR THEM TO OPEN THE ARCADE.', '#5ad43f'); PX.Sound.tone([523, 659, 784, 1047], 0.35, { vol: 0.12 });
    } catch (e) {
      const d = PX.Wallet.read(); d.points = (d.points | 0) + n; PX.Wallet.write(d);       // back in your wallet
      this.fail("COULDN'T SEND IT. CHECK YOUR INTERNET AND TRY AGAIN.");
    }
  },
};
// gifts that are waiting for you: asked for when the arcade opens, then once a minute while you look at the games
const Inbox = {
  KEY: 'pixelArcade.giftsSeen', list: [], last: -1e9,
  seen() { try { const a = JSON.parse(localStorage.getItem(this.KEY)); return Array.isArray(a) ? a : []; } catch (e) { return []; } },
  done(g) {                                          // remember a gift you took or turned down, so it never comes twice
    this.list = this.list.filter(x => x.tx !== g.tx);
    try { localStorage.setItem(this.KEY, JSON.stringify([...this.seen(), g.tx].slice(-1000))); return this.seen().includes(g.tx); } catch (e) { return false; }
  },
  async check() {
    this.last = performance.now();
    Who.beat();
    try {
      const res = await fetch(RELAY + relayTopic(profile.id) + '/json?poll=1&since=all', { cache: 'no-store' });
      if (!res.ok) return;
      const seen = this.seen();
      for (const row of (await res.text()).split('\n')) {
        let m = null, at = 0;
        try { const ev = JSON.parse(row); if (ev.event === 'message') { m = JSON.parse(ev.message); at = +ev.time || 0; } } catch (e) { /* not a gift */ }
        if (m && m.v === 1 && typeof m.t === 'string' && typeof m.tx === 'string' && m.tx && m.tx.length <= 40) {      // about friends: a request, an answer to yours, an invite to a game, or a chat message
          if (!seen.includes(m.tx)) { seen.push(m.tx); try { localStorage.setItem(this.KEY, JSON.stringify(seen.slice(-1000))); } catch (e) { /* private mode */ } if (m.t === 'inv') gotInvite(m, at); else if (m.t === 'chat') Chat.got(m, at); else Friends.got(m); }
          continue;
        }
        if (!m || m.v !== 1 || !Number.isInteger(m.n) || m.n < 1 || m.n > 1000 || typeof m.tx !== 'string' || !m.tx || m.tx.length > 40) continue;
        if (seen.includes(m.tx) || this.list.some(x => x.tx === m.tx)) continue;
        const who = PX.cleanName(m.from) || 'A FRIEND';
        this.list.push({ relay: true, tx: m.tx, stars: m.n, fid: /^[1-9][0-9]{5}$/.test(m.fid) ? m.fid : '', back: m.back === true,
                         note: m.back === true ? who + ' SAID NO THANKS: YOUR STARS ARE BACK' : 'FROM ' + who });
      }

  },
  // NO THANKS to a friend's gift: the stars go back to the friend, as a gift the same way (so it waits 12 hours too)
  async giveBack(g) {
    if (g.sending) return;
    if (!g.fid || g.fid === profile.id) { this.done(g); screen = 'home'; return; }       // nobody to send them back to
    g.sending = true;
    try {
      const res = await fetch(RELAY + relayTopic(g.fid), { method: 'POST', body: JSON.stringify({ v: 1, tx: 'b' + g.tx.slice(0, 38), n: g.stars, from: profile.name, fid: profile.id, back: true }) });
      if (!res.ok) throw new Error('relay ' + res.status);
      PX.Push.tell(g.fid, 'back', { n: g.stars });
      this.done(g); PX.Sound.tone(300, 0.12, { vol: 0.08 }); if (screen === 'stars') screen = 'home';
    } catch (e) { g.sending = false; g.note = "COULDN'T SEND THEM BACK. CHECK YOUR INTERNET."; PX.Sound.tone(150, 0.2); }
  },
};

// --- is that ID a player? --------------------------------------------------------------------------------------
// There is no list of players anywhere (no server). So every arcade says "I'm here" on ntfy.sh when it is opened: its
// name, on a topic of its own ID, again every 6 hours. ntfy.sh keeps that for about 12 hours. An ID is a player if it
// said so in that time: the arcade looks it up as soon as you have typed the 6 digits (in GIVE STARS and in FRIENDS).
// Your friends are players for sure: they are never looked up.
const HERE_KEY = 'pixelArcade.hereAt', hereTopic = id => 'pixel-arcade-player-' + id;
const Who = {
  map: {},
  async beat() {
    let last = 0;
    try { const h = JSON.parse(localStorage.getItem(HERE_KEY)); if (h && h.id === profile.id && h.name === profile.name) last = +h.t || 0; } catch (e) { /* never said it */ }
    if (Math.abs(Date.now() - last) < 6 * 3600e3 || this.beating) return;
    this.beating = true;
    try {
      const res = await fetch(RELAY + hereTopic(profile.id), { method: 'POST', body: JSON.stringify({ v: 1, here: 1, name: profile.name }) });
      if (res.ok) localStorage.setItem(HERE_KEY, JSON.stringify({ id: profile.id, name: profile.name, t: Date.now() }));
    } catch (e) { /* offline: next time */ }
    this.beating = false;
  },
  ask(id) {                                          // { s: 'wait' | 'yes' | 'no' | 'err', name }, asked once and then remembered
    const f = Friends.find(id); if (f) return { s: 'yes', name: f.name };
    let e = this.map[id];
    if (!e || ((e.s === 'no' || e.s === 'err') && performance.now() - e.t > 15000)) { e = this.map[id] = { s: 'wait', name: '', t: performance.now() }; this.look(id, e); }
    return e;
  },
  async look(id, e) {
    try {
      const res = await fetch(RELAY + hereTopic(id) + '/json?poll=1&since=all', { cache: 'no-store' });
      if (!res.ok) throw new Error('relay ' + res.status);
      let name = '';
      for (const row of (await res.text()).split('\n')) {
        try { const ev = JSON.parse(row), m = ev.event === 'message' ? JSON.parse(ev.message) : null; if (m && m.v === 1 && m.here) name = PX.cleanName(m.name) || 'PLAYER'; } catch (x) { /* not a player's hello */ }

// --- FRIENDS: send a request to a player's ID; they see it as pending in the same menu and add you ---------------
// The messages go the same way as a gift of stars (ntfy.sh, to the topic of the other player's ID, kept 12 hours):
//   freq: "be my friend"   fyes: "yes" (now both have each other)   fno: "no"   fbye: "not friends any more"

  },

  fail(m) { this.busy = false; this.told = true; this.say(m, '#ff8a8a'); PX.Sound.tone(150, 0.2); },
  open() {

  },

  cancel(f) { this.drop('out', f.id); this.save(); this.post(f.id, 'fbye').catch(() => { /* offline */ }); PX.Sound.tone(300, 0.12, { vol: 0.08 }); },
  remove(f) { this.sure = ''; this.drop('list', f.id); this.save(); this.post(f.id, 'fbye').catch(() => { /* offline */ }); PX.Sound.tone(300, 0.12, { vol: 0.08 }); },
  got(m) {                                           // a message about friends came in (each one only once)

// --- ONLINE / OFFLINE: which friends are playing right now --------------------------------------------------------
// Every arcade and game says "I'm online" (PX.Presence in common.js). Here all your friends' topics are asked for
// in one request (the last 6 minutes): every 20 seconds while FRIENDS or a chat is open.
const Online = {
  st: {}, last: -1e9, busy: false,
  async poll() {
    const ids = Friends.d.list.map(f => f.id);
    this.last = performance.now();
    if (!ids.length || this.busy) return;
    this.busy = true;
    try {
      const res = await fetch(RELAY + ids.map(PX.Presence.topic).join(',') + '/json?poll=1&since=6m', { cache: 'no-store' });
      if (!res.ok) throw new Error('relay ' + res.status);
      const st = {};
      for (const row of (await res.text()).split('\n')) {
        try {
          const ev = JSON.parse(row), m = ev.event === 'message' ? JSON.parse(ev.message) : null, id = String(ev.topic || '').replace('pixel-arcade-on-', '');
          if (!m || m.v !== 1 || !ids.includes(id)) continue;
          const t = Number.isFinite(m.t) ? m.t : 0, at = (+ev.time || 0) * 1000;
          if (!st[id] || t >= st[id].t) st[id] = { t, at, on: m.on === 1, g: typeof m.g === 'string' ? m.g : '' };
        } catch (e) { /* not a hello */ }
      }
      for (const id of ids) this.st[id] = st[id] || { t: 0, at: 0, on: false, g: '' };
    } catch (e) { /* offline: keep what we knew */ }
    this.busy = false;
  },
  // { s: 'on' | 'off' | '?', text, col } for a friend
  of(id) {
    const e = this.st[id];
    if (!e) return { s: '?', text: '...', col: '#5b5275' };
    if (!e.on || Date.now() - e.at > PX.Presence.FRESH) return { s: 'off', text: 'OFFLINE', col: '#7a7290' };
    const g = e.g && GAMES.find(x => x.url === e.g + '.html');
    return { s: 'on', text: g ? 'PLAYING ' + g.name : 'ONLINE', col: '#5ad43f' };
  },
};
function onlineDot(x, y, o) {             // a green dot when online, a grey ring when not
  ctx.fillStyle = '#000'; ctx.fillRect(x, y - 1, 7, 7);
  ctx.fillStyle = o.s === 'on' ? '#5ad43f' : '#5b5275'; ctx.fillRect(x + 1, y, 5, 5);
  if (o.s !== 'on') { ctx.fillStyle = '#16121f'; ctx.fillRect(x + 2, y + 1, 3, 3); }
}

  'FRIENDS AND GIFTS OF STARS GO THROUGH NTFY.SH, AN OUTSIDE MESSAGE SERVICE: YOUR ID, YOUR NAME AND THE STARS. NOTIFICATIONS (IF ON) GO THROUGH YOUR PHONE MAKER\'S PUSH SERVICE.',
  'THE ARCADE COUNTS VISITS WITHOUT KNOWING WHO YOU ARE: WHICH GAME, WHICH COUNTRY AND A RANDOM CODE.',
  "USE A NICKNAME, NEVER YOUR REAL NAME. DON'T USE A PASSWORD THAT YOU USE SOMEWHERE ELSE.",
  "CLEARING THE BROWSER'S DATA LOGS YOU OUT AND DELETES THE STARS AND SAVES ON THIS PHONE. THE ACCOUNT STAYS ON THE SERVER.",
];
function tickIcon(cx, cy) { PX.drawIcon(ctx, ['......#', '.....##', '#...##.', '##.##..', '.###...', '..#....'], { '#': '#5ad43f' }, cx, cy, 1); }
function drawAccount(t) {
  const W = S.W, cx = Math.round(W / 2), A = Account, m = A.mode, busy = A.busy, locked = A.locked();
  const put = (el, label, y) => { T(label, cx - 78, y + 9, '#efe9ff', 1, 'right', '#000'); S.placeInput(el, cx - 70, y, 140, 24); el.placed = true; };
  const msg = y => {
    const text = busy ? 'ONE MOMENT...' : A.can ? A.msg : 'ACCOUNTS ONLY WORK ON THE REAL (HTTPS) ARCADE.';
    for (const line of wrapText(text, W - 24)) { T(line, cx, y, busy ? '#9a92b8' : A.can ? A.col : '#ff8a8a', 1, 'center', '#000'); y += 9; }
  };
  const policy = x => { if (UI.button('policy', x, 212, 140, 22, 'PRIVACY AND POLICY', { size: 1, accent: '#1ec8e0', disabled: busy })) A.go('policy'); };
  const remote = (x, y, w, h) => { if (UI.button('aremote', x, y, w, h, 'LOG IN FROM ANOTHER PHONE', { size: 1, accent: '#1ec8e0', disabled: busy || !A.can || A.list.length >= MAX_ACCOUNTS })) A.go('remote'); };
  background(t);
  if (UI.back) A.back();
  if (m === 'policy') {
    T('PRIVACY AND POLICY', cx, 8, '#fff', 3, 'center', '#000');
    let y = 30;
    POLICY.forEach((p, i) => {
      T((i + 1) + '.', 12, y, '#ffd23f', 1);
      for (const line of wrapText(p, W - 40)) { T(line, 24, y, i === 2 || i === 3 ? '#fff' : '#cfc8e8', 1); y += 9; }
      y += 3;
    });
    if (UI.button('pback', cx - 50, 216, 100, 20, 'BACK')) A.back();
    return;
  }
  const fresh = m === 'new' && locked;               // a new player (the others' accounts are packed away)
  T({ new: fresh ? 'NEW ACCOUNT' : 'MAKE AN ACCOUNT', code: 'YOUR RECOVERY CODE', menu: 'YOUR ACCOUNT', change: 'CHANGE PASSWORD', delete: 'DELETE ACCOUNT', pick: 'WHO IS PLAYING?', login: 'LOG IN', forgot: 'FORGOT PASSWORD', join: 'THE LEADERBOARD', remote: 'FROM ANOTHER PHONE' }[m], cx, 8, '#fff', 3, 'center', '#000');
  const who = m === 'login' || m === 'forgot' || (m === 'code' && A.fresh) ? A.sel : m === 'pick' || m === 'remote' || fresh ? null : profile;
  if (who) {
    const nw = PX.textWidth(who.name, 2), rx = Math.round(cx - (36 + nw) / 2);
    PX.drawAvatar(ctx, who.avatar, rx, 28, 2);
    T(who.name, rx + 36, 34, '#fff', 2, 'left', '#000'); T('ID ' + who.id, rx + 36, 47, '#9a92b8', 1, 'left', '#000');
  }
  if (m === 'pick') {
    T('PICK YOUR ACCOUNT AND TYPE YOUR PASSWORD.', cx, 28, '#efe9ff', 1, 'center', '#000');
    A.list.forEach((a, i) => {
      const x = cx - 184 + (i % 2) * 188, y = 40 + Math.floor(i / 2) * 40;
      if (UI.button('acc' + a.id, x, y, 180, 36, '', { accent: PX.AVATAR_COLORS[a.avatar.color] })) A.pick(a);
      PX.drawAvatar(ctx, a.avatar, x + 5, y + 2, 2); T(a.name, x + 42, y + 8, '#fff', 2, 'left', '#000'); T('ID ' + a.id, x + 42, y + 22, '#9a92b8', 1);
    });
    const full = A.list.length >= MAX_ACCOUNTS;
    if (UI.button('anew', cx - 184, 164, 180, 22, 'NEW ACCOUNT', { accent: '#5ad43f', disabled: full })) A.go('new');
    remote(cx + 4, 164, 180, 22);
    T(full ? 'THIS PHONE HAS ' + MAX_ACCOUNTS + ' ACCOUNTS: THAT IS ALL IT CAN HOLD.' : 'A NEW ACCOUNT STARTS WITH ITS OWN NAME, ID, STARS AND FRIENDS.', cx, 194, '#5b5275', 1, 'center', '#000');
    policy(cx - 70);
  } else if (m === 'new') {
    if (fresh) {
      T('A NICKNAME (NOT YOUR REAL NAME!) AND A PASSWORD: 4 TO 20 LETTERS OR NUMBERS.', cx, 28, '#efe9ff', 1, 'center', '#000');
      put(nameInput, 'NICKNAME', 40); put(pw1, 'PASSWORD', 68); put(pw2, 'AGAIN', 96);
    } else {
      T('CHOOSE A PASSWORD: 4 TO 20 LETTERS OR NUMBERS. BIG AND SMALL LETTERS COUNT.', cx, 62, '#efe9ff', 1, 'center', '#000');
      put(pw1, 'PASSWORD', 74); put(pw2, 'AGAIN', 102);
    }
    if (UI.button('acreate', cx - 100, fresh ? 126 : 132, 200, 24, 'MAKE MY ACCOUNT', { accent: '#5ad43f', disabled: busy || !A.can })) A.create();
    msg(fresh ? 158 : 162);
    T(fresh ? 'YOU START WITH YOUR OWN ID, STARS, FRIENDS AND GAME SAVES.' : 'YOU KEEP YOUR NAME, ID, STARS AND FRIENDS. OTHERS CAN MAKE THEIR OWN ACCOUNT.', cx, 182, '#5b5275', 1, 'center', '#000');
    T("YOU'LL GET A RECOVERY CODE, IN CASE YOU FORGET THE PASSWORD.", cx, 192, '#5b5275', 1, 'center', '#000');
    if (UI.button('aback', cx - 184, 212, 54, 22, 'BACK', { size: 1, disabled: busy })) A.back();
    remote(cx - 124, 212, 124, 22);
    policy(cx + 6);
  } else if (m === 'remote') {
    T('THE NICKNAME AND PASSWORD OF YOUR ACCOUNT ON ANOTHER PHONE.', cx, 30, '#efe9ff', 1, 'center', '#000');
    put(nameInput, 'NICKNAME', 44); put(pw1, 'PASSWORD', 72);
    if (UI.button('aremotego', cx - 100, 104, 200, 24, 'LOG IN', { accent: '#5ad43f', disabled: busy || !A.can })) A.fromAnotherPhone();
    msg(136);
    T('IT COMES HERE WITH ITS NAME, ID AND AVATAR. ITS STARS AND', cx, 166, '#5b5275', 1, 'center', '#000');
    T('GAME SAVES STAY ON THE OTHER PHONE (FOR NOW).', cx, 176, '#5b5275', 1, 'center', '#000');
    if (UI.button('aback', cx - 124, 212, 100, 22, 'BACK', { disabled: busy })) A.back();
    policy(cx - 16);
  } else if (m === 'code') {
    T('WRITE THIS CODE DOWN ON PAPER AND KEEP IT SAFE:', cx, 70, '#efe9ff', 1, 'center', '#000');
    T(A.code.slice(0, 4) + '-' + A.code.slice(4), cx, 86, '#ffd23f', 5, 'center', '#3a2f5c');
    T('IF YOU FORGET YOUR PASSWORD, THIS CODE IS THE ONLY WAY BACK IN.', cx, 124, '#fff', 1, 'center', '#000');
    T("WE CAN'T RESET A PASSWORD FOR YOU, AND THE CODE IS SHOWN ONLY NOW.", cx, 134, '#ff8a8a', 1, 'center', '#000');
    if (UI.button('acode', cx - 90, 156, 180, 24, 'I WROTE IT DOWN', { accent: '#5ad43f', disabled: busy })) {
      A.code = '';
      if (A.fresh) A.reload(); else { A.go('menu'); A.say('YOUR ACCOUNT IS READY!', '#5ad43f'); }
    }
    msg(190);
  } else if (m === 'menu') {
    const me = A.me();
    T('YOU ARE LOGGED IN. LOG OUT, AND SOMEONE ELSE CAN PLAY ON THEIR OWN ACCOUNT.', cx, 64, '#efe9ff', 1, 'center', '#000');
    if (UI.button('alogout', cx - 100, 76, 200, 24, 'LOG OUT', { accent: '#ff8a2a', disabled: busy })) A.logout();
    if (UI.button('achange', cx - 100, 104, 200, 20, 'CHANGE PASSWORD', { size: 1, disabled: busy })) A.go('change');
    if (UI.button('adelete', cx - 100, 128, 200, 20, 'DELETE ACCOUNT', { size: 1, disabled: busy })) A.go('delete');
    if (me && me.srv && me.tok) { const tw = PX.textWidth('ON THE LEADERBOARD', 1); T('ON THE LEADERBOARD', cx - 5, 158, '#5ad43f', 1, 'center', '#000'); tickIcon(cx - 5 + Math.ceil(tw / 2) + 8, 160); }
    else if (UI.button('ajoin', cx - 100, 152, 200, 20, me && me.srv ? 'LOG IN TO THE LEADERBOARD' : 'JOIN THE LEADERBOARD', { size: 1, accent: '#ffd23f', disabled: busy })) A.go('join');
    msg(178);
    T('ACCOUNTS ON THIS PHONE: ' + A.list.length + ' OF ' + MAX_ACCOUNTS, cx, 198, '#5b5275', 1, 'center', '#000');
    if (UI.button('aback', cx - 124, 212, 100, 22, 'BACK', { disabled: busy })) A.back();
    policy(cx - 16);
  } else if (m === 'join') {
    const again = A.me() && A.me().srv;
    T(again ? 'THIS PHONE LOST ITS KEY TO THE LEADERBOARD. TYPE YOUR PASSWORD' : 'YOUR ACCOUNT GOES ON OUR SERVER TOO: YOU CAN LOG IN ON ANY', cx, 64, '#efe9ff', 1, 'center', '#000');
    T(again ? 'AND YOUR BEST SCORES GO UP AGAIN.' : 'PHONE, AND YOUR BEST SCORES GO ON THE LEADERBOARD.', cx, 74, '#efe9ff', 1, 'center', '#000');
    put(pw1, 'PASSWORD', 88);
    if (UI.button('ajoingo', cx - 100, 120, 200, 24, again ? 'LOG IN' : 'JOIN', { accent: '#5ad43f', disabled: busy })) A.joinBoard();
    msg(152);
    if (!again) T("YOU'LL GET A NEW RECOVERY CODE (THE OLD ONE STOPS WORKING).", cx, 180, '#5b5275', 1, 'center', '#000');
    if (UI.button('aback', cx - 124, 212, 100, 22, 'BACK', { disabled: busy })) A.back();
    policy(cx - 16);
  } else if (m === 'change') {
    put(pw1, 'OLD PASSWORD', 72); put(pw2, 'NEW PASSWORD', 100);
    if (UI.button('asave', cx - 100, 132, 200, 24, 'SAVE', { accent: '#5ad43f', disabled: busy })) A.change();
    msg(166);
    if (UI.button('aback', cx - 50, 212, 100, 22, 'BACK', { disabled: busy })) A.back();
  } else if (m === 'delete') {
    const srv = A.me() && A.me().srv;
    if (A.list.length > 1) T('THIS DELETES THE ACCOUNT FOR GOOD: ITS NAME, ID, STARS, FRIENDS AND GAME SAVES!', cx, 62, '#ff8a8a', 1, 'center', '#000');
    else T('ONLY THE PASSWORD GOES AWAY. YOUR NAME, ID, STARS AND FRIENDS STAY ON THIS PHONE.', cx, 62, '#efe9ff', 1, 'center', '#000');
    if (srv) T('IT IS ALSO DELETED FROM THE SERVER AND THE LEADERBOARD.', cx, 72, '#ff8a8a', 1, 'center', '#000');
    put(pw1, 'PASSWORD', 84);
    if (UI.button('adel', cx - 100, 116, 200, 24, 'DELETE ACCOUNT', { accent: '#ff5a5a', disabled: busy })) A.remove();
    msg(150);
    if (UI.button('aback', cx - 50, 212, 100, 22, 'BACK', { disabled: busy })) A.back();
  } else if (m === 'login') {
    put(pw1, 'PASSWORD', 74);
    if (UI.button('alogin', cx - 100, 106, 200, 24, 'LOG IN', { accent: '#5ad43f', disabled: busy })) A.login();
    msg(140);
    if (UI.button('aback', cx - 171, 212, 70, 22, 'BACK', { size: 1, disabled: busy })) A.back();
    if (UI.button('aforgot', cx - 95, 212, 120, 22, 'FORGOT PASSWORD?', { size: 1, disabled: busy })) A.go('forgot');
    policy(cx + 31);
  } else if (m === 'forgot') {
    let y = 62;
    const text = A.sel && A.sel.srv ? "WE CAN'T SEND YOU A NEW PASSWORD: WE DON'T KNOW YOUR E-MAIL. TYPE THE RECOVERY CODE YOU WROTE DOWN, AND A NEW PASSWORD. (THIS NEEDS INTERNET.)"
      : "WE CAN'T SEND YOU A NEW PASSWORD: WE DON'T KNOW YOUR E-MAIL. TYPE THE RECOVERY CODE YOU WROTE DOWN, AND A NEW PASSWORD.";
    for (const line of wrapText(text, W - 24)) { T(line, cx, y, '#efe9ff', 1, 'center', '#000'); y += 9; }
    put(codeInput, 'RECOVERY CODE', 92); put(pw2, 'NEW PASSWORD', 120);
    if (UI.button('areset', cx - 100, 150, 200, 24, 'SET NEW PASSWORD', { accent: '#5ad43f', disabled: busy })) A.reset();
    msg(182);
    if (UI.button('aback', cx - 124, 212, 100, 22, 'BACK', { disabled: busy })) A.back();
    policy(cx - 16);
  }
}

// --- an INVITE from a friend to their online game -----------------------------------------------------------------
// In an online game, the screen with the game's code has INVITE A FRIEND (PX.Invite in common.js). The invite comes
// here like a gift of stars, and pops up over the list of games: JOIN opens that game with the code, and it joins.
// Only from players on your FRIENDS list, and only for 10 minutes (then the game is most likely gone).
const ONLINE_GAMES = ['thief', 'racer', 'pong', 'football', 'wings', 'skate', 'ski', 'boxfight', 'bike', 'skygp', 'moto', 'snake', 'hook'];
let invite = null;                                  // { name, g: the game, code }
function gotInvite(m, at) {
  const f = Friends.find(m.fid), g = ONLINE_GAMES.includes(m.g) && GAMES.find(x => x.url === m.g + '.html');
  if (!f || !g || typeof m.code !== 'string' || m.code.length !== 4 || ![...m.code].every(c => PX.CODE_CHARS.includes(c))) return;
  if (at && Date.now() / 1000 - at > 600) return;
  invite = { name: f.name, g, code: m.code }; PX.Sound.tone([784, 1047, 784, 1047], 0.4, { vol: 0.12 });
}
function joinInvite() { const i = invite; invite = null; PX.Sound.tone([523, 784], 0.15, { vol: 0.12 }); setTimeout(() => Shell.go(i.g.url + '?join=' + i.code), 120); }
function drawInvite(t) {
  const W = S.W, i = invite;
  drawHome(t);
  if (!i) { screen = 'home'; return; }
  UI.list = [];                                     // only JOIN and NO THANKS can be pressed while the invite is up
  ctx.fillStyle = 'rgba(13,11,19,0.6)'; ctx.fillRect(0, 0, W, H);
  const pw = Math.min(300, W - 30), x = Math.round(W / 2 - pw / 2), y = 54, ph = 136;
  ctx.fillStyle = i.g.color; ctx.fillRect(x - 2, y - 2, pw + 4, ph + 4); ctx.fillStyle = '#16121f'; ctx.fillRect(x, y, pw, ph);
  T(i.name, W / 2, y + 12, '#fff', 3, 'center', '#000');
  T('INVITES YOU TO PLAY', W / 2, y + 36, '#efe9ff', 2, 'center', '#000');
  T(i.g.name, W / 2, y + 56, i.g.color, 4, 'center', '#000');
  T('GAME CODE: ' + i.code, W / 2, y + 86, '#9a92b8', 1, 'center', '#000');
  if (UI.button('ijoin', Math.round(W / 2 - 124), y + 102, 120, 24, pad.used ? 'A: JOIN' : 'JOIN', { accent: '#5ad43f' })) joinInvite();
  if (UI.button('ino', Math.round(W / 2 + 4), y + 102, 120, 24, 'NO THANKS', { size: 1 }) || UI.back) { invite = null; screen = 'home'; PX.Sound.tone(300, 0.12, { vol: 0.08 }); }
}

let t0 = performance.now(), tPrev = t0, callCheck = -1e9;
function frame(now) {
  const t = (now - t0) / 1000;
  if (Shell.frame) {                                 // a game is open over the arcade (during a call): only keep listening for calls
    if (now - callCheck > 10000) { callCheck = now; PX.Call.start(); }
    tPrev = now; requestAnimationFrame(frame); return;
  }
  padPoll(Math.min(0.05, (now - tPrev) / 1000));
  scrollStep(Math.min(0.05, (now - tPrev) / 1000)); tPrev = now;
  UI.begin();
  if ((screen === 'home' || screen === 'friends') && performance.now() - Inbox.last > 20000) Inbox.check();      // (every 20 seconds: an invite to a game shouldn't wait long)
  if (screen === 'chat' && performance.now() - Inbox.last > 5000) Inbox.check();       // (every 5 seconds while you chat)
  if ((screen === 'friends' || screen === 'chat') && performance.now() - Online.last > 20000) Online.poll();
  if (now - callCheck > 10000) { callCheck = now; PX.Call.start(); }               // wait for friends' calls (PX.Call)
  if (now - Update.at > 600e3) Update.check();
  Update.step();
  if (screen === 'home' && starGiftDue()) screen = 'stars';
  if (screen === 'home' && invite) screen = 'invite';
  if (screen === 'gift') drawGift(t); else if (screen === 'stars') drawStars(t); else if (screen === 'invite') drawInvite(t); else if (screen === 'give') drawGive(t); else if (screen === 'friends') drawFriends(t); else if (screen === 'chat') drawChat(t); else if (screen === 'leaders') drawLeaders(t); else if (screen === 'ideas') drawIdeas(t); else if (screen === 'account') drawAccount(t); else if (screen === 'home') drawHome(t); else if (screen === 'search') drawSearch(t); else if (screen === 'remote') drawRemote(t); else if (screen === 'settings') drawSettings(t); else if (screen === 'coffee') drawCoffee(t); else if (screen === 'notify') drawNotify(t); else drawProfile(t);
  if (screen !== 'give' && screen !== 'friends') giveInput.style.display = 'none';
  for (const el of [pw1, pw2, codeInput, nameInput, ideaTitleInput, ideaBodyInput]) { if (!el.placed) el.style.display = 'none'; el.placed = false; }
  if (screen !== 'search') searchInput.style.display = 'none';
  if (screen !== 'chat') chatInput.style.display = 'none';
  UI.end();
  S.blit('#0d0b13');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
PX.Pad.setup({                                     // the arcade reads the controller itself (PX.Pad only moves between the SETTINGS buttons)
  title: 'Pixel Arcade: controller', menu: () => screen === 'settings' || screen === 'coffee' || screen === 'notify' || screen === 'leaders' || screen === 'ideas', ui: UI,
  phone: { stick: 'PICK A GAME', dpad: true, buttons: [['A', 'PLAY'], ['X', 'SEARCH'], ['Y', 'SETTINGS'], ['B', 'BACK']] },
  help: [['STICK|D-PAD', 'PICK A GAME'], ['A', 'PLAY IT'], ['R-STICK', 'SCROLL'], ['X', 'SEARCH'], ['Y', 'SETTINGS'], ['LB|RB', 'SEARCH: CATEGORY / TOP: GAME / IDEAS: TAB'], ['RB', 'PHONE CONTROLLERS'], ['B', 'SEARCH: BACK']],
});
</script>
