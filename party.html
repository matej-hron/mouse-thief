<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Pixel Party: a tournament of quick mini-games for 2 to 4 players on one phone. Pick the games, the rounds and the trophy you play for.">
<meta name="theme-color" content="#0d0b13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Pixel Party</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a0f2e; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #screen { position: fixed; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
  #code { position: fixed; display: none; box-sizing: border-box; text-align: center; text-transform: uppercase;
          font: bold 32px ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.3em; padding: 0 0 0 0.3em;
          color: #111; background: #fbf9f3; border: 3px solid #111; border-radius: 0; outline: none; }
  #pname { position: fixed; display: none; box-sizing: border-box; text-align: center; text-transform: uppercase;
          font: bold 22px ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.15em;
          color: #111; background: #fbf9f3; border: 3px solid #111; border-radius: 0; outline: none; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<input id="code" maxlength="4" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" inputmode="text" aria-label="Room code">
<input id="pname" maxlength="10" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" inputmode="text" aria-label="Player name">
<script src="common.js"></script>
<script src="cs.js"></script>
<script>
'use strict';
/* ==========================================================================
   PIXEL PARTY: a tournament of the arcade's own games, for 2 to 4 players (part of the PIXEL ARCADE).
   Every round is one of the arcade's games, played as a short CHALLENGE: Pixel Party opens the game in a frame over
   itself (PX.Challenge in common.js), the game starts its challenge right away (SLICE: 60 SECONDS, HOOK: as far as you
   can, BIKE RUN: the first trail against the clock...) and sends the score back when it is over. Everybody of a round
   plays the same challenge (the same seed). Points for a round: 1st 3, 2nd 2, 3rd 1. After the last round the most
   points wins the tournament's TROPHY.
   ONLINE: 2-4 phones, each player on their own (a 4-letter code or an invite). The host sets the tournament up;
   everybody plays every round at the same time, and the host's phone collects the scores.
   ONE PHONE: the players take turns, passing the phone.
     Setup: the PLAYLIST (RANDOM, or pick the games), ROUNDS (3, 5 or 7) and the TROPHY (BRONZE: 3+ rounds, SILVER: 5+,
     GOLD: 7). A trophy won goes on the winner's shelf, on the TROPHIES leaderboard (gold 3, silver 2, bronze 1) and
     ★ into the arcade's wallet (on each player's own phone online; for player 1 on one phone).
     1. Setup   2. Rounds in a frame   3. The tournament   4. Screens   5. Online   6. Sound   7. Input   8. Main loop
   ========================================================================== */

/* --- 1. SETUP --------------------------------------------------------------- */
const VERSION = '2.0.0';
const SAVE_KEY = 'pixelParty.save';
const save = { sfx: true, names: ['', 'PLAYER 2', 'PLAYER 3', 'PLAYER 4'], n: 2, rounds: 5, trophy: 'silver', random: true, pick: [],
               shelf: { gold: 0, silver: 0, bronze: 0 }, points: 0, played: 0, days: {} };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY)) || {}); } catch (e) { /* new player */ }
const store = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* private mode */ } };
const profile = PX.Profile.get();
save.names[0] = profile.name;
save.pick = (Array.isArray(save.pick) ? save.pick : []).filter(id => PX.Challenge.GAMES[id]);   // (version 1's mini-games are gone)

const canvas = document.getElementById('screen');
const S = PX.makeScreen(canvas, { H: 240, minW: 400, maxW: 560 });
const ctx = S.ctx, H = S.H;
const UI = PX.makeUI(S, canvas);
const T = (str, x, y, color = '#fff', size = 1, align = 'left', shadow = null) => PX.drawText(ctx, str, x, y, color, size, align, shadow);
const raw = (...a) => PX.Lang.raw(() => T(...a));   // (names the players typed: never translated)
PX.Lang.page('party');                             // Czech when SETTINGS → LANGUAGE says so (cs.js)
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const nameInput = document.getElementById('pname');
nameInput.addEventListener('input', () => { nameInput.value = nameInput.value.toUpperCase().replace(/[^A-Z0-9 ]/g, '').slice(0, 10); });

const COLS = ['#ff5a5a', '#4aa8ff', '#5ad43f', '#ffd23f'];            // player 1..4
const TROPHIES = [
  { id: 'bronze', name: 'BRONZE', min: 3, pts: 1, stars: 3, col: '#d08a4a', dark: '#8a5424' },
  { id: 'silver', name: 'SILVER', min: 5, pts: 2, stars: 6, col: '#d8dce8', dark: '#8a90a4' },
  { id: 'gold', name: 'GOLD', min: 7, pts: 3, stars: 10, col: '#ffd23f', dark: '#c88a10' },
];
const trophyOf = id => TROPHIES.find(t => t.id === id) || TROPHIES[1];
const DAY_MAX = 5;           // at most 5 trophies a day count on the leaderboard (the shelf keeps them all)


/* --- 2. ROUNDS IN A FRAME: the arcade's games, as challenges (PX.Challenge.GAMES in common.js) ------------------ */
const GAMES = PX.Challenge.GAMES;
const GAME_IDS = Object.keys(GAMES);
const ball = (x, y, r, c, d) => { for (let dy = -r; dy <= r; dy++) { const w = Math.round(Math.sqrt(Math.max(0, r * r - dy * dy))); ctx.fillStyle = d && dy > r * 0.35 ? d : c; ctx.fillRect(Math.round(x - w), Math.round(y + dy), w * 2, 1); } };
// the game's frame: the game is a page of its own; while it plays, this page only waits for its score
// (window.ArcadeShell: what a game in a frame calls when it leaves, see common.js: then the round is given up)
const Frame = {
  el: null, at: 0,
  open(id, seed) {
    this.close();
    const f = document.createElement('iframe');
    f.src = GAMES[id].url + '?challenge=' + encodeURIComponent(JSON.stringify({ id, seed }));
    f.title = 'game'; f.allow = 'autoplay; fullscreen; gamepad';
    f.style.cssText = 'position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;border:0;margin:0;z-index:50;background:#000;display:block;';
    f.addEventListener('load', () => { try { f.contentWindow.focus(); } catch (e) { /* fine */ } });
    document.body.appendChild(f); this.el = f; this.at = performance.now(); PX.Pad.off = true;
  },
  close() { const f = this.el; this.el = null; PX.Pad.off = false; if (f) setTimeout(() => f.remove(), 0); },
};
window.ArcadeShell = { back() { if (Frame.el) Party.result(null); } };
addEventListener('message', e => {
  if (e.origin !== location.origin || !e.data || e.data.t !== 'px-challenge' || !Frame.el || e.source !== Frame.el.contentWindow) return;
  Party.result(e.data.quit ? null : { score: Number(e.data.score) || 0, text: String(e.data.text || e.data.score).slice(0, 20) });
});
const worst = id => (GAMES[id].low ? 99999 : -1);
const show = (i, P) => { const v = P.texts[i] !== undefined ? P.texts[i] : P.scores[i] === undefined ? '' : P.scores[i] === worst(P.id()) ? 'GAVE UP' : String(P.scores[i]); return v === 'GAVE UP' || v === 'DNF' ? PX.tr(v) : v; };

/* --- 3. THE TOURNAMENT ----------------------------------------------------------- */
// Party: the tournament being played. players [{ name, col, pts }], list: the mini-game of each round,
// round, turn: whose turn it is, scores: this round's scores
const Party = {
  players: [], list: [], round: 0, turn: 0, scores: [], texts: [], seed: 0, phase: 'intro', count: 0, trophy: 'silver', results: null,
  online: false, me: 0, seeds: [], ready: new Set(), gone: new Set(), introT: 0, waitT: 0,
  // the playlist of a tournament: rounds mini-games, never the same one twice in a row
  makeList(rounds) {
    const pool = save.random || !save.pick.length ? GAME_IDS : save.pick.filter(id => GAMES[id]), list = [];
    let last = '';
    for (let i = 0; i < rounds; i++) { let id; do { id = pool[Math.floor(Math.random() * pool.length)]; } while (pool.length > 1 && id === last); list.push(id); last = id; }
    return list;
  },
  // ONLINE: the host sent the tournament (everybody gets the same list, seeds and players)
  startOnline(m) {
    this.online = true; this.me = m.you | 0; this.gone = new Set();
    this.players = m.players.map((p, i) => ({ name: PX.cleanName(p.name) || 'PLAYER ' + (i + 1), col: COLS[i], pts: 0 }));
    this.list = m.list.filter(id => GAMES[id]); this.seeds = m.seeds; this.trophy = trophyOf(m.trophy).id;
    this.round = 0; this.newRound(); state = 'party'; paused = false; sfx('click');
  },
  start() {
    this.online = false; this.me = 0;
    const n = clamp(save.n | 0, 2, 4), tr = trophyOf(save.trophy), rounds = Math.max(save.rounds, tr.min);
    this.players = [...Array(n)].map((_, i) => ({ name: (i === 0 ? profile.name : save.names[i]) || 'PLAYER ' + (i + 1), col: COLS[i], pts: 0 }));
    this.list = this.makeList(rounds);
    this.round = 0; this.trophy = tr.id; this.newRound();
    state = 'party'; sfx('click');
  },
  newRound() {
    this.turn = this.online ? this.me : 0; this.scores = []; this.texts = []; this.ready = new Set(); this.introT = 0; this.waitT = 0; this.phase = 'intro';
    this.seed = this.online ? this.seeds[this.round] >>> 0 : Math.floor(Math.random() * 1e9);
  },
  // ONLINE: I'm ready (the host starts the round when everybody is)
  imReady() { if (this.ready.has(this.me)) return; this.ready.add(this.me); if (Net.isHost) { Net.broadcast({ t: 'rdy', i: this.me }); this.checkReady(); } else Net.send({ t: 'ready', round: this.round }); sfx('click'); },
  present() { return this.players.map((p, i) => i).filter(i => !this.gone.has(i)); },
  checkReady(force) {
    if (!Net.isHost || this.phase !== 'intro') return;
    if (force || this.present().every(i => this.ready.has(i))) { Net.broadcast({ t: 'go', round: this.round }); this.go(); }
  },
  // ONLINE (the host): a score came in; with everybody's, the results go out
  gotScore(i, round, v, text) {
    if (round !== this.round || !Number.isFinite(v)) return;
    this.scores[i] = v; this.texts[i] = String(text || v).slice(0, 20); this.checkScores(false);
  },
  checkScores(force) {
    if (!Net.isHost || this.phase === 'results' || this.phase === 'final') return;
    const M = GAMES[this.id()], miss = this.present().filter(i => this.scores[i] === undefined);
    if (miss.length && !force) return;
    const scores = this.players.map((p, i) => (this.scores[i] === undefined ? worst(this.id()) : this.scores[i]));
    const texts = this.players.map((p, i) => (this.scores[i] === undefined ? 'GAVE UP' : this.texts[i]));
    Net.broadcast({ t: 'res', round: this.round, scores, texts }); this.applyResults(scores, texts);
  },
  id() { return this.list[this.round]; },
  go() { this.phase = 'count'; this.count = 3; },   // this player's turn starts: 3, 2, 1, then the game
  // the game in the frame is over: its score (null: given up)
  result(r) {
    if (this.phase !== 'play') return;
    Frame.close();
    const sc = r ? r.score : worst(this.id()), tx = r ? r.text : 'GAVE UP';
    this.scores[this.turn] = sc; this.texts[this.turn] = tx; this.phase = 'done'; this.doneT = 0; sfx('end');
    if (this.online) { this.phase = 'wait'; this.waitT = 0; if (Net.isHost) this.checkScores(false); else Net.send({ t: 'score', round: this.round, v: sc, text: tx }); }
  },
  step(dt) {
    if (this.phase === 'count') { const was = Math.ceil(this.count); this.count -= dt; if (Math.ceil(this.count) !== was && this.count > 0) sfx('beep'); if (this.count <= 0) { this.phase = 'play'; sfx('go'); Frame.open(this.id(), this.seed); } }
    else if (this.phase === 'play') { if (performance.now() - Frame.at > (GAMES[this.id()].max + 60) * 1000) this.result(null); }   // (a game that never answers)
    else if (this.phase === 'done') this.doneT += dt;
    else if (this.phase === 'wait') { this.waitT += dt; if (Net.isHost && this.waitT > 60) this.checkScores(true); }   // (a phone that went quiet: last place)
    else if (this.phase === 'intro') this.introT += dt;
  },
  next() {                                       // the next player, or the round's results
    if (this.turn < this.players.length - 1) { this.turn++; this.phase = 'intro'; return; }
    this.applyResults(this.scores, this.texts);
  },
  applyResults(scores, texts) {                  // places: equal scores share a place
    this.scores = scores; this.texts = texts || this.texts;
    const M = GAMES[this.id()], order = this.players.map((p, i) => i).sort((a, b) => (M.low ? this.scores[a] - this.scores[b] : this.scores[b] - this.scores[a]));
    const place = []; order.forEach((i, k) => { place[i] = k > 0 && this.scores[i] === this.scores[order[k - 1]] ? place[order[k - 1]] : k; });
    this.places = place;
    this.players.forEach((p, i) => { p.got = [3, 2, 1, 0][place[i]] || 0; p.pts += p.got; });
    this.phase = 'results'; sfx('win');
  },
  afterResults() {
    if (this.round < this.list.length - 1) { this.round++; this.newRound(); return; }
    this.finish();
  },
  finish() {
    const best = Math.max(...this.players.map(p => p.pts)), winners = this.players.filter(p => p.pts === best);
    const tr = trophyOf(this.trophy), meWon = this.players[this.me].pts === best;
    this.results = { winners, tr, meWon };
    save.played = (save.played | 0) + 1;
    if (meWon) {
      save.shelf[tr.id] = (save.shelf[tr.id] | 0) + 1;
      const day = new Date().toISOString().slice(0, 10);
      save.days = { [day]: ((save.days || {})[day] | 0) + 1 };          // (only today is kept)
      if (save.days[day] <= DAY_MAX) save.points = (save.points | 0) + tr.pts;
      else this.results.capped = true;
      PX.Wallet.add(tr.stars);
    }
    store();
    this.phase = 'final'; sfx(meWon ? 'trophy' : 'end');
  },
};

/* --- 4. SCREENS --------------------------------------------------------------------- */
let state = 'title';          // title | setup | names | party | shelf
let paused = false, editing = -1, msg = null;
function panel(w, h, y, col = '#ff7ab8') {
  const W = S.W, x = Math.round(W / 2 - w / 2); y = y === undefined ? Math.round(H / 2 - h / 2) : y;
  ctx.fillStyle = 'rgba(13,11,19,0.6)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#111'; ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
  ctx.fillStyle = '#1d1830'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = col; ctx.fillRect(x, y, w, 2);
  return { x, y };
}
function confetti(t) {
  const W = S.W;
  for (let i = 0; i < 40; i++) { ctx.fillStyle = COLS[i % 4]; ctx.fillRect(Math.round((i * 53 + Math.sin(t + i) * 20) % W), Math.round((i * 37 + t * (20 + i % 5 * 8)) % H), 2, 3); }
}
function background(t) {
  const W = S.W;
  ctx.fillStyle = '#1a0f2e'; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 12; i++) { ctx.fillStyle = i & 1 ? '#22143a' : '#1e1234'; ctx.fillRect(0, i * 20, W, 20); }
  confetti(t);
}
function trophyIcon(x, y, tr, s = 2) {
  PX.drawIcon(ctx, ['#######', '#######', '.#####.', '..###..', '...#...', '..###..', '.#####.'], { '#': tr.col }, x, y, s);
  ctx.fillStyle = tr.dark; ctx.fillRect(Math.round(x - 3.5 * s), Math.round(y - 3.5 * s + s), s, s * 2);
}
function topBar(back) {
  const W = S.W;
  if (UI.button('sfx', W - 30, 6, 24, 20, save.sfx ? 'SND' : 'OFF', { size: 1, on: save.sfx })) { save.sfx = !save.sfx; store(); }
  T('★ ' + PX.Wallet.get(), W - 38, 12, '#ffd23f', 2, 'right', '#000');
  if (back && (UI.button('back', 6, 6, 56, 20, '< BACK', { size: 1 }) || UI.back)) { sfx('click'); nameInput.blur(); state = 'title'; }
}
function drawTitle(t) {
  const W = S.W;
  PX.drawAvatar(ctx, profile.avatar, 8, 8, 2); raw(profile.name, 40, 16, '#fff', 2, 'left', '#000');
  topBar(false);
  PX.drawLogo(ctx, 'PIXEL', W / 2, 34, 3);
  PX.drawLogo(ctx, 'PARTY', W / 2, 52, 7);
  const bw = 200, bx = Math.round(W / 2 - bw / 2);
  if (UI.button('online', bx, 100, 98, 28, 'ONLINE', { accent: '#5ad43f' })) { sfx('click'); state = 'online'; Net.reset(); }
  if (UI.button('one', bx + 102, 100, 98, 28, 'ONE PHONE', { size: 1, accent: '#ff7ab8' })) { sfx('click'); state = 'setup'; }
  T('ONLINE: 2-4 PHONES.  ONE PHONE: TAKE TURNS.', W / 2, 134, '#c8b8ff', 1, 'center', '#000');
  if (UI.button('shelf', bx, 150, bw, 22, 'MY TROPHIES', { size: 1, accent: '#ffd23f' })) { sfx('click'); state = 'shelf'; }
  if (UI.button('games', bx, 196, bw, 22, '< ALL GAMES', { size: 1 }) || UI.back) location.href = './';
  T('V' + VERSION, W - 4, H - 9, '#c8b8ff', 1, 'right');
}
function drawSetup(t, online) {
  const W = S.W, cx = Math.round(W / 2);
  if (online) {
    if (UI.button('back', 6, 6, 56, 20, '< BACK', { size: 1 }) || UI.back) { Net.leave(); Net.reset(); }
    T('CODE: ' + Net.code, cx, 10, '#ffd23f', 2, 'center', '#000');
    PX.Invite.button(UI, W - 128, 6, 122, 20);
    T('PLAYERS', 16, 38, '#9a92b8', 1);
    T(Net.players.length + ' / 4', 70, 38, '#fff', 1);
    T(Net.players.length < 2 ? 'YOUR FRIENDS: PIXEL PARTY > ONLINE > JOIN, AND THE CODE' : '', 110, 38, '#7a6a9a', 1);
  } else {
    topBar(true);
    T('NEW TOURNAMENT', cx, 10, '#fff', 2, 'center', '#000');
    // players: how many, and their names (tap one to change it)
    T('PLAYERS', 16, 38, '#9a92b8', 1);
    [2, 3, 4].forEach((n, i) => { if (UI.button('n' + n, 70 + i * 32, 32, 28, 18, String(n), { size: 1, on: save.n === n, accent: '#ff7ab8' })) { save.n = n; store(); } });
  }
  const pw = Math.floor((W - 32 - 18) / 4);
  if (online) Net.players.forEach((q, i) => {
    const x = 16 + i * (pw + 6);
    ctx.fillStyle = '#16121f'; ctx.fillRect(x, 56, pw, 20); ctx.fillStyle = COLS[i]; ctx.fillRect(x, 56, pw, 2);
    raw(q.name, x + pw / 2, 63, '#fff', 1, 'center');
  });
  for (let i = 0; i < (online ? 0 : save.n); i++) {
    const x = 16 + i * (pw + 6), nm = i === 0 ? profile.name : save.names[i] || 'PLAYER ' + (i + 1);
    if (editing === i) { S.placeInput(nameInput, x, 56, pw, 20); nameInput.placed = true; continue; }
    if (UI.button('pn' + i, x, 56, pw, 20, '', { size: 1, accent: COLS[i], disabled: i === 0 })) startEdit(i);
    raw(nm, x + pw / 2, 63, i === 0 ? '#9a92b8' : '#fff', 1, 'center');
  }
  if (!online) T('TAP A NAME TO CHANGE IT', cx, 80, '#5b5275', 1, 'center');
  // the playlist
  T('PLAYLIST', 16, 96, '#9a92b8', 1);
  if (UI.button('rand', 70, 90, 70, 18, 'RANDOM', { size: 1, on: save.random, accent: '#7af0ff' })) { save.random = true; store(); }
  if (UI.button('pickm', 144, 90, 70, 18, 'PICK', { size: 1, on: !save.random, accent: '#7af0ff' })) { save.random = false; if (!save.pick.length) save.pick = GAME_IDS.slice(); store(); }
  const gw = Math.floor((W - 32 - 18) / 4);
  GAME_IDS.forEach((id, i) => {
    const x = 16 + (i % 4) * (gw + 6), y = 112 + Math.floor(i / 4) * 22, on = save.random || save.pick.includes(id);
    if (UI.button('g' + id, x, y, gw, 19, GAMES[id].name.replace(/^PIXEL /, ''), { size: 1, on, accent: '#7af0ff', disabled: save.random })) {
      if (on) { if (save.pick.length > 1) save.pick = save.pick.filter(k => k !== id); else msg = { txt: 'PICK AT LEAST ONE GAME', t: 1.5 }; }
      else save.pick.push(id);
      store();
    }
  });
  // rounds and the trophy (a bigger trophy needs more rounds)
  T('ROUNDS', 16, 166, '#9a92b8', 1);
  [3, 5, 7].forEach((n, i) => {
    const tooFew = n < trophyOf(save.trophy).min;
    if (UI.button('r' + n, 70 + i * 32, 160, 28, 18, String(n), { size: 1, on: save.rounds === n, accent: '#5ad43f', disabled: tooFew })) { save.rounds = n; store(); }
  });
  T('TROPHY', W / 2 + 14, 166, '#9a92b8', 1);
  TROPHIES.forEach((tr, i) => {
    const x = W / 2 + 60 + i * 44;
    if (UI.button('t' + tr.id, x, 158, 40, 22, '', { size: 1, on: save.trophy === tr.id, accent: tr.col })) { save.trophy = tr.id; if (save.rounds < tr.min) save.rounds = tr.min; store(); }
    trophyIcon(x + 20, 169, tr, 2);
  });
  const tr = trophyOf(save.trophy);
  T(tr.name + ' TROPHY: ' + tr.min + '+ ROUNDS. THE WINNER GETS IT.', cx, 186, tr.col, 1, 'center', '#000');
  if (online) { if (UI.button('go', cx - 80, 200, 160, 26, 'START!', { accent: '#5ad43f', disabled: Net.players.length < 2 })) Net.start(); }
  else if (UI.button('go', cx - 80, 200, 160, 26, 'START!', { accent: '#5ad43f' })) { nameInput.blur(); editing = -1; Party.start(); }
}
// (the online host: a change of the setup goes to the friends in the room)
setInterval(() => {
  if (!Net.isHost || state !== 'online' || Net.screen !== 'hosting') return;
  const c = { rounds: Math.max(save.rounds, trophyOf(save.trophy).min), trophy: save.trophy, random: save.random, pick: save.pick };
  if (JSON.stringify(c) !== JSON.stringify(Net.cfg)) Net.lobbySync();
}, 500);

/* --- ONLINE: 2-4 phones (the same free PeerJS server as the other games) --------------------------------------------
   The host's phone is the room 'pixel-party-room-' + a 4-letter code; up to 3 friends connect to it (the code, or an
   invite from FRIENDS). The host sets the tournament up and starts it; every round everybody taps READY, the host
   says GO, each phone plays the same mini-game (the same seed) and sends its score; the host sends the results.
   host → guests: lobby { players, you, cfg }, full, old { v }, start { players, you, list, seeds, trophy },
                  go { round }, res { round, scores }, next { round }, gone { i }, lobby2 (back to the lobby), bye

    Party.online = false;
  },
  fail(msg) { this.reset(); state = 'online'; this.screen = 'error'; this.msg = msg; },

  async host() {

    const open = attempt => {
      let code = ''; for (let i = 0; i < 4; i++) code += PX.CODE_CHARS[Math.floor(Math.random() * PX.CODE_CHARS.length)];
      const peer = new Peer(ROOM + code, this.opts()); this.peer = peer;
      peer.on('open', () => { this.code = code; this.screen = 'hosting'; this.msg = ''; this.live = true; this.lobbySync(); });

  fromGuest(c, m) {

  guestLeft(c) {

  },
  // the host: who is in the room and how the tournament is set up, to everybody
  lobbySync() {

  async join(code) {

      case 'start': if (Array.isArray(m.players) && Array.isArray(m.list) && Array.isArray(m.seeds)) Party.startOnline(m); break;
      case 'go': if (m.round === Party.round && Party.phase === 'intro') Party.go(); break;

  send(m) { if (this.conn && this.conn.open) try { this.conn.send(m); } catch (e) { /* closing */ } },

/* --- 5. SOUND --------------------------------------------------------------------- */
function sfx(k, n = 0) {
  if (!save.sfx) return;
  const s = PX.Sound;
  if (k === 'click') s.tone([523, 784], 0.1, { vol: 0.1 });
  else if (k === 'tap') s.tone(880 + Math.random() * 200, 0.04, { vol: 0.07, type: 'square' });
  else if (k === 'cut') s.noise(0.08, { freq: 3200, vol: 0.08, filter: 'highpass' });
  else if (k === 'coin') s.tone([1320, 1760], 0.06, { vol: 0.06 });
  else if (k === 'bad') s.tone([300, 90], 0.3, { vol: 0.12, type: 'sawtooth' });
  else if (k === 'jump') s.tone([400, 800], 0.1, { vol: 0.07, type: 'triangle' });
  else if (k === 'note') s.tone([392, 494, 587, 698][n], 0.2, { vol: 0.09, type: 'triangle' });
  else if (k === 'beep') s.tone(660, 0.08, { vol: 0.09 });
  else if (k === 'go') s.tone(1320, 0.15, { vol: 0.1 });
  else if (k === 'end') s.tone([784, 523], 0.25, { vol: 0.1 });
  else if (k === 'win') [523, 659, 784].forEach((f, i) => s.tone(f, 0.12, { vol: 0.09, delay: i * 0.08 }));
  else if (k === 'join') [659, 880].forEach((f, i) => s.tone(f, 0.1, { vol: 0.08, delay: i * 0.08 }));
  else if (k === 'trophy') [523, 659, 784, 1047, 1319].forEach((f, i) => s.tone(f, 0.2, { vol: 0.1, delay: i * 0.1 }));
}

  if (state !== 'online') codeInput.style.display = 'none';
  if (!nameInput.placed) nameInput.style.display = 'none';
  nameInput.placed = false;
  if (msg) { T(msg.txt, S.W / 2, H - 14, '#fff', 1, 'center', '#000'); if ((msg.t -= dt) <= 0) msg = null; }
  UI.end();
  S.blit('#1a0f2e');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => { /* offline mode unavailable */ }));
}
PX.Pad.setup({
  title: 'Pixel Party: controller', ui: UI, menu: () => true,
  help: [['STICK|D-PAD', 'MENUS: PICK A BUTTON'], ['A', 'MENUS: OK'], ['B', 'MENUS: BACK']],
});
// an invite from a friend (the arcade opens this page with ?join=CODE): join that tournament right away
PX.Invite.auto(code => { state = 'online'; Net.join(code); });
</script>
