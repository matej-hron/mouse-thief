<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Pixel Ski: race down 10 mountains, each with a green, a red and a black run. Hit a tree, a rock or a skier and you're out.">
<meta name="theme-color" content="#0d0b13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Pixel Ski</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0b13; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #screen { position: fixed; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
  #code { position: fixed; display: none; box-sizing: border-box; text-align: center; text-transform: uppercase;
          font: bold 32px ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.3em; padding: 0 0 0 0.3em;
          color: #111; background: #fbf9f3; border: 3px solid #111; border-radius: 0; outline: none; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<input id="code" maxlength="4" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" inputmode="text" aria-label="Room code">
<script src="common.js"></script>
<script>
'use strict';
/* ==========================================================================
   PIXEL SKI: downhill skiing (part of the PIXEL ARCADE).
   The camera sits behind the skier and the slope is drawn in perspective, so it looks 3D.
   10 maps (mountains), each with 3 runs: GREEN (easy), RED and BLACK (hard).
   Survive to the bottom: hit a tree, a rock, a snowman, another skier or the safety net
   and you crash, and the run is over. Off the piste (past the blue line) is deep powder: slow.
   Controls like a phone ski game: a slider on the left steers (left / right), a slider on the
   right sets the speed (up: tuck, faster; down: brake). Keys: arrows / WASD. A controller works too.
     1. Setup   2. Maps and runs   3. Building a run   4. Sprites   5. Skiing
     6. Drawing   7. Screens   8. Input   9. Main loop
   ========================================================================== */

/* --- 1. SETUP --------------------------------------------------------------- */
const VERSION = '1.2.0';
const SAVE_KEY = 'pixelSki.save';
const save = { best: {}, done: {}, sfx: true, seenHelp: false, coins: 0, up: {}, skis: 'green', helmet: 'yellow', owned: { green: 1, yellow: 1 } };
try {
  const s = JSON.parse(localStorage.getItem(SAVE_KEY));
  if (s) { Object.assign(save, s); save.best = Object.assign({}, s.best); save.done = Object.assign({}, s.done); save.up = Object.assign({}, s.up); save.owned = Object.assign({ green: 1, yellow: 1 }, s.owned); save.coins = s.coins | 0; }
} catch (e) { /* new player */ }
const store = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* private mode */ } };
// --- the SKI SHOP: coins (picked up on the slopes, and a bonus at the bottom) buy upgrades and looks ---------
const UPGRADES = [
  { id: 'speed', name: 'FAST SKIS', desc: 'HIGHER TOP SPEED', col: '#ff8a2a', max: 5, cost: [40, 100, 200, 400, 750] },
  { id: 'start', name: 'PUSH START', desc: 'FASTER OUT OF THE START GATE', col: '#5ad43f', max: 5, cost: [30, 80, 160, 300, 550] },
  { id: 'edge', name: 'SHARP EDGES', desc: 'TURN FASTER, GRIP ON ICE', col: '#7ad8ff', max: 5, cost: [40, 100, 200, 400, 750] },
  { id: 'air', name: 'BIG AIR', desc: 'JUMP HIGHER OFF THE RAMPS', col: '#b07aff', max: 5, cost: [30, 80, 160, 300, 550] },
  { id: 'magnet', name: 'COIN MAGNET', desc: 'GRAB COINS FROM FURTHER AWAY', col: '#ffd23f', max: 5, cost: [30, 80, 160, 300, 550] },
  { id: 'helmet', name: 'HARD HELMET', desc: 'SURVIVE A CRASH (PER LEVEL, EACH RUN)', col: '#e8303a', max: 3, cost: [150, 400, 900] },
  { id: 'turbo', name: 'TURBO', desc: 'A ROCKET BOOST BUTTON (PER LEVEL, EACH RUN)', col: '#ff5ad0', max: 3, cost: [120, 350, 800] },
];
const LOOKS = [
  { id: 'green', kind: 'skis', name: 'GREEN', col: '#3fbe4a', cost: 0 }, { id: 'redski', kind: 'skis', name: 'RED', col: '#e8303a', cost: 30 },
  { id: 'blueski', kind: 'skis', name: 'BLUE', col: '#2a7fd4', cost: 30 }, { id: 'pinkski', kind: 'skis', name: 'PINK', col: '#ff6bd0', cost: 60 },
  { id: 'goldski', kind: 'skis', name: 'GOLD', col: '#ffd23f', cost: 250 }, { id: 'rainbow', kind: 'skis', name: 'RAINBOW', col: 'rainbow', cost: 500 },
  { id: 'yellow', kind: 'helmet', name: 'YELLOW', col: '#ffd23f', cost: 0 }, { id: 'white', kind: 'helmet', name: 'WHITE', col: '#f4f4f4', cost: 30 },
  { id: 'black', kind: 'helmet', name: 'BLACK', col: '#2a2a33', cost: 30 }, { id: 'redhelm', kind: 'helmet', name: 'RED', col: '#e8303a', cost: 60 },
  { id: 'goldhelm', kind: 'helmet', name: 'GOLD', col: '#ffc020', cost: 250 }, { id: 'chrome', kind: 'helmet', name: 'CHROME', col: 'chrome', cost: 500 },
];
const lvl = id => save.up[id] | 0;
const lookCol = (id, t) => { const L = LOOKS.find(l => l.id === id) || LOOKS[0]; return L.col === 'rainbow' ? 'hsl(' + Math.round(t * 200) % 360 + ',90%,55%)' : L.col === 'chrome' ? (Math.floor(t * 4) % 2 ? '#e8eef8' : '#a8b4c8') : L.col; };
const profile = PX.Profile.get();
const MY_COLOR = PX.AVATAR_COLORS[profile.avatar.color];

const canvas = document.getElementById('screen');
const S = PX.makeScreen(canvas, { H: 240, minW: 400, maxW: 560 });
const ctx = S.ctx, H = S.H;
const UI = PX.makeUI(S, canvas);
const T = (str, x, y, color = '#fff', size = 1, align = 'left', shadow = null) => PX.drawText(ctx, str, x, y, color, size, align, shadow);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, k) => a + (b - a) * k;
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hex(c) { const n = parseInt(c.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(a, b, k) { const x = hex(a), y = hex(b); return '#' + x.map((v, i) => clamp(Math.round(v + (y[i] - v) * k), 0, 255).toString(16).padStart(2, '0')).join(''); }
function shade(c, k) { return '#' + hex(c).map(v => clamp(Math.round(v * k), 0, 255).toString(16).padStart(2, '0')).join(''); }
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return [c, g]; }
// a time like on the image: 00:18.190
const fmtTime = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(Math.floor(s % 60)).padStart(2, '0') + '.' + String(Math.floor(s * 1000 % 1000)).padStart(3, '0');

// the road renderer: one segment is 5 m of slope
const SEG = 200, METRE = SEG / 5, ROAD_W = 1800, CAM_H = 900, CAM_DEPTH = 0.84, DRAW = 150;
const PLAYER_Z = CAM_H * CAM_DEPTH * 1.6;                // how far ahead of the camera the skier is
const HZ = 92;                                           // the horizon (screen y)
const FX = 104, FY = 195;                                // screen pixels per unit of projected width / height

/* --- 2. MAPS AND RUNS ------------------------------------------------------------ */
// each map: a look (sky, snow, trees, extras) and how hard it is (d: 0 easy .. 1 hardest)
const MAPS = [
  { id: 'meadow', name: 'SNOWY MEADOW', sky: ['#4aa8f4', '#a8dcff'], mtn: ['#8aa8d0', '#dfeaff'], hill: '#4a7a6a', snow: '#f4f8ff', off: '#dfe8f6', tree: '#2f7a3a', d: 0.0, sun: '#fff6c8' },
  { id: 'pines', name: 'PINE FOREST', sky: ['#5aa0e0', '#c8e8ff'], mtn: ['#7a90b8', '#e8f0ff'], hill: '#2f5a44', snow: '#f0f6ff', off: '#d8e4f2', tree: '#1f5a2a', d: 0.1, sun: '#fff6c8', forest: true },
  { id: 'night', name: 'NIGHT RACE', sky: ['#05060f', '#1a2240'], mtn: ['#1a2238', '#5a6688'], hill: '#0f1a1e', snow: '#c8d0dc', off: '#8a94a8', tree: '#16301e', d: 0.2, night: true, lights: true, moon: true },
  { id: 'lake', name: 'FROZEN LAKE', sky: ['#9ac0e0', '#e8f4ff'], mtn: ['#a0b4cc', '#f4f8ff'], hill: '#6a8a9a', snow: '#eef6ff', off: '#d4e6f4', tree: '#3a6a5a', d: 0.3, ice: 2.5, sun: '#ffffff' },
  { id: 'sunset', name: 'SUNSET RIDGE', sky: ['#5a3a8a', '#ffa86a'], mtn: ['#6a4a7a', '#ffd0b0'], hill: '#4a2f4a', snow: '#ffe8e0', off: '#f0c8c0', tree: '#2a3a2a', d: 0.4, sun: '#ffdc6a', low: true },
  { id: 'blizzard', name: 'BLIZZARD PASS', sky: ['#9aa4b0', '#d0d6de'], mtn: ['#b8c0cc', '#e4e8ee'], hill: '#8a96a4', snow: '#f0f2f6', off: '#dce0e8', tree: '#4a6058', d: 0.5, fog: '#d8dde4', snowfall: 3 },
  { id: 'canyon', name: 'ICE CANYON', sky: ['#2a6ab0', '#8ad0f0'], mtn: ['#3a8ac0', '#c8f4ff'], hill: '#2a6a9a', snow: '#e4f6ff', off: '#b4dcf0', tree: '#2a5a6a', d: 0.6, ice: 1.5, narrow: 0.15, sun: '#ffffff' },
  { id: 'volcano', name: 'VOLCANO SLOPE', sky: ['#2a0a14', '#a03a1a'], mtn: ['#3a1a1a', '#ff6a2a'], hill: '#2a1414', snow: '#e8dcd8', off: '#a8908c', tree: '#2a2420', d: 0.7, rocks: 2, lava: true, night: true },
  { id: 'aurora', name: 'AURORA PEAK', sky: ['#03050c', '#0e2030'], mtn: ['#12203a', '#4a6a8a'], hill: '#0a1418', snow: '#c0d8e0', off: '#80a0b0', tree: '#10281c', d: 0.85, night: true, aurora: true, lights: true, snowfall: 1 },
  { id: 'summit', name: 'THE SUMMIT', sky: ['#1a3a8a', '#7ab8ff'], mtn: ['#ffffff', '#ffffff'], hill: '#c8d8f0', snow: '#ffffff', off: '#e4ecf8', tree: '#3a5a4a', d: 1.0, clouds: true, narrow: 0.1, sun: '#ffffff', snowfall: 1 },
];
const LEVELS = [
  { id: 'green', name: 'GREEN', color: '#3fbe4a', d: 0, len: 290, stars: 2 },
  { id: 'red', name: 'RED', color: '#e8303a', d: 0.5, len: 350, stars: 4 },
  { id: 'black', name: 'BLACK', color: '#22222a', d: 1, len: 410, stars: 6 },
];
const runKey = (m, l) => MAPS[m].id + '_' + LEVELS[l].id;
// GREEN of map 1 is open. Finish a run and the next one on that mountain opens; finish BLACK and the next mountain opens.
function isOpen(m, l) {
  if (l > 0) return !!save.done[runKey(m, l - 1)];
  return m === 0 || !!save.done[runKey(m - 1, 2)];
}

/* --- 3. BUILDING A RUN ------------------------------------------------------------ */
// a run is a list of segments; each has a curve, a steepness (how fast you go), how wide the piste is,
// an elevation for drawing (crests and dips), things on the snow (obstacles) and decor beside the piste
let R = null;          // the run being skied
function buildRun(m, l) {
  const map = MAPS[m], lev = LEVELS[l], rnd = mulberry(1000 + m * 37 + l * 7);
  const diff = clamp(map.d * 0.55 + lev.d * 0.6, 0, 1.15);   // 0 (map 1 green) .. 1.15 (the summit, black)
  const segs = [];
  const add = (n, curve, steep, width) => {
    const c0 = segs.length ? segs[segs.length - 1].curve : 0, s0 = segs.length ? segs[segs.length - 1].steep : steep, w0 = segs.length ? segs[segs.length - 1].w : width;
    for (let i = 0; i < n; i++) {
      const k = Math.min(1, i / Math.min(12, n * 0.4)), e = k * k * (3 - 2 * k);   // ease into the new values
      segs.push({ curve: lerp(c0, curve, e), steep: lerp(s0, steep, e), w: lerp(w0, width, e), objs: [], deco: [], y: 0, x: 0 });
    }
  };
  const baseW = 1.25 - diff * 0.35 - (map.narrow || 0);
  add(30, 0, 0.24, baseW + 0.2);                                         // the start: wide and gentle
  const runLen = lev.len + m * 20;                                        // later mountains are bigger
  while (segs.length < runLen) {
    const r = rnd(), n = Math.round(22 + rnd() * 34);
    const curve = (rnd() < 0.5 ? -1 : 1) * (1.5 + rnd() * (2 + diff * 4.5));
    const steep = 0.18 + rnd() * (0.1 + diff * 0.14);
    const w = baseW + (rnd() - 0.5) * 0.3;
    if (r < 0.25) add(n, 0, steep, w);
    else if (r < 0.6) add(n, curve, steep, w);
    else if (r < 0.8) { add(Math.round(n * 0.6), curve, steep, w); add(Math.round(n * 0.6), -curve, steep, w); }   // an S-bend
    else if (r < 0.9) add(Math.round(n * 0.7), curve * 0.3, 0.3 + diff * 0.12, w * 0.9);                       // a steep wall
    else add(n, curve * 0.5, 0.13, w + 0.15);                                                                      // a flat bit
  }
  add(40, 0, 0.15, baseW + 0.3);                                          // the finish area
  // elevation for drawing: steeper than usual = the slope drops away (a crest), flatter = it rises up at you
  let y = 0, dy = 0;
  // elevation: it really goes downhill (steeper = drops faster), so the slope falls away in front of you
  for (const s of segs) { s.y = y; dy = lerp(dy, -s.steep * SEG * 1.5, 0.12); y += dy; }
  // obstacles: more and closer together on harder runs, never in the first and last stretch
  const start = 40, end = segs.length - 45;
  // bigger (later) mountains: more ramps, and JUMP LINES: a row of ramps across the whole slope, then a crevasse to fly over
  const KINDS = [['rock', 0.6], ['tree', 0.4], ['snowman', 0.35], ['kicker', 0.25 + diff * 0.1 + m * 0.05], ['ice', 0.15 * (map.ice || 1) + diff * 0.1],
                 ['flags', 0.2], ['log', diff > 0.5 ? 0.25 : 0], ['jumpline', m >= 2 ? 0.04 + m * 0.025 + l * 0.04 : 0]];
  const sumK = KINDS.reduce((a, k) => a + k[1], 0);
  let i = start;
  while (i < end) {
    i += Math.round((lerp(16, 6, Math.min(1, diff)) + rnd() * lerp(14, 6, Math.min(1, diff))) * (1 - m * 0.035));
    if (i >= end) break;
    let r = rnd() * sumK, kind = 'rock';
    for (const [k, w] of KINDS) { if ((r -= w) < 0) { kind = k; break; } }
    if (map.rocks && kind === 'tree' && rnd() < 0.6) kind = 'rock';
    const s = segs[i], wid = s.w;
    if (kind === 'flags') {                             // a slalom gate: two poles, ski between them (they don't hurt)
      const gx = (rnd() - 0.5) * wid * 0.9, half = 0.32 - diff * 0.06;
      s.objs.push({ kind: 'pole', x: gx - half, col: '#e8303a' }, { kind: 'pole', x: gx + half, col: '#2a7fd4' });
      continue;
    }
    if (kind === 'jumpline') {
      if (i + 8 >= end || Math.abs(s.curve) > 3 || Math.abs(segs[i + 4].curve) > 3) continue;   // only on gentle stretches
      for (let k = i - 9; k < i + 6; k++) segs[k].objs = [];                          // nothing in the way of the jump
      for (let x = -(wid + 0.9); x <= wid + 0.9; x += 0.38) s.objs.push({ kind: 'kicker', x });
      segs[i + 2].crev = segs[i + 3].crev = true;
      segs[Math.max(0, i - 7)].deco.push({ kind: 'warn', side: -1, off: 0.25 }, { kind: 'warn', side: 1, off: 0.25 });
      i += 5; continue;
    }
    if (kind === 'log') { s.objs.push({ kind: 'log', x: (rnd() < 0.5 ? -1 : 1) * wid * 0.45 }); continue; }
    s.objs.push({ kind, x: (rnd() * 2 - 1) * wid * 0.85 });
    // harder runs: a second obstacle beside it, so you have to pick the gap
    if (diff > 0.35 && rnd() < diff * 0.55 && kind !== 'kicker' && kind !== 'ice') {
      const o = s.objs[s.objs.length - 1], gap = lerp(0.75, 0.42, Math.min(1, diff));
      const x2 = o.x + (o.x > 0 ? -gap : gap);
      if (Math.abs(x2) < wid) s.objs.push({ kind: rnd() < 0.5 ? 'rock' : 'tree', x: x2 });
    }
  }
  // coins: lines of 5 on clear stretches of the piste (more on harder runs)
  for (let i = 45; i < end - 8; i += Math.round(lerp(26, 16, Math.min(1, diff)) + rnd() * 10)) {
    let clear = true; for (let k = -2; k < 8; k++) if (segs[i + k].objs.length) clear = false;
    if (!clear) continue;
    const x0 = (rnd() * 2 - 1) * segs[i].w * 0.6, dx = (rnd() - 0.5) * 0.12;
    for (let k = 0; k < 5; k++) segs[i + k].coins = [{ x: x0 + dx * k, got: false }];
  }
  // decor: trees and nets beside the piste, flags on the edges, floodlights at night, the start and finish gates
  for (let k = 0; k < segs.length; k++) {
    const s = segs[k];
    if (k % 2 === 0) s.deco.push({ kind: 'net', side: -1 }, { kind: 'net', side: 1 });
    if (k % 3 === 0 || (map.forest && k % 2 === 1)) for (const side of [-1, 1]) if (rnd() < 0.8) s.deco.push({ kind: rnd() < 0.15 && map.rocks ? 'bigrock' : 'pine', side, off: 1.15 + rnd() * 3.5 });
    if (k % 12 === 6) s.deco.push({ kind: k % 24 === 6 ? 'redflag' : 'blueflag', side: k % 24 === 6 ? -1 : 1, off: 0.06 });
    if (map.lights && k % 20 === 10) s.deco.push({ kind: 'tower', side: k % 40 === 10 ? -1 : 1, off: 1.4 });
    if (k % 50 === 25 && !map.night) s.deco.push({ kind: 'cannon', side: k % 100 === 25 ? 1 : -1, off: 1.25 });
    if (k % 60 === 40) s.deco.push({ kind: 'sign', side: -1, off: 1.2 });
  }
  segs[8].gate = 'START'; segs[segs.length - 30].gate = 'FINISH';
  // other skiers on the piste (from the red runs on): they ski down slower than you, swinging left and right
  const skiers = [];
  const nSk = Math.round(l === 0 ? map.d * 3 : 2 + diff * 6);
  for (let k = 0; k < nSk; k++) skiers.push({ z: (60 + rnd() * (segs.length - 120)) * SEG, x: 0, v: 8 + rnd() * 6, ph: rnd() * 6, amp: 0.3 + rnd() * 0.4, col: ['#ffd23f', '#2a7fd4', '#9b4ad4', '#ff8a2a', '#2ad4c4'][k % 5] });
  return { m, l, map, lev, segs, len: segs.length * SEG, finishZ: (segs.length - 30) * SEG, skiers, diff, mp: false };
}

/* --- 4. SPRITES: pixel art, blown up with the distance ------------------------------- */
function sprite(rows, pal) {
  const w = Math.max(...rows.map(r => r.length)), h = rows.length, [c, g] = makeCanvas(w, h);
  rows.forEach((row, y) => [...row].forEach((ch, x) => { if (ch !== '.' && pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); } }));
  return c;
}
let SPR = {};
function buildSprites(map) {
  const tr = map.tree, dk = shade(map.tree, 0.7), sn = map.night ? '#c8d4e4' : '#ffffff', tk = '#5a3a1a';
  SPR.pine = sprite([
    '.......s.......', '......sgs......', '......ggg......', '.....sgggs.....', '....ggsggdg....', '.....ggggd.....', '....sggggds....',
    '...ggsgggggd...', '..gggggsgggdd..', '....sggggddd...', '...ggggsggggd..', '..ssggggggsgdd.', '.ggggggsggggddd', 'gggsggggggggddd',
    '...gggggggdd...', '..sgggsggggdd..', '.ggggggggsgddd.', 'ggggsggggggdddd', '......ttt......', '......ttt......', '......ttt......'],
    { g: tr, d: dk, s: sn, t: tk });
  SPR.rock = sprite(['....sss.....', '..ssrrrs....', '.srrrrrrrs..', 'srrrrrrddrs.', 'rrrrrrddddrr', 'rrrrrdddddrr', '.rrddddddddr'],
    { s: sn, r: map.rocks ? '#5a4a48' : '#8a8a96', d: map.rocks ? '#3a2a28' : '#5a5a66' });
  SPR.bigrock = sprite(['.....ssss.......', '...ssrrrrss.....', '..srrrrrrrrs..s.', '.rrrrrrrddrrsrrs', 'rrrrrrrdddddrrrr', 'rrrrrdddddddddrr', 'rrrddddddddddddr'],
    { s: sn, r: '#5a4a48', d: '#2a2020' });
  SPR.snowman = sprite(['...kkk...', '...kkk...', '..kkkkk..', '..wwwww..', '.wkwwkww.', '.wwwoooo.', '..wwwww..', '.wwwkwww.', 'wwwwwwwww',
    'wwwwkwwww', '.wwwwwww.', '.wwwwwwww', 'wwwwwwwww', 'wwwwwwwwd', '.wwwwwwd.'], { k: '#222', w: '#ffffff', o: '#ff8a2a', d: '#c8d4e8' });
  SPR.kicker = sprite(['..............bb', '...........bbwww', '........bbwwwwww', '.....bbwwwwwwwww', '..bbwwwwwwwwwwww', 'bwwwwwwwwwwwwwww', 'dddddddddddddddd'],
    { b: '#2a7fd4', w: '#ffffff', d: '#b8c8e0' });
  SPR.log = sprite(['.bbbbbbbbbbbbbbbbbbbbbb.', 'bnnnnbnnnnnnbnnnnnnnbbcb', 'bnnnnnnbnnnnnnnnbnnnbccb', 'bbnnnnnnnnnbnnnnnnnnbbcb', '.bbbbbbbbbbbbbbbbbbbbbb.'],
    { b: '#4a2a14', n: '#7a4a24', c: '#c8a070' });
  SPR.pole = c => sprite(['cc', 'cc', 'cc', 'cc', 'cc', 'cc', 'cc', 'cc', 'ww', 'ww', 'ww', 'ww', 'ww', 'ww', 'ww', 'ww', 'ww'], { c, w: '#dddddd' });
  SPR.redflag = sprite(['rrrrr', 'rwrwr', 'rrrrr', 'rrrrp', 'p....', 'p....', 'p....', 'p....', 'p....', 'p....', 'p....', 'p....'], { r: '#e8303a', w: '#ffffff', p: '#cccccc' });

  const back = (yy, label = 'BACK') => { if (UI.button('nback', bx, yy, bw, 20, label, { size: 1 }) || UI.back) { if (Net.live || Net.peer) Net.leave(); Net.reset(); toTitle(); } };
  if (Net.screen !== 'join') codeInput.style.display = 'none';
  switch (Net.screen) {
    case 'pick':
      T('RACE A FRIEND ONLINE', cx, y + 12, '#4aa8ff', 2, 'center', '#000');
      T('YOU BOTH SKI THE SAME RUN. FIRST TO THE BOTTOM WINS!', cx, y + 32, '#9a92b8', 1, 'center');
      T('CRASH AND YOU\'RE OUT (BOTH CRASH: THE FURTHEST WINS).', cx, y + 42, '#9a92b8', 1, 'center');
      if (UI.button('create', bx, y + 60, bw, 26, 'CREATE GAME', { accent: '#4aa8ff' })) Net.host();
      if (UI.button('join', bx, y + 94, bw, 26, 'JOIN WITH A CODE', { accent: '#5ad43f' })) { Net.screen = 'join'; codeInput.value = ''; }
      back(y + 156);
      break;
    case 'hosting':
      T('YOUR GAME CODE', cx, y + 12, '#efe9ff', 1, 'center');
      T(Net.code, cx, y + 30, '#ffd23f', 7, 'center', '#000');
      T('YOUR FRIEND: PIXEL SKI > RACE A FRIEND > JOIN', cx, y + 80, '#efe9ff', 1, 'center');
      T('WAITING' + dots, cx, y + 100, '#fff', 1, 'center');
      back(y + 156, 'CANCEL');
      break;
    case 'join':
      T("TYPE YOUR FRIEND'S CODE", cx, y + 12, '#fff', 2, 'center');
      S.placeInput(codeInput, cx - 70, y + 38, 140, 36);
      if (UI.button('dojoin', bx, y + 90, bw, 24, 'JOIN', { disabled: codeInput.value.length !== 4, accent: '#5ad43f' })) Net.joinTyped();
      back(y + 156);
      break;
    case 'connecting':
      T(Net.msg + dots, cx, y + 80, '#fff', 1, 'center');
      back(y + 156, 'CANCEL');
      break;
    case 'lobby': {
      T('CONNECTED!', cx, y + 8, '#5ad43f', 2, 'center');
      PX.drawAvatar(ctx, profile.avatar, cx - 96, y + 24, 2); T(profile.name, cx - 82, y + 56, '#fff', 1, 'center');
      T('VS', cx, y + 34, '#ff8a2a', 3, 'center');
      const f = Net.friend;
      if (f) { PX.drawAvatar(ctx, f.av, cx + 68, y + 24, 2); T(f.name, cx + 82, y + 56, '#fff', 1, 'center'); }
      if (Net.isHost) {                                 // the host picks the mountain and the run (all of them are open online)
        T('PICK THE MOUNTAIN AND THE RUN:', cx, y + 70, '#efe9ff', 1, 'center');
        if (UI.button('mprev', cx - 130, y + 82, 24, 20, '<', { size: 2 })) Net.pm = (Net.pm + MAPS.length - 1) % MAPS.length;
        if (UI.button('mnext', cx + 106, y + 82, 24, 20, '>', { size: 2 })) Net.pm = (Net.pm + 1) % MAPS.length;
        T((Net.pm + 1) + '. ' + MAPS[Net.pm].name, cx, y + 89, '#ffd23f', 1, 'center', '#000');
        LEVELS.forEach((lev, l) => {
          const lx = Math.round(cx - 105 + l * 72);
          if (UI.button('mp' + l, lx, y + 110, 66, 26, '', { size: 1, accent: lev.color === '#22222a' ? '#9a92b8' : lev.color, disabled: !f })) Net.start(Net.pm, l);
          levelIcon(l, lx + 14, y + 123, 2); T(lev.name, lx + 26, y + 120, f ? '#fff' : '#5b5275', 1);
        });
      } else T('WAITING FOR ' + (f ? f.name : 'THE HOST') + ' TO PICK A RUN' + dots, cx, y + 104, '#efe9ff', 1, 'center');
      back(y + 156, 'LEAVE');
      break;
    }
    case 'error':
      T(Net.msg, cx, y + 70, '#ff6b6b', 1, 'center');
      back(y + 156, 'OK');
      break;
  }
}

/* --- sound --- */
function sfx(k) {
  if (!save.sfx) return;
  const s = PX.Sound;
  if (k === 'click') s.tone([523, 784], 0.12, { vol: 0.1 });
  else if (k === 'beep') s.tone(440, 0.15, { vol: 0.1 });
  else if (k === 'go') s.tone(880, 0.4, { vol: 0.12 });
  else if (k === 'jump') { s.noise(0.2, { freq: 1600, vol: 0.12, filter: 'bandpass' }); s.tone([300, 700], 0.2, { vol: 0.05, type: 'triangle' }); }
  else if (k === 'land') s.noise(0.15, { freq: 500, vol: 0.2 });
  else if (k === 'ice') s.tone([1400, 1800], 0.15, { vol: 0.04, type: 'triangle' });
  else if (k === 'crash') { s.noise(0.5, { freq: 400, vol: 0.35 }); s.tone([320, 70], 0.4, { vol: 0.08, type: 'sawtooth' }); }
  else if (k === 'coin') s.tone([988, 1319], 0.08, { vol: 0.05 });
  else if (k === 'buy') s.tone([523, 659, 784, 1047], 0.35, { vol: 0.1 });
  else if (k === 'saved') s.tone([1200, 600, 1200], 0.4, { vol: 0.09, type: 'triangle' });
  else if (k === 'turbo') { s.tone([200, 800], 0.5, { vol: 0.07, type: 'sawtooth' }); s.noise(0.6, { freq: 1500, vol: 0.08, filter: 'bandpass' }); }
  else if (k === 'finish') s.tone([523, 659, 784, 1047, 1319], 0.8, { vol: 0.1 });
}

/* --- 8. INPUT: the two sliders on a touch screen, keys, a controller ---------------------- */
const inBox = (b, x, y, pad = 16) => x >= b.x - pad && x < b.x + b.w + pad && y >= b.y - pad && y < b.y + b.h + pad;
// a finger on a slider moves its knob to where it is; a finger anywhere else on that side works from where it first touched
function slide(id, x, y) {
  const sl = sliders();
  if (touch.steer === id) touch.steerV = clamp(touch.steerAbs ? (x - (sl.steer.x + sl.steer.w / 2)) / (sl.steer.w / 2 - 14) : (x - touch.x0) / 40, -1, 1);
  if (touch.speed === id) touch.speedV = clamp(touch.speedAbs ? -(y - (sl.speed.y + sl.speed.h / 2)) / (sl.speed.h / 2 - 16) : -(y - touch.y0) / 40, -1, 1);
}
UI.onDown = (e, x, y) => {
  PX.Sound.unlock();
  if (e.pointerType === 'touch') touchUI = true;
  if (state !== 'play' || !P || P.done) return;
  if (x < 36 && y < 36) { setPause(!paused); return; }          // the pause button
  if (paused) return;
  const sl = sliders();
  if (lvl('turbo') && inBox(sl.turbo, x, y, 4)) { useTurbo(); return; }
  // the left half steers (the slider is just where it shows), the right half sets the speed
  if (inBox(sl.speed, x, y, 24) || x > S.W * 0.62) { touch.speed = e.pointerId; touch.speedAbs = inBox(sl.speed, x, y, 10); touch.y0 = y; touch.speedV = 0; slide(e.pointerId, x, y); }
  else { touch.steer = e.pointerId; touch.steerAbs = inBox(sl.steer, x, y, 10); touch.x0 = x; touch.steerV = 0; slide(e.pointerId, x, y); }
};
UI.onMove = (e, x, y) => { if (state === 'play') slide(e.pointerId, x, y); };
UI.onUp = e => { if (touch.steer === e.pointerId) { touch.steer = null; touch.steerV = 0; } if (touch.speed === e.pointerId) { touch.speed = null; touch.speedV = 0; } };
const KEYMAP = { ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r', ArrowUp: 'u', KeyW: 'u', ArrowDown: 'd', KeyS: 'd' };
window.addEventListener('keydown', e => {
  PX.Sound.unlock();
  if (e.target === codeInput) { if (e.code === 'Enter') Net.joinTyped(); else if (e.code === 'Escape') { codeInput.blur(); UI.back = true; } return; }
  if (R && R.mp && (e.code === 'Enter' || e.code === 'Space') && state !== 'play') return;
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
  if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'play' && P && !P.done) { setPause(!paused); return; }
  if (e.code === 'Escape') { UI.back = true; return; }
  if (KEYMAP[e.code]) { inp.keys[KEYMAP[e.code]] = true; touchUI = false; }
  if ((e.code === 'Space' || e.code === 'KeyE' || e.code === 'ShiftLeft') && state === 'play' && !e.repeat) { useTurbo(); touchUI = false; }
  if ((e.code === 'Enter' || e.code === 'Space') && (state === 'crashed' || state === 'finished') && (state === 'finished' || P.crashT > 0.9)) {
    const nx = state === 'finished' ? nextRun() : null; if (nx) startRun(nx[0], nx[1]); else startRun(R.m, R.l);
  }
});
window.addEventListener('keyup', e => { if (KEYMAP[e.code]) inp.keys[KEYMAP[e.code]] = false; });
window.addEventListener('blur', () => { for (const k in inp.keys) inp.keys[k] = false; setPause(true); });
document.addEventListener('visibilitychange', () => { if (document.hidden) setPause(true); });

/* --- 9. MAIN LOOP ----------------------------------------------------------------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000), t = now / 1000; last = now;
  UI.begin();
  if (state === 'title' || state === 'maps' || state === 'shop' || state === 'online') {
    demoWorld(t, dt);
    if (state === 'title') drawTitle(t); else if (state === 'shop') drawShop(t); else if (state === 'online') drawOnline(t); else drawMaps(t);
  } else {
    const sub = 4; for (let k = 0; k < sub; k++) step(dt / sub);
    if (R.mp) friendStep(dt);
    drawWorld(t);
    hud(t);
    if (state === 'crashed' || state === 'finished') drawEnd(t);
    else if (paused) drawPause();
  }
  UI.end();
  S.blit('#0d0b13');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => { /* offline mode unavailable */ }));
}
PX.setIcon && PX.setIcon();
PX.Pad.setup({
  title: 'Pixel Ski: controller', ui: UI, menu: () => state !== 'play' || paused || (P && P.done),
  phone: { stick: 'STEER', dpad: true, buttons: [['RT', 'FASTER'], ['LT', 'BRAKE'], ['A', 'FASTER'], ['B', 'BRAKE'], ['X', 'TURBO']] },
  keys: () => ({ START: 'KeyP' }),
  onPlay(h, n, dt, edge) {
    if (edge('RB') || edge('X')) useTurbo();
    inp.padSteer = Math.abs(h.ax) > 0.15 ? clamp(h.ax, -1, 1) : 0;
    inp.padSpeed = h.RT || h.A || h.up ? 1 : h.LT || h.B || h.down ? -1 : 0;
  },
  help: [['LEFT|RIGHT', 'STEER (LEFT STICK)'], ['RT|A|UP', 'TUCK: GO FASTER'], ['LT|B|DOWN', 'BRAKE'], ['X|RB', 'TURBO (FROM THE SHOP)'], ['START', 'PAUSE'], ['A', 'MENUS: OK'], ['B', 'MENUS: BACK']],
});
</script>
