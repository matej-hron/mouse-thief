<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Pixel Farmings: till the field, plant seeds, water them and harvest; raise chickens, cows, sheep and pigs, sell at the market, fill orders and grow your farm.">
<meta name="theme-color" content="#0d0b13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Pixel Farmings</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a3a12; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #screen { position: fixed; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<script src="common.js"></script>
<script>
'use strict';
/* ==========================================================================
   PIXEL FARMINGS: you farm (part of the PIXEL ARCADE).
   Walk around your farm. Till the grass in the field, plant seeds, water them,
   wait, harvest. Sell at the MARKET, buy more seeds, animals and upgrades.
   Chickens, cows, sheep and pigs live in the pen: feed them (hay or wheat) and
   collect eggs, milk, wool and truffles. ORDERS at the market pay cash and ★1.
   Every level unlocks new crops and animals. A day lasts 2.5 minutes; some days it rains
   (the rain waters everything). The farm is saved all the time.
     1. Setup   2. The farm   3. Saving   4. Farming   5. Update   6. Drawing   7. HUD and menus   8. Sound   9. Input   10. Main loop
   ========================================================================== */

/* --- 1. SETUP --------------------------------------------------------------- */
const VERSION = '1.1.0';
const SAVE_KEY = 'pixelFarmings.save';
const profile = PX.Profile.get();
const MY_COLOR = PX.AVATAR_COLORS[profile.avatar.color];
const canvas = document.getElementById('screen');
const S = PX.makeScreen(canvas, { H: 240, minW: 400, maxW: 560 });
const ctx = S.ctx, H = S.H;
const UI = PX.makeUI(S, canvas);
const T = (str, x, y, color = '#fff', size = 1, align = 'left', shadow = null) => PX.drawText(ctx, str, x, y, color, size, align, shadow);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const hash = (a, b = 0, c = 0) => { let h = (a * 374761393 + b * 668265263 + c * 2147483647) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
const money = n => '$' + Math.floor(n).toLocaleString('en-US');
const rnd = (a, b) => a + Math.random() * (b - a);

const TS = 16;                       // a tile, in pixels
const MW = 42, MH = 28;              // the farm, in tiles
const FIELD_C = 4, FIELD_R = 11, FIELD_MW = 16, FIELD_MH = 10;   // the biggest field there can be
const LAND = [[6, 4], [8, 5], [10, 6], [12, 7], [14, 8], [16, 10]]; // the field you own, at each MORE LAND level
const WET = 45;                      // seconds the soil stays wet after watering
const DAY_LEN = 150;                 // seconds in a day
const PEN = { x0: 24.6 * TS, x1: 36.4 * TS, y0: 8 * TS, y1: 14.7 * TS };   // where the animals walk

const CROPS = [
  { id: 'carrot', name: 'CARROT', seed: 5, sell: 14, time: 35, lvl: 1, xp: 2, col: '#ff8a1e', leaf: '#3fb84a' },
  { id: 'wheat', name: 'WHEAT', seed: 4, sell: 10, time: 28, lvl: 1, xp: 2, col: '#f0c850', leaf: '#8ab83a' },
  { id: 'tomato', name: 'TOMATO', seed: 14, sell: 22, time: 60, lvl: 2, xp: 4, regrow: 0.55, col: '#e8303a', leaf: '#2e9a3a' },
  { id: 'corn', name: 'CORN', seed: 20, sell: 52, time: 80, lvl: 3, xp: 6, col: '#ffd83a', leaf: '#4ab84a' },
  { id: 'straw', name: 'STRAWBERRY', seed: 30, sell: 30, time: 70, lvl: 4, xp: 5, regrow: 0.6, col: '#ff3a5a', leaf: '#38a848' },
  { id: 'pumpkin', name: 'PUMPKIN', seed: 45, sell: 130, time: 140, lvl: 5, xp: 12, col: '#ff8a1e', leaf: '#3a9a3a' },
  { id: 'sunflower', name: 'SUNFLOWER', seed: 35, sell: 95, time: 110, lvl: 6, xp: 9, col: '#ffd23f', leaf: '#3a9a3a' },
  { id: 'melon', name: 'MELON', seed: 70, sell: 220, time: 190, lvl: 8, xp: 18, col: '#3ac84a', leaf: '#2e8a3a' },
];
const ANIMALS = [
  { id: 'chicken', name: 'CHICKEN', price: 80, lvl: 2, prod: 'egg', time: 40, xp: 2 },
  { id: 'cow', name: 'COW', price: 250, lvl: 3, prod: 'milk', time: 60, xp: 4 },
  { id: 'sheep', name: 'SHEEP', price: 400, lvl: 5, prod: 'wool', time: 80, xp: 6 },
  { id: 'pig', name: 'PIG', price: 700, lvl: 7, prod: 'truffle', time: 110, xp: 10 },
];
const PRODUCTS = [
  { id: 'egg', name: 'EGG', sell: 18 }, { id: 'milk', name: 'MILK', sell: 45 },
  { id: 'wool', name: 'WOOL', sell: 75 }, { id: 'truffle', name: 'TRUFFLE', sell: 160 },
];
const VARS = [['', '', 1], ['_g', 'GOLDEN ', 5], ['_r', 'RADIO ', 3]];    // a crop can be normal, GOLDEN (x5) or RADIOACTIVE (x3)
const GOODS = [...CROPS.flatMap(c => VARS.map(([sf, pre, m], v) => ({ id: c.id + sf, base: c.id, v, name: pre + c.name, sell: c.sell * m }))),
  ...PRODUCTS.map(p => ({ ...p, base: p.id, v: 0 }))];
const priceOf = g => g.sell * (save.hot === g.base ? 2 : 1);      // the HOT crop of the day sells for double
const good = id => GOODS.find(g => g.id === id);
const HAY_PRICE = 2, SPRINKLER = { price: 150, lvl: 4 };
const UPS = [
  { id: 'can', name: 'WATERING CAN', costs: [60, 180, 450, 1100, 2500], desc: l => ['HOLDS 15', 'HOLDS 25, WATERS 3', 'HOLDS 40, WATERS 3', 'HOLDS 60, WATERS 9', 'HOLDS 99, WATERS 9'][l] },
  { id: 'land', name: 'MORE LAND', costs: [100, 300, 800, 2000, 5000], desc: l => 'FIELD ' + LAND[l + 1][0] + ' X ' + LAND[l + 1][1] },
  { id: 'barn', name: 'BIGGER PEN', costs: [300, 900, 2500], desc: l => 'ROOM FOR ' + (l + 2) * 4 + ' ANIMALS' },
  { id: 'boots', name: 'FAST BOOTS', costs: [120, 400, 1200], desc: l => 'WALK ' + (l + 1) * 25 + '% FASTER' },
  { id: 'feeder', name: 'AUTO FEEDER', costs: [1500], desc: () => 'FEEDS ANIMALS FROM HAY' },
];
const CAN_CAP = [10, 15, 25, 40, 60, 99];
const canArea = () => (save.up.can >= 4 ? 9 : save.up.can >= 2 ? 3 : 1);
const xpNeed = l => Math.round(25 * Math.pow(l, 1.5));
const MAX_LVL = 30;
const TUT = ['WALK TO THE FIELD AND TILL THE GRASS', 'PLANT A SEED IN THE SOIL', 'WATER THE SEED', 'WAIT FOR IT TO GROW, THEN HARVEST IT', 'SELL IT AT THE MARKET (THE STALL WITH THE AWNING)'];

/* --- 2. THE FARM ------------------------------------------------------------ */
const G_GRASS = 0, G_PATH = 1, G_WATER = 2, G_TREE = 3, G_FENCE = 4, G_BLOCK = 5, G_FLOWER = 6;
const BUILD = [
  { id: 'house', name: 'HOME', c: 3, r: 3, w: 5, h: 4 },
  { id: 'market', name: 'MARKET', c: 10, r: 4, w: 4, h: 3 },
  { id: 'well', name: 'WELL', c: 16, r: 6, w: 1, h: 1 },
  { id: 'barn', name: 'BARN', c: 31, r: 3, w: 5, h: 4 },
  { id: 'mill', name: 'WINDMILL', c: 35, r: 18, w: 2, h: 3 },
];
const map = new Uint8Array(MW * MH);
const gi = (c, r) => r * MW + c;
const ground = (c, r) => (c < 0 || r < 0 || c >= MW || r >= MH ? G_TREE : map[gi(c, r)]);
const solidT = t => t === G_WATER || t === G_TREE || t === G_FENCE || t === G_BLOCK;
const solid = (c, r) => solidT(ground(c, r));
const buildAt = (c, r) => BUILD.find(b => c >= b.c && c < b.c + b.w && r >= b.r && r < b.r + b.h) || null;
function buildMap() {
  map.fill(G_GRASS);
  const set = (c, r, t) => { if (c >= 0 && r >= 0 && c < MW && r < MH) map[gi(c, r)] = t; };
  for (let r = 0; r < MH; r++) for (let c = 0; c < MW; c++) {
    if (c < 2 || c >= MW - 2 || r < 2 || r >= MH - 2) set(c, r, G_TREE);
    else if (hash(c, r, 7) < 0.05) set(c, r, G_FLOWER);
  }
  for (let c = 3; c <= 23; c++) set(c, 8, G_PATH);          // the main path, house to pen gate
  for (let c = 3; c <= 22; c++) set(c, 10, G_PATH);         // along the top of the field
  for (let r = 7; r <= 10; r++) { set(5, r, G_PATH); set(11, r, G_PATH); }
  for (let r = 8; r <= 21; r++) set(22, r, G_PATH);
  for (let c = 3; c <= 22; c++) set(c, 21, G_PATH);
  for (let r = FIELD_R; r < FIELD_R + FIELD_MH; r++) for (let c = FIELD_C; c < FIELD_C + FIELD_MW; c++) set(c, r, G_GRASS);
  for (let c = 23; c <= 37; c++) { set(c, 2, G_FENCE); set(c, 15, G_FENCE); }    // the pen
  for (let r = 2; r <= 15; r++) { set(23, r, G_FENCE); set(37, r, G_FENCE); }
  for (let r = 3; r <= 14; r++) for (let c = 24; c <= 36; c++) set(c, r, G_GRASS);
  set(23, 8, G_PATH); set(23, 9, G_PATH);                     // the gate
  for (let r = 17; r <= 25; r++) for (let c = 23; c <= 33; c++) {   // the pond
    const dx = (c + 0.5 - 28) / 4, dy = (r + 0.5 - 21.5) / 2.7;
    if (dx * dx + dy * dy < 1) set(c, r, G_WATER);
  }
  for (const [c, r] of [[9, 2], [14, 2], [18, 3], [20, 5], [21, 3], [2, 12], [3, 16], [2, 19], [38, 3], [39, 6], [38, 9], [39, 12], [38, 15],
    [20, 12], [21, 15], [20, 18], [34, 24], [37, 23], [38, 20], [21, 24], [16, 24], [11, 23], [6, 24], [3, 23], [25, 16], [33, 16]]) set(c, r, G_TREE);
  for (const b of BUILD) for (let r = b.r; r < b.r + b.h; r++) for (let c = b.c; c < b.c + b.w; c++) set(c, r, G_BLOCK);
}
buildMap();

/* --- 3. SAVING --------------------------------------------------------------- */
const FN = FIELD_MW * FIELD_MH;
function freshSave() {
  return { v: 1, cash: 60, xp: 0, lvl: 1, day: 1, dayT: 0.08, rain: false, seeds: { carrot: 10, wheat: 6 }, inv: {}, water: 10, hay: 0, spr: 0,
    up: { can: 0, land: 0, barn: 0, boots: 0, feeder: 0 }, field: Array.from({ length: FN }, () => [0, -1, 0, 0, 0]),
    animals: [], orders: [], firsts: {}, tut: 0, earned: 0, harvests: 0, orderCount: 0, t: Date.now(),
    wx: null, nextRain: 45, hot: 'carrot', streak: 0, lastPlay: '', bestCombo: 0, goldSeen: 0 };
}
let save = load();
function load() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { s = null; }
  const f = freshSave();
  if (!s || typeof s !== 'object' || s.v !== 1) return f;
  for (const k in f) if (!(k in s)) s[k] = f[k];
  for (const k in f.up) if (typeof s.up[k] !== 'number') s.up[k] = 0;
  if (!Array.isArray(s.field) || s.field.length !== FN) s.field = f.field;
  for (const x of s.field) if (x.length < 6) x[5] = 0;
  if (!Array.isArray(s.animals)) s.animals = [];
  return s;
}
function store() { save.t = Date.now(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* private mode */ } }
function catchUp() {                 // the farm keeps going while you're away (up to 2 hours)
  const away = clamp((Date.now() - (save.t || Date.now())) / 1000, 0, 7200);
  if (away < 5) return;
  sprinklers();
  for (const f of save.field) {
    if (f[1] < 0 || !f[0]) continue;
    const wet = f[4] === 2 ? away : Math.min(away, f[3]);
    f[2] = Math.min(1, f[2] + wet / CROPS[f[1]].time); f[3] = Math.max(0, f[3] - away);
    if (f[4] === 2) f[4] = 0;
  }
  for (const a of save.animals) if (a.fed && !a.ready) { a.pt -= away; if (a.pt <= 0) { a.ready = 1; a.fed = 0; } }
}
catchUp();

/* --- 4. FARMING -------------------------------------------------------------- */
const player = { x: 5.5 * TS, y: 9 * TS, dir: 0, walk: 0, moving: false, act: 0 };
const DIRS = [[0, 1], [0, -1], [-1, 0], [1, 0]];          // down, up, left, right
let state = 'title', paused = false, shopTab = 0, confirmNew = 0;
let parts = [], pops = [], toastMsg = null, jobs = [], animals = [], rainDrops = [];
const cam = { x: 0, y: 0 };
const fieldW = () => LAND[save.up.land][0], fieldH = () => LAND[save.up.land][1];
function fi(c, r) {                 // the field index of a tile you own, or -1
  const x = c - FIELD_C, y = r - FIELD_R;
  if (x < 0 || y < 0 || x >= fieldW() || y >= fieldH()) return -1;
  return y * FIELD_MW + x;
}
const inMaxField = (c, r) => c >= FIELD_C && r >= FIELD_R && c < FIELD_C + FIELD_MW && r < FIELD_R + FIELD_MH;
const unlockedCrops = () => CROPS.filter(c => c.lvl <= save.lvl);
const slots = () => { const l = unlockedCrops().map(c => c.id); if (save.lvl >= SPRINKLER.lvl) l.push('spr'); return l; };
let sel = 'carrot';
const penCap = () => (save.up.barn + 1) * 4;
function spawnAnimal(a) { animals.push({ d: a, x: rnd(PEN.x0, PEN.x1), y: rnd(PEN.y0, PEN.y1), vx: 0, vy: 0, t: rnd(0, 2), face: Math.random() < 0.5 ? -1 : 1, bob: Math.random() * 6 }); }
for (const a of save.animals) spawnAnimal(a);

function toast(s, col = '#fff') { toastMsg = { s, col, t: 2.6 }; }
function pop(x, y, s, col = '#fff') { pops.push({ x, y, s, col, t: 1.2 }); }
function burst(x, y, col, n = 8, up = 40) { for (let i = 0; i < n; i++) parts.push({ x, y, vx: rnd(-40, 40), vy: rnd(-up, -up / 3), g: 160, t: rnd(0.3, 0.7), col }); }
function addXP(n) {
  save.xp += n;
  while (save.lvl < MAX_LVL && save.xp >= xpNeed(save.lvl)) {
    save.xp -= xpNeed(save.lvl); save.lvl++; PX.Wallet.add(2);
    const nu = [...CROPS, ...ANIMALS].filter(x => x.lvl === save.lvl).map(x => x.name);
    if (save.lvl === SPRINKLER.lvl) nu.push('SPRINKLER');
    toast('LEVEL ' + save.lvl + '! ★2' + (nu.length ? '  NEW: ' + nu.join(', ') : ''), '#ffd23f'); sfx('level');
    burst(player.x, player.y - 10, '#ffd23f', 20, 80);
  }
}
function tut(step) { if (save.tut === step) { save.tut++; sfx('goal'); } }
function sprinklers() {              // a sprinkler keeps the 3 x 3 tiles around it wet (f[4] = 1 sprinkler, 2 watered by one)
  for (const f of save.field) if (f[4] === 2) f[4] = 0;
  for (let i = 0; i < FN; i++) if (save.field[i][4] === 1) {
    const x = i % FIELD_MW, y = (i / FIELD_MW) | 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const xx = x + dx, yy = y + dy; if (xx < 0 || yy < 0 || xx >= FIELD_MW || yy >= FIELD_MH) continue;
      const f = save.field[yy * FIELD_MW + xx]; if (f[4] === 0) f[4] = 2;
    }
  }
}
function newOrder() {
  const pool = unlockedCrops().map(c => c.id);
  for (const a of ANIMALS) if (save.animals.some(x => x.k === a.id)) pool.push(a.prod);
  const n = Math.min(pool.length, 1 + Math.floor(Math.random() * Math.min(3, 1 + save.lvl / 2))), need = [];
  const p = pool.slice();
  for (let i = 0; i < n; i++) {
    const id = p.splice(Math.floor(Math.random() * p.length), 1)[0], g = good(id);
    const k = Math.max(1, Math.round((2 + Math.random() * (2 + save.lvl)) * (g.sell > 60 ? 0.4 : 1)));
    need.push([id, k]);
  }
  const val = need.reduce((s, [id, k]) => s + good(id).sell * k, 0);
  return { need, cash: Math.round(val * 1.6 + 20), xp: Math.round(5 + val / 6) };
}
function fillOrders() { while (save.orders.length < 3) save.orders.push(newOrder()); }
fillOrders();

function tileCenter(c, r) { return [(c + 0.5) * TS, (r + 0.5) * TS]; }
function waterTiles(c, r) {           // the tiles one pour of the can waters
  const n = canArea(); if (n === 1) return [[c, r]];
  if (n === 9) { const l = []; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) l.push([c + dx, r + dy]); return l; }
  const [dx, dy] = DIRS[player.dir];
  return [[c, r], [c + dy, r + dx], [c - dy, r - dx]];   // a row of 3 across where you face
}
function refill() {
  const cap = CAN_CAP[save.up.can];
  if (save.water >= cap) { toast('THE CAN IS FULL', '#7ac0ff'); return; }
  save.water = cap; sfx('refill'); pop(player.x, player.y - 22, 'CAN FULL!', '#7ac0ff');
}
// Do the right thing on a tile (the one in front of you, or the one you tapped)
function actOn(c, r) {
  player.act = 0.25;
  const b = buildAt(c, r);
  if (b) {
    if (b.id === 'market') return openShop(0);
    if (b.id === 'barn') return openShop(2);
    if (b.id === 'well') return refill();
    if (b.id === 'house') {
      if (save.dayT > 0.6) { sfx('sleep'); newDay(); toast('GOOD MORNING! DAY ' + save.day, '#ffd23f'); }
      else toast('SLEEP WHEN IT GETS DARK', '#c8b8ff');
      return;
    }
    return toast('WHAT A LOVELY ' + b.name + '!', '#c8b8ff');
  }
  if (ground(c, r) === G_WATER) return refill();
  const i = fi(c, r), [cx, cy] = tileCenter(c, r);
  if (i < 0) {
    if (inMaxField(c, r)) { toast('BUY MORE LAND AT THE MARKET', '#ffb02a'); sfx('bonk'); }
    return;
  }
  const f = save.field[i];
  if (!f[0]) { f[0] = 1; f[3] = 0; sfx('till'); burst(cx, cy + 3, '#7a4c2a', 8, 40); tut(0); return; }
  if (f[4] === 1) { toast('A SPRINKLER: IT WATERS THE 8 TILES AROUND IT', '#7ac0ff'); return; }
  if (f[1] < 0) {
    if (sel === 'spr') {
      if (save.spr <= 0) { toast('NO SPRINKLERS: BUY THEM AT THE MARKET', '#ffb02a'); sfx('bonk'); return; }
      save.spr--; f[4] = 1; sprinklers(); sfx('plant'); burst(cx, cy, '#7ac0ff', 8); return;
    }
    const k = CROPS.findIndex(x => x.id === sel), cr = CROPS[k];
    if (!cr || !(save.seeds[sel] > 0)) { toast('NO ' + (cr ? cr.name : '') + ' SEEDS: BUY THEM AT THE MARKET', '#ffb02a'); sfx('bonk'); return; }
    save.seeds[sel]--; f[1] = k; f[2] = 0; sfx('plant'); burst(cx, cy + 2, '#5a3a20', 5, 20); tut(1); return;
  }
  const cr = CROPS[f[1]];
  if (f[2] >= 1) {                    // harvest
    const v = f[5] || 0, g = good(cr.id + VARS[v][0]), lucky = Math.random() < 0.12, n = lucky ? 2 : 1;
    save.inv[g.id] = (save.inv[g.id] || 0) + n; save.harvests++;
    if (cr.regrow) f[2] = cr.regrow; else { f[1] = -1; f[2] = 0; }
    f[5] = 0;
    const col = v === 1 ? '#ffd23f' : v === 2 ? '#7aff5a' : cr.col;
    sfx(v ? 'special' : 'harvest'); burst(cx, cy - 4, col, v ? 20 : 10, v ? 100 : 70); pop(cx, cy - 10, '+' + n + ' ' + g.name, col);
    if (lucky) { pop(cx, cy - 20, 'LUCKY! X2', '#ff8ad8'); sfx('lucky'); }
    combo.n = combo.t > 0 ? combo.n + 1 : 1; combo.t = 2.2;
    if (combo.n >= 3) { pop(cx, cy - 28, 'COMBO ' + combo.n + '!', '#7ae8ff'); save.bestCombo = Math.max(save.bestCombo, combo.n); }
    addXP(cr.xp * (v ? 3 : 1) + (combo.n >= 3 ? Math.floor(combo.n / 3) : 0)); tut(3);
    discover(g);
    return;
  }
  if (f[3] > 0 || f[4] === 2 || save.wx) { pop(cx, cy - 10, Math.round(f[2] * 100) + '%', '#c8f0a0'); return; }
  pour(c, r);
}
function pour(c, r) {
  if (save.water <= 0) { toast('THE CAN IS EMPTY: FILL IT AT THE WELL OR THE POND', '#7ac0ff'); sfx('bonk'); return; }
  save.water--; sfx('water');
  for (const [x, y] of waterTiles(c, r)) {
    const i = fi(x, y); if (i < 0 || !save.field[i][0]) continue;
    save.field[i][3] = WET; const [cx, cy] = tileCenter(x, y);
    for (let k = 0; k < 4; k++) parts.push({ x: cx + rnd(-5, 5), y: cy - 10, vx: rnd(-10, 10), vy: rnd(20, 50), g: 200, t: 0.3, col: '#7ac0ff' });
  }
  if (save.field.some(f => f[1] >= 0 && f[3] > 0)) tut(2);
}
function actOnAnimal(a) {
  player.act = 0.25;
  const s = a.d, d = ANIMALS.find(x => x.id === s.k), g = good(d.prod);
  if (s.ready) {
    s.ready = 0; save.inv[d.prod] = (save.inv[d.prod] || 0) + 1; sfx(d.id); burst(a.x, a.y - 10, '#fff', 8, 60);
    pop(a.x, a.y - 18, '+1 ' + g.name, '#fff'); addXP(d.xp);
    discover(g);
    return;
  }

  for (let d = 1; d <= 7; d++) { const bx = x + 18 + (d - 1) * 27, on = d <= Math.min(gift.day, 7); ctx.fillStyle = on ? '#ffd23f' : '#4a3624'; ctx.fillRect(bx, y + 52, 22, 14); T(String(d), bx + 11, y + 56, on ? '#2a1e14' : '#8a7a6a', 1, 'center'); }
  T(money(gift.cash) + '   ' + gift.seeds + ' SEEDS   ★' + gift.stars, W / 2, y + 80, '#5ad43f', 2, 'center', '#000');
  const bounce = Math.round(Math.sin(t * 6) * 2);
  if (UI.button('gift', x + 40, y + 112 + bounce, 140, 26, 'COLLECT!', { accent: '#5ad43f' }) || UI.back) {
    earn(gift.cash); PX.Wallet.add(gift.stars);
    const l = unlockedCrops(); for (let i = 0; i < gift.seeds; i++) { const c = l[Math.floor(Math.random() * l.length)].id; save.seeds[c] = (save.seeds[c] || 0) + 1; }
    sfx('lucky'); coinShower(gift.cash); gift = null; store();
  }
}
function drawCoins(dt) {
  for (const c of coins) {
    c.t += dt; if (c.t < 0) continue;
    if (c.t < 0.35) { c.x += c.vx * dt; c.y += c.vy * dt; c.vy += 300 * dt; }
    else { const k = Math.min(1, dt * 7); c.x += (24 - c.x) * k; c.y += (10 - c.y) * k; }
    if (c.t > 0.35 && Math.hypot(c.x - 24, c.y - 10) < 6) { c.done = 1; if (Math.random() < 0.5) sfx('coin'); }
    const x = Math.round(c.x), y = Math.round(c.y);
    ctx.fillStyle = '#1a1020'; ctx.fillRect(x - 3, y - 3, 7, 7); ctx.fillStyle = '#ffd23f'; ctx.fillRect(x - 2, y - 2, 5, 5); ctx.fillStyle = '#fff3a8'; ctx.fillRect(x - 1, y - 2, 2, 1);
  }
  coins = coins.filter(c => !c.done && c.t < 3);
  if (bigPop) {
    bigPop.t -= dt; if (bigPop.t <= 0) bigPop = null;
    else { ctx.globalAlpha = Math.min(1, bigPop.t * 2); PX.drawLogo(ctx, bigPop.s, S.W / 2, 124 - Math.round((1.6 - bigPop.t) * 12), 3, { color: '#ffd23f', shade: '#ffb020' }); ctx.globalAlpha = 1; }
  }
}
function setPause(v) { if (state !== 'play') return; paused = v; jobs = []; for (const k in inp) inp[k] = false; held.clear(); if (v) store(); }

/* --- 8. SOUND --------------------------------------------------------------------- */
function sfx(k) {
  if (!sfxOn) return;
  const s = PX.Sound;
  if (k === 'click') s.tone([523, 784], 0.08, { vol: 0.08 });
  else if (k === 'till') s.noise(0.12, { freq: 400, vol: 0.12 });
  else if (k === 'plant') s.tone([300, 500], 0.08, { vol: 0.08, type: 'triangle' });
  else if (k === 'water') s.noise(0.25, { freq: 2500, vol: 0.06, filter: 'bandpass' });
  else if (k === 'refill') { s.noise(0.4, { freq: 1500, vol: 0.06, filter: 'bandpass' }); s.tone([400, 900], 0.3, { vol: 0.05, type: 'sine' }); }
  else if (k === 'harvest') s.tone([520, 1040], 0.12, { vol: 0.09 });
  else if (k === 'cash' || k === 'buy') [1047, 1319, 1568].forEach((f, i) => s.tone(f, 0.08, { vol: 0.07, delay: i * 0.05 }));
  else if (k === 'upgrade') s.tone([440, 880, 1320], 0.25, { vol: 0.08 });
  else if (k === 'level' || k === 'goal') [523, 659, 784, 1047].forEach((f, i) => s.tone(f, 0.15, { vol: 0.08, delay: i * 0.08, type: 'triangle' }));
  else if (k === 'bonk') s.tone([220, 160], 0.1, { vol: 0.07 });
  else if (k === 'coin') s.tone([1568, 2093], 0.05, { vol: 0.04 });
  else if (k === 'special') [880, 1175, 1568, 2093].forEach((f, i) => s.tone(f, 0.1, { vol: 0.07, delay: i * 0.04, type: 'triangle' }));
  else if (k === 'lucky') [784, 988, 1175, 1568, 1976].forEach((f, i) => s.tone(f, 0.12, { vol: 0.07, delay: i * 0.06 }));
  else if (k === 'rain') s.noise(1.2, { freq: 3000, vol: 0.05, filter: 'bandpass' });
  else if (k === 'gold') { s.noise(1.2, { freq: 4000, vol: 0.04, filter: 'bandpass' }); [1047, 1319, 1568, 2093, 2637].forEach((f, i) => s.tone(f, 0.25, { vol: 0.06, delay: i * 0.1, type: 'sine' })); }
  else if (k === 'radio') { s.noise(1.2, { freq: 2000, vol: 0.05, filter: 'bandpass' }); for (let i = 0; i < 8; i++) s.noise(0.03, { freq: 6000, vol: 0.08, delay: i * 0.07 + Math.random() * 0.05, filter: 'highpass' }); s.tone([200, 800, 200], 0.8, { vol: 0.04, type: 'sawtooth' }); }
  else if (k === 'eat') s.noise(0.15, { freq: 700, vol: 0.08 });
  else if (k === 'sleep') [784, 659, 523, 392].forEach((f, i) => s.tone(f, 0.2, { vol: 0.06, delay: i * 0.12, type: 'sine' }));
  else if (k === 'chicken') { s.tone([900, 1300], 0.06, { vol: 0.06 }); s.tone([1000, 1400], 0.06, { vol: 0.06, delay: 0.09 }); }
  else if (k === 'cow') s.tone([180, 150, 120], 0.6, { vol: 0.1, type: 'sawtooth' });
  else if (k === 'sheep') { for (let i = 0; i < 4; i++) s.tone([420, 380], 0.09, { vol: 0.06, delay: i * 0.08, type: 'triangle' }); }
  else if (k === 'pig') { s.tone([260, 200], 0.12, { vol: 0.09, type: 'square' }); s.tone([280, 210], 0.12, { vol: 0.09, type: 'square', delay: 0.16 }); }
}

/* --- 9. INPUT ------------------------------------------------------------------- */
const held = new Set();
const KEYMAP = { ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r', ArrowUp: 'u', KeyW: 'u', ArrowDown: 'd', KeyS: 'd', Space: 'a', Enter: 'a' };
function syncInp() { for (const k in inp) inp[k] = false; for (const c of held) if (KEYMAP[c]) inp[KEYMAP[c]] = true; }
function cycleSeed(d) { const l = slots(); sel = l[(l.indexOf(sel) + d + l.length) % l.length]; sfx('click'); }
let dragOn = false, lastDrag = -1;
function worldTap(x, y) {
  const wx = x + cam.x, wy = y + cam.y;
  const a = nearAnimal(wx, wy, 12);
  if (a) { addJob({ a }); return; }
  const c = Math.floor(wx / TS), r = Math.floor(wy / TS);
  lastDrag = gi(c, r); addJob({ c, r });
}
UI.onDown = (e, x, y) => {
  PX.Sound.unlock();
  if (e.pointerType !== 'mouse') touchUsed = true;
  if (state !== 'play' || paused || UI.downId !== null) return;
  dragOn = true; worldTap(x, y);
};
UI.onMove = (e, x, y) => {
  if (!dragOn || state !== 'play' || paused) return;
  const c = Math.floor((x + cam.x) / TS), r = Math.floor((y + cam.y) / TS);
  if (gi(c, r) !== lastDrag && fi(c, r) >= 0) { lastDrag = gi(c, r); addJob({ c, r }); }
};
UI.onUp = () => { dragOn = false; };
window.addEventListener('keydown', e => {
  PX.Sound.unlock();
  if (state === 'play' && !paused) {
    if (KEYMAP[e.code]) { e.preventDefault(); if (!held.has(e.code) && KEYMAP[e.code] === 'a') actRepeat = 0; held.add(e.code); syncInp(); return; }
    if (e.code === 'KeyQ') { cycleSeed(-1); return; }
    if (e.code === 'KeyE') { cycleSeed(1); return; }
    const n = parseInt(e.code.replace('Digit', ''), 10); if (n >= 1 && n <= slots().length) { sel = slots()[n - 1]; sfx('click'); return; }
  }
  if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'play') setPause(!paused);
  else if (e.code === 'Escape') UI.back = true;
});
window.addEventListener('keyup', e => { if (held.delete(e.code)) syncInp(); });
window.addEventListener('blur', () => { held.clear(); syncInp(); setPause(true); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { setPause(true); store(); } });
window.addEventListener('pagehide', () => store());

/* --- 10. MAIN LOOP ----------------------------------------------------------------- */
let last = performance.now();
cam.x = 2 * TS; cam.y = 3 * TS;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000), t = now / 1000; last = now;
  UI.begin();
  if (confirmNew > 0) confirmNew -= dt;
  if (state === 'play' && !paused && !gift) update(dt);
  else if (state === 'shop') { for (const p of pops) p.t -= dt; pops = pops.filter(p => p.t > 0); if (toastMsg) { toastMsg.t -= dt; if (toastMsg.t <= 0) toastMsg = null; } }
  updateCam(dt, t);
  drawWorld(t);
  if (state === 'title') drawTitle(t);
  else if (state === 'shop') { drawShop(t); if (toastMsg) { const W = S.W, w = PX.textWidth(toastMsg.s) + 14; ctx.fillStyle = 'rgba(11,9,18,0.9)'; ctx.fillRect(Math.round(W / 2 - w / 2), H - 44, w, 15); T(toastMsg.s, W / 2, H - 39, toastMsg.col, 1, 'center'); } }
  else { drawHUD(t); if (gift) drawGift(t); else if (paused) drawPause(); }
  if (state !== 'title') drawCoins(dt);
  UI.end();
  S.blit('#1a3a12');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => { /* offline mode unavailable */ }));
}
PX.Pad.setup({
  title: 'Pixel Farmings: controller', ui: UI, menu: () => state !== 'play' || paused || !!gift,
  phone: { stick: 'WALK', dpad: true, buttons: [['A', 'DO IT'], ['X', 'SEED <'], ['Y', 'SEED >']] },
  keys: () => ({ left: 'ArrowLeft', right: 'ArrowRight', down: 'ArrowDown', up: 'ArrowUp', A: 'Space', X: 'KeyQ', Y: 'KeyE', START: 'KeyP' }),
  help: [['STICK|D-PAD', 'WALK'], ['A', 'TILL, PLANT, WATER, HARVEST, FEED, SHOP'], ['X|Y', 'PICK THE SEEDS'], ['START', 'PAUSE']],
});
</script>
