<!DOCTYPE html>

<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0b13; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #screen { position: fixed; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
  /* probe for the phone's notch / rounded corners (read from JS) */
  #safe { position: fixed; visibility: hidden; pointer-events: none;
          padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  /* room-code box for joining a multiplayer game (positioned from JS over the canvas) */
  #code { position: fixed; display: none; box-sizing: border-box; text-align: center; text-transform: uppercase;
          font: bold 32px ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.3em; padding: 0 0 0 0.3em;
          color: #111; background: #fbf9f3; border: 3px solid #111; border-radius: 0; outline: none; }
</style>

<body>
<canvas id="screen"></canvas>
<div id="safe"></div>
<input id="code" maxlength="4" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" inputmode="text" aria-label="Room code">
<script>
'use strict';
/* ==========================================================================
   MOUSE THIEF
   You stole the cat's mouse "just for fun". She did not find it funny.

   Code map
     1. Config & utilities
     2. Save data (localStorage)
     3. Audio: sound effects + chiptune sequencer (pure WebAudio, no files)
     4. Canvas, pixel font & sprites
     5. Input: keyboard, mouse, touch gestures + immediate-mode UI buttons
     6. Abilities & shop data
     7. Level generation (procedural chunks + troll traps)
     8. Player (parkour physics)
     9. Cat AI
    10. Run: scoring, anger, abilities, effects, HUD, game over
    11. Intro cutscene
    12. Menu screens: main, shop, high score, settings
    13. Main loop
   ========================================================================== */

/* --------------------------------------------------------------------------
   1. CONFIG & UTILITIES
   -------------------------------------------------------------------------- */
const H = 240;                    // logical height; everything is drawn at this resolution and scaled up
const MIN_W = 400, MAX_W = 560;   // logical width follows the screen's aspect ratio
let W = 420;
const STEP = 1 / 120;             // fixed physics step

const PHYS = {
  gravity: 1760,
  jump: 450,          // ground jump  (~57px, three body heights)
  doubleJump: 400,    // air jump     (~45px more)
  wallJump: 460,
  maxFall: 680,
  wallSlide: 100,     // max fall speed while pressed against a wall
  fastFall: 620,      // "slide" pressed in the air slams you down
  coyote: 0.1,        // grace time to jump after running off a ledge
  jumpBuffer: 0.12,   // a jump pressed slightly too early still counts
  slideTime: 0.55,
};

const RUN = {
  baseSpeed: 185,     // player run speed at t=0 (px/s)
  speedGrowth: 0.0037,// the player slowly speeds up...
  maxSpeedMul: 1.55,  // ...up to this multiplier
  catRatio: 0.72,     // cat base speed relative to the player's: she is fast, you are faster
  angerEvery: 30,     // seconds between cat speed-ups
  angerGain: 0.20,    // +20% each time, compounding
  pointEvery: 5,      // +1 point every 5 seconds survived
  maxGap: 175,        // she never falls further behind than this (stays at the screen edge)
  startGap: 110,
  catchGap: 3,
  boostMul: 1.7,
};

const PAL = {
  paper: '#f3efe4', paperHi: '#fbf9f3', ink: '#111111', inkSoft: '#77726a',
  red: '#e01e1e', gold: '#ffd23f', goldDark: '#a87400', green: '#2f9a5a',
  skyTop: '#140f24', skyBot: '#3d3058', skyLow: '#5a4670',
  far: '#2a2240', mid: '#1c1730', ground: '#0d0b13', rim: '#8070b0', rimDark: '#2a2340', shingle: '#1a1524',
  brick: '#1a1526', brickLine: '#2b2340', spike: '#ece6f7', spikeShade: '#a69cc0', window: '#e9c46a',
  rimPlayer: '#9d8fd0', rimCat: '#8b7fb0',
};

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
let rng = Math.random;            // swapped for a seeded one while building a race level (see Level.next)
const rand = (a, b) => a + rng() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const chance = p => rng() < p;
const pick = arr => arr[Math.floor(rng() * arr.length)];
// Small seeded random generator: both phones in a race build the same level from the same seed.
function mulberry32(a) {
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const easeOut = t => 1 - (1 - t) * (1 - t);
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function fmtTime(t) { const m = Math.floor(t / 60), s = Math.floor(t % 60); return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0'); }
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function lerpColor(a, b, t) { const A = hexToRgb(a), B = hexToRgb(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',') + ')'; }
function overlaps(a, b) { return a.x < b.x + b.w - 0.001 && a.x + a.w > b.x + 0.001 && a.y < b.y + b.h - 0.001 && a.y + a.h > b.y + 0.001; }

let state = 'menu';   // menu | shop | scores | settings | intro | run
let menuT = 0;        // global animation clock
let run = null;       // the current run (see section 10)

/* --------------------------------------------------------------------------
   2. SAVE DATA
   -------------------------------------------------------------------------- */
const SAVE_KEY = 'mouseThief.save.v1';
const Save = {
  data: null,
  defaults() {
    return { points: 0, totalEarned: 0, bestTime: 0, bestPoints: 0, runs: 0, tiers: {}, equipped: [],
             sound: true, music: true, intro: true, shake: true, touchButtons: true, tutorialDone: false };
  },
  load() {
    let d = {};
    try { d = JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch (e) { d = {}; }
    this.data = Object.assign(this.defaults(), d);
    if (!this.data.tiers || typeof this.data.tiers !== 'object') this.data.tiers = {};
    if (!Array.isArray(this.data.equipped)) this.data.equipped = [];
  },
  save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); } catch (e) { /* private mode: progress lives for this session only */ } },
};
Save.load();

/* --------------------------------------------------------------------------
   3. AUDIO
   -------------------------------------------------------------------------- */
const Sound = {
  ctx: null, master: null, sfxBus: null, musicBus: null, noiseBuf: null, last: {},
  // Browsers only allow audio after a user gesture, so this runs on the first key/tap.
  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { this.ctx = new AC(); } catch (e) { return; }
      const c = this.ctx;
      const comp = c.createDynamicsCompressor(); comp.connect(c.destination);
      this.master = c.createGain(); this.master.gain.value = 0.8; this.master.connect(comp);
      this.sfxBus = c.createGain(); this.sfxBus.connect(this.master);
      this.musicBus = c.createGain(); this.musicBus.connect(this.master);
      this.noiseBuf = c.createBuffer(1, c.sampleRate, c.sampleRate);
      const ch = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
      this.apply();
      setInterval(() => Music.tick(), 25);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  apply() {
    if (!this.ctx) return;
    this.sfxBus.gain.value = Save.data.sound ? 0.6 : 0;
    this.musicBus.gain.value = Save.data.music ? 0.3 : 0;
  },
};

// One oscillator note. f may be a number or a list of frequencies to glide through.
function tone(f, dur, o = {}) {
  const c = Sound.ctx; if (!c) return;
  const t0 = (o.at ?? c.currentTime) + (o.delay || 0);
  const osc = c.createOscillator(), g = c.createGain();
  osc.type = o.type || 'square';
  const fs = Array.isArray(f) ? f : [f];
  osc.frequency.setValueAtTime(fs[0], t0);
  for (let i = 1; i < fs.length; i++) osc.frequency.exponentialRampToValueAtTime(Math.max(20, fs[i]), t0 + dur * i / (fs.length - 1));
  const vol = o.vol ?? 0.2, att = o.attack ?? 0.005;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + att);
  g.gain.setValueAtTime(vol, t0 + Math.max(att + 0.001, dur * (o.hold ?? 0.5)));
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  if (o.vib) {
    const l = c.createOscillator(), lg = c.createGain();
    l.frequency.value = o.vibRate || 8; lg.gain.value = o.vib;
    l.connect(lg); lg.connect(osc.frequency); l.start(t0); l.stop(t0 + dur + 0.05);
  }
  osc.connect(g); g.connect(o.dest || Sound.sfxBus);
  osc.start(t0); osc.stop(t0 + dur + 0.05);
}

// Filtered white noise burst (hits, hats, crumbles, screams).
function noise(dur, o = {}) {
  const c = Sound.ctx; if (!c) return;
  const t0 = (o.at ?? c.currentTime) + (o.delay || 0);
  const src = c.createBufferSource(); src.buffer = Sound.noiseBuf;
  const fl = c.createBiquadFilter(); fl.type = o.filter || 'bandpass';
  fl.frequency.setValueAtTime(o.freq || 1000, t0);
  if (o.sweepTo) fl.frequency.exponentialRampToValueAtTime(o.sweepTo, t0 + dur);
  fl.Q.value = o.q ?? 1;
  const g = c.createGain(), vol = o.vol ?? 0.2;
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(fl); fl.connect(g); g.connect(o.dest || Sound.sfxBus);
  src.start(t0, Math.random() * 0.4); src.stop(t0 + dur + 0.05);
}

const SFX = {
  jump: () => tone([300, 620], 0.12, { vol: 0.16 }),
  djump: () => tone([520, 1040], 0.12, { vol: 0.14 }),
  wall: () => { tone([420, 840], 0.1, { vol: 0.14 }); noise(0.04, { freq: 3000, vol: 0.1 }); },
  slide: () => noise(0.25, { freq: 1500, sweepTo: 400, vol: 0.18 }),
  land: () => noise(0.05, { freq: 400, filter: 'lowpass', vol: 0.15 }),
  bonk: () => tone([200, 90], 0.14, { vol: 0.2 }),
  point: () => { tone(988, 0.06, { vol: 0.12 }); tone(1319, 0.12, { vol: 0.12, delay: 0.06 }); },
  alarm: () => { for (let i = 0; i < 3; i++) { tone(880, 0.1, { vol: 0.13, delay: i * 0.22, type: 'sawtooth' }); tone(660, 0.1, { vol: 0.13, delay: i * 0.22 + 0.11, type: 'sawtooth' }); } },
  scream: () => {
    tone([600, 1150, 900, 420], 0.9, { type: 'sawtooth', vol: 0.2, vib: 60, vibRate: 22 });
    tone([900, 1500, 1200, 600], 0.9, { vol: 0.07, vib: 80, vibRate: 25 });
    noise(0.7, { freq: 2500, q: 0.7, vol: 0.08 });
  },
  hit: () => { noise(0.4, { freq: 600, filter: 'lowpass', vol: 0.35 }); tone([420, 50], 0.5, { vol: 0.22 }); },
  troll: () => { [392, 370, 349].forEach((f, i) => tone(f, 0.16, { type: 'triangle', vol: 0.25, delay: i * 0.17 })); tone([330, 300], 0.45, { type: 'triangle', vol: 0.25, delay: 0.51, vib: 8, vibRate: 6 }); },
  pop: () => { tone([1200, 2000], 0.06, { vol: 0.12 }); noise(0.06, { freq: 5000, filter: 'highpass', vol: 0.12 }); },
  popWarn: () => tone(1600, 0.04, { vol: 0.08 }),
  crumble: () => noise(0.25, { freq: 500, filter: 'lowpass', vol: 0.2 }),
  freeze: () => { for (let i = 0; i < 6; i++) tone(1400 + i * 220, 0.09, { type: 'triangle', vol: 0.1, delay: i * 0.045 }); noise(0.4, { freq: 6000, filter: 'highpass', vol: 0.05 }); },
  thaw: () => tone([900, 300], 0.3, { type: 'triangle', vol: 0.12 }),
  shield: () => tone([500, 1100], 0.25, { type: 'triangle', vol: 0.2 }),
  shieldPop: () => { noise(0.15, { freq: 3000, vol: 0.2 }); tone([1000, 250], 0.25, { vol: 0.15 }); },
  boost: () => tone([180, 900], 0.35, { type: 'sawtooth', vol: 0.12 }),
  double: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.08, { vol: 0.12, delay: i * 0.06 })),
  click: () => tone(700, 0.04, { vol: 0.1 }),
  tick: () => tone(500, 0.025, { vol: 0.06 }),
  buy: () => [523, 784, 1047, 1568].forEach((f, i) => tone(f, 0.09, { vol: 0.12, delay: i * 0.07, type: 'triangle' })),
  deny: () => { tone(160, 0.1, { vol: 0.18 }); tone(120, 0.14, { vol: 0.18, delay: 0.11 }); },
  grab: () => tone([700, 1400], 0.08, { vol: 0.14 }),
  nyah: () => { tone([600, 500], 0.12, { vol: 0.12, type: 'triangle' }); tone([600, 500], 0.12, { vol: 0.12, type: 'triangle', delay: 0.18 }); },
  question: () => tone([400, 700], 0.18, { type: 'triangle', vol: 0.14 }),
  alert: () => { tone(1320, 0.08, { vol: 0.2 }); tone(1760, 0.25, { vol: 0.2, delay: 0.08 }); },
  scratch: () => noise(0.35, { freq: 1800, sweepTo: 300, q: 3, vol: 0.3 }),
  purr: () => { for (let i = 0; i < 5; i++) noise(0.12, { freq: 140, filter: 'lowpass', vol: 0.3, delay: i * 0.16 }); },
  uhoh: () => { tone(520, 0.14, { type: 'triangle', vol: 0.18 }); tone(390, 0.25, { type: 'triangle', vol: 0.18, delay: 0.16 }); },
  heartbeat: () => { tone([90, 50], 0.1, { type: 'sine', vol: 0.4 }); tone([90, 50], 0.1, { type: 'sine', vol: 0.3, delay: 0.16 }); },
  gameover: () => [523, 392, 330, 262].forEach((f, i) => tone(f, 0.22, { type: 'triangle', vol: 0.2, delay: i * 0.18 })),
  go: () => { tone([300, 900], 0.2, { vol: 0.14 }); },
  pounce: () => { noise(0.18, { freq: 900, sweepTo: 2500, vol: 0.2 }); tone([300, 700], 0.15, { type: 'sawtooth', vol: 0.12 }); },
  roar: () => { tone([180, 120, 90], 0.7, { type: 'sawtooth', vol: 0.25, vib: 30, vibRate: 18 }); noise(0.6, { freq: 400, filter: 'lowpass', vol: 0.3 }); },
  beep: () => tone(660, 0.12, { vol: 0.15 }),
};
function sfx(name) {
  if (netEmit()) Net.ev.push(['s', name]);         // multiplayer: the friend hears it too
  if (!Sound.ctx || !Save.data.sound || !SFX[name]) return;
  const now = Sound.ctx.currentTime;
  if (now - (Sound.last[name] || 0) < 0.04) return;   // avoid machine-gun stacking
  Sound.last[name] = now;
  SFX[name]();
}

// Tiny 4-bar chiptune sequencer: 16th-note steps, lead + bass + drums.
const seq = s => s.trim().split(/\s+/).map(v => v === '.' ? 0 : +v);
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
const TRACKS = {
  menu: {
    bpm: 112, leadType: 'triangle', leadVol: 0.22, drums: false, roots: [48, 45, 41, 43],
    lead: seq(`72 . 76 . 79 . 76 . 77 . 76 . 74 . 72 .
               69 . 72 . 76 . 72 . 74 . 72 . 71 . 69 .
               65 . 69 . 72 . 69 . 72 . 74 . 72 . 69 .
               67 . 71 . 74 . 71 . 74 . 77 . 76 . 74 .`),
  },
  chase: {
    bpm: 150, leadType: 'square', leadVol: 0.11, drums: true, roots: [45, 41, 43, 40],
    lead: seq(`69 . 72 . 76 . 72 . 74 . 72 . 71 . 69 .
               65 . 69 . 72 . 74 . 72 . 69 . 65 . 64 .
               67 . 71 . 74 . 71 . 72 . 74 . 76 . 74 .
               76 . 75 . 76 . 71 . 68 . 71 . 76 . . .`),
  },
};
const Music = {
  track: null, step: 0, nextTime: 0, bpmBoost: 0,
  play(name) {
    if (this.track === name) return;
    this.track = name; this.step = 0;
    if (Sound.ctx) this.nextTime = Sound.ctx.currentTime + 0.06;
  },
  stop() { this.track = null; },
  tick() {
    const c = Sound.ctx;
    if (!c || !this.track || c.state !== 'running') return;
    const tr = TRACKS[this.track];
    const spb = 60 / (tr.bpm + this.bpmBoost) / 4;
    if (this.nextTime < c.currentTime - 0.2) this.nextTime = c.currentTime + 0.05;   // tab was asleep
    while (this.nextTime < c.currentTime + 0.12) {
      this.playStep(tr, this.step, this.nextTime, spb);
      this.nextTime += spb;
      this.step = (this.step + 1) % 64;
    }
  },
  playStep(tr, i, t, spb) {
    const dest = Sound.musicBus;
    const n = tr.lead[i];
    if (n) tone(midi(n), spb * 1.7, { type: tr.leadType, vol: tr.leadVol, at: t, dest, hold: 0.3 });
    const s = i % 16, root = tr.roots[Math.floor(i / 16)];
    if (s % 2 === 0) tone(midi(root + (s % 4 === 2 ? 12 : 0)), spb * 1.6, { type: tr.drums ? 'square' : 'triangle', vol: tr.drums ? 0.06 : 0.16, at: t, dest });
    if (tr.drums) {
      if (s % 8 === 0 || s === 10) tone([150, 40], 0.12, { type: 'sine', vol: 0.5, at: t, dest });
      if (s === 4 || s === 12) noise(0.1, { freq: 1800, vol: 0.16, at: t, dest });
      if (s % 2 === 1) noise(0.03, { freq: 8000, filter: 'highpass', vol: 0.05, at: t, dest });
    } else if (s % 4 === 2) noise(0.03, { freq: 8000, filter: 'highpass', vol: 0.025, at: t, dest });
  },
};

/* --------------------------------------------------------------------------
   4. CANVAS, PIXEL FONT & SPRITES
   -------------------------------------------------------------------------- */
const screenCanvas = document.getElementById('screen');
const sctx = screenCanvas.getContext('2d');
const buf = document.createElement('canvas');     // low-res frame buffer
const ctx = buf.getContext('2d');
let view = { scale: 1, ox: 0, oy: 0, dpr: 1, portrait: false };
let skyGrad = null;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const cw = window.innerWidth, ch = window.innerHeight;
  screenCanvas.width = Math.round(cw * dpr); screenCanvas.height = Math.round(ch * dpr);
  screenCanvas.style.width = cw + 'px'; screenCanvas.style.height = ch + 'px';
  // keep the game inside the safe area (notch / home indicator) when running full screen
  const cs = getComputedStyle(document.getElementById('safe'));
  const sl = parseFloat(cs.paddingLeft) || 0, sr = parseFloat(cs.paddingRight) || 0;
  const st = parseFloat(cs.paddingTop) || 0, sb = parseFloat(cs.paddingBottom) || 0;
  const aw = cw - sl - sr, ah = ch - st - sb;
  let scale = ah / H;
  W = clamp(Math.round(aw / scale), MIN_W, MAX_W);
  if (W * scale > aw) scale = aw / W;              // portrait phones: letterbox
  buf.width = W; buf.height = H;
  ctx.imageSmoothingEnabled = false;
  view = { scale: scale * dpr, ox: Math.round((sl + (aw - W * scale) / 2) * dpr), oy: Math.round((st + (ah - H * scale) / 2) * dpr), dpr, portrait: ch > cw * 1.1 };
  skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0, PAL.skyTop); skyGrad.addColorStop(0.7, PAL.skyBot); skyGrad.addColorStop(1, PAL.skyLow);
}
window.addEventListener('resize', resize);
resize();

function blit() {
  sctx.imageSmoothingEnabled = false;
  sctx.fillStyle = (state === 'run' || state === 'intro') ? '#000' : PAL.paper;
  sctx.fillRect(0, 0, screenCanvas.width, screenCanvas.height);
  sctx.drawImage(buf, 0, 0, W, H, view.ox, view.oy, Math.round(W * view.scale), Math.round(H * view.scale));
}

// 3x5 bitmap font (a few glyphs are wider). Rows separated by commas.
const FONT = {
  A: '010,101,111,101,101', B: '110,101,110,101,110', C: '011,100,100,100,011', D: '110,101,101,101,110',
  E: '111,100,110,100,111', F: '111,100,110,100,100', G: '011,100,101,101,011', H: '101,101,111,101,101',
  I: '111,010,010,010,111', J: '001,001,001,101,010', K: '101,101,110,101,101', L: '100,100,100,100,111',
  M: '10001,11011,10101,10001,10001', N: '1001,1101,1011,1001,1001', O: '010,101,101,101,010', P: '110,101,110,100,100',
  Q: '010,101,101,110,011', R: '110,101,110,101,101', S: '011,100,010,001,110', T: '111,010,010,010,010',
  U: '101,101,101,101,111', V: '101,101,101,101,010', W: '10001,10001,10101,11011,10001', X: '101,101,010,101,101',
  Y: '101,101,010,010,010', Z: '111,001,010,100,111',
  '0': '111,101,101,101,111', '1': '010,110,010,010,111', '2': '110,001,010,100,111', '3': '110,001,010,001,110',
  '4': '101,101,111,001,001', '5': '111,100,110,001,110', '6': '011,100,111,101,111', '7': '111,001,010,010,010',
  '8': '111,101,111,101,111', '9': '111,101,111,001,110',
  ' ': '00,00,00,00,00', '.': '0,0,0,0,1', ',': '00,00,00,01,10', '!': '1,1,1,0,1', '?': '110,001,010,000,010',
  ':': '0,1,0,1,0', '-': '000,000,111,000,000', '+': '000,010,111,010,000', '/': '001,001,010,100,100',
  "'": '1,1,0,0,0', '%': '101,001,010,100,101', '(': '01,10,10,10,01', ')': '10,01,01,01,10',
  '>': '100,010,001,010,100', '<': '001,010,100,010,001', '=': '000,111,000,111,000', '*': '000,101,010,101,000',
  '"': '101,101,000,000,000', '_': '000,000,000,000,111',
  '★': '00100,01110,11111,01110,01010', '♥': '01010,11111,11111,01110,00100',
  '↓': '010,010,010,111,010', '↑': '010,111,010,010,010', '…': '00000,00000,00000,00000,10101',
};
const GLYPHS = {};
for (const ch in FONT) { const rows = FONT[ch].split(','); GLYPHS[ch] = { w: rows[0].length, rows }; }

function textWidth(str, size = 1) {
  let w = 0;
  for (const ch of String(str).toUpperCase()) w += ((GLYPHS[ch] || GLYPHS['?']).w + 1) * size;
  return Math.max(0, w - size);
}
function rawText(str, x, y, size) {
  let cx = x;
  for (const ch of str) {
    const g = GLYPHS[ch] || GLYPHS['?'];
    for (let r = 0; r < 5; r++) {
      const row = g.rows[r];
      for (let c = 0; c < g.w;) {          // merge horizontal runs into one rect
        if (row[c] === '1') { let e = c; while (e < g.w && row[e] === '1') e++; ctx.fillRect(cx + c * size, y + r * size, (e - c) * size, size); c = e; }
        else c++;
      }
    }
    cx += (g.w + 1) * size;
  }
}
function drawText(str, x, y, color = PAL.ink, size = 1, align = 'left', shadow = null) {
  str = String(str).toUpperCase();
  if (align !== 'left') { const tw = textWidth(str, size); x -= align === 'center' ? Math.floor(tw / 2) : tw; }
  x = Math.round(x); y = Math.round(y);
  if (shadow) { const o = Math.max(1, size >> 1); ctx.fillStyle = shadow; rawText(str, x + o, y + o, size); }
  ctx.fillStyle = color; rawText(str, x, y, size);
}
// Each letter jitters independently: used for screams.
function shakyText(str, cx, y, color, size, amt) {
  str = str.toUpperCase();
  let x = Math.round(cx - textWidth(str, size) / 2);
  for (const ch of str) {
    drawText(ch, x + Math.round(rand(-amt, amt)), y + Math.round(rand(-amt, amt)), color, size, 'left', '#000');
    x += ((GLYPHS[ch] || GLYPHS['?']).w + 1) * size;
  }
}

// --- Sprite helpers -------------------------------------------------------
function makeSprite(rows, pal) {
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  for (let y = 0; y < h; y++) for (let x = 0; x < rows[y].length; x++) {
    const col = pal[rows[y][x]];
    if (col) { g.fillStyle = col; g.fillRect(x, y, 1, 1); }
  }
  return c;
}
// Returns a copy (1px bigger on every side) with a 1px outline around the silhouette.
function outlineSprite(src, color) {
  const t = document.createElement('canvas'); t.width = src.width; t.height = src.height;
  const tg = t.getContext('2d');
  tg.drawImage(src, 0, 0); tg.globalCompositeOperation = 'source-in'; tg.fillStyle = color; tg.fillRect(0, 0, t.width, t.height);
  const c = document.createElement('canvas'); c.width = src.width + 2; c.height = src.height + 2;
  const g = c.getContext('2d');
  for (const [dx, dy] of [[0, 1], [2, 1], [1, 0], [1, 2]]) g.drawImage(t, dx, dy);
  g.drawImage(src, 1, 1);
  return c;
}

// Scratch canvases for sprites that are drawn procedurally every frame (the cat).
const scratch = document.createElement('canvas'); scratch.width = 80; scratch.height = 50;
const scx = scratch.getContext('2d');
const tintC = document.createElement('canvas'); tintC.width = 80; tintC.height = 50;
const tcx = tintC.getContext('2d');
function drawOutlined(x, y, w, h, outline, fn) {
  scx.clearRect(0, 0, w + 2, h + 2);
  scx.save(); scx.translate(1, 1); fn(scx); scx.restore();
  x = Math.round(x); y = Math.round(y);
  if (outline) {
    tcx.clearRect(0, 0, w + 2, h + 2);
    tcx.globalCompositeOperation = 'source-over'; tcx.drawImage(scratch, 0, 0);
    tcx.globalCompositeOperation = 'source-in'; tcx.fillStyle = outline; tcx.fillRect(0, 0, w + 2, h + 2);
    tcx.globalCompositeOperation = 'source-over';
    for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) ctx.drawImage(tintC, 0, 0, w + 2, h + 2, x - 1 + dx, y - 1 + dy, w + 2, h + 2);
  }
  ctx.drawImage(scratch, 0, 0, w + 2, h + 2, x - 1, y - 1, w + 2, h + 2);
}

// --- The cat (procedural, 60x38 box, faces right, nose at x=52) ------------
const CAT_W = 60, CAT_H = 38, CAT_NOSE = 52;
const TAIL = [[12, 21], [10, 19], [8, 17], [6, 15], [5, 13], [4, 11], [4, 9], [4, 7], [5, 5], [7, 3], [9, 2], [11, 3], [12, 5], [11, 7], [9, 7]];
function catShape(c, o) {
  const t = o.t || 0, pose = o.pose || 'stand';
  const moving = pose === 'run' || pose === 'walk';
  const dy = pose === 'crouch' ? 3 : 0;
  c.fillStyle = '#000';
  // long curled tail that sways
  const sp = pose === 'run' ? 12 : 4;
  for (let i = 0; i < TAIL.length - 1; i++) {
    const [ax, ay] = TAIL[i], [bx, by] = TAIL[i + 1];
    const k = i / (TAIL.length - 1);
    const sway = Math.sin(t * sp + i * 0.5) * k * 2.2;
    const th = i < TAIL.length - 4 ? 3 : 2;
    for (let s = 0; s < 4; s++) c.fillRect(Math.round(ax + (bx - ax) * s / 4 + sway), Math.round(ay + (by - ay) * s / 4) + dy, th, th);
  }
  // body
  c.fillRect(14, 16 + dy, 26, 12); c.fillRect(12, 18 + dy, 30, 8); c.fillRect(17, 14 + dy, 14, 2);
  if (o.puff) for (const fx of [15, 19, 23, 27, 31, 35]) { c.fillRect(fx, 11 + dy, 1, 3); c.fillRect(fx + 1, 13 + dy, 1, 1); }
  // head, snout, pointed ears
  c.fillRect(37, 6 + dy, 13, 13); c.fillRect(35, 8 + dy, 17, 9); c.fillRect(38, 19 + dy, 11, 1);
  c.fillRect(52, 11 + dy, 1, 3);
  for (let r = 0; r < 6; r++) {
    const ew = 1 + Math.floor(r * 0.8);
    c.fillRect(37, 1 + r + dy, ew, 1);
    c.fillRect(50 - ew + 1, 1 + r + dy, ew, 1);
  }
  // legs
  if (pose === 'pounce') {
    c.fillRect(40, 20, 14, 3); c.fillRect(42, 24, 13, 3); c.fillRect(2, 22, 13, 3); c.fillRect(4, 26, 12, 3);
  } else {
    const legY = 27 + dy, legLen = 10 - dy;
    const ph = t * (pose === 'run' ? 16 : 9);
    [[15, 0], [20, 0.8], [33, Math.PI], [38, Math.PI + 0.8]].forEach(([lx, off], i) => {
      if (o.hold && i === 3) return;
      let ldx = 0, lift = 0;
      if (moving) { ldx = Math.round(Math.sin(ph + off) * 3); lift = Math.max(0, Math.round(Math.cos(ph + off) * 2.5)); }
      c.fillRect(lx + ldx, legY, 3, legLen - lift);
      c.fillRect(lx + ldx, legY + legLen - lift - 1, 4, 1);
    });
    if (o.hold) c.fillRect(39, 21 + dy, 15, 3);   // front paw raised, holding the mouse
  }
  // eyes
  const eye = o.eyes || 'normal';
  if (eye === 'closed') {          // blissful ^ ^
    c.fillStyle = '#8a1c1c';
    c.fillRect(39, 11 + dy, 1, 1); c.fillRect(40, 10 + dy, 2, 1); c.fillRect(42, 11 + dy, 1, 1);
    c.fillRect(45, 11 + dy, 1, 1); c.fillRect(46, 10 + dy, 2, 1); c.fillRect(48, 11 + dy, 1, 1);
  } else if (eye === 'rage') {     // huge, bright, angry
    c.fillStyle = '#ff3b3b';
    c.fillRect(39, 9 + dy, 4, 4); c.fillRect(46, 9 + dy, 4, 4);
    c.fillStyle = '#000'; c.fillRect(42, 9 + dy, 1, 1); c.fillRect(46, 9 + dy, 1, 1);
    c.fillStyle = '#fff'; c.fillRect(40, 10 + dy, 1, 1); c.fillRect(48, 10 + dy, 1, 1);
  } else {                         // normal angry slant
    c.fillStyle = eye === 'frozen' ? '#bff3ff' : '#e01e1e';
    c.fillRect(39, 10 + dy, 2, 1); c.fillRect(39, 11 + dy, 4, 2);
    c.fillRect(48, 10 + dy, 2, 1); c.fillRect(46, 11 + dy, 4, 2);
  }
  if (o.scream) {
    c.fillStyle = '#c81818'; c.fillRect(44, 14 + dy, 8, 5);
    c.fillStyle = '#fff'; c.fillRect(44, 14 + dy, 1, 2); c.fillRect(51, 14 + dy, 1, 2); c.fillRect(47, 14 + dy, 1, 1);
  }
}
function drawCat(noseX, feetY, o) {
  const bx = Math.round(noseX) - CAT_NOSE, by = Math.round(feetY) - CAT_H;
  drawOutlined(bx, by, CAT_W, CAT_H, o.outline, c => catShape(c, o));
  if (o.eyes === 'rage' || o.eyes === 'normal') {
    const dy = o.pose === 'crouch' ? 3 : 0, r = o.eyes === 'rage' ? 4 : 2;
    ctx.globalAlpha = o.eyes === 'rage' ? 0.3 + 0.15 * Math.sin((o.t || 0) * 20) : 0.18;
    ctx.fillStyle = '#ff2020';
    ctx.fillRect(bx + 41 - r, by + 11 + dy - r, r * 2 + 1, r * 2);
    ctx.fillRect(bx + 47 - r, by + 11 + dy - r, r * 2 + 1, r * 2);
    ctx.globalAlpha = 1;
  }
  return { bx, by };
}

const Input = {
  jumpQ: 0, releaseQ: 0, slideQ: 0,      // queued presses consumed by the physics step
  gestures: new Map(),                   // active touch pointers
  held: { jump: false, slide: false },   // on-screen touch buttons currently pressed
  touch: !!(window.matchMedia && matchMedia('(pointer: coarse)').matches),
  clear() { this.jumpQ = this.releaseQ = this.slideQ = 0; this.gestures.clear(); this.held.jump = this.held.slide = false; },
  // A touch becomes a jump on release, on a swipe up, or after being held 90ms.
  // Waiting a moment lets a swipe down become a slide instead of a jump.
  update() {
    const now = performance.now();
    for (const g of this.gestures.values()) if (!g.decided && now - g.t0 > 90) { g.decided = true; g.held = true; this.jumpQ++; }
  },
};

// Immediate-mode UI: screens call UI.button() while drawing; clicks are resolved next frame.
const UI = {
  list: [], focus: 0, kbNav: false, click: null, activate: false, back: false, downId: null, mx: -999, my: -999,
  begin() { this.list = []; },
  end() {
    this.click = null; this.activate = false; this.back = false;
    if (this.focus >= this.list.length) this.focus = Math.max(0, this.list.length - 1);
  },
  hit(x, y) {
    for (const b of this.list) if (!b.disabled && x >= b.x && x < b.x + b.w && y >= b.y && y < b.y + b.h) return b.id;
    return null;
  },
  move(d) {
    if (!this.list.length) return;
    if (!this.kbNav) { this.kbNav = true; return; }
    this.focus = (this.focus + d + this.list.length) % this.list.length;
    sfx('tick');
  },
  button(id, x, y, w, h, label, o = {}) {
    const idx = this.list.length;
    this.list.push({ id, x, y, w, h, disabled: !!o.disabled });
    const hover = !this.kbNav && !o.disabled && this.mx >= x && this.mx < x + w && this.my >= y && this.my < y + h;
    const focus = this.kbNav && this.focus === idx;
    const hot = hover || focus;
    const dark = o.theme === 'dark';
    const ink = dark ? '#efe9ff' : PAL.ink;
    let bg = dark ? '#1d1830' : PAL.paperHi, fg = ink, bd = ink;
    if (o.on) bg = dark ? '#3a2f5c' : '#e3d9bf';
    if (hot) { bg = o.accent || ink; fg = dark ? '#111' : PAL.paper; bd = bg; }
    if (o.disabled) { bg = dark ? '#16121f' : '#ebe6da'; fg = dark ? '#5b5275' : '#aaa496'; bd = fg; }
    if (!hot && !o.disabled) { ctx.fillStyle = bd; ctx.fillRect(x + 2, y + 2, w, h); }   // chunky drop shadow
    const off = hot ? 1 : 0;
    ctx.fillStyle = bd; ctx.fillRect(x + off, y + off, w, h);
    ctx.fillStyle = bg; ctx.fillRect(x + 1 + off, y + 1 + off, w - 2, h - 2);
    const size = o.size || 2;
    const col = o.textColor && !hot && !o.disabled ? o.textColor : fg;
    drawText(label, x + w / 2 + off, y + Math.round((h - 5 * size) / 2) + off, col, size, 'center');
    return !o.disabled && (this.click === id || (focus && this.activate));
  },
};

function playing() { return state === 'run' && run && run.phase === 'play' && !run.paused && !run.netLost; }
const codeInput = document.getElementById('code');
const touchButtonsOn = () => Input.touch && Save.data.touchButtons;

function toLogical(e) {
  const r = screenCanvas.getBoundingClientRect();
  return { x: ((e.clientX - r.left) * view.dpr - view.ox) / view.scale, y: ((e.clientY - r.top) * view.dpr - view.oy) / view.scale };
}

const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW', 'KeyZ', 'KeyK'];
window.addEventListener('keydown', e => {
  Sound.unlock();
  const k = e.code;
  if (e.target === codeInput) {                  // typing a room code
    if (k === 'Enter') Net.joinTyped(); else if (k === 'Escape') UI.back = true;
    return;
  }
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(k)) e.preventDefault();
  if (state === 'intro') { if (!e.repeat) Intro.skip(); return; }
  if (playing() && run.view) {                   // multiplayer: I'm the cat, send my moves
    if (e.repeat) return;
    if (JUMP_KEYS.includes(k)) Net.act('pounce');
    else if (k === 'Digit1' || k === 'Digit2' || k === 'Digit3') Net.act(CAT_MOVES[+k.slice(5)].id);
    return;
  }
  if (playing()) {
    if (e.repeat) return;
    if (JUMP_KEYS.includes(k)) Input.jumpQ++;
    else if (k === 'ArrowDown' || k === 'KeyS' || k === 'KeyJ') Input.slideQ++;
    else if (k === 'Digit1' || k === 'Digit2' || k === 'Digit3') useAbility(+k.slice(5) - 1);
    else if (k === 'KeyP' || k === 'Escape') setPaused(true);
    return;
  }
  if (k === 'ArrowDown' || k === 'ArrowRight' || k === 'Tab') UI.move(1);
  else if (k === 'ArrowUp' || k === 'ArrowLeft') UI.move(-1);
  else if ((k === 'Enter' || k === 'Space') && !e.repeat) { if (!UI.kbNav) UI.kbNav = true; UI.activate = true; }
  else if (k === 'Escape' || k === 'Backspace' || k === 'KeyP') UI.back = true;
});
window.addEventListener('keyup', e => { if (JUMP_KEYS.includes(e.code)) Input.releaseQ++; });

screenCanvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  Sound.unlock();
  if (e.pointerType === 'touch') Input.touch = true;
  const { x, y } = toLogical(e);
  UI.mx = x; UI.my = y; UI.kbNav = false;
  if (state === 'intro') { Intro.skip(); return; }
  if (playing()) {
    for (const r of run.hudRects) {
      const pad = r.pad || 3;
      if (x >= r.x - pad && x < r.x + r.w + pad && y >= r.y - pad && y < r.y + r.h + pad) {
        r.down();
        if (r.up) Input.gestures.set(e.pointerId, { hud: r, decided: true });   // hold-able button: release it later
        return;
      }
    }
    if (run.view) { Net.act('pounce'); return; }   // multiplayer cat: tap anywhere to pounce
    if (e.pointerType === 'mouse') {           // mouse: jump right away, release cuts the jump short
      Input.jumpQ++;
      Input.gestures.set(e.pointerId, { decided: true, held: true });
    } else {
      Input.gestures.set(e.pointerId, { x0: x, y0: y, t0: performance.now(), decided: false, held: false });
    }
    try { screenCanvas.setPointerCapture(e.pointerId); } catch (_) { /* not critical */ }
    return;
  }
  UI.downId = UI.hit(x, y);
});
screenCanvas.addEventListener('pointermove', e => {
  const { x, y } = toLogical(e);
  UI.mx = x; UI.my = y;
  if (e.pointerType === 'mouse') UI.kbNav = false;
  const g = Input.gestures.get(e.pointerId);
  if (!g || g.decided) return;
  const dx = x - g.x0, dy = y - g.y0;
  if (dy > 12 && dy > Math.abs(dx)) { g.decided = true; Input.slideQ++; }
  else if (dy < -12 && -dy > Math.abs(dx)) { g.decided = true; g.held = true; Input.jumpQ++; }
});
function endPointer(e, cancelled) {
  const g = Input.gestures.get(e.pointerId);
  if (g) {
    Input.gestures.delete(e.pointerId);
    if (g.hud) { g.hud.up(); return; }
    if (!g.decided && !cancelled) Input.jumpQ++;   // quick tap
    else if (g.held) Input.releaseQ++;
    return;
  }
  if (cancelled) return;
  const { x, y } = toLogical(e);
  const id = UI.hit(x, y);
  if (id !== null && id === UI.downId) UI.click = id;
  UI.downId = null;
}
screenCanvas.addEventListener('pointerup', e => endPointer(e, false));
screenCanvas.addEventListener('pointercancel', e => endPointer(e, true));
screenCanvas.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (playing() && !run.mp) setPaused(true); if (Sound.ctx) Sound.ctx.suspend(); }
  else {
    if (Sound.ctx) Sound.ctx.resume();
    if (Net.peer && Net.peer.disconnected && !Net.peer.destroyed) Net.peer.reconnect();   // back from sharing the room code
  }
});

/* --------------------------------------------------------------------------
   7. LEVEL GENERATION
   The world is a list of rectangles ("solids") and spike rows ("hazards").
   New chunks are appended ahead of the camera and old ones are pruned behind.
   Every chunk is built from the current run speed so jumps stay possible.
   -------------------------------------------------------------------------- */
const isFull = s => s.type === 'ground' || s.type === 'block' || s.type === 'bar' || s.type === 'invis';
const isOneWay = s => s.type === 'plat' || s.type === 'mover' || (s.type === 'crumble' && s.state < 2) || (s.type === 'fake' && s.state === 0);

const Level = {
  solids: [], hazards: [], genX: 0, gy: 190, count: 0, last: '', seen: {}, group: 0,
  nextId: 0, outbox: [],      // multiplayer: every new object gets an id and is queued for the friend's screen
  rng: null,                  // race: seeded generator, so both phones get the same level
  reset() {
    this.solids = []; this.hazards = []; this.gy = 190; this.count = 0; this.last = ''; this.seen = {}; this.group = 0;
    this.ground(-600, 1200, this.gy);
    this.genX = 600;
  },
  add(o) {
    o.id = ++this.nextId; this.solids.push(o);
    if (netEmit()) this.outbox.push(['s', o]);
    return o;
  },
  ground(x, w, y) { return this.add({ type: 'ground', x, y, w, h: H + 60 - y }); },
  spikes(x, y, w, extra) {
    const z = Object.assign({ type: 'spike', x, y, w: Math.max(8, Math.round(w / 8) * 8), pop: false, state: 2, t: 1 }, extra || {});
    z.id = ++this.nextId; this.hazards.push(z);
    if (netEmit()) this.outbox.push(['h', z]);
    return z;
  },
  updateMovers(t) {
    for (const s of this.solids) if (s.type === 'mover') {
      const ph = t * Math.PI * 2 / s.period + s.phase;
      const nx = s.bx + Math.sin(ph) * s.ax, ny = s.by + Math.sin(ph) * s.ay;
      s.dx = nx - s.x; s.dy = ny - s.y; s.x = nx; s.y = ny;
    }
  },
  crumbleRow(x, y, w, trig, o = {}) {
    const n = Math.max(1, Math.round(w / 16)), group = ++this.group;
    for (let i = 0; i < n; i++) {
      this.add({ type: 'crumble', x: x + i * 16, y, w: 16, h: o.deep ? H + 60 - y : 8, deep: !!o.deep, trig, trigX: o.trigX,
                 delay: trig === 'near' ? 0.1 + i * 0.05 : 0.3, state: 0, t: 0, vy: 0, group });
    }
    return n * 16;
  },
  // How far into the run we are, for difficulty. A race can't use the clock (each phone builds
  // chunks at its own moment), so it uses the time a thief needs to get this far instead.
  clock() {
    if (!this.rng) return run.time;
    const { baseSpeed: v0, speedGrowth: g, maxSpeedMul: m } = RUN;
    const dist = Math.max(0, this.genX - 60 - 480), tCap = (m - 1) / g, dCap = v0 * (tCap + g * tCap * tCap / 2);
    return dist < dCap ? (Math.sqrt(1 + 2 * g * dist / v0) - 1) / g : tCap + (dist - dCap) / (v0 * m);
  },
  speedEstimate() { return RUN.baseSpeed * Math.min(RUN.maxSpeedMul, 1 + (this.clock() + 2) * RUN.speedGrowth); },
  ensure(toX) {
    if (run.tutorial) return;                 // the tutorial uses a hand-built level
    while (this.genX < toX) this.next(clamp(this.clock() / 200, 0, 1));
  },
  prune(minX) {
    this.solids = this.solids.filter(s => s.x + s.w + Math.abs(s.ax || 0) > minX && s.y < H + 100);
    this.hazards = this.hazards.filter(z => z.x + z.w > minX);
  },
  next(d) {
    const prevRng = rng;
    if (this.rng) rng = this.rng;
    const v = this.speedEstimate();
    const kind = this.pick(d);
    this['p_' + kind](d, v);
    this.last = kind; this.count++;
    const rest = Math.round(lerp(112, 56, d) + rand(0, 64));   // breathing room after every chunk
    this.ground(this.genX, rest, this.gy);
    this.genX += rest;
    rng = prevRng;
  },
  pick(d) {
    const tutorial = ['gap', 'spikes', 'block', 'bar'];
    if (this.count < tutorial.length) return tutorial[this.count];
    const table = [
      ['flat', 0.6], ['gap', 1.2], ['spikes', 1.0], ['step', 0.6], ['block', 0.9],
      ['plats', d > 0.05 ? 0.7 : 0], ['bar', d > 0.06 ? 0.75 : 0], ['crumble', d > 0.1 ? 0.7 : 0],
      ['invis', d > 0.08 ? 0.55 : 0], ['pop', d > 0.1 ? 0.6 + 0.4 * d : 0], ['fake', d > 0.16 ? 0.55 : 0],
      ['mover', d > 0.18 ? 0.6 : 0], ['tower', d > 0.22 ? 0.5 : 0], ['ledge', d > 0.28 ? 0.5 : 0],
      ['popgap', d > 0.38 ? 0.45 : 0], ['spikebed', d > 0.42 ? 0.5 : 0],
    ].filter(([k, w]) => w > 0 && k !== this.last);
    let r = rng() * table.reduce((a, o) => a + o[1], 0);
    for (const [k, w] of table) { r -= w; if (r <= 0) return k; }
    return 'flat';
  },

  // --- chunk patterns --------------------------------------------------------
  p_flat() { const w = randi(96, 192); this.ground(this.genX, w, this.gy); this.genX += w; },
  p_gap(d, v) {
    const w = Math.round(v * rand(0.2, lerp(0.34, 0.6, d)));
    let ny = this.gy + pick([-16, 0, 0, 16, 32]);
    if (w > v * 0.36 && ny < this.gy) ny = this.gy;           // wide gaps never land higher
    this.genX += w;
    this.gy = clamp(ny, 160, 210);
  },
  p_spikes(d, v) {
    const sw = clamp(8 * randi(2, 2 + Math.round(d * 3)), 16, Math.floor(v * 0.34 / 8) * 8);
    const L = 48 + sw + 48;
    this.ground(this.genX, L, this.gy);
    this.spikes(this.genX + 48, this.gy, sw);
    this.genX += L;
    if (d > 0.35 && chance(0.4)) {                               // a second cluster right after
      const gap = randi(56, 88), sw2 = 8 * randi(2, 3);
      this.ground(this.genX, gap + sw2 + 48, this.gy);
      this.spikes(this.genX + gap, this.gy, sw2);
      this.genX += gap + sw2 + 48;
    }
  },
  p_step() {
    const up = chance(0.5) && this.gy > 180;
    for (let i = randi(1, 3); i > 0; i--) {
      this.gy = clamp(this.gy + (up ? -16 * randi(1, 2) : 16 * randi(1, 2)), 160, 210);
      const w = randi(48, 80);
      this.ground(this.genX, w, this.gy); this.genX += w;
    }
  },
  p_block(d) {
    const L = 144;
    this.ground(this.genX, L, this.gy);
    const h = 16 * randi(1, d > 0.3 ? 4 : 3), w = 16 * randi(1, 2);   // 64 tall needs a double jump
    this.add({ type: 'block', x: this.genX + 64, y: this.gy - h, w, h });
    this.genX += L;
  },
  p_tower() {
    const L = 220, w = randi(24, 36);
    const h = Math.min(randi(96, 128), this.gy - 40);
    this.ground(this.genX, L, this.gy);
    this.add({ type: 'block', x: this.genX + 96, y: this.gy - h, w, h, tower: true, hint: !this.seen.tower });
    this.seen.tower = true;
    this.genX += L;
  },
  p_plats(d, v) {
    let x = this.genX, py = this.gy;
    for (let i = randi(2, 3); i > 0; i--) {
      x += Math.round(rand(36, Math.max(40, v * 0.3)));
      py = clamp(py - 16 * randi(-1, 2), this.gy - 64, this.gy - 8);
      const pw = randi(40, 64);
      if (d > 0.3 && chance(0.3)) this.crumbleRow(x, py, pw, 'step');
      else this.add({ type: 'plat', x, y: py, w: pw, h: 8 });
      x += Math.round(pw / 16) * 16;
    }
    this.genX = x + Math.round(rand(36, Math.max(40, v * 0.3)));
  },
  p_bar() {
    const bl = randi(40, 80), L = 80 + bl + 48;
    this.ground(this.genX, L, this.gy);
    // hangs from the sky down to just above slide height: you can't jump over it
    this.add({ type: 'bar', x: this.genX + 80, y: -30, w: bl, h: this.gy - 13 + 30, hint: !this.seen.bar });
    this.seen.bar = true;
    this.genX += L;
  },
  p_crumble(d, v) {
    const w = 16 * Math.max(3, Math.round(v * rand(0.4, 0.75) / 16));
    this.genX += this.crumbleRow(this.genX, this.gy, w, 'step');
  },
  p_invis() {   // TROLL: a wall you can't see until you smack into it
    const L = 208, h = randi(22, 36);
    this.ground(this.genX, L, this.gy);
    this.add({ type: 'invis', x: this.genX + 112, y: this.gy - h, w: 8, h, revealed: false });
    this.genX += L;
  },
  p_pop(d) {    // TROLL: spikes shoot out of innocent-looking roof when you get close
    const L = 224, sw = 8 * randi(3, 4), sx = this.genX + 120;
    this.ground(this.genX, L, this.gy);
    this.spikes(sx, this.gy, sw, { pop: true, state: 0, t: 0, trigX: sx - lerp(92, 64, d) });
    this.genX += L;
  },
  p_fake(d) {   // TROLL: a piece of roof that isn't really there
    const pre = 96;
    this.ground(this.genX, pre, this.gy);
    const x = this.genX + pre;
    if (d > 0.35 && chance(0.5)) this.spikes(x - 40, this.gy, 24);   // ...right where you land after the spikes
    const fw = randi(44, 64);
    this.add({ type: 'fake', x, y: this.gy, w: fw, h: H + 60 - this.gy, state: 0 });
    this.genX = x + fw;
  },
  p_ledge(d, v) {   // TROLL: the edge of the roof collapses as you approach, the gap grows
    const pre = 96;
    this.ground(this.genX, pre, this.gy);
    const x0 = this.genX + pre;
    const cw = this.crumbleRow(x0, this.gy, 48, 'near', { trigX: x0 - 72, deep: true });
    this.genX = x0 + cw + Math.round(v * rand(0.18, 0.26));
  },
  p_popgap(d, v) {  // TROLL: spikes pop up on your landing spot while you're mid-air
    const gap = Math.round(v * rand(0.24, 0.3)), x0 = this.genX;
    this.genX += gap;
    const L = 192;
    this.ground(this.genX, L, this.gy);
    this.spikes(this.genX + 6, this.gy, 40, { pop: true, state: 0, t: 0, trigX: x0 + 12 });
    this.genX += L;
  },
  p_mover(d, v) {
    const side = Math.round(v * rand(0.22, 0.3)), mw = 48;
    const horizontal = d > 0.45 && chance(0.4);
    const bx = this.genX + side, by = this.gy - 20;
    const phase = rand(0, Math.PI * 2);
    this.add({ type: 'mover', x: bx, y: by, w: mw, h: 8, bx, by, ax: horizontal ? side * 0.5 : 0, ay: horizontal ? 0 : 22,
               period: rand(1.6, 2.4), phase, dx: 0, dy: 0 });
    this.genX += side * 2 + mw;
  },
  p_spikebed() {
    const S = 8 * randi(13, 19), L = 48 + S + 48;
    this.ground(this.genX, L, this.gy);
    this.spikes(this.genX + 48, this.gy, S);
    const n = S > 128 ? 2 : 1;
    for (let i = 1; i <= n; i++) {
      const cx = this.genX + 48 + S * i / (n + 1);
      this.add({ type: 'plat', x: Math.round(cx - 26), y: this.gy - randi(36, 48), w: 52, h: 8 });
    }
    this.genX += L;
  },

  // --- per-step updates: moving platforms, crumbling tiles, pop-up spikes --
  update(dt) {
    const p = run.player;
    this.updateMovers(run.time);
    for (const s of this.solids) {
      if (s.type === 'crumble') {
        if (s.state === 0 && s.trig === 'near' && p.x + p.w >= s.trigX) {
          s.state = 1; s.t = s.delay;
          if (!this.seen['g' + s.group]) { this.seen['g' + s.group] = true; trollText('NOPE!', 'ledge'); }
        }
        if (s.state === 1) {
          s.t -= dt;
          if (s.t <= 0) { s.state = 2; sfx('crumble'); burst(s.x + 8, s.y + 2, 6, '#3b3152', { speed: 80 }); }
        } else if (s.state === 2) { s.vy += PHYS.gravity * dt; s.y += s.vy * dt; }
      }
    }
    for (const z of this.hazards) {
      if (!z.pop) continue;
      if (z.state === 0 && p.x + p.w >= z.trigX) { z.state = 1; z.t = 0.1; sfx('popWarn'); }
      else if (z.state === 1) { z.t -= dt; if (z.t <= 0) { z.state = 2; z.t = 0; sfx('pop'); if (!z.catTrap) trollText('SURPRISE!', 'pop'); } }
      else if (z.state === 2) z.t += dt;
    }
  },
};

/* --------------------------------------------------------------------------
   8. PLAYER
   Auto-runs right. Jump, double jump, wall-jump (kick off walls), slide.
   -------------------------------------------------------------------------- */
const P_H = 19, P_SLIDE_H = 10;
function makePlayer() {
  return { x: 60, y: Level.gy - P_H, w: 8, h: P_H, vx: RUN.baseSpeed, vy: 0, onGround: true, ground: null,
           jumpsLeft: 1, coyote: 0, jumpBuf: 0, slideReq: 0, sliding: false, slideT: 0, fastFall: false, slideOnLand: false,
           touchWall: false, wjCool: 0, invuln: 0, noCut: 0, stunT: 0, shield: false, hangT: 0, dead: false, deathY: 0, anim: 0, blocked: false };
}
function playerSpeed() {
  return RUN.baseSpeed * Math.min(RUN.maxSpeedMul, 1 + run.time * RUN.speedGrowth) * (run.boostT > 0 ? RUN.boostMul : 1);
}
// Is the rectangle free of full solids? (used for standing up under a bar, ledge assist)
function rectFree(x, y, w, h) {
  const r = { x, y, w, h };
  for (const s of Level.solids) if (isFull(s) && overlaps(r, s)) return false;
  return true;
}
function startSlide(p) {
  if (p.sliding) return;
  p.sliding = true; p.slideT = PHYS.slideTime; p.y += P_H - P_SLIDE_H; p.h = P_SLIDE_H;
  sfx('slide'); burst(p.x + 2, p.y + p.h, 5, '#6d5f92', { speed: 50, vy: -30 });
}
function canStand(p) { return rectFree(p.x, p.y + p.h - P_H, p.w, P_H); }
function stopSlide(p) { p.sliding = false; p.y -= P_H - P_SLIDE_H; p.h = P_H; }
function groundJump(p) {
  p.vy = -PHYS.jump; p.onGround = false; p.coyote = 0; p.jumpBuf = 0; p.jumpsLeft = 1; p.fastFall = false;
  sfx('jump'); burst(p.x + 4, p.y + p.h, 4, '#6d5f92', { speed: 40 });
}
function land(p, s) { p.y = s.y - p.h; p.vy = 0; p.onGround = true; p.ground = s; }

function updatePlayer(dt) {
  const p = run.player;
  p.anim += dt;
  p.jumpBuf -= dt; p.slideReq -= dt; p.coyote -= dt; p.wjCool -= dt; p.invuln -= dt; p.noCut -= dt; p.stunT -= dt;
  while (Input.jumpQ > 0) { Input.jumpQ--; p.jumpBuf = PHYS.jumpBuffer; }
  let released = false;
  while (Input.releaseQ > 0) { Input.releaseQ--; released = true; }
  while (Input.slideQ > 0) { Input.slideQ--; p.slideReq = 0.2; }

  // Cartoon moment after a fake floor vanishes: hang in mid-air, look down... then fall.
  if (p.hangT > 0) {
    p.hangT -= dt;
    if (p.jumpBuf > 0) { p.hangT = 0; groundJump(p); }
    else { if (p.hangT <= 0) p.vy = 60; return; }
  }

  // ride moving platforms
  if (p.onGround && p.ground && p.ground.type === 'mover') { p.x += p.ground.dx; p.y += p.ground.dy; }

  // slide (on ground) / slam down (in air, then slide on landing)
  if (p.slideReq > 0) {
    if (p.onGround && !p.sliding) { startSlide(p); p.slideReq = 0; }
    else if (!p.onGround && !p.fastFall) { p.fastFall = true; p.slideOnLand = true; }
  }
  if (p.sliding) { p.slideT -= dt; if (p.slideT <= 0 && canStand(p)) stopSlide(p); }

  // jump / wall-jump / double jump
  if (p.jumpBuf > 0) {
    if (p.onGround || p.coyote > 0) {
      if (!p.sliding || canStand(p)) { if (p.sliding) stopSlide(p); groundJump(p); }
    } else if (p.touchWall && p.wjCool <= 0) {
      p.vy = -PHYS.wallJump; p.vx = -110; p.jumpsLeft = 1; p.wjCool = 0.16; p.jumpBuf = 0; p.fastFall = false;
      sfx('wall'); burst(p.x + p.w, p.y + 10, 5, '#cfc4ee', { speed: 60 });
    } else if (p.jumpsLeft > 0) {
      p.vy = -PHYS.doubleJump; p.jumpsLeft--; p.jumpBuf = 0; p.fastFall = false; p.slideOnLand = false;
      sfx('djump'); ring(p.x + 4, p.y + p.h, '#cfc4ee');
    }
  }
  if (released && p.vy < -200 && !(p.noCut > 0)) p.vy *= 0.6;   // shorter hop when the jump is released early

  // auto-run + gravity
  const target = p.stunT > 0 ? 0 : playerSpeed();     // the cat's roar stops you in your tracks
  p.vx += (target - p.vx) * Math.min(1, dt * 9);
  p.vy = Math.min(p.vy + PHYS.gravity * dt, PHYS.maxFall);
  if (p.fastFall) p.vy = Math.max(p.vy, PHYS.fastFall);
  if (p.touchWall && !p.onGround && p.vy > PHYS.wallSlide) p.vy = PHYS.wallSlide;

  const near = Level.solids.filter(s => s.x < p.x + 80 && s.x + s.w > p.x - 80);

  // --- X axis
  p.x += p.vx * dt;
  let blocked = false;
  for (const s of near) {
    if (!isFull(s) || !overlaps(p, s)) continue;
    if (p.vx > 0) {
      // ledge assist: if only the toes clip a corner, step up onto it
      if (p.y + p.h - s.y <= 5 && p.vy >= 0 && s.type !== 'bar' && rectFree(p.x, s.y - p.h, p.w, p.h)) { p.y = s.y - p.h; continue; }
      p.x = s.x - p.w; blocked = true;
      if (s.type === 'invis' && !s.revealed) { s.revealed = true; trollText('?!', 'invis'); }
    } else if (p.vx < 0) p.x = s.x + s.w;
  }
  p.touchWall = blocked && !p.onGround;
  if (blocked) {
    if (!p.blocked && p.vx > 100) { sfx('bonk'); burst(p.x + p.w, p.y + 4, 4, '#ffd23f', { speed: 50 }); }
    p.vx = 0;
  }
  p.blocked = blocked;

  // --- Y axis
  const wasGround = p.onGround, prevBottom = p.y + p.h, prevTop = p.y;
  p.y += p.vy * dt;
  p.onGround = false; p.ground = null;
  for (const s of near) {
    if (isFull(s)) {
      if (!overlaps(p, s)) continue;
      if (p.vy >= 0 && prevBottom <= s.y + 2) land(p, s);
      else if (p.vy < 0 && prevTop >= s.y + s.h - 2) { p.y = s.y + s.h; p.vy = 0; }
    } else if (isOneWay(s)) {
      if (p.vy >= 0 && prevBottom <= s.y + 3 && p.y + p.h >= s.y && p.x + p.w > s.x && p.x < s.x + s.w) land(p, s);
    }
  }

  if (p.onGround) {
    p.jumpsLeft = 1; p.coyote = PHYS.coyote;
    if (!wasGround) {
      if (p.vy >= 0) burst(p.x + 4, p.y + p.h, 3, '#6d5f92', { speed: 30 });
      sfx('land');
      if (p.slideOnLand) startSlide(p);
      p.fastFall = false; p.slideOnLand = false;
    }
    const g = p.ground;
    if (g.type === 'crumble' && g.state === 0 && g.trig === 'step') { g.state = 1; g.t = g.delay; }
    if (g.type === 'fake' && g.state === 0) {
      g.state = 2; p.onGround = false; p.vy = 0; p.hangT = 0.42;
      if (p.sliding && canStand(p)) stopSlide(p);
      trollText('LOL', 'fake');
      for (let i = 0; i < g.w; i += 8) burst(g.x + i, g.y + 2, 2, '#2a2340', { speed: 40 });
    }
  }

  // --- hazards
  if (p.invuln <= 0) {
    const hb = { x: p.x + 1, y: p.y + 1, w: p.w - 2, h: p.h - 1 };
    for (const z of Level.hazards) {
      if (z.x > p.x + 20 || z.x + z.w < p.x - 20) continue;
      if (z.pop && !(z.state === 2 && z.t > 0.02)) continue;
      if (overlaps(hb, { x: z.x + 2, y: z.y - 6, w: z.w - 4, h: 6 })) { trapHit(z.catTrap ? 'cattrap' : z.pop ? 'pop' : 'spike'); break; }
    }
  }
  if (p.y > H + 24) {
    const recent = run.time - run.trollAt < 2.5;
    trapHit(recent && (run.lastTroll === 'fake' || run.lastTroll === 'ledge') ? run.lastTroll : 'pit');
  }
}

function playerPose(p) {
  if (p.dead || p.stunT > 0) return 'scared';
  if (p.hangT > 0) return 'hang';
  if (p.sliding) return 'slide';
  if (!p.onGround) return p.touchWall ? 'wall' : (p.vy < 0 ? 'jump' : 'fall');
  if (p.blocked) return 'stand';
  return Math.floor(p.anim * 12) % 2 ? 'run1' : 'run2';
}

/* --------------------------------------------------------------------------
   9. CAT AI
   She runs at her own (ever increasing) speed, follows the roof line with
   cartoon physics (she never falls into pits) and rubber-bands at the screen
   edge so the threat is always right behind you.
   -------------------------------------------------------------------------- */
function makeCat() { return { x: 60 - RUN.startGap, y: Level.gy, vy: 0, onGround: true, floor: Level.gy, anim: 0, rageT: 0, pounceT: 0, sprintT: 0 }; }
function catMult() { return Math.pow(1 + run.gain, run.anger); }
function catSpeed() { return RUN.baseSpeed * RUN.catRatio * catMult(); }

// highest surface the cat could stand on between x0 and x1
function catTopAt(x0, x1) {
  let best = null;
  for (const s of Level.solids) {
    if (s.x >= x1 || s.x + s.w <= x0 || s.type === 'bar') continue;
    if (s.type === 'crumble' && s.state >= 2) continue;
    if (s.type === 'fake' && s.state !== 0) continue;
    if (best === null || s.y < best) best = s.y;
  }
  return best;
}
function nextSolidX(x) {
  let nx = Infinity;
  for (const s of Level.solids) if (s.x > x && s.x < nx && s.type !== 'bar') nx = s.x;
  return nx;
}

function updateCat(dt) {
  const c = run.cat, p = run.player;
  c.anim += dt; c.rageT -= dt;
  if (run.phase === 'dying') {                                    // pounce on the victim
    c.x = Math.min(p.x - 2, c.x + 340 * dt);
    c.y += ((p.y + p.h) - c.y) * Math.min(1, dt * 7);
    return;
  }
  if (run.phase !== 'play') return;
  const frozen = run.frozenT > 0;
  c.pounceT -= dt; c.sprintT -= dt;
  // multiplayer: a human cat can pounce (short lunge) and sprint on top of her normal speed
  const spd = frozen ? 0 : catSpeed() * (c.pounceT > 0 ? 2.6 : 1) * (c.sprintT > 0 ? 1.6 : 1);
  c.x += spd * dt;
  const gap = p.x - c.x;
  if (!frozen && gap > RUN.maxGap) c.x += (gap - RUN.maxGap) * Math.min(1, dt * 6);   // rubber band
  if (run.tutorial) {                          // tutorial: she can come close, but never catches you
    const demo = run.tut.info && run.tut.info.demo;
    if (demo) c.x += (p.x - 30 - c.x) * Math.min(1, dt * 2.5);
    c.x = Math.min(c.x, p.x - (demo ? 30 : 75));
  }
  if (frozen) return;

  const under = catTopAt(c.x - 40, c.x - 4);
  if (under !== null) c.floor = under;
  if (c.onGround) {
    const ahead = catTopAt(c.x, c.x + 12);
    if (ahead === null) {                       // pit ahead: leap across it
      const w = Math.min(400, nextSolidX(c.x) - c.x);
      const air = (w + 30) / Math.max(spd, 80);
      c.vy = -Math.min(480, PHYS.gravity * air / 2); c.onGround = false;   // cartoon physics keeps her up anyway
    } else if (ahead < c.y - 3) {               // wall ahead: jump onto it
      c.vy = -Math.sqrt(2 * PHYS.gravity * (c.y - ahead + 8)); c.onGround = false;
    }
  }
  const prevY = c.y;
  c.vy += PHYS.gravity * dt;
  c.y += c.vy * dt;
  if (c.vy >= 0 && c.y >= c.floor && (prevY <= c.floor + 6 || c.y > c.floor + 6)) { c.y = c.floor; c.vy = 0; c.onGround = true; }
  else c.onGround = false;
}

/* --------------------------------------------------------------------------
   10. RUN — one chase from start to "She got you!"
   -------------------------------------------------------------------------- */
const DEATH_LINES = {
  caught: ['SHE WANTS HER MOUSE BACK.', 'NINE LIVES. YOU HAVE ONE.', 'SHOULD HAVE LEFT THE MOUSE ALONE.', 'SHE WAS NOT JOKING.'],
  spike: ['THE SPIKES HELPED.', 'THE ROOF HAD TEETH.'],
  pop: ["DIDN'T SEE THAT COMING, DID YOU?"],
  pit: ['GRAVITY HELPED.', 'THAT WAS A LONG WAY DOWN.'],
  fake: ['THAT ROOF WAS A LIE.'],
  ledge: ['THE ROOF LEFT BEFORE YOU DID.'],
  cattrap: ['SHE SET A TRAP. YOU FELL FOR IT.'],
};

// Multiplayer: everything is unlocked, limited only by cooldowns (seconds).
const MP_ESCAPE = 60;     // thief vs cat: survive this long and the thief wins
const MP_THIEF = [
  { id: 'freeze', cd: 20, st: { dur: 3 } },
  { id: 'boost', cd: 10, st: { dur: 2 } },
  { id: 'shield', cd: 20, st: {} },
];
const CAT_MOVES = [
  { id: 'pounce', name: 'POUNCE', icon: 'paw', color: '#ff9ab8', cd: 2.5, key: 'SPC' },
  { id: 'sprint', name: 'SPRINT', icon: 'boost', color: '#ffd23f', cd: 8, key: '1' },
  { id: 'trap', name: 'TRAP', icon: 'trap', color: '#ff5a5a', cd: 9, key: '2' },
  { id: 'roar', name: 'ROAR', icon: 'roar', color: '#ff5a5a', cd: 15, key: '3' },
];

function newRun(opts = {}) {
  const gainTier = tierOf('slow');
  const mp = !!opts.mp;
  run = {
    tutorial: !!opts.tutorial, tut: null, ui: {},
    mp, view: !!opts.view, race: !!opts.race, countdown: mp ? 3.5 : 0, netLost: false, leaveArm: 0, won: false,
    buf: [], ghost: { buf: [], done: false, time: 0 },   // multiplayer: friend's positions waiting to be drawn
    catAbil: CAT_MOVES.map(m => ({ id: m.id, cd: 0, cdMax: m.cd })), catCd: CAT_MOVES.map(() => 0),
    time: 0, points: 0, pointT: 0, anger: 0, phase: 'play', paused: false, deathT: 0, overT: 0, cause: '', line: '',
    camX: 0, shake: 0, flash: 0, flashColor: '#ff2020', danger: 0, beatT: 0, fadeT: 0.5, startT: 1.2,
    particles: [], popups: [], banner: null, hudRects: [], newBest: false, trollAt: -99, lastTroll: '',
    frozenT: 0, boostT: 0, doubleT: 0, hintT: 6,
    gain: Save.data.equipped.includes('slow') && gainTier > 0 ? ABIL.slow.stat(gainTier).gain : RUN.angerGain,
    abil: Save.data.equipped.filter(id => tierOf(id) > 0).map(id => {
      const def = ABIL[id], st = def.stat(tierOf(id));
      return { id, def, st, uses: st.uses || 0 };
    }),
  };
  if (mp) {
    run.gain = RUN.angerGain; run.hintT = 0;
    run.abil = MP_THIEF.map(m => ({ id: m.id, def: ABIL[m.id], st: m.st, uses: Infinity, cd: 0, cdMax: m.cd }));
    Level.outbox = []; Level.nextId = 0;
  }
  Level.rng = opts.seed !== undefined ? mulberry32(opts.seed) : null;
  if (run.view) { Level.solids = []; Level.hazards = []; Net.byId.clear(); }   // the friend's device sends the level
  else Level.reset();
  if (run.tutorial) { run.tut = { steps: Tutorial.build(), idx: 0, cp: 60, info: null, freeze: null, freezeT: 0, nudge: 0 }; run.hintT = 0; }
  run.player = makePlayer();
  run.cat = makeCat();
  run.camX = run.player.x - W * 0.36;
  if (!run.view) Level.ensure(run.camX + W + 200);
  Input.clear();
  Music.bpmBoost = 0;
}
function startRun(opts) {
  newRun(opts);
  state = 'run'; UI.focus = 0;
  Music.stop(); Music.play('chase');
  sfx('go');
}
const startTutorial = () => startRun({ tutorial: true });
function finishTutorial() {
  Save.data.tutorialDone = true; Save.save();
  startRun();
}
function setPaused(v) {
  if (!run || run.phase !== 'play' || run.mp) return;   // no pausing a game with a friend
  run.paused = v; UI.focus = 0;
  Input.clear();
  if (v) Music.stop(); else Music.play('chase');
}

// --- effects ---------------------------------------------------------------
function burst(x, y, n, color, o = {}) {
  if (!run) return;
  if (netEmit()) Net.ev.push(['b', Math.round(x), Math.round(y), n, color, o]);
  const sp = o.speed || 60;
  for (let i = 0; i < n; i++) {
    run.particles.push({ x, y, vx: rand(-1, 1) * sp, vy: rand(-1, 0.3) * sp + (o.vy || 0), life: rand(0.3, 0.7), max: 0.7,
                         color, g: o.g ?? 500, s: o.s || (chance(0.3) ? 2 : 1) });
  }
}
function ring(x, y, color) {
  if (netEmit()) Net.ev.push(['r', Math.round(x), Math.round(y), color]);
  for (let i = 0; i < 10; i++) {
    const a = i / 10 * Math.PI * 2;
    run.particles.push({ x, y, vx: Math.cos(a) * 70, vy: Math.sin(a) * 30, life: 0.3, max: 0.3, color, g: 0, s: 1 });
  }
}
function popup(text, x, y, color = '#fff', size = 2, o = {}) {
  if (netEmit()) Net.ev.push(['p', text, Math.round(x), Math.round(y), color, size, o]);
  run.popups.push({ text, x, y, vy: o.vy ?? -30, life: o.life ?? 0.9, max: o.life ?? 0.9, color, size, world: o.world ?? true });
}
function trollText(text, kind) {
  const p = run.player;
  popup(text, p.x + 4, p.y - 14, '#ff5a5a', 2, { life: 1.1, vy: -20 });
  sfx('troll');
  run.trollAt = run.time; run.lastTroll = kind; run.shake = Math.max(run.shake, 2);
}
function updateFx(dt) {
  const R = run;
  for (const q of R.particles) { q.vy += q.g * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt; }
  R.particles = R.particles.filter(q => q.life > 0);
  for (const q of R.popups) { q.y += q.vy * dt; q.vy *= 0.97; q.life -= dt; }
  R.popups = R.popups.filter(q => q.life > 0);
}

// --- abilities ---------------------------------------------------------------
function useAbility(i) {
  const a = run.abil[i];
  if (!a || !playing()) return;
  const p = run.player;
  if (a.def.passive) { popup('PASSIVE', p.x + 4, p.y - 12, a.def.color, 1); return; }
  if (run.countdown > 0) return;
  if (a.cd > 0) { sfx('deny'); return; }
  if (a.uses <= 0) { sfx('deny'); popup('NONE LEFT', p.x + 4, p.y - 12, '#aaa', 1); return; }
  switch (a.id) {
    case 'freeze':
      if (run.frozenT > 0) return;
      run.frozenT = a.st.dur; sfx('freeze');
      popup('FROZEN!', run.cat.x - 20, run.cat.y - 44, a.def.color, 2);
      burst(run.cat.x - 20, run.cat.y - 18, 16, '#bff3ff', { speed: 90, g: 100 });
      break;
    case 'boost':
      if (run.boostT > 0) return;
      run.boostT = a.st.dur; sfx('boost'); popup('ZOOM!', p.x + 4, p.y - 12, a.def.color, 2);
      break;
    case 'shield':
      if (p.shield) return;
      p.shield = true; sfx('shield'); popup('SHIELD UP', p.x + 4, p.y - 12, a.def.color, 1);
      break;
    case 'double':
      if (run.doubleT > 0) return;
      run.doubleT = a.st.dur; sfx('double'); popup('2X POINTS!', p.x + 4, p.y - 12, a.def.color, 2);
      break;
  }
  if (run.mp) a.cd = a.cdMax; else a.uses--;
}

// Multiplayer: the cat player's moves, applied on the thief's device (which runs the game).
function catMove(id) {
  const R = run;
  if (!R || !R.mp || R.view || R.phase !== 'play' || R.countdown > 0) return;
  const m = R.catAbil.find(a => a.id === id), c = R.cat, p = R.player;
  if (!m || m.cd > 0) return;
  if (R.frozenT > 0) { popup('FROZEN!', c.x - 20, c.y - 44, '#bff3ff', 1); return; }
  switch (id) {
    case 'pounce':
      c.pounceT = 0.35;
      if (c.onGround) { c.vy = -320; c.onGround = false; }
      sfx('pounce');
      break;
    case 'sprint':
      c.sprintT = 1.5; sfx('boost');
      popup('SPRINT!', c.x - 20, c.y - 44, '#ffd23f', 1);
      break;
    case 'trap': {
      // pop spikes out of the roof a little ahead of the thief (with a fair warning)
      let spot = null;
      for (let tryX = p.x + 120; tryX < p.x + 220 && !spot; tryX += 16) {
        const x0 = Math.round(tryX / 8) * 8;
        const s = Level.solids.find(s => (s.type === 'ground' || s.type === 'block') && s.x <= x0 && s.x + s.w >= x0 + 24);
        if (s && !Level.hazards.some(z => z.x < x0 + 32 && z.x + z.w > x0 - 8 && Math.abs(z.y - s.y) < 4)) spot = { x: x0, y: s.y };
      }
      if (!spot) return;                       // nowhere to put it: no cooldown spent
      Level.spikes(spot.x, spot.y, 24, { pop: true, catTrap: true, state: 1, t: 0.45, trigX: -1e9 });
      sfx('popWarn');
      popup('TRAP!', spot.x + 12, spot.y - 14, '#ff5a5a', 1);
      break;
    }
    case 'roar':
      p.stunT = 0.6; R.shake = 5; sfx('roar');
      popup('ROAAAR!', c.x - 20, c.y - 46, '#ff5a5a', 2);
      popup('!!', p.x + 4, p.y - 14, '#fff', 2);
      c.rageT = 0.8;
      break;
  }
  m.cd = m.cdMax;
}
function abilityActive(a) {
  switch (a.id) {
    case 'freeze': return run.frozenT / a.st.dur;
    case 'boost': return run.boostT / a.st.dur;
    case 'double': return run.doubleT / a.st.dur;
    case 'shield': return run.player.shield ? 1 : 0;
    default: return 0;
  }
}

// --- traps, death, end of run -----------------------------------------------
function rescueFromPit(p) {
  let target = null;
  for (const s of Level.solids) {
    if (s.type === 'bar' || !(isFull(s) || isOneWay(s))) continue;
    if (s.x + s.w > p.x && s.x < p.x + 220 && (target === null || s.x < target.x)) target = s;
  }
  const top = target ? target.y : Level.gy;
  p.y = H + 4;
  p.vy = -Math.sqrt(2 * PHYS.gravity * (p.y - top + 40));
  p.jumpsLeft = 1; p.fastFall = false; p.slideOnLand = false;
  if (p.sliding) { p.sliding = false; p.h = P_H; }
}
function trapHit(cause) {
  const p = run.player;
  if (run.phase !== 'play') return;
  if (run.tutorial) { Tutorial.respawn(); return; }
  if (p.shield) {
    p.shield = false; p.invuln = 1.2;
    sfx('shieldPop'); ring(p.x + 4, p.y + 9, '#58e0a0'); ring(p.x + 4, p.y + 9, '#d8fff0');
    popup('SAVED!', p.x + 4, Math.min(p.y, H - 30) - 12, '#58e0a0', 2);
    if (cause === 'pit' || cause === 'fake' || cause === 'ledge') rescueFromPit(p);
    else { p.vy = -380; p.jumpsLeft = 1; p.onGround = false; }
    return;
  }
  killPlayer(cause);
}
function killPlayer(cause) {
  if (run.phase !== 'play') return;
  const p = run.player;
  run.phase = 'dying'; run.deathT = 0; run.cause = cause; run.line = pick(DEATH_LINES[cause] || DEATH_LINES.caught);
  p.dead = true;
  if (p.sliding) stopSlide(p);
  run.deathPit = cause === 'pit' || cause === 'fake' || cause === 'ledge';
  if (run.deathPit) { p.y = H - p.h - 2; p.vy = 0; } else p.vy = -280;
  p.deathY = p.y;
  sfx('hit'); if (cause === 'caught') sfx('scream');
  run.shake = 7; run.flash = 0.3; run.flashColor = '#ff2020';
  burst(p.x + 4, Math.min(p.y + 8, H - 6), 18, '#ff4040', { speed: 120 });
  Music.stop();
  Input.clear();
}
// Multiplayer round won without getting caught: the thief escaped (vs cat) or outlasted the friend (race).
function endMpRound(cause, line) {
  const R = run;
  R.phase = 'over'; R.overT = 0; R.cause = cause; R.line = line; R.won = true;
  if (R.race) Net.send({ t: 'done', r: Net.round, tm: R.time });
  Music.stop(); sfx('buy'); UI.focus = 0;
}
function finishRun() {
  const R = run, d = Save.data;
  R.phase = 'over'; R.overT = 0;
  if (R.race) Net.send({ t: 'done', r: Net.round, tm: R.time });
  if (R.mp) { sfx('gameover'); UI.focus = 0; return; }   // friendly matches don't touch your records
  d.runs++;
  R.newBest = R.time > d.bestTime;
  if (R.newBest) d.bestTime = R.time;
  if (R.points > d.bestPoints) d.bestPoints = R.points;
  Save.save();
  sfx('gameover');
  UI.focus = 0;
}
function angerEvent() {
  const R = run;
  R.banner = { text: "SHE'S GETTING ANGRIER!", sub: 'CAT SPEED X' + catMult().toFixed(2), t: 2.6, max: 2.6 };
  R.shake = 5; R.flash = 0.25; R.flashColor = '#ff2020';
  R.cat.rageT = 1.4;
  Music.bpmBoost = Math.min(42, R.anger * 7);
  sfx('alarm'); sfx('scream');
}

function updateCamera(dt) {
  const target = run.player.x - W * 0.36;
  run.camX += (target - run.camX) * Math.min(1, dt * 10);
}

function updateRun(dt) {
  const R = run, p = R.player;
  R.shake = Math.max(0, R.shake - dt * 12);
  R.flash = Math.max(0, R.flash - dt);
  R.fadeT = Math.max(0, R.fadeT - dt);
  R.startT = Math.max(0, R.startT - dt);
  updateFx(dt);
  if (R.banner && (R.banner.t -= dt) <= 0) R.banner = null;

  if (R.phase === 'over') { R.overT += dt; return; }
  if (R.phase === 'dying') {
    R.deathT += dt;
    if (!R.deathPit) { p.vy += PHYS.gravity * dt; p.y = Math.min(p.deathY, p.y + p.vy * dt); }
    updateCat(dt);
    updateCamera(dt);
    if (R.deathT > 1.5) finishRun();
    return;
  }

  // --- playing
  if (R.countdown > 0) {                        // multiplayer: 3, 2, 1, GO!
    const before = Math.ceil(R.countdown);
    R.countdown -= dt;
    if (R.countdown <= 0) { sfx('go'); R.startT = 0.8; } else if (Math.ceil(R.countdown) !== before) sfx('beep');
    updateCamera(dt);
    return;
  }
  R.time += dt;
  if (R.mp && !R.race && R.time >= MP_ESCAPE) return endMpRound('escaped', 'HE GOT AWAY WITH THE MOUSE.');
  if (R.race && R.ghost.done && R.time > R.ghost.time + 1) return endMpRound('won', 'YOU OUTLASTED YOUR FRIEND!');
  for (const a of R.abil) if (a.cd > 0) a.cd = Math.max(0, a.cd - dt);
  for (const m of R.catAbil) if (m.cd > 0) m.cd = Math.max(0, m.cd - dt);
  const lvl = Math.floor(R.time / RUN.angerEvery);
  if (lvl > R.anger && !R.tutorial) { R.anger = lvl; angerEvent(); }
  if (R.tutorial && Tutorial.update(dt)) return;   // finished: a real run just started

  if (!R.tutorial && !R.mp) R.pointT += dt;
  if (R.pointT >= RUN.pointEvery) {
    R.pointT -= RUN.pointEvery;
    const g = R.doubleT > 0 ? 2 : 1;
    R.points += g; Save.data.points += g; Save.data.totalEarned += g; Save.save();
    popup('+' + g, p.x + 4, p.y - 10, PAL.gold, 2, { vy: -40 });
    sfx('point');
  }

  const wasFrozen = R.frozenT > 0;
  R.frozenT = Math.max(0, R.frozenT - dt);
  if (wasFrozen && R.frozenT === 0) { sfx('thaw'); popup("SHE'S FREE!", R.cat.x - 20, R.cat.y - 44, '#ff6b6b', 1); }
  R.boostT = Math.max(0, R.boostT - dt);
  R.doubleT = Math.max(0, R.doubleT - dt);
  R.hintT -= dt;
  if (R.boostT > 0 && chance(0.5)) R.particles.push({ x: p.x - 2, y: p.y + rand(2, p.h - 2), vx: -120, vy: 0, life: 0.25, max: 0.25, color: '#ffd23f', g: 0, s: 1 });

  Level.update(dt);
  updatePlayer(dt);
  updateCat(dt);

  const gap = p.x - R.cat.x;
  R.danger = clamp(1 - (gap - RUN.catchGap) / (RUN.maxGap - RUN.catchGap), 0, 1);
  if (R.phase === 'play' && gap <= RUN.catchGap) killPlayer('caught');
  if (R.phase === 'play' && R.danger > 0.75 && (R.beatT -= dt) <= 0) { R.beatT = 0.55; sfx('heartbeat'); }

  updateCamera(dt);
  Level.ensure(R.camX + W + 200);
  Level.prune(Math.min(R.camX, R.cat.x - 70) - 100);
}

// --- drawing the chase -------------------------------------------------------
function drawSkyline(camX, par, bw, minH, maxH, baseY, color, seed, windows) {
  const off = camX * par;
  const i0 = Math.floor(off / bw) - 1, i1 = i0 + Math.ceil(W / bw) + 2;
  ctx.fillStyle = color;
  for (let i = i0; i <= i1; i++) {
    const h = Math.round(minH + hash(i * 31 + seed) * (maxH - minH));
    const x = Math.round(i * bw - off), w = bw - (hash(i * 17 + seed) > 0.7 ? 6 : 0);
    ctx.fillRect(x, baseY - h, w, H - baseY + h);
    if (hash(i * 7 + seed) > 0.55) ctx.fillRect(x + 6, baseY - h - 8, 5, 8);           // chimney
    if (hash(i * 5 + seed) > 0.8) ctx.fillRect(x + w - 8, baseY - h - 14, 1, 14);      // antenna
  }
  if (!windows) return;
  ctx.fillStyle = PAL.window;
  for (let i = i0; i <= i1; i++) {
    const h = Math.round(minH + hash(i * 31 + seed) * (maxH - minH));
    const x = Math.round(i * bw - off), w = bw - (hash(i * 17 + seed) > 0.7 ? 6 : 0);
    for (let wy = baseY - h + 6; wy < baseY + 10; wy += 9) for (let wx = x + 4; wx < x + w - 4; wx += 7) {
      if (hash(i * 13 + wy * 7 + wx) > 0.86) ctx.fillRect(wx, wy, 3, 4);
    }
  }
}
function drawChaseBG(camX) {
  ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, W, H);

    const sx = ((hash(i) * W * 3 - camX * 0.03) % W + W) % W, sy = hash(i + 100) * 130;

    ctx.fillRect(Math.round(sx), Math.round(sy), 1, 1);

  ctx.fillStyle = '#f3e9c8';
  for (let y = -r; y <= r; y++) { const hw = Math.floor(Math.sqrt(r * r - y * y)); ctx.fillRect(mx - hw, my + y, hw * 2 + 1, 1); }
  ctx.fillStyle = '#d9cda4'; ctx.fillRect(mx - 5, my - 4, 4, 3); ctx.fillRect(mx + 3, my + 4, 3, 3); ctx.fillRect(mx - 2, my + 7, 2, 2);
  drawSkyline(camX, 0.15, 42, 50, 115, 205, PAL.far, 3, true);
  drawSkyline(camX, 0.4, 60, 25, 70, 225, PAL.mid, 11, false);
  ctx.fillStyle = 'rgba(13,11,19,0.55)'; ctx.fillRect(0, H - 24, W, 24);
}
function drawRoof(x, y, w, camX, cracked) {
  ctx.fillStyle = PAL.ground; ctx.fillRect(x, y, w, H - y);
  ctx.fillStyle = PAL.shingle;
  for (let yy = y + 6, row = 0; yy < H; yy += 7, row++) {
    ctx.fillRect(x, yy, w, 1);
    const off = (row % 2) * 6;
    for (let wx = Math.ceil((x + camX - off) / 12) * 12 + off; wx - camX < x + w; wx += 12) ctx.fillRect(Math.round(wx - camX), yy + 1, 1, 6);
  }
  ctx.fillStyle = PAL.rim; ctx.fillRect(x, y, w, 1);
  ctx.fillStyle = PAL.rimDark; ctx.fillRect(x, y + 1, w, 2);
  if (cracked) { ctx.fillStyle = '#3a3150'; ctx.fillRect(x + 5, y + 3, 1, 4); ctx.fillRect(x + 6, y + 6, 1, 3); }
}
function drawSolids(camX) {
  for (const s of Level.solids) {
    if (s.x - camX > W + 4 || s.x + s.w - camX < -4) continue;
    const x = Math.round(s.x - camX), y = Math.round(s.y), w = s.w;
    switch (s.type) {
      case 'ground': case 'fake':
        drawRoof(x, y, w, camX, false); break;
      case 'block': {
        ctx.fillStyle = PAL.brick; ctx.fillRect(x, y, w, s.h);
        ctx.fillStyle = PAL.brickLine;
        for (let yy = y + 5, r = 0; yy < y + s.h; yy += 5, r++) {
          ctx.fillRect(x, yy, w, 1);
          for (let xx = x + (r % 2 ? 4 : 0); xx < x + w; xx += 8) ctx.fillRect(xx, yy - 4, 1, 4);
        }
        ctx.fillStyle = PAL.rim; ctx.fillRect(x - 1, y, w + 2, 2);
        ctx.fillStyle = '#4a3e66'; ctx.fillRect(x, y + s.h - 2, w, 2);
        if (s.hint && run.time < 120) drawText('JUMP ON THE WALL!', x + w / 2, y - 16, '#fff', 1, 'center', '#000');
        break;
      }
      case 'bar': {      // hanging billboard: slide under it
        ctx.fillStyle = '#16121f'; ctx.fillRect(x, y, w, s.h);
        ctx.fillStyle = '#5d4f86'; ctx.fillRect(x, y, 1, s.h); ctx.fillRect(x + w - 1, y, 1, s.h);
        const by = y + s.h - 5;
        for (let xx = 0; xx < w; xx += 6) { ctx.fillStyle = (xx / 6) % 2 ? '#111' : '#f2c230'; ctx.fillRect(x + xx, by, Math.min(6, w - xx), 5); }
        drawText('↓', x + w / 2, by - 16, '#f2c230', 2, 'center');
        if (s.hint) drawText('SLIDE!', x + w / 2, by - 30, '#fff', 2, 'center', '#000');
        break;
      }
      case 'plat':
        ctx.fillStyle = '#3e3358'; ctx.fillRect(x, y, w, s.h);
        ctx.fillStyle = PAL.rim; ctx.fillRect(x, y, w, 1);
        ctx.fillStyle = '#2a2340'; ctx.fillRect(x + 3, y + s.h, 2, 4); ctx.fillRect(x + w - 5, y + s.h, 2, 4);
        break;
      case 'mover':
        ctx.fillStyle = 'rgba(200,190,240,0.12)';
        if (s.ay) ctx.fillRect(Math.round(s.bx - camX) + w / 2, Math.round(s.by - s.ay), 1, s.ay * 2 + 8);
        else ctx.fillRect(Math.round(s.bx - s.ax - camX), Math.round(s.by + 4), s.ax * 2 + w, 1);
        ctx.fillStyle = '#5e5384'; ctx.fillRect(x, y, w, s.h);
        ctx.fillStyle = '#d3c8f5'; ctx.fillRect(x, y, w, 1);
        ctx.fillStyle = '#2a2340'; for (let i = 4; i < w; i += 10) ctx.fillRect(x + i, y + 3, 2, 2);
        break;
      case 'crumble': {
        const jx = s.state === 1 ? (Math.floor(menuT * 60) % 2 ? 1 : -1) : 0;
        if (s.deep) { drawRoof(x + jx, y, w, camX, s.state > 0); break; }
        ctx.fillStyle = '#3b3152'; ctx.fillRect(x + jx, y, w - 1, s.h);
        ctx.fillStyle = '#a593d6'; ctx.fillRect(x + jx, y, w - 1, 1);
        ctx.fillStyle = '#1c1628'; ctx.fillRect(x + jx + 4, y + 2, 1, 3); ctx.fillRect(x + jx + 5, y + 4, 3, 1); ctx.fillRect(x + jx + 10, y + 1, 1, 4);
        break;
      }
      case 'invis':
        if (s.revealed) {
          ctx.globalAlpha = 0.45 + 0.25 * Math.sin(menuT * 10);
          ctx.fillStyle = '#ff5a5a';
          for (let yy = 0; yy < s.h; yy += 2) { ctx.fillRect(x, y + yy, 1, 1); ctx.fillRect(x + w - 1, y + yy, 1, 1); }
          for (let xx = 0; xx < w; xx += 2) { ctx.fillRect(x + xx, y, 1, 1); }
          ctx.globalAlpha = 1;
        }
        break;
    }
  }
}
function drawSpikeRow(x, y, w, rise) {
  for (let i = 0; i < w; i += 8) {
    for (let r = 0; r < 8; r++) {
      const yy = y - rise + r;
      if (yy >= y) break;
      const half = Math.floor(r / 2) + 1;
      ctx.fillStyle = PAL.spike; ctx.fillRect(x + i + 4 - half, yy, half, 1);
      ctx.fillStyle = PAL.spikeShade; ctx.fillRect(x + i + 4, yy, half, 1);
    }
  }
}
function drawHazards(camX) {
  for (const z of Level.hazards) {
    if (z.x - camX > W + 4 || z.x + z.w - camX < -4) continue;
    const x = Math.round(z.x - camX), y = Math.round(z.y);

}
// Multiplayer HUD buttons: the thief gets JUMP/SLIDE + abilities, the cat gets POUNCE + her moves.

function drawRun() {
  const R = run;
  let shakeAmt = R.shake;
  if (R.phase === 'play' && R.danger > 0.65) shakeAmt += (R.danger - 0.65) / 0.35 * 2.5;
  if (!Save.data.shake || R.paused) shakeAmt = 0;
  const sx = shakeAmt > 0.3 ? Math.round(rand(-1, 1) * shakeAmt) : 0, sy = shakeAmt > 0.3 ? Math.round(rand(-1, 1) * shakeAmt) : 0;
  const camX = R.camX;
  drawChaseBG(camX);
  ctx.save(); ctx.translate(sx, sy);
  drawSolids(camX);
  drawHazards(camX);
  drawParticles(camX);
  if (R.race) drawGhost(camX);
  if (R.phase === 'over') { drawRunPlayer(camX); drawRunCat(camX); }
  else { drawRunCat(camX); drawRunPlayer(camX); }
  drawPopups(camX);
  ctx.restore();

  if (R.danger > 0.3 && R.phase === 'play') {    // red glow creeping in from the cat's side
    const a = (R.danger - 0.3) / 0.7 * (0.4 + 0.15 * Math.sin(menuT * 10));
    for (let i = 0; i < 30; i++) { ctx.fillStyle = 'rgba(255,30,30,' + (a * (1 - i / 30)).toFixed(3) + ')'; ctx.fillRect(i * 2, 0, 2, H); }
  }
  if (R.frozenT > 0) { ctx.fillStyle = 'rgba(140,220,255,0.08)'; ctx.fillRect(0, 0, W, H); }
  if (R.flash > 0) { ctx.globalAlpha = R.flash * 1.2; ctx.fillStyle = R.flashColor; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (R.phase !== 'over') drawHUD();
  if (R.tutorial && !R.paused) Tutorial.draw(camX);
  drawBanner();
  if (R.mp && R.countdown > 0) {
    const cat = Net.role === 'cat';
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 56, W, 96);
    shakyText(String(Math.ceil(R.countdown)), W / 2, 64, '#fff', 6, 1);
    if (R.race) {
      drawText('RACE! SAME ROOFS, TWO THIEVES', W / 2, 104, '#7fe0a8', 2, 'center', '#000');
      drawText('YOUR FRIEND IS THE BLUE THIEF. WHOEVER SURVIVES LONGER WINS!', W / 2, 122, '#fff', 1, 'center', '#000');
    } else {
      drawText(cat ? 'YOU ARE THE CAT' : 'YOU ARE THE THIEF', W / 2, 104, cat ? '#ff6b6b' : PAL.gold, 2, 'center', '#000');
      drawText(cat ? (Input.touch ? 'CATCH HIM IN ' + MP_ESCAPE + 'S! TAP TO POUNCE. SPRINT, TRAP, ROAR.' : 'CATCH HIM IN ' + MP_ESCAPE + 'S!  SPACE: POUNCE  1: SPRINT  2: TRAP  3: ROAR')
                   : 'SURVIVE ' + MP_ESCAPE + ' SECONDS! FREEZE, BOOST AND SHIELD HELP.', W / 2, 122, '#fff', 1, 'center', '#000');
    }
  } else if (R.startT > 0 && R.phase === 'play' && !R.tutorial) {
    const k = 1.2 - R.startT;
    if (k > 0.1) shakyText(R.mp ? 'GO!' : 'RUN!', W / 2, 90, '#fff', 6, 1);
  }
  if (R.netLost) drawNetLost();
  else if (R.paused) drawPause();
