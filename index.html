<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Pixel Arcade: Mouse Thief, Pixel GP, Pixel Heist, Pixel Pong, Pixel Football, Pixel Hoops, Pixel Wings, Pixel Sky Run, Deep Catch, Pixel Skate, Pixel Ski and Pixel Box Fight. Pixel-art games to play alone or with a friend.">
<meta name="theme-color" content="#0d0b13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pixel Arcade">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Pixel Arcade</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0b13; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #screen { position: fixed; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
  #name, #search { position: fixed; display: none; box-sizing: border-box; text-align: center; text-transform: uppercase;
          font: bold 24px ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.2em;
          color: #111; background: #fbf9f3; border: 3px solid #111; border-radius: 0; outline: none; }
  #search { text-align: left; letter-spacing: 0.1em; padding: 0 0.4em; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<input id="search" maxlength="20" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" inputmode="search" enterkeyhint="search" placeholder="TYPE A GAME..." aria-label="Search games">
<input id="name" maxlength="10" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" inputmode="text" aria-label="Your name">
<script src="common.js"></script>
<script>
'use strict';
/* PIXEL ARCADE: the dashboard. Pick a game, set your name and avatar (all the games use them). */
const VERSION = '2.11.0';
const canvas = document.getElementById('screen');
const S = PX.makeScreen(canvas, { H: 240, minW: 400, maxW: 560 });
const ctx = S.ctx, H = S.H;
const UI = PX.makeUI(S, canvas);
const T = (str, x, y, color = '#fff', size = 1, align = 'left', shadow = null) => PX.drawText(ctx, str, x, y, color, size, align, shadow);
let profile = PX.Profile.load();
PX.Profile.save(profile);
let screen = 'home';                  // home | search | profile | remote | settings | gift
let draft = null;                     // the profile being edited
const nameInput = document.getElementById('name');
const searchInput = document.getElementById('search');
searchInput.addEventListener('input', () => { searchInput.value = searchInput.value.toUpperCase().replace(/[^A-Z0-9 ]/g, '').slice(0, 20); search.q = searchInput.value; scrollTo(0); pad.focus = 0; });
nameInput.addEventListener('input', () => { nameInput.value = nameInput.value.toUpperCase().replace(/[^A-Z0-9 ]/g, '').slice(0, 10); });
window.addEventListener('keydown', e => {
  if (e.target === nameInput) { if (e.key === 'Enter') saveProfile(); else if (e.key === 'Escape') { nameInput.blur(); screen = 'home'; } return; }
  if (e.target === searchInput) { if (e.key === 'Enter') searchInput.blur(); else if (e.key === 'Escape') closeSearch(); return; }
  if (e.key === 'Escape') UI.back = true;
  if (screen === 'gift') { if (e.key === 'Enter' || e.key === ' ') claimGift(); return; }
  if (screen === 'home' && e.key === '/') { e.preventDefault(); openSearch(); return; }
  if (screen === 'home' || screen === 'search') {
    const step = { ArrowDown: 40, ArrowUp: -40, PageDown: 150, PageUp: -150 }[e.key];
    if (step) { e.preventDefault(); scroll.v = 0; scrollTo(scroll.y + step); }
    if (e.key === 'Home') scrollTo(0); else if (e.key === 'End') scrollTo(1e9);
  }
});
UI.onDown = (e, x, y) => {
  PX.Sound.unlock();
  if (screen !== 'home' && screen !== 'search') return;
  const L = layout();
  if (y < L.top) return;
  if (L.max > 0 && x >= S.W - 18) { scroll.bar = true; scroll.v = 0; UI.downId = null; barTo(y); return; }
  scroll.v = 0; scroll.drag = { id: e.pointerId, last: y, t: performance.now(), moved: 0 };
};
const thiefIcon = new Image(); thiefIcon.src = 'icons/icon-192.png';
const GAMES = [
  { id: 'thief', name: 'MOUSE THIEF', sub: 'RUN FROM THE CAT!', url: 'thief.html', color: '#e01e1e', cats: ['ACTION', 'RUNNING', 'ONLINE'], tags: 'CAT MOUSE CITY ROOFS' },
  { id: 'racer', name: 'PIXEL GP', sub: 'RACE CARS!', url: 'racer.html', color: '#2a7fd4', cats: ['RACING', 'ONLINE'], tags: 'CAR CARS DRIVE F1 FORMULA GRAND PRIX' },
  { id: 'heist', name: 'PIXEL HEIST', sub: 'ROB THE BANK!', url: 'heist.html', color: '#ffd23f', cats: ['ACTION', 'RACING'], tags: 'POLICE ROBBER CITY 3D CAR' },
  { id: 'pong', name: 'PIXEL PONG', sub: 'TABLE TENNIS!', url: 'pong.html', color: '#1ec8e0', cats: ['SPORTS', 'ONLINE', '2 PLAYERS'], tags: 'PING PONG TENNIS BALL' },
  { id: 'football', name: 'PIXEL FOOTBALL', sub: 'RUN YOUR CLUB!', url: 'football.html', color: '#3fae4a', cats: ['SPORTS', 'ONLINE'], tags: 'SOCCER BALL GOAL LEAGUE CLUB' },
  { id: 'hoops', name: 'PIXEL HOOPS', sub: 'SHOOT BASKETS!', url: 'hoops.html', color: '#ff8a2a', cats: ['SPORTS'], tags: 'BASKETBALL BALL BASKET' },
  { id: 'wings', name: 'PIXEL WINGS', sub: 'AIR BATTLE!', url: 'wings.html', color: '#7ac8ff', cats: ['ACTION', 'PLANES', 'ONLINE', '2 PLAYERS'], tags: 'PLANE PLANES FLY WAR BOMBER FIGHTER SHIP' },
  { id: 'skyrun', name: 'PIXEL SKY RUN', sub: 'PARKOUR ON PLANES!', url: 'skyrun.html', color: '#ff6bd0', cats: ['RUNNING', 'PLANES'], tags: 'PARKOUR JUMP PLANE OFFICER' },
  { id: 'fish', name: 'DEEP CATCH', sub: 'CATCH LEGENDARY FISH!', url: 'fish.html', color: '#2ad4d0', cats: ['SPORTS'], tags: 'FISH FISHING ROD SEA OCEAN BOAT LEGENDARY' },
  { id: 'skate', name: 'PIXEL SKATE', sub: 'SKATE, TRICK AND RACE!', url: 'skate.html', color: '#b07aff', cats: ['RACING', 'SPORTS', 'ONLINE'], tags: 'SKATEBOARD SKATE BOARD TRICK TRICKS KICKFLIP OLLIE GRIND RAMP RACE COINS' },
  { id: 'ski', name: 'PIXEL SKI', sub: 'SKI DOWN, DON\'T CRASH!', url: 'ski.html', color: '#7ad8ff', cats: ['RACING', 'SPORTS'], tags: 'SKI SKIING SNOW WINTER MOUNTAIN SLOPE DOWNHILL GREEN RED BLACK' },
  { id: 'boxfight', name: 'PIXEL BOX FIGHT', sub: 'KNOCK THEM OUT!', url: 'boxfight.html', color: '#ff5a4a', cats: ['ACTION', 'SPORTS', 'ONLINE', '2 PLAYERS'], tags: 'BOX BOXING FIGHT PUNCH RING KO KNOCKOUT GLOVES UPPERCUT' },
];
// --- search: type a name, or pick a category -----------------------------------------------
const CATEGORIES = ['ALL', 'ACTION', 'RACING', 'SPORTS', 'RUNNING', 'PLANES', 'ONLINE', '2 PLAYERS'];
const search = { q: '', cat: 'ALL' };
function matches(g) {
  if (search.cat !== 'ALL' && !g.cats.includes(search.cat)) return false;
  const words = search.q.trim().split(/\s+/).filter(Boolean), hay = [g.name, g.sub, g.tags, ...g.cats].join(' ');
  return words.every(w => hay.includes(w));
}
function shown() { return screen === 'search' ? GAMES.filter(matches) : GAMES; }
function openSearch() { screen = 'search'; scroll.y = 0; scroll.v = 0; pad.focus = 0; searchInput.value = search.q; PX.Sound.tone(660, 0.05, { vol: 0.06 }); if (!pad.used) setTimeout(() => searchInput.focus(), 0); }
function closeSearch() { searchInput.blur(); screen = 'home'; scroll.y = 0; scroll.v = 0; pad.focus = 0; }
function magnifier(cx, cy, s, color = '#fff') { PX.drawIcon(ctx, ['.###..', '#...#.', '#...#.', '#...#.', '.####.', '....##', '.....#'], { '#': color }, cx, cy, s); }
let installPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => { /* offline mode unavailable */ }));
}
function play(g) { PX.Sound.tone([523, 784], 0.15, { vol: 0.12 }); setTimeout(() => { location.href = g.url; }, 120); }

// --- background: a slowly scrolling pixel starfield and floor grid ------------------------------
function background(t) {
  const W = S.W;
  ctx.fillStyle = '#0d0b13'; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 70; i++) {
    const x = ((i * 73.7 + t * (6 + (i % 3) * 6)) % (W + 10)) - 5, y = (i * 37.3) % 150;
    ctx.fillStyle = i % 5 ? '#4a4068' : '#efe9ff'; ctx.fillRect(Math.round(W - x), Math.round(y), 1, 1);
  }
  ctx.fillStyle = '#1d1830'; ctx.fillRect(0, 150, W, H - 150);
  ctx.fillStyle = '#3a2f5c';
  for (let k = 0; k < 8; k++) { const y = 150 + Math.round(Math.pow((k + (t * 0.6) % 1) / 8, 2) * (H - 150)); ctx.fillRect(0, y, W, 1); }
  for (let k = -10; k <= 10; k++) { const x0 = W / 2 + k * 14, x1 = W / 2 + k * 70; ctx.beginPath(); ctx.moveTo(x0, 150); ctx.lineTo(x1, H); ctx.strokeStyle = '#3a2f5c'; ctx.stroke(); }
}
// --- little animated previews on the game cards -----------------------------------------
function previewThief(x, y, w, h, t) {
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.fillStyle = '#140f24'; ctx.fillRect(x, y, w, h);
  for (let i = 0; i < 14; i++) { ctx.fillStyle = i % 4 ? '#6a5f90' : '#ffffff'; ctx.fillRect(x + (i * 37) % w, y + 4 + (i * 13) % (h - 26), 1, 1); }
  ctx.fillStyle = '#f3e9c8'; ctx.fillRect(x + w - 22, y + 6, 10, 10); ctx.fillRect(x + w - 23, y + 8, 12, 6);   // moon
  const sc = (t * 40) % 30;
  ctx.fillStyle = '#2a2240';                                               // far buildings
  for (let i = -1; i < 7; i++) { const bh = 14 + ((i + Math.floor(t * 40 / 30)) * 7) % 16; ctx.fillRect(Math.round(x + i * 30 - sc), y + h - 14 - bh, 24, bh); }
  ctx.fillStyle = '#e9c46a';
  for (let i = -1; i < 7; i++) ctx.fillRect(Math.round(x + i * 30 - sc + 6), y + h - 24, 2, 3);
  ctx.fillStyle = '#0d0b13'; ctx.fillRect(x, y + h - 14, w, 14); ctx.fillStyle = '#8070b0'; ctx.fillRect(x, y + h - 14, w, 1);
  const g = y + h - 14, leg = Math.floor(t * 12) % 2;
  // the thief, with the mouse on his head
  const tx = Math.round(x + w * 0.62), ty = g - 14 - (leg ? 1 : 0);
  ctx.fillStyle = '#8b7fb0'; ctx.fillRect(tx - 1, ty - 1, 9, 13);
  ctx.fillStyle = '#000'; ctx.fillRect(tx, ty, 7, 11); ctx.fillRect(tx + (leg ? 0 : 1), ty + 11, 2, 3); ctx.fillRect(tx + (leg ? 5 : 4), ty + 11, 2, 3);
  ctx.fillStyle = '#ff2424'; ctx.fillRect(tx + 3, ty + 3, 1, 2); ctx.fillRect(tx + 5, ty + 3, 1, 2);
  ctx.fillStyle = '#9b9b9b'; ctx.fillRect(tx + 1, ty - 4, 6, 3); ctx.fillStyle = '#e7a3ad'; ctx.fillRect(tx + 5, ty - 5, 2, 1);
  // the cat, right behind him
  const cx = Math.round(x + w * 0.18 + Math.sin(t * 2) * 4), cy = g - 12;
  ctx.fillStyle = '#8b7fb0'; ctx.fillRect(cx - 1, cy + 1, 24, 10);
  ctx.fillStyle = '#000';
  ctx.fillRect(cx, cy + 3, 16, 6); ctx.fillRect(cx + 14, cy, 8, 7); ctx.fillRect(cx + 14, cy - 2, 2, 2); ctx.fillRect(cx + 20, cy - 2, 2, 2);
  ctx.fillRect(cx - 4, cy + 1, 4, 2); ctx.fillRect(cx - 5, cy - 2, 2, 4);
  ctx.fillRect(cx + 1 + leg * 2, cy + 9, 2, 3); ctx.fillRect(cx + 11 - leg * 2, cy + 9, 2, 3);
  ctx.fillStyle = '#ff3b3b'; ctx.fillRect(cx + 16, cy + 2, 2, 2); ctx.fillRect(cx + 19, cy + 2, 2, 2);
  ctx.restore();
}
function previewRacer(x, y, w, h, t) {
  ctx.fillStyle = '#7ec4ec'; ctx.fillRect(x, y, w, h / 2);
  ctx.fillStyle = '#3fae4a'; ctx.fillRect(x, y + h / 2, w, h / 2);
  const hz = y + h / 2, cx = x + w / 2;
  for (let r = 0; r < h / 2; r++) {                              // road with moving stripes
    const k = r / (h / 2), half = 4 + k * w * 0.45, yy = hz + r;
    const stripe = Math.floor((1 / (k + 0.05)) * 3 - t * 12) % 2;
    ctx.fillStyle = stripe ? '#e01e1e' : '#f4f4f4'; ctx.fillRect(Math.round(cx - half - 3 - k * 4), yy, Math.round(3 + k * 4), 1); ctx.fillRect(Math.round(cx + half), yy, Math.round(3 + k * 4), 1);
    ctx.fillStyle = stripe ? '#6b6b73' : '#64646c'; ctx.fillRect(Math.round(cx - half), yy, Math.round(half * 2), 1);
  }
  const cw = 34, ch = 16, carX = Math.round(cx - cw / 2 + Math.sin(t * 1.5) * 10), carY = y + h - ch - 2;   // a little race car
  ctx.fillStyle = '#111'; ctx.fillRect(carX, carY + 5, 7, 11); ctx.fillRect(carX + cw - 7, carY + 5, 7, 11);
  ctx.fillStyle = PX.AVATAR_COLORS[profile.avatar.color]; ctx.fillRect(carX + 9, carY + 6, 16, 8);
  ctx.fillStyle = '#ffd23f'; ctx.fillRect(carX + 15, carY + 3, 4, 3);
  ctx.fillStyle = '#16161c'; ctx.fillRect(carX + 3, carY, 28, 3); ctx.fillStyle = PX.AVATAR_COLORS[profile.avatar.color]; ctx.fillRect(carX + 3, carY, 28, 1);
}
function previewHeist(x, y, w, h, t) {
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.fillStyle = '#14123a'; ctx.fillRect(x, y, w, h);                     // night
  for (let i = 0; i < 8; i++) {                                           // the city, with lit windows
    const bx = x + i * 18 - 4, bh = 18 + (i * 37) % 22, by = y + h - 14 - bh;
    ctx.fillStyle = i % 2 ? '#2a2850' : '#33305e'; ctx.fillRect(bx, by, 16, bh);
    for (let r = 0; r < bh - 4; r += 5) for (let c = 2; c < 14; c += 4) if ((i * 7 + r * 3 + c) % 5 < 3) { ctx.fillStyle = '#ffcf70'; ctx.fillRect(bx + c, by + 3 + r, 2, 2); }
  }
  const bkx = Math.round(x + w / 2 - 22), bky = y + h - 36;                // the bank
  ctx.fillStyle = '#e8e4dc'; ctx.fillRect(bkx, bky, 44, 22); ctx.fillRect(bkx + 4, bky - 4, 36, 4); ctx.fillRect(bkx + 12, bky - 8, 20, 4);
  ctx.fillStyle = '#b8b0a0'; for (let c = 0; c < 5; c++) ctx.fillRect(bkx + 4 + c * 9, bky + 3, 3, 19);
  ctx.fillStyle = '#4a3a2a'; ctx.fillRect(bkx + 19, bky + 10, 6, 12);
  ctx.fillStyle = '#4a4a55'; ctx.fillRect(x, y + h - 14, w, 14);          // the road
  ctx.fillStyle = '#e8d36a'; for (let k = 0; k < 6; k++) ctx.fillRect(x + ((k * 24 - t * 60) % (w + 24) + w + 24) % (w + 24) - 12, y + h - 8, 10, 1);
  const run = (t * 0.35) % 1, tx = Math.round(x + 6 + run * (w - 30)), ty = y + h - 24, leg = Math.floor(t * 10) % 2;   // the thief with the loot
  ctx.fillStyle = '#111'; ctx.fillRect(tx + 1, ty, 6, 3);
  ctx.fillStyle = '#f0c090'; ctx.fillRect(tx + 1, ty + 3, 6, 2);
  ctx.fillStyle = PX.AVATAR_COLORS[profile.avatar.color]; ctx.fillRect(tx, ty + 5, 8, 6);
  ctx.fillStyle = '#c8a060'; ctx.fillRect(tx - 4, ty + 4, 5, 6); ctx.fillStyle = '#5ab04a'; ctx.fillRect(tx - 3, ty + 6, 3, 2);
  ctx.fillStyle = '#2a2a34'; ctx.fillRect(tx + (leg ? 0 : 2), ty + 11, 2, 3); ctx.fillRect(tx + (leg ? 6 : 4), ty + 11, 2, 3);
  const px = Math.round(tx - 30), py = y + h - 20, fl = Math.floor(t * 6) % 2;   // the police, close behind
  if (px > x - 24) {
    ctx.fillStyle = '#f4f4f4'; ctx.fillRect(px, py + 2, 22, 5); ctx.fillStyle = '#111'; ctx.fillRect(px + 5, py + 3, 10, 3); ctx.fillStyle = '#22304a'; ctx.fillRect(px + 6, py - 2, 10, 4);
    ctx.fillStyle = fl ? '#ff2a2a' : '#2a6bff'; ctx.fillRect(px + 8, py - 4, 3, 2); ctx.fillStyle = fl ? '#2a6bff' : '#ff2a2a'; ctx.fillRect(px + 12, py - 4, 3, 2);
    ctx.fillStyle = '#151515'; ctx.fillRect(px + 2, py + 7, 4, 3); ctx.fillRect(px + 16, py + 7, 4, 3);
  }
  ctx.restore();
}
function previewPong(x, y, w, h, t) {
  ctx.fillStyle = '#1ec8e0'; ctx.fillRect(x, y, w, h);
  const tx = x + 10, ty = y + 8, tw = w - 20, th = h - 16;
  ctx.fillStyle = '#111'; ctx.fillRect(tx - 2, ty - 2, tw + 4, th + 4);
  ctx.fillStyle = '#3ad44f'; ctx.fillRect(tx, ty, tw, th);
  ctx.fillStyle = '#d8f8d8'; ctx.fillRect(tx, ty + th / 2 - 1, tw, 2);
  ctx.fillStyle = '#111'; ctx.fillRect(tx + tw / 2 - 1, ty - 3, 2, th + 6);
  const k = (t * 0.8) % 2, f = k < 1 ? k : 2 - k;                            // the ball goes back and forth
  const bx = tx + 6 + f * (tw - 12), by = ty + th / 2 + Math.sin(t * 2.3) * (th / 2 - 5);
  const bat = (px, py, c) => { ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(px, py, 7, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = c; ctx.beginPath(); ctx.arc(px, py, 5.5, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillRect(px - 4, py - 1, 8, 2); };
  const yy = (side) => ty + th / 2 + Math.sin(t * 2.3 + (side ? 0.3 : -0.3)) * (th / 2 - 5);
  bat(tx - 2, yy(0), PX.AVATAR_COLORS[profile.avatar.color]); bat(tx + tw + 2, yy(1), '#e01e1e');
  ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fillRect(Math.round(bx - (k < 1 ? 8 : -2)), Math.round(by) - 1, 6, 2);
  ctx.fillStyle = '#111'; ctx.fillRect(Math.round(bx) - 2, Math.round(by) - 2, 5, 5); ctx.fillStyle = '#ffe23a'; ctx.fillRect(Math.round(bx) - 1, Math.round(by) - 1, 3, 3);
}
function previewFootball(x, y, w, h, t) {
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.fillStyle = '#231c3a'; ctx.fillRect(x, y, w, 14);                    // the crowd
  for (let i = 0; i < w; i += 4) { ctx.fillStyle = ['#e01e1e', '#2a7fd4', '#f2f2f2', '#ffd23f'][(i / 4) % 4]; ctx.fillRect(x + i, y + 4 + ((i / 4) % 2) * 4 - (Math.floor(t * 6 + i) % 5 === 0 ? 1 : 0), 3, 2); }
  for (let r = 14; r < h; r++) for (let i = -1; i < 6; i++) {               // striped grass, slightly in perspective
    const k = (r - 14) / (h - 14), sw = (w / 4) * (0.8 + 0.2 * k), ox = ((t * 14) % (sw * 2));
    ctx.fillStyle = i % 2 ? '#3c9e46' : '#45ab4f'; ctx.fillRect(Math.round(x + i * sw - ox + sw), y + r, Math.ceil(sw), 1);
  }
  ctx.fillStyle = '#e8f6e8'; ctx.fillRect(x, y + 16, w, 1); ctx.fillRect(x, y + h - 3, w, 1);
  const gx = x + w - 10; ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(gx, y + 26, 8, 16);    // the goal
  ctx.fillStyle = '#fff'; ctx.fillRect(gx - 1, y + 24, 2, 20); ctx.fillRect(gx - 1, y + 24, 9, 2);
  const man = (mx, my, kit, leg) => {
    ctx.fillStyle = '#111'; ctx.fillRect(mx - 3, my - 13, 7, 13);
    ctx.fillStyle = '#f2c9a0'; ctx.fillRect(mx - 1, my - 12, 3, 3);
    ctx.fillStyle = kit; ctx.fillRect(mx - 2, my - 9, 5, 4);
    ctx.fillStyle = '#fff'; ctx.fillRect(mx - 2, my - 5, 5, 2);
    ctx.fillStyle = '#f2c9a0'; ctx.fillRect(mx - 2 + leg, my - 3, 2, 3); ctx.fillRect(mx + 1 - leg, my - 3, 2, 3);
  };
  const run = (t * 0.3) % 1, px = Math.round(x + 8 + run * (w - 34)), leg = Math.floor(t * 10) % 2;
  man(px, y + 42, PX.AVATAR_COLORS[profile.avatar.color], leg);
  man(Math.round(px - 14 + Math.sin(t * 3) * 2), y + 54, '#2a7fd4', 1 - leg);
  const bx = px + 5 + (run > 0.85 ? (run - 0.85) * 120 : 0), by = y + 41 - (run > 0.85 ? Math.sin((run - 0.85) / 0.15 * Math.PI) * 8 : 0);
  ctx.fillStyle = '#111'; ctx.fillRect(Math.round(bx) - 1, Math.round(by) - 1, 4, 4); ctx.fillStyle = '#fff'; ctx.fillRect(Math.round(bx), Math.round(by), 2, 2);
  ctx.restore();
}
function previewHoops(x, y, w, h, t) {           // seen from behind the shooter, in perspective
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  const cx = x + w / 2, hor = y + 30;
  ctx.fillStyle = '#251842'; ctx.fillRect(x, y, w, hor - y);                    // the crowd
  const cols = ['#e01e1e', '#2a7fd4', '#f2f2f2', '#ffd23f', '#3fae4a', '#ff8a2a'];
  for (let r = 0; r < 4; r++) for (let i = 0; i < w; i += 5) {
    ctx.fillStyle = cols[(i / 5 + r * 2) % cols.length | 0];
    ctx.fillRect(x + i + (r % 2) * 2, y + 4 + r * 6 - (Math.floor(t * 3 + i + r) % 9 === 0 ? 1 : 0), 3, 3);
  }

const CARD_H = 140;
const scroll = { y: 0, v: 0, drag: null, bar: false };
function layout() {

  let top = 66;

function scrollTo(y) { const m = layout().max; scroll.y = Math.max(0, Math.min(m, y)); }

  if (Math.abs(scroll.v) < 4) { scroll.v = 0; return; }
  const before = scroll.y; scrollTo(scroll.y + scroll.v * dt);
  if (scroll.y === before) scroll.v = 0;
  scroll.v *= Math.exp(-4 * dt);

UI.onMove = (e, x, y) => {
  if (screen !== 'home' && screen !== 'search') return;
  if (scroll.bar) { barTo(y); return; }
  const d = scroll.drag; if (!d || d.id !== e.pointerId) return;
  const now = performance.now(), dy = y - d.last, dt = Math.max(1, now - d.t) / 1000;
  scrollTo(scroll.y - dy);
  scroll.v = scroll.v * 0.3 + (-dy / dt) * 0.7;
  d.moved += Math.abs(dy); d.last = y; d.t = now;

UI.onUp = e => {

    const now = {}; for (const i of [0, 1, 2, 3, 4, 5, 9, 12, 13, 14, 15]) now[i] = !!(gp.buttons[i] && gp.buttons[i].pressed);
    const prev = pad.prev[n] || {}, edge = i => now[i] && !prev[i];

  if (UI.button('cancel', Math.round(W / 2 + 4), 190, bw, 22, 'BACK') || UI.back) { nameInput.blur(); screen = 'home'; }
}

// --- the first of the month update: on the 1st of every month (January 1, February 1, ... December 1) -----
// The arcade shows it once, the first time you open it that day: a free COW avatar for everyone. Press OKAY and it's yours.
// It only comes on the 1st: on any other day there's no update.
const MONTHLY_GIFT = 'cow';
const SEEN_KEY = 'pixelArcade.monthlySeen';
function todayKey() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-01'; }
function updateToday() {
  if (new Date().getDate() !== 1) return null;
  let seen = null; try { seen = localStorage.getItem(SEEN_KEY); } catch (e) { /* private mode */ }
  return seen === todayKey() ? null : { gift: MONTHLY_GIFT };
}
let gift = updateToday();
if (gift) screen = 'gift';
function claimGift() {
  if (gift) { PX.Gifts.add(gift.gift); try { localStorage.setItem(SEEN_KEY, todayKey()); } catch (e) { /* private mode */ } PX.Sound.unlock(); PX.Sound.tone([523, 659, 784, 1047], 0.35, { vol: 0.12 }); }
  gift = null; screen = 'home';
}
// a cow standing up on its back legs with its arms out, like on the update's picture
const COW = ['.......k......k.......', '......kkkwwwwkkk......', '.......kwwwwwwk.......', '........wkwwkw........', '........wwwwww........',
             '.......pppppppp.......', '.......ppkppkpp.......', '........pppppp........', '.......wwwwwwww.......', 'hwwwwwwwwkkwwwwwwwwwwh',
             'hwwkkwwwkkkwwwwwwkwwwh', '.......wwkkwwwwkkw....', '.......wwwwwwwkkkw....', '.......kkwwwwwwwww....', '.......kkkwwwwwwww....',
             '.......wwwwwwwwkkw....', '.......wwwpppwwkkw....', '.......wwwpppwwwww....', '.......wwwwwwwwwww....', '.......kww....wwwk....',
             '.......www....www.....', '.......www....www.....', '.......hhh....hhh.....'];
function cowPicture(x, y, w, h, t) {
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  const sky = ['#8a7ac0', '#a888c8', '#c898c8', '#e8a8b8', '#f8c0a8', '#ffd8a8'];         // a sunset, purple to peach
  sky.forEach((c, k) => { ctx.fillStyle = c; ctx.fillRect(x, y + Math.round(k * h * 0.6 / sky.length), w, Math.ceil(h * 0.6 / sky.length) + 1); });
  ctx.fillStyle = '#fff6d0'; ctx.fillRect(x + w - 34, y + 10, 12, 12); ctx.fillRect(x + w - 36, y + 12, 16, 8); ctx.fillRect(x + w - 32, y + 8, 8, 16);
  ctx.fillStyle = '#ffe8d8'; for (let i = 0; i < 5; i++) { const cx = Math.round(x + ((i * 61 + t * 3) % (w + 40)) - 20); ctx.fillRect(cx, y + 8 + (i % 3) * 7, 22, 3); ctx.fillRect(cx + 5, y + 6 + (i % 3) * 7, 10, 2); }
  ctx.fillStyle = '#2f6a3a';                                              // the trees on the horizon
  for (let k = 0; k < w; k += 3) { const th = 6 + Math.abs(Math.sin(k * 0.21)) * 7 + (k * 7 % 4); ctx.fillRect(x + k, Math.round(y + h * 0.62 - th), 3, Math.round(th) + 2); }
  ctx.fillStyle = '#3f8a3a'; ctx.fillRect(x, Math.round(y + h * 0.62), w, h);
  ctx.fillStyle = '#5aae3f'; for (let k = 0; k < 60; k++) ctx.fillRect(x + (k * 53) % w, Math.round(y + h * 0.66 + (k * 29) % Math.round(h * 0.32)), 2, 1);
  const n = 4, sp = w / n;
  for (let i = 0; i < n; i++) {
    const bob = Math.round(Math.sin(t * 3 + i * 1.7)), cx = x + sp * (i + 0.5);
    PX.drawIcon(ctx, COW, { w: '#f4f4f0', k: '#1a1a1a', p: '#f0a0b0', h: '#4a4a4a' }, cx, y + h * 0.6 + (i === 2 ? -3 : 3) + bob, 2, '#111');
  }
  ctx.restore();
}
function drawGift(t) {
  const W = S.W;
  drawHome(t);
  UI.list = [];                                     // only OKAY can be pressed while the update is up
  ctx.fillStyle = 'rgba(13,11,19,0.6)'; ctx.fillRect(0, 0, W, H);
  const pw = Math.min(330, W - 30), x = Math.round(W / 2 - pw / 2), y = 32, ph = 200;
  ctx.fillStyle = '#efe9ff'; ctx.fillRect(x - 2, y - 2, pw + 4, ph + 4); ctx.fillStyle = '#16121f'; ctx.fillRect(x, y, pw, ph);
  T('FIRST OF THE MONTH UPDATE', W / 2, y + 7, '#fff', 2, 'center', '#000');
  cowPicture(x + 6, y + 24, pw - 12, 92, t);
  const bw = PX.textWidth('FREE AVATAR!', 4);
  T('FREE AVATAR!', W / 2 + 14, y + 124, '#fff', 4, 'center', '#3a2f5c');
  PX.drawAvatar(ctx, { shape: gift.gift, color: 8 }, Math.round(W / 2 + 14 - bw / 2 - 34), y + 120, 2);
  T(PX.Gifts.has(gift.gift) ? 'YOU HAVE IT ALREADY: IT\'S IN EDIT' : 'PICK IT IN EDIT, NEXT TO YOUR NAME', W / 2, y + 152, '#9a92b8', 1, 'center');
  if (UI.button('okay', Math.round(W / 2 - 60), y + 168, 120, 24, pad.used ? 'A: OKAY' : 'OKAY', { accent: '#5ad43f' }) || UI.back) claimGift();
}

let t0 = performance.now(), tPrev = t0;
function frame(now) {
  const t = (now - t0) / 1000;
  padPoll(Math.min(0.05, (now - tPrev) / 1000));
  scrollStep(Math.min(0.05, (now - tPrev) / 1000)); tPrev = now;
  UI.begin();
  if (screen === 'gift') drawGift(t); else if (screen === 'home') drawHome(t); else if (screen === 'search') drawSearch(t); else if (screen === 'remote') drawRemote(t); else if (screen === 'settings') drawSettings(t); else drawProfile(t);
  if (screen !== 'profile') nameInput.style.display = 'none';
  if (screen !== 'search') searchInput.style.display = 'none';
  UI.end();
  S.blit('#0d0b13');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
PX.Pad.setup({                                     // the arcade reads the controller itself (PX.Pad only moves between the SETTINGS buttons)
  title: 'Pixel Arcade: controller', menu: () => screen === 'settings', ui: UI,
  phone: { stick: 'PICK A GAME', dpad: true, buttons: [['A', 'PLAY'], ['X', 'SEARCH'], ['Y', 'SETTINGS'], ['B', 'BACK']] },
  help: [['STICK|D-PAD', 'PICK A GAME'], ['A', 'PLAY IT'], ['R-STICK', 'SCROLL'], ['X', 'SEARCH'], ['Y', 'SETTINGS'], ['LB|RB', 'SEARCH: CATEGORY'], ['RB', 'PHONE CONTROLLERS'], ['B', 'SEARCH: BACK']],
});
</script>
