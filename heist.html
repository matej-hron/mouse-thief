// Solid things (buildings, tree trunks), kept per block so the checks stay quick;
// the inside of the building you rob is in roomRects.
const blockRects = Array.from({ length: N * N }, () => []);
let roomRects = [];
function addSolid(x0, z0, x1, z1, h) {
  const bi = clamp(Math.floor((x0 + x1) / 2 / P), 0, N - 1), bj = clamp(Math.floor((z0 + z1) / 2 / P), 0, N - 1);
  blockRects[bi + bj * N].push({ x0, z0, x1, z1, h });
}
function solidAt(x, z) {
  for (const r of roomRects) if (x > r.x0 && x < r.x1 && z > r.z0 && z < r.z1) return r;
  const bi = Math.floor(x / P), bj = Math.floor(z / P);
  if (bi < 0 || bj < 0 || bi >= N || bj >= N) return null;
  for (const r of blockRects[bi + bj * N]) if (x > r.x0 && x < r.x1 && z > r.z0 && z < r.z1) return r;
  return null;
}
function lineClear(x0, z0, x1, z1) {
  const d = Math.hypot(x1 - x0, z1 - z0), n = Math.ceil(d / 1);
  for (let i = 1; i < n; i++) { const r = solidAt(x0 + (x1 - x0) * i / n, z0 + (z1 - z0) * i / n); if (r && r.h > 1.5) return false; }   // you can see over counters
  return true;
}
// Push a round thing (x, z, radius r) out of solid things; returns the wall's direction or null.
function pushRect(o, r, b) {

  if (d2 >= r * r) return null;
  if (d2 > 1e-6) { const d = Math.sqrt(d2); o.x = cx + dx / d * r; o.z = cz + dz / d * r; return { nx: dx / d, nz: dz / d }; }

// Static geometry is merged into a few big meshes (fast on phones).
class Builder {
  constructor() { this.p = []; this.n = []; this.c = []; this.u = []; }
  quad(a, b, c, d, col, uv) {
    const e1 = [b[0] - a[0], b[1] - a[1], b[2] - a[2]], e2 = [c[0] - a[0], c[1] - a[1], c[2] - a[2]];
    let nx = e1[1] * e2[2] - e1[2] * e2[1], ny = e1[2] * e2[0] - e1[0] * e2[2], nz = e1[0] * e2[1] - e1[1] * e2[0];
    const l = Math.hypot(nx, ny, nz) || 1; nx /= l; ny /= l; nz /= l;
    for (const [v, t] of [[a, 0], [b, 1], [c, 2], [a, 0], [c, 2], [d, 3]]) {
      this.p.push(v[0], v[1], v[2]); this.n.push(nx, ny, nz); this.c.push(col.r, col.g, col.b);
      this.u.push(uv ? uv[t * 2] : 0.002, uv ? uv[t * 2 + 1] : 0.002);
    }
  }
  // a box from (x0,y0,z0) to (x1,y1,z1); textured = windows on the sides
  box(x0, y0, z0, x1, y1, z1, color, textured = false, skipBottom = true) {
    const col = new THREE.Color(color), S16 = 1 / 16;
    const side = (len, off) => textured ? [off * S16, y0 * S16, (off + len) * S16, y0 * S16, (off + len) * S16, y1 * S16, off * S16, y1 * S16] : null;
    this.quad([x1, y0, z1], [x1, y0, z0], [x1, y1, z0], [x1, y1, z1], col, side(z1 - z0, z0));
    this.quad([x0, y0, z0], [x0, y0, z1], [x0, y1, z1], [x0, y1, z0], col, side(z1 - z0, z0));
    this.quad([x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1], col, side(x1 - x0, x0));
    this.quad([x1, y0, z0], [x0, y0, z0], [x0, y1, z0], [x1, y1, z0], col, side(x1 - x0, x0));
    this.quad([x0, y1, z1], [x1, y1, z1], [x1, y1, z0], [x0, y1, z0], col, null);
    if (!skipBottom) this.quad([x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1], col, null);
  }
  cbox(cx, cy, cz, w, h, d, color) { this.box(cx - w / 2, cy - h / 2, cz - d / 2, cx + w / 2, cy + h / 2, cz + d / 2, color); }

  geo(g, x, y, z, color, sx = 1, sy = 1, sz = 1, ry = 0) {
    const m = new THREE.Matrix4().compose(new THREE.Vector3(x, y, z), new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), ry), new THREE.Vector3(sx, sy, sz));
    const ng = (g.index ? g.toNonIndexed() : g.clone()); ng.applyMatrix4(m);
    const pos = ng.attributes.position.array, col = new THREE.Color(color);
    for (let i = 0; i < pos.length; i += 9) {
      this.quad([pos[i], pos[i + 1], pos[i + 2]], [pos[i + 3], pos[i + 4], pos[i + 5]], [pos[i + 6], pos[i + 7], pos[i + 8]], [pos[i + 6], pos[i + 7], pos[i + 8]], col, null);
    }
  }
  mesh(material, cast = true) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.p, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(this.n, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(this.c, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(this.u, 2));
    g.computeBoundingSphere();
    const m = new THREE.Mesh(g, material); m.castShadow = cast; m.receiveShadow = true;
    return m;
  }
}

// The window texture: 4 x 4 windows; a second copy with some windows lit up for the evening.
function windowTextures() {
  const mk = () => { const c = document.createElement('canvas'); c.width = c.height = 256; return c; };
  const a = mk(), b = mk(), g = a.getContext('2d'), e = b.getContext('2d'), rnd = rngOf(7);

  e.fillStyle = '#000'; e.fillRect(0, 0, 256, 256);
  for (let j = 0; j < 4; j++) for (let i = 0; i < 4; i++) {
    const x = i * 64, y = j * 64;
    g.fillStyle = '#dad6d2'; g.fillRect(x, y + 58, 64, 6);                // the floor line
    g.fillStyle = '#9a96a0'; g.fillRect(x + 12, y + 10, 40, 40);          // frame
    const gr = g.createLinearGradient(x, y + 12, x + 40, y + 48); gr.addColorStop(0, '#5a78a8'); gr.addColorStop(1, '#22304a');
    g.fillStyle = gr; g.fillRect(x + 14, y + 12, 36, 36);                 // glass
    g.fillStyle = '#9a96a0'; g.fillRect(x + 31, y + 12, 2, 36);
    g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(x + 17, y + 15, 6, 3); g.fillRect(x + 17, y + 18, 3, 6);
    g.fillStyle = '#bab6c0'; g.fillRect(x + 10, y + 50, 44, 4);           // sill
    if (rnd() < 0.5) { e.fillStyle = rnd() < 0.7 ? '#ffcf70' : '#ffe9b0'; e.fillRect(x + 14, y + 12, 36, 36); }
  }
  const t = (c) => { const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.anisotropy = 4; return tx; };

}

function clearLevel() {
  for (const c of cars) scene.remove(c.mesh);
  for (const n of npcs) { scene.remove(n.mesh); scene.remove(n.fx); }
  cars = []; npcs = []; roomRects = [];
  if (player.mesh) { scene.remove(player.mesh); player.mesh = null; }
  if (room) { scene.remove(room.grp); room = null; }
  if (G && G.beacon) scene.remove(G.beacon);
  for (const p of parts) { p.life = 0; p.m.visible = false; }
  beam.visible = false;
}
function setTime(name) {
  const t = TOD[name];
  scene.background = new THREE.Color(t.fog); scene.fog.color.set(t.fog); scene.fog.near = t.near; scene.fog.far = t.far;
  paintSky(t.sky, t.fog); sky.visible = name !== 'inside'; stars.visible = t.stars;
  hemi.color.set(t.hemi[0]); hemi.groundColor.set(t.hemi[1]); hemi.intensity = t.hemi[2];
  sun.color.set(t.sun[0]); sun.intensity = t.sun[1];
  wallMat.emissive.setScalar(t.win);
  if (cityMeshes.pools) cityMeshes.pools.visible = !!t.lamps;
}
function spawnTraffic(n, rnd, avoid) {
  for (let k = 0, tries = 0; k < n && tries < 200; tries++) {
    const i = Math.floor(rnd() * (N + 1)), j = Math.floor(rnd() * (N + 1)), nb = neighbors(i, j), b = nb[Math.floor(rnd() * nb.length)];
    const a = nodePos(i, j), e = nodePos(b[0], b[1]), f = 0.3 + rnd() * 0.4, dx = Math.sign(e.x - a.x), dz = Math.sign(e.z - a.z);
    const x = a.x + (e.x - a.x) * f - dz * 3, z = a.z + (e.z - a.z) * f + dx * 3;
    if (Math.hypot(x - avoid.x, z - avoid.z) < 30 || cars.some(c => Math.hypot(c.x - x, c.z - z) < 10)) continue;
    const r = rnd(), kind = r < 0.15 ? 'van' : r < 0.3 ? 'taxi' : r < 0.4 ? 'sport' : 'sedan';
    const c = newCar(kind, x, z, Math.atan2(dx, dz), 'traffic');
    c.pi = i; c.pj = j; c.ni = b[0]; c.nj = b[1]; c.cruise = 8 + rnd() * 4;
    k++;
  }
}
function spawnParked(n, rnd, avoid) {
  for (let k = 0, tries = 0; k < n && tries < 200; tries++) {
    const horiz = rnd() < 0.5, line = Math.floor(rnd() * (N + 1)), s = Math.floor(rnd() * N) * P + 12 + rnd() * (P - 24), side = rnd() < 0.5 ? -1 : 1;
    const x = horiz ? s : line * P + side * 4.8, z = horiz ? line * P + side * 4.8 : s;
    if (x < 0 || z < 0 || x > CITY || z > CITY || Math.hypot(x - avoid.x, z - avoid.z) < 12 || cars.some(c => Math.hypot(c.x - x, c.z - z) < 7)) continue;
    const r = rnd();
    newCar(r < 0.2 ? 'van' : r < 0.35 ? 'sport' : 'sedan', x, z, horiz ? Math.PI / 2 : 0, 'parked');
    k++;
  }
}

        inside: false, hasBag: false, codeFound: false, vaultOpen: false, lock: null, lockCD: 0, shotCD: 0, fade: 0, minSaid: false, fullSaid: false,

function say(text, color = '#fff', t = 2.6) { if (!G) return; G.msg = text; G.msgT = t; G.msgC = color; }
function startAlarm(msg) {

}
function goInside() {

  cam.yaw = Math.PI; cam.pitch = 0.32; cam.snap = true;

// What to do next, and where.
function goal() {
  const lv = G.lv, s = room.spots;
  if (!G.inside) {
    if (G.rob >= MIN_LOOT) return { x: G.home.x, z: G.home.z, text: 'ESCAPE TO THE HIDEOUT!', c: '#9be36b' };
    return { x: G.door.x, z: G.door.z, text: G.rob > 0 ? 'GO BACK IN, YOUR BAG IS NOT FULL' : 'GO INSIDE THE ' + lv.name, c: '#ffd23f' };
  }
  if (!G.hasBag) return { ...s.bag, text: 'GRAB THE BAG', c: '#ffd23f' };
  if (!G.vaultOpen && lv.code && !G.codeFound) return { ...s.note, text: 'FIND THE CODE (A YELLOW NOTE)', c: '#ffd23f' };
  if (!G.vaultOpen) return { ...s.vault, text: 'OPEN THE VAULT', c: '#ffd23f' };
  if (G.rob < MIN_LOOT) { const p = room.piles.slice().sort((a, b) => dist(a, player) - dist(b, player))[0]; return { x: p.x, z: p.z, text: 'FILL THE BAG WITH ' + lv.loot, c: '#ffd23f' }; }
  return { ...s.door, text: G.rob < 1 ? 'GET OUT! (OR GRAB MORE)' : 'GET OUT FAST!', c: '#9be36b' };
}

  if (G.fade > 0) { ctx.fillStyle = 'rgba(0,0,0,' + G.fade + ')'; ctx.fillRect(0, 0, W, H); }
}
function drawPause() {
  const W = S.W, { y } = panel(200, 132), bw = 150, bx = Math.round(W / 2 - bw / 2);
  T('PAUSED', W / 2, y + 12, '#fff', 3, 'center');
  soundButtons(Math.round(W / 2 + 46), y + 8);
  if (UI.button('resume', bx, y + 40, bw, 22, 'RESUME', { accent: '#5ad43f' }) || UI.back) setPause(false);
  if (UI.button('restart', bx, y + 68, bw, 22, 'RESTART')) startLevel(G.n);
  if (UI.button('quit', bx, y + 96, bw, 22, 'MENU')) toTitle();
}
function drawBusted(now) {
  const W = S.W, b = Math.floor(now / 250) % 2;
  ctx.fillStyle = b ? 'rgba(224,30,30,0.25)' : 'rgba(42,107,255,0.25)'; ctx.fillRect(0, 0, W, H);
  if (G.overT < 0.8) return;
  const { y } = panel(250, 130);
  T('BUSTED!', W / 2, y + 12, '#ff6b6b', 4, 'center');
  T(G.bustedBy === 'guard' ? 'A GUARD GRABBED YOU.' : G.bustedBy ? 'AN ANGRY ' + G.bustedBy.toUpperCase() + ' GRABBED YOU.' : 'THE POLICE GOT YOU.', W / 2, y + 42, '#fff', 1, 'center', null);
  T(G.bustedBy ? 'TIP: SHOOT IN THE AIR WHEN THEY GET UP!' : G.rob > 0 ? 'YOU HAD ' + money(G.lv.value * G.rob) : 'TRY A DIFFERENT WAY!', W / 2, y + 54, '#9a92b8', 1, 'center', null);
  if (UI.button('retry', Math.round(W / 2 - 75), y + 70, 150, 22, 'TRY AGAIN', { accent: '#ffd23f' })) startLevel(G.n);
  if (UI.button('bmenu', Math.round(W / 2 - 75), y + 98, 150, 22, 'HEISTS') || UI.back) toTitle('levels');
}
const bills = [];
function drawEscaped(now, dt) {
  const W = S.W, finale = state === 'win';
  if (finale) {                                                        // money rain
    if (bills.length < 60) bills.push({ x: Math.random() * W, y: -10, v: 30 + Math.random() * 40, s: Math.random() * 6 });
    for (const b of bills) { b.y += b.v * dt; b.s += dt * 4; if (b.y > H + 10) { b.y = -10; b.x = Math.random() * W; } ctx.fillStyle = '#1a5a1a'; ctx.fillRect(Math.round(b.x) - 1, Math.round(b.y) - 1, 12, Math.round(5 + Math.sin(b.s) * 2) + 2); ctx.fillStyle = '#5ab04a'; ctx.fillRect(Math.round(b.x), Math.round(b.y), 10, Math.round(5 + Math.sin(b.s) * 2)); }
  }
  if (G.overT < 0.6) return;
  const { x, y } = panel(300, finale ? 196 : 150);
  if (finale) {
    T('YOU DID IT!', W / 2, y + 8, '#ffd23f', 3, 'center');
    drawMax(x + 12, y + 32, 2);
    ENDING.forEach((l, i) => T(l, x + 50, y + 34 + i * 9, '#fff', 1, 'left', null));
    T(G.firstWin ? 'PIXEL HEIST COMPLETE!' : 'THE BANK IS EMPTY AGAIN!', W / 2, y + 66, '#9be36b', 2, 'center');
  } else {
    T('HEIST COMPLETE!', W / 2, y + 10, '#9be36b', 3, 'center');
    T(G.lv.name, W / 2, y + 32, '#fff', 2, 'center');
  }
  const r = y + (finale ? 86 : 50);
  T('LOOT  ' + money(G.loot), W / 2, r, '#9be36b', 2, 'center');
  T('TIME  ' + clock(G.t) + (G.newBest ? '  NEW BEST!' : ''), W / 2, r + 16, '#fff', 1, 'center', null);
  T('★ +' + G.stars, W / 2, r + 28, '#ffd23f', 2, 'center');
  const by = r + 48;
  if (!finale && UI.button('next', Math.round(W / 2 + 5), by, 135, 22, 'NEXT HEIST', { accent: '#9be36b' })) { sfx('click'); openBrief(G.n + 1); }
  if (finale && UI.button('again', Math.round(W / 2 + 5), by, 135, 22, 'MENU', { accent: '#9be36b' })) toTitle();
  if (UI.button('elv', Math.round(W / 2 - 140), by, 135, 22, 'HEISTS') || UI.back) toTitle('levels');
}
function setPause(v) { if (state !== 'play') return; paused = v; Ctl.L.id = Ctl.R.id = null; if (v) Music.play(null); else Music.play(G.copsOut ? 'chase' : 'sneak'); }
function toTitle(to = 'title') {
  clearLevel(); G = null; state = to; paused = false; bills.length = 0;
  setTime('dusk'); spawnTraffic(16, rngOf(3), { x: -999, z: -999 }); Music.play('menu');
}

/* --- input ----------------------------------------------------------------------- */
UI.onDown = (e, x, y) => {
  PX.Sound.unlock(); if (!Music.cur && state !== 'play') Music.play('menu');
  if (e.pointerType === 'touch') Ctl.show = true;
  if (state !== 'play' || paused || UI.downId !== null || (G && G.over)) return;
  const s = x < S.W * 0.45 ? Ctl.L : y > 70 ? Ctl.R : null;           // left half: move; right half: camera
  if (s && s.id === null) { s.id = e.pointerId; s.ox = x; s.oy = y; s.dx = 0; s.dy = 0; }
};
UI.onMove = (e, x, y) => { for (const s of [Ctl.L, Ctl.R]) if (e.pointerId === s.id) { s.dx = x - s.ox; s.dy = y - s.oy; } };
UI.onUp = e => { for (const s of [Ctl.L, Ctl.R]) if (e.pointerId === s.id) { s.id = null; s.dx = s.dy = 0; } };
const KEYMAP = { KeyW: 'w', KeyA: 'a', KeyS: 's', KeyD: 'd', ArrowUp: 'lu', ArrowDown: 'ld', ArrowLeft: 'll', ArrowRight: 'lr' };
window.addEventListener('keydown', e => {
  PX.Sound.unlock(); if (!Music.cur && state !== 'play') Music.play('menu');
  if (KEYMAP[e.code]) { keys[KEYMAP[e.code]] = 1; e.preventDefault(); }
  const playing = state === 'play' && !paused && G && !G.over;
  if (playing && G.lock && G.lock.mode === 'code') {
    if (/^Digit\d$/.test(e.code) || /^Numpad\d$/.test(e.code)) typeCode(e.code.slice(-1));
    if (e.code === 'Backspace') typeCode('DEL');
  }
  if (playing && (e.code === 'KeyE' || e.code === 'Enter')) { action(); e.preventDefault(); }
  if (playing && e.code === 'Space') { shoot(false); e.preventDefault(); }
  if (playing && e.code === 'KeyR') shoot(true);
  if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'play') setPause(!paused);
  else if (e.code === 'Escape') UI.back = true;
  if (e.code === 'KeyM') { save.music = !save.music; store(); Music.bus(); }
});
window.addEventListener('keyup', e => { if (KEYMAP[e.code]) keys[KEYMAP[e.code]] = 0; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = 0; if (state === 'play') setPause(true); });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') setPause(true); });

/* --- 11. MAIN LOOP ---------------------------------------------------------------- */
const STEP = 1 / 60;
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  UI.begin();
  hctx.setTransform(1, 0, 0, 1, 0, 0); hctx.clearRect(0, 0, hud.width, hud.height);
  ctx.clearRect(0, 0, S.W, H);
  if (!renderer) {
    ctx.fillStyle = '#0d0b13'; ctx.fillRect(0, 0, S.W, H);
    T("SORRY, THIS DEVICE CAN'T SHOW 3D GAMES.", S.W / 2, 100, '#fff', 1, 'center');
    if (UI.button('games', Math.round(S.W / 2 - 70), 130, 140, 24, '< ALL GAMES') || UI.back) location.href = './';
  } else if (G && (state === 'play' || state === 'busted' || state === 'escaped' || state === 'win')) {
    if (!paused) { acc += dt; while (acc >= STEP) { update(STEP); acc -= STEP; } } else acc = 0;
    syncModels(dt, now); updateCamera(dt); followShadow(player.x, player.z);
    renderer.render(scene, camera);
    drawHUD(now);
    if (paused) drawPause();
    else if (state === 'busted') drawBusted(now);
    else if (state === 'escaped' || state === 'win') drawEscaped(now, dt);
  } else {
    acc += dt;
    while (acc >= STEP) { for (const c of cars) if (c.ai === 'traffic') trafficAI(c, STEP); for (const c of cars) pushOut(c, c.r); for (let i = 0; i < cars.length; i++) for (let j = i + 1; j < cars.length; j++) hitCars(cars[i], cars[j]); acc -= STEP; }
    syncModels(dt, now); orbitCamera(dt); followShadow(CITY / 2, CITY / 2);
    renderer.render(scene, camera);
    if (state === 'title') drawTitle();
    else if (state === 'levels') drawLevels();
    else if (state === 'brief') drawBrief();
  }
  soundFrame(dt);
  UI.end();
  S.blit('rgba(0,0,0,0)');
  requestAnimationFrame(frame);
}
if (renderer) { buildCity(); toTitle(); }
requestAnimationFrame(frame);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => { /* offline mode unavailable */ }));
}
// for the tests
window.HEIST = { get G() { return G; }, get state() { return state; }, get room() { return room; }, player, cars: () => cars, npcs: () => npcs, startLevel, update, action, shoot, typeCode, pickPin,
  keys, save, SPOTS, LEVELS, spawnCop, toTitle, openBrief, setPause, Ctl, cam, goInside, goOutside, goal };
</script>
