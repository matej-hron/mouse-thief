<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0b13; }

<body>
<canvas id="screen"></canvas>
<script src="common.js"></script>
<script>
'use strict';
/* ==========================================================================
   PIXEL DEFENSE: a tower defense (part of the PIXEL ARCADE).
   Enemies walk a road across a grid of 16 px tiles; you build towers on the
   free tiles. Everything in the battle lives in grid pixels (400 x 192), so a
   battle plays the same on every screen; only the drawing is shifted.
     1. Setup        2. Towers, enemies, workshop   3. Sprites     4. Maps
     5. Waves        6. Battle logic                7. Sound       8. Battle drawing
     9. Screens      10. Input and main loop
   ========================================================================== */
const VERSION = '1.0.0';
let bgDirty = true;                     // the map picture is drawn once and kept; redrawn on a resize or a new map
const canvas = document.getElementById('screen');
const S = PX.makeScreen(canvas, { H: 240, minW: 400, maxW: 560, onResize: () => { bgDirty = true; } });
const ctx = S.ctx, H = S.H;
const UI = PX.makeUI(S, canvas);
const T = (str, x, y, color = '#fff', size = 1, align = 'left', shadow = null) => PX.drawText(ctx, str, x, y, color, size, align, shadow);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const profile = PX.Profile.load();

/* --- 1. SETUP --------------------------------------------------------------- */
const TILE = 16, COLS = 25, ROWS = 12, GW = COLS * TILE, GH = ROWS * TILE;
const TOP = 14, BAR_Y = TOP + GH, BAR_H = H - BAR_Y;      // a thin bar on top, the map, a bar of buttons below
const gx0 = () => Math.floor((S.W - GW) / 2);             // where the map starts on a wide screen
function rng(seed) { return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hash(n, seed) { const s = Math.sin(n * 127.1 + seed * 311.7) * 43758.5453; return s - Math.floor(s); }
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  return '#' + [n >> 16 & 255, n >> 8 & 255, n & 255].map(v => Math.min(255, Math.round(v * k)).toString(16).padStart(2, '0')).join('');
}
const SAVE_KEY = 'pixelDefense.save';
let save = { maps: {}, shop: {}, seen: {}, music: true, sfx: true, auto: false, speed: 1, tut: false, pick: 0 };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY)) || {}); } catch (e) { /* new player */ }
for (const k of ['maps', 'shop', 'seen']) if (!save[k] || typeof save[k] !== 'object') save[k] = {};
const store = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* private mode */ } };

/* --- 2. TOWERS, ENEMIES, WORKSHOP -------------------------------------------- */
// Every tower has 3 levels (lv) and then a choice of two specializations (spec a / b).

    spec: { a: { name: 'PLAGUE', desc: 'POISON JUMPS TO OTHERS WHEN ONE DIES', dps: 34, dur: 5, dmg: 5, rate: 1.5, range: 60, plague: true },
            b: { name: 'ACID', desc: 'MELTS ARMOR AND BUBBLES', dps: 30, dur: 5, dmg: 5, rate: 1.5, range: 60, corrode: true } } },
  tesla: { name: 'TESLA', color: '#ffe23f', cost: 130, up: [95, 140], specCost: 230, air: true, unlock: 3,

            b: { name: 'LUCKY', desc: 'ENEMIES THAT FALL NEAR IT DROP 40% MORE', income: 48, luck: 0.4, range: 60 } } },
  beacon: { name: 'BEACON', color: '#ff6fb0', cost: 110, up: [80, 120], specCost: 210, air: false, unlock: 'beacon', passive: true,
    desc: 'DOES NOT SHOOT: TOWERS NEAR IT HIT HARDER.',
    lv: [{ buff: 0.15, range: 36 }, { buff: 0.22, range: 40 }, { buff: 0.3, range: 44 }],
    spec: { a: { name: 'FURY', desc: 'TOWERS NEAR IT ALSO SHOOT 25% FASTER', buff: 0.3, haste: 0.25, range: 48 },
            b: { name: 'EAGLE', desc: 'TOWERS NEAR IT SEE FARTHER AND HIT FLYERS', buff: 0.3, far: 0.2, sky: true, range: 48 } } },
};
const TOWER_IDS = Object.keys(TOWERS);
const TARGETS = ['FIRST', 'STRONG', 'LAST'];
// what a tower does, in a few words (for the bar below the map)
function statLine(id, st) {
  if (st.income) return '+' + st.income + ' GOLD A WAVE';
  if (st.buff) return '+' + Math.round(st.buff * 100) + '% DAMAGE NEAR IT';
  if (st.slow) return 'SLOWS ' + Math.round(st.slow * 100) + '%  RANGE ' + Math.round(st.range);
  if (st.dps) return 'POISON ' + Math.round(st.dps) + ' A SEC  RANGE ' + Math.round(st.range);
  return 'HIT ' + Math.round(st.dmg) + '  SPEED ' + st.rate.toFixed(1) + '  RANGE ' + (st.range > 500 ? 'ALL' : Math.round(st.range));
}

// speed: pixels a second; n: how many come in a group; threat: how much harder than its hit points say
// (fast or flying = less time under fire), so a group of them gets fewer hit points.
const ENEMIES = {
  blob:   { name: 'BLOB', speed: 27, n: 9, gap: 0.8, threat: 1, r: 4, color: '#5ad43f', w: 3, tip: '' },

  shell:  { name: 'SHELL', speed: 21, n: 4, gap: 1.6, threat: 1.5, r: 5, color: '#8a9ab8', w: 2, armor: true, tip: 'ARMOR! SNIPERS AND CANNONS BREAK IT' },
  wasp:   { name: 'WASP', speed: 31, n: 6, gap: 0.8, threat: 1.7, r: 4, color: '#ffd23f', w: 1.6, fly: true, frames: 2, tip: 'IT FLIES STRAIGHT TO YOUR CASTLE! CANNONS CAN\'T HIT IT' },
  mender: { name: 'MENDER', speed: 23, n: 2, gap: 2.4, threat: 1.15, r: 4, color: '#f4f4f4', w: 1, heal: true, max: 6, tip: 'IT HEALS ITS FRIENDS. GET IT FIRST!' },

  split:  { name: 'SPLITTER', speed: 21, n: 3, gap: 1.8, threat: 1.7, r: 6, color: '#2ad4c4', w: 1.5, split: true, tip: 'IT BREAKS INTO 3 BLOBS!' },

};

// THE WORKSHOP: the stars you win on the maps buy upgrades that stay. RESET gives all the stars back.
const SHOP = [
  { id: 'gold', name: 'STARTING GOLD', color: '#ffd23f', costs: [1, 2, 3], desc: l => '+' + 40 * l + ' GOLD AT THE START' },
  { id: 'power', name: 'TOWER POWER', color: '#ff5a5a', costs: [1, 1, 2, 2, 3], desc: l => 'TOWERS HIT ' + 6 * l + '% HARDER' },
  { id: 'lives', name: 'EXTRA LIVES', color: '#ff3b5a', costs: [1, 1, 2], desc: l => '+' + 2 * l + ' LIVES' },
  { id: 'bargain', name: 'BARGAIN', color: '#5ad43f', costs: [1, 2, 2], desc: l => 'UPGRADES COST ' + 6 * l + '% LESS' },
  { id: 'bounty', name: 'BOUNTY', color: '#e0b030', costs: [1, 2, 2], desc: l => 'ENEMIES DROP ' + 6 * l + '% MORE GOLD' },
  { id: 'recharge', name: 'QUICK CHARGE', color: '#2ad4c4', costs: [1, 1, 2], desc: l => 'METEOR AND FREEZE ' + 12 * l + '% SOONER' },
  { id: 'meteor', name: 'BIG METEOR', color: '#ff7a1a', costs: [1, 1, 2], desc: l => 'METEOR HITS ' + 30 * l + '% HARDER' },
  { id: 'freeze', name: 'LONG FREEZE', color: '#8adcff', costs: [1, 2], desc: l => 'FREEZE LASTS ' + l + ' SEC LONGER' },
  { id: 'mint', name: 'MINT TOWER', color: '#e0b030', costs: [3], desc: () => 'NEW TOWER: PAYS GOLD EVERY WAVE' },
  { id: 'beacon', name: 'BEACON TOWER', color: '#ff6fb0', costs: [4], desc: () => 'NEW TOWER: MAKES TOWERS STRONGER' },
];
const SHOPBY = Object.fromEntries(SHOP.map(s => [s.id, s]));
const shopLv = id => clamp(save.shop[id] | 0, 0, SHOPBY[id].costs.length);
const mapRec = id => save.maps[id] || (save.maps[id] = { stars: 0, lives: 0, endless: 0, medals: 0 });
const mapsBeaten = () => MAPS.filter(m => (mapRec(m.id).stars | 0) > 0).length;
const mapOpen = i => i === 0 || (mapRec(MAPS[i - 1].id).stars | 0) > 0;
const starsEarned = () => MAPS.reduce((n, m) => n + (mapRec(m.id).stars | 0) + (mapRec(m.id).medals | 0), 0);
const starsSpent = () => SHOP.reduce((n, s) => n + s.costs.slice(0, shopLv(s.id)).reduce((a, b) => a + b, 0), 0);
const starsFree = () => starsEarned() - starsSpent();
const towerOpen = id => typeof TOWERS[id].unlock === 'string' ? shopLv(TOWERS[id].unlock) > 0 : mapsBeaten() >= TOWERS[id].unlock;
const towersAvail = () => TOWER_IDS.filter(towerOpen);

/* --- 3. SPRITES (pixel art drawn in code) ----------------------------------- */
function sprite(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d')); return c; }
// rows of characters ('.' = empty), pal: character -> color; a dark outline is added all around
function art(rows, pal, outline = '#15121c') {
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  return sprite(w + 2, h + 2, g => {
    if (outline) { g.fillStyle = outline; rows.forEach((row, y) => [...row].forEach((ch, x) => { if (ch !== '.') { g.fillRect(x, y + 1, 3, 1); g.fillRect(x + 1, y, 1, 3); } })); }
    rows.forEach((row, y) => [...row].forEach((ch, x) => { if (ch !== '.' && pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(x + 1, y + 1, 1, 1); } }));
  });
}
const flip = c => sprite(c.width, c.height, g => { g.translate(c.width, 0); g.scale(-1, 1); g.drawImage(c, 0, 0); });
const EYES = { w: '#ffffff', k: '#15121c' };
const ENEMY_ART = {
  blob: [[['..####..', '.#l####.', '##wk#wk#', '##wk#wk#', '########', 'd######d', '.dddddd.']], { '#': '#5ad43f', l: '#b8f89a', d: '#2f8a2a' }],
  dash: [[['..####...', '.l#####w.', 'll####wk#', '.########', '..#####d.', '.d..d.d..']], { '#': '#ff8a1f', l: '#ffd23f', d: '#b0500a' }],
  mite: [[['.###.', '#k#k#', '#####', 'd.d.d']], { '#': '#ff5a8a', d: '#a02050' }],
  shell: [[['..ssssss..', '.sSsssSss.', 'ssssSsssss', 'sSssssssSs', 'ssssssssss', '.ggwkgwkg.', '.gggggggg.', '..d.dd.d..']], { s: '#8a9ab8', S: '#d4e0f4', g: '#6a5a80', d: '#3a2f4a' }],
  wasp: [[['...WW.WW..', '...WW.WW..', '.kyykyy##.', 'kkyykyy#wk', '.kyykyy##.'], ['..........', '.WWW.WWW..', '.kyykyy##.', 'kkyykyy#wk', '.kyykyy##.']], { y: '#ffd23f', '#': '#ffb020', W: '#d8f4ff' }],
  mender: [[['...rr...', '..rrrr..', '...rr...', '.######.', '##wk#wk#', '########', 'p######p', '.pppppp.']], { '#': '#f4f4f4', p: '#b8a8d0', r: '#3fd45a' }],
  ward: [[['..####..', '.######.', '#wk##wk#', '########', '##hhhh##', '########', 'd######d', '.dd..dd.']], { '#': '#9a5ae0', d: '#5a2a9a', h: '#ffd23f' }],
  split: [[['...#####...', '..#l#####..', '.#l#######.', '###wk#wk###', '###########', '#####wk####', '###########', 'd#########d', '.dd.ddd.dd.']], { '#': '#2ad4c4', l: '#b8fff4', d: '#158a80' }],
  boss: [[['....c...cc...c....', '....cc.cccc.cc....', '....ccjccccjcc....', '...############...', '..##ll##########..', '.##l#############.', '.###kk####kk#####.',
           '####wwk###wwk#####', '####wwk###wwk#####', '##################', '####kkkkkkkkkk####', '#####tktktktk#####', '##################', 'd################d', '.dd############dd.', '...dddddddddddd...']],
         { '#': '#c4283c', l: '#ff8a8a', d: '#7a1424', c: '#ffd23f', j: '#2ad4c4', t: '#ffffff' }],
};
// SPR_E[type][0 = facing right, 1 = facing left][frame]
const SPR_E = {};
for (const k in ENEMY_ART) { const [frames, pal] = ENEMY_ART[k], right = frames.map(f => art(f, Object.assign({}, EYES, pal))); SPR_E[k] = [right, right.map(flip)]; }
const STAR_ROWS = ['....#....', '...###...', '#########', '.#######.', '..#####..', '.###.###.', '.#.....#.'];
const SPR_STAR = art(STAR_ROWS, { '#': '#ffd23f' }, '#7a5a10'), SPR_STAR_OFF = art(STAR_ROWS, { '#': '#2c2748' }, '#15121c'), SPR_MEDAL = art(STAR_ROWS, { '#': '#2ad4c4' }, '#0c5a54');
const SPR_COIN = art(['.###.', '#l###', '#l###', '####d', '.#dd.'], { '#': '#ffd23f', l: '#fff6c0', d: '#b87a10' });
const SPR_LOCK = art(['..###..', '.#...#.', '.#...#.', '#######', '###k###', '###k###', '#######'], { '#': '#9a92b8', k: '#15121c' });
const ICONS = {
  meteor: [['......##', '.....###', '...o###.', '..oooo#.', '.oorroo.', '.orrrro.', '.orrrro.', '..oooo..'], { '#': '#ffd23f', o: '#ff7a1a', r: '#c4283c' }],
  freeze: [['...#...', '.#.#.#.', '..###..', '#######', '..###..', '.#.#.#.', '...#...'], { '#': '#b8f0ff' }],
};
// A tower: a stone plate, its own body, and little yellow pips for the level (a red or blue bar for a specialization).
const towerCache = {};
function towerSprite(id, lvl = 0, spec = null) {
  const key = id + lvl + (spec || '');
  if (towerCache[key]) return towerCache[key];
  return (towerCache[key] = sprite(16, 16, g => {
    const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x, y, w, h); }, ol = '#15121c', c = TOWERS[id].color, dk = shade(c, 0.62), lt = shade(c, 1.35);
    R(1, 10, 14, 5, ol); R(2, 9, 12, 7, ol); R(2, 10, 12, 4, '#6a6478'); R(2, 10, 12, 1, '#a8a2b8'); R(3, 14, 10, 1, '#3f394c');
    switch (id) {
      case 'dart': R(4, 3, 8, 8, ol); R(5, 4, 6, 6, c); R(5, 4, 6, 1, lt); R(5, 9, 6, 1, dk); R(7, 6, 2, 2, ol); break;
      case 'cannon': R(4, 4, 8, 7, ol); R(3, 5, 10, 5, ol); R(4, 5, 8, 5, c); R(5, 5, 6, 1, '#9a9ab0'); R(4, 9, 8, 1, '#33333f'); R(6, 6, 4, 3, '#2a2a34'); break;
      case 'frost': R(7, 0, 2, 12, ol); R(5, 2, 6, 8, ol); R(4, 4, 8, 4, ol); R(7, 1, 2, 10, c); R(6, 3, 4, 6, c); R(5, 5, 6, 2, c); R(7, 2, 1, 5, '#ffffff'); R(6, 5, 1, 2, '#ffffff'); R(9, 7, 1, 3, dk); break;
      case 'sniper': R(5, 1, 6, 10, ol); R(6, 2, 4, 9, c); R(6, 2, 4, 1, lt); R(6, 6, 4, 1, dk); R(6, 9, 4, 1, dk); R(7, 3, 2, 2, '#d8f4ff'); break;
      case 'venom': R(3, 5, 10, 6, ol); R(4, 4, 8, 7, ol); R(4, 6, 8, 4, '#4a3a5a'); R(5, 5, 6, 2, c); R(6, 5, 2, 1, lt); R(4, 9, 8, 1, '#2a2034'); R(6, 2, 1, 1, c); R(9, 1, 2, 2, c); break;
      case 'tesla': R(6, 4, 4, 7, ol); R(7, 4, 2, 7, '#8a84a0'); R(4, 6, 8, 1, '#c8a030'); R(4, 8, 8, 1, '#c8a030'); R(5, 0, 6, 5, ol); R(6, 1, 4, 3, c); R(6, 1, 2, 1, '#ffffff'); break;
      case 'mint': R(3, 5, 10, 6, ol); R(4, 6, 8, 4, c); R(4, 6, 8, 1, lt); R(4, 9, 8, 1, dk); R(5, 0, 6, 6, ol); R(6, 1, 4, 4, '#ffd23f'); R(6, 1, 1, 3, '#fff6c0'); R(8, 2, 1, 2, '#b87a10'); break;
      case 'beacon': R(6, 3, 4, 8, ol); R(7, 4, 2, 7, '#a8a2b8'); R(3, 2, 10, 4, ol); R(4, 3, 8, 2, c); R(4, 3, 8, 1, lt); R(6, 0, 4, 3, ol); R(7, 0, 2, 2, '#ffffff'); break;
    }
    if (lvl >= 3) R(4, 12, 8, 2, spec === 'a' ? '#ff5a5a' : '#4ad4ff');
    else for (let i = 0; i <= lvl; i++) R(4 + i * 3, 12, 2, 2, '#ffd23f');
  }));
}

/* --- 4. MAPS ------------------------------------------------------------------ */
// paths: lists of [tile x, tile y] corners (x -1 = comes in from the left edge). intro: the first wave each enemy shows up.
// hp, gold: how tough the waves are and how much they pay, next to the first map. block: how many tiles are scenery.

    line += 6; row('TIP: ' + TIPS[(b.wave + b.kills) % TIPS.length], '#ffd23f');
    if (starsFree() > 0) row('YOU HAVE ' + starsFree() + ' STARS FOR THE WORKSHOP', '#5ad43f');
  }
  if (r.fresh) row(r.fresh + (r.fresh > 1 ? ' NEW STARS' : ' NEW STAR') + ' FOR THE WORKSHOP,  ★ +' + r.pay + ' FOR THE ARCADE', '#ffd23f');
  const next = r.won && b.mi + 1 < MAPS.length;
  if (next) { if (UI.button('next', Math.round(cx - bw * 1.5 - 4), by, bw, 24, 'NEXT MAP', { accent: '#5ad43f', size: 1 })) { save.pick = b.mi + 1; store(); startBattle(b.mi + 1, false); return; } }
  else if (UI.button('shop', Math.round(cx - bw * 1.5 - 4), by, bw, 24, 'WORKSHOP', { accent: '#ffd23f', size: 1 })) { shopFrom = 'maps'; toMenu('shop'); return; }
  if (UI.button('again', Math.round(cx - bw / 2), by, bw, 24, r.won ? 'PLAY AGAIN' : 'RETRY', { accent: r.won ? '#8a7ad8' : '#5ad43f', size: 1 })) { startBattle(b.mi, b.endless); return; }
  if (UI.button('menu', Math.round(cx + bw / 2 + 4), by, bw, 24, 'MAPS', { size: 1 }) || UI.back) toMenu('maps');
}
function drawBattle() {
  const b = B;
  drawWorld(); drawTop(); drawBar(); drawBanner(); drawTut();
  if (b.over) { if (b.overT > 1 && b.result) drawResult(); else T(b.over === 'won' ? 'VICTORY!' : b.endless ? 'GAME OVER' : 'THE CASTLE FELL!', S.W / 2, 90, b.over === 'won' ? '#ffd23f' : '#ff6b6b', 4, 'center', '#15121c'); }
  else if (paused) drawPause();
  else if (UI.back) { if (b.aim) b.aim = null; else if (b.sel) b.sel = null; else setPause(true); }
}

/* --- 10. INPUT AND MAIN LOOP ------------------------------------------------------ */
// A tap on the map: pick a tile (a free one opens the build menu, a tower its own menu), or drop the meteor.
function mapTap(x, y) {
  const b = B;
  if (b.over) return;
  if (b.aim) { if (x > -30 && x < GW + 30) useMeteor(clamp(x, 0, GW), clamp(y, 0, GH)); return; }
  const tx = Math.floor(x / TILE), ty = Math.floor(y / TILE);
  b.sellAsk = null;
  if (tx < 0 || tx >= COLS || ty < 0 || ty >= ROWS) { b.sel = null; return; }
  const c = b.grid[tx + ty * COLS], same = b.sel && b.sel.tx === tx && b.sel.ty === ty;
  b.cur = { tx, ty };
  if (c === 0 || c === 3) { b.sel = same ? null : { tx, ty }; sfx('tap'); if (b.tut === 0 && c === 0) b.tut = 1; }
  else { if (!b.sel) b.tip = { text: c === 1 ? "CAN'T BUILD ON THE ROAD" : "CAN'T BUILD THERE", t: 1 }; b.sel = null; }
}
const inBattle = () => state === 'battle' && !paused && !B.over;
UI.onDown = (e, x, y) => {
  PX.Sound.unlock(); showCur = false;
  if (inBattle() && UI.downId === null && y >= TOP && y < BAR_Y) mapTap(x - gx0(), y - TOP);
};
function moveCur(dx, dy) { B.cur = { tx: clamp(B.cur.tx + dx, 0, COLS - 1), ty: clamp(B.cur.ty + dy, 0, ROWS - 1) }; showCur = true; }
function curTap() { showCur = true; mapTap(B.cur.tx * TILE + 8, B.cur.ty * TILE + 8); }
const ARROWS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
window.addEventListener('keydown', e => {
  PX.Sound.unlock();
  if (e.code === 'Escape') { UI.back = true; return; }
  if (e.code === 'KeyM') { save.music = !save.music; store(); Music.bus(); return; }
  if (state !== 'battle' || B.over) return;
  if (e.code === 'KeyP') { setPause(!paused); return; }
  if (paused) return;
  const t = selTower();
  if (ARROWS[e.code]) { moveCur(...ARROWS[e.code]); e.preventDefault(); }
  else if (e.code === 'Enter') curTap();
  else if (e.code === 'Space') { callWave(); e.preventDefault(); }
  else if (e.code === 'KeyF') setSpeed();
  else if (e.code === 'KeyA') setAuto();
  else if (e.code === 'KeyQ') toggleAim();
  else if (e.code === 'KeyW') useFreeze();
  else if (/^Digit[1-8]$/.test(e.code)) {                   // 1-8: build that tower here; on a tower: 1 upgrades (or picks the first specialization), 2 the second
    const n = +e.code.slice(5) - 1;
    if (t) { if (t.lvl < 2 && n === 0) upgradeTower(t); else if (t.lvl === 2 && n < 2) upgradeTower(t, 'ab'[n]); }
    else if (B.sel && towersAvail()[n] && buildTower(B.sel.tx, B.sel.ty, towersAvail()[n])) B.sel = null;
  }
  else if (t && e.code === 'KeyU') { if (t.lvl < 2) upgradeTower(t); }
  else if (t && e.code === 'KeyT') cycleTarget(t);
  else if (t && e.code === 'KeyX') askSell(t);
});
document.addEventListener('visibilitychange', () => { if (document.hidden && inBattle()) setPause(true); });

let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  UI.begin();
  if (state === 'battle') {
    if (!paused) { acc += dt; let n = 0; while (acc >= STEP && n < 6) { for (let k = B.speed; k > 0; k--) stepBattle(STEP); acc -= STEP; n++; } if (n === 6) acc = 0; }
    drawBattle();
  } else {
    if (!B || !B.demo || (B.wave >= 12 && B.left <= 0)) startDemo();
    stepBattle(STEP); drawWorld();
    ctx.fillStyle = state === 'title' ? 'rgba(8,6,14,0.5)' : 'rgba(8,6,14,0.74)'; ctx.fillRect(0, 0, S.W, H);
    if (state === 'title') drawTitle(); else if (state === 'maps') drawMaps(); else drawShop();
  }
  UI.end();
  S.blit();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// Controller: in the menus the stick picks a button. In a battle it moves a tile cursor; with a build or tower menu open it picks a button again.
let padT = 0;
PX.Pad.setup({
  title: 'Pixel Defense: controller', ui: UI, menu: () => state !== 'battle' || paused || !!B.over || !!B.sel,
  phone: { stick: 'CURSOR', dpad: true, buttons: [['A', 'PICK'], ['B', 'BACK'], ['X', 'NEXT WAVE'], ['Y', 'METEOR']] },
  onPlay(h, n, dt, edge) {
    if (n > 0 || !inBattle()) return;
    const dx = h.left ? -1 : h.right ? 1 : 0, dy = h.up ? -1 : h.down ? 1 : 0;
    if (dx || dy) { if ((padT -= dt) <= 0) { padT = padT < -0.5 ? 0.3 : 0.11; moveCur(dx, dy); } } else padT = -1;
    if (edge('A')) curTap();
    if (edge('B')) { if (B.aim) B.aim = null; else showCur = true; }
    if (edge('X')) callWave();
    if (edge('Y')) { showCur = true; toggleAim(); }
    if (edge('LB') || edge('LT')) useFreeze();
    if (edge('RB') || edge('RT')) setSpeed();
    if (edge('START')) setPause(true);
  },
  help: [['STICK|D-PAD', 'MOVE THE CURSOR'], ['A', 'PICK A TILE OR A TOWER'], ['X', 'NEXT WAVE'], ['Y', 'METEOR (THEN A)'], ['LB|LT', 'FREEZE'], ['RB|RT', 'SPEED'], ['START', 'PAUSE'],
         ['STICK|D-PAD', 'MENUS: PICK A BUTTON'], ['A', 'MENUS: OK'], ['B', 'MENUS: BACK']],
});
</script>
