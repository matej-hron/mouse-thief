# The backend (api/): tests on every pull request that changes it; on main, the release:
# database migrations first, then the Worker (the order the README asks for).
# Needs the repository secret CLOUDFLARE_API_TOKEN (Edit Cloudflare Workers template + D1 Edit).
# Secrets already on the Worker (ADMIN_KEY, VAPID_PRIVATE_KEY) are kept by a deploy.
name: API

on:
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/api.yml']
  pull_request:
    paths: ['api/**', '.github/workflows/api.yml']
  workflow_dispatch: # Actions -> API -> Run workflow: deploy main by hand

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: api

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # package-lock.json records the tarballs from a private npm mirror; GitHub's runners fetch the same
      # versions (same integrity hashes) from the public registry instead. Only this checkout is changed.
      - name: Use the public npm registry
        run: sed -i -E 's#https://[a-z0-9.-]+/[^"]*/npm/registry/#https://registry.npmjs.org/#' package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm test
      - name: Apply database migrations
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npx wrangler d1 migrations apply pixel-arcade --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy the Worker
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
