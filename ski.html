<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<meta name="theme-color" content="#0d0b13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Pixel Ski</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0b13; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #screen { position: fixed; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
  #code { position: fixed; display: none; box-sizing: border-box; text-align: center; text-transform: uppercase;
          font: bold 32px ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.3em; padding: 0 0 0 0.3em;
          color: #111; background: #fbf9f3; border: 3px solid #111; border-radius: 0; outline: none; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<input id="code" maxlength="4" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" inputmode="text" aria-label="Room code">
<script src="common.js"></script>
<script>
'use strict';
/* ==========================================================================
   PIXEL SKI: downhill skiing (part of the PIXEL ARCADE).
   The camera sits behind the skier and the slope is drawn in perspective, so it looks 3D.
   10 maps (mountains), each with 3 runs: GREEN (easy), RED and BLACK (hard).
   Survive to the bottom: hit a tree, a rock, a snowman, another skier or the safety net
   and you crash, and the run is over. Off the piste (past the blue line) is deep powder: slow.
   Controls like a phone ski game: a slider on the left steers (left / right), a slider on the
   right sets the speed (up: tuck, faster; down: brake), and a JUMP button (in the air: flips).
   Every mountain has its own downhill things: big ramps, boost pads, cliff drops, ice sheets,
   rolling snowballs, an avalanche behind you. 3 stars per run, a daily bonus, a shop with abilities.
     1. Setup   2. Maps and runs   3. Building a run   4. Sprites   5. Skiing
     6. Drawing   7. Screens   8. Input   9. Main loop
   ========================================================================== */

/* --- 1. SETUP --------------------------------------------------------------- */
const VERSION = '2.1.0';
const SAVE_KEY = 'pixelSki.save';
const save = { best: {}, done: {}, sfx: true, seenHelp: false, coins: 0, up: {}, skis: 'green', helmet: 'yellow', owned: { green: 1, yellow: 1 }, runStars: {}, daily: '' };
try {
  const s = JSON.parse(localStorage.getItem(SAVE_KEY));
  if (s) { Object.assign(save, s); save.best = Object.assign({}, s.best); save.done = Object.assign({}, s.done); save.up = Object.assign({}, s.up); save.owned = Object.assign({ green: 1, yellow: 1 }, s.owned); save.coins = s.coins | 0; save.runStars = Object.assign({}, s.runStars); }
} catch (e) { /* new player */ }
const store = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* private mode */ } };
// --- the SKI SHOP: coins (picked up on the slopes, and a bonus at the bottom) buy upgrades and looks ---------
const UPGRADES = [
  // tab 'up': UPGRADES (always on)
  { id: 'speed', tab: 'up', name: 'FAST SKIS', desc: 'HIGHER TOP SPEED', col: '#ff8a2a', max: 5, cost: [40, 100, 200, 400, 750] },
  { id: 'start', tab: 'up', name: 'PUSH START', desc: 'FASTER OUT OF THE START GATE', col: '#5ad43f', max: 5, cost: [30, 80, 160, 300, 550] },
  { id: 'edge', tab: 'up', name: 'SHARP EDGES', desc: 'TURN FASTER, GRIP ON ICE', col: '#7ad8ff', max: 5, cost: [40, 100, 200, 400, 750] },
  { id: 'air', tab: 'up', name: 'BIG AIR', desc: 'FLY HIGHER OFF THE RAMPS', col: '#b07aff', max: 5, cost: [30, 80, 160, 300, 550] },
  { id: 'magnet', tab: 'up', name: 'COIN MAGNET', desc: 'GRAB COINS FROM FURTHER AWAY', col: '#ffd23f', max: 5, cost: [30, 80, 160, 300, 550] },
  // tab 'ab': ABILITIES
  { id: 'jump', tab: 'ab', name: 'SUPER JUMP', desc: 'THE JUMP BUTTON JUMPS HIGHER (OVER SNOWMEN!)', col: '#5ad43f', max: 5, cost: [40, 100, 200, 400, 750] },
  { id: 'double', tab: 'ab', name: 'DOUBLE JUMP', desc: 'JUMP AGAIN IN THE AIR', col: '#7ad8ff', max: 1, cost: [300] },
  { id: 'trick', tab: 'ab', name: 'TRICK MASTER', desc: 'FASTER FLIPS, MORE COINS FOR TRICKS', col: '#ff6bd0', max: 3, cost: [100, 300, 700] },
  { id: 'turbo', tab: 'ab', name: 'TURBO', desc: 'A ROCKET BOOST BUTTON (PER LEVEL, EACH RUN)', col: '#ff5ad0', max: 3, cost: [120, 350, 800] },
  { id: 'slowmo', tab: 'ab', name: 'SLOW-MO', desc: 'SLOW DOWN TIME 3 S (PER LEVEL, EACH RUN)', col: '#4aa8ff', max: 3, cost: [120, 350, 800] },
  { id: 'helmet', tab: 'ab', name: 'HARD HELMET', desc: 'SURVIVE A CRASH (PER LEVEL, EACH RUN)', col: '#e8303a', max: 3, cost: [150, 400, 900] },
];
// stars: need that many run stars (3 per run: finish, coins, time) to wear them
const LOOKS = [
  { id: 'green', kind: 'skis', name: 'GREEN', col: '#3fbe4a', cost: 0 }, { id: 'redski', kind: 'skis', name: 'RED', col: '#e8303a', cost: 30 },
  { id: 'blueski', kind: 'skis', name: 'BLUE', col: '#2a7fd4', cost: 30 }, { id: 'goldski', kind: 'skis', name: 'GOLD', col: '#ffd23f', cost: 250 },
  { id: 'rainbow', kind: 'skis', name: 'RAINBOW', col: 'rainbow', cost: 500 }, { id: 'starski', kind: 'skis', name: 'STAR', col: 'star', cost: 0, stars: 30 },
  { id: 'yellow', kind: 'helmet', name: 'YELLOW', col: '#ffd23f', cost: 0 }, { id: 'white', kind: 'helmet', name: 'WHITE', col: '#f4f4f4', cost: 30 },
  { id: 'black', kind: 'helmet', name: 'BLACK', col: '#2a2a33', cost: 30 }, { id: 'goldhelm', kind: 'helmet', name: 'GOLD', col: '#ffc020', cost: 250 },
  { id: 'chrome', kind: 'helmet', name: 'CHROME', col: 'chrome', cost: 500 }, { id: 'crown', kind: 'helmet', name: 'CROWN', col: 'crown', cost: 0, stars: 60 },
];
const starCount = () => Object.values(save.runStars).reduce((a, b) => a + (b & 1) + (b >> 1 & 1) + (b >> 2 & 1), 0);
const today = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
const lvl = id => save.up[id] | 0;
const lookCol = (id, t) => {
  const L = LOOKS.find(l => l.id === id) || LOOKS[0];
  if (L.col === 'rainbow') return 'hsl(' + Math.round(t * 200) % 360 + ',90%,55%)';
  if (L.col === 'chrome') return Math.floor(t * 4) % 2 ? '#e8eef8' : '#a8b4c8';
  if (L.col === 'star') return Math.floor(t * 6) % 2 ? '#ffffff' : '#ffd23f';
  if (L.col === 'crown') return Math.floor(t * 3) % 2 ? '#ffd23f' : '#ffb000';
  return L.col;
};
const profile = PX.Profile.get();
const MY_COLOR = PX.AVATAR_COLORS[profile.avatar.color];

const canvas = document.getElementById('screen');
const S = PX.makeScreen(canvas, { H: 240, minW: 400, maxW: 560 });
const ctx = S.ctx, H = S.H;
const UI = PX.makeUI(S, canvas);
const T = (str, x, y, color = '#fff', size = 1, align = 'left', shadow = null) => PX.drawText(ctx, str, x, y, color, size, align, shadow);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, k) => a + (b - a) * k;
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hex(c) { const n = parseInt(c.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
const mixCache = new Map();
function mix(a, b, k) {
  k = Math.round(k * 40) / 40;
  const key = a + b + k; let c = mixCache.get(key);
  if (!c) { const x = hex(a), y = hex(b); c = '#' + x.map((v, i) => clamp(Math.round(v + (y[i] - v) * k), 0, 255).toString(16).padStart(2, '0')).join(''); if (mixCache.size > 4000) mixCache.clear(); mixCache.set(key, c); }
  return c;
}
function shade(c, k) { return '#' + hex(c).map(v => clamp(Math.round(v * k), 0, 255).toString(16).padStart(2, '0')).join(''); }
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return [c, g]; }
// a time like on the image: 00:18.190
const fmtTime = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(Math.floor(s % 60)).padStart(2, '0') + '.' + String(Math.floor(s * 1000 % 1000)).padStart(3, '0');

// the road renderer: one segment is 3 m of slope (so the snow rushes past)
const SEG = 200, METRE = SEG / 3, ROAD_W = 1800, CAM_H = 900, CAM_DEPTH = 0.84, DRAW = 130;
const PLAYER_Z = CAM_H * CAM_DEPTH * 1.6;                // how far ahead of the camera the skier is
const HZ = 92;                                           // the horizon (screen y)
const FX = 104, FY = 195;                                // screen pixels per unit of projected width / height

/* --- 2. MAPS AND RUNS ------------------------------------------------------------ */
// each map: a look (sky, snow, trees, extras) and how hard it is (d: 0 easy .. 1 hardest)
const MAPS = [
  { id: 'meadow', feat: ['bigramp'], featName: 'BIG RAMPS', name: 'SNOWY MEADOW', sky: ['#4aa8f4', '#a8dcff'], mtn: ['#8aa8d0', '#dfeaff'], hill: '#4a7a6a', snow: '#f4f8ff', off: '#dfe8f6', tree: '#2f7a3a', d: 0.0, sun: '#fff6c8' },
  { id: 'pines', feat: ['logs', 'bigramp'], featName: 'FALLEN TREES', name: 'PINE FOREST', sky: ['#5aa0e0', '#c8e8ff'], mtn: ['#7a90b8', '#e8f0ff'], hill: '#2f5a44', snow: '#f0f6ff', off: '#d8e4f2', tree: '#1f5a2a', d: 0.1, sun: '#fff6c8', forest: true },
  { id: 'night', feat: ['boost'], featName: 'BOOST PADS', name: 'NIGHT RACE', sky: ['#05060f', '#1a2240'], mtn: ['#1a2238', '#5a6688'], hill: '#0f1a1e', snow: '#c8d0dc', off: '#8a94a8', tree: '#16301e', d: 0.2, night: true, lights: true, moon: true },
  { id: 'lake', feat: ['icesheet'], featName: 'ICE SHEETS', name: 'FROZEN LAKE', sky: ['#9ac0e0', '#e8f4ff'], mtn: ['#a0b4cc', '#f4f8ff'], hill: '#6a8a9a', snow: '#eef6ff', off: '#d4e6f4', tree: '#3a6a5a', d: 0.3, ice: 2.5, sun: '#ffffff' },
  { id: 'sunset', feat: ['cliff'], featName: 'CLIFF DROPS', name: 'SUNSET RIDGE', sky: ['#5a3a8a', '#ffa86a'], mtn: ['#6a4a7a', '#ffd0b0'], hill: '#4a2f4a', snow: '#ffe8e0', off: '#f0c8c0', tree: '#2a3a2a', d: 0.4, sun: '#ffdc6a', low: true },
  { id: 'blizzard', feat: ['balls'], featName: 'SNOWBALLS', name: 'BLIZZARD PASS', sky: ['#9aa4b0', '#d0d6de'], mtn: ['#b8c0cc', '#e4e8ee'], hill: '#8a96a4', snow: '#f0f2f6', off: '#dce0e8', tree: '#4a6058', d: 0.5, fog: '#d8dde4', snowfall: 3 },
  { id: 'canyon', feat: ['icesheet', 'cliff'], featName: 'ICE CLIFFS', name: 'ICE CANYON', sky: ['#2a6ab0', '#8ad0f0'], mtn: ['#3a8ac0', '#c8f4ff'], hill: '#2a6a9a', snow: '#e4f6ff', off: '#b4dcf0', tree: '#2a5a6a', d: 0.6, ice: 1.5, narrow: 0.15, sun: '#ffffff' },
  { id: 'volcano', feat: ['balls', 'boost'], featName: 'LAVA BOULDERS', name: 'VOLCANO SLOPE', sky: ['#2a0a14', '#a03a1a'], mtn: ['#3a1a1a', '#ff6a2a'], hill: '#2a1414', snow: '#e8dcd8', off: '#a8908c', tree: '#2a2420', d: 0.7, rocks: 2, lava: true, night: true },
  { id: 'aurora', feat: ['bigramp', 'boost'], featName: 'AURORA JUMPS', name: 'AURORA PEAK', sky: ['#03050c', '#0e2030'], mtn: ['#12203a', '#4a6a8a'], hill: '#0a1418', snow: '#c0d8e0', off: '#80a0b0', tree: '#10281c', d: 0.85, night: true, aurora: true, lights: true, snowfall: 1 },
  { id: 'summit', feat: ['avalanche', 'cliff', 'balls'], featName: 'AVALANCHE!', name: 'THE SUMMIT', sky: ['#1a3a8a', '#7ab8ff'], mtn: ['#ffffff', '#ffffff'], hill: '#c8d8f0', snow: '#ffffff', off: '#e4ecf8', tree: '#3a5a4a', d: 1.0, clouds: true, narrow: 0.1, sun: '#ffffff', snowfall: 1 },
];
const LEVELS = [
  { id: 'green', name: 'GREEN', color: '#3fbe4a', d: 0, len: 290, stars: 2 },
  { id: 'red', name: 'RED', color: '#e8303a', d: 0.5, len: 350, stars: 4 },
  { id: 'black', name: 'BLACK', color: '#22222a', d: 1, len: 410, stars: 6 },
];
const runKey = (m, l) => MAPS[m].id + '_' + LEVELS[l].id;
// GREEN of map 1 is open. Finish a run and the next one on that mountain opens; finish BLACK and the next mountain opens.
function isOpen(m, l) {
  if (l > 0) return !!save.done[runKey(m, l - 1)];
  return m === 0 || !!save.done[runKey(m - 1, 2)];
}

/* --- 3. BUILDING A RUN ------------------------------------------------------------ */
// a run is a list of segments; each has a curve, a steepness (how fast you go), how wide the piste is,
// an elevation for drawing (crests and dips), things on the snow (obstacles) and decor beside the piste
let R = null;          // the run being skied
function buildRun(m, l) {
  const map = MAPS[m], lev = LEVELS[l], rnd = mulberry(1000 + m * 37 + l * 7), has = f => map.feat.includes(f);
  const diff = clamp(map.d * 0.55 + lev.d * 0.6, 0, 1.15);   // 0 (map 1 green) .. 1.15 (the summit, black)
  const segs = [];
  const add = (n, curve, steep, width) => {
    const c0 = segs.length ? segs[segs.length - 1].curve : 0, s0 = segs.length ? segs[segs.length - 1].steep : steep, w0 = segs.length ? segs[segs.length - 1].w : width;
    for (let i = 0; i < n; i++) {
      const k = Math.min(1, i / Math.min(19, n * 0.4)), e = k * k * (3 - 2 * k);   // ease into the new values
      segs.push({ curve: lerp(c0, curve, e), steep: lerp(s0, steep, e), w: lerp(w0, width, e), objs: [], deco: [], y: 0, x: 0 });
    }
  };
  const baseW = 1.25 - diff * 0.35 - (map.narrow || 0);
  add(48, 0, 0.26, baseW + 0.2);                                         // the start: wide
  const runLen = Math.round(lev.len * 1.6) + m * 32;                      // later mountains are bigger
  const cliffs = [];
  let sec = 0;
  while (segs.length < runLen) {
    sec++;
    const r = rnd(), n = Math.round((22 + rnd() * 34) * 1.6);
    const curve = (rnd() < 0.5 ? -1 : 1) * (1.5 + rnd() * (2 + diff * 4.5)) * 0.6;
    const steep = 0.2 + rnd() * (0.1 + diff * 0.14);
    const w = baseW + (rnd() - 0.5) * 0.3;
    // a CLIFF DROP: a lip, then a wall so steep you fly off it
    if (segs.length > 90 && (has('cliff') ? sec % 3 === 0 : m >= 1 && sec % 8 === 4)) {
      add(12, 0, 0.2, w + 0.15); cliffs.push(segs.length - 1); add(42, 0, 0.62, w + 0.15); add(18, 0, 0.24, w); continue;
    }
    if (r < 0.25) add(n, 0, steep, w);
    else if (r < 0.6) add(n, curve, steep, w);
    else if (r < 0.8) { add(Math.round(n * 0.6), curve, steep, w); add(Math.round(n * 0.6), -curve, steep, w); }   // an S-bend
    else if (r < 0.9) add(Math.round(n * 0.7), curve * 0.3, 0.32 + diff * 0.12, w * 0.9);                       // a steep wall
    else add(n, curve * 0.5, 0.15, w + 0.15);                                                                      // a flatter bit
    // ICE SHEETS: long, slippery and fast
    if (has('icesheet') && sec % 2 === 0) for (let k = segs.length - Math.round(n * 0.7); k < segs.length; k++) segs[k].sheet = true;
  }
  add(64, 0, 0.17, baseW + 0.3);                                          // the finish area
  // elevation: it really goes downhill (steeper = drops faster), so the slope falls away in front of you
  let y = 0, dy = 0;
  for (const s of segs) { s.y = y; dy = lerp(dy, -s.steep * SEG * 0.9, 0.08); y += dy; }
  for (const c of cliffs) {
    segs[c].cliff = true;
    for (let k = c - 14; k < c + 60 && k < segs.length; k++) segs[k].noObj = true;
    segs[c - 16].deco.push({ kind: 'warn', side: -1, off: 0.25 }, { kind: 'warn', side: 1, off: 0.25 });
  }
  const start = 64, end = segs.length - 72;
  const free = (a, b) => { for (let k = a; k <= b; k++) if (!segs[k] || segs[k].noObj) return false; return true; };
  // obstacles and downhill things: more and closer together on harder runs and bigger mountains
  // SET PIECES, the mountain's downhill things, at regular places down the run (its own thing comes most often)
  const pieces = [];
  if (has('bigramp')) pieces.push('bigramp', 'bigramp');
  if (has('boost')) pieces.push('boostrow', 'boostrow');
  if (has('logs')) pieces.push('logrow', 'logrow');
  pieces.push('bigramp', 'boostrow');
  if (m >= 1 || l >= 1) pieces.push('jumpline');
  let pc = Math.floor(rnd() * pieces.length);
  const place = (i, kind) => {
    const s = segs[i], wid = s.w;
    if (kind === 'jumpline') {                          // a row of ramps across the whole slope, then a crevasse to fly over
      if (i + 14 >= end || !free(i - 15, i + 9) || Math.abs(s.curve) > 1.8 || Math.abs(segs[i + 6].curve) > 1.8) return false;
      for (let x = -(wid + 0.9); x <= wid + 0.9; x += 0.38) s.objs.push({ kind: 'kicker', x });
      segs[i + 3].crev = segs[i + 4].crev = segs[i + 5].crev = true;
      segs[i - 12].deco.push({ kind: 'warn', side: -1, off: 0.25 }, { kind: 'warn', side: 1, off: 0.25 });
      for (let k = i - 15; k < i + 9; k++) segs[k].noObj = true;
      return true;
    }
    if (kind === 'bigramp') {                           // a BIG RAMP: huge air, and a line of coins up in the sky
      if (i + 36 >= end || !free(i - 12, i + 34)) return false;
      const rx = (rnd() - 0.5) * wid * 0.6;
      s.objs.push({ kind: 'bigramp', x: rx });
      for (let k = 0; k < 10; k++) segs[i + 4 + k * 3].coins = [{ x: rx, hy: 1 + 5 * Math.sin(Math.PI * (k + 0.5) / 10), got: false }];
      segs[i - 14].deco.push({ kind: 'warn', side: -1, off: 0.25 });
      for (let k = i - 12; k < i + 34; k++) segs[k].noObj = true;
      return true;
    }
    if (kind === 'boostrow') {                          // BOOST PADS: three in a row down the slope, with coins on them
      if (!free(i - 6, i + 30)) return false;
      const bx = (rnd() - 0.5) * wid * 0.8;
      for (let k = 0; k < 3; k++) segs[i + k * 10].objs.push({ kind: 'boost', x: bx });
      for (let k = 0; k < 24; k += 2) segs[i + 3 + k].coins = [{ x: bx, hy: 0, got: false }];
      for (let k = i - 6; k < i + 30; k++) segs[k].noObj = true;
      return true;
    }
    if (kind === 'logrow') {                            // FALLEN TREES: logs across the slope with one gap (or jump them)
      if (!free(i - 4, i + 4)) return false;
      const gap = (rnd() * 2 - 1) * wid * 0.6;
      for (let x = -wid; x <= wid; x += 0.55) if (Math.abs(x - gap) > 0.5) s.objs.push({ kind: 'log', x });
      for (let k = i - 4; k < i + 4; k++) segs[k].noObj = true;
      return true;
    }
    return false;
  };
  const every = Math.round(lerp(120, 85, Math.min(1, diff)));
  for (let i = start + 40; i < end - 40; i += every) {
    for (let tries = 0; tries < 6; tries++) if (place(i + tries * 9, pieces[pc % pieces.length])) break;
    pc++;
  }
  // obstacles: more and closer together on harder runs and bigger mountains
  const KINDS = [['rock', 0.6], ['tree', 0.4], ['snowman', 0.35], ['kicker', 0.3 + diff * 0.1], ['ice', 0.12 * (map.ice || 1) + diff * 0.08],
                 ['flags', 0.2], ['log', (diff > 0.5 ? 0.25 : 0) + (has('logs') ? 0.3 : 0)], ['boost', has('boost') ? 0.3 : 0.08]];
  const sumK = KINDS.reduce((a, k) => a + k[1], 0);
  let i = start;
  while (i < end) {
    i += Math.round((lerp(16, 6, Math.min(1, diff)) + rnd() * lerp(14, 6, Math.min(1, diff))) * (1 - m * 0.03) * 1.6);
    if (i >= end) break;
    const s = segs[i], wid = s.w;
    if (s.noObj) continue;
    let r = rnd() * sumK, kind = 'rock';
    for (const [k, w] of KINDS) { if ((r -= w) < 0) { kind = k; break; } }
    if (map.rocks && kind === 'tree' && rnd() < 0.6) kind = 'rock';
    if (kind === 'flags') {                             // a slalom gate: two poles, ski between them
      const gx = (rnd() - 0.5) * wid * 0.9, half = 0.32 - diff * 0.06;
      s.objs.push({ kind: 'pole', x: gx - half, col: '#e8303a' }, { kind: 'pole', x: gx + half, col: '#2a7fd4' });
      continue;
    }
    if (kind === 'log') { s.objs.push({ kind: 'log', x: (rnd() < 0.5 ? -1 : 1) * wid * 0.45 }); continue; }
    s.objs.push({ kind, x: (rnd() * 2 - 1) * wid * 0.85 });
    // harder runs: a second obstacle beside it, so you have to pick the gap
    if (diff > 0.35 && rnd() < diff * 0.55 && kind !== 'kicker' && kind !== 'ice' && kind !== 'boost') {

  if (UI.button('runs', x + 20 + hw, y + 126, hw, 18, 'PICK A RUN', { size: 1 }) || UI.back) toMaps();
}
function toTitle() { state = 'title'; paused = false; demo = null; codeInput.style.display = 'none'; }
function toMaps() { state = 'maps'; paused = false; demo = null; save.seenHelp = true; store(); }
function setPause(on) { if (state === 'play' && P && !P.done && !R.mp) { paused = on; if (on) { touch.steer = touch.speed = null; } } }

/* --- RACE A FRIEND: online, the same free PeerJS server as the other games ------------------ */
// You both ski the same run (it's built the same on both phones). Each phone runs its own skier and sends where it is
// 20 times a second; you see your friend's skier (a ghost: you can't hit each other). First to the bottom wins.
const FR = { z: 0, x: 0, h: 0, tz: 0, tx: 0, th: 0, v: 0, out: false, fin: 0, prog: 0, seen: false };   // your friend, as you see them
function friendStep(dt) {                            // move smoothly towards where your friend said they are
  if (!FR.seen || FR.fin) return;
  FR.tz += FR.v * METRE * dt;
  FR.z = Math.abs(FR.tz - FR.z) > SEG * 20 ? FR.tz : lerp(FR.z, FR.tz, Math.min(1, dt * 10));
  FR.x = lerp(FR.x, FR.tx, Math.min(1, dt * 10)); FR.h = lerp(FR.h, FR.th, Math.min(1, dt * 10));
}
const codeInput = document.getElementById('code');
codeInput.addEventListener('input', () => { codeInput.value = codeInput.value.toUpperCase().split('').filter(c => PX.CODE_CHARS.includes(c)).join('').slice(0, 4); });
const Net = {
  peer: null, conn: null, live: false, isHost: false, code: '', screen: 'pick', msg: '', friend: null, sendT: 0, pm: 0, pl: 0,
  reset() { try { if (this.peer) this.peer.destroy(); } catch (e) { /* gone */ } this.peer = null; this.conn = null; this.live = false; this.code = ''; this.friend = null; this.screen = 'pick'; this.msg = ''; },
  fail(msg) { this.reset(); this.screen = 'error'; this.msg = msg; },
  opts() { return { debug: 0, config: { iceServers: PX.ICE_SERVERS } }; },
  async host() {
    this.reset(); this.isHost = true; this.screen = 'connecting'; this.msg = 'CREATING A GAME';
    try { await PX.loadPeer(); } catch (e) { return this.fail("COULDN'T LOAD ONLINE PLAY. CHECK YOUR INTERNET."); }
    const open = attempt => {
      let code = ''; for (let i = 0; i < 4; i++) code += PX.CODE_CHARS[Math.floor(Math.random() * PX.CODE_CHARS.length)];
      const peer = new Peer('pixel-ski-room-' + code, this.opts()); this.peer = peer;
      peer.on('open', () => { this.code = code; this.screen = 'hosting'; this.msg = ''; });
      peer.on('connection', c => { if (this.live) { c.close(); return; } this.bind(c); });
      peer.on('disconnected', () => { if (this.peer === peer && !peer.destroyed) peer.reconnect(); });
      peer.on('error', e => { if (e.type === 'unavailable-id' && attempt < 3) { peer.destroy(); open(attempt + 1); } else if (!this.live && e.type !== 'network') this.fail("CAN'T REACH THE GAME SERVER. CHECK YOUR INTERNET."); });
    };
    open(0);
  },
  async join(code) {
    this.reset(); this.isHost = false; this.screen = 'connecting'; this.msg = 'CONNECTING TO ' + code;
    try { await PX.loadPeer(); } catch (e) { return this.fail("COULDN'T LOAD ONLINE PLAY. CHECK YOUR INTERNET."); }
    const peer = new Peer(this.opts()); this.peer = peer;
    peer.on('open', () => this.bind(peer.connect('pixel-ski-room-' + code, { reliable: true, serialization: 'json' })));
    peer.on('error', e => { if (!this.live) this.fail(e && e.type === 'peer-unavailable' ? 'NO GAME WITH THAT CODE.' : "COULDN'T CONNECT. TRY AGAIN."); });
    setTimeout(() => { if (!this.live && this.screen === 'connecting') this.fail("COULDN'T REACH YOUR FRIEND'S PHONE. TRY THE SAME WI-FI."); }, 25000);
  },
  joinTyped() { if (codeInput.value.length === 4) { codeInput.blur(); this.join(codeInput.value); } },
  bind(c) {
    this.conn = c;
    c.on('open', () => { this.live = true; this.screen = 'lobby'; this.send({ t: 'me', name: profile.name, av: profile.avatar, color: MY_COLOR, v: VERSION }); sfx('click'); });
    c.on('data', m => this.onData(m));
    c.on('close', () => this.lost());
  },
  lost() { if (!this.live) return; this.live = false; this.conn = null; if (state === 'online') { this.screen = 'error'; this.msg = 'YOUR FRIEND LEFT.'; } },
  leave() { this.send({ t: 'bye' }); this.live = false; const p = this.peer; this.peer = null; this.conn = null; setTimeout(() => { try { if (p) p.destroy(); } catch (e) { /* gone */ } }, 150); },
  send(m) { if (this.conn && this.conn.open) try { this.conn.send(m); } catch (e) { /* closing */ } },
  sendPos() {                                        // 20 times a second: where you are on the slope
    const now = performance.now(); if (now - this.sendT < 50) return; this.sendT = now;
    this.send({ t: 'p', z: Math.round(P.z + PLAYER_Z), x: Math.round(P.x * 1000) / 1000, h: Math.round(P.h * 100) / 100, v: Math.round(P.v * 10) / 10 });
  },
  start(m, l) { this.pm = m; this.pl = l; this.send({ t: 'go', m, l }); startRun(m, l, true); },
  onData(m) {
    if (!m || typeof m !== 'object') return;
    switch (m.t) {
      case 'me':
        if (m.v !== VERSION) { this.fail('YOUR FRIEND HAS V' + m.v + ', YOU HAVE V' + VERSION + '. RELOAD BOTH.'); break; }
        this.friend = { name: PX.cleanName(m.name) || 'FRIEND', av: m.av, color: /^#[0-9a-f]{6}$/i.test(m.color) ? m.color : '#4aa8ff' };
        break;
      case 'go': if (MAPS[m.m] && LEVELS[m.l]) { this.pm = m.m; this.pl = m.l; startRun(m.m, m.l, true); } break;
      case 'lobby': if (state !== 'play' || (P && P.done)) { state = 'online'; this.screen = 'lobby'; } break;
      case 'p':
        if (!R || !R.mp) break;
        FR.tz = +m.z || 0; FR.tx = clamp(+m.x || 0, -4, 4); FR.th = clamp(+m.h || 0, 0, 20); FR.v = clamp(+m.v || 0, 0, 80);
        if (!FR.seen) { FR.z = FR.tz; FR.x = FR.tx; FR.seen = true; }
        break;
      case 'fin': FR.fin = +m.tm || 1; if (R) FR.z = FR.tz = R.finishZ; FR.v = 0; break;
      case 'out': FR.out = true; FR.prog = clamp(+m.pr || 0, 0, 1); FR.v = 0; break;
      case 'bye': this.lost(); break;
    }
  },
};
function drawOnline(t) {
  const W = S.W, bw = 200, bx = Math.round(W / 2 - bw / 2), dots = '.'.repeat(1 + Math.floor(performance.now() / 333) % 3);
  const pw = Math.min(W - 16, 340), y = 30, cx = W / 2;
  ctx.fillStyle = 'rgba(13,11,19,0.55)'; ctx.fillRect(0, 0, W, H);
  panel(Math.round(cx - pw / 2), y, pw, 188, '#4aa8ff');
  const back = (yy, label = 'BACK') => { if (UI.button('nback', bx, yy, bw, 20, label, { size: 1 }) || UI.back) { if (Net.live || Net.peer) Net.leave(); Net.reset(); toTitle(); } };
  if (Net.screen !== 'join') codeInput.style.display = 'none';
  switch (Net.screen) {
    case 'pick':
      T('RACE A FRIEND ONLINE', cx, y + 12, '#4aa8ff', 2, 'center', '#000');
      T('YOU BOTH SKI THE SAME RUN. FIRST TO THE BOTTOM WINS!', cx, y + 32, '#9a92b8', 1, 'center');
      T('CRASH AND YOU\'RE OUT (BOTH CRASH: THE FURTHEST WINS).', cx, y + 42, '#9a92b8', 1, 'center');
      if (UI.button('create', bx, y + 60, bw, 26, 'CREATE GAME', { accent: '#4aa8ff' })) Net.host();
      if (UI.button('join', bx, y + 94, bw, 26, 'JOIN WITH A CODE', { accent: '#5ad43f' })) { Net.screen = 'join'; codeInput.value = ''; }
      back(y + 156);
      break;
    case 'hosting':
      T('YOUR GAME CODE', cx, y + 12, '#efe9ff', 1, 'center');
      T(Net.code, cx, y + 30, '#ffd23f', 7, 'center', '#000');
      T('YOUR FRIEND: PIXEL SKI > RACE A FRIEND > JOIN', cx, y + 80, '#efe9ff', 1, 'center');
      T('WAITING' + dots, cx, y + 100, '#fff', 1, 'center');
      back(y + 156, 'CANCEL');
      break;
    case 'join':
      T("TYPE YOUR FRIEND'S CODE", cx, y + 12, '#fff', 2, 'center');
      S.placeInput(codeInput, cx - 70, y + 38, 140, 36);
      if (UI.button('dojoin', bx, y + 90, bw, 24, 'JOIN', { disabled: codeInput.value.length !== 4, accent: '#5ad43f' })) Net.joinTyped();
      back(y + 156);
      break;
    case 'connecting':
      T(Net.msg + dots, cx, y + 80, '#fff', 1, 'center');
      back(y + 156, 'CANCEL');
      break;
    case 'lobby': {
      T('CONNECTED!', cx, y + 8, '#5ad43f', 2, 'center');
      PX.drawAvatar(ctx, profile.avatar, cx - 96, y + 24, 2); T(profile.name, cx - 82, y + 56, '#fff', 1, 'center');
      T('VS', cx, y + 34, '#ff8a2a', 3, 'center');
      const f = Net.friend;
      if (f) { PX.drawAvatar(ctx, f.av, cx + 68, y + 24, 2); T(f.name, cx + 82, y + 56, '#fff', 1, 'center'); }
      if (Net.isHost) {                                 // the host picks the mountain and the run (all of them are open online)
        T('PICK THE MOUNTAIN AND THE RUN:', cx, y + 70, '#efe9ff', 1, 'center');
        if (UI.button('mprev', cx - 130, y + 82, 24, 20, '<', { size: 2 })) Net.pm = (Net.pm + MAPS.length - 1) % MAPS.length;
        if (UI.button('mnext', cx + 106, y + 82, 24, 20, '>', { size: 2 })) Net.pm = (Net.pm + 1) % MAPS.length;
        T((Net.pm + 1) + '. ' + MAPS[Net.pm].name, cx, y + 89, '#ffd23f', 1, 'center', '#000');
        LEVELS.forEach((lev, l) => {
          const lx = Math.round(cx - 105 + l * 72);
          if (UI.button('mp' + l, lx, y + 110, 66, 26, '', { size: 1, accent: lev.color === '#22222a' ? '#9a92b8' : lev.color, disabled: !f })) Net.start(Net.pm, l);
          levelIcon(l, lx + 14, y + 123, 2); T(lev.name, lx + 26, y + 120, f ? '#fff' : '#5b5275', 1);
        });
      } else T('WAITING FOR ' + (f ? f.name : 'THE HOST') + ' TO PICK A RUN' + dots, cx, y + 104, '#efe9ff', 1, 'center');
      back(y + 156, 'LEAVE');
      break;
    }
    case 'error':
      T(Net.msg, cx, y + 70, '#ff6b6b', 1, 'center');
      back(y + 156, 'OK');
      break;
  }
}

/* --- sound --- */
function sfx(k) {
  if (!save.sfx) return;
  const s = PX.Sound;
  if (k === 'click') s.tone([523, 784], 0.12, { vol: 0.1 });
  else if (k === 'beep') s.tone(440, 0.15, { vol: 0.1 });
  else if (k === 'go') s.tone(880, 0.4, { vol: 0.12 });
  else if (k === 'jump') { s.noise(0.2, { freq: 1600, vol: 0.12, filter: 'bandpass' }); s.tone([300, 700], 0.2, { vol: 0.05, type: 'triangle' }); }
  else if (k === 'land') s.noise(0.15, { freq: 500, vol: 0.2 });
  else if (k === 'ice') s.tone([1400, 1800], 0.15, { vol: 0.04, type: 'triangle' });
  else if (k === 'crash') { s.noise(0.5, { freq: 400, vol: 0.35 }); s.tone([320, 70], 0.4, { vol: 0.08, type: 'sawtooth' }); }
  else if (k === 'coin') s.tone([988, 1319], 0.08, { vol: 0.05 });
  else if (k === 'buy') s.tone([523, 659, 784, 1047], 0.35, { vol: 0.1 });
  else if (k === 'saved') s.tone([1200, 600, 1200], 0.4, { vol: 0.09, type: 'triangle' });
  else if (k === 'turbo') { s.tone([200, 800], 0.5, { vol: 0.07, type: 'sawtooth' }); s.noise(0.6, { freq: 1500, vol: 0.08, filter: 'bandpass' }); }
  else if (k === 'hop') { s.noise(0.08, { freq: 2000, vol: 0.08, filter: 'highpass' }); s.tone([300, 600], 0.12, { vol: 0.05, type: 'triangle' }); }
  else if (k === 'whoosh') s.noise(0.25, { freq: 1500, vol: 0.07, filter: 'bandpass' });
  else if (k === 'trick') s.tone([660, 990], 0.1, { vol: 0.06 });
  else if (k === 'landed') s.tone([523, 659, 784, 1047], 0.3, { vol: 0.08 });
  else if (k === 'boost') { s.tone([300, 900], 0.3, { vol: 0.06, type: 'sawtooth' }); s.noise(0.3, { freq: 2000, vol: 0.05, filter: 'bandpass' }); }
  else if (k === 'slow') s.tone([800, 200], 0.6, { vol: 0.08, type: 'sine' });
  else if (k === 'star') s.tone([784, 1047, 1568], 0.4, { vol: 0.1 });
  else if (k === 'finish') s.tone([523, 659, 784, 1047, 1319], 0.8, { vol: 0.1 });
}

/* --- 8. INPUT: the two sliders on a touch screen, keys, a controller ---------------------- */
const held = new Map();
const inBox = (b, x, y, pad = 16) => x >= b.x - pad && x < b.x + b.w + pad && y >= b.y - pad && y < b.y + b.h + pad;
// a finger on a slider moves its knob to where it is; a finger anywhere else on that side works from where it first touched
function slide(id, x, y) {
  const sl = sliders();
  if (touch.steer === id) touch.steerV = clamp(touch.steerAbs ? (x - (sl.steer.x + sl.steer.w / 2)) / (sl.steer.w / 2 - 14) : (x - touch.x0) / 40, -1, 1);
  if (touch.speed === id) touch.speedV = clamp(touch.speedAbs ? -(y - (sl.speed.y + sl.speed.h / 2)) / (sl.speed.h / 2 - 16) : -(y - touch.y0) / 40, -1, 1);
}
UI.onDown = (e, x, y) => {
  PX.Sound.unlock();
  if (e.pointerType === 'touch') touchUI = true;
  if (state !== 'play' || !P || P.done) return;
  if (x < 36 && y < 36) { setPause(!paused); return; }          // the pause button
  if (paused) return;
  const sl = sliders();
  if (inBox(sl.jump, x, y, 6)) { held.set(e.pointerId, 'jump'); doJump(); return; }
  if (lvl('turbo') && inBox(sl.turbo, x, y, 3)) { useTurbo(); return; }
  if (lvl('slowmo') && inBox(sl.slow, x, y, 3)) { useSlow(); return; }
  if (x > S.W * 0.36 && x < S.W * 0.62 && y > 50 && !inBox(sl.steer, x, y, 10)) { doJump(); return; }   // a tap in the middle: jump
  // the left half steers (the slider is just where it shows), the right half sets the speed
  if (inBox(sl.speed, x, y, 24) || x > S.W * 0.62) { touch.speed = e.pointerId; touch.speedAbs = inBox(sl.speed, x, y, 10); touch.y0 = y; touch.speedV = 0; slide(e.pointerId, x, y); }
  else { touch.steer = e.pointerId; touch.steerAbs = inBox(sl.steer, x, y, 10); touch.x0 = x; touch.steerV = 0; slide(e.pointerId, x, y); }
};
UI.onMove = (e, x, y) => { if (state === 'play') slide(e.pointerId, x, y); };
UI.onUp = e => { held.delete(e.pointerId); if (touch.steer === e.pointerId) { touch.steer = null; touch.steerV = 0; } if (touch.speed === e.pointerId) { touch.speed = null; touch.speedV = 0; } };
const KEYMAP = { ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r', ArrowUp: 'u', KeyW: 'u', ArrowDown: 'd', KeyS: 'd' };
window.addEventListener('keydown', e => {
  PX.Sound.unlock();
  if (e.target === codeInput) { if (e.code === 'Enter') Net.joinTyped(); else if (e.code === 'Escape') { codeInput.blur(); UI.back = true; } return; }
  if (R && R.mp && (e.code === 'Enter' || e.code === 'Space') && state !== 'play') return;
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
  if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'play' && P && !P.done) { setPause(!paused); return; }
  if (e.code === 'Escape') { UI.back = true; return; }
  if (KEYMAP[e.code]) { inp.keys[KEYMAP[e.code]] = true; touchUI = false; }
  if (state === 'play' && !e.repeat) {
    if (e.code === 'Space' || e.code === 'KeyJ') { doJump(); touchUI = false; }
    if (e.code === 'KeyE' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') { useTurbo(); touchUI = false; }
    if (e.code === 'KeyQ') { useSlow(); touchUI = false; }
  }
  if ((e.code === 'Enter' || e.code === 'Space') && (state === 'crashed' || state === 'finished') && (state === 'finished' || P.crashT > 0.9)) {
    const nx = state === 'finished' ? nextRun() : null; if (nx) startRun(nx[0], nx[1]); else startRun(R.m, R.l);
  }
});
window.addEventListener('keyup', e => { if (KEYMAP[e.code]) inp.keys[KEYMAP[e.code]] = false; });
window.addEventListener('blur', () => { for (const k in inp.keys) inp.keys[k] = false; setPause(true); });
document.addEventListener('visibilitychange', () => { if (document.hidden) setPause(true); });

/* --- 9. MAIN LOOP ----------------------------------------------------------------- */
let last = performance.now(), lastState = '', fadeT = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000), t = now / 1000; last = now;
  UI.begin();
  if (state === 'title' || state === 'maps' || state === 'shop' || state === 'online') {
    demoWorld(t, dt);
    if (state === 'title') drawTitle(t); else if (state === 'shop') drawShop(t); else if (state === 'online') drawOnline(t); else drawMaps(t);
  } else {
    let gdt = dt;
    if (P.slowT > 0 && state === 'play' && !paused) { P.slowT -= dt; gdt = dt * 0.45; }
    const sub = Math.max(2, Math.ceil(gdt / 0.006)); for (let k = 0; k < sub; k++) step(gdt / sub);
    if (R.mp) friendStep(dt);
    const sh = P.shake > 0 ? Math.min(3, P.shake * 12) : 0;
    if (sh) { ctx.save(); ctx.translate(Math.round((Math.random() - 0.5) * sh * 2), Math.round((Math.random() - 0.5) * sh * 2)); }
    drawWorld(t);
    if (sh) ctx.restore();
    hud(t);
    if (state === 'crashed' || state === 'finished') drawEnd(t);
    else if (paused) drawPause();
  }
  if (state !== lastState) { fadeT = 0.22; lastState = state; }
  if (fadeT > 0) { fadeT -= dt; ctx.fillStyle = 'rgba(13,11,19,' + clamp(fadeT / 0.22, 0, 1) * 0.85 + ')'; ctx.fillRect(0, 0, S.W, H); }
  UI.end();
  S.blit('#0d0b13');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => { /* offline mode unavailable */ }));
}
PX.setIcon && PX.setIcon();
PX.Pad.setup({
  title: 'Pixel Ski: controller', ui: UI, menu: () => state !== 'play' || paused || (P && P.done),
  phone: { stick: 'STEER', dpad: true, buttons: [['A', 'JUMP'], ['RT', 'FASTER'], ['LT', 'BRAKE'], ['B', 'BRAKE'], ['X', 'TURBO'], ['Y', 'SLOW-MO']] },
  keys: () => ({ START: 'KeyP' }),
  onPlay(h, n, dt, edge) {
    if (edge('A')) doJump();
    if (edge('RB') || edge('X')) useTurbo();
    if (edge('LB') || edge('Y')) useSlow();
    inp.padSteer = Math.abs(h.ax) > 0.15 ? clamp(h.ax, -1, 1) : 0;
    inp.padSpeed = h.RT || h.up ? 1 : h.LT || h.B || h.down ? -1 : 0;
  },
  help: [['LEFT|RIGHT', 'STEER (LEFT STICK)'], ['A', 'JUMP (IN THE AIR: FLIP)'], ['RT|UP', 'TUCK: GO FASTER'], ['LT|B|DOWN', 'BRAKE'], ['X|RB', 'TURBO (FROM THE SHOP)'], ['Y|LB', 'SLOW-MO (FROM THE SHOP)'], ['START', 'PAUSE'], ['A', 'MENUS: OK'], ['B', 'MENUS: BACK']],
});
</script>
