<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Pixel Clash: a real-time card battle on two lanes. Spend energy on troops, buildings and spells, knock down the enemy towers and take their king. Build your deck, upgrade cards, climb 5 arenas.">

<meta name="mobile-web-app-capable" content="yes">

<title>Pixel Clash</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14101e; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #screen { position: fixed; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<script src="common.js"></script>
<script>
'use strict';
/* ==========================================================================
   PIXEL CLASH: a card battle on two lanes (part of the PIXEL ARCADE).
   Each side has two lane towers and a KING tower. Energy fills up by itself;
   spend it on cards: troops walk down a lane and fight, buildings defend,
   spells hit an area. Take a tower = 1 crown, the king = 3 crowns and the win.
   After 3 minutes the side with more crowns wins (1 extra minute if it's a tie,
   with double energy). Wins give trophies and gold; trophies open arenas and
   new cards; gold levels up your cards. Build a deck of 8.
     1. Setup   2. Cards   3. The battle   4. The bot   5. Drawing   6. Screens   7. Sound   8. Input   9. Main loop
   ========================================================================== */

/* --- 1. SETUP --------------------------------------------------------------- */
const VERSION = '1.0.0';
const SAVE_KEY = 'pixelClash.save';
const START_DECK = ['sword', 'sling', 'imps', 'brute', 'cart', 'cannon', 'fireball', 'zap'];
const NEW_SAVE = () => ({ trophies: 0, best: 0, gold: 60, lv: {}, deck: START_DECK.slice(), wins: 0, losses: 0, arenaSeen: 0, daily: '', sfx: true, music: true, streak: 0 });
let save = NEW_SAVE();
try { save = Object.assign(NEW_SAVE(), JSON.parse(localStorage.getItem(SAVE_KEY)) || {}); } catch (e) { /* new player */ }
const store = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* private mode */ } };
const profile = PX.Profile.get();
const canvas = document.getElementById('screen');
const S = PX.makeScreen(canvas, { H: 240, minW: 400, maxW: 560 });
const ctx = S.ctx, H = S.H;
const UI = PX.makeUI(S, canvas);
const T = (str, x, y, color = '#fff', size = 1, align = 'left', shadow = null) => PX.drawText(ctx, str, x, y, color, size, align, shadow);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rnd = (a, b) => a + Math.random() * (b - a);
const OUT = '#0b0614';
const today = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
const TEAM = [{ main: '#3a8aff', dark: '#1a4aa8', light: '#9ad0ff' }, { main: '#ff4a4a', dark: '#a81a2a', light: '#ffb0a0' }];

// the arena: 360 x 172, you on the left, the river in the middle, a bridge on each lane
const AW = 360, AH = 172, RIVER0 = 170, RIVER1 = 190, MID = 180;
const LANES = [42, 130];
const BATTLE_TIME = 180, OVERTIME = 60;

/* --- 2. CARDS ---------------------------------------------------------------- */
// kind: unit | building | spell. hits: g (ground) / ga (ground and air) / b (buildings only)
const CARDS = {
  sword: { name: 'SWORDSMAN', cost: 3, kind: 'unit', n: 1, hp: 660, dmg: 80, rate: 1.1, range: 10, spd: 30, hits: 'g', r: 5, art: 'sword', what: 'A TOUGH FIGHTER WITH A SWORD' },
  sling: { name: 'SLINGERS', cost: 3, kind: 'unit', n: 2, hp: 210, dmg: 55, rate: 1.0, range: 66, spd: 32, hits: 'ga', r: 4, art: 'sling', shot: 'stone', what: 'TWO SHOOTERS, THEY HIT FLYERS TOO' },
  imps: { name: 'IMPS', cost: 2, kind: 'unit', n: 4, hp: 75, dmg: 45, rate: 0.9, range: 8, spd: 46, hits: 'g', r: 3, art: 'imp', what: 'FOUR QUICK LITTLE BITERS' },
  brute: { name: 'BRUTE', cost: 4, kind: 'unit', n: 1, hp: 1500, dmg: 120, rate: 1.5, range: 10, spd: 24, hits: 'g', r: 7, art: 'brute', what: 'A BIG, SLOW WALL OF MUSCLE' },
  cart: { name: 'ROCKET CART', cost: 4, kind: 'unit', n: 1, hp: 900, dmg: 210, rate: 1.4, range: 10, spd: 56, hits: 'b', r: 6, art: 'cart', what: 'RACES TO THE TOWERS, IGNORES TROOPS' },
  cannon: { name: 'CANNON', cost: 3, kind: 'building', n: 1, hp: 700, dmg: 85, rate: 0.9, range: 62, life: 30, hits: 'g', r: 7, art: 'cannon', shot: 'ball', what: 'A BUILDING THAT SHOOTS GROUND TROOPS' },
  fireball: { name: 'FIREBALL', cost: 4, kind: 'spell', dmg: 330, area: 24, tower: 0.35, art: 'fireball', what: 'BURNS EVERYTHING IN A CIRCLE' },
  zap: { name: 'ZAP', cost: 2, kind: 'spell', dmg: 115, area: 20, stun: 0.6, tower: 0.35, art: 'zap', what: 'A QUICK SHOCK THAT STUNS' },
  mage: { name: 'FIRE MAGE', cost: 5, kind: 'unit', n: 1, hp: 540, dmg: 170, rate: 1.4, range: 62, spd: 30, hits: 'ga', splash: 18, r: 5, art: 'mage', shot: 'fire', what: 'FIRE THAT HITS A WHOLE GROUP' },
  spear: { name: 'SPEARMEN', cost: 4, kind: 'unit', n: 3, hp: 290, dmg: 70, rate: 1.1, range: 20, spd: 32, hits: 'ga', r: 4, art: 'spear', what: 'THREE LONG SPEARS, THEY REACH FLYERS' },
  drake: { name: 'DRAKELING', cost: 4, kind: 'unit', n: 1, hp: 720, dmg: 105, rate: 1.6, range: 30, spd: 40, hits: 'ga', splash: 14, fly: true, r: 6, art: 'drake', shot: 'fire', what: 'A FLYING LITTLE DRAGON, BREATHES FIRE' },
  bats: { name: 'BAT SWARM', cost: 2, kind: 'unit', n: 5, hp: 55, dmg: 42, rate: 1.0, range: 8, spd: 56, hits: 'ga', fly: true, r: 3, art: 'bat', what: 'FIVE FLYING BITERS' },
  golem: { name: 'STONE GOLEM', cost: 7, kind: 'unit', n: 1, hp: 3600, dmg: 190, rate: 1.6, range: 10, spd: 18, hits: 'b', r: 9, art: 'golem', what: 'HUGE AND SLOW, ONLY HITS BUILDINGS' },
};
const ARENAS = [
  { name: 'GREEN VALLEY', at: 0, g1: '#4a9a3a', g2: '#428e34', unlock: [] },
  { name: 'STONE FORT', at: 300, g1: '#8a8a7a', g2: '#7e7e70', unlock: ['mage', 'spear'] },
  { name: 'SNOW PEAK', at: 700, g1: '#d8e4f0', g2: '#c8d8e8', unlock: ['drake', 'bats'] },
  { name: 'LAVA KEEP', at: 1200, g1: '#5a3a30', g2: '#503228', unlock: ['golem'] },
  { name: 'SKY CITADEL', at: 1800, g1: '#9ab0e0', g2: '#8aa2d6', unlock: [] },
];
const arenaOf = tr => { let k = 0; ARENAS.forEach((a, i) => { if (tr >= a.at) k = i; }); return k; };
const unlocked = id => START_DECK.includes(id) || ARENAS.some((a, i) => i <= arenaOf(save.best) && a.unlock.includes(id));
const lvOf = id => save.lv[id] || 1;
const upCost = lv => 30 * Math.pow(2, lv - 1);
const MAX_LV = 10;
const lvMul = lv => 1 + 0.1 * (lv - 1);
// pixel art for the cards and troops: '#' team colour, 'd' team dark, 's' skin, 'w' white, 'k' black, 'g' grey, 'y' gold, 'b' brown, 'o' orange
const ART = {
  sword: ['..sss...', '..sks..w', '.dd##..w', 's#####ww', '.d###.g.', '..#.#...', '..k.k...'],
  sling: ['..bbb...', '..sks...', '.d###.b.', 's####bb.', '..###...', '..#.#...', '..k.k...'],
  imp: ['#...#', '.###.', '#wkw#', '.###.', '#.#.#'],
  brute: ['...sss....', '..sksks...', '.dd####dd.', 's########s', 's#######.s', '..######..', '..##..##..', '..kk..kk..'],
  cart: ['....yy...', '...yooy..', 'ggggggggo', 'g##d##dgo', 'g#######g', '.kk...kk.', '.kk...kk.'],
  cannon: ['...kkkk.', '..gggggk', '.ggggg..', 'bbbbbb..', 'b#bb#b..', 'bbbbbb..'],
  mage: ['...#....', '..###...', '.#####..', '..sks..o', '.d###.oy', 's#####b.', '.#####b.', '..k.k...'],
  spear: ['.......w', '..sss.g.', '..sksg..', '.d##g#..', 's#g###..', '.g###...', '..#.#...', '..k.k...'],
  drake: ['#.....#.', '##...##.', '.##o##..', '..###oo.', '.#####ow', '..d.d...'],
  bat: ['#...#', '##.##', '.#w#.', '..#..'],
  golem: ['...gggg...', '..gkggkg..', '.gg####gg.', 'gg######gg', 'gg##dd##gg', '.g######g.', '..gg..gg..', '.ggg..ggg.'],
  fireball: ['..oyy..', '.oyyyo.', 'oyywyyo', 'oyyyyyo', '.oyyyo.', '..ooo..'],
  zap: ['...yy.', '..yy..', '.yyyy.', '..yy..', '.yy...', 'yy....'],
};
const sprites = {};
function sprite(art, side) {                         // a team-coloured sprite with a dark outline
  const key = art + side; if (sprites[key]) return sprites[key];
  const rows = ART[art], w = Math.max(...rows.map(r => r.length)), h = rows.length, tm = TEAM[side];
  const pal = { '#': tm.main, d: tm.dark, s: '#f0c090', w: '#ffffff', k: '#1a1420', g: '#9a9aa8', y: '#ffd23f', b: '#8a5a32', o: '#ff8a2a' };
  const c = document.createElement('canvas'); c.width = w + 2; c.height = h + 2; const g = c.getContext('2d');
  const flip = side === 1;
  rows.forEach((row, y) => [...row].forEach((ch, x) => { if (ch === '.') return; const X = (flip ? w - 1 - x : x) + 1; g.fillStyle = OUT; g.fillRect(X - 1, y + 1, 3, 1); g.fillRect(X, y, 1, 3); }));
  rows.forEach((row, y) => [...row].forEach((ch, x) => { if (ch === '.') return; g.fillStyle = pal[ch] || '#f0f'; g.fillRect((flip ? w - 1 - x : x) + 1, y + 1, 1, 1); }));
  sprites[key] = c; return c;
}

/* --- 3. THE BATTLE ----------------------------------------------------------------- */
let B = null;
function tower(side, lane, king) {
  const x = side === 0 ? (king ? 20 : 58) : (king ? AW - 20 : AW - 58), y = king ? AH / 2 : LANES[lane];
  const lv = 1 + Math.floor(save.trophies / 300) * 0.5;
  const hp = Math.round((king ? 2400 : 1400) * lvMul(lv));
  return { kind: 'tower', side, lane: king ? -1 : lane, king, x, y, hp, max: hp, r: king ? 12 : 10, range: king ? 70 : 72, dmg: Math.round((king ? 60 : 50) * lvMul(lv)), rate: king ? 1 : 0.8, cd: 0, hits: 'ga', active: !king, building: true, target: null };
}
function newBattle() {
  const botLv = clamp(1 + Math.floor(save.trophies / 200), 1, MAX_LV);
  const pool = Object.keys(CARDS).filter(id => START_DECK.includes(id) || ARENAS.some((a, i) => i <= arenaOf(save.trophies) && a.unlock.includes(id)));
  const botDeck = shuffle(pool).slice(0, 8);
  if (!botDeck.some(id => ['brute', 'golem', 'cart'].includes(id))) botDeck[0] = 'brute';
  B = { t: 0, over: false, ot: false, ents: [], shots: [], fx: [], crowns: [0, 0],
    side: [{ en: 5, hand: [], next: null, deck: shuffle(save.deck.slice()), lv: id => lvOf(id) }, { en: 5, hand: [], next: null, deck: shuffle(botDeck), lv: () => botLv, think: 1.5 }],
    sel: -1, ghost: null, endT: 0, result: null, botLv, arena: arenaOf(save.trophies), cursor: { x: 100, y: 86 } };
  for (const s of B.side) { s.hand = s.deck.slice(0, 4); s.queue = s.deck.slice(4); s.next = s.queue[0]; }
  for (const sd of [0, 1]) { B.ents.push(tower(sd, 0, false), tower(sd, 1, false), tower(sd, 0, true)); }
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function canPlace(side, x, y, id) {
  const c = CARDS[id];
  if (x < 4 || x > AW - 4 || y < 6 || y > AH - 6) return false;
  if (c.kind === 'spell') return true;
  const mine = side === 0 ? x < RIVER0 - 4 : x > RIVER1 + 4;
  // when a lane tower falls, you may place troops in that lane up to near the enemy king
  const lane = y < AH / 2 ? 0 : 1, theirs = B.ents.find(e => e.kind === 'tower' && !e.king && e.side !== side && e.lane === lane && alive(e));
  const deep = !theirs && (side === 0 ? x < AW - 70 : x > 70);
  if (!(mine || deep)) return false;
  for (const e of B.ents) if (e.kind === 'tower' && alive(e) && Math.hypot(e.x - x, e.y - y) < e.r + 4) return false;
  return true;
}
function play(side, i, x, y) {                       // spend energy, the card goes to the back of the line
  const S2 = B.side[side], id = S2.hand[i], c = CARDS[id];
  if (!id || S2.en < c.cost || !canPlace(side, x, y, id)) return false;
  S2.en -= c.cost;
  S2.hand[i] = S2.queue.shift(); S2.queue.push(id); S2.next = S2.queue[0];
  const lv = S2.lv(id), m = lvMul(lv);
  if (c.kind === 'spell') {
    const k = B.ents.find(e => e.kind === 'tower' && e.king && e.side === side);
    B.shots.push({ k: id, x: id === 'zap' ? x : k.x, y: id === 'zap' ? y - 60 : k.y, tx: x, ty: y, t: 0, dur: id === 'zap' ? 0.15 : 0.7, side, dmg: c.dmg * m, area: c.area, tower: c.tower, stun: c.stun || 0 });
  } else {
    for (let n = 0; n < c.n; n++) {
      const a = n * 2.4, d = c.n > 1 ? 7 : 0;
      B.ents.push({ kind: c.kind, id, side, x: clamp(x + Math.cos(a) * d, 4, AW - 4), y: clamp(y + Math.sin(a) * d, 4, AH - 4), hp: c.hp * m, max: c.hp * m, dmg: c.dmg * m, rate: c.rate, cd: 0.5, range: c.range, spd: c.spd || 0, hits: c.hits, splash: c.splash || 0, fly: !!c.fly, r: c.r, deploy: 1, life: c.life || 0, stun: 0, target: null, retarget: 0, building: c.kind === 'building', walk: Math.random() * 6, lv });
    }
  }
  B.fx.push({ k: 'drop', x, y, t: 0, side });
  if (side === 0) sfx('place'); else sfx('place2');
  return true;
}
const alive = e => e.hp > 0;
const enemyOf = (a, b) => a.side !== b.side;
function canHit(a, b) {                           // can a attack b?
  if (a.hits === 'b') return b.building;
  if (b.fly) return a.hits === 'ga';
  return true;
}
function laneTarget(u) {                          // nothing close: walk to the tower of the lane, or the king
  const lane = u.y < AH / 2 ? 0 : 1;
  const t = B.ents.find(e => e.kind === 'tower' && !e.king && e.side !== u.side && e.lane === lane && alive(e));
  return t || B.ents.find(e => e.kind === 'tower' && e.king && e.side !== u.side && alive(e));
}
function findTarget(u) {
  let best = null, bd = 1e9; const sight = Math.max(u.range + 24, 64);
  for (const e of B.ents) {
    if (!alive(e) || !enemyOf(u, e) || !canHit(u, e) || e.deploy > 0.6) continue;
    const d = Math.hypot(e.x - u.x, e.y - u.y) - e.r;
    if (d < sight && d < bd) { bd = d; best = e; }
  }
  return best || (u.kind === 'unit' ? laneTarget(u) : null);
}
function damage(e, dmg, src) {
  if (!alive(e)) return;
  e.hp -= dmg; e.flash = 0.1;
  if (e.kind === 'tower' && e.king) e.active = true;
  if (e.hp <= 0) {
    e.hp = 0;
    if (e.kind === 'tower') {
      const other = 1 - e.side;
      B.crowns[other] = e.king ? 3 : B.crowns[other] + 1;
      B.fx.push({ k: 'boom', x: e.x, y: e.y, t: 0, r: 20 }); sfx('tower');
      if (!e.king) { const k = B.ents.find(q => q.kind === 'tower' && q.king && q.side === e.side); if (k) k.active = true; }
      if (e.king || (B.ot && B.crowns[0] !== B.crowns[1])) endBattle();
    } else B.fx.push({ k: 'poof', x: e.x, y: e.y, t: 0, side: e.side });
  }
}
function hitArea(x, y, r, dmg, side, towerK = 1, stun = 0, air = true) {
  for (const e of B.ents) if (alive(e) && e.side !== side && Math.hypot(e.x - x, e.y - y) < r + e.r && (air || !e.fly)) { damage(e, e.kind === 'tower' ? dmg * towerK : dmg); if (stun && e.kind !== 'tower') e.stun = Math.max(e.stun, stun); }
}
function step(dt) {
  if (B.over) { B.endT += dt; for (const q of B.fx) q.t += dt; return; }
  B.t += dt;
  const limit = BATTLE_TIME + (B.ot ? OVERTIME : 0);
  if (B.t >= BATTLE_TIME && !B.ot) { if (B.crowns[0] === B.crowns[1]) { B.ot = true; banner('OVERTIME! FIRST CROWN WINS'); sfx('bell'); } else endBattle(); }
  else if (B.ot && B.t >= limit) endBattle();
  const dbl = B.t >= BATTLE_TIME - 60 ? 2 : 1;
  if (B.t >= BATTLE_TIME - 60 && !B.dblShown) { B.dblShown = true; banner('DOUBLE ENERGY!'); sfx('bell'); }
  for (const s of B.side) s.en = Math.min(10, s.en + dt / 2.8 * dbl);
  botThink(dt);
  for (const e of B.ents) {
    if (!alive(e)) continue;
    if (e.flash > 0) e.flash -= dt;
    if (e.deploy > 0) { e.deploy -= dt; continue; }
    if (e.stun > 0) { e.stun -= dt; continue; }
    if (e.life) { e.hp -= e.max / e.life * dt; if (e.hp <= 0) { damage(e, 1); continue; } }
    if (e.kind === 'tower' && !e.active) continue;
    if ((e.retarget -= dt) <= 0 || !e.target || !alive(e.target) || (e.kind !== 'unit' && Math.hypot(e.target.x - e.x, e.target.y - e.y) > e.range + e.target.r + 2)) {
      e.retarget = 0.4;
      if (e.kind === 'unit') e.target = findTarget(e);
      else { let best = null, bd = 1e9; for (const q of B.ents) if (alive(q) && q.side !== e.side && q.kind === 'unit' && canHit(e, q) && q.deploy <= 0) { const d = Math.hypot(q.x - e.x, q.y - e.y); if (d < e.range + q.r && d < bd) { bd = d; best = q; } } e.target = best; }
    }
    const t = e.target; e.cd -= dt;
    if (!t || !alive(t)) continue;
    const d = Math.hypot(t.x - e.x, t.y - e.y), reach = e.range + t.r + e.r;
    if (d <= reach) {
      if (e.cd <= 0) {
        e.cd = e.rate; e.atk = 0.15;
        const shot = e.kind === 'tower' ? 'arrow' : CARDS[e.id].shot;
        if (shot) B.shots.push({ k: shot, x: e.x, y: e.y - 3, tx: t.x, ty: t.y, tgt: t, t: 0, dur: Math.max(0.12, d / 200), side: e.side, dmg: e.dmg, splash: e.splash, air: e.hits === 'ga' });
        else { if (e.splash) hitArea(t.x, t.y, e.splash, e.dmg, e.side); else damage(t, e.dmg); if (Math.random() < 0.5) sfx('hit'); }
      }
    } else if (e.kind === 'unit') {
      let [wx, wy] = waypoint(e, t.x, t.y);
      const dx = wx - e.x, dy = wy - e.y, dd = Math.hypot(dx, dy) || 1;
      e.x += dx / dd * e.spd * dt; e.y += dy / dd * e.spd * dt; e.walk += dt * 8; e.face = dx >= 0 ? 1 : -1;
    }
    if (e.atk > 0) e.atk -= dt;
  }
  // push units apart, keep them out of towers and (on foot) out of the water
  const U = B.ents.filter(e => e.kind === 'unit' && alive(e));
  for (let i = 0; i < U.length; i++) for (let j = i + 1; j < U.length; j++) {
    const a = U[i], b = U[j]; if (a.fly !== b.fly) continue;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), mn = a.r + b.r;
    if (d < mn && d > 0.01) { const k = (mn - d) / d * 0.5, wa = b.r / mn, wb = a.r / mn; a.x -= dx * k * wa * 2; a.y -= dy * k * wa * 2; b.x += dx * k * wb * 2; b.y += dy * k * wb * 2; }
  }
  for (const u of U) {
    if (!u.fly) for (const e of B.ents) if (e.building && alive(e) && e !== u) { const dx = u.x - e.x, dy = u.y - e.y, d = Math.hypot(dx, dy) || 1, mn = u.r + e.r; if (d < mn) { u.x = e.x + dx / d * mn; u.y = e.y + dy / d * mn; } }
    if (!u.fly && u.x > RIVER0 - u.r && u.x < RIVER1 + u.r && !LANES.some(by => Math.abs(u.y - by) < 8)) { const by = LANES.reduce((a, b) => (Math.abs(b - u.y) < Math.abs(a - u.y) ? b : a)); u.y += clamp(by - u.y, -1, 1) * 30 * dt * 2; }
    u.x = clamp(u.x, 3, AW - 3); u.y = clamp(u.y, 3, AH - 3);
  }
  // shots

    s.t += dt; if (s.tgt && alive(s.tgt)) { s.tx = s.tgt.x; s.ty = s.tgt.y; }

}
function drawDeck(t) {
  const W = S.W; menuBack(t); topBar();
  if (UI.button('back', 6, 6, 56, 20, '< BACK', { size: 1 }) || UI.back) { state = 'title'; sfx('click'); }

  T('AVERAGE COST ' + avg.toFixed(1) + (deckPick >= 0 ? '   NOW TAP A CARD BELOW TO SWAP IN' : '   TAP A CARD TO SWAP OR UPGRADE'), W / 2, 46, '#c8b8ff', 1, 'center', '#000');

  const ids = Object.keys(CARDS), cw2 = 30, gx = Math.round(W / 2 - (7 * (cw2 + 24)) / 2);

    }

    if (!open) { const a = ARENAS.find(q => q.unlock.includes(id)); T(a ? a.at + '' : '', x + cw2 / 2 + 4, y + 35, '#ff8a8a', 1, 'center', '#000'); trophyIcon(x + cw2 / 2 - PX.textWidth(a.at + '', 1) / 2 - 3, y + 37); }
    else T(inDeck ? 'IN DECK' : 'LV' + lvOf(id), x + cw2 / 2, y + 35, inDeck ? '#7a7298' : '#fff', 1, 'center');
  });
}
function drawRoad(t) {
  const W = S.W; menuBack(t); topBar();
  if (UI.button('back', 6, 6, 56, 20, '< BACK', { size: 1 }) || UI.back) { state = 'title'; sfx('click'); }

    ctx.fillStyle = OUT; ctx.fillRect(x - 1, y - 1, 302, 26); ctx.fillStyle = on ? '#3a2f5c' : '#1d1830'; ctx.fillRect(x, y, 300, 24);
    ctx.fillStyle = a.g1; ctx.fillRect(x + 4, y + 4, 16, 16); ctx.fillStyle = a.g2; ctx.fillRect(x + 8, y + 8, 8, 8);

    T(a.unlock.length ? 'NEW: ' + a.unlock.map(id => CARDS[id].name).join(', ') : i ? 'THE TOP!' : 'START', x + 296, y + 9, open ? '#5ad43f' : '#9a92b8', 1, 'right');

}
function drawOver(t) {
  if (B.endT < 1.2) return;
  const W = S.W, r = B.result, { x, y } = panel(260, 150, r.win > 0 ? '#ffd23f' : r.win < 0 ? '#ff4a4a' : '#9a92b8');
  ctx.fillStyle = 'rgba(0,0,0,0)';
  T(r.win > 0 ? 'VICTORY!' : r.win < 0 ? 'DEFEAT' : 'DRAW', W / 2, y + 10, r.win > 0 ? '#ffd23f' : r.win < 0 ? '#ff6a6a' : '#fff', 3, 'center', '#000');
  for (let i = 0; i < 3; i++) T('★', W / 2 - 66 + i * 14, y + 36, i < B.crowns[0] ? '#4aa8ff' : '#3a3258', 2, 'left', '#000');
  T('-', W / 2, y + 38, '#fff', 2, 'center'); for (let i = 0; i < 3; i++) T('★', W / 2 + 26 + i * 14, y + 36, i < B.crowns[1] ? '#ff4a4a' : '#3a3258', 2, 'left', '#000');

  ctx.fillStyle = OUT; ctx.fillRect(W / 2 + 9, y + 66, 9, 9); ctx.fillStyle = '#ffd23f'; ctx.fillRect(W / 2 + 10, y + 67, 7, 7); T('+' + r.gold, W / 2 + 22, y + 66, '#ffd23f', 2, 'left', '#000');
  let yy = y + 86;

  if (r.newArena >= 0) { T('NEW ARENA: ' + ARENAS[r.newArena].name + '!', W / 2, yy, '#ff6bd0', 1, 'center'); yy += 10; if (ARENAS[r.newArena].unlock.length) { T('NEW CARDS: ' + ARENAS[r.newArena].unlock.map(id => CARDS[id].name).join(', '), W / 2, yy, '#ff6bd0', 1, 'center'); } }
  if (UI.button('menu', x + 14, y + 122, 110, 22, 'MENU', { size: 1 }) || UI.back) { B = null; state = 'title'; }
  else if (UI.button('again', x + 136, y + 122, 110, 22, 'BATTLE AGAIN', { size: 1, accent: '#ffd23f' })) start();
}
function drawPause() {
  const W = S.W, { x, y } = panel(200, 100);
  T('PAUSED', W / 2, y + 10, '#fff', 3, 'center');
  if (UI.button('resume', x + 25, y + 38, 150, 22, 'RESUME', { accent: '#5ad43f' }) || UI.back) setPause(false);
  if (UI.button('quit', x + 25, y + 66, 150, 22, 'GIVE UP (A LOSS)', { size: 1 })) { paused = false; B.crowns[1] = 3; endBattle(); }
}
function start() { newBattle(); B.cardRects = []; state = 'play'; paused = false; Music.reset(); sfx('bell'); }
function setPause(v) { if (state !== 'play' || !B || B.over) return; paused = v; }

/* --- 7. SOUND --------------------------------------------------------------------- */
function sfx(k) {
  if (!save.sfx) return;
  const s = PX.Sound;
  if (k === 'click') s.tone([523, 784], 0.1, { vol: 0.1 });
  else if (k === 'place') s.tone([330, 660], 0.12, { vol: 0.1 });
  else if (k === 'place2') s.tone([300, 220], 0.1, { vol: 0.06 });
  else if (k === 'hit') s.noise(0.05, { freq: 900, vol: 0.05 });
  else if (k === 'boom') s.noise(0.35, { freq: 400, vol: 0.2 });
  else if (k === 'zap') { s.noise(0.15, { freq: 4000, vol: 0.1, filter: 'highpass' }); s.tone([1500, 300], 0.15, { vol: 0.06, type: 'sawtooth' }); }
  else if (k === 'tower') { s.noise(0.6, { freq: 250, vol: 0.25 }); s.tone([200, 60], 0.6, { vol: 0.1, type: 'sawtooth' }); }
  else if (k === 'bell') [880, 1320].forEach((f, i) => s.tone(f, 0.2, { vol: 0.07, delay: i * 0.12, type: 'triangle' }));
  else if (k === 'win') [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => s.tone(f, 0.18, { vol: 0.1, delay: i * 0.1 }));
  else if (k === 'lose') [392, 349, 311, 262].forEach((f, i) => s.tone(f, 0.25, { vol: 0.09, delay: i * 0.15, type: 'triangle' }));
  else if (k === 'up') s.tone([440, 880, 1320], 0.25, { vol: 0.09 });
  else if (k === 'no') s.tone([220, 160], 0.15, { vol: 0.08 });

const midi = n => 440 * Math.pow(2, (n - 69) / 12);
const Music = {                                    // a marching tune, faster in double energy
  next: 0, step: 0, reset() { this.next = 0; this.step = 0; },
  tick() {
    const c = PX.Sound.ctx;
    if (!c || !save.music || !save.sfx || state !== 'play' || paused || !B || B.over) { this.next = 0; return; }
    const bpm = B.t >= BATTLE_TIME - 60 ? 150 : 120, sp = 60 / bpm / 2, mel = [67, 0, 67, 69, 71, 0, 69, 67, 64, 0, 64, 67, 69, 0, 67, 0, 72, 0, 71, 69, 67, 0, 69, 71, 72, 0, 71, 0, 67, 0, 0, 0], bass = [48, 48, 43, 43, 45, 45, 43, 43];
    if (!this.next || this.next < c.currentTime) this.next = c.currentTime + 0.05;
    while (this.next < c.currentTime + 0.2) {
      const i = this.step++ % 32, d = this.next - c.currentTime;
      if (mel[i]) PX.Sound.tone(midi(mel[i]), sp * 0.8, { vol: 0.025, delay: d });
      if (i % 4 === 0) PX.Sound.tone(midi(bass[(i / 4) | 0]), sp * 3, { vol: 0.045, type: 'triangle', delay: d });
      if (i % 2 === 1) PX.Sound.noise(0.03, { freq: 6000, vol: 0.012, filter: 'highpass', delay: d });
      this.next += sp;
    }
  },
};

/* --- 8. INPUT: pick a card, then tap the arena (or drag the card there) ------------------------- */
const toArena = (x, y) => ({ x: x - AX, y: y - AY });
const inArena = (x, y) => x >= AX && x < AX + AW && y >= AY && y < AY + AH;
let drag = null;
function cardAt(x, y) { if (!B || !B.cardRects) return -1; for (let i = 0; i < 4; i++) { const r = B.cardRects[i]; if (r && x >= r[0] && x < r[0] + r[2] && y >= r[1] - 4 && y < r[1] + r[3]) return i; } return -1; }
function tryPlace(x, y) {
  const a = toArena(x, y), id = B.side[0].hand[B.sel];
  if (B.side[0].en < CARDS[id].cost) { msg = { txt: 'NOT ENOUGH ENERGY', t: 1 }; sfx('no'); return; }
  if (play(0, B.sel, a.x, a.y)) { B.sel = -1; B.ghost = null; } else { msg = { txt: CARDS[id].kind === 'spell' ? '' : 'ONLY ON YOUR SIDE', t: 1 }; sfx('no'); }
}
UI.onDown = (e, x, y) => {
  PX.Sound.unlock();

  const c = cardAt(x, y);
  if (c >= 0) { B.sel = B.sel === c && !drag ? -1 : c; drag = { id: e.pointerId, card: c }; sfx('click'); return; }
  if (inArena(x, y) && B.sel >= 0) B.ghost = toArena(x, y);
};
UI.onMove = (e, x, y) => { if (state === 'play' && B && B.sel >= 0 && inArena(x, y)) B.ghost = toArena(x, y); };
UI.onUp = e => {
  if (state !== 'play' || paused || !B || B.over) return;
  const { x, y } = S.toLogical(e);
  if (drag && drag.id === e.pointerId) { const was = drag; drag = null; if (inArena(x, y) && B.sel === was.card) tryPlace(x, y); return; }
  if (B.sel >= 0 && inArena(x, y)) tryPlace(x, y);
};
window.addEventListener('keydown', e => {

  if (state === 'play' && B && !B.over && !paused && e.code === 'KeyQ') { B.sel = (B.sel + 3) % 4; return; }
  if (state === 'play' && B && !B.over && !paused && e.code === 'KeyE') { B.sel = (B.sel + 1) % 4; return; }
  if (state === 'play' && B && !B.over && !paused && (e.code === 'Space' || e.code === 'Enter') && B.sel >= 0) { tryPlace(AX + B.cursor.x, AY + B.cursor.y); return; }

window.addEventListener('blur', () => setPause(true));
document.addEventListener('visibilitychange', () => { if (document.hidden) setPause(true); });

/* --- 9. MAIN LOOP ----------------------------------------------------------------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000), t = now / 1000; last = now;
  UI.begin();
  if (state === 'title') drawTitle(t);
  else if (state === 'deck') drawDeck(t);
  else if (state === 'road') drawRoad(t);
  else {
    if (!paused) { const n = 2; for (let i = 0; i < n; i++) step(dt / n); }
    drawBattle(t);
    if (B.over) drawOver(t); else if (paused) drawPause();
  }
  if (msg && msg.txt) { T(msg.txt, S.W / 2, H - 58, '#ff8a8a', 1, 'center', '#000'); if ((msg.t -= dt) <= 0) msg = null; }
  UI.end();

  keys: () => ({ A: 'Space', LB: 'KeyQ', RB: 'KeyE', X: 'Digit1', Y: 'Digit2', START: 'KeyP' }),
