<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Pixel Hook: hold to grab a hook, swing, let go to fly. Flip, bounce and swing through 24 levels in 3 worlds, or go as far as you can in ENDLESS.">
<meta name="theme-color" content="#0d0b13">
<meta name="mobile-web-app-capable" content="yes">

<title>Pixel Hook</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a0ca8; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #screen { position: fixed; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
</style>

<body>
<canvas id="screen"></canvas>
<script src="common.js"></script>
<script>
'use strict';
/* ==========================================================================
   PIXEL HOOK: swing on a rope, let go, fly (part of the PIXEL ARCADE).
   Hold anywhere to grab the hook that is marked, let go to fly. Let go on the
   way up (between flat and steep) for a PERFECT: a bit of extra speed, and a
   combo. Spin in the air for FLIPs. Bounce pads throw you up; walls bounce you
   back; saws, lasers and the floor end the try (back to the last flag).
     LEVELS: 3 worlds x 8 levels, 3 stars each (finish, no falls, beat the par time).
     ENDLESS: how far can you swing? The world changes every 600 m.
     SHOP: coins buy runners and ropes.
   The levels are built from a seed, so every level is always the same.
     1. Setup   2. Levels   3. Physics   4. Drawing   5. Screens   6. Sound   7. Input   8. Main loop
   ========================================================================== */

/* --- 1. SETUP --------------------------------------------------------------- */
const VERSION = '1.2.0';
const SAVE_KEY = 'pixelHook.save';
const save = { sfx: true, music: true, stars: {}, times: {}, endless: 0, coins: 0, skin: 'red', rope: 'classic', owned: { red: 1, classic: 1 }, played: 0 };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY)) || {}); } catch (e) { /* new player */ }
const store = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* private mode */ } };
const profile = PX.Profile.get();

const canvas = document.getElementById('screen');
const S = PX.makeScreen(canvas, { H: 240, minW: 400, maxW: 560 });
const ctx = S.ctx, H = S.H;
const UI = PX.makeUI(S, canvas);
const T = (str, x, y, color = '#fff', size = 1, align = 'left', shadow = null) => PX.drawText(ctx, str, x, y, color, size, align, shadow);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const hash = i => { const s = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); };

// the world is in screen pixels: y goes down, 0 is the top of the screen, below DEATH_Y you have fallen
const GRAV = 640;            // gravity (px/s²)
const PR = 6;                // the runner's radius (for hitting things)
const RANGE = 165;           // how far a hook can be grabbed
const REGRAB = 0.3;          // after you let go, this long before you can grab again (no tapping your way through)
const MAXV = 820;            // top speed
const PUMP = 200;            // a swing gains a little speed by itself (like pumping on a playground swing)
const ROPE_MAX = 112;        // a longer rope reels in to this length (so a swing never drags along the floor)
const PAD_V = 480;           // a bounce pad throws you up at least this fast
const DEATH_Y = 262;
const WPL = 8;               // levels in a world
const ENDLESS_THEME = 6000;  // ENDLESS: a new world every 600 m (10 px = 1 m)

const THEMES = [
  { name: 'TWILIGHT SKY', sky: ['#2a0ca8', '#3412c0', '#4216d8', '#521ce8', '#6826f0', '#8434f2'], star: '#e8dcff',
    cloud: '#b450f5', cloud2: '#9a3cf0', near: '#5a1ae8', near2: '#4612cc', floor: '#3a0cb4', block: '#7a5ae8', blockHi: '#b8a0ff', accent: '#ff6bd0', hook: '#ffffff', bg: '#2a0ca8' },
  { name: 'NEON CITY', sky: ['#05041a', '#090726', '#0e0a34', '#150e44', '#1e1254', '#2a1864'], star: '#7af0ff',
    cloud: '#2a1a5a', cloud2: '#3a2276', near: '#120c30', near2: '#0a0820', floor: '#0a0820', block: '#2a3a6a', blockHi: '#2af0ff', accent: '#2af0ff', hook: '#bff8ff', bg: '#05041a' },
  { name: 'LAVA PEAKS', sky: ['#160306', '#24050a', '#38080c', '#520c0e', '#701610', '#922612'], star: '#ffb070',
    cloud: '#5a1610', cloud2: '#7a2614', near: '#2a0608', near2: '#1a0406', floor: '#ff6a1a', block: '#5a3a3a', blockHi: '#ff9a4a', accent: '#ffb02a', hook: '#ffe0b0', bg: '#160306' },
];

const SKINS = [
  { id: 'red', name: 'RED', price: 0, col: '#ff2a2a' },
  { id: 'blue', name: 'BLUE', price: 150, col: '#2a8aff' },
  { id: 'lime', name: 'LIME', price: 150, col: '#5ad43f' },
  { id: 'ninja', name: 'NINJA', price: 400, col: '#3a3850', band: '#ff2a2a' },
  { id: 'ghost', name: 'GHOST', price: 500, col: '#e8e4ff', ghost: true },
  { id: 'robot', name: 'ROBOT', price: 800, col: '#9aa4b8', eye: '#2af0ff' },
  { id: 'gold', name: 'GOLD', price: 1200, col: '#ffd23f', eye: '#fff6c0' },
  { id: 'rainbow', name: 'RAINBOW', price: 2000, rainbow: true },
];
const ROPES = [
  { id: 'classic', name: 'CLASSIC', price: 0, a: '#ffffff', b: '#d8c8ff' },
  { id: 'candy', name: 'CANDY', price: 200, a: '#ffffff', b: '#ff2a4a' },
  { id: 'chain', name: 'CHAIN', price: 350, a: '#d0d0dc', b: '#6a6a7a' },
  { id: 'laser', name: 'LASER', price: 600, glow: '#2af0ff' },
  { id: 'gold', name: 'GOLD', price: 900, a: '#ffe27a', b: '#e0a020' },
  { id: 'rainbow', name: 'RAINBOW', price: 1500, rainbow: true },
];
const skinOf = id => SKINS.find(s => s.id === id) || SKINS[0];
const ropeOf = id => ROPES.find(r => r.id === id) || ROPES[0];
const hue = (t, k = 0) => `hsl(${Math.round((t * 140 + k * 30) % 360)},95%,62%)`;
const skinCol = (sk, t) => (sk.rainbow ? hue(t) : sk.col);

/* --- 2. LEVELS: built from a seed, piece by piece ---------------------------------------- */
// What each world adds: TWILIGHT: hooks, bounce pads, walls, low saws. NEON CITY: lasers, boost rings, moving hooks.
// LAVA PEAKS: everything, and saws that move.
function featsFor(w, li) {
  if (w === 0) return { pad: li >= 1, wall: li >= 3, saw: li >= 5, ring: li >= 6 };
  if (w === 1) return { pad: true, wall: true, saw: li >= 4, laser: true, ring: true, mover: li >= 2 };
  return { pad: true, wall: true, saw: true, sawMove: li >= 1, laser: true, ring: true, mover: true };
}
function makeGen(seed, cfg) {
  let s = seed >>> 0;
  const rng = () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const R = (a, b) => a + rng() * (b - a);
  const L = { hooks: [], pads: [], blocks: [], saws: [], lasers: [], rings: [], coins: [], flags: [], finishX: Infinity };
  const g = { L, x: 90, y: 62, segs: 0, last: '' };
  const hook = (x, y, mv) => { const h = { x, y, bx: x, by: y, mv: mv || null }; L.hooks.push(h); return h; };
  const next = (a, b, mv) => {
    g.x += R(a, b);
    g.y = clamp(g.y + R(-36, 36), mv ? 30 + mv.amp : 34, mv ? 118 - mv.amp : 108);
    return hook(g.x, g.y, mv);
  };
  const coinArc = (a, b, n = 4) => {                // where you fly from one hook to the next
    for (let i = 0; i < n; i++) {
      const k = (i + 1) / (n + 1), x0 = a.x + 50, x1 = b.x - 18;
      L.coins.push({ x: x0 + (x1 - x0) * k, y: (a.y + 50) + (b.y + 8 - a.y - 50) * k - Math.sin(k * Math.PI) * 38 });
    }
  };
  const raise = (h, top) => { if (!h.mv && h.y > top) { h.y = h.by = top; if (h === L.hooks[L.hooks.length - 1]) g.y = top; } };
  hook(90, 62);
  g.seg = () => {
    const d = cfg.diff(g.x), f = cfg.feats(g.x), sp = 138 + d * 28;
    let a = L.hooks[L.hooks.length - 1];
    const opts = [['hooks', g.segs < 1 ? 99 : 2.6]];
    if (f.pad) opts.push(['pad', 1.1]);
    if (f.wall) opts.push(['wall', 0.5 + d]);
    if (f.saw) opts.push(['saw', 0.7 + d]);
    if (f.laser) opts.push(['laser', 0.6 + d]);
    if (f.ring) opts.push(['ring', 0.7]);
    if (f.mover) opts.push(['mover', 0.5 + d]);
    let tot = 0; for (const o of opts) if (o[0] !== g.last || o[0] === 'hooks') tot += o[1];
    let r = rng() * tot, type = 'hooks';
    for (const o of opts) { if (o[0] === g.last && o[0] !== 'hooks') continue; r -= o[1]; if (r <= 0) { type = o[0]; break; } }
    g.last = type; g.segs++;
    if (type === 'hooks') {
      const n = 1 + Math.floor(rng() * 3);
      for (let i = 0; i < n; i++) { const b = next(sp - 14, sp + 18); if (rng() < 0.5) coinArc(a, b); a = b; }
    } else if (type === 'pad') {                    // a gap with no hooks: fall on the pad and bounce up
      raise(a, 80);
      const px = a.x + R(115, 135), pw = 90 - d * 12;
      L.pads.push({ x: px - pw / 2, y: 198, w: pw, h: 12, sq: 0 });
      for (let i = 0; i < 3; i++) L.coins.push({ x: px + 20 + i * 22, y: 120 - i * 26 });
      g.x = px + R(118, 140); g.y = R(42, 70); hook(g.x, g.y);
    } else if (type === 'wall') {                   // a wall from the floor: swing over it (it bounces you back)
      raise(a, 72);
      const b = next(sp + 10, sp + 30), top = 188 - d * 12; raise(b, 80);
      L.blocks.push({ x: (a.x + b.x) / 2 - 8, y: top, w: 16, h: 120 });
      L.coins.push({ x: (a.x + b.x) / 2, y: top - 22 }, { x: (a.x + b.x) / 2, y: top - 40 });
    } else if (type === 'saw') {
      raise(a, 88);
      if (f.sawMove && d > 0.45 && rng() < 0.55) {  // a saw that goes up and down where you fly (out of reach of your swing): wait for it
        const b = next(sp + 62, sp + 80), mx = a.x + 128, amp = R(36, 48), cy = Math.min(a.y, b.y) + R(30, 45);
        L.saws.push({ x: mx, y: cy, bx: mx, by: cy, r: 11, mv: { amp, spd: R(1.3, 1.8), ph: R(0, 6) } });
      } else { const b = next(sp + 4, sp + 24); raise(b, 88); L.saws.push({ x: (a.x + b.x) / 2, y: R(214, 220), r: 13 }); }
      const b = L.hooks[L.hooks.length - 1];
      if (d > 0.35 && rng() < 0.4) L.saws.push({ x: b.x - 30, y: Math.min(a.y, b.y) - R(58, 72), r: 10 });   // and one up high: don't fly too far
    } else if (type === 'laser') {
      raise(a, 80);
      if (d < 0.45 || rng() < 0.5) { const b = next(sp + 6, sp + 26); raise(b, 80); L.lasers.push({ x: (a.x + b.x) / 2, y0: a.y + R(100, 110), y1: 300 }); }
      else { next(sp + 62, sp + 80); L.lasers.push({ x: a.x + 128, y0: -900, y1: 300, per: R(2.3, 2.8), on: 0.9, ph: R(0, 3) }); }   // it blinks: go when it is off
    } else if (type === 'ring') {                   // a long gap with a boost ring in it
      const b = next(sp + 36, sp + 56), k = R(0.45, 0.6);
      L.rings.push({ x: a.x + (b.x - a.x) * k, y: Math.min(a.y, b.y) + R(4, 22), r: 13, used: false });
    } else if (type === 'mover') {
      const b = next(sp, sp + 20, { amp: R(22, 34), spd: R(1.2, 2.0), ph: R(0, 6) });
      if (rng() < 0.5) coinArc(a, b, 3);
    }
  };
  g.extend = toX => { while (g.x < toX) g.seg(); };
  return g;
}
function levelSegs(w, li) { return 7 + li * 2 + w * 4; }
function buildLevel(w, li) {
  const d = clamp((w * WPL + li) / (3 * WPL - 1), 0, 1), f = featsFor(w, li);
  const g = makeGen(1000 + w * 97 + li * 13, { diff: () => d, feats: () => f });
  const n = levelSegs(w, li);
  while (g.segs < n) g.seg();
  const L = g.L, last = L.hooks[L.hooks.length - 1];
  L.finishX = last.x + 150;
  for (let k = 1000; k < L.finishX - 500; k += 1000) {   // a flag every 1000 px: fall, and you start again there
    const h = L.hooks.find(q => q.x >= k && !q.mv);
    if (h && !L.flags.some(q => q.hook === h)) L.flags.push({ x: h.x, hook: h, hit: false });
  }
  L.par = Math.ceil(L.finishX / 230 + 4);
  return L;
}

/* --- 3. PHYSICS ----------------------------------------------------------------------- */
let G = null, demo = null;
function newRun(mode, w = 0, li = 0) {
  const R = { mode, w, li, clock: 0, time: 0, deaths: 0, coins: 0, flips: 0, perfects: 0, combo: 0, bestCombo: 0, airFlips: 0,
    p: { x: 0, y: 0, vx: 0, vy: 0 }, rope: null, relT: -9, lastHook: null, frozen: true, hold: false, pressT: -9, grabT: 0, ang: 0, angVel: 0, spin: 0, flipAcc: 0, face: 1,
    cam: { x: 0, y: 0 }, parts: [], pops: [], trail: [], shake: 0, dead: 0, won: false, wonT: 0, over: false, slow: 0, acc: 0, flash: 0, maxX: 0, gen: null, L: null, theme: 0, hint: 0 };
  if (mode === 'level') { R.L = buildLevel(w, li); R.theme = w; }
  else {
    const endless = mode === 'endless';
    R.gen = makeGen(endless ? (Date.now() & 0xffffff) : 7, {
      diff: x => (endless ? Math.min(1, x / 16000) : 0.15),
      feats: x => (endless ? { pad: x > 500, ring: x > 1400, wall: x > 2400, saw: x > 3400, mover: x > 4200, laser: x > 5200, sawMove: x > 9000 } : { pad: true, ring: true }),
    });
    R.L = R.gen.L; R.gen.extend(1200);
  }
  R.check = R.L.hooks[0];
  spawn(R, R.check);
  R.cam.x = R.p.x - 130;
  return R;
}
function themeAt(R, x) { return R.mode === 'level' ? R.w : R.mode === 'demo' ? 0 : Math.floor(Math.max(0, x) / ENDLESS_THEME) % 3; }
function spawn(R, h) {                          // hang from a hook, pulled back, until you hold
  R.rope = { h, len: 74 }; R.frozen = true; R.hold = false; R.relT = -9; R.lastHook = null;
  R.p.x = h.x - Math.sin(0.85) * 74; R.p.y = h.y + Math.cos(0.85) * 74; R.p.vx = 0; R.p.vy = 0;
  R.ang = Math.atan2(h.x - R.p.x, R.p.y - h.y); R.spin = 0; R.angVel = 0; R.combo = 0; R.trail = []; R.face = 1;
}
function findTarget(R) {                       // the hook you would grab now: close, and better ahead and above you
  const p = R.p; let best = null, bs = 1e9;
  if (R.clock - R.relT < REGRAB) return null;
  for (const h of R.L.hooks) {
    if (h === R.lastHook && R.clock - R.relT < 0.9) continue;   // not the hook you just let go of
    const dx = h.x - p.x, dy = h.y - p.y;
    if (dx < -40 || dx > RANGE) continue;
    const d = Math.hypot(dx, dy);
    if (d > RANGE || d < 8) continue;
    const sc = d - dx * 0.35 + (dy > 0 ? dy * 0.8 : 0);
    if (sc < bs) { bs = sc; best = h; }
  }
  return best;
}
function grab(R) {
  const h = findTarget(R); if (!h) return false;
  const p = R.p, dx = p.x - h.x, dy = p.y - h.y, d = Math.hypot(dx, dy);
  R.rope = { h, len: clamp(d, 22, RANGE) };
  // keep your speed: it turns along the swing instead of being lost into the rope
  const tx = -dy / d, ty = dx / d, vt = p.vx * tx + p.vy * ty, sp = Math.hypot(p.vx, p.vy) * 0.96, sg = vt >= 0 ? 1 : -1;
  if (sp > 60) { p.vx = tx * sg * sp; p.vy = ty * sg * sp; }
  R.pressT = -9; R.grabT = R.clock; R.airFlips = 0; R.flipAcc = 0;
  sfx('grab', R);
  return true;
}
function release(R) {
  const p = R.p, sp = Math.hypot(p.vx, p.vy), up = Math.atan2(-p.vy, p.vx);
  R.lastHook = R.rope.h; R.relT = R.clock; R.rope = null;
  R.spin = clamp(R.angVel * 1.6, -15, 15);
  if (R.clock - R.grabT > 0.2 && p.vx > 140 && sp > 250 && up > 0.42 && up < 1.18) {   // let go on the way up: PERFECT
    R.combo++; R.perfects++; R.bestCombo = Math.max(R.bestCombo, R.combo);
    const k = Math.min(1.1, (sp * 1.07 + 10) / sp); p.vx *= k; p.vy *= k;
    R.coins += R.combo; R.slow = 0.12;
    pop(R, R.combo > 1 ? 'PERFECT X' + R.combo : 'PERFECT!', '#ffd23f');
    sfx('perfect', R);
  } else { R.combo = 0; sfx('release', R); }
}
function setHold(R, v) {
  if (!R || R.dead || R.won) { if (R) R.hold = v; return; }
  if (v && !R.hold) {
    R.hold = true;
    if (R.frozen) { R.frozen = false; R.grabT = R.clock; }
    else if (!R.rope) { R.pressT = R.clock; if (R.clock - R.relT >= REGRAB) grab(R); }   // right after letting go: it grabs a moment later, if you keep holding
  } else if (!v && R.hold) {
    R.hold = false;
    if (R.rope && !R.frozen) release(R);
  }
}
function pop(R, txt, col) { R.pops.push({ x: R.p.x, y: R.p.y - 22, txt, col, t: 0 }); }
function burst(R, x, y, n, cols, sp = 160, life = 0.7) {
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = sp * (0.3 + Math.random() * 0.7); R.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, t: 0, life: life * (0.6 + Math.random() * 0.6), col: cols[i % cols.length], s: 2 + (Math.random() < 0.3 ? 1 : 0) }); }
}
function die(R, why) {
  if (R.dead || R.won) return;
  R.dead = 1.0; R.deaths++; R.rope = null; R.shake = 7; R.combo = 0; R.hold = false;
  burst(R, R.p.x, Math.min(R.p.y, 250), 26, [skinCol(skinOf(R.mode === 'demo' ? 'red' : save.skin), R.clock), '#0b0614', '#ffffff'], 220, 0.9);
  sfx(why === 'fall' ? 'fall' : 'die', R);
}
const STEP = 1 / 120;
function step(R, dt) {
  R.clock += dt;
  const L = R.L, p = R.p;
  for (const h of L.hooks) if (h.mv) h.y = h.by + Math.sin(R.clock * h.mv.spd + h.mv.ph) * h.mv.amp;
  for (const s of L.saws) if (s.mv) s.y = s.by + Math.sin(R.clock * s.mv.spd + s.mv.ph) * s.mv.amp;
  for (const q of R.parts) { q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 380 * dt; }
  if (R.parts.length > 260 || (R.parts.length && R.parts[0].t > R.parts[0].life)) R.parts = R.parts.filter(q => q.t < q.life);
  for (const q of R.pops) q.t += dt;
  if (R.pops.length && R.pops[0].t > 1.1) R.pops.shift();
  for (const pd of L.pads) if (pd.sq > 0) pd.sq -= dt;
  if (R.dead) {
    R.dead -= dt;
    if (R.dead <= 0) { R.dead = 0; if (R.mode === 'level') spawn(R, R.check); else if (R.mode === 'demo') R.reset = true; else R.over = true; }
    return;
  }
  if (R.won) { R.wonT += dt; p.vy += GRAV * 0.3 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 1 - dt * 1.5; p.vy *= 1 - dt * 1.5; R.ang += R.spin * dt; return; }
  if (R.frozen) {                               // hang and sway a little: you start when you hold
    const h = R.rope.h, a = 0.85 + Math.sin(R.clock * 2) * 0.05;
    p.x = h.x - Math.sin(a) * R.rope.len; p.y = h.y + Math.cos(a) * R.rope.len;
    R.ang = Math.atan2(h.x - p.x, p.y - h.y);
    return;
  }
  R.time += dt;
  if (R.hold && !R.rope && R.clock - R.pressT < 0.5) grab(R);   // you pressed a moment too early: grab when a hook comes
  p.vy += GRAV * dt;
  if (R.rope) {
    const h = R.rope.h, dx = p.x - h.x, dy = p.y - h.y, d = Math.hypot(dx, dy) || 1;
    if (dy > -d * 0.3) {                        // under the hook: push the swing forward (clockwise: right at the bottom)
      const tx = dy / d, ty = -dx / d, vt = p.vx * tx + p.vy * ty;
      if (vt > -30) { p.vx += tx * PUMP * dt; p.vy += ty * PUMP * dt; }
    }
    if (R.rope.len > ROPE_MAX) R.rope.len = Math.max(ROPE_MAX, R.rope.len - 300 * dt);
  }
  const sp = Math.hypot(p.vx, p.vy);

    if (UI.button('retry', Math.round(W / 2 - 40), y + 136, 76, 24, 'RETRY', { size: 1, accent: '#ffd23f' })) start('level', R.w, R.li);
    if (!last && UI.button('next', Math.round(W / 2 + 44), y + 136, 80, 24, 'NEXT >', { accent: '#5ad43f' })) start('level', nw, nl);
    if (last) T('YOU BEAT EVERY WORLD!', W / 2, y + 118, '#5ad43f', 1, 'center');
  } else {
    const { y } = panel(240, 150);
    T(R.dist + ' M', W / 2, y + 12, '#fff', 4, 'center', '#000');
    if (R.newBest) T('NEW BEST!', W / 2, y + 46, '#5ad43f', 2, 'center', '#000');
    else T('BEST: ' + Math.floor(save.endless / 10) + ' M', W / 2, y + 48, '#c8b8ff', 1, 'center');
    T('FLIPS ' + R.flips + '   PERFECTS ' + R.perfects + '   BEST COMBO ' + R.bestCombo, W / 2, y + 66, '#c8b8ff', 1, 'center');
    coinIcon(W / 2 - 40, y + 79); T('+' + R.coins, W / 2 - 28, y + 80, '#ffe27a', 2, 'left', '#000');
    if (R.stars) T('★ +' + R.stars, W / 2 + 30, y + 80, '#ffd23f', 2, 'left', '#000');
    T('EVERY 250 M = ★1', W / 2, y + 100, '#9a92b8', 1, 'center');
    if (UI.button('menu', Math.round(W / 2 - 112), y + 118, 108, 24, 'MENU') || UI.back) toMenu();
    if (UI.button('again', Math.round(W / 2 + 4), y + 118, 108, 24, 'AGAIN', { accent: '#5ad43f' })) start('endless');
  }
}
function start(mode, w = 0, li = 0) {
  G = newRun(mode, w, li); state = 'play'; paused = false; held.clear(); ptrs.clear();
  Music.reset();
}
function toMenu() { G = null; state = 'title'; paused = false; held.clear(); ptrs.clear(); }
function setPause(v) { if (state !== 'play' || !G || G.won || G.over) return; paused = v; ptrs.clear(); held.clear(); if (v) Music.reset(); }

/* --- 6. SOUND --------------------------------------------------------------------- */
function sfx(k, R, n = 0) {
  if (!save.sfx || (R && R.mode === 'demo')) return;
  const s = PX.Sound;
  if (k === 'click') s.tone([523, 784], 0.1, { vol: 0.1 });
  else if (k === 'grab') s.tone([420, 760], 0.06, { vol: 0.08 });
  else if (k === 'release') s.noise(0.12, { freq: 1600, vol: 0.06, filter: 'bandpass' });
  else if (k === 'perfect') { s.noise(0.15, { freq: 2600, vol: 0.06, filter: 'highpass' }); s.tone([660 + R.combo * 40, 1320 + R.combo * 80], 0.16, { vol: 0.08 }); }
  else if (k === 'coin') s.tone([1320, 1760], 0.06, { vol: 0.05 });
  else if (k === 'pad') s.tone([180, 620], 0.18, { vol: 0.12 });
  else if (k === 'thud') s.noise(0.08, { freq: 400, vol: 0.18 });
  else if (k === 'flip') s.tone([880, 1320], 0.1, { vol: 0.07, type: 'triangle' });
  else if (k === 'ring') { s.tone([400, 1400], 0.25, { vol: 0.1, type: 'sawtooth' }); s.noise(0.2, { freq: 3000, vol: 0.05, filter: 'highpass' }); }
  else if (k === 'flag') { s.tone(660, 0.08, { vol: 0.08 }); s.tone(990, 0.12, { vol: 0.08, delay: 0.08 }); }
  else if (k === 'cut') s.noise(0.15, { freq: 4000, vol: 0.1, filter: 'highpass' });
  else if (k === 'die') { s.tone([520, 70], 0.4, { vol: 0.12, type: 'sawtooth' }); s.noise(0.3, { freq: 900, vol: 0.15 }); }
  else if (k === 'fall') s.tone([700, 90], 0.55, { vol: 0.1, type: 'triangle' });
  else if (k === 'win') [523, 659, 784, 1047].forEach((f, i) => s.tone(f, 0.16, { vol: 0.1, delay: i * 0.09 }));
  else if (k === 'star') s.tone([784 + n * 200, 1568 + n * 300], 0.18, { vol: 0.1 });
  else if (k === 'buy') [784, 988, 1319].forEach((f, i) => s.tone(f, 0.1, { vol: 0.09, delay: i * 0.07 }));
  else if (k === 'no') s.tone([220, 160], 0.2, { vol: 0.1 });
}
// a little chiptune per world: an arpeggio over four chords and a bass
const SONGS = [
  { bpm: 132, chords: [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]] },
  { bpm: 144, chords: [[52, 55, 59], [48, 52, 55], [50, 54, 57], [47, 51, 54]] },
  { bpm: 150, chords: [[50, 53, 57], [46, 50, 53], [48, 52, 55], [45, 49, 52]] },
];
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
const Music = {
  next: 0, step: 0,
  reset() { this.next = 0; this.step = 0; },
  tick() {
    const c = PX.Sound.ctx;
    if (!c || !save.music || !save.sfx || state !== 'play' || paused || !G || G.over) { this.next = 0; return; }
    const song = SONGS[G.theme] || SONGS[0], sp = 60 / song.bpm / 2;
    if (!this.next || this.next < c.currentTime) this.next = c.currentTime + 0.05;
    while (this.next < c.currentTime + 0.2) {
      const i = this.step++ % 32, ch = song.chords[i >> 3], d = this.next - c.currentTime;
      const arp = [0, 1, 2, 1, 0, 2, 1, 2][i & 7], oct = (i & 7) >= 4 ? 24 : 12;
      PX.Sound.tone(midi(ch[arp] + oct), sp * 0.8, { vol: 0.022, delay: d });
      if ((i & 3) === 0) PX.Sound.tone(midi(ch[0] - 12), sp * 1.8, { vol: 0.05, type: 'triangle', delay: d });
      if ((i & 7) === 4) PX.Sound.noise(0.04, { freq: 6000, vol: 0.02, filter: 'highpass', delay: d });
      this.next += sp;
    }
  },
};

/* --- 7. INPUT: hold anywhere (or a key, or A) --------------------------------------- */
const ptrs = new Set(), held = new Set();
const HOLD_KEYS = ['Space', 'ArrowUp', 'KeyW', 'KeyZ', 'KeyX', 'Enter', 'ArrowRight'];
const syncHold = () => { if (state === 'play' && !paused && G) setHold(G, ptrs.size > 0 || held.size > 0); };
UI.onDown = e => {
  PX.Sound.unlock();
  if (state !== 'play' || paused || UI.downId !== null || !G || G.won || G.over) return;
  ptrs.add(e.pointerId); syncHold();
};
UI.onUp = e => { if (ptrs.delete(e.pointerId)) syncHold(); };
window.addEventListener('keydown', e => {
  PX.Sound.unlock();
  if (HOLD_KEYS.includes(e.code) && state === 'play' && !paused) { e.preventDefault(); if (!e.repeat) { held.add(e.code); syncHold(); } return; }
  if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'play' && G && !G.won && !G.over) setPause(!paused);
  else if (e.code === 'Escape') UI.back = true;
});
window.addEventListener('keyup', e => { if (held.delete(e.code)) syncHold(); });
window.addEventListener('blur', () => setPause(true));
document.addEventListener('visibilitychange', () => { if (document.hidden) setPause(true); });

/* --- 8. MAIN LOOP ----------------------------------------------------------------- */
let last = performance.now();
function run(R, dt, bot) {
  if (bot) setHold(R, botWants(R));
  if (R.slow > 0) { R.slow -= dt; dt *= 0.4; }
  R.acc += dt;
  while (R.acc >= STEP) { step(R, STEP); R.acc -= STEP; }
  if (R.gen) { R.gen.extend(R.cam.x + S.W + 500); if ((R.cullT = (R.cullT || 0) + dt) > 1) { R.cullT = 0; cull(R); } }
  updateCam(R, dt);
}
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000), t = now / 1000; last = now;
  UI.begin();
  if (state === 'title' || state === 'levels' || state === 'shop') {
    if (!demo || demo.reset) demo = newRun('demo');
    run(demo, dt, true);
    drawWorld(demo, t);
    if (state === 'title') drawTitle(t); else if (state === 'levels') drawLevels(t); else drawShop(t);
  } else {
    if (!paused && !G.over) run(G, dt, false);
    else if (G.over) { run(G, dt, false); G.overT = (G.overT || 0) + dt; }
    drawWorld(G, t);
    if (state === 'play' && !G.over) drawHUD(t);
    if (G.won && !G.over && G.wonT > 1.0) { G.over = true; G.overT = 0; finishLevel(G); }
    if (G.over && state === 'play') { if (G.mode === 'endless' && G.dist === undefined) { finishEndless(G); G.overT = 0; } state = 'over'; }
    if (paused) drawPause(); else if (state === 'over') drawOver(t);
  }
  if (msg) { T(msg.txt, S.W / 2, H - 14, '#fff', 1, 'center', '#000'); if ((msg.t -= dt) <= 0) msg = null; }
  UI.end();
  S.blit(THEMES[(G && state !== 'title' && state !== 'levels' && state !== 'shop') ? G.theme : 0].bg);
  Music.tick();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => { /* offline mode unavailable */ }));
}
PX.Pad.setup({
  title: 'Pixel Hook: controller', ui: UI, menu: () => state !== 'play' || paused || !G || G.over,
  phone: { buttons: [['A', 'HOOK']] },
  keys: () => ({ A: 'Space', B: 'Space', RT: 'Space', START: 'KeyP' }),
  help: [['A|B|RT', 'HOLD: GRAB THE HOOK AND SWING, LET GO: FLY'], ['START', 'PAUSE'], ['STICK|D-PAD', 'MENUS: PICK A BUTTON'], ['A', 'MENUS: OK'], ['B', 'MENUS: BACK']],
});
</script>
