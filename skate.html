'use strict';
/* ==========================================================================
   PIXEL SKATE: skateboard racing (part of the PIXEL ARCADE).
   A side view of a city sidewalk. You race 5 rivals to the finish line on a skateboard:
   push to go faster, ollie over cones and benches, fly off kickers and grind rails.
   In the air you do tricks (FLIP, GRAB, SPIN). Land them and you get COINS, a burst of
   speed and BOOST. Land in the middle of a trick and you bail.
   Coins buy new tricks (better tricks score more) and abilities (fast wheels, super ollie,
   nitro, magnet, double jump, a no-bail shield, time warp).
   FREE SKATE: an endless skatepark with no rivals, just skate and do whatever you want.
   RACE A FRIEND: online, with a 4-letter code (the same free PeerJS server as the other games).
     1. Setup   2. The world   3. Skaters   4. Drawing   5. Screens   6. Input   7. Main loop
   ========================================================================== */

/* --- 1. SETUP --------------------------------------------------------------- */

try {

  if (s) { const d = freshSave(); Object.assign(save, s); save.owned = Object.assign(d.owned, s.owned); save.eq = Object.assign(d.eq, s.eq); save.ab = Object.assign({}, s.ab); save.best = Object.assign({}, s.best); }
} catch (e) { /* new player */ }
const store = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* private mode */ } };
const lvl = id => save.ab[id] | 0;

const MY_COLOR = PX.AVATAR_COLORS[profile.avatar.color];

const canvas = document.getElementById('screen');
const S = PX.makeScreen(canvas, { H: 240, minW: 400, maxW: 560 });
const ctx = S.ctx, H = S.H;
const UI = PX.makeUI(S, canvas);
const T = (str, x, y, color = '#fff', size = 1, align = 'left', shadow = null) => PX.drawText(ctx, str, x, y, color, size, align, shadow);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const ord = n => n + (n === 1 ? 'ST' : n === 2 ? 'ND' : n === 3 ? 'RD' : 'TH');
const fmtTime = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0') + '.' + Math.floor(s * 10 % 10);
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shade(hex, k) { const n = parseInt(hex.slice(1), 16); return '#' + [n >> 16 & 255, n >> 8 & 255, n & 255].map(v => clamp(Math.round(v * k), 0, 255).toString(16).padStart(2, '0')).join(''); }
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return [c, g]; }

// world units are pixels; y goes UP from the sidewalk (0). 10 px = 1 metre.

const BK = 256;                    // the world is kept in buckets this wide

  { id: 'flipback', kind: 'spin', name: 'FLIP BACKFLIP', pts: 600, dur: 0.82, cost: 1800, rot: -1, bf: 1 },
  { id: 'cork', kind: 'spin', name: 'CORK 720', pts: 760, dur: 0.92, cost: 2600, rot: -1, turns: 2 },
  { id: 'dfront', kind: 'spin', name: 'DBL FRONTFLIP', pts: 880, dur: 1.02, cost: 3200, rot: 2 },
  { id: 'spin1440', kind: 'spin', name: '1440 SPIN', pts: 1300, dur: 1.25, cost: 5000, turns: 4 },

const TRICK = {}; for (const d of TRICKS) TRICK[d.id] = d;
const KINDS = [['flip', 'FLIP', '#ff6bd0'], ['grab', 'GRAB', '#7af0ff'], ['spin', 'SPIN', '#9be36b']];

// --- abilities (bought with coins) -------------------------------------------------------
const ABIL = [
  { id: 'speed', name: 'FAST WHEELS', desc: 'HIGHER TOP SPEED', max: 5, cost: [150, 300, 500, 800, 1200], color: '#7af0ff' },
  { id: 'ollie', name: 'SUPER JUMP', desc: 'JUMP HIGHER, MORE AIR FOR TRICKS', max: 3, cost: [200, 450, 900], color: '#9be36b' },
  { id: 'nitro', name: 'NITRO', desc: 'STRONGER, LONGER BOOST', max: 3, cost: [250, 550, 1000], color: '#ff8a2a' },
  { id: 'magnet', name: 'COIN MAGNET', desc: 'TAP MAGNET: ALL COINS FLY TO YOU FOR 8 S (1/2/3 A RACE)', max: 3, cost: [150, 350, 700], color: '#e01e1e' },
  { id: 'dbl', name: 'DOUBLE JUMP', desc: 'JUMP AGAIN IN THE AIR', max: 1, cost: [600], color: '#ffd23f' },
  { id: 'shield', name: 'NO-BAIL SHIELD', desc: 'TAP SHIELD: NO BAILS FOR 6 S (1/2 A RACE)', max: 2, cost: [500, 1200], color: '#4aa8ff' },
  { id: 'warp', name: 'TIME WARP', desc: 'TAP WARP: SLOWS YOUR RIVALS FOR 4 S (1/2 A RACE)', max: 2, cost: [800, 1600], color: '#b07aff' },
];

// --- tracks and rivals -------------------------------------------------------------------
const TRACKS = [
  { id: 'city', name: 'CITY STREETS', theme: 'day', len: 1200, seed: 11, ai: [0.8, 0.93], mult: 1, level: 'EASY' },
  { id: 'park', name: 'SUNSET PARK', theme: 'sunset', len: 1600, seed: 23, ai: [0.9, 1.03], mult: 1.5, level: 'MEDIUM' },
  { id: 'night', name: 'NEON NIGHT', theme: 'night', len: 2000, seed: 37, ai: [0.98, 1.1], mult: 2, level: 'HARD' },
];
const PRIZE = [150, 100, 60, 30, 20, 10];
const RIVALS = [
  { name: 'ZIGGY', color: '#e01e5a', hair: '#1a1a1a', skin: '#c88a5a', deck: '#2ad4c4' },
  { name: 'LOLA', color: '#ffd23f', hair: '#e0782a', skin: '#f0c090', deck: '#7a3fc4' },
  { name: 'DUKE', color: '#3fae4a', hair: '#3a2a1a', skin: '#8a5a3a', deck: '#ff8a2a' },
  { name: 'PIP', color: '#b07aff', hair: '#f2e07a', skin: '#f0c8a0', deck: '#3fae4a' },
  { name: 'MAX RAD', color: '#ff8a2a', hair: '#5a2a8a', skin: '#d8a070', deck: '#2a7fd4' },
];
const THEMES = {
  day: { sky: ['#1ea8f0', '#7fd8ff'], cloud: '#fbf3dc', cloudS: '#b8e2ff', far: '#3f8ae0', near: '#2a64c8', nearS: '#2456b0', win: ['#7ec8f8', '#c8c08a', '#9ad8ff'],
    leaf: ['#2a8a34', '#3fae4a', '#6ad05a'], trunk: '#9a5a2a', fence: '#2a4a8a', grass: '#3fae4a', walk: '#c8c0d0', walkS: '#a8a0b8', curb: '#7a7494', road: '#4a4866', dash: '#a8a2c4',
    ramp: ['#d8702a', '#f0a050'], box: ['#7a7890', '#b0aec4'] },
  sunset: { sky: ['#5a2a8a', '#ff9a5a'], cloud: '#ffcaa0', cloudS: '#d0708a', far: '#8a4a8a', near: '#5a2a6a', nearS: '#4a2058', win: ['#ffd27a', '#ff9a6a', '#7a3a7a'],
    leaf: ['#2a5a3a', '#3a7a3a', '#6a9a3a'], trunk: '#6a3a2a', fence: '#3a2a5a', grass: '#4a7a3a', walk: '#d0b0b0', walkS: '#a88a9a', curb: '#7a5a7a', road: '#3a3050', dash: '#c09ab0',
    ramp: ['#c84a5a', '#f07a7a'], box: ['#6a5a7a', '#a08ab0'], sun: '#ffe07a' },
  night: { sky: ['#06061a', '#2a1a5a'], cloud: '#3a3a6a', cloudS: '#22224a', far: '#1a1a3a', near: '#14142e', nearS: '#0e0e22', win: ['#ffd23f', '#ff6bd0', '#2ad4f0', '#1e1e40', '#1e1e40'],
    leaf: ['#123a2a', '#1a5a3a', '#2a7a4a'], trunk: '#3a2a2a', fence: '#2a2a5a', grass: '#1a4a3a', walk: '#5a5a7a', walkS: '#45456a', curb: '#3a3a5a', road: '#1e1e34', dash: '#ff6bd0',
    ramp: ['#7a2ad4', '#b06aff'], box: ['#3a3a6a', '#5a5a9a'], stars: true, lamps: true },
};

/* --- 2. THE WORLD ---------------------------------------------------------------
   features (in buckets):  kicker { x, w, h }  funbox { x, w, h, r }  pad { x, w }       (ramps: the whole sidewalk)
                           rail { x, w, h }    bench { x, w, h }     cone { x, w, h }   (in the middle of the sidewalk)
   coins: { x, y }                                                                                                  */
let W = null;                      // the world (race track, free skatepark or the title screen's)
let G = null;                      // the game being played (or the demo behind the title)
function newWorld(mode, track) {
  const seed = track ? track.seed : (Math.random() * 1e9) | 0;
  W = { mode, track, theme: THEMES[track ? track.theme : 'day'], rnd: mulberry(seed), seedH: seed * 7919, buckets: new Map(), coins: [], genX: 520,
        len: track ? track.len * 10 : Infinity, id: 0, stamp: 0 };
  generate(mode === 'race' ? W.len : 2400);
}
function addFeat(f) {
  f.id = W.id++;
  for (let i = Math.floor(f.x / BK); i <= Math.floor((f.x + f.w) / BK); i++) { let l = W.buckets.get(i); if (!l) W.buckets.set(i, l = []); l.push(f); }
  return f;
}
function featsIn(x0, x1) {
  const out = [], st = ++W.stamp;
  for (let i = Math.floor(x0 / BK); i <= Math.floor(x1 / BK); i++) {
    const l = W.buckets.get(i); if (!l) continue;
    for (const f of l) if (f._s !== st && f.x <= x1 && f.x + f.w >= x0) { f._s = st; out.push(f); }
  }
  return out;
}
function groundAt(x) {
  const l = W.buckets.get(Math.floor(x / BK)); let g = 0;
  if (l) for (const f of l) {
    if (x < f.x || x >= f.x + f.w) continue;
    if (f.type === 'kicker') g = Math.max(g, f.h * (x - f.x) / f.w);
    else if (f.type === 'funbox') { const u = x - f.x; g = Math.max(g, u < f.r ? f.h * u / f.r : u > f.w - f.r ? f.h * (f.w - u) / f.r : f.h); }
  }
  return g;
}
const slopeAt = x => (groundAt(x + 2) - groundAt(x - 2)) / 4;
function coinArc(x0, n, gap, y0, hgt) { for (let i = 0; i < n; i++) W.coins.push({ x: x0 + i * gap, y: y0 + hgt * Math.sin(Math.PI * (i + 0.5) / n) }); }
function coinLine(x0, n, gap, y) { for (let i = 0; i < n; i++) W.coins.push({ x: x0 + i * gap, y }); }
function generate(toX) {
  const free = W.mode !== 'race', hard = W.track ? TRACKS.indexOf(W.track) : 1;
  const SECTIONS = free
    ? [['kicker', 22], ['rail', 16], ['funbox', 12], ['boxrail', 10], ['kickrail', 10], ['bench', 10], ['mega', 6], ['pad', 5], ['cones', 5], ['coins', 4]]
    : [['cones', 18 + hard * 3], ['bench', 13], ['kicker', 18], ['rail', 12], ['funbox', 8], ['boxrail', 4 + hard * 2], ['kickrail', 3 + hard * 3], ['pad', 9], ['coins', 8], ['mega', hard * 2]];
  const total = SECTIONS.reduce((a, s) => a + s[1], 0);
  while (W.genX < toX && W.genX < W.len - 600) {
    const r = W.rnd, x = W.genX;
    let roll = r() * total, type = SECTIONS[0][0];
    for (const [k, wgt] of SECTIONS) { if (roll < wgt) { type = k; break; } roll -= wgt; }
    let w = 0;
    if (type === 'cones') {
      const n = 1 + Math.floor(r() * 3); let cx = x;
      for (let k = 0; k < n; k++) { addFeat({ type: 'cone', x: cx, w: 8, h: 12 }); coinArc(cx - 36, 5, 20, 22, 30); cx += 130 + r() * 70; }
      w = cx - x;
    } else if (type === 'bench') {
      addFeat({ type: 'bench', x, w: 48, h: 16 }); coinArc(x - 30, 6, 20, 30, 26); w = 90;
    } else if (type === 'kicker' || type === 'mega') {
      const h = type === 'mega' ? 56 + r() * 10 : 26 + r() * 16, kw = Math.round(h * (type === 'mega' ? 1.9 : 2.2));
      addFeat({ type: 'kicker', x, w: kw, h }); coinArc(x + kw + 16, 7, 30, h + 26, type === 'mega' ? 90 : 50); w = kw + (type === 'mega' ? 330 : 230);
    } else if (type === 'rail') {
      const rw = Math.round(150 + r() * 130); addFeat({ type: 'rail', x, w: rw, h: 24 }); coinLine(x + 14, Math.floor(rw / 26), 26, 38); w = rw + 40;
    } else if (type === 'kickrail') {
      const h = 30 + r() * 6, kw = Math.round(h * 2.2); addFeat({ type: 'kicker', x, w: kw, h });
      const rw = Math.round(170 + r() * 90); addFeat({ type: 'rail', x: x + kw + 100, w: rw, h: 36 }); coinLine(x + kw + 112, Math.floor(rw / 26), 26, 50);
      w = kw + 100 + rw + 60;
    } else if (type === 'funbox' || type === 'boxrail') {
      const rr = 46, top = Math.round(80 + r() * 90), h = Math.round(22 + r() * 10), bw = 2 * rr + top;
      addFeat({ type: 'funbox', x, w: bw, h, r: rr });
      if (type === 'boxrail') { addFeat({ type: 'rail', x: x + rr + 8, w: top - 16, h: h + 14 }); coinLine(x + rr + 16, Math.floor((top - 16) / 24), 24, h + 28); }
      else coinLine(x + rr + 6, Math.floor(top / 22), 22, h + 10);
      w = bw + 40;
    } else if (type === 'pad') {
      addFeat({ type: 'pad', x, w: 40 }); coinLine(x + 60, 6, 22, 10); w = 200;
    } else {
      coinLine(x, 7, 18, 46); w = 130;
    }
    W.genX = x + w + (free ? 110 + r() * 140 : 150 + r() * 190);
  }
}
function cleanupWorld(x) {
  const k = Math.floor((x - 900) / BK);
  for (const key of [...W.buckets.keys()]) if (key < k) W.buckets.delete(key);
  if (W.coins.length > 300) W.coins = W.coins.filter(c => c.x > x - 600);
}

/* --- 3. SKATERS -------------------------------------------------------------------------- */
function newSkater(o) {
  const [bodyC, bodyG] = makeCanvas(40, 52);
  return Object.assign({ x: 0, y: 0, vy: 0, speed: 0, ground: true, grind: null, grindPts: 0, lastSlope: 0, tilt: 0, trick: null, combo: [], bail: 0,
    pushT: 0, pushCD: 0, land: 0, boostT: 0, meter: 0, usedDbl: false, hit: new Set(), finished: 0, airT: 0, jumpBuf: 0, d: 2,
    top: TOP0, ollieV: OLLIE_V, dbl: false, nitro: 0, name: '', color: '#fff', skin: '#f0b88a', hair: '#6a3a1a', deck: '#e01e1e', ai: null, bodyC, bodyG, sparkT: 0 }, o);
}
function newAI(skill) { return { skill, pace: 1, trick: 0.25 + skill * 0.35, grind: 0.3 + skill * 0.5, risky: 0.02 + (1 - skill) * 0.05, cd: 0, dec: new Map() }; }
function newGame(mode, track, demo, mp) {
  newWorld(mode, track);
  const me = newSkater({ name: profile.name || 'YOU', color: MY_COLOR, d: 2, top: TOP0 * (1 + 0.06 * lvl('speed')), ollieV: OLLIE_V * (1 + 0.1 * lvl('ollie')),
    dbl: lvl('dbl') > 0, nitro: lvl('nitro'), me: true });
  if (demo) { me.ai = newAI(1); me.ai.trick = 0.6; me.ai.risky = 0; me.top = TOP0 * 0.85; me.dbl = true; me.color = '#ffffff'; me.speed = 200; }
  G = { mode, track, demo, me, rivals: [], all: [me], t: 0, count: demo || mode === 'free' ? 0 : 3.2, order: [], earned: 0, trickCoins: 0, pickCoins: 0, bestCombo: 0, landed: 0,
        pops: [], parts: [], shake: 0, flash: 0, warpT: 0, shield: lvl('shield'), shieldT: 0, mags: lvl('magnet'), magT: 0, warps: lvl('warp'), done: false, endT: 0, help: 0, cleanT: 0, results: null };
  if (mp) {                                            // racing a friend online: no computer rivals
    const f = Net.friend || {};
    G.mp = true; G.warps = 0;
    G.friend = newSkater({ name: f.name || 'FRIEND', color: f.color || '#4aa8ff', d: 11, tx: 0, ty: 0, sp: 0, net: true });
    G.all.push(G.friend);
  } else if (mode === 'race') {
    RIVALS.forEach((r, i) => {
      const k = i / (RIVALS.length - 1), skill = 0.45 + 0.5 * k;

const codeInput = document.getElementById('code');

const Net = {
  peer: null, conn: null, live: false, isHost: false, code: '', screen: 'pick', msg: '', friend: null, sendT: 0, track: 0,
  reset() { try { if (this.peer) this.peer.destroy(); } catch (e) { /* gone */ } this.peer = null; this.conn = null; this.live = false; this.code = ''; this.friend = null; this.screen = 'pick'; this.msg = ''; },
  fail(msg) { this.reset(); this.screen = 'error'; this.msg = msg; },
  opts() { return { debug: 0, config: { iceServers: PX.ICE_SERVERS } }; },
  async host() {
    this.reset(); this.isHost = true; this.screen = 'connecting'; this.msg = 'CREATING A GAME';
    try { await PX.loadPeer(); } catch (e) { return this.fail("COULDN'T LOAD ONLINE PLAY. CHECK YOUR INTERNET."); }
    const open = attempt => {
      let code = ''; for (let i = 0; i < 4; i++) code += PX.CODE_CHARS[Math.floor(Math.random() * PX.CODE_CHARS.length)];
      const peer = new Peer('pixel-skate-room-' + code, this.opts()); this.peer = peer;
      peer.on('open', () => { this.code = code; this.screen = 'hosting'; this.msg = ''; });
      peer.on('connection', c => { if (this.live) { c.close(); return; } this.bind(c); });
      peer.on('disconnected', () => { if (this.peer === peer && !peer.destroyed) peer.reconnect(); });
      peer.on('error', e => { if (e.type === 'unavailable-id' && attempt < 3) { peer.destroy(); open(attempt + 1); } else if (!this.live && e.type !== 'network') this.fail("CAN'T REACH THE GAME SERVER. CHECK YOUR INTERNET."); });
    };

  },
  async join(code) {

    peer.on('open', () => this.bind(peer.connect('pixel-skate-room-' + code, { reliable: true, serialization: 'json' })));

  },
  joinTyped() { if (codeInput.value.length === 4) { codeInput.blur(); this.join(codeInput.value); } },
  bind(c) {

  lost() { if (!this.live) return; this.live = false; this.conn = null; if (state === 'online') { this.screen = 'error'; this.msg = 'YOUR FRIEND LEFT.'; } },
  leave() { this.send({ t: 'bye' }); this.live = false; const p = this.peer; this.peer = null; this.conn = null; setTimeout(() => { try { if (p) p.destroy(); } catch (e) { /* gone */ } }, 150); },
  send(m) { if (this.conn && this.conn.open) try { this.conn.send(m); } catch (e) { /* closing */ } },
  sendPos(P) {                                       // 20 times a second: where you are and what you're doing
    const now = performance.now(); if (now - this.sendT < 50) return; this.sendT = now;
    this.send({ t: 'p', x: Math.round(P.x), y: Math.round(P.y), s: Math.round(P.speed), g: P.grind ? 1 : 0, gt: P.grind ? P.grind.type : '', o: P.ground ? 1 : 0,
                k: P.trick ? P.trick.d.id : '', kt: P.trick ? Math.round(P.trick.t * 100) / 100 : 0, b: Math.round(P.bail * 100) / 100, pu: P.pushT > 0 ? 1 : 0,

/* --- sound --- */
function sfx(k) {
  if (!save.sfx) return;
  const s = PX.Sound;
  if (k === 'click') s.tone([523, 784], 0.12, { vol: 0.1 });
  else if (k === 'push') s.noise(0.1, { freq: 500, vol: 0.06 });
  else if (k === 'ollie') { s.noise(0.05, { freq: 2600, vol: 0.18, filter: 'highpass' }); s.tone([200, 420], 0.1, { vol: 0.05, type: 'triangle' }); }
  else if (k === 'dbl') s.tone([400, 900], 0.15, { vol: 0.07, type: 'triangle' });
  else if (k === 'land') s.noise(0.09, { freq: 420, vol: 0.2 });
  else if (k === 'whoosh') s.noise(0.15, { freq: 1800, vol: 0.06, filter: 'bandpass' });
  else if (k === 'trick') s.tone([660, 990], 0.1, { vol: 0.06 });
  else if (k === 'landed') s.tone([523, 659, 784], 0.25, { vol: 0.08 });
  else if (k === 'big') s.tone([523, 659, 784, 1047, 1319], 0.5, { vol: 0.1 });
  else if (k === 'grind') s.noise(0.06, { freq: 4200, vol: 0.035, filter: 'bandpass' });
  else if (k === 'coin') s.tone([988, 1319], 0.08, { vol: 0.05 });
  else if (k === 'cone') s.tone([500, 300], 0.12, { vol: 0.05, type: 'triangle' });
  else if (k === 'crash') { s.noise(0.35, { freq: 300, vol: 0.3 }); s.tone([300, 90], 0.3, { vol: 0.07, type: 'sawtooth' }); }
  else if (k === 'boost') { s.tone([200, 700], 0.4, { vol: 0.06, type: 'sawtooth' }); s.noise(0.4, { freq: 2000, vol: 0.05, filter: 'bandpass' }); }
  else if (k === 'warp') s.tone([800, 200, 600], 0.6, { vol: 0.08, type: 'sine' });
  else if (k === 'magnet') s.tone([300, 600, 300, 900], 0.5, { vol: 0.07, type: 'triangle' });
  else if (k === 'shield') s.tone([1200, 600], 0.3, { vol: 0.08, type: 'triangle' });
  else if (k === 'beep') s.tone(440, 0.15, { vol: 0.1 });
  else if (k === 'go') s.tone(880, 0.4, { vol: 0.12 });
  else if (k === 'finish') s.tone([523, 659, 784, 1047, 1319], 0.8, { vol: 0.1 });
  else if (k === 'buy') s.tone([523, 659, 784, 1047], 0.35, { vol: 0.1 });
}

/* --- 6. INPUT: keys, on-screen buttons, a game controller ---------------------------------- */
const playing = () => state === 'play' && !paused && G && !G.done;
UI.onDown = (e, x, y) => {
  PX.Sound.unlock();
  if (e.pointerType === 'touch') touchUI = true;
  if (!playing() || UI.downId !== null || !touchUI) return;
  for (const b of touchButtons()) if (x >= b.x && x < b.x + b.w && y >= b.y && y < b.y + b.h) {
    held.set(e.pointerId, b.id);
    if (b.id === 'push') inp.touchPush++; else inp.q.push(b.id);
    return;
  }
  inp.q.push('ollie');                               // a tap anywhere else is an ollie too
};
UI.onUp = e => { const id = held.get(e.pointerId); if (id === undefined) return; held.delete(e.pointerId); if (id === 'push') inp.touchPush = Math.max(0, inp.touchPush - 1); };
const KEYS = { Space: 'ollie', ArrowUp: 'ollie', KeyW: 'ollie', KeyJ: 'flip', KeyZ: 'flip', KeyK: 'grab', KeyX: 'grab', KeyL: 'spin', KeyC: 'spin',
               KeyE: 'boost', ShiftLeft: 'boost', ShiftRight: 'boost', KeyQ: 'warp', KeyR: 'shield', KeyF: 'magnet' };
window.addEventListener('keydown', e => {
  PX.Sound.unlock();
  if (e.target === codeInput) { if (e.code === 'Enter') Net.joinTyped(); return; }
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
  if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'play' && G && !G.done) { setPause(!paused); return; }
  if (e.code === 'Escape') { UI.back = true; return; }
  if (e.code === 'ArrowRight' || e.code === 'KeyD') inp.keyPush = true;
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') inp.keyBrake = true;
  if (!playing() || e.repeat) return;
  if (KEYS[e.code]) { inp.q.push(KEYS[e.code]); lit[KEYS[e.code]] = performance.now() + 150; }
});
window.addEventListener('keyup', e => {
  if (e.code === 'ArrowRight' || e.code === 'KeyD') inp.keyPush = false;
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') inp.keyBrake = false;
});
window.addEventListener('blur', () => { inp.keyPush = inp.keyBrake = false; setPause(true); });
document.addEventListener('visibilitychange', () => { if (document.hidden) setPause(true); });

/* --- 7. MAIN LOOP ----------------------------------------------------------------- */
const STEP = 1 / 120;
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000), t = now / 1000; last = now;
  UI.begin();
  const run = (state !== 'play' || !paused) && state !== 'results';
  if (run) {
    acc += dt;
    const slow = G.mode === 'free' && G.warpT > 0 && !G.demo ? 0.5 : 1;
    while (acc >= STEP) { step(STEP * slow); if (slow < 1) G.warpT -= STEP * 0.5; acc -= STEP; }
  } else acc = 0;
  updateCam(run ? dt : 0);
  drawWorld(t);
  if (state === 'title') drawTitle(t);
  else if (state === 'online') drawOnline(t);
  else if (state === 'tracks') drawTracks(t);
  else if (state === 'shop') drawShop(t);
  else {
    hud(t);
    if (state === 'results') drawResults(t);
    else if (paused) drawPause();
  }
  UI.end();
  S.blit('#0d0b13');
  requestAnimationFrame(frame);
}
toTitle();
requestAnimationFrame(frame);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => { /* offline mode unavailable */ }));
}
PX.Pad.setup({
  title: 'Pixel Skate: controller', ui: UI, menu: () => !playing(),
  phone: { stick: 'PUSH / BRAKE', dpad: true, buttons: [['A', 'JUMP'], ['X', 'FLIP'], ['Y', 'GRAB'], ['B', 'SPIN'], ['RB', 'BOOST'], ['LB', 'WARP'], ['LT', 'MAGNET'], ['down', 'SHIELD']] },
  keys: () => ({ A: 'Space', up: 'Space', X: 'KeyJ', Y: 'KeyK', B: 'KeyL', right: 'ArrowRight', RT: 'ArrowRight', left: 'ArrowLeft', LT: 'KeyF', down: 'KeyR', RB: 'KeyE', LB: 'KeyQ', START: 'KeyP' }),
  help: [['RT|RIGHT', 'PUSH'], ['LEFT', 'BRAKE'], ['A', 'JUMP (AGAIN IN THE AIR: DOUBLE JUMP)'], ['X', 'FLIP TRICK'], ['Y', 'GRAB TRICK'], ['B', 'SPIN TRICK'], ['RB', 'BOOST'], ['LB', 'TIME WARP'], ['LT', 'MAGNET'], ['DOWN', 'SHIELD'], ['START', 'PAUSE'], ['A', 'MENUS: OK'], ['B', 'MENUS: BACK']],
});
</script>
