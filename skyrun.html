<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Pixel Sky Run: parkour on the roofs of planes flying above the clouds. Jump, slide and switch planes, and don't let the officer catch you.">
<meta name="theme-color" content="#0d0b13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Pixel Sky Run</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0b13; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #screen { position: fixed; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<script src="common.js"></script>
<script>
'use strict';
/* ==========================================================================
   PIXEL SKY RUN: parkour on planes (part of the PIXEL ARCADE).
   Three lanes of planes fly in a row above the clouds. A boy runs along their roofs,
   jumps from plane to plane, slides under bars and switches lanes, while an officer
   chases him. Flat 2D drawing with a perspective camera, so it looks 3D.
   Swipe (or arrows / WASD): LEFT / RIGHT change plane, UP jumps, DOWN slides.
   Stumble twice in a row and the officer catches you. Miss a jump and you fall
   (into the clouds, with a parachute).
     1. Setup   2. The world   3. The run   4. 3D drawing   5. Characters   6. Screens   7. Input   8. Main loop
   ========================================================================== */

/* --- 1. SETUP --------------------------------------------------------------- */
const VERSION = '1.0.0';
const SAVE_KEY = 'pixelSkyRun.save';
const save = { best: 0, coins: 0, runs: 0, sfx: true, up: { jet: 0, mag: 0, x2: 0 }, seenHelp: false };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s) { Object.assign(save, s); save.up = Object.assign({ jet: 0, mag: 0, x2: 0 }, s.up); } } catch (e) { /* new player */ }
const store = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* private mode */ } };
const profile = PX.Profile.get();
const MY_COLOR = PX.AVATAR_COLORS[profile.avatar.color];

const canvas = document.getElementById('screen');
const S = PX.makeScreen(canvas, { H: 240, minW: 400, maxW: 560 });
const ctx = S.ctx, H = S.H;
const UI = PX.makeUI(S, canvas);
const T = (str, x, y, color = '#fff', size = 1, align = 'left', shadow = null) => PX.drawText(ctx, str, x, y, color, size, align, shadow);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];

const LANE = 2.6;                  // distance between lanes (world units, about a metre each)
const laneX = l => (l - 1) * LANE;
const BODY = 0.62;                 // half width of a plane roof you can stand on
const GRAV = 30, JUMP_V = 10.2;    // a jump: about 0.68 s in the air, 1.7 high
const SPEED0 = 14, SPEED_MAX = 30, SPEED_UP = 0.11;
const RUN_H = 1.6, SLIDE_H = 0.7;
const JET_Y = 7;
const POWER = {                    // power-ups: how long they last (+ shop upgrades)
  jet: { name: 'JETPACK', time: lvl => 6 + lvl * 1.5, color: '#ff8a2a' },
  mag: { name: 'MAGNET', time: lvl => 9 + lvl * 2.5, color: '#e01e1e' },
  x2: { name: '2X COINS', time: lvl => 10 + lvl * 3, color: '#ffd23f' },
};
const UP_MAX = 4;
const upCost = lvl => 150 * (lvl + 1);

/* --- 2. THE WORLD ---------------------------------------------------------------
   planes:    { lane, z0, z1, liv }        a plane's roof is floor from z0 (tail) to z1 (nose)
   obstacles: { lane, z, d, type }         crate (jump or stand on it), bar (slide), cargo (switch lane)
   coins:     { x, y, z }                  powers: { x, y, z, kind }                                   */
const LIVERIES = [
  { stripe: '#e01e1e', tail: '#e01e1e' }, { stripe: '#2a7fd4', tail: '#1a4f9a' }, { stripe: '#3fae4a', tail: '#2a7a34' },
  { stripe: '#ff8a2a', tail: '#ff6a1a' }, { stripe: '#7a3fc4', tail: '#5a2a9a' }, { stripe: '#1ec8e0', tail: '#ffd23f' },
];
let W = null;                      // the world of the current run (or of the title screen)
function newWorld(demo) {
  W = { demo, planes: [], obstacles: [], coins: [], powers: [], next: [0, 0, 0], rowZ: 60, powerZ: 220, genTo: 0, puffs: [], decor: [] };
  for (let l = 0; l < 3; l++) { const z1 = 50 + l * 9 + rnd(0, 10); W.planes.push({ lane: l, z0: -30, z1, liv: pick(LIVERIES) }); W.next[l] = z1; }
  for (let i = 0; i < 46; i++) W.puffs.push({ x: rnd(-90, 90), z: rnd(0, 260), r: rnd(5, 13) });
  for (let i = 0; i < 3; i++) W.decor.push({ x: rnd(-1, 1), y: rnd(0.15, 0.55), v: rnd(0.008, 0.02) * (Math.random() < 0.5 ? -1 : 1), s: rnd(0.6, 1.2) });
}
function planeAt(l, z) { for (const p of W.planes) if (p.lane === l && z >= p.z0 && z <= p.z1) return p; return null; }
function laneOfX(x) { const l = Math.round(x / LANE) + 1; return l >= 0 && l <= 2 && Math.abs(x - laneX(l)) < BODY + 0.35 ? l : -1; }
// the roof under (x, z): 0, or null (open sky)
function floorAt(x, z) { const l = laneOfX(x); return l >= 0 && planeAt(l, z) ? 0 : null; }
// what you can stand on at (x, z) from height y: the roof, a crate top (if you're above it), or null
function supportAt(x, z, y) {
  const f = floorAt(x, z); if (f === null) return null;
  const l = laneOfX(x);
  let s = f;
  for (const o of W.obstacles) if (o.lane === l && o.type === 'crate' && z > o.z - 0.25 && z < o.z + o.d + 0.25 && y >= o.top - 0.4) s = Math.max(s, o.top);
  return s;
}
function speedAt(z) { const sp = G ? G.speed : SPEED0; const dz = Math.max(0, z - (G ? G.z : 0)); return Math.min(SPEED_MAX, sp + dz / Math.max(sp, 1) * SPEED_UP); }
function generate(toZ) {
  // the planes: each lane is a line of planes with gaps to jump
  for (let l = 0; l < 3; l++) {
    while (W.next[l] < toZ + 80) {
      const sp = speedAt(W.next[l]), gap = W.demo ? rnd(4, 7) : sp * rnd(0.2, 0.36);
      const z0 = W.next[l] + gap, z1 = z0 + rnd(30, 75);
      W.planes.push({ lane: l, z0, z1, liv: pick(LIVERIES) });
      W.next[l] = z1;
    }
  }
  if (W.demo) return;
  // rows of obstacles, coins and now and then a power-up
  while (W.rowZ < toZ) {
    const z = W.rowZ, sp = speedAt(z);
    W.rowZ += Math.max(15, sp * rnd(0.95, 1.5));
    const ok = l => {                                      // room for an obstacle here: on a roof, not just after a gap
      const p = planeAt(l, z - 3), q = planeAt(l, z + 11);
      return p && p === q && z - p.z0 > sp * 0.42 + 3;
    };
    const lanes = [0, 1, 2].sort(() => Math.random() - 0.5);
    const n = Math.random() < 0.45 ? 1 : Math.random() < 0.8 ? 2 : 3;
    const types = [];
    let walls = 0;
    for (let k = 0; k < 3; k++) {
      const l = lanes[k];
      if (k >= n || !ok(l)) { types[l] = null; continue; }
      let t = Math.random() < 0.38 ? 'crate' : Math.random() < 0.5 ? 'bar' : 'cargo';
      if (t === 'cargo' && (walls >= 1 && (n === 3 || walls >= 2))) t = 'crate';
      if (t === 'cargo') walls++;
      types[l] = t;
    }
    if ([0, 1, 2].every(l => types[l] === 'cargo')) types[lanes[0]] = 'crate';
    for (let l = 0; l < 3; l++) {
      const t = types[l]; if (!t) continue;
      if (t === 'crate') W.obstacles.push({ lane: l, z, d: 1.4, type: t, top: 0.95, h0: 0, h1: 0.95, look: Math.random() < 0.5 ? 0 : 1 });
      else if (t === 'bar') W.obstacles.push({ lane: l, z, d: 0.4, type: t, h0: 0.95, h1: 2.4 });
      else W.obstacles.push({ lane: l, z, d: rnd(5, 9), type: t, h0: 0, h1: 2.8, look: Math.floor(Math.random() * 3) });
    }
    // coins: a line in a lane you can run (over crates and gaps they go up)
    if (Math.random() < 0.8) {
      const free = [0, 1, 2].filter(l => types[l] !== 'cargo');
      const l = pick(free), z0 = z - 7 - rnd(0, 5);
      for (let i = 0; i < 7; i++) {
        const cz = z0 + i * 2;
        let y = 0.7;
        const base = planeAt(l, cz);
        if (!base) y = 1.9;
        for (const o of W.obstacles) if (o.lane === l && Math.abs(cz - (o.z + o.d / 2)) < 2.4) { if (o.type === 'crate') y = 1.75; else if (o.type === 'bar') y = 0.45; else if (o.type === 'cargo') y = -9; }
        if (y > -9) W.coins.push({ x: laneX(l), y, z: cz });
      }
    }
    if (z > W.powerZ) {
      const free = [0, 1, 2].filter(l => !types[l] && planeAt(l, z + 8) && planeAt(l, z + 6));
      if (free.length) { W.powers.push({ x: laneX(pick(free)), y: 0.9, z: z + 7, kind: pick(['jet', 'mag', 'x2']) }); W.powerZ = z + rnd(220, 380); }
    }
  }
}
function cleanup(z) {
  W.planes = W.planes.filter(p => p.z1 > z - 20);
  W.obstacles = W.obstacles.filter(o => o.z + o.d > z - 20);
  W.coins = W.coins.filter(c => c.z > z - 10 && !c.taken);
  W.powers = W.powers.filter(c => c.z > z - 10 && !c.taken);
}

/* --- 3. THE RUN -------------------------------------------------------------------- */
let state = 'title';            // title | shop | play | over
let paused = false;
let G = null;
function newGame() {
  newWorld(false);
  G = {
    z: 0, x: laneX(1), lane: 1, prevLane: 1, y: 0, vy: 0, ground: true, slide: 0, speed: SPEED0,
    meters: 0, coins: 0, score: 0, stumble: 0, hurt: 0, flash: 0, shake: 0, flip: 0, flipOn: false,
    cop: { gap: 3.4, x: laneX(1) + 0.35, y: 0, vy: 0, z: -3.4, near: 0, intro: 3.2, talk: 2.2, say: 'HEY! STOP!' },
    jet: 0, mag: 0, x2: 0, glide: 0, end: null, endT: 0, falling: false, t: 0, pops: [], help: save.seenHelp ? 0 : 6,
    newBest: false, stars: 0, fallY: 0,
  };
  generate(200);
  state = 'play'; paused = false;
  save.runs++; store();
  sfx('whistle');
}
const coinMult = () => (G.x2 > 0 ? 2 : 1);
function pop(text, color, big) { G.pops.push({ text, color, t: 0, big }); }
function move(dir) {
  if (!G || G.end || paused || state !== 'play') return;
  const to = clamp(G.lane + dir, 0, 2);
  if (to === G.lane) return;
  G.prevLane = G.lane; G.lane = to; sfx('swoosh');
}
function jump() {
  if (!G || G.end || paused || state !== 'play' || G.jet > 0) return;
  if (G.ground || G.coyote > 0) {
    G.vy = JUMP_V; G.ground = false; G.slide = 0; G.coyote = 0;
    G.flipOn = Math.random() < 0.3; G.flip = 0;
    sfx('jump');
  }
}
function slide() {
  if (!G || G.end || paused || state !== 'play' || G.jet > 0) return;
  if (!G.ground) G.vy = Math.min(G.vy, -16);              // in the air: dive down
  G.slide = 0.65; sfx('slide');
}
function stumble(soft) {
  if (G.hurt > 0 || G.end) return;
  G.shake = 0.3; G.hurt = 0.9; G.flash = 0.5;
  if (G.cop.near > 0) { endRun('caught'); return; }
  G.cop.near = 5; G.cop.talk = 1.6; G.cop.say = pick(['GOT YOU NOW!', 'STOP RIGHT THERE!', 'HEY YOU!', 'NOT SO FAST!']);
  G.speed = Math.max(SPEED0, G.speed * (soft ? 0.97 : 0.9));
  sfx('stumble'); setTimeout(() => sfx('whistle'), 200);
}
function endRun(why) {
  if (G.end) return;
  G.end = why; G.endT = 0;
  if (why === 'caught') { G.cop.near = 9; G.cop.say = 'GOTCHA!'; G.cop.talk = 3; sfx('caught'); }
  else { G.falling = true; G.camZ = cam.z; G.cop.say = 'HE JUMPED!'; G.cop.talk = 3; G.cop.intro = 9; sfx('fall'); }
  G.help = 0;
}
function finish() {
  state = 'over';
  G.score = Math.floor(G.meters);
  if (G.score > save.best) { save.best = G.score; G.newBest = true; }
  save.coins += G.coins;
  G.stars = Math.floor(G.score / 400);
  if (G.stars) PX.Wallet.add(G.stars);
  store();
}
function takePower(kind) {
  const t = POWER[kind].time(save.up[kind] | 0);
  G[kind] = t;
  if (kind === 'jet') { G.vy = 0; G.slide = 0; G.ground = false; G.jetCoinZ = G.z + 6; }
  pop(POWER[kind].name + '!', POWER[kind].color, true);
  sfx('power');
}
function step(dt) {
  if (!G) return;
  G.t += dt;
  const cop = G.cop;
  if (G.end) {
    G.endT += dt;
    if (G.end === 'caught') { G.speed = Math.max(0, G.speed - 60 * dt); cop.gap = Math.max(1.0, cop.gap - 5 * dt); cop.x += (G.x - cop.x) * Math.min(1, dt * 10); }
    else { G.speed = Math.max(0, G.speed - 25 * dt); G.vy -= 6 * dt; G.vy = Math.max(G.vy, -2.2); G.y += G.vy * dt; }
    G.z += G.speed * dt;
    if (G.end === 'caught') cop.z = G.z - cop.gap;
    for (const p of G.pops) p.t += dt;
    if (G.endT > 2.2 && state === 'play') finish();
    return;
  }
  G.speed = Math.min(SPEED_MAX, G.speed + SPEED_UP * dt);
  const pz = G.z;
  G.z += G.speed * dt; G.meters += G.speed * dt;
  // left / right
  const tx = laneX(G.lane), oldX = G.x;
  G.x += clamp(tx - G.x, -16 * dt, 16 * dt);
  // up / down
  const h = () => (G.slide > 0 ? SLIDE_H : RUN_H);
  if (G.jet > 0) {
    G.jet -= dt;
    G.y += (JET_Y - G.y) * Math.min(1, dt * 3); G.vy = 0; G.ground = false;
    while (G.jetCoinZ < G.z + 90) {                        // a trail of coins in the sky
      W.coins.push({ x: laneX(([1, 0, 1, 2])[Math.floor(G.jetCoinZ / 18) % 4]), y: JET_Y + 0.4, z: G.jetCoinZ }); G.jetCoinZ += 2.2;
    }
    if (G.jet <= 0) { G.glide = 5; W.coins = W.coins.filter(c => c.y < JET_Y || c.z < G.z + 10); }
  } else {
    const f = supportAt(G.x, G.z, G.y);
    G.vy -= GRAV * dt;
    if (G.glide > 0) { G.glide -= dt; if (f === null) G.vy = Math.max(G.vy, -2); else G.vy = Math.max(G.vy, -9); }
    G.y += G.vy * dt;
    if (f !== null && G.y <= f && G.y > f - 0.45 && G.vy <= 0) {
      if (!G.ground && G.vy < -4) sfx('land');
      G.y = f; G.vy = 0; G.ground = true; G.coyote = 0.08; G.glide = 0;
    } else {
      if (G.ground) G.coyote = 0.08;
      G.ground = false;
      G.coyote = Math.max(0, (G.coyote || 0) - dt);
    }
    if (f === null && G.y < -0.5) { endRun('fell'); return; }
  }
  if (G.slide > 0) G.slide -= dt;
  if (!G.ground && G.flipOn) G.flip += dt * 9.5;
  // obstacles
  if (G.jet <= 0) for (const o of W.obstacles) {
    if (o.hit || o.z > G.z + 1 || o.z + o.d < G.z - 1) continue;
    const ox = laneX(o.lane);
    if (Math.abs(G.x - ox) > 0.95) continue;
    const zIn = G.z + 0.3 > o.z && G.z - 0.3 < o.z + o.d;
    if (!zIn) continue;
    const top = G.y + h();
    if (top <= o.h0 + 0.02 || G.y >= o.h1 - 0.02) continue;      // under the bar or above it
    if (o.type === 'crate' && G.y >= o.top - 0.4) { if (G.vy <= 0) { G.y = o.top; G.vy = 0; G.ground = true; } continue; }   // on top of it
    if (pz + 0.3 > o.z) {                                     // it was already beside you: you ran into its side, bounce back
      G.lane = G.prevLane; G.x = oldX + (oldX > ox ? 0.15 : -0.15); stumble(true);
      if (o.type !== 'cargo') o.hit = true;
      continue;
    }
    if (o.type === 'cargo') { o.hit = true; G.speed = 0; G.shake = 0.5; sfx('crash'); endRun('caught'); return; }
    o.hit = true; stumble(false);
  }
  // the tail fin at the start of a plane: vault over it
  if (G.ground && G.jet <= 0) { const l = laneOfX(G.x); if (l >= 0) { const p = planeAt(l, G.z + 0.6); if (p && G.z < p.z0 + 0.3 && G.y < 0.1) { G.vy = 6.5; G.ground = false; } } }
  // coins and power-ups
  const magR = G.mag > 0 ? 6 : 0;
  for (const c of W.coins) {
    if (c.taken) continue;
    const dz = c.z - G.z;
    if (magR && dz < 18 && dz > -1 && c.y < JET_Y - 1) { c.x += (G.x - c.x) * Math.min(1, dt * 8); c.y += (G.y + 0.8 - c.y) * Math.min(1, dt * 8); c.z -= Math.min(dz, 20 * dt); }
    if (Math.abs(dz) < 0.9 && Math.abs(c.x - G.x) < 0.9 && c.y > G.y - 0.4 && c.y < G.y + h() + 0.4) {
      c.taken = true; G.coins += coinMult(); sfx('coin');
    }
  }
  for (const p of W.powers) if (!p.taken && Math.abs(p.z - G.z) < 0.9 && Math.abs(p.x - G.x) < 0.9 && p.y > G.y - 0.5 && p.y < G.y + h() + 0.5) { p.taken = true; takePower(p.kind); }
  if (G.mag > 0) G.mag -= dt;
  if (G.x2 > 0) G.x2 -= dt;
  // the officer
  cop.near = Math.max(0, cop.near - dt);
  cop.intro = Math.max(0, cop.intro - dt);
  cop.talk = Math.max(0, cop.talk - dt);
  const close = cop.near > 0 || cop.intro > 0, want = close ? 3.4 : 14;
  cop.gap += (want - cop.gap) * Math.min(1, dt * (close ? 3 : 0.6));
  cop.z = G.z - cop.gap;
  cop.x += (G.x + 0.35 - cop.x) * Math.min(1, dt * 5);
  const cl = laneOfX(cop.x), ahead = cl >= 0 ? planeAt(cl, cop.z + 1.5) : null, under = cl >= 0 ? planeAt(cl, cop.z) : null;
  cop.vy -= GRAV * dt; cop.y += cop.vy * dt;
  if (cop.y <= 0) {
    cop.y = 0; cop.vy = 0;
    if (!ahead || !under) cop.vy = JUMP_V;                  // he jumps the gaps too
    for (const o of W.obstacles) if (o.lane === cl && o.z > cop.z && o.z < cop.z + 1.6 && o.type !== 'cargo') { if (o.type === 'crate') cop.vy = JUMP_V; }
  }
  // flashes and the world ahead
  G.hurt = Math.max(0, G.hurt - dt); G.flash = Math.max(0, G.flash - dt); G.shake = Math.max(0, G.shake - dt);
  if (G.help > 0 && G.t > 1) { G.help -= dt; if (G.help <= 0 && !save.seenHelp) { save.seenHelp = true; store(); } }
  for (const p of G.pops) p.t += dt;
  G.pops = G.pops.filter(p => p.t < 1.3);
  if (Math.floor(G.meters / 500) > Math.floor((G.meters - G.speed * dt) / 500)) { pop(Math.floor(G.meters / 500) * 500 + 'M!', '#7af0ff'); sfx('milestone'); }
  generate(G.z + 160);
  cleanup(G.z);
}

/* --- 4. 3D DRAWING: a camera behind the boy, everything projected onto the screen ---- */
const F = 190, NEAR = 0.6, FAR = 150;
const cam = { x: 0, y: 3.2, z: -6, hor: 92 };
const SKY_FOG = [196, 228, 255];
function project(x, y, z) {
  const dz = z - cam.z;
  if (dz < NEAR - 1e-6) return null;
  const k = F / dz;
  return { x: S.W / 2 + (x - cam.x) * k, y: cam.hor + (cam.y - y) * k, k };
}
function fogged(rgb, z) {
  const f = clamp((z - cam.z - 40) / (FAR - 40), 0, 1) * 0.85;
  return 'rgb(' + Math.round(rgb[0] + (SKY_FOG[0] - rgb[0]) * f) + ',' + Math.round(rgb[1] + (SKY_FOG[1] - rgb[1]) * f) + ',' + Math.round(rgb[2] + (SKY_FOG[2] - rgb[2]) * f) + ')';
}
const rgbCache = {};
function rgb(hex) { if (rgbCache[hex]) return rgbCache[hex]; const n = parseInt(hex.slice(1), 16); return (rgbCache[hex] = [n >> 16 & 255, n >> 8 & 255, n & 255]); }
// a polygon of world points (clipped at the near plane)
function poly(pts, color, z) {
  const out = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    const ina = a[2] - cam.z >= NEAR, inb = b[2] - cam.z >= NEAR;
    if (ina) out.push(a);
    if (ina !== inb) { const t = (cam.z + NEAR - a[2]) / (b[2] - a[2]); out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, cam.z + NEAR + 1e-4]); }
  }
  if (out.length < 3) return;

  ctx.beginPath();

  R(-0.28, hip - 0.02, 0.56, 0.06, dark);
  if (!jetOn) { R(-0.18, hip + 0.12, 0.36, 0.34, '#3a3a46'); R(-0.14, hip + 0.4, 0.28, 0.05, '#59626f'); }
  const armL = air ? 0.3 : -sw * 0.18, armR = air ? 0.3 : sw * 0.18;
  R(-0.38, hip + 0.12 + armL, 0.1, 0.38, hood); R(0.28, hip + 0.12 + armR, 0.1, 0.38, hood);
  R(-0.38, hip + 0.08 + armL, 0.1, 0.07, skin); R(0.28, hip + 0.08 + armR, 0.1, 0.07, skin);
  // head (seen from behind: hair and ears), a flip squashes it
  const hh = 0.38 * Math.max(0.35, Math.abs(flip));
  R(-0.2, top, 0.4, hh, hair); R(-0.23, top + hh * 0.35, 0.04, 0.1, skin); R(0.19, top + hh * 0.35, 0.04, 0.1, skin);
  R(-0.2, top + hh * 0.8, 0.4, hh * 0.25, hood);   // a cap in your color
  if (flip < 0) R(-0.12, top + 0.06, 0.24, 0.12, skin);
}
function drawCop(t) {
  if (!G) return;
  const c = G.cop, dz = c.z - cam.z;
  if (dz < NEAR + 0.4 || c.gap > 11) return;
  shadowAt(c.x, c.z, c.y);
  const d = rectsAt(c.x, c.y, c.z); if (!d) return;
  const { R, a, k } = d;
  const run = c.z * 0.5, sw = Math.sin(run * 3.4), navy = '#1d2c5a', navy2 = '#14204a', skin = '#e8b080';
  const air = c.y > 0.05, caught = G.end === 'caught';
  const legL = air ? 0.15 : Math.max(0, sw) * 0.22, legR = air ? 0.15 : Math.max(0, -sw) * 0.22;
  R(-0.26, legL + 0.1, 0.2, 0.68 - legL, navy2); R(0.06, legR + 0.1, 0.2, 0.68 - legR, navy2);
  R(-0.28, legL, 0.24, 0.12, '#111'); R(0.04, legR, 0.24, 0.12, '#111');
  R(-0.34, 0.76, 0.68, 0.62, navy); R(-0.34, 0.76, 0.68, 0.08, '#111'); R(-0.06, 0.76, 0.12, 0.08, '#ffd23f');
  R(-0.34, 1.3, 0.68, 0.06, navy2);
  const armL = caught ? 0.55 : -sw * 0.2, armR = caught ? 0.55 : (c.talk > 0 ? 0.7 : sw * 0.2);   // waves a fist when he shouts
  R(-0.46, 0.86 + armL, 0.12, 0.44, navy); R(0.34, 0.86 + armR, 0.12, 0.44, navy);
  R(-0.46, 0.8 + armL, 0.12, 0.08, skin); R(0.34, 0.8 + armR, 0.12, 0.08, skin);
  R(-0.2, 1.36, 0.4, 0.3, skin); R(-0.2, 1.48, 0.4, 0.14, '#3a2a1a');
  R(-0.26, 1.62, 0.52, 0.16, navy2); R(-0.3, 1.6, 0.6, 0.05, '#111'); R(-0.05, 1.66, 0.1, 0.08, '#ffd23f');
  if (c.talk > 0 && c.say) {                                        // what he shouts
    const tx = Math.round(a.x), ty = Math.round(a.y - 2.1 * k) - 14, w = PX.textWidth(c.say, 1) + 8;
    ctx.fillStyle = '#111'; ctx.fillRect(tx - w / 2 - 1, ty - 1, w + 2, 13);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(tx - w / 2, ty, w, 11); ctx.fillRect(tx - 2, ty + 11, 4, 3);
    T(c.say, tx, ty + 3, '#e01e1e', 1, 'center');
  }
}

/* --- 6. SCREENS ---------------------------------------------------------------- */
function updateCam(dt, t) {
  const b = G || demoBoy; if (!b) return;
  const tgtY = G && G.jet > 0 ? b.y + 2.6 : 3.2 + Math.max(0, b.y) * 0.45;
  cam.x += (b.x * 0.75 - cam.x) * Math.min(1, dt * 7);
  cam.y += (tgtY - cam.y) * Math.min(1, dt * 5);
  cam.z = G && G.falling ? G.camZ : b.z - 6.2;
  cam.hor = 92;
  if (G && G.shake > 0) { cam.x += rnd(-0.08, 0.08); cam.hor += rnd(-2, 2); }
}
function speedLines(t) {
  if (!G || G.end) return;
  const k = (G.speed - SPEED0) / (SPEED_MAX - SPEED0) + (G.jet > 0 ? 0.8 : 0);
  if (k < 0.25) return;
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  for (let i = 0; i < Math.floor(k * 10); i++) {
    const a = Math.random() * Math.PI * 2, r0 = rnd(110, 200), len = rnd(10, 30);
    const cx = S.W / 2, cy = cam.hor + 20;
    const x0 = cx + Math.cos(a) * r0, y0 = cy + Math.sin(a) * r0 * 0.6;
    ctx.fillRect(Math.round(x0), Math.round(y0), Math.max(1, Math.round(Math.cos(a) * len * 0.3)), 1);
  }
}
function hud(t) {
  const Wd = S.W;
  // score and coins
  ctx.fillStyle = 'rgba(13,11,19,0.6)'; ctx.fillRect(Wd - 110, 4, 106, 34);
  T(String(Math.floor(G.meters)).padStart(6, '0'), Wd - 8, 8, '#ffffff', 2, 'right', '#000');
  ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(Wd - 101, 30, 4, 0, Math.PI * 2); ctx.fill();
  T('' + G.coins, Wd - 92, 27, '#ffd23f', 1, 'left', '#000');
  T('BEST ' + save.best, Wd - 8, 27, '#9a92b8', 1, 'right');
  // power-ups running out
  let py = 32;
  for (const kind of ['jet', 'mag', 'x2']) {
    if (G[kind] <= 0) continue;
    const full = POWER[kind].time(save.up[kind] | 0), f = clamp(G[kind] / full, 0, 1);
    ctx.fillStyle = 'rgba(13,11,19,0.6)'; ctx.fillRect(6, py, 72, 14);
    drawPowerIcon(kind, 14, py + 7, 1);
    ctx.fillStyle = '#111'; ctx.fillRect(24, py + 4, 50, 6);
    ctx.fillStyle = POWER[kind].color; ctx.fillRect(25, py + 5, Math.round(48 * f), 4);
    py += 16;
  }
  if (G.cop.near > 0 && !G.end) {                                  // careful: one more stumble and he's got you
    const blink = Math.floor(t * 4) % 2;
    T('CAREFUL!', Wd / 2, 8, blink ? '#ff4040' : '#ffd23f', 2, 'center', '#000');
  }
  for (const p of G.pops) {
    const k = p.t / 1.3;
    if (k < 0.8 || Math.floor(p.t * 20) % 2) T(p.text, Wd / 2, (G.help > 0 ? 96 : 52) - k * 14, p.color, p.big ? 3 : 2, 'center', '#000');
  }
  if (G.help > 0) {
    const a = Math.min(1, G.help);
    ctx.fillStyle = 'rgba(13,11,19,' + (0.65 * a) + ')'; ctx.fillRect(Wd / 2 - 120, 44, 240, 40);
    if (a > 0.5) {
      T('SWIPE LEFT / RIGHT: CHANGE PLANE', Wd / 2, 50, '#ffffff', 1, 'center');
      T('SWIPE UP: JUMP    SWIPE DOWN: SLIDE', Wd / 2, 60, '#ffffff', 1, 'center');
      T('(OR THE ARROW KEYS)', Wd / 2, 71, '#9a92b8', 1, 'center');
    }
  }
  if (G.flash > 0) { ctx.fillStyle = 'rgba(255,60,60,' + G.flash * 0.5 + ')'; ctx.fillRect(0, 0, Wd, H); }
  if (state === 'play' && !G.end && UI.button('pause', 6, 6, 24, 20, 'II', { size: 1 })) setPause(true);
  if (G.end && G.endT > 0.3) {
    const msg = G.end === 'caught' ? 'CAUGHT!' : 'YOU FELL!';
    T(msg, Wd / 2, 70, G.end === 'caught' ? '#ff4040' : '#7af0ff', 4, 'center', '#000');
  }
}
function panel(w, h, y) {
  const Wd = S.W, x = Math.round(Wd / 2 - w / 2); y = y === undefined ? Math.round(H / 2 - h / 2) : y;
  ctx.fillStyle = 'rgba(13,11,19,0.55)'; ctx.fillRect(0, 0, Wd, H);
  ctx.fillStyle = '#111'; ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
  ctx.fillStyle = '#1d1830'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#ff6bd0'; ctx.fillRect(x, y, w, 2);
  return { x, y };
}
function titleScene(dt, t) {          // the boy runs along by himself behind the menu
  if (!W || !W.demo) { newWorld(true); demoBoy = { x: 0, y: 0, z: 0, lane: 1 }; }
  demoBoy.z += 13 * dt;
  generate(demoBoy.z + 160); cleanup(demoBoy.z);
  // hop the gaps, change lanes now and then
  const l = laneOfX(demoBoy.x), ahead = l >= 0 ? planeAt(l, demoBoy.z + 4) : null;
  demoBoy.vy = (demoBoy.vy || 0) - GRAV * dt; demoBoy.y += demoBoy.vy * dt;
  if (demoBoy.y <= 0) { demoBoy.y = 0; demoBoy.vy = 0; if (!ahead) demoBoy.vy = JUMP_V; }
  if (Math.random() < dt * 0.3) demoBoy.lane = clamp(demoBoy.lane + pick([-1, 1]), 0, 2);
  demoBoy.x += clamp(laneX(demoBoy.lane) - demoBoy.x, -8 * dt, 8 * dt);
  updateCam(dt, t);
}
function drawTitle(t) {
  const Wd = S.W;
  ctx.fillStyle = 'rgba(13,11,19,0.35)'; ctx.fillRect(0, 0, Wd, H);
  PX.drawAvatar(ctx, profile.avatar, 8, 8, 2); T(profile.name, 40, 16, '#fff', 2, 'left', '#000');
  T('★ ' + PX.Wallet.get(), Wd - 36, 12, '#ffd23f', 2, 'right', '#000');
  if (UI.button('sfx', Wd - 30, 6, 24, 20, save.sfx ? 'SND' : 'OFF', { size: 1, on: save.sfx })) { save.sfx = !save.sfx; store(); }
  T('PIXEL', Wd / 2, 36, '#ffd23f', 3, 'center', '#000');
  T('SKY RUN', Wd / 2, 54, '#fff', 5, 'center', '#ff6bd0');
  T('PARKOUR ON PLANES. RUN FROM THE OFFICER!', Wd / 2, 86, '#ffffff', 1, 'center', '#000');
  const bw = 200, bx = Math.round(Wd / 2 - bw / 2);
  if (UI.button('play', bx, 104, bw, 28, 'RUN!', { accent: '#5ad43f', size: 3 })) { sfx('click', true); newGame(); }
  if (UI.button('shop', bx, 140, bw, 22, 'UPGRADES', { accent: '#ffd23f' })) { sfx('click', true); state = 'shop'; }
  T('BEST ' + save.best + 'M     COINS ' + save.coins, Wd / 2, 172, '#fff', 1, 'center', '#000');
  T('400M = ★1', Wd / 2, 182, '#ffd23f', 1, 'center', '#000');
  if (UI.button('games', bx, 198, bw, 22, '< ALL GAMES', { size: 1 }) || UI.back) location.href = './';
  T('V' + VERSION, Wd - 4, H - 9, '#ffffff', 1, 'right', '#000');
}
function drawShop(t) {
  const Wd = S.W, { x, y } = panel(300, 200, 20);
  T('UPGRADES', Wd / 2, y + 10, '#ffd23f', 3, 'center', '#000');
  ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(Wd / 2 - 30, y + 37, 4, 0, Math.PI * 2); ctx.fill();
  T(save.coins + ' COINS', Wd / 2 - 22, y + 34, '#ffffff', 1, 'left');
  ['jet', 'mag', 'x2'].forEach((kind, i) => {
    const ry = y + 50 + i * 38, lvl = save.up[kind] | 0, P = POWER[kind];
    ctx.fillStyle = '#262036'; ctx.fillRect(x + 8, ry, 284, 32);
    drawPowerIcon(kind, x + 22, ry + 16, 2);
    T(P.name, x + 38, ry + 5, P.color, 2, 'left', '#000');
    T(Math.round(P.time(lvl)) + ' SECONDS', x + 38, ry + 21, '#9a92b8', 1);
    for (let k = 0; k < UP_MAX; k++) { ctx.fillStyle = k < lvl ? P.color : '#3a2f5c'; ctx.fillRect(x + 120 + k * 9, ry + 21, 7, 5); }
    if (lvl >= UP_MAX) T('MAX', x + 280, ry + 12, '#9be36b', 2, 'right');
    else {
      const cost = upCost(lvl), can = save.coins >= cost;
      if (UI.button('up' + kind, x + 196, ry + 5, 90, 22, cost + ' C', { accent: '#5ad43f', disabled: !can, size: 1 })) {
        save.coins -= cost; save.up[kind] = lvl + 1; store(); sfx('power', true);
      }
    }
  });
  T('POWER-UPS ON THE ROOFS. GRAB THEM!', Wd / 2, y + 166, '#9a92b8', 1, 'center');
  if (UI.button('back', Math.round(Wd / 2 - 60), y + 176, 120, 20, 'BACK', { size: 1 }) || UI.back) state = 'title';
}
function drawPause() {
  const Wd = S.W, { y } = panel(200, 110), bw = 150, bx = Math.round(Wd / 2 - bw / 2);
  T('PAUSED', Wd / 2, y + 12, '#fff', 3, 'center');
  if (UI.button('resume', bx, y + 40, bw, 22, 'RESUME', { accent: '#5ad43f' }) || UI.back) setPause(false);
  if (UI.button('quit', bx, y + 70, bw, 22, 'MENU')) toTitle();
}
function drawOver(t) {
  const Wd = S.W, { y } = panel(250, 170);
  if (G.newBest) for (let i = 0; i < 24; i++) { const k = t + i; ctx.fillStyle = ['#ffd23f', '#ff6bd0', '#7af0ff', '#9be36b'][i % 4]; ctx.fillRect(Math.round((i * 47 + k * 30) % Wd), Math.round((k * (40 + i * 3)) % H), 3, 3); }
  T(G.end === 'caught' ? 'CAUGHT!' : 'YOU FELL!', Wd / 2, y + 10, G.end === 'caught' ? '#ff4040' : '#7af0ff', 3, 'center', '#000');
  T(G.end === 'caught' ? 'THE OFFICER GOT YOU.' : 'GOOD THING YOU HAD A PARACHUTE.', Wd / 2, y + 34, '#9a92b8', 1, 'center');
  T(Math.floor(G.meters) + ' M', Wd / 2, y + 50, '#ffffff', 3, 'center');
  ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(Wd / 2 - 34, y + 83, 4, 0, Math.PI * 2); ctx.fill();
  T('+' + G.coins + ' COINS', Wd / 2 - 26, y + 80, '#ffd23f', 1, 'left');
  if (G.newBest) T('NEW BEST!', Wd / 2, y + 96, '#9be36b', 2, 'center', '#000');
  else T('BEST: ' + save.best + ' M', Wd / 2, y + 98, '#9a92b8', 1, 'center');
  if (G.stars) T('★ +' + G.stars, Wd / 2, y + 114, '#ffd23f', 2, 'center', '#000');
  if (UI.button('menu', Math.round(Wd / 2 - 116), y + 138, 112, 24, 'MENU') || UI.back) toTitle();
  if (UI.button('again', Math.round(Wd / 2 + 4), y + 138, 112, 24, 'RUN AGAIN', { accent: '#5ad43f' })) newGame();
}
function setPause(v) { if (state !== 'play' || (G && G.end)) return; paused = v; }
function toTitle() { G = null; W = null; state = 'title'; paused = false; }

/* --- sound --- */
function sfx(k, always) {
  if (!save.sfx || (state === 'title' && !always)) return;
  const s = PX.Sound;
  if (k === 'click') s.tone([523, 784], 0.12, { vol: 0.1 });
  else if (k === 'jump') s.tone([300, 620], 0.14, { vol: 0.08 });
  else if (k === 'land') s.noise(0.06, { freq: 600, vol: 0.12 });
  else if (k === 'slide') s.noise(0.25, { freq: 1500, vol: 0.08, filter: 'bandpass' });
  else if (k === 'swoosh') s.noise(0.12, { freq: 2400, vol: 0.06, filter: 'bandpass' });
  else if (k === 'coin') s.tone([988, 1319], 0.08, { vol: 0.05 });
  else if (k === 'power') { s.tone([523, 659, 784, 1047], 0.35, { vol: 0.1 }); }
  else if (k === 'stumble') { s.noise(0.15, { freq: 400, vol: 0.25 }); s.tone([200, 120], 0.2, { vol: 0.1, type: 'triangle' }); }
  else if (k === 'whistle') { s.tone([2100, 2300, 2100, 2300, 2100], 0.45, { vol: 0.05, type: 'sine' }); }
  else if (k === 'crash') { s.noise(0.4, { freq: 300, vol: 0.35 }); }
  else if (k === 'caught') { s.tone([392, 330, 262, 196], 0.7, { vol: 0.12, type: 'triangle', delay: 0.1 }); }
  else if (k === 'fall') { s.tone([700, 120], 0.9, { vol: 0.1, type: 'triangle' }); s.noise(0.8, { freq: 1000, vol: 0.06, filter: 'bandpass' }); }
  else if (k === 'milestone') s.tone([659, 988], 0.2, { vol: 0.08 });
}

/* --- 7. INPUT: swipes, arrow keys, a game controller ----------------------------------- */
let swipe = null;
UI.onDown = (e, x, y) => {
  PX.Sound.unlock();
  if (state !== 'play' || paused || UI.downId !== null) return;
  swipe = { id: e.pointerId, x0: x, y0: y, done: false, t: performance.now() };
};
UI.onMove = (e, x, y) => {
  if (!swipe || swipe.id !== e.pointerId || swipe.done) return;
  const dx = x - swipe.x0, dy = y - swipe.y0;
  if (Math.hypot(dx, dy) < 14) return;
  swipe.done = true;
  if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : -1); else if (dy < 0) jump(); else slide();
};
UI.onUp = e => { if (swipe && swipe.id === e.pointerId) swipe = null; };
window.addEventListener('keydown', e => {
  PX.Sound.unlock();
  if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'play' && !(G && G.end)) { setPause(!paused); return; }
  if (e.code === 'Escape') { UI.back = true; return; }
  if (state !== 'play' || paused || e.repeat) return;
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') move(-1);
  else if (e.code === 'ArrowRight' || e.code === 'KeyD') move(1);
  else if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') { jump(); e.preventDefault(); }
  else if (e.code === 'ArrowDown' || e.code === 'KeyS') slide();
});
window.addEventListener('blur', () => setPause(true));
document.addEventListener('visibilitychange', () => { if (document.hidden) setPause(true); });

/* --- 8. MAIN LOOP ----------------------------------------------------------------- */
const STEP = 1 / 120;
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000), t = now / 1000; last = now;
  UI.begin();
  if (state === 'title' || state === 'shop') {
    titleScene(dt, t);
    drawWorld(t);
    if (state === 'title') drawTitle(t); else drawShop(t);
  } else {
    if (!paused && state === 'play') { acc += dt; while (acc >= STEP) { step(STEP); acc -= STEP; } } else acc = 0;
    updateCam(paused || state === 'over' ? 0 : dt, t);
    drawWorld(t);
    speedLines(t);
    hud(t);
    if (paused) drawPause(); else if (state === 'over') drawOver(t);
  }
  UI.end();
  S.blit('#0d0b13');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => { /* offline mode unavailable */ }));
}
PX.Pad.setup({
  title: 'Pixel Sky Run: controller', ui: UI, menu: () => state !== 'play' || paused || (G && G.end),
  keys: () => ({ left: 'ArrowLeft', right: 'ArrowRight', up: 'ArrowUp', A: 'ArrowUp', down: 'ArrowDown', B: 'ArrowDown', START: 'KeyP' }),
  help: [['STICK|D-PAD', 'LEFT / RIGHT: CHANGE PLANE'], ['A|UP', 'JUMP'], ['B|DOWN', 'SLIDE'], ['START', 'PAUSE'], ['A', 'MENUS: OK'], ['B', 'MENUS: BACK']],
});
</script>
