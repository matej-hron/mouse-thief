/* ==========================================================================
   DEEP CATCH: a fishing game (part of the PIXEL ARCADE).
   Seen from the side: your boat on the sea, the hook sinking into the deep.
   CAST, then steer the hook left and right (drag, arrows, stick). Touch a fish
   and it bites; reel it up to the boat and it is sold. Jellyfish, sharks, boots,
   sea urchins and mines hurt your line: too many hits and it snaps.
   The rod decides which fish swim around (each rarity's chance, from the rarest
   down). Caught fish go into your cooler; sell them at the FISH MARKET, where
   every fish's price changes every hour (like stocks). The money buys better
   rods, reels, lines, coolers and deeper worlds.
     1. Setup   2. Fish and gear   3. The sea   4. The game   5. Drawing
     6. Screens   7. Input   8. Main loop
   ========================================================================== */

const reel = () => REELS[save.reel], line = () => LINES[save.line];
// --- the FISH MARKET: every fish's price goes up and down every hour, like a stock ---
// (worked out from the clock, so it's the same price for everyone and you can look back 24 hours)
const MARKET_HOUR = 3600 * 1000;
const hourNow = () => Math.floor(Date.now() / MARKET_HOUR);
function hash(n) { n = Math.imul(n ^ (n >>> 16), 0x45d9f3b); n = Math.imul(n ^ (n >>> 16), 0x45d9f3b); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; }
const seedOf = id => [...id].reduce((a, c) => (Math.imul(a, 31) + c.charCodeAt(0)) | 0, 7);
function market(spId, h = hourNow()) {          // the price multiplier of this fish in hour h (about x0.3 to x3)
  const s = seedOf(spId), a = 0.18 + hash(s) * 0.3, b = 0.7 + hash(s + 1) * 0.9, p = hash(s + 2) * 6.28, q = hash(s + 3) * 6.28;
  const v = 0.6 * Math.sin(h * a + p) + 0.28 * Math.sin(h * b + q) + 0.45 * (hash(s ^ Math.imul(h, 2654435761)) - 0.5);
  return clamp(Math.round(Math.exp(v) * 100) / 100, 0.3, 3);
}
const priceOf = it => Math.max(1, Math.round(it.base * market(it.s)));
function rollRarity() {
  const ch = rod().ch;
  for (const r of ['legend', 'mythic', 'epic', 'super', 'rare']) if (Math.random() * 100 < ch[r]) return r;
  return 'bad';
}

// sprites are drawn once into little canvases (with a dark outline), flipped ones too
const spriteCache = {};
function makeSprite(key, rows, pal, flip, silhouette) {
  const ck = key + (flip ? '>' : '<') + (silhouette ? 's' : '');
  if (spriteCache[ck]) return spriteCache[ck];
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  const c = document.createElement('canvas'); c.width = w + 2; c.height = h + 2;
  const g = c.getContext('2d');
  const put = (x, y, col) => { g.fillStyle = col; g.fillRect(flip ? w - x : x + 1, y + 1, 1, 1); };
  const P = Object.assign({ e: '#111111', s: pal.d, w: '#ffffff' }, pal);
  rows.forEach((row, y) => [...row].forEach((ch, x) => { if (ch !== '.') for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) put(x + dx, y + dy, silhouette ? '#0a0818' : '#111111'); }));
  rows.forEach((row, y) => [...row].forEach((ch, x) => { if (ch !== '.') put(x, y, silhouette ? '#2a2440' : P[ch]); }));
  return (spriteCache[ck] = c);
}
const fishSprite = (sp, flip, sil) => makeSprite(sp.id, SHAPES[sp.shape], sp.pal, flip, sil);
function drawSprite(c, cx, cy, s = SCALE) { ctx.drawImage(c, Math.round(cx - c.width * s / 2), Math.round(cy - c.height * s / 2), c.width * s, c.height * s); }
const SHARK = ['...........d........', '..........dd........', '...dddddddbbddd...dd', '.dbbbbbbbbbbbbbbddbd',
               'debbbbbbbbbbbbbbbbbd', 'wwllllllllllbbbbbd.d', '..lllllldd..ddd...dd'];
const BOOT = ['.ddd....', '.bbb....', '.bbb....', '.bbbbbb.', 'llllllll'];

/* --- 3. THE SEA: fish swimming across, and things to stay away from ----------- */
const world = { fish: [], obs: [], weed: [], rocks: [], bubbles: [] };
function newFish(onScreen) {
  const r = rollRarity(), R = RAR[r], list = SPECIES.filter(s => s.r === r), sp = pick(list);
  const z = rollSize(), sc = z.s, dir = Math.random() < 0.5 ? -1 : 1, c = fishSprite(sp, false), hw = c.width * sc / 2;
  const y = rnd(R.depth[0], R.depth[1]) * MAX_DEPTH;
  return { sp, r, z, sc, dir, x: onScreen ? rnd(20, S.W - 20) : dir > 0 ? -hw - rnd(0, 80) : S.W + hw + rnd(0, 80), y, y0: y,
           hw: Math.max(4, hw - 3), hh: Math.max(3, c.height * sc / 2 - 2), speed: rnd(R.speed[0], R.speed[1]) / Math.sqrt(z.k), ph: rnd(0, 6),
           kg: Math.round(R.kg * z.k * z.k * rnd(0.85, 1.15) * 10) / 10,
           base: Math.max(1, Math.round(rnd(R.price[0], R.price[1]) * z.k * wld().money)) };   // x the market price when you sell it
}
function fillSea() { world.fish = []; for (let i = 0; i < 16; i++) world.fish.push(newFish(true)); }
function makeObstacles() {
  world.obs = [];
  const w = wld(), N = Math.round(MAX_DEPTH / 50 * w.obsK);    // deeper worlds: more things in the way, and sharks higher up
  for (let i = 0; i < N; i++) {
    const y = 100 + (i + Math.random() * 0.8) * (MAX_DEPTH - 120) / N, k = y / MAX_DEPTH + wldIndex() * 0.08;
    const type = k < 0.29 ? pick(['jelly', 'jelly', 'boot']) : k < 0.58 ? pick(['jelly', 'urchin', 'boot', 'shark']) : pick(['mine', 'urchin', 'shark', 'jelly']);
    const speed = type === 'shark' ? rnd(55, 80) * w.shark : type === 'boot' ? rnd(6, 14) : type === 'jelly' ? rnd(4, 10) : 0;

function setWorld(id) {

const splashes = [];

/* --- 4. THE GAME ---------------------------------------------------------------- */
let state = 'title';          // title | fish | shop | book | worlds | market

let camY = 0;

const boatX = () => Math.round(S.W * 0.42) - 26;   // the boat's left end
const tipX = () => boatX() + 66;                    // the rod tip, where the line hangs from
function startFishing() { state = 'fish'; paused = false; G.phase = 'ready'; G.hooked = null; G.hook.x = tipX(); G.hook.y = -8; camY = 0; }
function cast() {
  if (G.phase !== 'ready') return;

  G.hook.x = tipX(); G.hook.y = 0; G.msg = null;

}
function reelUp() { if (G.phase === 'down') { G.phase = 'up'; sfx('reel'); } }
function say(text, color = '#fff', dur = 1.4) { G.msg = { text, color, t: dur }; }

  world.fish.splice(world.fish.indexOf(f), 1); world.fish.push(newFish(false));
  G.hooked = f; G.phase = 'up';
  const R = RAR[f.r];
  const big = f.z.k >= 1.5 ? f.z.name + ' ' : '';
  say(f.r === 'bad' ? (big ? big + 'BAD FISH...' : 'A BITE... MEH') : big + R.name + '!', R.color);
  sfx('bite'); bubble(G.hook.x, G.hook.y, 5); G.bang = 0.8;
}
function hit(o) {
  G.hp--; G.inv = 1.2; G.shake = 0.3;

  say(o.type === 'shark' ? 'SHARK! LINE HURT' : o.type === 'jelly' ? 'JELLYFISH! LINE HURT' : o.type === 'mine' ? 'BOOM! LINE HURT' : 'OUCH! LINE HURT', '#ff6a6a');
}
function snap(o) {
  if (G.hooked) {                                   // the fish gets away
    const f = G.hooked; f.x = G.hook.x; f.y0 = G.hook.y; f.speed *= 2.5; world.fish.push(f); G.hooked = null;

}
function land() {                                   // the hook is back at the boat
  const f = G.hooked; G.hooked = null;
  if (!f) { G.phase = 'ready'; G.hook.y = -8; return; }
  const R = RAR[f.r], isNew = !save.book[f.sp.id];
  save.book[f.sp.id] = (save.book[f.sp.id] | 0) + 1;
  const record = f.kg > (save.big[f.sp.id] || 0) && !isNew;
  save.big[f.sp.id] = Math.max(save.big[f.sp.id] || 0, f.kg);
  save.caught = (save.caught | 0) + 1;
  const item = { s: f.sp.id, z: SIZES.indexOf(f.z), kg: f.kg, base: f.base }, full = save.inv.length >= cooler().cap;
  if (!full) save.inv.push(item);
  store();
  if (R.stars) PX.Wallet.add(R.stars);
  G.card = { f, item, full, isNew, record, stars: R.stars, t0: performance.now() };
  G.phase = 'catch'; G.hook.y = -8;
  bubble(G.hook.x, 2, 8); splash(G.hook.x, 14);

}
const hookDrop = f => Math.round(f.hh * 0.7) + 2;   // a hooked fish hangs this far under the hook
function step(dt, t) {
  G.t += dt;

  if (G.phase === 'ready' || G.phase === 'catch') { h.x += (tipX() - h.x) * Math.min(1, dt * 6); h.y = -8; }
  if (G.phase === 'snap' && (G.snapT -= dt) <= 0) { G.phase = 'ready'; h.x = tipX(); h.y = -8; }
  if (G.phase === 'down' || G.phase === 'up') {
    let vx = ((keys.right ? 1 : 0) - (keys.left ? 1 : 0)) * STEER;
    if (steer) vx = clamp((steer.x - h.x) * 8, -STEER, STEER);
    if (G.hooked) { const p = RAR[G.hooked.r].pull * Math.sqrt(G.hooked.z.k); vx += Math.sin(G.t * 2.7 + G.hooked.ph) * p * 1.6 + Math.sin(G.t * 7.3 + G.hooked.ph) * p * 0.5; }
    h.x = clamp(h.x + vx * dt, 8, W - 8);

    else { h.y -= reel().speed * wld().reelK * dt; if (h.y <= 0) { h.y = 0; land(); return; } }

    if (Math.random() < dt * 6) bubble(h.x, h.y);
    if (G.inv > 0) G.inv -= dt;

/* --- 5. DRAWING ----------------------------------------------------------------- */
const WATER = [];   // the water's colors from the surface down (set by setWorld)
const sy = d => SURF + d - camY;                   // depth -> screen y
function drawSea(t, withBoat) {
  const W = S.W, surf = sy(0);
  // the sky
  if (surf > 0) {
    const w = wld();
    ctx.fillStyle = w.sky; ctx.fillRect(0, 0, W, surf);
    ctx.fillStyle = w.haze; ctx.fillRect(0, surf - 18, W, 18);
    ctx.fillStyle = w.sun; ctx.fillRect(W - 60, surf - 58, 16, 16); ctx.fillRect(W - 62, surf - 56, 20, 12);
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 4; i++) { const cx = ((i * 140 + t * 6) % (W + 60)) - 30, cy = surf - 50 + (i % 2) * 14; ctx.fillRect(Math.round(cx), Math.round(cy), 24, 4); ctx.fillRect(Math.round(cx + 5), Math.round(cy - 3), 12, 3); }
  }

    const d = y - surf;

  }

    }

  }
  if (surf > -4 && surf < H) {                     // little waves
    ctx.fillStyle = '#c8fbff';
    for (let x = 0; x < W; x += 12) ctx.fillRect(x + Math.round(Math.sin(t * 2 + x * 0.1) * 2), Math.round(surf), 6, 1);
  }
  // the sea bed

  if (bed < H) {
    for (const w of world.weed) {
      const x = w.x % (W + 20) - 10;
      for (let k = 0; k < w.h; k += 2) { ctx.fillStyle = w.c; ctx.fillRect(Math.round(x + Math.sin(t * 1.5 + w.ph + k * 0.15) * k * 0.15), Math.round(bed - k), 2, 2); }
    }

  const R = RAR[f.r];

    ctx.fillStyle = w.sky; ctx.fillRect(px, py, pw, 10);
    for (let k = 0; k < 15; k++) {
      const m = k / 14, [a, mm, b] = w.water, c = m < 0.35 ? a.map((v, j) => v + (mm[j] - v) * m / 0.35) : mm.map((v, j) => v + (b[j] - v) * (m - 0.35) / 0.65);
      ctx.fillStyle = 'rgb(' + c.map(Math.round).join(',') + ')'; ctx.fillRect(px, py + 10 + k * 4, pw, 4);
    }
    ctx.fillStyle = w.sand; ctx.fillRect(px, py + ph - 4, pw, 4); ctx.fillStyle = w.sandTop; ctx.fillRect(px, py + ph - 4, pw, 1);
    ctx.fillStyle = '#ffd23f'; const fx = px + pw / 2 + Math.sin(t + i) * (pw / 2 - 8);
    ctx.fillRect(Math.round(fx) - 3, py + 40 + i * 4, 6, 3); ctx.fillRect(Math.round(fx) + 3, py + 39 + i * 4, 2, 5);
    if (!owned) { ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(px, py, pw, ph); }
    const words = w.name.split(' ');
    T(words[0], x + cw / 2, top + 4, owned ? '#fff' : '#9ac8e0', 1, 'center');
    if (words[1]) T(words[1], x + cw / 2, top + 11, owned ? '#fff' : '#9ac8e0', 1, 'center');
    T(Math.round(w.depth / 10) + ' M DEEP', x + cw / 2, top + 94, '#fff', 1, 'center');
    T('MONEY X' + w.money, x + cw / 2, top + 106, '#ffd23f', 1, 'center');
    T(i === 0 ? 'EASY' : ['', 'MORE DANGER', 'LOTS OF DANGER', 'VERY DANGEROUS', 'DEADLY'][i], x + cw / 2, top + 118, ['#5ad43f', '#e0d040', '#ff8a2a', '#ff4a5a', '#c070ff'][i], 1, 'center');
    const by = top + ch - 24;
    if (on) T('FISHING HERE', x + cw / 2, by + 7, '#ffd23f', 1, 'center');
    else if (owned) { if (UI.button('w_' + w.id, x + 3, by, cw - 6, 20, 'GO', { size: 1, accent: '#5ad43f' })) { setWorld(w.id); sfx('click'); } }
    else {
      T(w.price + ' COINS', x + cw / 2, by - 12, save.coins >= w.price ? '#ffd23f' : '#6a7a8a', 1, 'center');
      if (UI.button('w_' + w.id, x + 3, by, cw - 6, 20, 'UNLOCK', { size: 1, accent: '#ffd23f', disabled: save.coins < w.price })) {
        save.coins -= w.price; save.worlds.push(w.id); setWorld(w.id); sfx('buy');
      }
    }
  });
  if (UI.button('back', Math.round(W / 2 - 60), H - 24, 120, 20, '< BACK', { size: 1 }) || UI.back) { state = shopBack; if (state === 'fish') startFishing(); }
}
function setPause(v) { if (state !== 'fish' || (G.phase !== 'down' && G.phase !== 'up')) { paused = false; return; } paused = v; steer = null; }

/* --- sound --- */
function sfx(k) {
  if (!save.sfx) return;
  const s = PX.Sound;
  if (k === 'click') s.tone([523, 784], 0.12, { vol: 0.1 });
  else if (k === 'cast') { s.noise(0.25, { freq: 1200, vol: 0.12 }); s.tone([900, 300], 0.2, { vol: 0.06, type: 'triangle' }); }
  else if (k === 'reel') s.tone([300, 600], 0.2, { vol: 0.06 });
  else if (k === 'bite') { s.tone([400, 800], 0.08, { vol: 0.12 }); s.tone([500, 1000], 0.08, { vol: 0.12, delay: 0.1 }); }
  else if (k === 'hit') s.noise(0.2, { freq: 400, vol: 0.3 });
  else if (k === 'snap') { s.tone([800, 120], 0.35, { vol: 0.12, type: 'sawtooth' }); s.noise(0.2, { freq: 2500, vol: 0.1, filter: 'highpass' }); }
  else if (k === 'meh') s.tone([300, 200], 0.25, { vol: 0.1, type: 'triangle' });
  else if (k === 'coin') { s.tone(988, 0.08, { vol: 0.1 }); s.tone(1319, 0.15, { vol: 0.1, delay: 0.08 }); }
  else if (k === 'great') [523, 659, 784, 1047].forEach((f, i) => s.tone(f, 0.12, { vol: 0.1, delay: i * 0.08 }));
  else if (k === 'fanfare') [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => s.tone(f, 0.16, { vol: 0.11, delay: i * 0.1 }));
  else if (k === 'cash') { s.tone(1319, 0.06, { vol: 0.1 }); s.tone(1760, 0.06, { vol: 0.1, delay: 0.06 }); s.tone(2093, 0.14, { vol: 0.1, delay: 0.12 }); }
  else if (k === 'splash') s.noise(0.3, { freq: 1500, vol: 0.12 });
  else if (k === 'buy') { s.tone([660, 1320], 0.2, { vol: 0.1 }); s.tone(1760, 0.15, { vol: 0.08, delay: 0.15 }); }
}

/* --- 7. INPUT: drag to steer the hook (it follows your finger) ---------------------- */
let steer = null;
const keys = { left: false, right: false };
UI.onDown = (e, x) => {
  PX.Sound.unlock();
  if (state !== 'fish' || paused || UI.downId !== null) return;
  if (G.phase === 'down' || G.phase === 'up') steer = { id: e.pointerId, x };
};
UI.onMove = (e, x) => { if (steer && steer.id === e.pointerId) steer.x = x; };
UI.onUp = e => { if (steer && steer.id === e.pointerId) steer = null; };
window.addEventListener('keydown', e => {
  PX.Sound.unlock();
  const k = e.code;
  if (k === 'ArrowLeft' || k === 'KeyA') keys.left = true;
  if (k === 'ArrowRight' || k === 'KeyD') keys.right = true;
  if (state === 'fish' && !paused) {
    if ((k === 'Space' || k === 'ArrowUp' || k === 'KeyW') && !e.repeat) { if (G.phase === 'ready') cast(); else if (G.phase === 'down') reelUp(); }
  }
  if ((k === 'KeyP' || k === 'Escape') && state === 'fish' && (G.phase === 'down' || G.phase === 'up')) setPause(!paused);
  else if (k === 'Escape') UI.back = true;
});
window.addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
});
window.addEventListener('blur', () => { keys.left = keys.right = false; setPause(true); });
document.addEventListener('visibilitychange', () => { if (document.hidden) setPause(true); });

/* --- 8. MAIN LOOP ----------------------------------------------------------------- */
setWorld(save.world);
G.hook.x = tipX();
let last = performance.now(), lastState = state, fade = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000), t = now / 1000; last = now;
  UI.begin();
  if (state === 'title') drawTitle(t);
  else if (state === 'shop') drawShop(t);
  else if (state === 'book') drawBook(t);
  else if (state === 'worlds') drawWorlds(t);
  else if (state === 'market') drawMarket(t);
  else {
    if (!paused) step(dt, t);
    drawGame(t);
    if (paused) drawPause();
  }
  for (const f of floats) { f.t -= dt; T(f.text, f.x, Math.round(f.y - (1.2 - f.t) * 30), '#ffd23f', 2, 'center', '#000'); }
  for (let i = floats.length - 1; i >= 0; i--) if (floats[i].t <= 0) floats.splice(i, 1);
  if (state !== lastState) { lastState = state; fade = 1; floats.length = 0; }        // a quick fade between screens
  if (fade > 0) { ctx.fillStyle = 'rgba(4,14,28,' + (fade * 0.8).toFixed(2) + ')'; ctx.fillRect(0, 0, S.W, H); fade -= dt * 6; }
  UI.end();
  S.blit('#062038');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => { /* offline mode unavailable */ }));
}
PX.Pad.setup({
  title: 'Deep Catch: controller', ui: UI,
  menu: () => state !== 'fish' || paused || (G.phase !== 'down' && G.phase !== 'up'),
  phone: { stick: 'STEER', buttons: [['A', 'REEL UP']] },
  keys: () => ({ left: 'ArrowLeft', right: 'ArrowRight', A: 'Space', START: 'KeyP' }),
  help: [['STICK|D-PAD', 'STEER THE HOOK'], ['A', 'REEL UP'], ['START', 'PAUSE'], ['STICK|D-PAD', 'MENUS: PICK A BUTTON'], ['A', 'MENUS: OK'], ['B', 'MENUS: BACK']],
});
</script>
