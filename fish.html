<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Deep Catch: catch rare fish, avoid obstacles and upgrade your fishing equipment.">
<meta name="theme-color" content="#0d0b13">
<meta name="mobile-web-app-capable" content="yes">

<title>Deep Catch</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #062038; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #screen { position: fixed; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<script src="common.js"></script>
<script>
'use strict';
/* ==========================================================================
   DEEP CATCH: a fishing game (part of the PIXEL ARCADE).
   Seen from the side: your boat on the sea, the hook sinking into the deep.
   CAST, then steer the hook left and right (drag, arrows, stick). Touch a fish
   and it bites; reel it up to the boat and it is sold. Jellyfish, sharks, boots,
   sea urchins and mines hurt your line: too many hits and it snaps.
   The rod decides which fish swim around (each rarity's chance, from the rarest
   down); the money buys better rods, reels and lines.
     1. Setup   2. Fish and gear   3. The sea   4. The game   5. Drawing
     6. Screens   7. Input   8. Main loop
   ========================================================================== */

/* --- 1. SETUP --------------------------------------------------------------- */
const VERSION = '1.0.0';
const SAVE_KEY = 'deepCatch.save';
const save = { coins: 0, rods: ['wood'], rod: 'wood', reel: 0, line: 0, book: {}, caught: 0, best: 0, sfx: true };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY)) || {}); } catch (e) { /* new player */ }
const store = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* private mode */ } };
const profile = PX.Profile.get();

const canvas = document.getElementById('screen');
const S = PX.makeScreen(canvas, { H: 240, minW: 400, maxW: 560 });
const ctx = S.ctx, H = S.H;
const UI = PX.makeUI(S, canvas);
const T = (str, x, y, color = '#fff', size = 1, align = 'left', shadow = null) => PX.drawText(ctx, str, x, y, color, size, align, shadow);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];

const SURF = 70;            // the sea's surface on the screen when the camera is at the top
const MAX_DEPTH = 900;      // the deepest the hook goes (10 px = 1 m)
const BED = MAX_DEPTH + 18; // the sea bed
const SINK = 85;            // how fast the hook sinks (px/s)
const STEER = 150;          // how fast you move the hook sideways
const SCALE = 2;            // fish sprites: screen pixels per sprite pixel

/* --- 2. FISH AND GEAR --------------------------------------------------------- */
const RARITIES = [
  { id: 'bad',    name: 'BAD FISH',   color: '#a89a80', price: [1, 5],      speed: [12, 20], depth: [20, 420],  pull: 0,  stars: 0 },
  { id: 'rare',   name: 'RARE',       color: '#4aa8ff', price: [12, 20],    speed: [18, 28], depth: [60, 580],  pull: 10, stars: 0 },
  { id: 'super',  name: 'SUPER RARE', color: '#5ad43f', price: [35, 55],    speed: [24, 36], depth: [160, 720], pull: 16, stars: 0 },
  { id: 'epic',   name: 'EPIC',       color: '#c070ff', price: [90, 140],   speed: [30, 44], depth: [260, 820], pull: 24, stars: 1 },
  { id: 'mythic', name: 'MYTHIC',     color: '#ff4a5a', price: [260, 360],  speed: [38, 54], depth: [400, 880], pull: 32, stars: 2 },
  { id: 'legend', name: 'LEGENDARY',  color: '#ffd23f', price: [900, 1300], speed: [46, 64], depth: [540, 890], pull: 42, stars: 5 },
];
const RAR = {}; RARITIES.forEach((r, i) => { r.i = i; RAR[r.id] = r; });

// the chance of each rarity, checked from the rarest down (no luck at all: a bad fish)
const RODS = [
  { id: 'wood',  name: 'WOODEN ROD',    price: 0,     color: '#a0662a', tip: '#e0b070', ch: { legend: 0,  mythic: 5,  epic: 10, super: 40, rare: 70 } },
  { id: 'steel', name: 'STEEL ROD',     price: 800,   color: '#9fb4c8', tip: '#eef4fa', ch: { legend: 8,  mythic: 15, epic: 25, super: 30, rare: 40 } },
  { id: 'iron',  name: 'IRON ROD',      price: 4000,  color: '#6a6a78', tip: '#b0b0c0', ch: { legend: 15, mythic: 25, epic: 30, super: 20, rare: 30 } },
  { id: 'lrod',  name: 'LEGENDARY ROD', price: 15000, color: '#ffd23f', tip: '#fff4b0', ch: { legend: 30, mythic: 35, epic: 40, super: 50, rare: 60 } },
];
const REELS = [{ name: 'BASIC REEL', speed: 90, price: 0 }, { name: 'FAST REEL', speed: 135, price: 300 }, { name: 'TURBO REEL', speed: 190, price: 1500 }];
const LINES = [{ name: 'THIN LINE', hp: 2, price: 0 }, { name: 'STRONG LINE', hp: 3, price: 250 }, { name: 'STEEL LINE', hp: 4, price: 1200 }];
if (!RODS.some(r => r.id === save.rod)) save.rod = 'wood';
if (!Array.isArray(save.rods) || !save.rods.includes('wood')) save.rods = ['wood'].concat(Array.isArray(save.rods) ? save.rods : []);
save.reel = clamp(save.reel | 0, 0, REELS.length - 1); save.line = clamp(save.line | 0, 0, LINES.length - 1);
if (!save.book || typeof save.book !== 'object') save.book = {};
const rod = () => RODS.find(r => r.id === save.rod);
const reel = () => REELS[save.reel], line = () => LINES[save.line];
function rollRarity() {
  const ch = rod().ch;
  for (const r of ['legend', 'mythic', 'epic', 'super', 'rare']) if (Math.random() * 100 < ch[r]) return r;
  return 'bad';
}

// fish shapes (facing left; b body, d dark back, l belly, f fins, e eye, s spots)
const SHAPES = {
  small: ['...dd....', '.dbbbd.f.', 'bebbbbbff', '.lllld.f.', '..d......'],
  std: ['.....dd.......', '...ddbbbd...ff', '.dbbbbsbbbd.ff', 'bebbbbbbsbbbff', 'bbllllllbbbd.f', '.dllllllbd..ff', '...dd..dd.....'],
  long: ['....ddddddd.......', '.dbbbsbbbbbsbbbd.f', 'bebbbbbbbbbbbbbbff', '.lllllllllllllld.f', '.....dd..dd.......'],
  round: ['...d.d.d...', '..dbbbbbd..', '.dbbsbbbbdf', 'debbbbbsbbff', 'bbbbbbbbbbf', 'dllllllbbdff', '.dllllllbd.', '..dlllld...', '...d.d.d...'],
  sword: ['.......ddd.......', '.....dbbbbbd...ff', 'llllbebbbsbbbbbff', '.....lllllllbbd.ff', '........d........'],
  big: ['.......dddd.........', '.....ddbbbbbd.......', '...dbbbbsbbbbbd...ff', '..dbbbbbbbbsbbbd.fff', '.dbebbsbbbbbbbbbdfff',
        'dbbbbbbbbbbbbbbbbff.', '.bllllllllllbbbbdfff', '..dlllllllllbbbd.fff', '...ddd..dd..ddd...ff'],
};
const SPECIES = [
  { id: 'carp',    name: 'MUD CARP',       r: 'bad',    shape: 'small', pal: { b: '#7a6a4a', d: '#5a4a30', l: '#a89a78', f: '#6a5a3a' } },
  { id: 'sardine', name: 'SAD SARDINE',    r: 'bad',    shape: 'small', pal: { b: '#8a9098', d: '#5a6068', l: '#c0c4c8', f: '#70767e' } },
  { id: 'goby',    name: 'BONY GOBY',      r: 'bad',    shape: 'small', pal: { b: '#6a7a5a', d: '#4a5a3a', l: '#9aa088', f: '#5a6a4a' } },
  { id: 'perch',   name: 'BLUE PERCH',     r: 'rare',   shape: 'std',   pal: { b: '#3a7ad4', d: '#1f4a8a', l: '#a8d0ff', f: '#2a5aa0', s: '#2a5aa0' } },
  { id: 'trout',   name: 'SILVER TROUT',   r: 'rare',   shape: 'std',   pal: { b: '#b8c4d0', d: '#6a7a8a', l: '#eef4fa', f: '#8a9aaa', s: '#ff8ab0' } },
  { id: 'bass',    name: 'STRIPED BASS',   r: 'rare',   shape: 'std',   pal: { b: '#7a9a6a', d: '#3a4a2a', l: '#d8e0c0', f: '#5a7a4a', s: '#2a3a1a' } },
  { id: 'pike',    name: 'GREEN PIKE',     r: 'super',  shape: 'long',  pal: { b: '#4aa04a', d: '#2a6a2a', l: '#c8e8a0', f: '#3a803a', s: '#e0f080' } },
  { id: 'snapper', name: 'CORAL SNAPPER',  r: 'super',  shape: 'std',   pal: { b: '#ff6a4a', d: '#b03a2a', l: '#ffd0b0', f: '#e04a3a', s: '#ffe060' } },
  { id: 'puffer',  name: 'SPIKY PUFFER',   r: 'super',  shape: 'round', pal: { b: '#e0d040', d: '#8a7a1a', l: '#fff4c0', f: '#b0a030', s: '#6a5a10' } },
  { id: 'tetra',   name: 'NEON TETRA KING', r: 'epic',  shape: 'std',   pal: { b: '#2ad4ff', d: '#ff3ab0', l: '#c8f8ff', f: '#ff3ab0', s: '#ffffff' } },
  { id: 'sword',   name: 'VIOLET SWORDFISH', r: 'epic', shape: 'sword', pal: { b: '#8a5ad4', d: '#4a2a8a', l: '#e0c8ff', f: '#6a3ab0', s: '#c0a0ff' } },
  { id: 'angler',  name: 'GLOW ANGLER',    r: 'epic',   shape: 'round', pal: { b: '#5a3a8a', d: '#2a1a4a', l: '#9a7ac8', f: '#3a2a6a', s: '#a0ff60' } },
  { id: 'eel',     name: 'LAVA EEL',       r: 'mythic', shape: 'long',  pal: { b: '#e03a1a', d: '#6a1a0a', l: '#ffb040', f: '#ff6a1a', s: '#ffe040' } },
  { id: 'koi',     name: 'CRIMSON KOI',    r: 'mythic', shape: 'std',   pal: { b: '#f4f0e8', d: '#c01a2a', l: '#ffffff', f: '#e04050', s: '#d01a2a' } },
  { id: 'ghost',   name: 'GHOST FISH',     r: 'mythic', shape: 'sword', pal: { b: '#c8e8f0', d: '#80a8c0', l: '#ffffff', f: '#a0d0e0', s: '#ff4a8a' } },
  { id: 'gold',    name: 'GOLDEN KOI',     r: 'legend', shape: 'big',   pal: { b: '#e0a020', d: '#a05a1a', l: '#d8e0a0', f: '#c86a2a', s: '#ffe060' } },
  { id: 'dragon',  name: 'SUN DRAGONFISH', r: 'legend', shape: 'long',  pal: { b: '#ffd23f', d: '#ff7a1a', l: '#fff8c0', f: '#ff4a1a', s: '#ffffff' } },
  { id: 'abyss',   name: 'ABYSS KING',     r: 'legend', shape: 'big',   pal: { b: '#2a2a4a', d: '#0a0a1a', l: '#4a4a7a', f: '#ffd23f', s: '#ffd23f' } },
];

// sprites are drawn once into little canvases (with a dark outline), flipped ones too
const spriteCache = {};
function makeSprite(key, rows, pal, flip, silhouette) {
  const ck = key + (flip ? '>' : '<') + (silhouette ? 's' : '');
  if (spriteCache[ck]) return spriteCache[ck];
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  const c = document.createElement('canvas'); c.width = w + 2; c.height = h + 2;
  const g = c.getContext('2d');
  const put = (x, y, col) => { g.fillStyle = col; g.fillRect(flip ? w - x : x + 1, y + 1, 1, 1); };
  const P = Object.assign({ e: '#111111', s: pal.d, w: '#ffffff' }, pal);
  rows.forEach((row, y) => [...row].forEach((ch, x) => { if (ch !== '.') for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) put(x + dx, y + dy, silhouette ? '#0a0818' : '#111111'); }));
  rows.forEach((row, y) => [...row].forEach((ch, x) => { if (ch !== '.') put(x, y, silhouette ? '#2a2440' : P[ch]); }));
  return (spriteCache[ck] = c);
}
const fishSprite = (sp, flip, sil) => makeSprite(sp.id, SHAPES[sp.shape], sp.pal, flip, sil);
function drawSprite(c, cx, cy, s = SCALE) { ctx.drawImage(c, Math.round(cx - c.width * s / 2), Math.round(cy - c.height * s / 2), c.width * s, c.height * s); }
const SHARK = ['...........d........', '..........dd........', '...dddddddbbddd...dd', '.dbbbbbbbbbbbbbbddbd',
               'debbbbbbbbbbbbbbbbbd', 'wwllllllllllbbbbbd.d', '..lllllldd..ddd...dd'];
const BOOT = ['.ddd....', '.bbb....', '.bbb....', '.bbbbbb.', 'llllllll'];

/* --- 3. THE SEA: fish swimming across, and things to stay away from ----------- */
const world = { fish: [], obs: [], weed: [], rocks: [], bubbles: [] };
function newFish(onScreen) {
  const r = rollRarity(), R = RAR[r], list = SPECIES.filter(s => s.r === r), sp = pick(list);
  const dir = Math.random() < 0.5 ? -1 : 1, c = fishSprite(sp, false), hw = c.width * SCALE / 2;
  const y = rnd(R.depth[0], R.depth[1]);
  return { sp, r, dir, x: onScreen ? rnd(20, S.W - 20) : dir > 0 ? -hw - rnd(0, 80) : S.W + hw + rnd(0, 80), y, y0: y,
           hw: hw - 3, hh: c.height * SCALE / 2 - 2, speed: rnd(R.speed[0], R.speed[1]), ph: rnd(0, 6),
           value: Math.round(rnd(R.price[0], R.price[1])) };
}
function fillSea() { world.fish = []; for (let i = 0; i < 16; i++) world.fish.push(newFish(true)); }
function makeObstacles() {
  world.obs = [];
  const N = 18;
  for (let i = 0; i < N; i++) {
    const y = 100 + (i + Math.random() * 0.8) * (MAX_DEPTH - 120) / N;
    const type = y < 260 ? pick(['jelly', 'jelly', 'boot']) : y < 520 ? pick(['jelly', 'urchin', 'boot', 'shark']) : pick(['mine', 'urchin', 'shark', 'jelly']);
    const speed = type === 'shark' ? rnd(55, 80) : type === 'boot' ? rnd(6, 14) : type === 'jelly' ? rnd(4, 10) : 0;
    world.obs.push({ type, x: rnd(30, S.W - 30), y, y0: y, ph: rnd(0, 6), dir: Math.random() < 0.5 ? -1 : 1, speed });
  }
  world.weed = []; for (let i = 0; i < 14; i++) world.weed.push({ x: rnd(0, 600), h: rnd(10, 30), ph: rnd(0, 6), c: pick(['#2a8a4a', '#3aa05a', '#1f6a3a']) });
  world.rocks = []; for (let i = 0; i < 9; i++) world.rocks.push({ x: rnd(0, 600), w: rnd(14, 34), h: rnd(6, 14), c: pick(['#4a4a5a', '#5a5a6a', '#3a3a4a']) });
}
function updateSea(dt, t) {
  const W = S.W;
  world.fish.forEach((f, i) => {
    f.x += f.dir * f.speed * dt; f.y = f.y0 + Math.sin(t * 0.9 + f.ph) * 4;
    if ((f.dir > 0 && f.x > W + f.hw + 20) || (f.dir < 0 && f.x < -f.hw - 20)) world.fish[i] = newFish(false);
  });
  for (const o of world.obs) {
    o.x += o.dir * o.speed * dt;
    if (o.type === 'jelly') o.y = o.y0 + Math.sin(t * 1.3 + o.ph) * 12;
    else if (o.type === 'mine') o.y = o.y0 + Math.sin(t * 0.8 + o.ph) * 3;
    else if (o.type === 'boot') o.y = o.y0 + Math.sin(t * 0.6 + o.ph) * 5;
    const m = o.type === 'shark' ? 70 : 20;
    if (o.x < -m) o.x = W + m; else if (o.x > W + m) o.x = -m;
  }
  for (const b of world.bubbles) { b.y -= b.v * dt; b.x += Math.sin(t * 4 + b.ph) * 6 * dt; b.life -= dt; }
  world.bubbles = world.bubbles.filter(b => b.life > 0 && b.y > -4);
}
function bubble(x, y, n = 1) { for (let i = 0; i < n; i++) world.bubbles.push({ x: x + rnd(-3, 3), y: y + rnd(-3, 3), v: rnd(20, 40), ph: rnd(0, 6), life: rnd(1, 3), s: Math.random() < 0.3 ? 2 : 1 }); }
function obsHit(o, x, y, extra) {            // does the hook (at x, y) touch it?
  if (o.type === 'shark') return Math.abs(x - o.x) < 20 + extra && Math.abs(y - o.y) < 7 + extra;
  return Math.hypot(x - o.x, y - o.y) < 8 + extra;
}

/* --- 4. THE GAME ---------------------------------------------------------------- */
let state = 'title';          // title | fish | shop | book
let paused = false, shopBack = 'title';
let camY = 0;
const G = { phase: 'ready', hook: { x: 0, y: -8 }, hooked: null, hp: 2, inv: 0, shake: 0, msg: null, card: null, snapT: 0, t: 0 };
const boatX = () => Math.round(S.W * 0.42) - 26;   // the boat's left end
const tipX = () => boatX() + 66;                    // the rod tip, where the line hangs from
function startFishing() { state = 'fish'; paused = false; G.phase = 'ready'; G.hooked = null; G.hook.x = tipX(); G.hook.y = -8; camY = 0; }
function cast() {
  if (G.phase !== 'ready') return;
  G.phase = 'down'; G.hp = line().hp; G.inv = 0; G.hooked = null;
  G.hook.x = tipX(); G.hook.y = 0; G.msg = null;
  bubble(G.hook.x, 4, 6); sfx('cast');
}
function reelUp() { if (G.phase === 'down') { G.phase = 'up'; sfx('reel'); } }
function say(text, color = '#fff', dur = 1.4) { G.msg = { text, color, t: dur }; }
function hookFish(f) {
  world.fish.splice(world.fish.indexOf(f), 1); world.fish.push(newFish(false));
  G.hooked = f; G.phase = 'up';
  const R = RAR[f.r];
  say(f.r === 'bad' ? 'A BITE... MEH' : R.name + '!', R.color);
  sfx('bite'); bubble(G.hook.x, G.hook.y, 5);
}
function hit(o) {
  G.hp--; G.inv = 1.2; G.shake = 0.3;
  sfx('hit');
  if (G.hp <= 0) return snap(o);
  say(o.type === 'shark' ? 'SHARK! LINE HURT' : o.type === 'jelly' ? 'JELLYFISH! LINE HURT' : o.type === 'mine' ? 'BOOM! LINE HURT' : 'OUCH! LINE HURT', '#ff6a6a');
}
function snap(o) {
  if (G.hooked) {                                   // the fish gets away
    const f = G.hooked; f.x = G.hook.x; f.y0 = G.hook.y; f.speed *= 2.5; world.fish.push(f); G.hooked = null;
  }
  G.phase = 'snap'; G.snapT = 1.8; sfx('snap');
  say(o && o.type === 'shark' ? 'THE SHARK BIT THROUGH YOUR LINE!' : 'YOUR LINE SNAPPED!', '#ff4a4a', 1.8);
}
function land() {                                   // the hook is back at the boat
  const f = G.hooked; G.hooked = null;
  if (!f) { G.phase = 'ready'; G.hook.y = -8; return; }
  const R = RAR[f.r], isNew = !save.book[f.sp.id];
  save.book[f.sp.id] = (save.book[f.sp.id] | 0) + 1;
  save.coins += f.value; save.caught = (save.caught | 0) + 1; save.best = Math.max(save.best | 0, f.value);
  store();
  if (R.stars) PX.Wallet.add(R.stars);
  G.card = { f, isNew, stars: R.stars, t: 0 };
  G.phase = 'catch'; G.hook.y = -8;
  bubble(G.hook.x, 2, 8);
  sfx(R.i >= 4 ? 'fanfare' : R.i >= 2 ? 'great' : f.r === 'bad' ? 'meh' : 'coin');
}
function step(dt, t) {
  G.t += dt;
  updateSea(dt, t);
  if (G.msg && (G.msg.t -= dt) <= 0) G.msg = null;
  if (G.shake > 0) G.shake -= dt;
  const h = G.hook, W = S.W;
  if (G.phase === 'ready' || G.phase === 'catch') { h.x += (tipX() - h.x) * Math.min(1, dt * 6); h.y = -8; }
  if (G.phase === 'snap' && (G.snapT -= dt) <= 0) { G.phase = 'ready'; h.x = tipX(); h.y = -8; }
  if (G.phase === 'down' || G.phase === 'up') {
    let vx = ((keys.right ? 1 : 0) - (keys.left ? 1 : 0)) * STEER;
    if (steer) vx = clamp((steer.x - h.x) * 8, -STEER, STEER);
    if (G.hooked) { const p = RAR[G.hooked.r].pull; vx += Math.sin(G.t * 2.7 + G.hooked.ph) * p * 1.6 + Math.sin(G.t * 7.3 + G.hooked.ph) * p * 0.5; }
    h.x = clamp(h.x + vx * dt, 8, W - 8);
    if (G.phase === 'down') { h.y += SINK * dt; if (h.y >= MAX_DEPTH) { h.y = MAX_DEPTH; G.phase = 'up'; } }
    else { h.y -= reel().speed * dt; if (h.y <= 0) { h.y = 0; land(); return; } }
    if (G.hooked) { G.hooked.x = h.x; G.hooked.y = h.y + 8; }
    if (Math.random() < dt * 6) bubble(h.x, h.y);
    if (G.inv > 0) G.inv -= dt;
    if (!G.hooked) for (const f of world.fish) if (Math.abs(f.x - h.x) < f.hw && Math.abs(f.y - h.y) < f.hh) { hookFish(f); break; }
    if (G.inv <= 0) for (const o of world.obs) if (obsHit(o, h.x, h.y + (G.hooked ? 8 : 0), G.hooked ? 6 : 2)) { hit(o); break; }
  }
  // the camera follows the hook down
  const want = clamp((G.phase === 'down' || G.phase === 'up' ? h.y : 0) - 50, 0, BED + SURF + 24 - H);
  camY += (want - camY) * Math.min(1, dt * 5);
}

/* --- 5. DRAWING ----------------------------------------------------------------- */
const WATER = [];
(() => {
  const a = [42, 212, 208], b = [4, 18, 42], m = [20, 110, 160];
  for (let i = 0; i < 48; i++) {
    const k = i / 47, c = k < 0.35 ? a.map((v, j) => v + (m[j] - v) * k / 0.35) : m.map((v, j) => v + (b[j] - v) * (k - 0.35) / 0.65);
    WATER.push('rgb(' + c.map(Math.round).join(',') + ')');
  }
})();
const sy = d => SURF + d - camY;                   // depth -> screen y
function drawSea(t, withBoat) {
  const W = S.W, surf = sy(0);
  // the sky
  if (surf > 0) {
    ctx.fillStyle = '#8adcff'; ctx.fillRect(0, 0, W, surf);
    ctx.fillStyle = '#b8ecff'; ctx.fillRect(0, surf - 18, W, 18);
    ctx.fillStyle = '#fff3a0'; ctx.fillRect(W - 60, surf - 58, 16, 16); ctx.fillRect(W - 62, surf - 56, 20, 12);
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 4; i++) { const cx = ((i * 140 + t * 6) % (W + 60)) - 30, cy = surf - 50 + (i % 2) * 14; ctx.fillRect(Math.round(cx), Math.round(cy), 24, 4); ctx.fillRect(Math.round(cx + 5), Math.round(cy - 3), 12, 3); }
  }
  // the water, darker the deeper
  const top = Math.max(0, Math.floor(surf));
  for (let y = top; y < H; y += 4) {
    const d = y - surf;
    ctx.fillStyle = WATER[clamp(Math.floor(d / (BED + 20) * 47), 0, 47)]; ctx.fillRect(0, y, W, 4);
  }
  if (surf > -120) {                               // light rays from the surface
    ctx.globalAlpha = 0.08;
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 6; i++) {
      const x0 = ((i * 97 + t * 8) % (W + 80)) - 40;
      ctx.beginPath(); ctx.moveTo(x0, surf); ctx.lineTo(x0 + 14, surf); ctx.lineTo(x0 + 60, surf + 160); ctx.lineTo(x0 + 34, surf + 160); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  if (surf > -4 && surf < H) {                     // little waves
    ctx.fillStyle = '#c8fbff';
    for (let x = 0; x < W; x += 12) ctx.fillRect(x + Math.round(Math.sin(t * 2 + x * 0.1) * 2), Math.round(surf), 6, 1);
  }
  // the sea bed
  const bed = sy(BED);
  if (bed < H) {
    for (const w of world.weed) {
      const x = w.x % (W + 20) - 10;
      for (let k = 0; k < w.h; k += 2) { ctx.fillStyle = w.c; ctx.fillRect(Math.round(x + Math.sin(t * 1.5 + w.ph + k * 0.15) * k * 0.15), Math.round(bed - k), 2, 2); }
    }
    ctx.fillStyle = '#b8945a'; ctx.fillRect(0, Math.round(bed), W, H - bed);
    ctx.fillStyle = '#d0ac70'; ctx.fillRect(0, Math.round(bed), W, 2);
    for (const r of world.rocks) { ctx.fillStyle = r.c; const x = r.x % (W + 20) - 10; ctx.fillRect(Math.round(x), Math.round(bed - r.h + 2), Math.round(r.w), Math.round(r.h)); }
  }
  // things to stay away from
  for (const o of world.obs) drawObstacle(o, t);
  // the fish
  for (const f of world.fish) drawFish(f, t);
  // bubbles
  ctx.fillStyle = '#c8f4ff';
  for (const b of world.bubbles) { const y = sy(b.y); if (y > surf) ctx.fillRect(Math.round(b.x), Math.round(y), b.s, b.s); }
  if (withBoat) drawBoat(t);
}
function drawFish(f, t) {
  const y = sy(f.y);
  if (y < -30 || y > H + 30) return;
  drawSprite(fishSprite(f.sp, f.dir > 0), f.x, y);
  const R = RAR[f.r];
  if (R.i >= 3) {                                 // epic and rarer fish sparkle
    ctx.fillStyle = R.color;
    for (let i = 0; i < R.i - 1; i++) {
      const a = t * 2 + i * 2.1 + f.ph, on = Math.sin(t * 6 + i * 3 + f.ph) > 0;
      if (on) ctx.fillRect(Math.round(f.x + Math.cos(a) * (f.hw + 4)), Math.round(y + Math.sin(a) * (f.hh + 4)), 2, 2);
    }
  }
}
function drawObstacle(o, t) {
  const x = Math.round(o.x), y = Math.round(sy(o.y));
  if (y < -30 || y > H + 30) return;
  if (o.type === 'jelly') {
    ctx.fillStyle = '#111'; ctx.fillRect(x - 7, y - 6, 14, 8);
    ctx.fillStyle = '#ff8ad8'; ctx.fillRect(x - 6, y - 5, 12, 6); ctx.fillRect(x - 4, y - 7, 8, 2);
    ctx.fillStyle = '#ffc8ee'; ctx.fillRect(x - 3, y - 5, 3, 2);
    ctx.fillStyle = '#ff6ac8';
    for (let i = 0; i < 4; i++) for (let k = 0; k < 4; k++) ctx.fillRect(x - 5 + i * 3 + Math.round(Math.sin(t * 4 + k + i) * 1), y + 1 + k * 2, 1, 2);
  } else if (o.type === 'boot') {
    drawSprite(makeSprite('boot', BOOT, { b: '#6a4a2a', d: '#3a2a1a', l: '#2a1a10' }, o.dir > 0), x, y);
  } else if (o.type === 'urchin') {
    ctx.fillStyle = '#1a0a2a';
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4 + t * 0.3; for (let k = 5; k < 10; k++) ctx.fillRect(Math.round(x + Math.cos(a) * k), Math.round(y + Math.sin(a) * k), 1, 1); }
    ctx.fillStyle = '#111'; ctx.fillRect(x - 6, y - 5, 12, 10); ctx.fillRect(x - 5, y - 6, 10, 12);
    ctx.fillStyle = '#5a2a7a'; ctx.fillRect(x - 5, y - 4, 10, 8); ctx.fillRect(x - 4, y - 5, 8, 10);
    ctx.fillStyle = '#8a4ab0'; ctx.fillRect(x - 3, y - 3, 3, 2);
  } else if (o.type === 'mine') {
    const bed = sy(BED);
    ctx.fillStyle = '#3a3a44'; for (let k = y + 7; k < bed; k += 4) ctx.fillRect(x, k, 1, 2);   // its chain to the sea bed
    ctx.fillStyle = '#111';
    for (const [dx, dy] of [[0, -9], [0, 8], [-9, 0], [8, 0], [-6, -6], [5, -6], [-6, 5], [5, 5]]) ctx.fillRect(x + dx, y + dy, 2, 2);
    ctx.fillRect(x - 6, y - 5, 13, 11); ctx.fillRect(x - 5, y - 6, 11, 13);
    ctx.fillStyle = '#4a4a56'; ctx.fillRect(x - 5, y - 4, 11, 9); ctx.fillRect(x - 4, y - 5, 9, 11);
    ctx.fillStyle = Math.sin(t * 6 + o.ph) > 0 ? '#ff3a3a' : '#6a1a1a'; ctx.fillRect(x - 1, y - 1, 2, 2);
  } else if (o.type === 'shark') {
    drawSprite(makeSprite('shark', SHARK, { b: '#7a8a9a', d: '#4a5a6a', l: '#d0d8e0', f: '#4a5a6a' }, o.dir > 0), x, y);
  }
}
function drawRod(x0, y0, x1, y1, r) {
  ctx.strokeStyle = '#111'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();

}
function drawBoat(t) {

  ctx.fillStyle = '#111'; ctx.fillRect(bx - 2, by - 9, 60, 12); ctx.fillRect(bx + 2, by + 3, 52, 4);
  ctx.fillStyle = '#c0582a'; ctx.fillRect(bx - 1, by - 8, 58, 10); ctx.fillStyle = '#9a3a1a'; ctx.fillRect(bx + 3, by + 2, 50, 3);

function drawLineAndHook(t) {
  const surf = sy(0), tx = tipX(), ty = Math.round(surf + Math.sin(t * 1.6) * 1.5) - 40;
  const h = G.hook, hy = sy(h.y);
  if (G.phase !== 'snap') {
    ctx.strokeStyle = 'rgba(240,250,255,0.8)'; ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(h.x, hy); ctx.stroke();
  }
  if (G.hooked) drawSprite(fishSprite(G.hooked.sp, Math.sin(G.t * 9) > 0), h.x, hy + 8);
  if (G.phase !== 'snap' && !(G.inv > 0 && Math.floor(G.inv * 12) % 2)) {   // the hook (blinks after a hit)
    const x = Math.round(h.x), y = Math.round(hy);
    ctx.fillStyle = '#111'; ctx.fillRect(x - 1, y - 6, 3, 8); ctx.fillRect(x - 5, y + 1, 7, 3); ctx.fillRect(x - 6, y - 3, 3, 6);
    ctx.fillStyle = '#c8d0d8'; ctx.fillRect(x, y - 5, 1, 7); ctx.fillRect(x - 4, y + 2, 5, 1); ctx.fillRect(x - 5, y - 2, 1, 4);
    if (!G.hooked && G.phase !== 'ready' && G.phase !== 'catch') { ctx.fillStyle = '#e04a7a'; ctx.fillRect(x - 3, y - 1, 3, 2); }   // the worm

}

/* --- sound --- */
function sfx(k) {
  if (!save.sfx) return;
  const s = PX.Sound;
  if (k === 'click') s.tone([523, 784], 0.12, { vol: 0.1 });
  else if (k === 'cast') { s.noise(0.25, { freq: 1200, vol: 0.12 }); s.tone([900, 300], 0.2, { vol: 0.06, type: 'triangle' }); }
  else if (k === 'reel') s.tone([300, 600], 0.2, { vol: 0.06 });
  else if (k === 'bite') { s.tone([400, 800], 0.08, { vol: 0.12 }); s.tone([500, 1000], 0.08, { vol: 0.12, delay: 0.1 }); }
  else if (k === 'hit') s.noise(0.2, { freq: 400, vol: 0.3 });
  else if (k === 'snap') { s.tone([800, 120], 0.35, { vol: 0.12, type: 'sawtooth' }); s.noise(0.2, { freq: 2500, vol: 0.1, filter: 'highpass' }); }
  else if (k === 'meh') s.tone([300, 200], 0.25, { vol: 0.1, type: 'triangle' });
  else if (k === 'coin') { s.tone(988, 0.08, { vol: 0.1 }); s.tone(1319, 0.15, { vol: 0.1, delay: 0.08 }); }
  else if (k === 'great') [523, 659, 784, 1047].forEach((f, i) => s.tone(f, 0.12, { vol: 0.1, delay: i * 0.08 }));
  else if (k === 'fanfare') [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => s.tone(f, 0.16, { vol: 0.11, delay: i * 0.1 }));
  else if (k === 'buy') { s.tone([660, 1320], 0.2, { vol: 0.1 }); s.tone(1760, 0.15, { vol: 0.08, delay: 0.15 }); }
}

/* --- 7. INPUT: drag to steer the hook (it follows your finger) ---------------------- */
let steer = null;
const keys = { left: false, right: false };
UI.onDown = (e, x) => {
  PX.Sound.unlock();
  if (state !== 'fish' || paused || UI.downId !== null) return;
  if (G.phase === 'down' || G.phase === 'up') steer = { id: e.pointerId, x };
};
UI.onMove = (e, x) => { if (steer && steer.id === e.pointerId) steer.x = x; };
UI.onUp = e => { if (steer && steer.id === e.pointerId) steer = null; };
window.addEventListener('keydown', e => {
  PX.Sound.unlock();
  const k = e.code;
  if (k === 'ArrowLeft' || k === 'KeyA') keys.left = true;
  if (k === 'ArrowRight' || k === 'KeyD') keys.right = true;
  if (state === 'fish' && !paused) {
    if ((k === 'Space' || k === 'ArrowUp' || k === 'KeyW') && !e.repeat) { if (G.phase === 'ready') cast(); else if (G.phase === 'down') reelUp(); }
  }
  if ((k === 'KeyP' || k === 'Escape') && state === 'fish' && (G.phase === 'down' || G.phase === 'up')) setPause(!paused);
  else if (k === 'Escape') UI.back = true;
});
window.addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
});
window.addEventListener('blur', () => { keys.left = keys.right = false; setPause(true); });
document.addEventListener('visibilitychange', () => { if (document.hidden) setPause(true); });

/* --- 8. MAIN LOOP ----------------------------------------------------------------- */
makeObstacles(); fillSea();
G.hook.x = tipX();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000), t = now / 1000; last = now;
  UI.begin();
  if (state === 'title') drawTitle(t);
  else if (state === 'shop') drawShop(t);
  else if (state === 'book') drawBook(t);
  else {
    if (!paused) step(dt, t);
    drawGame(t);
    if (paused) drawPause();
  }
  UI.end();
  S.blit('#062038');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => { /* offline mode unavailable */ }));
}
PX.Pad.setup({
  title: 'Deep Catch: controller', ui: UI,
  menu: () => state !== 'fish' || paused || (G.phase !== 'down' && G.phase !== 'up'),
  phone: { stick: 'STEER', buttons: [['A', 'REEL UP']] },
  keys: () => ({ left: 'ArrowLeft', right: 'ArrowRight', A: 'Space', START: 'KeyP' }),
  help: [['STICK|D-PAD', 'STEER THE HOOK'], ['A', 'REEL UP'], ['START', 'PAUSE'], ['STICK|D-PAD', 'MENUS: PICK A BUTTON'], ['A', 'MENUS: OK'], ['B', 'MENUS: BACK']],
});
</script>
