<script type="module">
/* ==========================================================================
   PIXEL HEIST: a low-poly 3D city (part of the PIXEL ARCADE).
   Sneak to the target, grab the loot, then escape to your hideout before
   the police catch you. Five levels, each one harder and richer:
   the corner shop, the jewelry store, the art museum, the gold shop and
   finally the city bank.
     1. Setup        2. City         3. Models       4. Cars & people
     5. Level        6. Update       7. Sound        8. HUD & screens
     9. Main loop
   The 3D world is drawn by three.js (vendor/, MIT licence) at a low
   resolution for a chunky pixel look; the buttons and text are drawn on a
   pixel screen on top, like the other arcade games.
   ========================================================================== */
import * as THREE from './vendor/three.module.min.js';

/* --- 1. SETUP --------------------------------------------------------------- */
const VERSION = '1.0.0';
const SAVE_KEY = 'pixelHeist.save';
const save = { level: 1, done: false, best: {}, music: true, sfx: true, heists: 0 };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY)) || {}); } catch (e) { /* new player */ }
const store = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* private mode */ } };
const profile = PX.Profile.get();
const MY_COLOR = PX.AVATAR_COLORS[profile.avatar.color];

const hud = document.getElementById('hud');
const S = PX.makeScreen(hud, { H: 240, minW: 400, maxW: 560 });
const ctx = S.ctx, H = S.H, hctx = hud.getContext('2d');
const UI = PX.makeUI(S, hud);
const T = (str, x, y, color = '#fff', size = 1, align = 'left', shadow = '#000') => PX.drawText(ctx, str, x, y, color, size, align, shadow);

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const wrapA = a => { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; };
const money = n => '$' + Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const clock = t => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');
function rngOf(seed) {
  return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

let renderer = null;
try { renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('world'), antialias: false, powerPreference: 'high-performance' }); }
catch (e) { renderer = null; }
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, 1, 0.5, 420);
const LINES = 400;                       // the 3D picture is this many pixels tall, then blown up: chunky pixels
function resize3d() {
  if (!renderer) return;
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, LINES / h));
  renderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize3d);
resize3d();

const hemi = new THREE.HemisphereLight(0xffffff, 0x556655, 1.3);
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(-80, 140, -50);
scene.add(hemi, sun);
scene.fog = new THREE.Fog(0xbfe3ff, 90, 260);

// The time of day: each level is later in the day, the bank is robbed at night.
const TOD = {
  day:       { sky: '#8fd0ff', fog: '#cbe8ff', hemi: ['#ffffff', '#6b7a5a', 1.35], sun: ['#fff4dd', 1.7], win: 0, lamps: 0, near: 90, far: 280 },
  afternoon: { sky: '#9cc4f0', fog: '#ead8c0', hemi: ['#fff1dc', '#6b6a5a', 1.25], sun: ['#ffd9a0', 1.6], win: 0, lamps: 0, near: 85, far: 270 },
  sunset:    { sky: '#ff9a6b', fog: '#f0a888', hemi: ['#ffc8a0', '#5a4a5a', 1.05], sun: ['#ff9050', 1.5], win: 0.6, lamps: 1, near: 70, far: 240 },
  dusk:      { sky: '#4a3a7a', fog: '#3e3466', hemi: ['#9a90d0', '#30283a', 0.95], sun: ['#a08aff', 0.7], win: 0.9, lamps: 1, near: 50, far: 210 },
  night:     { sky: '#0d0b24', fog: '#0d0b24', hemi: ['#6a7ab0', '#1a1828', 0.8], sun: ['#8aa0ff', 0.45], win: 1, lamps: 1, near: 40, far: 190 },
};

/* --- 2. CITY: a grid of roads, blocks of buildings, parks and the special places -- */
const N = 8, P = 48, CITY = N * P;       // 8 x 8 blocks; a road every 48 m
const ROAD = 6;                          // half the road's width
const ASPHALT = '#4a4a55', WALK = '#b8b4c0', GRASS = '#4f9a4a';

// The special places, by block. Each one faces the road on its -z side.
const PLACES = {
  hideout: { b: [0, 0], sign: 'HIDEOUT', sc: '#9be36b' },
  police:  { b: [4, 0], sign: 'POLICE', sc: '#6bb0ff' },
  shop:    { b: [2, 1], sign: '24H SHOP', sc: '#ffd23f' },
  jewels:  { b: [1, 4], sign: 'JEWELS', sc: '#ff8af0' },
  museum:  { b: [5, 3], sign: 'MUSEUM', sc: '#ffe8b0' },
  gold:    { b: [2, 6], sign: 'GOLD', sc: '#ffd23f' },
  bank:    { b: [6, 6], sign: 'CITY BANK', sc: '#9be36b' },
};
const LEVELS = [
  { place: 'shop',   name: 'CORNER SHOP',   loot: 'THE CASH REGISTER',  value: 500,     icon: 'coin',     tod: 'day',       robTime: 6,  police: 1, copSpeed: 15, delay: 20, guards: 0, traffic: 8,  reward: 10 },
  { place: 'jewels', name: 'JEWELRY STORE', loot: 'THE DIAMONDS',       value: 8000,    icon: 'diamond',  tod: 'afternoon', robTime: 8,  police: 2, copSpeed: 18, delay: 15, guards: 0, traffic: 10, reward: 15 },
  { place: 'museum', name: 'ART MUSEUM',    loot: 'THE GOLDEN PAINTING', value: 60000,  icon: 'painting', tod: 'sunset',    robTime: 10, police: 3, copSpeed: 21, delay: 11, guards: 2, traffic: 12, reward: 25 },
  { place: 'gold',   name: 'GOLD SHOP',     loot: 'THE GOLD BARS',      value: 250000,  icon: 'gold',     tod: 'dusk',      robTime: 12, police: 4, copSpeed: 22, delay: 9,  guards: 3, traffic: 12, reward: 40 },
  { place: 'bank',   name: 'CITY BANK',     loot: 'THE BANK VAULT',     value: 1000000, icon: 'bag',      tod: 'night',     robTime: 14, police: 5, copSpeed: 24, delay: 8,  guards: 4, traffic: 14, reward: 80 },
];
const MIN_LOOT = 0.5;                    // grab at least half, the rest is a bonus

// Solid things (buildings, tree trunks), kept per block so the checks stay quick.
const blockRects = Array.from({ length: N * N }, () => []);
function addSolid(x0, z0, x1, z1, h) {
  const bi = clamp(Math.floor((x0 + x1) / 2 / P), 0, N - 1), bj = clamp(Math.floor((z0 + z1) / 2 / P), 0, N - 1);
  blockRects[bi + bj * N].push({ x0, z0, x1, z1, h });
}
function solidAt(x, z) {
  const bi = Math.floor(x / P), bj = Math.floor(z / P);
  if (bi < 0 || bj < 0 || bi >= N || bj >= N) return null;
  for (const r of blockRects[bi + bj * N]) if (x > r.x0 && x < r.x1 && z > r.z0 && z < r.z1) return r;
  return null;
}
function lineClear(x0, z0, x1, z1) {
  const d = Math.hypot(x1 - x0, z1 - z0), n = Math.ceil(d / 2);
  for (let i = 1; i < n; i++) if (solidAt(x0 + (x1 - x0) * i / n, z0 + (z1 - z0) * i / n)) return false;
  return true;
}
// Push a round thing (x, z, radius r) out of the buildings; returns the wall's direction or null.
function pushOut(o, r) {
  let hit = null;
  const i0 = clamp(Math.floor((o.x - r) / P), 0, N - 1), i1 = clamp(Math.floor((o.x + r) / P), 0, N - 1);
  const j0 = clamp(Math.floor((o.z - r) / P), 0, N - 1), j1 = clamp(Math.floor((o.z + r) / P), 0, N - 1);
  for (let bj = j0; bj <= j1; bj++) for (let bi = i0; bi <= i1; bi++) for (const b of blockRects[bi + bj * N]) {
    const cx = clamp(o.x, b.x0, b.x1), cz = clamp(o.z, b.z0, b.z1), dx = o.x - cx, dz = o.z - cz, d2 = dx * dx + dz * dz;
    if (d2 >= r * r) continue;
    if (d2 > 1e-6) { const d = Math.sqrt(d2); o.x = cx + dx / d * r; o.z = cz + dz / d * r; hit = { nx: dx / d, nz: dz / d }; }
    else {
      const l = o.x - b.x0, rt = b.x1 - o.x, t = o.z - b.z0, bt = b.z1 - o.z, m = Math.min(l, rt, t, bt);
      if (m === l) { o.x = b.x0 - r; hit = { nx: -1, nz: 0 }; } else if (m === rt) { o.x = b.x1 + r; hit = { nx: 1, nz: 0 }; }
      else if (m === t) { o.z = b.z0 - r; hit = { nx: 0, nz: -1 }; } else { o.z = b.z1 + r; hit = { nx: 0, nz: 1 }; }
    }
  }
  const lo = -9 + r, hi = CITY + 9 - r;          // the edge of town
  if (o.x < lo) { o.x = lo; hit = { nx: 1, nz: 0 }; } if (o.x > hi) { o.x = hi; hit = { nx: -1, nz: 0 }; }
  if (o.z < lo) { o.z = lo; hit = { nx: 0, nz: 1 }; } if (o.z > hi) { o.z = hi; hit = { nx: 0, nz: -1 }; }
  return hit;
}

// Static geometry is merged into a few big meshes (fast on phones).
class Builder {
  constructor() { this.p = []; this.n = []; this.c = []; this.u = []; }
  quad(a, b, c, d, col, uv) {
    const e1 = [b[0] - a[0], b[1] - a[1], b[2] - a[2]], e2 = [c[0] - a[0], c[1] - a[1], c[2] - a[2]];
    let nx = e1[1] * e2[2] - e1[2] * e2[1], ny = e1[2] * e2[0] - e1[0] * e2[2], nz = e1[0] * e2[1] - e1[1] * e2[0];
    const l = Math.hypot(nx, ny, nz) || 1; nx /= l; ny /= l; nz /= l;
    for (const [v, t] of [[a, 0], [b, 1], [c, 2], [a, 0], [c, 2], [d, 3]]) {
      this.p.push(v[0], v[1], v[2]); this.n.push(nx, ny, nz); this.c.push(col.r, col.g, col.b);
      this.u.push(uv ? uv[t * 2] : 0.002, uv ? uv[t * 2 + 1] : 0.002);
    }
  }
  // a box from (x0,y0,z0) to (x1,y1,z1); textured = windows on the sides
  box(x0, y0, z0, x1, y1, z1, color, textured = false, skipBottom = true) {
    const col = new THREE.Color(color), S16 = 1 / 16;
    const side = (len, off) => textured ? [off * S16, y0 * S16, (off + len) * S16, y0 * S16, (off + len) * S16, y1 * S16, off * S16, y1 * S16] : null;
    this.quad([x1, y0, z1], [x1, y0, z0], [x1, y1, z0], [x1, y1, z1], col, side(z1 - z0, z0));
    this.quad([x0, y0, z0], [x0, y0, z1], [x0, y1, z1], [x0, y1, z0], col, side(z1 - z0, z0));
    this.quad([x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1], col, side(x1 - x0, x0));
    this.quad([x1, y0, z0], [x0, y0, z0], [x0, y1, z0], [x1, y1, z0], col, side(x1 - x0, x0));
    this.quad([x0, y1, z1], [x1, y1, z1], [x1, y1, z0], [x0, y1, z0], col, null);
    if (!skipBottom) this.quad([x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1], col, null);
  }
  cbox(cx, cy, cz, w, h, d, color) { this.box(cx - w / 2, cy - h / 2, cz - d / 2, cx + w / 2, cy + h / 2, cz + d / 2, color); }
  // any three.js shape, moved into place
  geo(g, x, y, z, color, sx = 1, sy = 1, sz = 1, ry = 0) {
    const m = new THREE.Matrix4().compose(new THREE.Vector3(x, y, z), new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), ry), new THREE.Vector3(sx, sy, sz));
    const ng = (g.index ? g.toNonIndexed() : g.clone()); ng.applyMatrix4(m);
    const pos = ng.attributes.position.array, col = new THREE.Color(color);
    for (let i = 0; i < pos.length; i += 9) {
      this.quad([pos[i], pos[i + 1], pos[i + 2]], [pos[i + 3], pos[i + 4], pos[i + 5]], [pos[i + 6], pos[i + 7], pos[i + 8]], [pos[i + 6], pos[i + 7], pos[i + 8]], col, null);
    }
  }
  mesh(material) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.p, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(this.n, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(this.c, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(this.u, 2));
    g.computeBoundingSphere();
    return new THREE.Mesh(g, material);
  }
}

// The window texture: 4 x 4 windows; a second copy with some windows lit up for the evening.
function windowTextures() {
  const mk = () => { const c = document.createElement('canvas'); c.width = c.height = 128; return c; };
  const a = mk(), b = mk(), g = a.getContext('2d'), e = b.getContext('2d'), rnd = rngOf(7);
  g.fillStyle = '#f2f0ee'; g.fillRect(0, 0, 128, 128);
  e.fillStyle = '#000'; e.fillRect(0, 0, 128, 128);
  for (let j = 0; j < 4; j++) for (let i = 0; i < 4; i++) {
    const x = i * 32, y = j * 32;
    g.fillStyle = '#d8d4d0'; g.fillRect(x, y + 29, 32, 3);               // the floor line
    g.fillStyle = '#2c3650'; g.fillRect(x + 7, y + 6, 18, 18);           // glass
    g.fillStyle = '#4a5a80'; g.fillRect(x + 9, y + 8, 4, 2); g.fillRect(x + 9, y + 10, 2, 3);
    g.fillStyle = '#9a96a0'; g.fillRect(x + 6, y + 24, 20, 2);           // sill
    if (rnd() < 0.5) { e.fillStyle = rnd() < 0.7 ? '#ffcf70' : '#ffe9b0'; e.fillRect(x + 7, y + 6, 18, 18); }
  }
  const t = (c) => { const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.magFilter = THREE.NearestFilter; tx.anisotropy = 4; return tx; };
  return [t(a), t(b)];
}
const [WIN_TEX, WIN_GLOW] = windowTextures();
const wallMat = new THREE.MeshLambertMaterial({ map: WIN_TEX, vertexColors: true, emissiveMap: WIN_GLOW, emissive: 0x000000 });
const plainMat = new THREE.MeshLambertMaterial({ vertexColors: true });
const glowMat = new THREE.MeshBasicMaterial({ vertexColors: true });
const poolMat = new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.22, depthWrite: false, blending: THREE.AdditiveBlending });

// A sign with pixel letters
function signMesh(text, fg, bg, height = 2.2) {
  const tw = PX.textWidth(text, 1), c = document.createElement('canvas');
  c.width = tw + 6; c.height = 9;
  const g = c.getContext('2d');
  g.fillStyle = '#111'; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = bg; g.fillRect(1, 1, c.width - 2, c.height - 2);
  PX.drawText(g, text, 3, 2, fg, 1);
  const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; tx.magFilter = THREE.NearestFilter; tx.minFilter = THREE.LinearFilter;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(height * c.width / c.height, height), new THREE.MeshBasicMaterial({ map: tx, fog: true }));
  return m;
}

const SPOTS = {};                        // where to stand to rob a place (or to get into the hideout)
const lampSpots = [];
const BUILDING_COLORS = ['#e8d5b0', '#c97b63', '#9fb7c9', '#d9a3a3', '#b9c99f', '#e0c27a', '#a7a0c9', '#cfcfcf', '#8fa3a8', '#d8b8e0', '#c2a586'];
let cityMeshes = [];
function buildCity() {
  const rnd = rngOf(1234), walls = new Builder(), plain = new Builder(), glow = new Builder(), pools = new Builder();
  const cone = new THREE.ConeGeometry(1, 1, 6), ball = new THREE.IcosahedronGeometry(1, 0), cyl = new THREE.CylinderGeometry(1, 1, 1, 8);
  // the ground: asphalt in town, grass around it
  plain.box(-14, -0.2, -14, CITY + 14, 0, CITY + 14, ASPHALT);
  plain.box(-300, -0.4, -300, 300 + CITY, -0.2, 300 + CITY, '#3e7a3a');
  // lane lines
  for (let k = 0; k <= N; k++) for (let s = 0; s < N; s++) for (let d = 10; d < P - 8; d += 6) {
    plain.box(k * P - 0.15, 0, s * P + d, k * P + 0.15, 0.03, s * P + d + 3, '#e8d36a');
    plain.box(s * P + d, 0, k * P - 0.15, s * P + d + 3, 0.03, k * P + 0.15, '#e8d36a');
  }
  // zebra crossings next to each crossroad
  for (let i = 0; i <= N; i++) for (let j = 0; j <= N; j++) for (let s = -5; s <= 5; s += 2) {
    const x = i * P, z = j * P;
    if (j < N) plain.box(x + s - 0.5, 0, z + 7, x + s + 0.5, 0.03, z + 9.5, '#e8e8e8');
    if (i < N) plain.box(x + 7, 0, z + s - 0.5, x + 9.5, 0.03, z + s + 0.5, '#e8e8e8');
  }
  // the edge of town: a hedge and trees
  for (let s = -12; s <= CITY + 12; s += 4) for (const [x, z] of [[s, -12], [s, CITY + 12], [-12, s], [CITY + 12, s]]) {
    plain.cbox(x, 0.8, z, 4.2, 1.6, 4.2, '#2f6e34');
    if (rnd() < 0.35) { const tx = x + (x < 0 ? -6 : x > CITY ? 6 : 0) * rnd(), tz = z + (z < 0 ? -6 : z > CITY ? 6 : 0) * rnd(); tree(plain, tx + (x < 0 ? -4 : x > CITY ? 4 : 0), tz + (z < 0 ? -4 : z > CITY ? 4 : 0), rnd, cone, ball, false); }
  }
  const special = {};
  for (const id in PLACES) special[PLACES[id].b.join(',')] = id;
  for (let bj = 0; bj < N; bj++) for (let bi = 0; bi < N; bi++) {
    const x0 = bi * P + ROAD, z0 = bj * P + ROAD, x1 = x0 + P - ROAD * 2, z1 = z0 + P - ROAD * 2;
    plain.box(x0, 0, z0, x1, 0.25, z1, WALK);
    for (const [lx, lz] of [[x0 + 1, z0 + 1], [x1 - 1, z0 + 1], [x0 + 1, z1 - 1], [x1 - 1, z1 - 1]]) {   // street lamps
      plain.cbox(lx, 2.6, lz, 0.25, 5.2, 0.25, '#3a3a44');
      glow.cbox(lx, 5.3, lz, 0.7, 0.35, 0.7, '#ffe9a0');
      pools.geo(cyl, lx, 0.3, lz, '#ffb84a', 5, 0.02, 5);
      lampSpots.push([lx, lz]);
    }
    const id = special[bi + ',' + bj];
    if (id) { buildPlace(id, x0, z0, x1, z1, walls, plain, glow, cone, ball); continue; }
    if (rnd() < 0.14) {                                                     // a park
      plain.box(x0 + 3, 0.25, z0 + 3, x1 - 3, 0.35, z1 - 3, GRASS);
      const cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;
      plain.geo(cyl, cx, 0.6, cz, '#9a96a8', 4, 0.6, 4); plain.geo(cyl, cx, 0.92, cz, '#4aa0e0', 3.4, 0.1, 3.4); plain.geo(cyl, cx, 1.6, cz, '#9a96a8', 0.5, 1.6, 0.5);
      addSolid(cx - 3.8, cz - 3.8, cx + 3.8, cz + 3.8, 1.2);
      for (let k = 0; k < 9; k++) {
        const tx = x0 + 6 + rnd() * (x1 - x0 - 12), tz = z0 + 6 + rnd() * (z1 - z0 - 12);
        if (Math.hypot(tx - cx, tz - cz) < 7) continue;
        tree(plain, tx, tz, rnd, cone, ball, true);
      }
      continue;
    }
    // buildings: one big one, two halves or four corners
    const lx0 = x0 + 3, lz0 = z0 + 3, lx1 = x1 - 3, lz1 = z1 - 3, mx = (lx0 + lx1) / 2, mz = (lz0 + lz1) / 2, r = rnd();
    const lots = r < 0.15 ? [[lx0, lz0, lx1, lz1]] : r < 0.4 ? [[lx0, lz0, mx - 1, lz1], [mx + 1, lz0, lx1, lz1]] : r < 0.6 ? [[lx0, lz0, lx1, mz - 1], [lx0, mz + 1, lx1, lz1]]

    for (const [a, b, c, d] of lots) {

function updateParts(dt) {

    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; p.vy -= (p.size < 0.4 ? 9 : -0.5) * dt;
    if (p.y < 0.3) { p.y = 0.3; p.vy = 0; p.vx *= 0.8; p.vz *= 0.8; }
    const s = p.size * (p.size < 0.4 ? 1 : 1 + (1 - p.life / p.max) * 1.5);

function stepCar(c, thr, steer, dt) {
  const s = SPEC[c.kind];

  if (thr > 0) c.v += (c.v < 0 ? s.brake : s.accel * (1 - 0.5 * Math.max(0, c.v) / c.top)) * thr * dt;

  if (c.reverseT > 0) { c.reverseT -= dt; stepCar(c, -1, -steer, dt); return; }

  const thr = c.v < target - 0.5 ? 1 : c.v > target + 1.5 ? -0.7 : 0;
  stepCar(c, thr, steer, dt);

/* --- 5. LEVEL: setting up a heist ---------------------------------------------- */

  hemi.color.set(t.hemi[0]); hemi.groundColor.set(t.hemi[1]); hemi.intensity = t.hemi[2];
  sun.color.set(t.sun[0]); sun.intensity = t.sun[1];

function spawnTraffic(n, rnd, avoid) {

        target, icon: makeIcon(lv.icon), beacon: makeBeacon(0xffd23f), home: null };

function say(text, color = '#fff', t = 2.6) { if (!G) return; G.msg = text; G.msgT = t; G.msgC = color; }

/* --- 6. UPDATE --------------------------------------------------------------- */
const keys = { up: false, down: false, left: false, right: false };
const Ctl = { show: false, id: null, ox: 0, oy: 0, dx: 0, dy: 0 };
function input() {
  let fwd = (keys.up ? 1 : 0) - (keys.down ? 1 : 0), turn = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (Ctl.id !== null) {
    const r = 26, dx = clamp(Ctl.dx / r, -1, 1), dy = clamp(Ctl.dy / r, -1, 1);
    if (Math.abs(dx) > 0.15) turn = dx; if (Math.abs(dy) > 0.15) fwd = -dy;
  }

}
function nearestCar() {
  let best = null, bd = 3.6;
  for (const c of cars) { if (c.ai === 'police' || c.hp <= 0) continue; const d = Math.hypot(c.x - player.x, c.z - player.z) - c.r * 0.5; if (d < bd) { bd = d; best = c; } }
  return best;
}
function action() {
  if (state !== 'play' || paused || G.over) return;
  if (player.car) {                                             // get out
    const c = player.car, lx = Math.cos(c.yaw), lz = -Math.sin(c.yaw);
    player.x = c.x + lx * 2.4; player.z = c.z + lz * 2.4; player.yaw = c.yaw; player.car = null; c.ai = 'parked';
    pushOut(player, 0.5); player.mesh.visible = true; sfx('door');
  } else {
    const c = nearestCar(); if (!c) return;
    player.car = c; c.ai = 'player'; player.mesh.visible = false; sfx('door');
    if (c.kind !== 'sport' || c.hp < SPEC[c.kind].hp) say(c.hp <= 0 ? 'THIS CAR IS BROKEN' : 'YOU TOOK A ' + (c.kind === 'van' ? 'VAN' : c.kind === 'taxi' ? 'TAXI' : 'CAR') + '!', '#fff', 1.5);
  }
}
function update(dt) {
  const lv = G.lv, inp = input();
  if (!G.over) G.t += dt;
  G.shake = Math.max(0, G.shake - dt * 2);
  if (G.msgT > 0) G.msgT -= dt;
  // you
  if (G.over) { inp.fwd = 0; inp.turn = 0; }
  if (player.car) {
    const c = player.car;
    stepCar(c, inp.fwd, inp.turn, dt);
    if (c.hitT > 0) c.hitT -= dt;
  } else {
    const want = inp.fwd > 0 ? 8 * inp.fwd : inp.fwd < 0 ? 3.5 * inp.fwd : 0;
    player.v += clamp(want - player.v, -40 * dt, 40 * dt);
    player.yaw = wrapA(player.yaw - inp.turn * 3.6 * dt);
    player.x += Math.sin(player.yaw) * player.v * dt; player.z += Math.cos(player.yaw) * player.v * dt;
    pushOut(player, 0.5);
  }
  // everybody else
  for (const c of cars) {
    if (c === player.car) continue;
    if (c.ai === 'traffic') trafficAI(c, dt);
    else if (c.ai === 'police') policeAI(c, dt);
    else stepCar(c, 0, 0, dt);
  }
  for (const c of cars) {
    const v0 = carVel(c), hit = pushOut(c, c.r);
    if (hit) {
      const imp = -(v0.x * hit.nx + v0.z * hit.nz);
      if (imp > 2) {
        c.v *= imp > Math.abs(c.v) * 0.7 ? -0.25 : 0.6;
        if (c === player.car && imp > 8) { sfx('crash', imp); G.shake = 0.4; if (imp > 15 && c.hitT <= 0) { c.hp--; c.hitT = 0.7; if (c.hp <= 0) say('YOUR CAR IS BROKEN! RUN!', '#ff6b6b'); } }

  }
  for (let i = 0; i < cars.length; i++) for (let j = i + 1; j < cars.length; j++) hitCars(cars[i], cars[j]);

  }
  // the heist
  if (!G.over) {
    const inZone = !player.car && Math.hypot(player.x - G.target.x, player.z - G.target.z) < 2.8;
    if (inZone && G.rob < 1) {
      if (!G.alarm) { startAlarm(); say('ALARM! GRAB IT FAST!', '#ff6b6b'); }
      const before = Math.floor(G.rob * 20);
      G.rob = Math.min(1, G.rob + dt / lv.robTime);
      if (Math.floor(G.rob * 20) > before) { sfx('cash'); puff(G.target.x, 2.5, G.target.z, (Math.random() - 0.5) * 3, 4, (Math.random() - 0.5) * 3 - 2, lv.icon === 'gold' || lv.icon === 'coin' ? '#ffd23f' : lv.icon === 'diamond' ? '#7af0ff' : '#5ab04a', 0.9, 0.3); }
      if (G.rob >= MIN_LOOT && !G.minSaid) { G.minSaid = true; say('ENOUGH! STAY FOR MORE OR RUN TO THE HIDEOUT!', '#9be36b', 3.5); G.homeB.visible = true; }
      if (G.rob >= 1 && !G.fullSaid) { G.fullSaid = true; say('YOU GOT ALL OF IT! RUN!', '#9be36b'); G.beacon.visible = false; G.icon.visible = false; }
    } else if (player.car && Math.hypot(player.x - G.target.x, player.z - G.target.z) < 4 && G.rob < 1 && G.msgT <= 0) say('GET OUT OF THE CAR TO ROB IT', '#fff', 1.2);

      if (player.car && d < c.r + player.car.r + 1.2 && (Math.abs(player.car.v) < 1.5 || player.car.hp <= 0)) G.bustT += dt;
    }
    for (const g of guards) if (g.chase > 0 && g.stun <= 0 && !player.car && Math.hypot(g.x - player.x, g.z - player.z) < 1.2) caught = true;
    if (!player.car || Math.abs(player.car.v) >= 1.5) G.bustT = Math.max(0, G.bustT - dt * 0.5);

  }

}
function spawnCop() {

// The camera follows you from behind.
const cam = { yaw: 0, snap: true, pos: new THREE.Vector3(), orbit: 0 };
function updateCamera(dt) {

    const t = s / 12, x = e.x - Math.sin(cam.yaw) * dist * t, z = e.z - Math.cos(cam.yaw) * dist * t, r = solidAt(x, z);

}
function orbitCamera(dt) {

  camera.position.set(c + Math.sin(cam.orbit) * 175, 85, c + Math.cos(cam.orbit) * 175);
  camera.lookAt(c, 0, c);
}

// Move the models to where things are.
function syncModels(dt, now) {
  const flash = Math.floor(now / 250) % 2;

const bills = [];
function drawEscaped(now, dt) {
  const W = S.W, finale = state === 'win';
  if (finale) {                                                        // money rain
    if (bills.length < 60) bills.push({ x: Math.random() * W, y: -10, v: 30 + Math.random() * 40, s: Math.random() * 6 });
    for (const b of bills) { b.y += b.v * dt; b.s += dt * 4; if (b.y > H + 10) { b.y = -10; b.x = Math.random() * W; } ctx.fillStyle = '#1a5a1a'; ctx.fillRect(Math.round(b.x) - 1, Math.round(b.y) - 1, 12, Math.round(5 + Math.sin(b.s) * 2) + 2); ctx.fillStyle = '#5ab04a'; ctx.fillRect(Math.round(b.x), Math.round(b.y), 10, Math.round(5 + Math.sin(b.s) * 2)); }
  }
  if (G.overT < 0.6) return;
  const { y } = panel(280, finale ? 172 : 150);
  if (finale) {
    T('YOU DID IT!', W / 2, y + 10, '#ffd23f', 3, 'center');
    T('YOU ROBBED THE CITY BANK!', W / 2, y + 32, '#fff', 2, 'center');
    T(G.firstWin ? 'PIXEL HEIST COMPLETE! YOU ARE THE BEST THIEF IN TOWN.' : 'THE BANK IS EMPTY AGAIN!', W / 2, y + 48, '#9be36b', 1, 'center', null);
  } else {
    T('HEIST COMPLETE!', W / 2, y + 10, '#9be36b', 3, 'center');
    T(G.lv.name, W / 2, y + 32, '#fff', 2, 'center');
  }
  const r = y + (finale ? 62 : 50);
  T('LOOT  ' + money(G.loot), W / 2, r, '#9be36b', 2, 'center');
  T('TIME  ' + clock(G.t) + (G.newBest ? '  NEW BEST!' : ''), W / 2, r + 16, '#fff', 1, 'center', null);
  T('★ +' + G.stars, W / 2, r + 28, '#ffd23f', 2, 'center');
  const by = r + 48;
  if (!finale && UI.button('next', Math.round(W / 2 + 5), by, 125, 22, 'NEXT LEVEL', { accent: '#9be36b' })) { sfx('click'); openBrief(G.n + 1); }
  if (finale && UI.button('again', Math.round(W / 2 + 5), by, 125, 22, 'MENU', { accent: '#9be36b' })) toTitle();
  if (UI.button('elv', Math.round(W / 2 - 130), by, 125, 22, 'LEVELS') || UI.back) toTitle('levels');
}
function setPause(v) { if (state !== 'play') return; paused = v; Ctl.id = null; if (v) Music.play(null); else Music.play(G.copsOut ? 'chase' : 'sneak'); }
function toTitle(to = 'title') {
  clearLevel(); G = null; state = to; paused = false; bills.length = 0;
  setTime('dusk'); spawnTraffic(16, rngOf(3), { x: -999, z: -999 }); Music.play('menu');
}

/* --- input ----------------------------------------------------------------------- */
UI.onDown = (e, x, y) => {
  PX.Sound.unlock(); if (!Music.cur && state !== 'play') Music.play('menu');
  if (e.pointerType === 'touch') Ctl.show = true;
  if (state === 'play' && !paused && UI.downId === null && x < S.W * 0.55 && y > 70) { Ctl.id = e.pointerId; Ctl.ox = x; Ctl.oy = y; Ctl.dx = 0; Ctl.dy = 0; }
};
UI.onMove = (e, x, y) => { if (e.pointerId === Ctl.id) { Ctl.dx = x - Ctl.ox; Ctl.dy = y - Ctl.oy; } };
UI.onUp = e => { if (e.pointerId === Ctl.id) { Ctl.id = null; Ctl.dx = Ctl.dy = 0; } };
const KEYMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
window.addEventListener('keydown', e => {
  PX.Sound.unlock(); if (!Music.cur && state !== 'play') Music.play('menu');
  if (KEYMAP[e.code]) { keys[KEYMAP[e.code]] = true; e.preventDefault(); }
  if ((e.code === 'KeyE' || e.code === 'Enter' || e.code === 'Space') && state === 'play') { action(); e.preventDefault(); }
  if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'play') setPause(!paused);
  else if (e.code === 'Escape') UI.back = true;
  if (e.code === 'KeyM') { save.music = !save.music; store(); Music.bus(); }
});
window.addEventListener('keyup', e => { if (KEYMAP[e.code]) keys[KEYMAP[e.code]] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play') setPause(true); });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') setPause(true); });

/* --- 9. MAIN LOOP ---------------------------------------------------------------- */
const STEP = 1 / 60;
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  UI.begin();
  hctx.setTransform(1, 0, 0, 1, 0, 0); hctx.clearRect(0, 0, hud.width, hud.height);
  ctx.clearRect(0, 0, S.W, H);
  if (!renderer) {
    ctx.fillStyle = '#0d0b13'; ctx.fillRect(0, 0, S.W, H);
    T('SORRY, THIS DEVICE CAN\'T SHOW 3D GAMES.', S.W / 2, 100, '#fff', 1, 'center');
    if (UI.button('games', Math.round(S.W / 2 - 70), 130, 140, 24, '< ALL GAMES') || UI.back) location.href = './';
  } else if (G && (state === 'play' || state === 'busted' || state === 'escaped' || state === 'win')) {
    if (!paused) { acc += dt; while (acc >= STEP) { update(STEP); acc -= STEP; } } else acc = 0;
    syncModels(dt, now); updateCamera(dt);
    renderer.render(scene, camera);
    drawHUD(now);
    if (paused) drawPause();
    else if (state === 'busted') drawBusted(now);
    else if (state === 'escaped' || state === 'win') drawEscaped(now, dt);
  } else {
    acc += dt;
    while (acc >= STEP) { for (const c of cars) if (c.ai === 'traffic') trafficAI(c, STEP); for (const c of cars) pushOut(c, c.r); for (let i = 0; i < cars.length; i++) for (let j = i + 1; j < cars.length; j++) hitCars(cars[i], cars[j]); acc -= STEP; }
    syncModels(dt, now); orbitCamera(dt);
    renderer.render(scene, camera);
    if (state === 'title') drawTitle(now);
    else if (state === 'levels') drawLevels();
    else if (state === 'brief') drawBrief();
  }
  soundFrame(dt);
  UI.end();
  S.blit('rgba(0,0,0,0)');
  requestAnimationFrame(frame);
}
if (renderer) { buildCity(); toTitle(); }
requestAnimationFrame(frame);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => { /* offline mode unavailable */ }));
}
// for the tests
window.HEIST = { get G() { return G; }, get state() { return state; }, player, cars: () => cars, guards: () => guards, startLevel, update, action, keys, save, SPOTS, LEVELS, spawnCop, toTitle, openBrief, setPause, Ctl };
</script>
