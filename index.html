<!DOCTYPE html>
<html lang="en">
<head>

<meta name="description" content="Pixel Arcade: Mouse Thief, Pixel GP, Pixel Heist, Pixel Pong, Pixel Football, Pixel Hoops, Pixel Wings, Pixel Sky Run, Deep Catch, Pixel Skate, Pixel Ski, Pixel Box Fight, Pixel Bike Run, Pixel Cook, Pixel Runs, Pixel Sky GP and Pixel Moto. Pixel-art games to play alone or with a friend.">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Pixel Arcade</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0b13; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #screen { position: fixed; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
  #name, #search, #giveid { position: fixed; display: none; box-sizing: border-box; text-align: center; text-transform: uppercase;
          font: bold 24px ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.2em;
          color: #111; background: #fbf9f3; border: 3px solid #111; border-radius: 0; outline: none; }

</head>
<body>
<canvas id="screen"></canvas>
<input id="search" maxlength="20" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" inputmode="search" enterkeyhint="search" placeholder="TYPE A GAME..." aria-label="Search games">
<input id="giveid" maxlength="6" autocomplete="off" autocorrect="off" spellcheck="false" inputmode="numeric" aria-label="Your friend's ID">
<input id="name" maxlength="10" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" inputmode="text" aria-label="Your name">
<script src="common.js"></script>
<script>
'use strict';
/* PIXEL ARCADE: the dashboard. Pick a game, set your name and avatar (all the games use them). */
const VERSION = '2.31.1';
const canvas = document.getElementById('screen');
const S = PX.makeScreen(canvas, { H: 240, minW: 400, maxW: 560 });
const ctx = S.ctx, H = S.H;

const nameInput = document.getElementById('name');

searchInput.addEventListener('input', () => { searchInput.value = searchInput.value.toUpperCase().replace(/[^A-Z0-9 ]/g, '').slice(0, 20); search.q = searchInput.value; scrollTo(0); pad.focus = 0; });
nameInput.addEventListener('input', () => { nameInput.value = nameInput.value.toUpperCase().replace(/[^A-Z0-9 ]/g, '').slice(0, 10); });
window.addEventListener('keydown', e => {
  if (e.target === giveInput) { if (e.key === 'Enter') Give.send(); else if (e.key === 'Escape') Give.leave(); return; }
  if (e.target === nameInput) { if (e.key === 'Enter') saveProfile(); else if (e.key === 'Escape') { nameInput.blur(); screen = 'home'; } return; }
  if (e.target === searchInput) { if (e.key === 'Enter') searchInput.blur(); else if (e.key === 'Escape') closeSearch(); return; }
  if (e.key === 'Escape') UI.back = true;
  if (screen === 'gift') { if (e.key === 'Enter' || e.key === ' ') claimGift(); return; }
  if (screen === 'stars') { if (e.key === 'Enter' || e.key === ' ') claimStars(); return; }
  if (screen === 'home' && e.key === '/') { e.preventDefault(); openSearch(); return; }
  if (screen === 'home' || screen === 'search') {
    const step = { ArrowDown: 40, ArrowUp: -40, PageDown: 150, PageUp: -150 }[e.key];
    if (step) { e.preventDefault(); scroll.v = 0; scrollTo(scroll.y + step); }
    if (e.key === 'Home') scrollTo(0); else if (e.key === 'End') scrollTo(1e9);
  }
});
UI.onDown = (e, x, y) => {

};
const thiefIcon = new Image(); thiefIcon.src = 'icons/icon-192.png';

  { id: 'racer', name: 'PIXEL GP', sub: 'RACE CARS!', url: 'racer.html', color: '#2a7fd4', cats: ['RACING', 'ONLINE'], tags: 'CAR CARS DRIVE F1 FORMULA GRAND PRIX' },
  { id: 'heist', name: 'PIXEL HEIST', sub: 'ROB THE BANK!', url: 'heist.html', color: '#ffd23f', cats: ['ACTION', 'RACING'], tags: 'POLICE ROBBER CITY 3D CAR' },

  { id: 'hoops', name: 'PIXEL HOOPS', sub: 'SHOOT BASKETS!', url: 'hoops.html', color: '#ff8a2a', cats: ['SPORTS'], tags: 'BASKETBALL BALL BASKET' },

  { id: 'ski', name: 'PIXEL SKI', sub: 'SKI DOWN, DON\'T CRASH!', url: 'ski.html', color: '#7ad8ff', cats: ['RACING', 'SPORTS'], tags: 'SKI SKIING SNOW WINTER MOUNTAIN SLOPE DOWNHILL GREEN RED BLACK' },

  { id: 'moto', name: 'PIXEL MOTO', sub: 'MOTOCROSS: FLIP AND TRICK!', url: 'moto.html', color: '#e8303a', cats: ['RACING', 'SPORTS', 'ONLINE'], tags: 'MOTO MOTORBIKE MOTORCYCLE MOTOCROSS DIRT BIKE ENGINE FLIP BACKFLIP SUPERMAN WHEELIE TRICK TRICKS DESERT MONEY' },
];
// --- search: type a name, or pick a category -----------------------------------------------
const CATEGORIES = ['ALL', 'ACTION', 'RACING', 'SPORTS', 'RUNNING', 'PLANES', 'ONLINE', '2 PLAYERS'];
const search = { q: '', cat: 'ALL' };
function matches(g) {
  if (search.cat !== 'ALL' && !g.cats.includes(search.cat)) return false;
  const words = search.q.trim().split(/\s+/).filter(Boolean), hay = [g.name, g.sub, g.tags, ...g.cats].join(' ');
  return words.every(w => hay.includes(w));
}
function shown() { return screen === 'search' ? GAMES.filter(matches) : GAMES; }
function openSearch() { screen = 'search'; scroll.y = 0; scroll.v = 0; pad.focus = 0; searchInput.value = search.q; PX.Sound.tone(660, 0.05, { vol: 0.06 }); if (!pad.used) setTimeout(() => searchInput.focus(), 0); }
function closeSearch() { searchInput.blur(); screen = 'home'; scroll.y = 0; scroll.v = 0; pad.focus = 0; }
function magnifier(cx, cy, s, color = '#fff') { PX.drawIcon(ctx, ['.###..', '#...#.', '#...#.', '#...#.', '.####.', '....##', '.....#'], { '#': color }, cx, cy, s); }
let installPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => { /* offline mode unavailable */ }));
}
function play(g) { PX.Sound.tone([523, 784], 0.15, { vol: 0.12 }); setTimeout(() => { location.href = g.url; }, 120); }

// --- background: a slowly scrolling pixel starfield and floor grid ------------------------------
function background(t) {
  const W = S.W;
  ctx.fillStyle = '#0d0b13'; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 70; i++) {
    const x = ((i * 73.7 + t * (6 + (i % 3) * 6)) % (W + 10)) - 5, y = (i * 37.3) % 150;
    ctx.fillStyle = i % 5 ? '#4a4068' : '#efe9ff'; ctx.fillRect(Math.round(W - x), Math.round(y), 1, 1);
  }
  ctx.fillStyle = '#1d1830'; ctx.fillRect(0, 150, W, H - 150);
  ctx.fillStyle = '#3a2f5c';
  for (let k = 0; k < 8; k++) { const y = 150 + Math.round(Math.pow((k + (t * 0.6) % 1) / 8, 2) * (H - 150)); ctx.fillRect(0, y, W, 1); }
  for (let k = -10; k <= 10; k++) { const x0 = W / 2 + k * 14, x1 = W / 2 + k * 70; ctx.beginPath(); ctx.moveTo(x0, 150); ctx.lineTo(x1, H); ctx.strokeStyle = '#3a2f5c'; ctx.stroke(); }
}
// --- little animated previews on the game cards -----------------------------------------
function previewThief(x, y, w, h, t) {
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.fillStyle = '#140f24'; ctx.fillRect(x, y, w, h);
  for (let i = 0; i < 14; i++) { ctx.fillStyle = i % 4 ? '#6a5f90' : '#ffffff'; ctx.fillRect(x + (i * 37) % w, y + 4 + (i * 13) % (h - 26), 1, 1); }
  ctx.fillStyle = '#f3e9c8'; ctx.fillRect(x + w - 22, y + 6, 10, 10); ctx.fillRect(x + w - 23, y + 8, 12, 6);   // moon
  const sc = (t * 40) % 30;
  ctx.fillStyle = '#2a2240';                                               // far buildings
  for (let i = -1; i < 7; i++) { const bh = 14 + ((i + Math.floor(t * 40 / 30)) * 7) % 16; ctx.fillRect(Math.round(x + i * 30 - sc), y + h - 14 - bh, 24, bh); }
  ctx.fillStyle = '#e9c46a';
  for (let i = -1; i < 7; i++) ctx.fillRect(Math.round(x + i * 30 - sc + 6), y + h - 24, 2, 3);
  ctx.fillStyle = '#0d0b13'; ctx.fillRect(x, y + h - 14, w, 14); ctx.fillStyle = '#8070b0'; ctx.fillRect(x, y + h - 14, w, 1);
  const g = y + h - 14, leg = Math.floor(t * 12) % 2;
  // the thief, with the mouse on his head
  const tx = Math.round(x + w * 0.62), ty = g - 14 - (leg ? 1 : 0);
  ctx.fillStyle = '#8b7fb0'; ctx.fillRect(tx - 1, ty - 1, 9, 13);
  ctx.fillStyle = '#000'; ctx.fillRect(tx, ty, 7, 11); ctx.fillRect(tx + (leg ? 0 : 1), ty + 11, 2, 3); ctx.fillRect(tx + (leg ? 5 : 4), ty + 11, 2, 3);
  ctx.fillStyle = '#ff2424'; ctx.fillRect(tx + 3, ty + 3, 1, 2); ctx.fillRect(tx + 5, ty + 3, 1, 2);
  ctx.fillStyle = '#9b9b9b'; ctx.fillRect(tx + 1, ty - 4, 6, 3); ctx.fillStyle = '#e7a3ad'; ctx.fillRect(tx + 5, ty - 5, 2, 1);
  // the cat, right behind him
  const cx = Math.round(x + w * 0.18 + Math.sin(t * 2) * 4), cy = g - 12;
  ctx.fillStyle = '#8b7fb0'; ctx.fillRect(cx - 1, cy + 1, 24, 10);
  ctx.fillStyle = '#000';
  ctx.fillRect(cx, cy + 3, 16, 6); ctx.fillRect(cx + 14, cy, 8, 7); ctx.fillRect(cx + 14, cy - 2, 2, 2); ctx.fillRect(cx + 20, cy - 2, 2, 2);
  ctx.fillRect(cx - 4, cy + 1, 4, 2); ctx.fillRect(cx - 5, cy - 2, 2, 4);
  ctx.fillRect(cx + 1 + leg * 2, cy + 9, 2, 3); ctx.fillRect(cx + 11 - leg * 2, cy + 9, 2, 3);
  ctx.fillStyle = '#ff3b3b'; ctx.fillRect(cx + 16, cy + 2, 2, 2); ctx.fillRect(cx + 19, cy + 2, 2, 2);
  ctx.restore();
}
function previewRacer(x, y, w, h, t) {
  ctx.fillStyle = '#7ec4ec'; ctx.fillRect(x, y, w, h / 2);
  ctx.fillStyle = '#3fae4a'; ctx.fillRect(x, y + h / 2, w, h / 2);
  const hz = y + h / 2, cx = x + w / 2;
  for (let r = 0; r < h / 2; r++) {                              // road with moving stripes
    const k = r / (h / 2), half = 4 + k * w * 0.45, yy = hz + r;
    const stripe = Math.floor((1 / (k + 0.05)) * 3 - t * 12) % 2;
    ctx.fillStyle = stripe ? '#e01e1e' : '#f4f4f4'; ctx.fillRect(Math.round(cx - half - 3 - k * 4), yy, Math.round(3 + k * 4), 1); ctx.fillRect(Math.round(cx + half), yy, Math.round(3 + k * 4), 1);
    ctx.fillStyle = stripe ? '#6b6b73' : '#64646c'; ctx.fillRect(Math.round(cx - half), yy, Math.round(half * 2), 1);
  }
  const cw = 34, ch = 16, carX = Math.round(cx - cw / 2 + Math.sin(t * 1.5) * 10), carY = y + h - ch - 2;   // a little race car
  ctx.fillStyle = '#111'; ctx.fillRect(carX, carY + 5, 7, 11); ctx.fillRect(carX + cw - 7, carY + 5, 7, 11);
  ctx.fillStyle = PX.AVATAR_COLORS[profile.avatar.color]; ctx.fillRect(carX + 9, carY + 6, 16, 8);
  ctx.fillStyle = '#ffd23f'; ctx.fillRect(carX + 15, carY + 3, 4, 3);
  ctx.fillStyle = '#16161c'; ctx.fillRect(carX + 3, carY, 28, 3); ctx.fillStyle = PX.AVATAR_COLORS[profile.avatar.color]; ctx.fillRect(carX + 3, carY, 28, 1);
}
function previewSkyGP(x, y, w, h, t) {            // a flying car over the skyway at dusk, a boost ring comes closer
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ['#2b1a5e', '#5a2a78', '#a8487a', '#ff9a6a'].forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(x, y + i * 7, w, 8); });
  const hz = y + 26, cx = x + w / 2;
  ctx.fillStyle = '#fff0c0'; ctx.fillRect(x + w - 30, hz - 12, 8, 8);
  for (let i = 0; i < 9; i++) { const bh = 6 + (i * 37) % 14; ctx.fillStyle = i % 2 ? '#4a2a68' : '#6a3a80'; ctx.fillRect(x + i * 14 - 3, hz - bh, 10, bh); }
  for (let r = 0; r < h - 26; r++) {                             // the sea of clouds and the skyway, with moving stripes
    const k = r / (h - 26), half = 3 + k * w * 0.42, yy = hz + r, stripe = Math.floor((1 / (k + 0.05)) * 3 - t * 12) % 2;
    ctx.fillStyle = stripe ? '#f2bcc6' : '#e8acbc'; ctx.fillRect(x, yy, w, 1);
    ctx.fillStyle = stripe ? '#2ad4c4' : '#f4f4f4'; ctx.fillRect(Math.round(cx - half - 2 - k * 3), yy, Math.round(half * 2 + 4 + k * 6), 1);
    ctx.fillStyle = stripe ? '#2c315e' : '#272b54'; ctx.fillRect(Math.round(cx - half), yy, Math.round(half * 2), 1);
  }
  const rk = (t * 0.7) % 1, rw = 6 + rk * 40, rh = rw * 0.66, rx = cx + 14 - rk * 6, ry = hz + 2 + rk * 14;     // the ring
  if (rk < 0.85) { ctx.fillStyle = '#ffd23f'; ctx.fillRect(Math.round(rx - rw / 2), Math.round(ry - rh / 2), Math.round(rw), 2); ctx.fillRect(Math.round(rx - rw / 2), Math.round(ry + rh / 2) - 2, Math.round(rw), 2); ctx.fillRect(Math.round(rx - rw / 2), Math.round(ry - rh / 2), 2, Math.round(rh)); ctx.fillRect(Math.round(rx + rw / 2) - 2, Math.round(ry - rh / 2), 2, Math.round(rh)); }
  const cw = 34, bob = Math.sin(t * 2) * 6, carX = Math.round(cx - cw / 2 + Math.sin(t * 1.5) * 8), carY = Math.round(y + h - 28 + bob), col = PX.AVATAR_COLORS[profile.avatar.color];
  ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(carX + 5, y + h - 4, cw - 10, 2);                          // its shadow, then the car
  ctx.fillStyle = '#16161c'; ctx.fillRect(carX, carY + 8, 8, 5); ctx.fillRect(carX + cw - 8, carY + 8, 8, 5); ctx.fillRect(carX + 8, carY, 2, 8); ctx.fillRect(carX + cw - 10, carY, 2, 8);
  ctx.fillStyle = '#b8f8ff'; ctx.fillRect(carX + 1, carY + 13, 6, 2 + Math.floor(t * 12) % 2); ctx.fillRect(carX + cw - 7, carY + 13, 6, 2 + Math.floor(t * 12) % 2);
  ctx.fillStyle = col; ctx.fillRect(carX + 9, carY + 6, 16, 8); ctx.fillRect(carX + 7, carY + 9, 20, 3);
  ctx.fillStyle = '#7ad8ff'; ctx.fillRect(carX + 12, carY + 2, 10, 5); ctx.fillStyle = '#ffd23f'; ctx.fillRect(carX + 15, carY + 3, 4, 3);
  ctx.fillStyle = '#ff8a1f'; ctx.fillRect(carX + 11, carY + 10, 3, 2); ctx.fillRect(carX + 20, carY + 10, 3, 2);
  ctx.restore();
}
function previewMoto(x, y, w, h, t) {             // a motorbike jumps over desert hills, the rider flies behind the bars
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ['#3a6ab8', '#8a8ab0', '#f0a868', '#ffd8a0'].forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(x, y + i * 9, w, 10); });
  ctx.fillStyle = '#fff6d0'; ctx.fillRect(x + w - 30, y + 16, 9, 9);
  ctx.fillStyle = '#c47a50'; for (let q = 0; q < w; q += 22) ctx.fillRect(x + q - Math.floor(t * 4) % 22, y + 30 - ((q / 22) % 3) * 4, 16, h);
  const gy = q => y + h - 12 - Math.sin((q + t * 60) * 0.045) * 6;
  ctx.fillStyle = '#3a1c14'; for (let q = 0; q < w; q++) ctx.fillRect(x + q, Math.round(gy(q)), 1, h);
  ctx.fillStyle = '#c4683a'; for (let q = 0; q < w; q++) ctx.fillRect(x + q, Math.round(gy(q)), 1, 1);
  const ph = (t * 0.6) % 1, air = Math.sin(ph * Math.PI) * 26, bx = Math.round(x + w * 0.42), by = Math.round(gy(w * 0.42) - 6 - air), fly = ph > 0.25 && ph < 0.75;
  ctx.translate(bx, by); ctx.rotate(-0.25 + ph * 0.5);
  ctx.fillStyle = '#0a0a10'; ctx.fillRect(-13, 0, 8, 8); ctx.fillRect(7, 0, 8, 8); ctx.fillStyle = '#5a5a6a'; ctx.fillRect(-10, 3, 2, 2); ctx.fillRect(10, 3, 2, 2);
  ctx.fillStyle = '#2a2a33'; ctx.fillRect(-5, 0, 9, 5); ctx.fillStyle = '#e8303a'; ctx.fillRect(-9, -4, 16, 4); ctx.fillRect(-14, -5, 6, 2); ctx.fillStyle = '#c8c8d0'; ctx.fillRect(6, -9, 2, 10);
  ctx.fillStyle = PX.AVATAR_COLORS[profile.avatar.color];
  if (fly) { ctx.fillRect(-18, -13, 22, 4); ctx.fillStyle = '#2a2f4a'; ctx.fillRect(-28, -13, 10, 3); ctx.fillStyle = '#ffd23f'; ctx.fillRect(3, -16, 6, 6); }
  else { ctx.fillRect(-3, -13, 4, 9); ctx.fillRect(0, -11, 7, 2); ctx.fillStyle = '#2a2f4a'; ctx.fillRect(-3, -5, 5, 6); ctx.fillStyle = '#ffd23f'; ctx.fillRect(-3, -19, 6, 6); }
  ctx.restore();
}
function previewHeist(x, y, w, h, t) {
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.fillStyle = '#14123a'; ctx.fillRect(x, y, w, h);                     // night
  for (let i = 0; i < 8; i++) {                                           // the city, with lit windows
    const bx = x + i * 18 - 4, bh = 18 + (i * 37) % 22, by = y + h - 14 - bh;
    ctx.fillStyle = i % 2 ? '#2a2850' : '#33305e'; ctx.fillRect(bx, by, 16, bh);
    for (let r = 0; r < bh - 4; r += 5) for (let c = 2; c < 14; c += 4) if ((i * 7 + r * 3 + c) % 5 < 3) { ctx.fillStyle = '#ffcf70'; ctx.fillRect(bx + c, by + 3 + r, 2, 2); }
  }
  const bkx = Math.round(x + w / 2 - 22), bky = y + h - 36;                // the bank

// --- swiping through the games -----------------------------------------------------------
const CARD_H = 140;
const scroll = { y: 0, v: 0, drag: null, bar: false };
function layout() {

  const avail = W - 16 - slider, cols = Math.max(2, Math.floor((avail + gap) / (116 + gap)));
  let top = 66;

    let x = 8, y = 36; for (const c of CATEGORIES) { const w = PX.textWidth(c, 1) + 12; if (x + w > W - 8) { x = 8; y += 18; } x += w + 4; }
    top = y + 20;
  }
  const n = shown().length, cw = Math.min(150, Math.floor((avail - gap * (cols - 1)) / cols)), rows = Math.ceil(n / cols);
  const view = bottom - top, content = rows ? pad * 2 + rows * CARD_H + (rows - 1) * gap : 0;
  return { top, bottom, gap, pad, cols, cw, cx: 8 + avail / 2, view, max: Math.max(0, content - view) };
}
function scrollTo(y) { const m = layout().max; scroll.y = Math.max(0, Math.min(m, y)); }

function scrollStep(dt) {

  const before = scroll.y; scrollTo(scroll.y + scroll.v * dt);
  if (scroll.y === before) scroll.v = 0;
  scroll.v *= Math.exp(-4 * dt);
}
UI.onMove = (e, x, y) => {
  if (screen !== 'home' && screen !== 'search') return;
  if (scroll.bar) { barTo(y); return; }
  const d = scroll.drag; if (!d || d.id !== e.pointerId) return;
  const now = performance.now(), dy = y - d.last, dt = Math.max(1, now - d.t) / 1000;
  scrollTo(scroll.y - dy);
  scroll.v = scroll.v * 0.3 + (-dy / dt) * 0.7;
  d.moved += Math.abs(dy); d.last = y; d.t = now;
  if (d.moved > 6) UI.downId = null;               // a swipe, not a tap: don't press the button under the finger
};
UI.onUp = e => {
  if (scroll.drag && scroll.drag.id === e.pointerId) { if (performance.now() - scroll.drag.t > 80) scroll.v = 0; scroll.drag = null; }
  scroll.bar = false;
};

const pad = { used: false, focus: 0, prev: [], navT: 0 };

function cardBox(i) {
  const L = layout(), n = shown().length, r = Math.floor(i / L.cols), c = i % L.cols, inRow = Math.min(L.cols, n - r * L.cols);
  const x = Math.round(L.cx - (L.cw * inRow + L.gap * (inRow - 1)) / 2) + c * (L.cw + L.gap), y = L.pad + r * (CARD_H + L.gap);

}
function padFocus(i) {

  if (b.y - scroll.y < 0) scrollTo(b.y - L.pad); else if (b.y + CARD_H - scroll.y > L.view) scrollTo(b.y + CARD_H + L.pad - L.view);

}
function padPoll(dt) {
  let gps = [];
  try { gps = navigator.getGamepads ? [...navigator.getGamepads()].filter(g => g && g.connected) : []; } catch (e) { gps = []; }
  gps.slice(0, 4).forEach((gp, n) => {
    const now = {}; for (const i of [0, 1, 2, 3, 4, 5, 9, 12, 13, 14, 15]) now[i] = !!(gp.buttons[i] && gp.buttons[i].pressed);
    const prev = pad.prev[n] || {}, edge = i => now[i] && !prev[i];
    let ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    if (now[14]) ax = -1; if (now[15]) ax = 1; if (now[12]) ay = -1; if (now[13]) ay = 1;
    const any = Math.hypot(ax, ay) > 0.5 || Object.values(now).some(Boolean);
    if (any && !pad.used) { pad.used = true; PX.Sound.unlock(); padFocus(pad.focus); }
    if (screen === 'home' || screen === 'search') {
      const cols = layout().cols, list = shown();

          pad.navT = pad.navT < -1 ? 0.35 : 0.22;

        }

      const ry = gp.axes[3] || 0; if (Math.abs(ry) > 0.25) { scroll.v = 0; scrollTo(scroll.y + ry * 300 * dt); }

      if (screen === 'search' && edge(1)) closeSearch();
      else if (screen === 'home' && edge(2)) openSearch();
      else if (screen === 'home' && edge(5)) openRemote();
      else if (screen === 'home' && edge(3)) openSettings();
      if (screen === 'search') {                  // LB / RB: the previous / next category
        const k = edge(4) ? -1 : edge(5) ? 1 : 0;
        if (k) { search.cat = CATEGORIES[(CATEGORIES.indexOf(search.cat) + k + CATEGORIES.length) % CATEGORIES.length]; scrollTo(0); padFocus(0); }
      }

    else if (screen === 'gift' && (edge(0) || edge(1) || edge(9))) claimGift();
    else if (screen === 'stars' && (edge(0) || edge(9))) claimStars();
    else if (edge(1)) UI.back = true;
    else if (screen === 'remote' && edge(0)) { if (PX.Remote.active()) screen = 'home'; else PX.Remote.start(); }

  });
}

  try { g.left = !localStorage.getItem(g.key); if (g.less && localStorage.getItem(g.less[0])) g.stars -= g.less[1]; } catch (e) { /* private mode: no gift, it couldn't be remembered */ }
}
const starGiftDue = () => Inbox.list[0] || STAR_GIFTS.find(g => g.left && (!g.names || g.names.includes(PX.cleanName(profile.name))) &&
                                               (!g.until || Date.now() < new Date(g.until[0], g.until[1] - 1, g.until[2] + 1).getTime()));
function claimStars(take = true) {                 // THANKS! takes the gift; NO THANKS turns it down for good
  const g = starGiftDue();
  if (g && g.relay) {                               // from a friend: THANKS! takes the stars, NO THANKS sends them back
    if (g.sending) return;
    if (!take && !g.back) { Inbox.giveBack(g); return; }
    if (Inbox.done(g)) { PX.Wallet.add(g.stars); PX.Sound.unlock(); PX.Sound.tone([523, 659, 784, 1047, 1319], 0.5, { vol: 0.12 }); }
    screen = 'home'; return;
  }
  if (g && !take) { try { localStorage.setItem(g.key, 'NO'); } catch (e) { /* private mode */ } g.left = false; PX.Sound.unlock(); PX.Sound.tone(300, 0.12, { vol: 0.08 }); }
  else if (g) {
    try { localStorage.setItem(g.key, PX.cleanName(profile.name) || '1'); if (localStorage.getItem(g.key)) PX.Wallet.add(g.stars); } catch (e) { /* couldn't remember it: no stars, or they'd come every time */ }
    g.left = false; PX.Sound.unlock(); PX.Sound.tone([523, 659, 784, 1047, 1319], 0.5, { vol: 0.12 });
  }
  screen = 'home';                                  // (the next gift, if there is one, pops up right after)
}
function drawStars(t) {
  const W = S.W, g = starGiftDue();
  drawHome(t);
  if (!g) { screen = 'home'; return; }
  UI.list = [];                                     // only THANKS! and NO THANKS can be pressed while the gift is up
  ctx.fillStyle = 'rgba(13,11,19,0.6)'; ctx.fillRect(0, 0, W, H);
  const pw = Math.min(300, W - 30), x = Math.round(W / 2 - pw / 2), y = 48, ph = 150;
  ctx.fillStyle = '#ffd23f'; ctx.fillRect(x - 2, y - 2, pw + 4, ph + 4); ctx.fillStyle = '#16121f'; ctx.fillRect(x, y, pw, ph);
  for (let i = 0; i < 14; i++) T('★', x + 10 + (i * 67) % (pw - 24), y + 6 + ((i * 41 + Math.floor(t * 30)) % (ph - 16)), i % 2 ? '#7a5a10' : '#b8901a', 1);
  T('A GIFT FOR', W / 2, y + 12, '#efe9ff', 2, 'center', '#000');
  PX.drawAvatar(ctx, profile.avatar, Math.round(W / 2 - PX.textWidth(profile.name, 3) / 2 - 38), y + 30, 2);
  T(profile.name, W / 2 + 16, y + 36, '#fff', 3, 'center', '#000');
  T('★ ' + g.stars, W / 2, y + 68, '#ffd23f', 6, 'center', '#3a2f5c');
  if (g.note) T(g.note, W / 2, y + 104, '#efe9ff', 1, 'center', '#000');
  if (UI.button('okay', Math.round(W / 2 - (g.back ? 60 : 124)), y + 116, 120, 24, g.back ? 'OKAY' : pad.used ? 'A: THANKS!' : 'THANKS!', { accent: '#ffd23f', disabled: !!g.sending })) claimStars();
  if (!g.back && UI.button('nogift', Math.round(W / 2 + 4), y + 116, 120, 24, g.sending ? 'SENDING BACK...' : 'NO THANKS', { size: 1, disabled: !!g.sending })) claimStars(false);   // (only the button: Escape can't throw a gift away by accident)
}

// --- GIVE STARS: send some of your own stars to a friend, by their ID -----------------------------------------
// The arcade has no server of its own, and the stars live on each phone. So a gift waits on ntfy.sh, a free public
// message service: your phone posts "N stars for this ID" there, and the arcade of the player with that ID asks for
// its messages when it is opened (and once a minute after that) and shows a popup. ntfy.sh keeps a message for about
// 12 hours: a gift nobody picks up in that time is lost. What goes through ntfy.sh: the two IDs, your name, the amount.
// (Anyone who knows how can post there too, so this is for friends, not a bank.)
const RELAY = 'https://ntfy.sh/', relayTopic = id => 'pixel-arcade-stars-' + id;
const giveInput = document.getElementById('giveid');
giveInput.addEventListener('input', () => { giveInput.value = giveInput.value.replace(/[^0-9]/g, '').slice(0, 6); });
const GIVE_AMOUNTS = [10, 50, 100, 500, 1000];
const Give = {
  msg: '', col: '#9a92b8', amount: 50, busy: false,
  say(m, col = '#9a92b8') { this.msg = m; this.col = col; },
  fail(m) { this.busy = false; this.say(m, '#ff8a8a'); PX.Sound.tone(150, 0.2); },
  open() { screen = 'give'; giveInput.value = ''; PX.Sound.unlock(); this.say('YOUR FRIEND GETS A POPUP THE NEXT TIME THEY OPEN THE ARCADE.'); },
  leave() { giveInput.blur(); screen = 'home'; },
  check() {                                          // what is wrong with what you typed, if anything
    const id = giveInput.value;
    if (!/^[1-9][0-9]{5}$/.test(id)) return "TYPE THE 6 DIGITS OF YOUR FRIEND'S ID.";
    if (id === profile.id) return "THAT'S YOUR OWN ID!";
    if (PX.Wallet.get() < this.amount) return "YOU DON'T HAVE ★" + this.amount + '.';
    return '';
  },
  async send() {
    if (this.busy) return;
    const bad = this.check(); if (bad) return this.fail(bad);
    const id = giveInput.value, n = this.amount;
    if (!PX.Wallet.spend(n)) return this.fail("YOU DON'T HAVE ★" + n + '.');        // the stars leave your wallet now (and come back if sending fails)
    this.busy = true; giveInput.blur(); this.say('SENDING...');
    try {
      const gift = { v: 1, tx: Date.now().toString(36) + Math.random().toString(36).slice(2, 10), n, from: profile.name, fid: profile.id };
      const res = await fetch(RELAY + relayTopic(id), { method: 'POST', body: JSON.stringify(gift) });
      if (!res.ok) throw new Error('relay ' + res.status);
      this.busy = false; giveInput.value = '';
      this.say('★' + n + ' SENT TO ' + id + '! IT WAITS 12 HOURS FOR THEM TO OPEN THE ARCADE.', '#5ad43f'); PX.Sound.tone([523, 659, 784, 1047], 0.35, { vol: 0.12 });
    } catch (e) {
      const d = PX.Wallet.read(); d.points = (d.points | 0) + n; PX.Wallet.write(d);       // back in your wallet
      this.fail("COULDN'T SEND IT. CHECK YOUR INTERNET AND TRY AGAIN.");
    }
  },
};
// gifts that are waiting for you: asked for when the arcade opens, then once a minute while you look at the games
const Inbox = {
  KEY: 'pixelArcade.giftsSeen', list: [], last: -1e9,
  seen() { try { const a = JSON.parse(localStorage.getItem(this.KEY)); return Array.isArray(a) ? a : []; } catch (e) { return []; } },
  done(g) {                                          // remember a gift you took or turned down, so it never comes twice
    this.list = this.list.filter(x => x.tx !== g.tx);
    try { localStorage.setItem(this.KEY, JSON.stringify([...this.seen(), g.tx].slice(-300))); return this.seen().includes(g.tx); } catch (e) { return false; }
  },
  async check() {
    this.last = performance.now();
    try {
      const res = await fetch(RELAY + relayTopic(profile.id) + '/json?poll=1&since=all', { cache: 'no-store' });
      if (!res.ok) return;
      const seen = this.seen();
      for (const row of (await res.text()).split('\n')) {
        let m = null;
        try { const ev = JSON.parse(row); if (ev.event === 'message') m = JSON.parse(ev.message); } catch (e) { /* not a gift */ }
        if (!m || m.v !== 1 || !Number.isInteger(m.n) || m.n < 1 || m.n > 1000 || typeof m.tx !== 'string' || !m.tx || m.tx.length > 40) continue;
        if (seen.includes(m.tx) || this.list.some(x => x.tx === m.tx)) continue;
        const who = PX.cleanName(m.from) || 'A FRIEND';
        this.list.push({ relay: true, tx: m.tx, stars: m.n, fid: /^[1-9][0-9]{5}$/.test(m.fid) ? m.fid : '', back: m.back === true,
                         note: m.back === true ? who + ' SAID NO THANKS: YOUR STARS ARE BACK' : 'FROM ' + who });
      }
    } catch (e) { /* offline: next time */ }
  },
  // NO THANKS to a friend's gift: the stars go back to the friend, as a gift the same way (so it waits 12 hours too)
  async giveBack(g) {
    if (g.sending) return;
    if (!g.fid || g.fid === profile.id) { this.done(g); screen = 'home'; return; }       // nobody to send them back to
    g.sending = true;
    try {
      const res = await fetch(RELAY + relayTopic(g.fid), { method: 'POST', body: JSON.stringify({ v: 1, tx: 'b' + g.tx.slice(0, 38), n: g.stars, from: profile.name, fid: profile.id, back: true }) });
      if (!res.ok) throw new Error('relay ' + res.status);
      this.done(g); PX.Sound.tone(300, 0.12, { vol: 0.08 }); if (screen === 'stars') screen = 'home';
    } catch (e) { g.sending = false; g.note = "COULDN'T SEND THEM BACK. CHECK YOUR INTERNET."; PX.Sound.tone(150, 0.2); }
  },
};
function drawGive(t) {
  const W = S.W, cx = Math.round(W / 2);
  background(t);
  T('GIVE STARS', cx, 8, '#fff', 3, 'center', '#000');
  T('★ ' + PX.Wallet.get(), W - 8, 10, '#ffd23f', 2, 'right', '#000');
  T('YOUR ID', cx, 32, '#9a92b8', 1, 'center', '#000');
  T(profile.id, cx, 42, '#ffd23f', 4, 'center', '#000');
  T("TYPE YOUR FRIEND'S ID:", cx, 72, '#efe9ff', 1, 'center', '#000');
  S.placeInput(giveInput, cx - 70, 84, 140, 28);
  const cw = 54, x0 = Math.round(cx - (GIVE_AMOUNTS.length * (cw + 6) - 6) / 2);
  GIVE_AMOUNTS.forEach((n, i) => { if (UI.button('amt' + n, x0 + i * (cw + 6), 120, cw, 20, '★' + n, { size: 1, on: Give.amount === n, accent: '#ffd23f', disabled: PX.Wallet.get() < n })) Give.amount = n; });
  const bad = Give.check(), busy = Give.busy;
  if (UI.button('send', cx - 100, 148, 200, 24, busy ? 'SENDING...' : 'GIVE ★' + Give.amount + (bad ? '' : ' TO ' + giveInput.value), { accent: '#5ad43f', disabled: busy || !!bad })) Give.send();
  T(Give.msg, cx, 180, Give.col, 1, 'center', '#000');
  T('THE STARS COME OUT OF YOUR WALLET.', cx, 192, '#5b5275', 1, 'center', '#000');
  if (UI.button('gback', cx - 50, 208, 100, 22, 'BACK', { disabled: busy }) || (UI.back && !busy)) Give.leave();
}

let t0 = performance.now(), tPrev = t0;
function frame(now) {
  const t = (now - t0) / 1000;
  padPoll(Math.min(0.05, (now - tPrev) / 1000));
  scrollStep(Math.min(0.05, (now - tPrev) / 1000)); tPrev = now;
  UI.begin();
  if (screen === 'home' && performance.now() - Inbox.last > 60000) Inbox.check();
  if (screen === 'home' && starGiftDue()) screen = 'stars';
  if (screen === 'gift') drawGift(t); else if (screen === 'stars') drawStars(t); else if (screen === 'give') drawGive(t); else if (screen === 'home') drawHome(t); else if (screen === 'search') drawSearch(t); else if (screen === 'remote') drawRemote(t); else if (screen === 'settings') drawSettings(t); else drawProfile(t);
  if (screen !== 'profile') nameInput.style.display = 'none';
  if (screen !== 'give') giveInput.style.display = 'none';
  if (screen !== 'search') searchInput.style.display = 'none';
  UI.end();
  S.blit('#0d0b13');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
PX.Pad.setup({                                     // the arcade reads the controller itself (PX.Pad only moves between the SETTINGS buttons)
  title: 'Pixel Arcade: controller', menu: () => screen === 'settings', ui: UI,
  phone: { stick: 'PICK A GAME', dpad: true, buttons: [['A', 'PLAY'], ['X', 'SEARCH'], ['Y', 'SETTINGS'], ['B', 'BACK']] },
  help: [['STICK|D-PAD', 'PICK A GAME'], ['A', 'PLAY IT'], ['R-STICK', 'SCROLL'], ['X', 'SEARCH'], ['Y', 'SETTINGS'], ['LB|RB', 'SEARCH: CATEGORY'], ['RB', 'PHONE CONTROLLERS'], ['B', 'SEARCH: BACK']],
});
</script>
</body>
</html>
