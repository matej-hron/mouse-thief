<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Pixel Quest: Utopený zvon. Dobrodružství pro 1 až 4 hrdiny na jednom telefonu, ve 3D.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0b13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Pixel Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,700;0,800;1,400&family=Alegreya+Sans:wght@500;700;800&display=swap">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0b13; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
         color: #ece3d0; font: 500 15px/1.3 'Alegreya Sans', system-ui, sans-serif; }
  :root { --ink: #ece3d0; --muted: #a99fc4; --gold: #ffd23f; --good: #8ff08f; --bad: #ff8a78; --line: #3a2f52; --panel: rgba(27,22,40,.86);
          --sl: env(safe-area-inset-left); --sr: env(safe-area-inset-right); --st: env(safe-area-inset-top); --sb: env(safe-area-inset-bottom); }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .layer { position: fixed; inset: 0; pointer-events: none; }
  .layer > * { pointer-events: auto; }
  [hidden] { display: none !important; }

  /* --- buttons (the same everywhere) --- */
  .ch { display: flex; align-items: center; gap: 9px; text-align: left; padding: 8px 12px; min-height: 42px; box-sizing: border-box;
        background: linear-gradient(#2e2648, #241d3a); border: 1px solid #4a3e70; border-bottom: 3px solid #8a7ad8; border-radius: 8px;
        font-weight: 700; font-size: 16px; transition: background .1s, transform .05s; }
  .ch:hover { background: #3a2f5c; } .ch:active { transform: translateY(1px); }
  .ch kbd { flex: none; min-width: 20px; height: 20px; line-height: 20px; text-align: center; border-radius: 4px; background: #0b0912; color: var(--muted); font: 700 12px system-ui, sans-serif; }
  .ch .ic { flex: none; width: 22px; text-align: center; font-size: 17px; }
  .ch small { margin-left: auto; padding-left: 8px; color: var(--muted); font-weight: 500; font-size: 13px; }
  .ch.dim { border-bottom-color: #5b5275; color: #c8bfdc; }
  .ch.go { justify-content: center; border-bottom-color: #5ad43f; }
  .ch.gold { border-bottom-color: #ffd23f; }
  .ch[disabled] { opacity: .4; pointer-events: none; }

  /* --- title, party, rules: HTML over the 3D world --- */
  .screen { display: flex; align-items: center; justify-content: center; padding: max(12px, var(--st)) max(14px, var(--sr)) max(12px, var(--sb)) max(14px, var(--sl)); box-sizing: border-box; }
  #title { flex-direction: column; gap: 10px; background: radial-gradient(ellipse at 50% 60%, rgba(8,6,12,0) 0%, rgba(8,6,12,.55) 70%); }
  #logo { width: min(86vw, 520px); image-rendering: pixelated; filter: drop-shadow(0 6px 18px rgba(0,0,0,.7)); }
  #title .sub { font: 800 italic 22px 'Alegreya', Georgia, serif; color: var(--gold); text-shadow: 0 2px 8px #000; margin: -4px 0 6px; text-align: center; }
  #title .col { display: flex; flex-direction: column; gap: 8px; width: min(300px, 86vw); }
  #title .ch { justify-content: center; }
  #title .foot { position: absolute; left: 0; right: 0; bottom: max(8px, var(--sb)); display: flex; justify-content: space-between; padding: 0 14px; color: #8a7ad8; font-size: 12px; pointer-events: none; }
  .card { width: 100%; max-width: 620px; max-height: 100%; overflow: auto; box-sizing: border-box; padding: 16px 18px; border-radius: 12px;
          background: linear-gradient(rgba(37,30,56,.96), rgba(27,22,40,.96)); border: 1px solid var(--line); border-top: 3px solid var(--c, #8a7ad8); box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .card h2 { margin: 0 0 8px; font: 800 24px 'Alegreya', Georgia, serif; }
  .card h4 { margin: 12px 0 4px; font-size: 15px; color: var(--gold); }
  .card p { margin: 0 0 8px; font: 400 16.5px/1.45 'Alegreya', Georgia, serif; }
  .card .muted, .muted { color: var(--muted); font-weight: 500; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; justify-content: flex-end; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pill { padding: 6px 12px; border-radius: 20px; background: #1d1830; border: 1px solid var(--line); font-weight: 800; min-width: 38px; }
  .pill.on { background: #3a2f5c; border-color: var(--c, var(--gold)); box-shadow: 0 0 0 1px var(--c, var(--gold)); }
  .heroRow { display: grid; grid-template-columns: 76px 1fr auto; gap: 4px 10px; align-items: center; padding: 8px 10px; margin-top: 8px; border-radius: 8px;
             background: #1d1830; border: 1px solid var(--line); border-left: 4px solid var(--c); }
  .heroRow img { grid-row: 1 / 4; width: 76px; height: 76px; }
  .pt { border-radius: 10px; background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--c) 45%, #2a2340), #120f1c 72%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
  .heroRow input { width: 120px; font: 800 17px 'Alegreya Sans', sans-serif; background: #0b0912; color: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; user-select: text; -webkit-user-select: text; }
  .heroRow .cls { grid-column: 2 / 4; display: flex; gap: 5px; flex-wrap: wrap; }
  .heroRow .cls .pill { padding: 4px 9px; font-size: 14px; }
  .heroRow .st { grid-column: 2 / 4; color: var(--muted); font-size: 13.5px; }
  .heroRow .st b { color: var(--ink); }

  /* --- the play screen --- */
  #play { display: grid; grid-template-columns: 1fr; grid-template-rows: auto 1fr; padding: max(6px, var(--st)) max(8px, var(--sr)) max(6px, var(--sb)) max(8px, var(--sl)); box-sizing: border-box; pointer-events: none; }
  #top { display: flex; gap: 6px; pointer-events: auto; }
  #party { flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .hero { display: grid; grid-template-columns: 38px 1fr; column-gap: 7px; align-items: center; text-align: left; padding: 4px 8px 5px; background: var(--panel);
          border: 1px solid var(--line); border-top: 2px solid var(--c); border-radius: 7px; min-width: 0; backdrop-filter: blur(4px); }
  .hero img { grid-row: 1 / 4; width: 38px; height: 38px; }
  .hero .hn { font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hero .hs { display: flex; justify-content: space-between; gap: 6px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .hero .bar { height: 4px; background: #0b0912; border-radius: 2px; overflow: hidden; margin-top: 2px; }
  .hero .bar span { display: block; height: 100%; background: var(--good); transition: width .3s; }
  .hero.low .bar span { background: #ffb03a; } .hero.down { opacity: .6; } .hero.dead { opacity: .4; filter: grayscale(1); } .mh.dead { opacity: .5; filter: grayscale(1); } .hero.down .hs span:first-child { color: var(--bad); font-weight: 700; }
  .hero.turn { background: rgba(58,47,92,.95); border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 0 14px rgba(255,210,63,.35); }
  .tag { font-style: normal; font-size: 11px; font-weight: 700; margin-left: 6px; padding: 0 5px; border-radius: 3px; background: #4a2a6a; color: #e0b0ff; }
  .tag.hid { background: #1e4a2a; color: #9af59a; }
  #mapBtn { width: 44px; flex: none; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; font-size: 19px; }
  #pause { width: 44px; flex: none; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; font-weight: 800; letter-spacing: 1px; }
  #side { position: fixed; display: flex; flex-direction: column; gap: 6px; pointer-events: none; box-sizing: border-box; }
  #side > * { pointer-events: auto; }
  #story { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--line);
           background: linear-gradient(180deg, rgba(36,29,51,.9), rgba(27,22,38,.9)); box-shadow: inset 0 0 40px rgba(0,0,0,.45), 0 8px 30px rgba(0,0,0,.4);
           font: 400 18px/1.5 'Alegreya', Georgia, 'Times New Roman', serif; color: var(--ink); user-select: text; -webkit-user-select: text;
           scrollbar-width: thin; scrollbar-color: #4a3e70 transparent; backdrop-filter: blur(5px); }
  #story h3 { margin: 2px 0 6px; font: 800 13.5px/1.4 'Alegreya Sans', system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
  #story p { margin: 0 0 9px; }
  #story .gap { margin: 0; height: 6px; }
  #story .good { color: var(--good); } #story .bad { color: var(--bad); } #story .hurt { color: #ffb8a0; } #story .gold { color: var(--gold); }
  #story .muted { color: var(--muted); font: 700 12px 'Alegreya Sans', sans-serif; letter-spacing: .1em; text-transform: uppercase; margin: 10px 0 4px; }
  #story .magic { color: #9cc4ff; } #story .holy { color: #f5e68a; } #story .evil { color: #d79aff; font-style: italic; }
  .roll { display: flex; gap: 9px; align-items: flex-start; margin: 3px 0 7px; padding: 4px 9px; border-radius: 4px; border-left: 3px solid;
          background: rgba(0,0,0,.28); font: 500 14.5px/1.35 'Alegreya Sans', system-ui, sans-serif; }
  .roll b { flex: none; min-width: 24px; padding: 1px 4px; text-align: center; border-radius: 3px; background: #f0e8d8; color: #1a1018; font-weight: 800; }
  .roll.ok { color: var(--good); border-color: #4ac24a; } .roll.no { color: var(--bad); border-color: #d84a3a; } .roll.info { color: #ffe07a; border-color: #c8a030; }
  #inv { display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: 13.5px; color: var(--muted); padding: 0 4px; text-shadow: 0 1px 3px #000; }
  #inv .gold { color: var(--gold); } #inv .good { color: var(--good); } #inv .holy { color: #f5e68a; }
  #ask { text-align: center; font-weight: 800; color: var(--gold); font-size: 14.5px; letter-spacing: .03em; min-height: 18px; text-shadow: 0 1px 4px #000; }
  #choices { display: grid; gap: 6px; grid-template-columns: 1fr; }
  #choices.two { grid-template-columns: 1fr 1fr; }
  .hint { text-align: center; color: #8a80a8; font-size: 13px; padding: 6px; text-shadow: 0 1px 3px #000; }

  /* the battle: the story becomes a short log, the actions sit in a fixed panel beside (or under) the scene */
  body.battle #story { flex: 1 1 0; min-height: 40px; font-size: 15px; padding: 6px 12px; }
  body.battle #story h3 { display: none; }
  body.battle #ask { font-size: 14px; }
  body.battle #choices { grid-template-columns: 1fr 1fr; flex: none; min-height: 168px; align-content: start; }
  body.battle #choices .ch { min-height: 38px; padding: 5px 9px; font-size: 15px; gap: 6px; }
  body.battle #choices .ch kbd { display: none; }
  body.battle #choices .ch small { font-size: 12px; }
  body.battle #inv { display: none; }
  #banner { position: fixed; left: 50%; transform: translateX(-50%); padding: 6px 16px; border-radius: 20px; background: rgba(13,11,19,.82); border: 1px solid var(--gold);
            color: var(--gold); font-weight: 800; font-size: 15px; white-space: nowrap; pointer-events: none; text-shadow: 0 1px 3px #000; transition: opacity .2s; }
  #die { position: fixed; width: 52px; height: 56px; border-radius: 9px; display: flex; flex-direction: column; align-items: center; justify-content: center;
         background: #f0e8d8; color: #1a1018; border: 3px solid #0b0912; box-shadow: 0 6px 18px rgba(0,0,0,.6); pointer-events: none; transition: background .15s, transform .15s; }
  #die b { font: 800 24px/1 'Alegreya Sans', sans-serif; } #die span { font: 700 11px 'Alegreya Sans', sans-serif; opacity: .7; }
  #die.ok { background: #2a7a3a; color: #fff; } #die.no { background: #8a2a2a; color: #fff; } #die.info { background: #6a5a1a; color: #fff; }
  #die.spin { transform: rotate(-8deg) scale(1.05); }
  #fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .num { position: absolute; transform: translate(-50%, -50%); font: 800 22px 'Alegreya Sans', sans-serif; text-shadow: 0 2px 0 #000, 0 0 8px #000; white-space: nowrap; }
  .num.miss { font-size: 16px; color: #c8bfdc; } .num.dmg { color: #ff6a50; } .num.heal { color: #8ff08f; } .num.info { font-size: 16px; color: #ffd23f; }
  .ut { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 2px; pointer-events: none; }
  .ut i { font: 700 11.5px 'Alegreya Sans', sans-serif; font-style: normal; color: #fff; text-shadow: 0 1px 2px #000, 0 0 4px #000; white-space: nowrap; }
  .ut s { display: block; width: 40px; height: 5px; background: #0b0912; border-radius: 3px; overflow: hidden; border: 1px solid rgba(0,0,0,.6); }
  .ut s u { display: block; height: 100%; background: #e8303a; text-decoration: none; transition: width .25s; }
  .ut.hero s u { background: #5ad43f; }

  /* the films: letterbox bars and a caption */
  #film { position: fixed; inset: 0; pointer-events: none; }
  #film .bar { position: absolute; left: 0; right: 0; height: 11vh; background: #000; transition: transform .6s ease; }
  #film .bar.t { top: 0; transform: translateY(-100%); } #film .bar.b { bottom: 0; transform: translateY(100%); }
  #film.on .bar { transform: none; }
  #film .cap { position: absolute; left: 0; right: 0; bottom: 13vh; text-align: center; opacity: 0; transition: opacity .8s; padding: 0 20px; }
  #film .cap b { display: block; font: 800 italic clamp(26px, 6vw, 46px)/1.1 'Alegreya', Georgia, serif; color: #fff4d8; text-shadow: 0 3px 16px #000, 0 0 30px rgba(0,0,0,.8); letter-spacing: .02em; }
  #film .cap span { display: block; margin-top: 4px; font: 400 italic clamp(15px, 3vw, 20px) 'Alegreya', Georgia, serif; color: #d8cdb8; text-shadow: 0 2px 10px #000; }
  #film .cap.on { opacity: 1; }
  #film .cap.long b { font-size: clamp(20px, 4.4vw, 34px); max-width: 900px; margin: 0 auto; line-height: 1.25; }
  #film .skip { position: absolute; right: 14px; bottom: 4vh; color: rgba(255,255,255,.45); font-size: 12px; opacity: 0; transition: opacity .6s; }
  #film.on .skip { opacity: 1; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .45s; }
  #fade.on { opacity: 1; }
  body.film #play, body.film #side, body.film #banner, body.film #die, body.film #fx { visibility: hidden; }

  /* the world map */
  #map .mtop { position: absolute; left: 0; right: 0; top: 0; display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; padding: max(8px, var(--st)) max(10px, var(--sr)) 0 max(10px, var(--sl)); pointer-events: none; }
  #map .mtop > * { pointer-events: auto; }
  .mparty { display: flex; gap: 6px; flex-wrap: wrap; }
  .mh { display: flex; gap: 6px; align-items: center; padding: 4px 9px 4px 4px; background: var(--panel); border: 1px solid var(--line); border-top: 2px solid var(--c); border-radius: 8px; text-align: left; }
  .mh img { width: 34px; height: 34px; border-radius: 6px; }
  .mh b { display: block; font-size: 14px; } .mh i { display: block; font-style: normal; font-size: 12px; color: var(--muted); }
  .mbtns { display: flex; gap: 6px; align-items: center; } .mbtns .ch { min-height: 36px; padding: 5px 11px; font-size: 14.5px; }
  .mgold { color: var(--gold); font-weight: 800; text-shadow: 0 1px 3px #000; margin-right: 4px; }
  .mtitle { position: absolute; left: 0; right: 0; bottom: max(10px, var(--sb)); text-align: center; font: 800 italic clamp(20px, 4vw, 32px) 'Alegreya', Georgia, serif; color: #fff4d8; text-shadow: 0 2px 10px #000; pointer-events: none; }
  #mlabels { position: absolute; inset: 0; pointer-events: none; }
  .mreg { position: absolute; transform: translate(-50%, -50%); font: 700 italic 14px 'Alegreya', Georgia, serif; color: rgba(255,248,225,.75); text-shadow: 0 1px 4px #000, 0 0 8px #000; white-space: nowrap; letter-spacing: .04em; }
  .mpin { position: absolute; transform: translate(-50%, -100%); pointer-events: auto; display: flex; gap: 5px; align-items: center; padding: 4px 9px; border-radius: 16px; white-space: nowrap;
          background: rgba(27,22,40,.92); border: 1px solid var(--line); font-weight: 800; font-size: 13.5px; box-shadow: 0 4px 14px rgba(0,0,0,.5); }
  .mpin i { font-style: normal; } .mpin em { font-style: normal; font-size: 12px; color: var(--muted); }
  .mpin.story { border-color: #c8a030; }
  .mpin.open { border: 2px solid var(--gold); animation: pinPulse 1.4s ease-in-out infinite; } .mpin.open em { color: var(--gold); }
  .mpin.done em { color: var(--good); } .mpin.locked { opacity: .75; } .mpin.soon { opacity: .6; border-style: dashed; }
  @keyframes pinPulse { 50% { box-shadow: 0 0 0 4px rgba(255,210,63,.25), 0 4px 14px rgba(0,0,0,.5); } }
  .mcard .needs div { font-weight: 700; margin: 2px 0; } .needs .ok { color: var(--good); } .needs .no { color: var(--bad); }
  .bk { display: flex; gap: 10px; align-items: flex-start; margin: 6px 0; padding: 6px 8px; border-radius: 6px; background: rgba(0,0,0,.25); }
  .bk > b { font-size: 22px; width: 30px; text-align: center; } .bk.no > b { color: var(--muted); }
  .card h4.big { font-size: 17px; margin-top: 16px; border-bottom: 1px solid var(--line); padding-bottom: 3px; }
  .card.parch { background: linear-gradient(#e8d8b0, #d8c494); color: #3a2a18; border-top-color: #8a6a3a; }
  .card.parch .muted { color: #6a5a40; }
  .mmap { position: relative; width: 100%; aspect-ratio: 16 / 10; margin: 8px 0; border-radius: 8px; background: radial-gradient(ellipse, rgba(255,255,255,.25), rgba(120,90,40,.15)); }
  .mmap svg { position: absolute; inset: 0; width: 100%; height: 100%; } .mmap line { stroke: #7a5a30; stroke-width: .8; }
  .mn { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; background: none; border: 0; padding: 0; color: #3a2a18; }
  .mn b { width: 26px; height: 26px; line-height: 26px; border-radius: 50%; background: #f4e8c8; border: 2px solid #7a5a30; font-size: 13px; }
  .mn span { font: 700 12px 'Alegreya Sans', sans-serif; white-space: nowrap; margin-top: 1px; text-shadow: 0 0 3px #f4e8c8; }
  .mn.here b { background: #ffd23f; } .mn.go b { background: #fff; box-shadow: 0 0 0 3px rgba(90,60,20,.3); } .mn.unk { opacity: .7; } .mn.unk b { border-style: dashed; }
  .art { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .card.talk { max-width: 560px; display: flex; flex-direction: column; max-height: 92vh; }
  .card.talk .sh-head img { width: 64px; height: 64px; border-radius: 10px; }
  .tlog { flex: 1; min-height: 140px; max-height: 46vh; overflow-y: auto; padding: 8px; border-radius: 8px; background: rgba(0,0,0,.3); user-select: text; -webkit-user-select: text;
          font: 400 16.5px/1.45 'Alegreya', Georgia, serif; }
  .tl { margin: 0 0 8px; } .tl.npc { color: #e8c8f8; } .tl.intro { color: var(--muted); font-style: italic; } .tl.player { color: #fff; } .tl i { color: var(--muted); }
  .trow { display: flex; gap: 6px; margin-top: 8px; }
  .tin { flex: 1; min-width: 0; font: 500 16px 'Alegreya Sans', sans-serif; background: #0b0912; color: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; user-select: text; -webkit-user-select: text; }
  .tsend { min-width: 46px; justify-content: center; } .tmic.on { background: #8a1a2a; }
  .card.talk .btns { justify-content: space-between; align-items: center; }
  .modal { position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; background: rgba(8,6,12,.72); padding: 16px; box-sizing: border-box; pointer-events: auto; }
  .card.small { max-width: 300px; display: flex; flex-direction: column; gap: 8px; }
  .sh-head { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
  .sh-head img { width: 96px; height: 96px; }
  .sh-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .stats { border-collapse: collapse; font-size: 15px; }
  .stats th { text-align: left; padding: 1px 8px 1px 0; color: var(--muted); } .stats td { padding: 1px 8px 1px 0; font-weight: 800; } .stats td.muted { font-size: 13px; font-weight: 500; }
  .stats tr.prime th, .stats tr.prime td:nth-child(2) { color: var(--gold); }
  .combat { display: flex; flex-direction: column; gap: 3px; } .combat .ok { color: var(--good); } .combat .low { color: #ffb03a; } .combat .down { color: var(--bad); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; } .chips span { padding: 2px 8px; border-radius: 4px; background: #0b0912; font-size: 13.5px; }
  .spells { margin: 0; padding-left: 18px; font-size: 14.5px; }

<script type="module">
/* ==========================================================================
   PIXEL QUEST: UTOPENÝ ZVON. An old-school dungeon adventure in 3D, in Czech, for children (part of the PIXEL GAMES).
   A proof of concept, not in the arcade's menu yet: it lives at /adad.
   A party of 1 to 4 heroes (VÁLEČNÍK, KNĚZ, ČARODĚJ, ZLODĚJ) takes turns on one phone. The game is the dungeon master:
   it tells you where you are, you pick what the party does, and the dice decide. Every roll is shown.
   Every scene is a small 3D set (three.js, vendor/, MIT licence), built in code: no image or model files. The first
   time the party comes to a scene, a few seconds of film (the camera flies through the set, a caption) set the mood.
   Fights happen on the set's floor, on a grid: the hero whose turn it is gets a gold ring, tap a blue tile to walk
   there, and pick what they do in the panel (or tap a monster to attack it).
   The rules are the classic 1st-level ones, cut down, and kind to children:
     - six abilities, 4d6 drop the lowest, put where the class needs them most
     - descending armour class and THAC0 (shown as "need 12 or more"), saving throws, ability checks (d20 <= ability),
       thief skills in % (d100), d10 initiative per side, surprise, morale (2d10)
     - 0 HP: the hero falls and can't fight (a potion or a cure gets them up); after a won fight they get up with 1 HP.
       Nobody dies: if the whole party falls, they wake up in the inn and can try again.
   THE ADVENTURE IS DATA: ROOMS (section 5) is a list of scenes: their set, film, text and choices.
     1. Setup   2. Rules   3. Heroes   4. The story queue   5. The adventure   6. Fights   7. The 3D world
     8. Figures   9. Sets   10. Films   11. The battle on the grid   12. Screens   13. Sound   14. Input   15. Main loop
   ========================================================================== */
import * as THREE from './vendor/three.module.min.js';

/* --- 1. SETUP --------------------------------------------------------------- */
const VERSION = '0.5.2';
const SAVE_KEY = 'pixelQuest.save', GAME_KEY = 'pixelQuest.campaign';
const save = { sfx: true, music: true, wins: 0 };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY)) || {}); } catch (e) { /* new player */ }
const store = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* private mode */ } };
// the language: the arcade's SETTINGS → LANGUAGE (or the switch on the title). Every text is written twice, L('česky', 'English'):
// not translated word for word, each language gets what works in it (the riddle on the door is different).
const LANG = PX.Lang.code() === 'cs' ? 'cs' : 'en';
const L = (cs, en) => LANG === 'cs' ? cs : en;
document.documentElement.lang = LANG;
const profile = PX.Profile.get();
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = k => { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); };
const rnd = n => 1 + Math.floor(Math.random() * n);                  // one die
const dice = (n, s, b = 0) => { let t = b; for (let i = 0; i < n; i++) t += rnd(s); return t; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const esc = v => String(v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const nice = v => String(v).toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase());   // BRAN -> Bran

/* --- 2. RULES ----------------------------------------------------------------- */
const STATS = ['str', 'dex', 'con', 'int', 'wis', 'cha'];
const STAT_NAME = L({ str: 'Síla', dex: 'Obratnost', con: 'Odolnost', int: 'Inteligence', wis: 'Moudrost', cha: 'Charisma' },
                    { str: 'Strength', dex: 'Dexterity', con: 'Constitution', int: 'Intelligence', wis: 'Wisdom', cha: 'Charisma' });
const STAT_SHORT = L({ str: 'SÍL', dex: 'OBR', con: 'ODL', int: 'INT', wis: 'MOU', cha: 'CHA' }, { str: 'STR', dex: 'DEX', con: 'CON', int: 'INT', wis: 'WIS', cha: 'CHA' });
const strHit = s => s <= 3 ? -3 : s <= 5 ? -2 : s <= 7 ? -1 : s <= 16 ? 0 : 1;
const strDmg = s => s <= 5 ? -1 : s <= 15 ? 0 : s <= 17 ? 1 : 2;
const dexAC = s => s <= 3 ? 4 : s <= 5 ? 6 - s : s === 6 ? 1 : s <= 14 ? 0 : -(s - 14);
const dexMissile = s => s <= 3 ? -3 : s <= 5 ? s - 6 : s <= 15 ? 0 : s === 16 ? 1 : 2;
const conHP = (s, fighter) => s <= 3 ? -2 : s <= 6 ? -1 : s <= 14 ? 0 : s === 15 ? 1 : s === 16 ? 2 : fighter ? s - 14 : 2;
const THIEF_DEX = { 16: [5, 0, 0, 0], 17: [10, 0, 5, 5], 18: [15, 5, 10, 10] };
const SAVE_NAMES = L(['jedu', 'hůlkám', 'ztuhnutí', 'dechu', 'kouzlům'], ['poison', 'wands', 'paralysis', 'breath', 'spells']);
const SV = { poison: 0, wand: 1, para: 2, breath: 3, spell: 4 };
// name: [boy, girl]; move: tiles a turn on the battle grid
const CLASSES = {
  fighter: { name: L(['Válečník', 'Válečnice'], ['Fighter', 'Fighter']), hd: 10, prime: 'str', order: ['str', 'con', 'dex', 'wis', 'cha', 'int'], armour: 4, armourName: L('kroužková zbroj a štít', 'chain mail and shield'),
             weapon: { name: L('Dlouhý meč', 'Long sword'), n: 1, s: 8, b: 0, edged: true }, saves: [14, 16, 15, 17, 17], next: 2000, col: '#e8a040', move: 3,
             about: L('Silný a odolný, má nejlepší zbroj. Stoupni si dopředu a chraň ostatní.', 'Strong and tough, with the best armour. Stand in front and protect the others.') },
  cleric:  { name: L(['Kněz', 'Kněžka'], ['Cleric', 'Cleric']), hd: 8, prime: 'wis', order: ['wis', 'con', 'str', 'cha', 'dex', 'int'], armour: 4, armourName: L('kroužková zbroj a štít', 'chain mail and shield'),
             weapon: { name: L('Palcát', 'Mace'), n: 1, s: 6, b: 1 }, saves: [10, 14, 13, 16, 15], next: 1500, col: '#f0e070', spells: ['cure', 'bless'], move: 3,
             about: L('Léčí, žehná a svatým znamením zahání kostlivce a utopence.', 'Heals, blesses, and drives off skeletons and the drowned with a holy symbol.') },
  mage:    { name: L(['Čaroděj', 'Čarodějka'], ['Mage', 'Mage']), hd: 4, prime: 'int', order: ['int', 'dex', 'con', 'wis', 'cha', 'str'], armour: 10, armourName: L('plášť', 'robes'),
             weapon: { name: L('Hůl', 'Staff'), n: 1, s: 6, b: 0 }, saves: [14, 11, 13, 15, 12], next: 2500, col: '#6aa8ff', spells: ['missile', 'sleep'], move: 4,
             about: L('Křehký, ale umí kouzla: Magická střela nikdy nemine, Spánek uspí nepřátele. Drž se vzadu.', 'Fragile, but knows magic: Magic Missile never misses, Sleep puts enemies to sleep. Stay at the back.') },
  thief:   { name: L(['Zloděj', 'Zlodějka'], ['Thief', 'Thief']), hd: 6, prime: 'dex', order: ['dex', 'int', 'con', 'cha', 'str', 'wis'], armour: 8, armourName: L('kožená zbroj', 'leather armour'),
             weapon: { name: L('Krátký meč', 'Short sword'), n: 1, s: 6, b: 0, edged: true }, saves: [13, 14, 12, 16, 15], next: 1250, col: '#6ad46a', move: 4,
             about: L('Otevírá zámky, hledá pasti a plíží se. Ze stínu bodne dvakrát silněji.', 'Opens locks, finds traps and sneaks. Strikes twice as hard from the shadows.') },
};
const CLASS_IDS = ['fighter', 'cleric', 'mage', 'thief'];
const SPELLS = {
  missile: { name: L('Magická střela', 'Magic Missile'), target: 'foe', info: L('1k4+1 zranění, nikdy nemine', '1d4+1 damage, never misses'), ic: '✦' },
  sleep:   { name: L('Spánek', 'Sleep'), target: 'none', info: L('uspí pár nepřátel (ne nemrtvé)', 'puts a few enemies to sleep (not the undead)'), ic: '☾' },
  cure:    { name: L('Léčení', 'Cure Wounds'), target: 'hero', info: L('vyléčí 1k8 životů, dotykem', 'heals 1d8 HP, by touch'), calm: true, ic: '✚' },
  bless:   { name: L('Požehnání', 'Bless'), target: 'none', info: L('+1 k útoku pro celou družinu', '+1 to hit for the whole party'), ic: '☀' },
};
// monsters: hp = [dice, sides, bonus], dmg the same; turn = what a 1st level cleric needs on d20 to turn it
const MON = {
  rat:    { name: L('Krysa', 'Rat'), hd: 0.5, hp: [1, 4, 0], ac: 7, thac0: 20, dmg: [1, 3, 0], morale: 7, xp: 7, move: 4, fell: L('je poražená', 'is beaten'), ran: L('utíká pryč', 'runs away'), squeak: true },
  skel:   { name: L('Kostlivec', 'Skeleton'), hd: 1, hp: [1, 8, 0], ac: 7, thac0: 19, dmg: [1, 6, 0], morale: 99, xp: 35, undead: true, turn: 10, halfEdged: true, move: 3, fell: L('se rozsypal na hromádku kostí', 'falls apart into a heap of bones'), ran: L('prchá před světlem', 'flees from the light') },
  zomb:   { name: L('Utopenec', 'Drowned one'), hd: 2, hp: [2, 8, 0], ac: 8, thac0: 19, dmg: [1, 8, 0], morale: 99, xp: 65, undead: true, turn: 13, slow: true, move: 2, fell: L('se rozpadl v louži vody', 'collapses into a puddle of water'), ran: L('couvá zpátky do tůně', 'backs away into the pool') },
  malrec: { name: L('Bratr Malrec', 'Brother Malrec'), hd: 3, hp: [0, 0, 17], ac: 6, thac0: 18, dmg: [1, 6, 1], morale: 12, xp: 120, noSleep: true, boss: true, move: 3, fell: L('padá k zemi', 'falls'), ran: '' },
};
const ITEMS = L({ potion: 'Léčivý lektvar', holy: 'Svěcená voda', food: 'Jídlo' }, { potion: 'Healing potion', holy: 'Holy water', food: 'Food' });

/* --- 3. HEROES ------------------------------------------------------------- */
const NAMES = [['Bran', 'm'], ['Mira', 'f'], ['Oswin', 'm'], ['Tess', 'f'], ['Garrick', 'm'], ['Elwyn', 'f'], ['Hob', 'm'], ['Sable', 'f'],
               ['Rowan', 'm'], ['Ida', 'f'], ['Corvin', 'm'], ['Nell', 'f'], ['Aldo', 'm'], ['Wren', 'f']];
function rollStats() { return Array.from({ length: 6 }, () => { const r = [rnd(6), rnd(6), rnd(6), rnd(6)].sort((a, b) => a - b); return r[1] + r[2] + r[3]; }).sort((a, b) => b - a); }
function makeHero(name, g, cls, vals) {
  const h = { name, g, cls, vals, st: {}, xp: 0, tried: {}, hair: rnd(5) - 1 };
  setClass(h, cls);
  return h;
}
function setClass(h, cls) {
  const C = CLASSES[cls]; h.cls = cls;
  C.order.forEach((k, i) => { h.st[k] = h.vals[i]; });
  h.max = Math.max(1, C.hd + conHP(h.st.con, cls === 'fighter'));
  h.hp = h.shp = h.max;
  h.weapon = Object.assign({}, C.weapon);
  h.level = 1; h.xp = 0;
  h.spellMax = spellMaxOf(h);
  h.spells = h.spellMax;
}
const clsName = h => CLASSES[h.cls].name[h.g === 'f' ? 1 : 0];
const acOf = h => CLASSES[h.cls].armour + dexAC(h.st.dex);
const thac0Of = h => { const k = lvl(h) - 1; return 20 - (h.cls === 'fighter' ? k : h.cls === 'mage' ? Math.floor(k / 2) : 2 * Math.floor(k / 2)); };
const hitOf = h => strHit(h.st.str) + (h.weapon.hit || 0);
const dmgOf = h => strDmg(h.st.str);
const up = h => h.hp > 0 && !h.dead;                        // can act (if not held)
const hardcore = () => !!G && G.mode === 'hard';            // HARDCORE: heroes bleed at 0 HP and die at -10, for good
function thiefSkill(h, k) {                                 // k: 0 open locks, 1 find traps, 2 move silently, 3 hide in shadows
  const base = [35, 25, 35, 25][k], adj = THIEF_DEX[Math.min(18, h.st.dex)] || [0, 0, 0, 0];
  return base + adj[k] + 5 * (lvl(h) - 1);
}
const SKILL_NAMES = L(['Otevírání zámků', 'Hledání pastí', 'Tiché plížení', 'Schovat se ve stínu'], ['Open locks', 'Find traps', 'Move silently', 'Hide in shadows']);
const saveOf = (h, kind) => CLASSES[h.cls].saves[SV[kind]] - Math.floor((lvl(h) - 1) / 2);
const gv = (h, boy, girl) => h.g === 'f' ? girl : boy;     // Czech words that change for a girl hero

/* --- 3b. LEVELS: one party for the whole campaign, levels 1 to 5 ------------------------------
   Experience (shared out at the end of fights and missions) raises the level: more HP (a roll of the class's die),
   better hits (THAC0), better saving throws, more spells a day, better thief skills. Replaying a mission gives
   half the experience. */
const XP_LEVEL = [0, 150, 450, 1000, 2000];             // the experience each level starts at
const MAX_LEVEL = 5;
const lvl = h => h.level || 1;
function spellMaxOf(h) {
  const L1 = lvl(h);
  if (h.cls === 'mage') return Math.min(L1, 4);
  if (h.cls === 'cleric') return Math.min(L1, 4) + (h.st.wis >= 13 ? 1 : 0);
  return 0;
}
function levelUp(h) {
  const C = CLASSES[h.cls];
  h.level = lvl(h) + 1;
  const gain = Math.max(1, rnd(C.hd) + conHP(h.st.con, h.cls === 'fighter'));
  h.max += gain; h.hp = Math.min(h.max, Math.max(1, h.hp) + gain); h.shp = h.hp;
  h.spellMax = spellMaxOf(h); h.spells = h.spellMax;
  return gain;
}
// after a mission: whoever has enough experience goes up a level (maybe more than one)
function checkLevels() {
  for (const h of G.heroes) while (!h.dead && lvl(h) < MAX_LEVEL && h.xp >= XP_LEVEL[lvl(h)]) {
    const gain = levelUp(h);
    say(L(`${h.name} postupuje na ${lvl(h)}. úroveň! +${gain} životů${h.spellMax ? ', víc kouzel' : ''}, lepší útok.`,
          `${h.name} reaches level ${lvl(h)}! +${gain} HP${h.spellMax ? ', more spells' : ''}, better attacks.`), '#ffd23f');
    then(() => sfx('win'));
  }
}

   Unique magic things hidden in the missions. Key artefacts: the reward of a story mission's main goal (they can't be

const CLUES = {

};
const hasArt = (h, id) => !!G.arts && G.arts[id] === G.heroes.indexOf(h);
const artOf = h => Object.keys(G.arts || {}).find(id => G.arts[id] === G.heroes.indexOf(h));
function equip(h, id) {
  const i = G.heroes.indexOf(h), old = artOf(h);

}

  const id = artOf(h); if (!id) return;

}

  say(L(`Nový artefakt: ${ART[id].ic} ${ART[id].name}! ${ART[id].info}`, `A new artefact: ${ART[id].ic} ${ART[id].name}! ${ART[id].info}`), '#ffd23f');

}

ART.signet = { mission: 's1', kind: 'key', ic: '💍', name: L('Princův pečetní prsten', 'The Prince\'s Signet'), info: L('Znamení, že jednáte z pověření prince Edrika.', 'A sign that you act for Prince Edric.'), hint: '' };
const missionOf = id => MISSIONS.find(m => m.id === id);

function missionNeeds(M) {

  for (const a of (M.needs && M.needs.arts) || []) out.push({ ok: G.arts[a] !== undefined, txt: `${ART[a].ic} ${ART[a].name} (${L('z mise', 'from')} ${missionOf(ART[a].mission).title})` });

/* --- 4. THE STORY QUEUE -------------------------------------------------------
   Everything the game says or shows goes through a queue, one piece at a time: text, a dice roll (the die spins, then
   the result), a film, an animation in the 3D world (wait until it's done), or a function to run when its turn comes.
   The choices only show when the queue is empty. Tap to skip ahead. */
let G = null;                       // the adventure in progress (saved): heroes, gold, items, flags, room
let F = null;                       // the fight in progress (not saved)
const Q = [];
let cur = null;                     // the queue entry being shown
let choices = [], ask = '', choicesVer = 0;   // the buttons and the question above them
let die = null;                     // the die being rolled { sides, shown, value, ok, t, done }
let skip = false, tapped = false;
const say = (txt, col) => Q.push({ k: 'say', txt, col });
const head = txt => Q.push({ k: 'say', txt, cls: 'title' });
const then = fn => Q.push({ k: 'fn', fn });
const gap = () => Q.push({ k: 'say', txt: '', cls: 'gap' });
const play = (fn, dur) => Q.push({ k: 'anim', fn, dur });   // start something in the 3D world, then wait dur seconds
function rollFx(sides, value, txt, ok, fast) { Q.push({ k: 'roll', sides, value, txt, ok, fast }); }
// a choice somebody has to try (a check): only shown while some hero can still try it
function setChoices(q, list) { ask = q; choicesVer++; choices = list.filter(c => c && (!c.if || c.if()) && (!c.who || G.heroes.some(h => up(h) && c.who(h) > 0))); }
const pickWho = (q, chance, fn) => ({ who: chance, act: () => choose(q, chance, fn, stay) });

const storyEl = $('story'), storyIn = $('storyIn');
const COLS = { '#7aea7a': 'good', '#ff7a6a': 'bad', '#ff3a3a': 'bad', '#ffaa8a': 'hurt', '#ffd23f': 'gold', '#c8b8ff': 'muted', '#6aa8ff': 'magic', '#f0e070': 'holy', '#c06aff': 'evil' };
let stick = true;
storyEl.addEventListener('scroll', () => { stick = storyEl.scrollTop + storyEl.clientHeight >= storyEl.scrollHeight - 40; });
function clearText() { storyIn.textContent = ''; stick = true; }
const hasText = () => storyIn.childElementCount > 0;
function addLine(tag, cls) {
  const el = document.createElement(tag); if (cls) el.className = cls; storyIn.appendChild(el);
  while (storyIn.childElementCount > 160) storyIn.firstChild.remove();
  return el;
}
function follow() { if (stick) storyEl.scrollTop = storyEl.scrollHeight; }
function pump(dt) {
  for (let guard = 0; guard < 200; guard++) {
    if (!cur) {
      if (!Q.length) { skip = false; return; }
      cur = Q.shift(); cur.t = 0;
      if (cur.k === 'say') cur.paras = cur.txt.split('\n').map(x => ({ x, el: addLine(cur.cls === 'title' ? 'h3' : 'p', cur.cls === 'title' ? '' : cur.cls || COLS[cur.col] || '') }));
      if (cur.k === 'roll') { die = { sides: cur.sides, value: cur.value, ok: cur.ok, t: 0, shown: rnd(cur.sides) }; sfx('dice'); }
      if (cur.k === 'anim' && cur.fn) cur.fn();
      if (cur.k === 'film') startFilm(cur.id);
    }
    cur.t += dt;
    if (cur.k === 'fn') { const fn = cur.fn; cur = null; fn(); continue; }
    if (cur.k === 'wait') { skip = false; if (!tapped) return; tapped = false; cur = null; continue; }
    if (cur.k === 'film') { if (film) return; cur = null; skip = false; continue; }
    if (cur.k === 'anim') { if (skip) finishAnims(); if (cur.t < cur.dur && !skip) return; cur = null; continue; }
    if (cur.k === 'say') {
      const total = cur.txt.length, chars = skip || cur.cls ? total : Math.floor(cur.t * 240);
      let left = chars;
      for (const p of cur.paras) { p.el.textContent = p.x.slice(0, clamp(left, 0, p.x.length)); left -= p.x.length + 1; }
      follow();
      if (chars >= total) { cur = null; continue; }
      return;
    }
    if (cur.k === 'roll') {
      const dur = cur.fast ? 0.3 : 0.6;
      die.t = cur.t;
      if (cur.t < dur && !skip) { if (Math.floor(cur.t * 18) !== Math.floor((cur.t - dt) * 18)) die.shown = rnd(cur.sides); return; }
      die.shown = cur.value; die.done = true; die.t = 0;
      const el = addLine('div', 'roll ' + (cur.ok === true ? 'ok' : cur.ok === false ? 'no' : 'info'));
      el.innerHTML = `<b title="k${cur.sides}">${cur.value}</b><span>${esc(cur.txt)}</span>`;
      follow();
      if (cur.ok === true) sfx('ok'); else if (cur.ok === false) sfx('bad');
      cur = null;
      continue;
    }
  }
}
const busy = () => !!cur || Q.length > 0;

// checks: they roll, show the roll, and give back true or false
const okTxt = ok => ok ? L('Povedlo se!', 'Success!') : L('Nevyšlo to.', 'No luck.');
function abilityChance(h, stat, mod = 0) { return clamp(h.st[stat] + mod, 1, 19) / 20; }
function checkAbility(h, stat, mod = 0) {
  const need = clamp(h.st[stat] + mod, 1, 19), r = rnd(20), ok = r <= need;
  rollFx(20, r, L(`${h.name} – ${STAT_NAME[stat]}: padlo ${r}, stačí ${need} nebo méně. ${okTxt(ok)}`, `${h.name} – ${STAT_NAME[stat]}: rolled ${r}, needs ${need} or less. ${okTxt(ok)}`), ok);
  return ok;
}
function skillChance(h, k) { return h.cls === 'thief' ? thiefSkill(h, k) / 100 : 0; }
function checkSkill(h, k) {
  const need = thiefSkill(h, k), r = rnd(100), ok = r <= need;
  rollFx(100, r, L(`${h.name} – ${SKILL_NAMES[k]}: padlo ${r} ze 100, stačí ${need} nebo méně. ${okTxt(ok)}`, `${h.name} – ${SKILL_NAMES[k]}: rolled ${r} of 100, needs ${need} or less. ${okTxt(ok)}`), ok);
  return ok;
}
function checkSave(h, kind, mod = 0, fast) {
  const need = saveOf(h, kind), r = rnd(20), ok = r + mod >= need;
  rollFx(20, r, L(`${h.name} – záchrana proti ${SAVE_NAMES[SV[kind]]}: padlo ${r}${mod ? (mod > 0 ? ' + ' : ' - ') + Math.abs(mod) : ''}, potřeba ${need} nebo víc. ${ok ? 'Zachráněno!' : 'Nevyšlo to.'}`, `${h.name} – save vs ${SAVE_NAMES[SV[kind]]}: rolled ${r}${mod ? (mod > 0 ? ' + ' : ' - ') + Math.abs(mod) : ''}, needs ${need} or more. ${ok ? 'Saved!' : 'No luck.'}`), ok, fast);
  return ok;
}
const pct = c => Math.round(c * 100) + ' %';
// the party picks who does it: a button for every hero who can, with their chance
function choose(q, chance, fn, back) {
  const list = G.heroes.filter(h => up(h) && chance(h) > 0).map(h => ({ label: h.name, note: pct(chance(h)), act: () => fn(h) }));
  if (!list.length) { say(L('To nikdo z družiny neumí.', 'Nobody in the party can do that.'), '#ff7a6a'); then(back); return; }
  list.push({ label: L('Nic, zpátky', 'Never mind'), act: back, dim: true });
  setChoices(q, list);
}
// hurt a hero: the number changes at once, what you see (the card, the bar) when the queue gets there
function hurt(h, n, floor1) {
  h.hp -= n;
  if (floor1 && h.hp < 1) h.hp = 1;
  if (!hardcore() && h.hp < 0) h.hp = 0;
  if (h.hp <= -10) { h.hp = -10; h.dead = true; }
  const hp = h.hp, dead = h.dead;
  then(() => { h.shp = hp; const u = unitOf(h); if (u) { hitFlash(u); floatNum(u, '-' + n, 'dmg'); if (hp <= 0) setPose(u, 'down'); if (dead) tint(u, 'dead'); } });
  if (dead) say(L(`${h.name} je mrtv${gv(h, 'ý', 'á')}.`, `${h.name} is dead.`), '#ff3a3a');
}
// HARDCORE: at the end of every round, the fallen bleed
function bleed() {
  if (!hardcore()) return;
  for (const h of G.heroes) if (!h.dead && h.hp <= 0) {
    hurt(h, 1);
    if (!h.dead) say(L(`${h.name} krvácí: ${h.hp} životů. (Při -10 umře.)`, `${h.name} is bleeding: ${h.hp} HP. (Dead at -10.)`), '#ff7a6a');
  }
}
function heal(h, n) {
  if (h.dead) return 0;
  const was = h.hp; h.hp = Math.min(h.max, Math.max(0, h.hp) + n);
  const hp = h.hp, got = hp - was;
  then(() => { h.shp = hp; const u = unitOf(h); if (u) { floatNum(u, '+' + got, 'heal'); burst(u.pos, 0x8ff08f, 24, 1.2); if (hp > 0 && u.pose === 'down') setPose(u, 'idle'); } });
  return got;
}
function giveXP(n, why) {
  const live = G.heroes.filter(h => !h.dead);
  if (!live.length || n <= 0) return;
  const again = G.mission && G.done && G.done[G.mission];
  const each = Math.floor(n / live.length / (again ? 2 : 1));
  for (const h of live) h.xp += each;
  say(L(`${why}: ${each} zkušeností pro každého hrdinu.`, `${why}: ${each} XP for every hero.`) + (again ? L(' (Opakovaná mise: polovina.)', ' (A replay: half.)') : ''), '#ffd23f');
}

/* --- 5. THE ADVENTURE: UTOPENÝ ZVON (THE DROWNED BELL) ---------------------------------------------
   Each scene: set (the 3D set), view (where the camera looks in it), film (played the first time), text (the first
   visit), again (when you come back), foes (the monsters standing there, before the fight starts), choices().
   Flags (G.f) remember what happened. The heroes' words are in the present tense, so they fit a boy and a girl. */
const f = () => G.f;
const n = () => G.heroes.filter(h => !h.dead).length || 1;
const stay = () => { store2(); showChoices(); };
function go(id) {
  // a new scene: first let the party read what just happened (tap to go on), then fade to black, then a clean page
  if (G.room !== id && hasText()) Q.push({ k: 'wait' });
  if (G.room !== id) { play(() => fade(true), 0.5); then(() => { clearText(); enter(id); }); return; }
  enter(id);
}
function enter(id) {
  const R = ROOMS[id];
  const first = !f()['seen_' + id];
  G.prev = G.room;                    // where the party came from (null when a saved game goes on)
  G.room = id;
  f()['seen_' + id] = 1;
  Music.play(roomMusic());
  showSet(R.set, R.view);
  showPreview(R.foes && !(R.beaten && R.beaten()) ? R.foes() : null);
  if (first && R.film && !skipFilms) Q.push({ k: 'film', id: R.film });
  else then(() => fade(false));
  head(R.title);
  say(first || !R.again ? (typeof R.text === 'function' ? R.text() : R.text) : (typeof R.again === 'function' ? R.again() : R.again));
  if (R.enter) R.enter(first);
  then(stay);
}
function showChoices() { const R = ROOMS[G.room]; setChoices(typeof R.ask === 'function' ? R.ask() : R.ask || L('Co družina udělá?', 'What does the party do?'), R.choices()); }
function needle(h) {
  say(L(`Au! Do ruky se zabodne malá jehla. ${h.name} sykne bolestí.`, `Ouch! A tiny needle jabs ${h.name}\'s hand.`), '#ff7a6a');
  f().trapGone = 1;
  if (checkSave(h, 'poison')) { hurt(h, 1, true); say(L('Jen škrábnutí. 1 zranění.', 'Just a scratch. 1 damage.')); }
  else { const d = dice(2, 4); hurt(h, d, true); say(L(`Jed pálí. ${d} zranění.`, `The poison burns. ${d} damage.`), '#ff7a6a'); }
}
function openTrapdoor() {
  f().open = 1; say(L('Dvířka se otevřou. Zespodu stoupá studený vzduch a vůně svíček.', 'The trapdoor swings open. Cold air and the smell of candles rise from below.'));
  play(() => openTrap(), 1.0);
  then(() => go('crypt'));
}
function answerDoor(word, right) {
  if (right) {
    say(L(`„Zvon.“ Bronzová pusa to slovo pomalu zopakuje. Dveře zaskřípou a otevírají se.`, `"A bell." The bronze mouth slowly says the word back. The door grinds open.`), '#7aea7a'); sfx('ok');
    play(() => openDoor(), 1.6);
    then(() => go('bell')); return;
  }
  say(L(`„${word}.“ Bronzová pusa vyplivne na družinu proud ledové černé vody!`, `"${word}." The bronze mouth spits a jet of icy black water at the party!`), '#ff7a6a');
  play(() => waterJet(), 0.7);
  f().alarm = (f().alarm || 0) + 1;
  for (const h of G.heroes) if (up(h)) { if (!checkSave(h, 'breath', 0, true)) { const d = rnd(4); hurt(h, d, true); say(L(`${h.name}: ${d} zranění.`, `${h.name}: ${d} damage.`), '#ff7a6a'); } }
  then(stay);
}
function endText() {
  if (f().late >= 2) return L('Nesete Milu dolů z kopce. Mlynář vyběhne naproti, a pak se zastaví.\nZvon už nikdy nezazvoní. Hollis vám mlčky podá váček: 100 zlaťáků. Nikdo neděkuje.' + (f().surrender ? '\nMalreca odvádějí v řetězech do Highcrownu.' : ''),
                            'You carry Mila down the hill. The miller runs to meet you, and then he stops.\nThe bell will never ring again. Hollis hands you a purse without a word: 100 gold. Nobody says thank you.' + (f().surrender ? '\nMalrec is led away to Highcrown in chains.' : ''));

const ratsN = () => [2, 3, 4, 5][n() - 1];

function bossFoes() {

  const foes = [['malrec', 1]]; if (z) foes.push(['zomb', z]);
  return foes;
}
function bossFight(surprise) { fight({ foes: bossFoes(), surprise, boss: true, win: () => { f().won = 1; go('pool'); }, flee: null }); }

/* --- 6. FIGHTS ---------------------------------------------------------------
   Every round: initiative (d10 for each side, low first; a surprise gives one side a free round). The heroes act one
   after another: each may walk (up to their move, in tiles, diagonals too) and do one thing. The monsters walk to the
   nearest hero still standing and attack; utopenci (zombies) always go last. A hero at 0 HP falls and can't fight. */
function fight(def) {
  const foes = [];
  for (const [id, cnt] of def.foes) for (let i = 0; i < cnt; i++) {
    const M = MON[id], hp = Math.max(1, dice(M.hp[0], M.hp[1], M.hp[2]) - (M.boss ? (4 - G.heroes.length) * 3 : 0));
    foes.push(Object.assign({}, M, { id, hp, max: hp, shp: hp, name: M.name + (cnt > 1 ? ' ' + (i + 1) : ''), state: 'ok' }));
  }
  F = { def, foes, round: 0, xp: 0, bless: false, turned: {}, cast: {}, over: false, target: null };
  for (const h of G.heroes) { h.held = 0; h.hidden = false; }
  startBattle(foes);
  gap();
  say(L('Boj!', 'Fight!'), '#ff7a6a'); sfx('fight');
  let s = def.surprise;
  if (s === undefined || s === null && !def.boss) {
    const a = rnd(10), b = rnd(10);
    s = a <= 3 && b > 3 ? 'foes' : b <= 3 && a > 3 ? 'party' : null;
    if (s) rollFx(10, s === 'foes' ? a : b, L(`Překvapení: padlo ${s === 'foes' ? a : b} (1 až 3 znamená překvapení). ${s === 'foes' ? 'Příšery vás překvapily!' : 'Překvapili jste příšery!'}`, `Surprise: rolled ${s === 'foes' ? a : b} (1 to 3 means surprised). ${s === 'foes' ? 'The monsters surprise you!' : 'You surprise the monsters!'}`), s === 'party');
  }
  F.free = s || null;
  then(newRound);
}
const active = m => m.state === 'ok' || m.state === 'asleep';
const foesLeft = () => F.foes.filter(active);
function endCheck() {
  if (F.over) return true;
  if (!foesLeft().length) { F.over = true; winFight(); return true; }
  if (!G.heroes.some(up)) { F.over = true; then(() => { endBattle(); F = null; go('tpk'); }); return true; }
  return false;
}

const MAPS = {
  bell: { nodes: { inn: [8, 76], hill: [26, 56], nave: [42, 44], altar: [58, 30], crypt: [60, 58], ossuary: [40, 80], door: [78, 66], bell: [90, 44], pool: [92, 18] },

function openMissionMap() {
  const D = MAPS[G.mission]; if (!D) return;
  const seen = id => !!f()['seen_' + id];
  const canGo = id => seen(id) && id !== G.room && !F && !busy() && G.room !== 'end' && G.room !== 'tpk' && !(id === 'bell' && f().won) && !(id === 'pool' && !f().won);
  const near = id => D.edges.some(([a, b]) => (a === id && seen(b)) || (b === id && seen(a)));
  const shown = id => seen(id) || near(id);
  const lines = D.edges.filter(([a, b]) => shown(a) && shown(b)).map(([a, b]) => {
    const [x1, y1] = D.nodes[a], [x2, y2] = D.nodes[b], dash = seen(a) && seen(b) ? '' : ' stroke-dasharray="2 2"';
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"${dash}/>`;
  }).join('');
  const nodes = Object.keys(D.nodes).filter(shown).map(id => {
    const [x, y] = D.nodes[id], here = id === G.room, sn = seen(id);
    return `<button class="mn${here ? ' here' : ''}${sn ? '' : ' unk'}${canGo(id) ? ' go' : ''}" style="left:${x}%;top:${y}%" ${canGo(id) ? `data-go="${id}"` : 'disabled'}><b>${here ? '★' : sn ? '●' : '?'}</b><span>${sn ? esc(D.short[id]) : '?'}</span></button>`;

    <div class="btns"><button class="ch dim" data-a="close">${L('Zavřít', 'Close')}</button></div></div>`;
  $('sheet').hidden = false; sheet = 'map';
  $('sheet').querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', ev => { ev.stopPropagation(); sfx('click'); closeSheet(); choices = []; choicesVer++; go(b.dataset.go); }));

/* --- 12c. TALKING TO CHARACTERS ---------------------------------------------------------------

   how convincing the hero was (0 to 3) and how the character feels. The dice still decide: when the talk ends, the
   best argument is a bonus to the hero's Charisma roll. Without a connection (or over the day's limit) the game falls
   back to the classic choice. */
const TALK = {
  malrec: { name: L('Bratr Malrec', 'Brother Malrec'), who: { cls: 'malrec', g: 'm', hair: 0 }, col: '#8a1a2a',
            open: L('Malrec se na vás dívá přes rameno. Zvon se houpe. „Tak mluv, když už jsi tady.“', 'Malrec looks at you over his shoulder. The bell swings. "Speak, then, since you are here."'),

let talk = null;
// best argument (0-3) → the bonus to the roll; a character who is moved gives 2 more
const talkBonus = t => Math.min(6, [-2, 0, 2, 4][t.best] + (t.mood === 'moved' ? 2 : 0));
function startTalk(id, h, done) {
  const T = TALK[id];
  talk = { id, T, h, done, msgs: [], best: 0, mood: 'wary', reveals: [], over: false, waiting: false, failed: false };
  sheet = 'talk';
  const el = $('sheet');
  el.innerHTML = `<div class="card talk" style="--c:${T.col}">
    <div class="sh-head"><img class="pt" src="${portrait(T.who)}" alt=""><div><h2>${esc(T.name)}</h2><div class="muted tmood"></div></div></div>

      ${window.SpeechRecognition || window.webkitSpeechRecognition ? '<button class="pill tmic" title="Mluvit">🎤</button>' : ''}
      <button class="ch tsend">➤</button></div>
    <div class="btns"><span class="muted tleft"></span><button class="ch go tend">🎲 ${L('Rozhodnout kostkou', 'Let the dice decide')}</button></div>
  </div>`;
  el.hidden = false;
  talkLine('npc', T.open, true);
  talkState();
  const input = el.querySelector('.tin');
  el.querySelector('.tsend').onclick = () => talkSend();
  input.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); talkSend(); } };
  el.querySelector('.tend').onclick = () => endTalk();

  else if (k === 'spell') s.tone([400, 1200, 800], 0.35, { vol: 0.06, type: 'triangle' });
  else if (k === 'coin') { s.tone(988, 0.06, { vol: 0.06 }); s.tone(1319, 0.1, { vol: 0.06, delay: 0.07 }); }
  else if (k === 'fight') s.tone([220, 330, 220], 0.3, { vol: 0.08, type: 'sawtooth' });
  else if (k === 'win') [523, 659, 784, 1047].forEach((fq, i) => s.tone(fq, 0.18, { vol: 0.06, delay: i * 0.1, type: 'triangle' }));
  else if (k === 'lose') [392, 330, 262, 196].forEach((fq, i) => s.tone(fq, 0.3, { vol: 0.07, delay: i * 0.25, type: 'triangle' }));
  else if (k === 'bell' || k === 'bellFar') {               // a bronze bell: a low hum and its overtones, dying away slowly
    const v = k === 'bell' ? 1 : 0.35;
    [[98, 5, 0.11], [196, 4, 0.08], [235, 3.4, 0.06], [294, 2.8, 0.05], [392, 2.2, 0.04], [522, 1.6, 0.025]].forEach(([fq, d, vol]) => s.tone(fq, d, { vol: vol * v, type: 'sine' }));

  else if (k === 'owl') { s.tone([420, 380], 0.35, { vol: 0.05, type: 'sine' }); s.tone([400, 360], 0.6, { vol: 0.05, type: 'sine', delay: 0.5 }); }
  else if (k === 'squeak') s.tone([1800, 2600, 1500], 0.14, { vol: 0.035, type: 'triangle' });
  else if (k === 'bones') for (let i = 0; i < 5; i++) s.noise(0.04, { vol: 0.08, filter: 'highpass', freq: 2200 + i * 300, delay: i * 0.07 + Math.random() * 0.04 });
  else if (k === 'step') s.noise(0.05, { vol: 0.05, freq: 300 });
  else if (k === 'groan') s.tone([110, 90, 70], 0.6, { vol: 0.05, type: 'sawtooth' });

}

  let tile = null;
  if (!u) {
    const A = arena(), pl = new THREE.Plane(V(0, 1, 0), -A.y), p = V();
    if (ray.ray.intersectPlane(pl, p)) { tile = [Math.round(p.x - A.cx + (A.w - 1) / 2), Math.round(p.z - A.cz + (A.d - 1) / 2)]; u = unitAt(tile); }
  }
  const h = F.actor, hu = unitOf(h);
  if (!tile) { const A = arena(), pl = new THREE.Plane(V(0, 1, 0), -A.y), p = V(); if (ray.ray.intersectPlane(pl, p)) tile = [Math.round(p.x - A.cx + (A.w - 1) / 2), Math.round(p.z - A.cz + (A.d - 1) / 2)]; }
  if (u && !(F.target && F.target.ok(u.ref)) && u !== hu && tile && !unitAt(tile)) u = null;
  if (u && F.target && F.target.ok(u.ref) && (F.target.kind === 'foe' ? !G.heroes.includes(u.ref) : G.heroes.includes(u.ref))) { const fn = F.target.fn; doChoice(() => fn(u.ref)); return; }
  if (u === hu) { sfx('click'); doChoice(() => heroMenu(h)); return; }
  if (tile && !u && F.menuTop && !F.moved) {
    const m = reach(hu), v = m.get(key(tile));
    if (v) { const path = pathFrom(m, tile); doChoice(() => { walk(hu, path); F.moved = true; then(() => { focusOn(hu); heroMenu(h); }); }); }
  }
}
window.addEventListener('keydown', e => {
  PX.Sound.unlock();
  if (e.target && e.target.tagName === 'INPUT') return;
  if (state === 'intro') { if (['Space', 'Enter', 'Escape'].includes(e.code)) { e.preventDefault(); endIntro(); } return; }
  if (state === 'play' && G) {
    if (e.code === 'Escape') { if (sheet === 'talk') return; if (sheet) closeSheet(); else if (menu) closeMenu(); else openMenu(); return; }
    if (sheet || menu) return;
    if (film && (e.code === 'Space' || e.code === 'Enter' || e.code === 'Escape')) { e.preventDefault(); endFilm(); return; }
    if (/^(Digit|Numpad)[1-9]$/.test(e.code)) { choose1(+e.code.slice(-1) - 1); return; }
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if (cur && cur.k === 'wait') tapped = true; else if (busy()) skip = true; return; }
  }
});

/* --- 15. MAIN LOOP ---------------------------------------------------------------------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000), t = now / 1000; last = now;
  checkLayout();
  if (shownRect && ['x', 'y', 'w', 'h'].some(p => Math.abs(shownRect[p] - viewRect[p]) > 0.5)) applyView(1 - Math.exp(-dt * 8));
  if (state === 'play' && G) {
    if (!menu && !sheet) pump(dt);
    if (G) {
      renderParty(); renderInv(); renderChoices(); renderBanner(); renderDie(dt); refreshMarks();
    }
  }
  if (state === 'intro') stepIntro(dt);
  if (state === 'map') updateMapLabels();
  updateWorld(dt, t);
  Music.update();
  updateCamera(dt, t);
  if (renderer) renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
resize3d();
setState('title');
requestAnimationFrame(frame);
// for the tests: jump into the adventure (a party of n, in a scene), without films
window.PQ = {
  quick(nh = 4, room = 'inn', films = false) {
    skipFilms = !films; newSetup(); party.size = nh;
    for (const h of party) { h.vals = [16, 15, 14, 13, 12, 11]; setClass(h, h.cls); }
    startGame(); startMission(missionOf('bell')); if (room !== 'inn') { Q.length = 0; cur = null; G.room = null; clearText(); go(room); }
  },
  introShot(i) { playIntro(() => setState('title')); intro.i = i - 1; },
  get G() { return G; }, get F() { return F; }, get music() { return Music.id; }, get intro() { return intro ? [intro.i, film ? film.t : 0] : null; }, get state() { return state; }, get busy() { return busy(); }, get film() { return !!film; },
  choices: () => choices.map(c => c.label), choose: i => choose1(i), skip: () => { skip = true; if (film) endFilm(); if (cur && cur.k === 'wait') tapped = true; },
  units: () => units.map(u => ({ name: u.ref.name, tile: u.tile, pose: u.pose })), tap: tapWorld, toScreen: (x, y, z) => toScreen(V(x, y, z)),
  tileScreen: t => toScreen(tileWorld(t)),
};
// TESTING A SCENE: adad?scena=bell (or ?scene=) starts a throwaway party of 4 straight in that scene of the Drowned
// Bell, without films. A test game is never saved, so the real campaign stays as it was. Scenes: inn, hill, nave,
// altar, crypt, door, ossuary, bell, pool, end.
{
  const sc = new URLSearchParams(location.search).get('scena') || new URLSearchParams(location.search).get('scene');
  if (sc && ROOMS[sc]) {
    const keep = localStorage.getItem(GAME_KEY);
    PQ.quick(4, sc);
    G.test = true;
    try { if (keep === null) localStorage.removeItem(GAME_KEY); else localStorage.setItem(GAME_KEY, keep); } catch (e) { /* private mode */ }
    if (sc === 'bell' || sc === 'pool') { G.f.rumour = 2; }
    say(L('(Zkušební hra: nic se neukládá.)', '(A test game: nothing is saved.)'), '#c8b8ff');
  }
}
