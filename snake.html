<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Pixel Snake: eat apples, grow longer, don't bite yourself. 20 levels in 4 worlds with walls, mazes, portals and rolling boulders, 3 stars each, a workshop, skins and ENDLESS.">
<meta name="theme-color" content="#0d0b13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Pixel Snake</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #12200e; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #screen { position: fixed; left: 0; top: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<script src="common.js"></script>
<script>
'use strict';
/* ==========================================================================
   PIXEL SNAKE (part of the PIXEL ARCADE).
   Steer the snake (arrows, WASD, swipe, or a controller), eat apples, grow
   longer, don't hit a wall or yourself.
     LEVELS: 4 worlds x 5 levels. Eat the apples the level asks for. Stars:
       1 for finishing, 1 for all 3 coins, 1 for beating the time.
       World 2 has mazes, world 3 portals, world 4 rolling boulders.
     WORKSHOP: stars buy upgrades that stay (shields, slow-mo, magnet, ...).
     ENDLESS: no walls (you come out on the other side), faster and faster.
     SKINS: coins buy new snakes.
     1. Setup   2. Levels   3. The game   4. Drawing   5. Screens   6. Sound   7. Input   8. Main loop
   ========================================================================== */

/* --- 1. SETUP --------------------------------------------------------------- */
const VERSION = '1.0.0';
const SAVE_KEY = 'pixelSnake.save';
const NEW_SAVE = () => ({ stars: {}, times: {}, spent: 0, shop: {}, coins: 0, skin: 'green', skins: { green: 1 }, best: 0, sfx: true, music: true, played: 0 });
let save = NEW_SAVE();
try { save = Object.assign(NEW_SAVE(), JSON.parse(localStorage.getItem(SAVE_KEY)) || {}); } catch (e) { /* new player */ }
const store = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* private mode */ } };
const profile = PX.Profile.get();
const canvas = document.getElementById('screen');
const S = PX.makeScreen(canvas, { H: 240, minW: 400, maxW: 560 });
const ctx = S.ctx, H = S.H;
const UI = PX.makeUI(S, canvas);
const T = (str, x, y, color = '#fff', size = 1, align = 'left', shadow = null) => PX.drawText(ctx, str, x, y, color, size, align, shadow);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const OUT = '#0b0614';

const C = 10, COLS = 38, ROWS = 20;            // the field: 38 x 20 cells of 10 px
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const WORLDS = [
  { name: 'GARDEN', g1: '#5aa83a', g2: '#52a034', wall: '#8a5a32', wallHi: '#b07a44', speed: 0.13 },
  { name: 'MAZE', g1: '#4a8a6a', g2: '#428262', wall: '#5a5a6a', wallHi: '#8a8a9a', speed: 0.12 },
  { name: 'PORTALS', g1: '#4a4a8a', g2: '#424282', wall: '#2a2a5a', wallHi: '#6a6ab0', speed: 0.115 },
  { name: 'BOULDERS', g1: '#a8884a', g2: '#a08042', wall: '#6a4a2a', wallHi: '#9a6a3a', speed: 0.11 },
];
const LPW = 5;
// the workshop: [id, name, what, max, star price per level]
const SHOP = [
  ['shield', 'SHIELD', 'SURVIVE A CRASH (+1 A LEVEL)', 3, [2, 4, 6]],
  ['slow', 'CALM', 'THE SNAKE STARTS SLOWER', 2, [3, 5]],
  ['slowmo', 'SLOW-MO', 'HOLD SPACE (OR THE BUTTON) TO SLOW TIME', 1, [5]],
  ['magnet', 'MAGNET', 'EAT APPLES NEXT TO YOUR HEAD', 1, [6]],
  ['lucky', 'LUCKY', 'MORE GOLDEN APPLES AND POWER-UPS', 2, [3, 5]],
];
const shopL = id => save.shop[id] | 0;
const starsAll = () => Object.values(save.stars).reduce((a, b) => a + (b | 0), 0);
const starsFree = () => starsAll() - save.spent;
const SKINS = [
  { id: 'green', name: 'GREEN', price: 0, a: '#5ad43f', b: '#3aa82a' },
  { id: 'blue', name: 'BLUE', price: 100, a: '#4ab0ff', b: '#2a7fd4' },
  { id: 'coral', name: 'CORAL', price: 150, a: '#ff6a5a', b: '#d84a3a' },
  { id: 'zebra', name: 'ZEBRA', price: 250, a: '#f0f0f0', b: '#2a2a34' },
  { id: 'gold', name: 'GOLD', price: 400, a: '#ffd23f', b: '#e0a020' },
  { id: 'night', name: 'NIGHT', price: 500, a: '#7a3fc4', b: '#3a1a6a' },
  { id: 'fire', name: 'FIRE', price: 700, a: '#ffb02a', b: '#ff4a2a' },
  { id: 'rainbow', name: 'RAINBOW', price: 1200, rainbow: true },
];
const skinOf = id => SKINS.find(s => s.id === id) || SKINS[0];

/* --- 2. LEVELS: walls drawn from patterns, then portals and boulders ------------------------------- */
function levelOf(w, li) {
  const walls = new Set(), add = (x, y) => { if (x >= 0 && x < COLS && y >= 0 && y < ROWS) walls.add(x + ',' + y); };
  const hline = (x0, x1, y) => { for (let x = x0; x <= x1; x++) add(x, y); }, vline = (x, y0, y1) => { for (let y = y0; y <= y1; y++) add(x, y); };
  const border = gaps => { hline(0, COLS - 1, 0); hline(0, COLS - 1, ROWS - 1); vline(0, 0, ROWS - 1); vline(COLS - 1, 0, ROWS - 1); if (gaps) for (const [x, y] of gaps) walls.delete(x + ',' + y); };
  const k = w * LPW + li, P = [];
  border(k === 1 ? [[0, 9], [0, 10], [COLS - 1, 9], [COLS - 1, 10], [18, 0], [19, 0], [18, ROWS - 1], [19, ROWS - 1]] : null);
  const pattern = [
    () => {},                                                        // 1-1 just the border
    () => {},                                                        // 1-2 gaps: you come out on the other side
    () => { hline(8, 29, 6); hline(8, 29, 13); },                    // 1-3 two bars
    () => { hline(10, 27, 10); vline(19, 4, 15); },                  // 1-4 a cross
    () => { for (const [x, y] of [[5, 4], [28, 4], [5, 12], [28, 12]]) { hline(x, x + 4, y); vline(x, y, y + 3); } },   // 1-5 corners
    () => { for (let x = 6; x < COLS - 4; x += 6) vline(x, (x / 6) % 2 ? 1 : 5, (x / 6) % 2 ? ROWS - 6 : ROWS - 2); },   // 2-1 a comb
    () => { hline(6, 31, 4); hline(6, 31, 15); vline(6, 4, 8); vline(6, 11, 15); vline(31, 4, 8); vline(31, 11, 15); hline(12, 25, 9); hline(12, 25, 10); },   // 2-2 a ring
    () => { for (let x = 5; x < COLS - 3; x += 4) for (let y = 4; y < ROWS - 3; y += 4) { add(x, y); add(x + 1, y); add(x, y + 1); add(x + 1, y + 1); } },   // 2-3 pillars
    () => { for (let i = 0; i < 4; i++) { const y = 4 + i * 4; if (i % 2) hline(1, COLS - 9, y); else hline(8, COLS - 2, y); } },   // 2-4 zigzag
    () => { hline(4, 33, 3); vline(33, 3, 16); hline(4, 33, 16); vline(4, 7, 16); hline(4, 29, 7); vline(29, 7, 12); hline(9, 29, 12); },   // 2-5 a spiral
    () => { hline(8, 29, 9); hline(8, 29, 10); P.push([[4, 4], [33, 15]]); },
    () => { vline(12, 1, 18); vline(25, 1, 18); P.push([[6, 10], [18, 10]], [[19, 4], [31, 15]]); },
    () => { hline(1, 36, 7); hline(1, 36, 12); P.push([[18, 3], [3, 10]], [[18, 16], [34, 10]]); },
    () => { for (let x = 6; x < COLS - 4; x += 6) vline(x, 1, ROWS - 6); P.push([[3, 3], [33, 3]], [[15, 3], [27, 8]]); },
    () => { hline(4, 33, 4); hline(4, 33, 15); vline(4, 4, 15); vline(33, 4, 15); P.push([[2, 2], [18, 9]], [[35, 17], [19, 10]]); },
    () => { hline(10, 27, 10); },
    () => { hline(8, 29, 6); hline(8, 29, 13); },
    () => { vline(19, 1, 6); vline(19, 13, 18); P.push([[3, 3], [34, 16]]); },
    () => { for (let x = 6; x < COLS - 4; x += 8) vline(x, 1, 8); for (let x = 10; x < COLS - 4; x += 8) vline(x, 11, ROWS - 2); },
    () => { hline(4, 33, 9); P.push([[2, 2], [35, 17]], [[35, 2], [2, 17]]); },
  ][k]();
  // boulders roll along a row (world 4): back and forth between two walls
  const boulders = [];
  if (w === 3) {
    const rows = [[3], [16], [3, 16], [5, 14], [2, 12, 17]][li];
    rows.forEach((y, i) => boulders.push({ x: i % 2 ? COLS - 3 : 2, y, d: i % 2 ? -1 : 1, x0: 1, x1: COLS - 2 }));
  }
  const portals = P.map(([a, b], i) => ({ a, b, col: ['#ff6bd0', '#7af0ff', '#ffd23f'][i] }));
  for (const p of portals) { walls.delete(p.a.join(',')); walls.delete(p.b.join(',')); }
  const goal = 8 + li * 2 + w * 2;
  return { walls, portals, boulders, goal, par: Math.round(goal * 4 + 8 + (w === 1 ? li * 6 : 0)), speed: WORLDS[w].speed, w, li };
}

/* --- 3. THE GAME ------------------------------------------------------------------- */
let G = null;
function newGame(mode, w = 0, li = 0) {
  const L = mode === 'level' ? levelOf(w, li) : { walls: new Set(), portals: [], boulders: [], goal: Infinity, speed: 0.12, w: 0, li: 0, wrap: true };
  G = { mode, L, w, li, snake: [], dir: 'right', queue: [], grow: 3, acc: 0, t: 0, eaten: 0, coins: 0, levelCoins: [], food: null, gold: null, power: null, ghost: 0, slowT: 0, slowE: 1, shield: shopL('shield'),
    over: false, won: false, overT: 0, waitT: 0, pops: [], parts: [], shake: 0, score: 0, started: false, flash: 0, combo: 0, comboT: 0 };
  // start on a row with room to go: no walls, portals or boulders on the first cells
  const sx = 6, rowOk = y => { for (let x = 1; x <= 12; x++) if (L.walls.has(x + ',' + y) || L.portals.some(p => (p.a[0] === x && p.a[1] === y) || (p.b[0] === x && p.b[1] === y))) return false; return !L.boulders.some(b => b.y === y); };
  const sy = [10, 9, 11, 8, 12, 2, 17, 5, 14].find(rowOk) || 10;
  for (let i = 0; i < 3; i++) G.snake.push({ x: sx - i, y: sy });
  if (mode === 'level') {                                   // the level's 3 coins, away from the start
    let n = 0, tries = 0;
    while (n < 3 && tries++ < 500) { const x = 4 + Math.floor(rnd(li * 7 + w * 31 + n * 13 + tries) * (COLS - 8)), y = 2 + Math.floor(rnd(li * 11 + w * 5 + n * 17 + tries * 3) * (ROWS - 4)); if (free(x, y) && Math.abs(x - sx) + Math.abs(y - sy) > 6 && !G.levelCoins.some(c => c.x === x && c.y === y)) { G.levelCoins.push({ x, y }); n++; } }
  }
  placeFood();
}
function rnd(i) { const s = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); }
function wallAt(x, y) { return G.L.walls.has(x + ',' + y); }
function free(x, y) {
  if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return false;
  if (wallAt(x, y)) return false;
  if (G.snake && G.snake.some(s => s.x === x && s.y === y)) return false;
  if (G.L.portals.some(p => (p.a[0] === x && p.a[1] === y) || (p.b[0] === x && p.b[1] === y))) return false;
  if (G.L.boulders.some(b => b.y === y)) return false;
  return true;
}
function randomFree() {
  for (let i = 0; i < 400; i++) {
    const x = Math.floor(Math.random() * COLS), y = Math.floor(Math.random() * ROWS), h = G.snake[0];
    if (free(x, y) && Math.abs(x - h.x) + Math.abs(y - h.y) > 3 && !(G.food && G.food.x === x && G.food.y === y)) return { x, y };
  }
  return null;
}
function placeFood() {
  G.food = randomFree();
  const luck = 1 + shopL('lucky') * 0.5;
  if (!G.gold && Math.random() < 0.12 * luck) { const p = randomFree(); if (p) G.gold = { ...p, t: 8 }; }
  if (!G.power && Math.random() < 0.1 * luck) { const p = randomFree(); if (p) G.power = { ...p, t: 10, k: ['ghost', 'shrink', 'slow'][Math.floor(Math.random() * 3)] }; }
}
function tickTime() {                               // the snake speeds up as it grows
  const base = G.L.speed + shopL('slow') * 0.012, len = G.snake.length;
  let t = Math.max(0.055, base - len * (G.mode === 'endless' ? 0.0018 : 0.0012));
  if (G.slowT > 0) t *= 1.8;
  if (G.slowing) t *= 1.9;
  return t;
}
function turn(d) {
  if (!G || G.over) return;
  G.started = true;
  const last = G.queue.length ? G.queue[G.queue.length - 1] : G.dir, [dx, dy] = DIRS[d], [lx, ly] = DIRS[last];
  if (d === last || (dx === -lx && dy === -ly) || G.queue.length >= 2) return;
  G.queue.push(d);
}
function step() {
  if (G.queue.length) G.dir = G.queue.shift();
  const [dx, dy] = DIRS[G.dir], h = G.snake[0];
  let nx = h.x + dx, ny = h.y + dy;
  if (G.L.wrap || G.ghost > 0) { nx = (nx + COLS) % COLS; ny = (ny + ROWS) % ROWS; }
  else if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) { nx = (nx + COLS) % COLS; ny = (ny + ROWS) % ROWS; }   // a gap in the border
  for (const p of G.L.portals) {                     // a portal: come out of its twin, same direction
    if (p.a[0] === nx && p.a[1] === ny) { nx = p.b[0] + dx; ny = p.b[1] + dy; sfx('portal'); break; }
    if (p.b[0] === nx && p.b[1] === ny) { nx = p.a[0] + dx; ny = p.a[1] + dy; sfx('portal'); break; }
  }
  const tail = G.grow > 0 ? null : G.snake[G.snake.length - 1];
  const hitSelf = G.snake.some(s => s.x === nx && s.y === ny && s !== tail);
  const hitWall = wallAt(nx, ny), hitRock = G.L.boulders.some(b => b.x === nx && b.y === ny);
  if ((hitSelf || hitWall || hitRock) && G.ghost <= 0) {
    if (G.shield > 0 && G.waitT <= 0) { G.shield--; G.waitT = 0.9; G.flash = 0.3; pop(h.x, h.y, 'SHIELD!', '#7af0ff'); sfx('shield'); return; }
    if (G.waitT > 0) return;                         // wait a moment so you can turn away
    return crash();
  }
  G.snake.unshift({ x: nx, y: ny });
  if (G.grow > 0) G.grow--; else G.snake.pop();
  eatAt(nx, ny);
  if (shopL('magnet') && G.food && Math.abs(G.food.x - nx) + Math.abs(G.food.y - ny) === 1) eatAt(G.food.x, G.food.y, true);
}
function eatAt(x, y, magnet) {
  if (G.food && G.food.x === x && G.food.y === y) {
    G.eaten++; G.grow += 1; G.combo = G.comboT > 0 ? G.combo + 1 : 1; G.comboT = 2.5;
    const pts = G.combo >= 3 ? 2 : 1; G.score += pts;
    burst(x, y, '#ff4a4a'); pop(x, y, G.combo >= 3 ? 'COMBO +2' : magnet ? 'MAGNET!' : '+1', '#fff'); sfx('eat');
    if (G.mode === 'level' && G.eaten >= G.L.goal) return win();
    placeFood();
  }
  if (G.gold && G.gold.x === x && G.gold.y === y) { G.score += 5; G.eaten += G.mode === 'level' ? 2 : 0; G.coins += 3; G.grow += 2; burst(x, y, '#ffd23f'); pop(x, y, '+5', '#ffd23f'); sfx('gold'); G.gold = null; if (G.mode === 'level' && G.eaten >= G.L.goal) return win(); }
  if (G.power && G.power.x === x && G.power.y === y) {
    const k = G.power.k; G.power = null; sfx('power');
    if (k === 'ghost') { G.ghost = 5; pop(x, y, 'GHOST: THROUGH WALLS!', '#c8b8ff'); }
    else if (k === 'shrink') { const cut = Math.min(G.snake.length - 3, Math.floor(G.snake.length / 3)); G.snake.length -= cut; pop(x, y, 'SHRINK!', '#5ad43f'); }
    else { G.slowT = 6; pop(x, y, 'SLOW!', '#4ab0ff'); }
  }
  const ci = G.levelCoins.findIndex(c => c.x === x && c.y === y);
  if (ci >= 0) { G.levelCoins.splice(ci, 1); G.coins += 5; G.gotCoins = (G.gotCoins || 0) + 1; burst(x, y, '#ffd23f'); pop(x, y, 'COIN ' + G.gotCoins + '/3', '#ffd23f'); sfx('coin'); }
}
function crash() {
  G.over = true; G.won = false; G.overT = 0; G.shake = 8; sfx('crash');
  for (const s of G.snake.slice(0, 12)) burst(s.x, s.y, skinCol(skinOf(save.skin), 0, 0));
  finish();
}
function win() { G.over = true; G.won = true; G.overT = 0; sfx('win'); finish(); }
function finish() {                                 // stars, coins, records
  save.played++;
  if (G.mode === 'level') {
    const key = G.w + '-' + G.li;
    G.got = G.won ? [true, (G.gotCoins || 0) >= 3, G.t <= G.L.par] : [false, false, false];
    const n = G.got.filter(Boolean).length, before = save.stars[key] | 0;
    G.newStars = Math.max(0, n - before);
    if (n > before) save.stars[key] = n;
    if (G.won && (!save.times[key] || G.t < save.times[key])) { save.times[key] = Math.round(G.t * 10) / 10; G.bestTime = true; }
    if (G.newStars) PX.Wallet.add(G.newStars);
  } else {
    G.newBest = G.score > save.best; if (G.newBest) save.best = G.score;
    G.arcadeStars = Math.floor(G.score / 30); if (G.arcadeStars) PX.Wallet.add(G.arcadeStars);
    G.coins += Math.floor(G.score / 2);
  }
  save.coins += G.coins;
  store();
}
function pop(x, y, txt, col) { G.pops.push({ x, y, txt, col, t: 0 }); }
function burst(x, y, col) { for (let i = 0; i < 8; i++) { const a = Math.random() * 6.28, v = 30 + Math.random() * 50; G.parts.push({ x: x * C + 5, y: y * C + 5, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, col }); } }
function update(dt) {
  for (const q of G.parts) { q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; } G.parts = G.parts.filter(q => q.t < 0.5);
  for (const q of G.pops) q.t += dt; G.pops = G.pops.filter(q => q.t < 1);
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 25);
  if (G.flash > 0) G.flash -= dt;
  if (G.over) { G.overT += dt; return; }
  if (!G.started) return;
  G.t += dt;
  if (G.ghost > 0) G.ghost -= dt; if (G.slowT > 0) G.slowT -= dt; if (G.waitT > 0) G.waitT -= dt; if (G.comboT > 0) G.comboT -= dt;
  if (G.gold && (G.gold.t -= dt) <= 0) G.gold = null;
  if (G.power && (G.power.t -= dt) <= 0) G.power = null;
  if (shopL('slowmo')) { if (G.slowing && G.slowE > 0) G.slowE = Math.max(0, G.slowE - dt / 3); else if (!G.slowing) G.slowE = Math.min(1, G.slowE + dt / 8); if (G.slowE <= 0) G.slowing = false; }
  G.acc += dt;
  const tt = tickTime();
  while (G.acc >= tt && !G.over) {
    G.acc -= tt; G.ticks = (G.ticks || 0) + 1;
    if (G.ticks % 2 === 0) for (const b of G.L.boulders) {    // boulders roll one cell every other step
      let nx = b.x + b.d; if (nx < b.x0 || nx > b.x1 || wallAt(nx, b.y)) { b.d = -b.d; nx = b.x + b.d; }
      b.x = nx;
      if (G.snake[0].x === b.x && G.snake[0].y === b.y && G.ghost <= 0) { if (G.shield > 0) { G.shield--; G.flash = 0.3; pop(b.x, b.y, 'SHIELD!', '#7af0ff'); sfx('shield'); } else crash(); }
    }
    if (!G.over) step();
  }
}

/* --- 4. DRAWING ----------------------------------------------------------------------- */
let FX = 10, FY = 22;
const skinCol = (sk, i, t) => (sk.rainbow ? `hsl(${Math.round((i * 18 + t * 120) % 360)},90%,60%)` : i % 2 ? sk.b : sk.a);
function drawField(t) {
  const W = S.W, wd = WORLDS[G.L.w];
  FX = Math.round((W - COLS * C) / 2); FY = 22;
  const sh = G.shake ? Math.round((Math.random() - 0.5) * G.shake) : 0;
  ctx.save(); ctx.translate(sh, sh);
  ctx.fillStyle = OUT; ctx.fillRect(FX - 2, FY - 2, COLS * C + 4, ROWS * C + 4);
  const g1 = G.mode === 'endless' ? '#3a6a8a' : wd.g1, g2 = G.mode === 'endless' ? '#346282' : wd.g2;
  for (let x = 0; x < COLS; x++) for (let y = 0; y < ROWS; y++) { ctx.fillStyle = (x + y) & 1 ? g1 : g2; ctx.fillRect(FX + x * C, FY + y * C, C, C); }

  if (UI.button('resume', x + 25, y + 38, 150, 22, 'RESUME', { accent: '#5ad43f' }) || UI.back) setPause(false);
  if (UI.button('quit', x + 25, y + 66, 150, 22, 'MENU', { size: 1 })) { paused = false; state = G.mode === 'level' ? 'levels' : 'title'; G = null; }
}
function start(mode, w = 0, li = 0) { newGame(mode, w, li); state = 'play'; paused = false; Music.reset(); }
function setPause(v) { if (state !== 'play' || !G || G.over) return; paused = v; if (G) G.slowing = false; }

/* --- 6. SOUND --------------------------------------------------------------------- */
function sfx(k) {
  if (!save.sfx) return;
  const s = PX.Sound;
  if (k === 'click') s.tone([523, 784], 0.1, { vol: 0.1 });
  else if (k === 'eat') s.tone([440 + (G ? Math.min(G.combo, 8) * 60 : 0), 880 + (G ? Math.min(G.combo, 8) * 80 : 0)], 0.08, { vol: 0.09 });
  else if (k === 'gold') [880, 1175, 1568].forEach((f, i) => s.tone(f, 0.08, { vol: 0.08, delay: i * 0.05 }));
  else if (k === 'coin') s.tone([1320, 1760], 0.08, { vol: 0.08 });
  else if (k === 'power') s.tone([300, 1200], 0.25, { vol: 0.08, type: 'triangle' });
  else if (k === 'portal') s.tone([900, 300, 900], 0.15, { vol: 0.06, type: 'sine' });
  else if (k === 'shield') s.tone([1200, 600], 0.2, { vol: 0.09, type: 'triangle' });
  else if (k === 'crash') { s.noise(0.3, { freq: 500, vol: 0.2 }); s.tone([300, 80], 0.4, { vol: 0.1, type: 'sawtooth' }); }
  else if (k === 'win') [523, 659, 784, 1047].forEach((f, i) => s.tone(f, 0.15, { vol: 0.1, delay: i * 0.09 }));
  else if (k === 'star') s.tone([988, 1976], 0.15, { vol: 0.09 });
  else if (k === 'buy') [784, 988, 1319].forEach((f, i) => s.tone(f, 0.1, { vol: 0.09, delay: i * 0.07 }));
  else if (k === 'no') s.tone([220, 160], 0.15, { vol: 0.08 });
}
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
const Music = {                                    // a light bouncy loop
  next: 0, step: 0, reset() { this.next = 0; this.step = 0; },
  tick() {
    const c = PX.Sound.ctx;
    if (!c || !save.music || !save.sfx || state !== 'play' || paused || !G || G.over || !G.started) { this.next = 0; return; }
    const sp = 60 / 128 / 2, mel = [72, 0, 76, 0, 79, 76, 0, 72, 74, 0, 77, 0, 81, 77, 0, 74, 72, 0, 76, 79, 84, 0, 79, 76, 74, 0, 71, 0, 67, 0, 0, 0], bass = [48, 53, 48, 43];
    if (!this.next || this.next < c.currentTime) this.next = c.currentTime + 0.05;
    while (this.next < c.currentTime + 0.2) {
      const i = this.step++ % 32, d = this.next - c.currentTime;
      if (mel[i]) PX.Sound.tone(midi(mel[i]), sp * 0.7, { vol: 0.02, delay: d, type: 'triangle' });
      if (i % 4 === 0) PX.Sound.tone(midi(bass[(i >> 3) % 4]), sp * 2.5, { vol: 0.04, type: 'triangle', delay: d });
      this.next += sp;
    }
  },
};

/* --- 7. INPUT: keys, swipes, a controller ------------------------------------------------------ */
const KEYDIR = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
let swipe = null;
UI.onDown = (e, x, y) => {
  PX.Sound.unlock();
  if (e.pointerType !== 'mouse') touchUsed = true;
  if (state !== 'play' || paused || !G || G.over) return;
  if (UI.downId === 'slowbtn') { G.slowing = G.slowE > 0.05; return; }
  if (UI.downId !== null) return;
  swipe = { id: e.pointerId, x, y };
};
UI.onMove = (e, x, y) => {
  if (!swipe || swipe.id !== e.pointerId || !G) return;
  const dx = x - swipe.x, dy = y - swipe.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) > 10) { turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up')); swipe.x = x; swipe.y = y; }
};
UI.onUp = e => { if (swipe && swipe.id === e.pointerId) swipe = null; if (G) G.slowing = false; };
window.addEventListener('keydown', e => {
  PX.Sound.unlock();
  if (state === 'play' && G && !paused && !G.over && KEYDIR[e.code]) { e.preventDefault(); turn(KEYDIR[e.code]); return; }
  if (state === 'play' && G && !paused && !G.over && e.code === 'Space' && shopL('slowmo')) { e.preventDefault(); G.slowing = G.slowE > 0.05; return; }
  if (state === 'play' && G && G.over && G.overT > 1 && e.code === 'Enter') { G.mode === 'level' ? start('level', G.w, G.li) : start('endless'); return; }
  if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'play' && G && !G.over) setPause(!paused);
  else if (e.code === 'Escape') UI.back = true;
});
window.addEventListener('keyup', e => { if (e.code === 'Space' && G) G.slowing = false; });
window.addEventListener('blur', () => setPause(true));
document.addEventListener('visibilitychange', () => { if (document.hidden) setPause(true); });

/* --- 8. MAIN LOOP ----------------------------------------------------------------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000), t = now / 1000; last = now;
  UI.begin();
  ctx.fillStyle = '#12200e'; ctx.fillRect(0, 0, S.W, H);
  if (state === 'title') drawTitle(t, dt);
  else if (state === 'levels') drawLevels(t, dt);
  else if (state === 'shop') drawShop(t, dt);
  else if (G) {
    if (!paused) update(dt);
    drawField(t);
    if (G) { drawHUD(t); if (G.over) drawOver(t); else if (paused) drawPause(); }
  }
  if (msg) { T(msg.txt, S.W / 2, H - 14, '#ff8a8a', 1, 'center', '#000'); if ((msg.t -= dt) <= 0) msg = null; }
  UI.end();
  S.blit('#12200e');
  Music.tick();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => { /* offline mode unavailable */ }));
}
PX.Pad.setup({
  title: 'Pixel Snake: controller', ui: UI, menu: () => state !== 'play' || paused || !G || G.over,
  phone: { stick: 'STEER', dpad: true, buttons: [['A', 'SLOW-MO']] },
  keys: () => ({ up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight', A: 'Space', START: 'KeyP' }),
  help: [['STICK|D-PAD', 'STEER THE SNAKE'], ['A', 'SLOW-MO (FROM THE WORKSHOP)'], ['START', 'PAUSE'], ['A', 'MENUS: OK'], ['B', 'MENUS: BACK']],
});
</script>
